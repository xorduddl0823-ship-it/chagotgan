<style>
/* ===== 차곳간 워시 디자인 그대로 ===== */
/* 표 안 숫자 자리 맞추기 · 늘고 줆 색 (UI 1.0) */
td.num{font-variant-numeric:tabular-nums}
td.num .nn{font-variant-numeric:tabular-nums}
td.num .nn em{font-style:normal;font-weight:700;font-size:11.5px;color:var(--muted);margin-left:1px}
td.num .b{display:inline-block;min-width:64px;margin:0 0 0 9px;text-align:right;
  font-size:11.5px;font-weight:800;color:var(--muted);vertical-align:baseline}
td.num .b.up{color:var(--good)}
td.num .b.dn{color:var(--danger)}
td.num .b.same{color:var(--muted)}
/* 차곳간 공통 UI 1.0 — 한글은 낱말 중간에서 자르지 않습니다 */
body,.card,.sheet,.askbox,.banner,th,td,.hint,.empty{word-break:keep-all;overflow-wrap:break-word}
/* (옛 통일 규칙은 맨 끝 cgg-ui 블록으로 옮겼습니다) */

.who .mypglb{font-weight:800;font-size:12px;white-space:nowrap}
.card h2{min-height:26px;align-items:center}

:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4f6f9;--surface:#fff;--surface2:#f0f3f7;--line:#dde3ec;--text:#14202e;--muted:#667389;
  --brand:#1668C4;--brand-soft:#E7F2FC;--accent:#0B2545;--sky:#8FC9F2;
  --good:#127a4b;--good-soft:#e2f5ec;--warn:#9a4b06;--warn-soft:#fdeede;--danger:#b3261e;--danger-soft:#fdeceb;
  --pay:#0B2545;--pay-soft:#EAF1F9;--pay-ink:#fff;   /* 입금 알림 — 차곳간 남색 */
  --shadow:0 2px 10px rgba(16,32,52,.08);--r:14px;
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e141c;--surface:#161e28;--surface2:#1d2733;--line:#2b3644;--text:#e8edf4;--muted:#95a3b6;
  --brand:#5FA8E8;--brand-soft:#102B47;--accent:#8FC9F2;--sky:#8FC9F2;--good:#4ad48f;--good-soft:#12312a;
  --warn:#f0a95e;--warn-soft:#332412;--danger:#ff8b82;--danger-soft:#331614;--shadow:0 2px 10px rgba(0,0,0,.4);
  --pay:#8FC9F2;--pay-soft:#102B47;--pay-ink:#0B2545;
}}
:root[data-theme="dark"]{--bg:#0e141c;--surface:#161e28;--surface2:#1d2733;--line:#2b3644;--text:#e8edf4;
  --muted:#95a3b6;--brand:#5FA8E8;--brand-soft:#102B47;--accent:#8FC9F2;--sky:#8FC9F2;--good:#4ad48f;--good-soft:#12312a;
  --warn:#f0a95e;--warn-soft:#332412;--danger:#ff8b82;--danger-soft:#331614;--shadow:0 2px 10px rgba(0,0,0,.4);
  --pay:#8FC9F2;--pay-soft:#102B47;--pay-ink:#0B2545;}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:960px;margin:0 auto;padding:0 14px 90px}
.wrap.pc{max-width:1280px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);
  border-bottom:1px solid var(--line);margin:0 -14px 26px;padding:11px 14px}
.brandrow{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,var(--brand),var(--accent));
  display:grid;place-items:center;color:#fff;font-weight:900;font-size:14px;flex:none;overflow:hidden}
.logo.hasimg{background:none}
.logo.ci{background:linear-gradient(140deg,#1668C4,#0B2545);padding:5px}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.logo.sq img{object-fit:cover}
h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.02em}
.sub{font-size:12px;color:var(--muted);margin-top:1px}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.who{font-size:12px;color:var(--muted);text-align:right;line-height:1.3}
/* 제목 옆 업체 이름 (설정 → 세금계산서 공급자 상호) */
.bizname{display:flex;flex-direction:column;justify-content:center;margin-left:14px;padding:4px 0 4px 14px;
  border-left:3px solid var(--brand);min-width:0}
.bizname{flex:0 0 auto;max-width:46%}
.wrap.pc:not(.side) .hdr-right{flex:1 1 0;min-width:0}
.bizname b{font-size:27px;font-weight:900;color:var(--text);letter-spacing:-.01em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
  -webkit-text-stroke:.6px currentColor;paint-order:stroke fill}
.bizname small{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:1px;white-space:nowrap}
#pollSel{width:auto;flex:none;max-width:120px}
.brandrow > .logo + div{flex:none}
/* 위쪽 버튼 배치 바꾸기 */
.hitem{display:inline-flex}
#hdrBreak{flex-basis:100%;height:0;overflow:hidden;order:500;display:block}
#hdrBreak.gap{height:0;margin:0}
.arranging #hdrBreak{height:auto;border:2px dashed var(--accent);border-radius:9px;padding:6px 10px;text-align:center;
  font-size:12.5px;color:var(--brand);background:var(--brand-soft);margin:2px 0}
.arranging #hdrBreak.arr-over{background:var(--brand);color:#fff}
#hdrBreak>span{pointer-events:none}
.wrap:not(.pc) #hdrBreak{display:none}
.hsz-s{font-size:11px !important;padding:5px 7px !important}
.hsz-l{font-size:14px !important;padding:10px 14px !important}
.hsz-xl{font-size:16px !important;padding:13px 18px !important}
#pollWrap.hsz-s,#pollWrap.hsz-l,#pollWrap.hsz-xl{padding:0 !important}
#pollWrap.hsz-s select{font-size:11px;padding:4px 6px !important}
#pollWrap.hsz-l select{font-size:14px;padding:9px 10px !important}
#pollWrap.hsz-xl select{font-size:16px;padding:12px 12px !important}
#hWho.hsz-l b{font-size:15px}#hWho.hsz-xl b{font-size:17px}
.arranging [data-arr]{outline:2px dashed var(--accent);outline-offset:2px;cursor:grab;border-radius:9px}
.arranging [data-arr].arr-over{outline-color:var(--brand);background:var(--brand-soft)}
.arranging #pollSel{pointer-events:none}
.arranging #btnArrange{background:var(--brand);color:#fff;border-color:var(--brand)}
#arrBar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;background:#14202e;color:#fff;
  border-radius:14px;padding:10px 12px 10px 16px;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3);
  font-size:13.5px;max-width:calc(100vw - 24px);flex-wrap:wrap}
#arrBar button{border:0;border-radius:9px;padding:8px 12px;font-weight:800;cursor:pointer;font-family:inherit}
/* 좁은 화면에서 대표가 PC 화면을 볼 때도 상호명을 크게 보여줍니다 */
@media (max-width:759px){
  .wrap.pc > header .brandrow{align-items:center;flex-wrap:nowrap;gap:8px}
  .wrap.pc > header .brandrow > .logo + div{display:none}
  .wrap.pc > header .logo{width:30px;height:30px;font-size:12px;border-radius:9px}
  .wrap.pc .bizname{display:flex;margin-left:4px;padding:0 0 0 9px;border-left-width:3px;
    flex:1 1 60px;min-width:60px;max-width:none;overflow:hidden}
  .wrap.pc .bizname b{font-size:19px;line-height:1.2}
  .wrap.pc .bizname small{font-size:10px;opacity:.7;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;line-height:1.35}
  .wrap.pc > header{padding:10px 14px;margin:0 -14px 14px}
  .wrap.pc > header .hdr-right{flex:0 0 auto;gap:5px}
  .wrap.pc > header .mini{padding:6px 9px;font-size:11.5px}
  .wrap.pc .tabs{gap:4px}
  .wrap.pc .tabs button{padding:9px 11px;font-size:13px}
}
@media (min-width:760px) and (max-width:999px){.wrap.pc .bizname{display:none}}
/* ── 폰(현장) 머리말: 상호명을 크고 하얗게, 전체를 두 줄로 ── */
.wrap:not(.pc) > header .brandrow{align-items:flex-start;flex-wrap:nowrap;gap:8px}
.wrap:not(.pc) > header .brandrow > .logo + div{display:none}   /* '차곳간 워시' 줄은 상호 밑으로 옮겨 그립니다 */
.wrap:not(.pc) > header .bizname{display:flex;margin-left:6px;padding:0 0 0 8px;border-left-width:3px;
  flex:1 1 60px;min-width:60px;max-width:none;overflow:hidden}
.wrap:not(.pc) > header .bizname b{font-size:19px;font-weight:900;color:var(--text);-webkit-text-stroke:0;
  line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap:not(.pc) > header .bizname small{font-size:10px;opacity:.65;margin-top:2px;font-weight:600}
.wrap:not(.pc) > header .bizname.noname b{font-size:16px}
.who b{color:var(--text);font-size:13px}
.who .av{display:none;width:28px;height:28px;flex:0 0 auto;border-radius:50%;background:var(--brand);
  color:#fff;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.bizcard{display:contents}
#topBar,#topBand{display:none}
#topBand .tb-name small{display:block}
.mini{font-size:12px;font-weight:700;padding:7px 10px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface2);color:var(--text);cursor:pointer;font-family:inherit;white-space:nowrap}
.tabs{display:flex;gap:5px;margin-top:11px;background:var(--surface2);padding:4px;border-radius:12px;overflow-x:auto}
.tabs button{flex:1;min-width:max-content;border:0;background:transparent;color:var(--muted);font-family:inherit;
  font-size:14.5px;font-weight:700;padding:10px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--brand);box-shadow:var(--shadow)}

/* ── 메뉴 아이콘 (시안과 같은 선 아이콘) ───────────────── */

.wrap.pc.side #tabs button::before{content:""}

/* ── 대시보드 ─────────────────────────── */
.dash{display:grid;grid-template-columns:1.45fr 1fr;gap:14px;align-items:start}
@media (max-width:1100px){.dash{grid-template-columns:1fr}}
.dashhead{margin:0 0 14px}
.dashhead h2{font-size:26px;font-weight:900;margin:0;letter-spacing:-.02em}

.dh-row{display:flex;align-items:center;gap:8px;position:relative}
.calbtn{font-size:26px;line-height:1;display:inline-flex;align-items:center;justify-content:center;padding:6px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);color:var(--brand);cursor:pointer}
.calbtn:hover{background:var(--brand-soft)}
.mpop{position:absolute;top:calc(100% + 8px);left:0;z-index:40;width:300px;max-width:calc(100vw - 32px);background:var(--surface);

.mpop .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mpop .mh b{font-size:17px}
.mpop .mh button{border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:9px;width:38px;height:34px;font-size:18px;cursor:pointer}
.mpop .mg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mpop .mg button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:9px 0 6px;cursor:pointer;font-size:14.5px;font-weight:700}
.mpop .mg button small{display:block;font-size:10.5px;font-weight:600;color:var(--muted);min-height:14px}
.mpop .mg button.has small{color:var(--brand)}
.mpop .mg button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.mpop .mg button.on small{color:#fff}
.mpop .mg button.now{outline:2px solid var(--accent);outline-offset:-2px}
.mpop .mf{display:flex;gap:6px;margin-top:10px}
.mpop .mf button{flex:1;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:9px;padding:8px;font-weight:700;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.cal .hd{text-align:center;font-size:11.5px;color:var(--muted);font-weight:800;padding:2px 0}
.cal .d{min-height:78px;border:1px solid var(--line);border-radius:10px;padding:6px 7px;
  background:var(--surface2);cursor:pointer;overflow:hidden}
.cal .d.blank{border:0;background:transparent;cursor:default}
.cal .d:hover{border-color:var(--brand)}
.cal .d.today{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.cal .n{font-size:12px;font-weight:800;color:var(--muted)}
.cal .n.sun{color:var(--danger)}
.cal .amt{font-size:13.5px;font-weight:900;margin-top:5px;letter-spacing:-.02em}
.cal .cars{font-size:11px;color:var(--muted);margin-top:1px}
.cal .memo{font-size:11px;font-weight:700;color:#8a4a00;background:#fff1e0;border-radius:6px;padding:1px 5px;margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .memo.done{color:var(--muted);background:var(--surface2);text-decoration:line-through;font-weight:500}
.memorow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.memorow input[type=checkbox]{width:24px;height:24px;flex:none}
.memorow .mt{flex:1;min-width:0;font-size:15px;word-break:break-all}
.memorow.done .mt{color:var(--muted);text-decoration:line-through}
.memorow .mtime{font-weight:800;color:var(--brand);margin-right:6px}
.memorow small{color:var(--muted);font-size:11.5px}
.cal .bar{height:3px;border-radius:2px;background:var(--brand);margin-top:4px;opacity:.85}
.todo{display:grid;gap:8px}
.todo button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-family:inherit;
  background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--text)}
.todo button:hover{border-color:var(--brand)}
.todo .cnt{font-size:20px;font-weight:900;min-width:38px;text-align:center}
.todo .tx{flex:1}
.todo .tx b{display:block;font-size:14.5px;font-weight:800}
.todo .tx span{font-size:12px;color:var(--muted)}
.todo .go{color:var(--muted);font-size:18px}
/* 중요한 할 일 (자재 부족 · 청구서 · 세금계산서) */
.todo button.imp{background:#fdecec;border:2px solid #d93025;box-shadow:0 2px 10px rgba(217,48,37,.15)}
.todo button.imp .cnt{color:#c5221f !important;font-size:24px}
.todo button.imp .tx b{color:#a50e0e;font-size:15.5px}
.todo button.imp .tx span{color:#8c1d18;font-weight:600}
.todo button.imp .go{color:#c5221f}
.todo .imptag{display:inline-block;background:#d93025;color:#fff;font-size:11px;font-weight:900;border-radius:6px;
  padding:1px 7px;margin-right:6px;vertical-align:2px;animation:impblink 1.6s ease-in-out infinite}
@keyframes impblink{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.todo .imptag{animation:none}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .todo button.imp{background:#3a1512}
  :root:not([data-theme="light"]) .todo button.imp .tx b{color:#ffb4ab}:root:not([data-theme="light"]) .todo button.imp .tx span{color:#ffdad6}}
.prog{height:12px;border-radius:7px;background:var(--surface2);overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;background:var(--good)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend b{color:var(--text)}
.mini-row{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.mini-row:last-child{border-bottom:0}

.phone{border:10px solid #222c39;border-radius:26px;background:var(--surface);padding:0 0 14px;max-width:330px;margin:0 auto;overflow:hidden}
.phone-top{background:#222c39;color:#fff;text-align:center;font-size:12px;font-weight:700;padding:6px}
.phone-from{text-align:center;font-size:11px;color:var(--muted);padding:8px 0 6px}
.phone-msg{background:var(--surface2);border-radius:14px;margin:0 12px;padding:12px 13px;
  font-size:13px;white-space:pre-wrap;line-height:1.6;min-height:120px;word-break:break-all;overflow-wrap:anywhere}
#smsPrev,#billPrev,#bmPrev,#of_prev{word-break:break-all;overflow-wrap:anywhere}

.thumb{width:44px;height:34px;object-fit:cover;border-radius:6px;vertical-align:middle;border:1px solid var(--line)}
.photo2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.photo2 .pl{font-size:11.5px;font-weight:800;color:var(--muted);margin-bottom:4px}
.photo2 img{width:100%;height:150px;object-fit:cover;border-radius:10px;display:block}
.photo2 .noph{height:150px;border-radius:10px;background:var(--surface2);border:1px dashed var(--line);
  display:grid;place-items:center;color:var(--muted);font-size:12px}

.pgnums{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;align-items:center}
.pgnum{min-width:34px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);
  font-family:inherit;font-weight:700;font-size:13px;color:var(--text);cursor:pointer}
.pgnum:hover{border-color:var(--brand)}
.pgnum.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pgdots{color:var(--muted);padding:0 2px;font-size:13px}

/* 현장 화면 미리보기 (넓은 화면에서 폰처럼) */
@media (min-width:1000px){
  .wrap.fieldview{max-width:430px;margin:18px auto;padding-left:16px;padding-right:16px;
    border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 50px rgba(16,32,52,.16);
    background:var(--bg);overflow:hidden}
  .wrap.fieldview > header{margin:0 -16px 20px;border-radius:22px 22px 0 0}
  .fieldnote{position:fixed;left:50%;transform:translateX(-50%);top:8px;z-index:60;
    background:var(--brand);color:#fff;font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:999px;
    box-shadow:var(--shadow)}
}
.fieldnote{display:none}

.lyrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lycard{font-family:inherit;text-align:left;cursor:pointer;background:var(--surface);
  border:2px solid var(--line);border-radius:14px;padding:11px;display:block}
.lycard b{display:block;font-size:14px;margin-top:9px}
.lycard small{display:block;font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:3px}
.lycard[aria-selected="true"]{border-color:var(--brand);background:var(--brand-soft)}
.lyt{height:96px;border-radius:9px;background:#EEF2F7;border:1px solid var(--line);
  overflow:hidden;display:flex;flex-direction:column}
.lyt.sd2{flex-direction:row}
.lyt .hd{height:17px;background:#fff;border-bottom:1px solid #DCE4EE;display:flex;align-items:center;gap:3px;padding:0 5px}
.lyt .lg{width:9px;height:9px;border-radius:3px;background:var(--brand);flex:0 0 auto}
.lyt .nm{height:5px;width:34px;border-radius:3px;background:#B9C8DA}
.lyt .mt{height:13px;background:#fff;display:flex;gap:4px;align-items:center;padding:0 5px;border-bottom:1px solid #DCE4EE}
.lyt .mt .m{height:5px;width:16px;border-radius:3px;background:#C9D6E5}
.lyt .mt .m:first-child{background:var(--brand)}
.lyt .sb{width:30px;flex:0 0 auto;background:#fff;border-right:1px solid #DCE4EE;padding:5px 4px;
  display:flex;flex-direction:column;gap:4px;align-items:center}
.lyt .sb .bc{width:100%;height:11px;border-radius:3px;background:var(--brand-soft)}
.lyt .ms{width:100%;display:flex;flex-direction:column;gap:3px}
.lyt .ms .m{height:5px;width:100%;border-radius:3px;background:#C9D6E5}
.lyt .ms .m:first-child{background:var(--brand)}
.lyt .sb.nar{width:14px;background:#0B2545;border-right:0;padding:5px 3px}
.lyt .sb.nar .lg{background:#4E8FD8}
.lyt .ms.ic .m{height:6px;width:100%;background:#42587A;border-radius:2px}
.lyt .ms.ic .m:first-child{background:#fff}
.lyt .rt2{flex:1 1 auto;display:flex;flex-direction:column;min-width:0}
.lyt .bnd{height:14px;background:#fff;border-bottom:1px solid #DCE4EE}
.lyt .bdy{flex:1 1 auto;display:flex;gap:4px;padding:5px}
.lyt .bdy .c{flex:1 1 auto;border-radius:4px;background:#fff;border:1px solid #DCE4EE}
.lyt .bdy .c.s{flex:0 0 26px}
@media (max-width:640px){.lyrow{grid-template-columns:1fr}}
.fzrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fzrow .btn{font-weight:800}
.fzrow .btn[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:#fff}

/* ── 현장(폰) 머리말 · 아래 탭바 — 시안대로 ────────────── */
.wrap:not(.pc) > header{background:#0B2545;border-bottom:0;border-radius:0}
.wrap:not(.pc) > header .brandrow{align-items:center}
.wrap:not(.pc) > header .logo{background:rgba(255,255,255,.14)}
.wrap:not(.pc) > header .bizname{border-left:0;padding-left:0;margin-left:10px}
.wrap:not(.pc) > header .bizname b{color:#fff;font-size:18px;font-weight:800;-webkit-text-stroke:0}
.wrap:not(.pc) > header .bizname small{color:#B7C6DE;opacity:1;font-size:11.5px;display:flex;
  align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap:not(.pc) > header .bizname small .dot{width:7px;height:7px;border-radius:50%;background:#5BD6A4;flex:0 0 auto}
.fhcam .shot,.fhcam .top .cic{filter:none}
.fhcam .shot span,.fhcam .shot{font-size:21px}
.wrap:not(.pc) > header .mini{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.26);color:#fff}
.wrap:not(.pc) > header .who{color:#B7C6DE}
.wrap:not(.pc) > header .who b{color:#fff}
.wrap:not(.pc) > header #dbState{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.26);color:#9EE6C4}
/* 폰 탭은 머리말 바로 아래(위쪽)에 둡니다 */
.wrap:not(.pc) .tabs{background:rgba(255,255,255,.1);margin:8px 0 0;padding:3px;border-radius:11px}
.wrap:not(.pc) .tabs button{color:#B7C6DE;font-size:13.5px;padding:8px 6px}
.wrap:not(.pc) .tabs button[aria-selected="true"]{background:rgba(255,255,255,.16);color:#fff;box-shadow:none}
.wrap:not(.pc) .tabs button::before{display:none}
.wrap:not(.pc) #setSub{display:none}

/* ── 현장(모바일) 홈 ───────────────────────────── */
.fhbig{display:flex;gap:9px;margin-bottom:9px}
.fhbig button{flex:1;height:70px;border:0;border-radius:16px;color:#fff;cursor:pointer;
  font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  box-shadow:0 6px 18px rgba(11,37,69,.18);-webkit-tap-highlight-color:transparent}
.fhbig button:active{transform:translateY(1px)}
.fhbig .ic{font-size:19px;line-height:1}
.fhbig .tx{font-size:16px;font-weight:800;letter-spacing:-.02em}
.fhbig .fin{background:var(--accent)}
.fhbig .fout{background:var(--brand)}
.fhcam{border-radius:14px;background:#0F2537;padding:9px 11px 10px;margin-bottom:9px;

  display:flex;align-items:center;justify-content:center;font-size:12px}

.fhcam .row{display:flex;align-items:center;gap:12px}
.fhcam .plate{flex:1;min-width:0;height:44px;border-radius:10px;border:2px solid var(--sky);
  background:rgba(143,201,242,.12);display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:800;letter-spacing:.5px;color:#fff;text-align:center;padding:0 8px}
.fhcam .plate.wait{font-size:12.5px;font-weight:600;color:#9DB0C6;letter-spacing:0}
.fhcam .shot{width:44px;height:44px;flex:0 0 auto;border-radius:50%;border:3px solid rgba(255,255,255,.28);

.fhcam .shot:active{transform:scale(.96)}
.fhcam .sub{font-size:11px;color:#9DB0C6;line-height:1.4}
.fhcam .sub .ok{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:16px;
  background:rgba(22,104,196,.92);color:#fff;font-size:11.5px;font-weight:700;margin-right:6px}
.fhnums{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:7px 8px;margin-bottom:9px}
.fhnums > div{flex:1;text-align:center}
.fhnums > div span{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.fhnums > div b{display:block;font-size:19px;font-weight:800;margin-top:0}
.fhnums > i{width:1px;background:var(--line)}
.fhh2{display:flex;align-items:center;gap:8px;margin:0 0 6px}
.fhh2 h2{margin:0;font-size:14px;font-weight:800}
.fhh2 .lnk{margin-left:auto;background:none;border:0;color:var(--brand);font-size:13px;font-weight:700;
  cursor:pointer;font-family:inherit;padding:4px}
.fhrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:8px 11px;margin-bottom:7px}
.fhrow .l{flex:1;min-width:0}
.fhrow .pl{font-size:16px;font-weight:800;letter-spacing:-.02em}
.fhrow .m1{font-size:12.5px;color:var(--ink2,#3C424E);margin-top:2px}
.fhrow .m2{font-size:11.5px;color:var(--muted);margin-top:1px}
.fhrow .go{flex:0 0 auto;height:36px;padding:0 14px;border-radius:10px;border:0;background:var(--brand);
  color:#fff;font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit}

/* 현장 화면 머리말 간결하게 */
.wrap:not(.pc) > header{padding:7px 14px 8px;margin:0 -14px 12px}
.wrap:not(.pc) > header .logo{width:26px;height:26px;font-size:11px;border-radius:8px}
.wrap:not(.pc) > header h1{font-size:15px;letter-spacing:-.03em}
.wrap:not(.pc) > header .sub#hSub{display:none}
.wrap:not(.pc) > header #hVer{font-size:9.5px;opacity:.5;margin-top:0}
.wrap:not(.pc) > header .who{font-size:10.5px;line-height:1.2}
.wrap:not(.pc) > header .who b{font-size:12px}
.wrap:not(.pc) > header .mini{padding:6px 9px;font-size:11.5px}
.wrap:not(.pc) > header .hdr-right{gap:4px;flex-wrap:wrap;max-width:100%;min-width:0}
.wrap:not(.pc) > header .hr1,.wrap:not(.pc) > header .hr2{flex-wrap:wrap;justify-content:flex-end;max-width:100%;min-width:0;row-gap:4px}

.wrap:not(.pc) > header .mini{white-space:nowrap}
.brandrow{flex-wrap:wrap}
.wrap:not(.pc) > header .tabs{margin-top:9px}
.wrap:not(.pc) > header .tabs button{padding:9px 6px;font-size:14.5px}
/* 사진 올리는 중 알림 띠 */
#upBadge{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:70;
  background:var(--brand);color:#fff;border-radius:999px;padding:10px 18px;font-size:13.5px;
  font-weight:800;box-shadow:0 10px 26px rgba(11,93,143,.35);max-width:calc(100vw - 32px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 파일 끌어다 놓는 칸 */
.dropzone{margin-top:12px;border:2px dashed var(--line);border-radius:14px;padding:22px 16px;
  text-align:center;color:var(--muted);cursor:pointer;background:var(--surface2);
  transition:border-color .15s,background .15s}
.dropzone b{display:block;font-size:15px;color:var(--text);margin-bottom:4px}
.dropzone span{font-size:12.5px}
.dropzone:hover{border-color:var(--brand)}
.dropzone.over{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
/* PC 실시간 알림 (입고·출고가 생기면 뜨는 창) */
#ntfBox{position:fixed;right:18px;bottom:18px;z-index:80;display:flex;flex-direction:column;gap:10px;
  max-width:min(400px,calc(100vw - 36px));pointer-events:none}
.ntf{pointer-events:auto;background:var(--surface);border-radius:16px;padding:14px 16px;
  box-shadow:0 14px 40px rgba(10,22,40,.28);border-left:6px solid var(--brand);
  animation:ntfIn .25s ease-out}
.ntf.out{border-left-color:var(--good)}
.ntf.pay{border-left-color:var(--pay)}

.ntf .nt{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:900;color:var(--text)}

  cursor:pointer;line-height:1;padding:0 2px}
.ntf .np{font-size:22px;font-weight:900;margin:6px 0 2px;letter-spacing:-.02em}
.ntf .nl{font-size:13px;color:var(--muted);line-height:1.5}
.ntf .nl b{color:var(--text)}
.ntf .ng{margin-top:10px;display:flex;gap:6px}
.ntf .ng button{flex:1;border:1px solid var(--line);background:var(--surface2);color:var(--text);
  border-radius:9px;padding:8px 6px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
.ntf .ng button.go{background:var(--brand);color:#fff;border-color:var(--brand)}
@keyframes ntfIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* 가운데 큰 알림 (확인을 눌러야 넘어감) */
#ntfBg{position:fixed;inset:0;background:rgba(8,16,28,.62);z-index:95;display:none;
  align-items:center;justify-content:center;padding:20px}
#ntfBg.show{display:flex}
#ntfBig{background:var(--surface);border-radius:22px;padding:26px 28px 22px;width:min(520px,100%);
  box-shadow:0 30px 80px rgba(0,0,0,.45);border-top:10px solid var(--brand);animation:ntfIn .22s ease-out;

.sheetx{position:absolute;top:10px;right:12px;width:34px;height:34px;border-radius:50%;

.phgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}

.wrap:not(.pc) > header .hdr-right{display:flex;flex-direction:row;flex-wrap:wrap;

}

/* 즐겨찾기 목적지 */
.favs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.fav{position:relative;border:1px solid var(--line);background:var(--surface2);color:var(--text);
  border-radius:10px;padding:10px 8px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav:active,.fav[aria-selected="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.fav .st{position:absolute;top:2px;left:4px;font-size:10px;color:#f5b301}
.destrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface2);
  border-radius:11px;padding:11px 13px;margin-bottom:6px;cursor:pointer}
.destrow b{font-size:15px}
.destrow small{color:var(--muted);font-size:12px;display:block}
.destrow .star{margin-left:auto;font-size:18px;color:#f5b301;background:none;border:0;cursor:pointer}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.lc{display:flex;gap:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);
  padding:9px;cursor:pointer;box-shadow:var(--shadow)}
.lc:hover{border-color:var(--brand)}
.lc-ph{width:74px;height:64px;flex:none;border-radius:9px;background:var(--surface2);overflow:hidden;
  display:grid;place-items:center;font-size:10.5px;color:var(--muted)}
.lc-ph img{width:100%;height:100%;object-fit:cover}
.lc-b{flex:1;min-width:0}
.lc-t{display:flex;align-items:center;gap:6px;font-size:15px}

.lc-f{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px;font-size:12px;color:var(--muted)}
.lc-f b{font-size:14px;color:var(--text)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 12px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h2 .rt{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted)}
.step{width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px;display:grid;place-items:center;font-weight:800;flex:none}
label.f{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 6px}
input[type=text],input[type=tel],input[type=number],input[type=password],select,textarea{
  width:100%;font-family:inherit;font-size:16px;color:var(--text);background:var(--surface2);
  border:1px solid var(--line);border-radius:11px;padding:12px 13px;outline:none}
textarea{min-height:92px;resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus{border-color:var(--brand);background:var(--surface)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.fld{margin-bottom:13px}
.hint{font-size:12px;color:var(--muted);margin-top:5px}
button.btn{font-family:inherit;font-size:15px;font-weight:700;border-radius:11px;border:1px solid var(--line);
  background:var(--surface2);color:var(--text);padding:11px 14px;cursor:pointer}
button.btn:active{transform:translateY(1px)}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff}

.big{width:100%;padding:15px;font-size:17px;font-weight:800}

.photobox{border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;background:var(--surface2)}

.work{display:grid;grid-template-columns:1fr 122px 40px;gap:8px;align-items:center;margin-bottom:8px}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 12px}
.chip{border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:999px;
  padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}

.sums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;text-align:center}
.sum span{display:block;font-size:11px;color:var(--muted);font-weight:700}

/* 날짜 칸 — 다른 칸과 같은 모양 (예전엔 스타일이 빠져 브라우저 기본 모양이었습니다) */
input[type=date]{width:auto;font-family:inherit;font-size:14px;color:var(--text);background:var(--surface2);
  border:1px solid var(--line);border-radius:11px;padding:0 11px;outline:none;height:43px}
input[type=date]:focus{border-color:var(--brand);background:var(--surface)}
/* 폼 안·두 칸 격자 안의 날짜는 칸을 꽉 채웁니다 */
.fld input[type=date],.row2 input[type=date],.row3 input[type=date],#sheet input[type=date]{width:100%}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tools input[type=text]{flex:1;min-width:150px}
.tools select{width:auto;padding:10px 11px;font-size:14px}
/* 날짜 검색 줄 — 칸·버튼 높이를 43px 로 똑같이 (시안 가) */
.tools > input[type=date],.tools > input[type=text],.tools > select,
.tools > button.btn,.tools > label.chip{height:43px}
.tools > select{padding:0 32px 0 11px;font-size:14px}
.tools > button.btn{padding:0 14px;font-size:14.5px;display:inline-flex;align-items:center;gap:5px}

.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);-webkit-overflow-scrolling:touch}

:not(.cgg-table)>*>tr>th,:not(.cgg-table)>*>tr>td{padding:11px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
:not(.cgg-table)>thead th{background:var(--surface2);font-size:12.5px;color:var(--muted);font-weight:800;cursor:pointer;
  user-select:none;position:sticky;top:0;z-index:2}
thead th .ar{opacity:.45;font-size:10px}
thead th.on{color:var(--brand)} thead th.on .ar{opacity:1}
th.c-chk,td.c-chk{position:sticky;left:0;z-index:3;width:46px;text-align:center;padding-left:12px;padding-right:6px}
thead th.c-chk{z-index:4}

td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}

  padding:10px 12px;background:var(--surface2);border-radius:10px}

th.num .ar{margin-left:2px}
td.mid,th.mid{text-align:center}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--brand);margin:0;cursor:pointer}
:not(.cgg-table)>tbody tr{cursor:pointer}
:not(.cgg-table)>tbody tr:hover td{background:var(--surface2)}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:800}
/* 출고가 늦어지는 차 — 줄 전체 표시 */

tbody tr.lateRow2 td{background:#fff5f4}

tbody tr.lateRow2 td.c-chk{box-shadow:inset 4px 0 0 var(--danger),1px 0 0 var(--line)}
.lateMark{display:inline-flex;align-items:center;justify-content:center;width:21px;height:21px;border-radius:7px;
  background:var(--warn);color:#fff;font-size:12px;font-weight:900;margin-right:5px;vertical-align:-4px;flex:0 0 auto}
tr.lateRow2 .lateMark,.lateMark.r2{background:var(--danger)}

.banner{border-radius:11px;padding:11px 13px;font-size:13.5px;font-weight:600;margin-bottom:12px;display:none}
.banner.warn{background:var(--warn-soft);color:var(--warn);display:block}
.askbg{position:fixed;inset:0;background:rgba(10,18,28,.6);z-index:90;display:none}
.askbg.show{display:block}
.askbox{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:91;display:none;

  box-shadow:0 6px 22px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}

.sheetbg{position:fixed;inset:0;background:rgba(10,18,28,.55);z-index:80;display:none}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:81;background:var(--surface);border-radius:18px 18px 0 0;

  box-shadow:0 -6px 24px rgba(0,0,0,.2)}
.sheet.show{display:block}
@media (min-width:900px){.sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);
  width:560px;border-radius:16px;max-height:84vh}}
.sheet h3{margin:0 0 4px;font-size:19px;font-weight:900}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv span{color:var(--muted);font-weight:700}
/* 직원 목록 한 줄 — 좁은 화면에서는 두 줄로 깔끔하게 내려갑니다 */
.stRow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:11px 0}
.stL{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;flex:1 1 260px;min-width:0}
.stR{display:flex;flex-wrap:nowrap;align-items:center;gap:8px;flex:0 0 auto}
.stR .btn{padding:7px 12px;font-size:13px;white-space:nowrap;min-height:0}
.stCk{width:20px;height:20px;flex:0 0 auto;margin:0}
.stNm{color:var(--text);font-weight:700;white-space:nowrap}
.stNm small{color:var(--muted);font-weight:600;margin-left:4px}
.stPh{color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap;
  font-variant-numeric:tabular-nums;letter-spacing:.2px}
.stLg{font-size:12.5px;font-weight:700;white-space:nowrap}
@media(max-width:700px){
  .stRow{align-items:flex-start}
  .stL{flex:1 1 100%}
  .stR{flex:1 1 100%;justify-content:flex-end}
}
.sheet img.photo{width:100%;border-radius:12px;margin:12px 0}
.sheetbtns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.sheetbtns .btn{flex:1;min-width:110px}

/* 로그인 */
.auth{max-width:380px;margin:0 auto;padding:40px 16px}
.auth .card{padding:22px}
.auth .logo{width:52px;height:52px;font-size:18px;border-radius:15px;margin:0 auto 12px}
.auth h1{text-align:center;font-size:22px;margin-bottom:4px}
.auth .sub{text-align:center;margin-bottom:20px}
.codein{font-size:26px !important;text-align:center;letter-spacing:.5em;font-weight:900;padding-left:.5em !important;
  -webkit-text-security:disc;text-security:disc}
.peoplelist{display:grid;gap:8px;margin-bottom:14px}
.spotpin{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;
  color:#5B2E9B;background:#F1E9FA;border:1px solid #E1D3F5;padding:2px 8px;border-radius:6px}
.person{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface2);
  border-radius:11px;padding:11px 13px;cursor:pointer;font-family:inherit;font-size:15px;font-weight:700;width:100%;text-align:left;color:var(--text)}
.person[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.person .r{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--muted)}
.lock{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:12.5px;font-weight:600;margin-top:14px}
.center{text-align:center}
.mono{font-variant-numeric:tabular-nums}
.pcgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:820px){.pcgrid{grid-template-columns:1fr} .sums{grid-template-columns:1fr 1fr} .row3{grid-template-columns:1fr}}
@media (max-width:420px){.row2{grid-template-columns:1fr}}

/* ── 좁은 화면(폰)에서 줄이 흐트러지지 않게 고르게 맞춥니다 ─────────── */
@media (max-width:759px){
  /* 화면 제목 */
  .dashhead{margin:0 0 10px}
  .dashhead h2{font-size:19px;letter-spacing:-.025em}
  .dashhead .sub2{font-size:12px;line-height:1.35;margin-top:3px}
  /* 카드 제목 — 설명은 아랫줄로 내립니다 */
  .card h2{flex-wrap:wrap;gap:4px 8px;font-size:14.5px;margin:0 0 10px}
  .card h2 .rt{margin-left:0;flex:1 1 100%;font-size:11.5px;line-height:1.35}
  /* 숫자 칸 — 두 칸씩 고르게, 글자는 한 줄로 */
  .sums{grid-template-columns:1fr 1fr !important;gap:8px;margin-bottom:12px}
  .sum{padding:10px 8px}
  .sum span{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sum b{font-size:16px}
  /* 날짜 칸 — 두 칸 나란히 */
  .row2.drow{grid-template-columns:1fr 1fr !important;gap:8px}
  input[type="date"]{font-size:13px;padding:0 8px;min-width:0;height:42px}
  /* 빠른 날짜 버튼 — 세 칸 격자 */
  .datebar{gap:6px;flex-wrap:nowrap}
  .datebar button{flex:1 1 0;min-width:0;padding:10px 2px;font-size:12.5px;white-space:nowrap}
  /* 날짜 도구 한 줄 (출고 기록·청구서 등) */
  .dtools{display:flex;flex-wrap:wrap;gap:7px;margin:0}
  .dtools > .btn{flex:1 1 calc(33.333% - 5px);min-width:0;padding:0 4px;font-size:13px;height:42px}
  .dtools > input[type="date"]{flex:1 1 calc(50% - 4px);width:auto !important;min-width:0;height:42px}
  .tools > input[type=date],.tools > input[type=text],.tools > select,
  .tools > button.btn,.tools > label.chip{height:42px}
  .datebar button{height:42px}
  .dtools > .dtil{display:none}
  .dtools > .btn.primary{flex:1 1 100%}
}
.helpbody ul,.helpbody ol{margin:6px 0;padding-left:22px}.helpbody li{margin:3px 0}
.helpbody .hl{background:var(--warn-soft);color:var(--text);padding:8px 12px;border-radius:9px;margin:8px 0 0}

/* ===== 요금제 띠 (본문 맨 위 · 메뉴 칸 밖) ===== */
#planStrip{min-width:0}
/* 가로메뉴·현장 화면 — 머리말(탭줄) 바로 밑에 이어 붙는 흰 띠.
   머리말의 아래 여백을 없애고 띠가 그 자리를 이어받습니다 (배치마다 여백 값이 달라서 음수 여백을 쓰지 않습니다) */
.wrap:not(.side).hasplan > header{margin-bottom:0}
.wrap:not(.side) #planStrip{background:var(--surface);border-bottom:1px solid var(--line);
  margin:0 -14px 18px;padding:9px 14px}
@media (min-width:1000px){
  /* 현장 화면 미리보기(폰 모양 틀) — 좌우 여백이 16px 입니다 */
  .wrap.fieldview #planStrip{margin:0 -16px 16px;padding:9px 16px}
  /* 세로메뉴 — 본문 칸 맨 위에 꽉 차게 붙는 흰 띠 */
  .wrap.side:not(.iconmenu) #planStrip{background:var(--surface);border-bottom:1px solid var(--line);
    margin:-18px -24px 16px;padding:11px 24px;border-radius:0}
  /* 아이콘메뉴 — 위쪽 흰 띠(상호 줄) 바로 밑에 이어 붙습니다 */
  .wrap.iconmenu #planStrip{background:var(--surface);border-bottom:1px solid var(--line);
    margin:-16px -24px 16px;padding:10px 24px;border-radius:0}
}
/* 장부 점검 줄 */
.lcRow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);
  border-radius:11px;margin-bottom:7px;cursor:pointer;background:var(--surface)}
.lcRow:hover{border-color:var(--brand);background:var(--brand-soft)}
.lcN{flex:0 0 auto;min-width:38px;height:38px;border-radius:10px;display:inline-flex;
  align-items:center;justify-content:center;font-weight:900;font-size:16px;padding:0 8px}
.lcN.bad{background:var(--danger-soft);color:var(--danger)}
.lcN.warn{background:var(--warn-soft);color:var(--warn)}
.lcT{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lcT b{font-size:14px;font-weight:800}
.lcT i{font-style:normal;font-size:12.5px;color:var(--muted)}
.lcGo{flex:0 0 auto;font-size:12.5px;font-weight:700;color:var(--brand)}
@media(max-width:560px){ .lcGo{display:none} }

/* 도움말 안의 작은 표 (권한 비교) */
.htb{width:100%;border-collapse:collapse;margin:10px 0 12px;font-size:13px}
.htb th,.htb td{border:1px solid var(--line);padding:7px 9px;text-align:center}
.htb th{background:var(--surface2);font-weight:800;font-size:12.5px}
.htb td:first-child,.htb th:first-child{text-align:left}
.htb td.x{color:var(--muted)}
.htb tr:nth-child(even) td{background:var(--surface2)}

.pl-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0}
.pl-lead{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.02em;margin-right:2px;flex:0 0 auto}
.pl-chip{display:inline-flex;align-items:baseline;gap:6px;background:var(--surface2);
  border:1px solid var(--line);border-radius:999px;padding:5px 11px;white-space:nowrap;max-width:100%}
.pl-chip .k{font-size:11px;color:var(--muted)}
.pl-chip .v{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.pl-chip.warn{background:var(--warn-soft);border-color:transparent}
.pl-chip.warn .v{color:var(--warn)}
.pl-chip.bad{background:var(--danger-soft);border-color:transparent}
.pl-chip.bad .v{color:var(--danger)}
.pl-sp{flex:1 1 0;min-width:0}
.pl-more{font:inherit;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.pl-more:hover{background:var(--surface2)}
.pl-badge{font:inherit;display:inline-flex;align-items:center;gap:8px;max-width:100%;
  background:var(--brand);color:#fff;border:0;border-radius:999px;padding:6px 14px;cursor:pointer;
  font-size:13px;font-weight:800;line-height:1.55;white-space:nowrap}
.pl-badge .d{font-weight:600;opacity:.86;font-variant-numeric:tabular-nums}
.pl-badge .ar{font-style:normal;font-size:11px;opacity:.85}
.pl-badge.warn{background:var(--warn)}
.pl-badge.bad{background:var(--danger)}
.pl-go{font:inherit;font-size:12.5px;font-weight:700;border:0;border-radius:9px;padding:7px 13px;
  background:var(--brand);color:#fff;cursor:pointer;white-space:nowrap}
.pl-go.warn{background:var(--warn)} .pl-go.bad{background:var(--danger)}
.pl-band{display:flex;align-items:center;gap:10px;margin-top:7px;padding:10px 12px;border-radius:11px;
  background:var(--warn-soft);color:var(--warn)}
.pl-band.bad{background:var(--danger-soft);color:var(--danger)}
.pl-band .ic{width:20px;height:20px;flex:0 0 auto;border-radius:50%;background:var(--warn);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.pl-band.bad .ic{background:var(--danger)}
.pl-band .tx{flex:1;min-width:0;font-size:13px;line-height:1.45}
.pl-band .tx b{display:block;font-weight:800}
.pl-band .tx small{font-size:11.8px;opacity:.88}
@media(max-width:820px){
  .pl-band{flex-wrap:wrap}
  .pl-band .tx{flex:1 1 100%}
  .pl-band .pl-go{width:100%}
}
/* 좁은 자리(현장 화면·폰) — 한 줄에 모두 들어가도록 글씨를 줄입니다 */
#planStrip.pl-nar .pl-row{flex-wrap:nowrap;gap:4px}
#planStrip.pl-nar .pl-lead{font-size:10.5px;margin:0;white-space:nowrap}
#planStrip.pl-nar .pl-chip{padding:3px 7px;gap:3px;flex:0 1 auto;min-width:0;overflow:hidden}
#planStrip.pl-nar .pl-chip .k{font-size:9.5px}
#planStrip.pl-nar .pl-chip .v{font-size:11px;overflow:hidden;text-overflow:ellipsis}
#planStrip.pl-nar .pl-sp{display:none}
#planStrip.pl-nar .pl-more{padding:3px 8px;font-size:11px}
#planStrip.pl-xs .pl-lead{font-size:10px}
#planStrip.pl-xs .pl-chip{padding:2px 6px}
#planStrip.pl-xs .pl-chip .k{font-size:9px}
#planStrip.pl-xs .pl-chip .v{font-size:10.5px}
/* 좁은 자리에서 「자세히」를 펼쳤을 때 — 칸을 눕혀서 높이를 줄입니다 */
#planStrip.pl-nar .pmBox{padding:12px 13px;margin-top:8px;border-radius:12px}
#planStrip.pl-nar .pmTop{gap:9px}
#planStrip.pl-nar .pmName{font-size:16.5px;gap:6px}
#planStrip.pl-nar .pmTag{font-size:10px;padding:3px 8px}
#planStrip.pl-nar .pmSub{font-size:11.5px;margin-top:2px}
#planStrip.pl-nar .pmTop .mini,#planStrip.pl-nar .pmTop .pl-go{font-size:11.5px;padding:6px 10px}
#planStrip.pl-nar .pmCells{grid-template-columns:1fr;gap:7px;margin-top:11px}
#planStrip.pl-nar .pmCell{display:grid;grid-template-columns:1fr auto;column-gap:8px;
  align-items:baseline;padding:9px 11px;border-radius:10px}
#planStrip.pl-nar .pmCell .t{font-size:11.5px}
#planStrip.pl-nar .pmCell .v{font-size:19px;line-height:1.15;margin:0;text-align:right;white-space:nowrap}
#planStrip.pl-nar .pmCell .v small{font-size:11px;margin-left:3px;white-space:nowrap}
#planStrip.pl-nar .pmCell .s{grid-column:1/-1;font-size:11px;margin-top:2px}
#planStrip.pl-nar .pmCell .pmBar{grid-column:1/-1;height:5px;margin-top:7px}
#planStrip.pl-nar .pmCell .nt{grid-column:1/-1;font-size:11px;margin-top:5px}
#planStrip.pl-nar .pmFoot{flex-direction:column;align-items:flex-start;gap:3px;
  font-size:11px;margin-top:11px;padding-top:10px}
/* 좁은 화면에서 쉽게 찾는 「접기」 버튼 — 펼친 상자 맨 아래에 가로로 꽉 차게 */
.pl-close{display:none}
#planStrip.pl-nar .pl-close{display:block;width:100%;margin-top:11px;font:inherit;font-size:13px;
  font-weight:700;color:var(--brand);background:var(--brand-soft);border:1px solid #C6E0F8;
  border-radius:10px;padding:10px 0;cursor:pointer}
#planStrip.pl-nar .pl-more{background:var(--brand-soft);border-color:#C6E0F8;color:var(--brand);
  font-size:12px;font-weight:800;padding:4px 9px}
/* ===== 설정 → 내 요금제 ===== */
.pmBox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.pmTop{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.pmName{margin:0;font-size:20px;font-weight:800;letter-spacing:-.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pmTag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand)}
.pmTag.warn{background:var(--warn-soft);color:var(--warn)}
.pmTag.bad{background:var(--danger-soft);color:var(--danger)}
.pmSub{font-size:13px;color:var(--muted);margin-top:3px}
.pmCells{display:grid;gap:11px;margin-top:16px;grid-template-columns:1.2fr 1fr 1fr}
@media(max-width:760px){.pmCells{grid-template-columns:1fr}}
.pmCell{background:var(--surface2);border-radius:12px;padding:13px 15px;min-width:0}
.pmCell .t{font-size:12px;font-weight:700;color:var(--muted)}
.pmCell .v{font-size:25px;font-weight:800;letter-spacing:-.9px;margin-top:2px;line-height:1.25;font-variant-numeric:tabular-nums}
.pmCell .v small{font-size:13px;font-weight:600;color:var(--muted);margin-left:4px;letter-spacing:0}
.pmCell .s{font-size:12px;color:var(--muted);margin-top:3px}
.pmBar{height:7px;border-radius:999px;background:var(--line);margin-top:10px;overflow:hidden}
.pmBar i{display:block;height:100%;border-radius:999px;background:var(--brand)}
.pmCell.warn .v{color:var(--warn)}.pmCell.warn .pmBar i{background:var(--warn)}
.pmCell.bad .v{color:var(--danger)}.pmCell.bad .pmBar i{background:var(--danger)}
.pmCell .nt{margin-top:8px;font-size:12px;font-weight:700}
.pmCell.warn .nt{color:var(--warn)}.pmCell.bad .nt{color:var(--danger)}
.pmFoot{margin-top:15px;padding-top:13px;border-top:1px solid var(--line);display:flex;
  justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}

/* 청구서 — 계산서 끊음 여부 딱지
   «계산서 끊음» 과 «계산서 안 끊음» 의 칸 너비를 같게 맞춥니다 */
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 10px;
  border-radius:999px;white-space:nowrap;line-height:1.7;text-align:center;
  min-width:86px;font-variant-numeric:tabular-nums}
.pill.ok{background:var(--good-soft,#e2f5ec);color:var(--good);
  text-align:justify;text-align-last:justify;text-justify:inter-character}
.pill.no{background:var(--danger-soft,#fdeceb);color:var(--danger)}

/* ===== 도움말 (새 구조) ===== */
.hpTop{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.hpHd{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.hpHd h2{margin:0;font-size:23px;font-weight:800;letter-spacing:-.8px}
.hpHd p{margin:3px 0 0;font-size:13.5px;color:var(--muted)}
.hpBtns{display:flex;gap:7px;flex-wrap:wrap}
.hpSbox{position:relative;margin-top:14px}
.hpSin{display:flex;align-items:center;gap:10px;background:var(--surface2);
  border:1.5px solid var(--line);border-radius:12px;padding:0 13px;transition:border-color .12s}
.hpSbox.on .hpSin{border-color:var(--brand);background:var(--surface)}
.hpSin .mg{font-size:16px;color:var(--muted);flex:0 0 auto}
.hpSin input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:inherit;
  font:inherit;font-size:16px;padding:13px 0}
.hpSin .clr{border:0;background:var(--line);color:var(--muted);font:inherit;font-size:12.5px;
  font-weight:700;border-radius:999px;padding:5px 11px;cursor:pointer}
.hpSug{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:60;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 32px rgba(16,32,52,.18);
  overflow:hidden;max-height:min(56vh,430px);overflow-y:auto}
.hpSug .gp{font-size:10.5px;font-weight:800;letter-spacing:.09em;color:var(--muted);padding:10px 14px 4px}
.hpSug > button{display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;
  font:inherit;padding:10px 14px;cursor:pointer;border-top:1px solid var(--line)}
.hpSug .gp + button{border-top:0}
.hpSug > button:hover,.hpSug > button.cur{background:var(--brand-soft)}
.hpSug .tt{display:block;font-size:14.5px;font-weight:700}
.hpSug .ss{display:block;font-size:12.5px;color:var(--muted);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hpSug .none{padding:15px 14px;font-size:14px;color:var(--muted)}
.hpSug .wds{display:flex;flex-wrap:wrap;gap:6px;padding:9px 14px 13px;border-top:1px solid var(--line)}
.hpSug .wds button{border:1px solid var(--line);background:var(--surface2);border-radius:999px;
  padding:5px 11px;font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;width:auto}
.hpSug .wds button:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.hpSug mark, .hpBody mark{background:var(--warn-soft);color:var(--warn);border-radius:3px;padding:0 2px}
.hpQuick{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px;align-items:center}
.hpQuick > span{font-size:12.5px;color:var(--muted);font-weight:700;margin-right:3px}
.hpQuick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:6px 13px;font:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.hpQuick button:hover{border-color:var(--brand);color:var(--brand)}
.hpCats{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.hpCat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:16px 18px;text-align:left;font:inherit;color:inherit;cursor:pointer;
  transition:border-color .12s,transform .12s}
.hpCat:hover{border-color:var(--brand);transform:translateY(-2px)}

@media (max-width:560px){ .tfoot .acts{margin-left:0;width:100%} .tfoot .acts .btn{flex:1} }
.dtin{border:1px solid var(--line);background:var(--surface);color:var(--text);
  font:inherit;font-size:12.5px;font-weight:700;padding:5px 7px;border-radius:8px;width:132px}
.dtin:disabled{color:var(--muted);background:var(--bg)}

/* ───────── 잘못 낸 계산서 고치기 ───────── */
.fixcard{border:1px solid var(--warn);border-radius:var(--r);background:var(--surface);
  overflow:hidden;margin:0 0 16px}
.fixcard .ftop{display:flex;gap:14px;align-items:flex-start;padding:16px 20px;background:var(--warn-soft)}
.fixcard .ftop .ico{font-size:20px;line-height:1.2}
.fixcard .ftop .ttl{display:block;font-size:16px;font-weight:900;color:var(--warn);margin-bottom:4px}
.fixcard .ftop p{margin:0;font-size:13px;color:var(--text);line-height:1.6}
.fixcard .fmid{padding:15px 20px 0}
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px}
.case{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:var(--bg)}
.case .ttl{display:block;font-size:13px;font-weight:800;margin-bottom:2px}
.case .s2{display:block;font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.5}
.fixcard .fbot{padding:15px 20px 18px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.bigbtn{border:0;background:var(--warn);color:#fff;font:inherit;font-size:14.5px;font-weight:800;
  padding:12px 20px;border-radius:11px;cursor:pointer}
.bigbtn:hover{filter:brightness(1.07)}
.bigbtn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--line)}
.bigbtn.ghost:hover{border-color:var(--brand);color:var(--brand);filter:none}

/* ───────── 매출 히어로 ───────── */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;
  overflow:hidden;margin:0 0 16px}
.hero-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:15px 20px;border-bottom:1px solid var(--line);background:var(--bg)}
.hero-top .m{font-size:19px;font-weight:900;letter-spacing:-.02em}
.hero .big3{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)}
.hero .big3 > div{background:var(--surface);padding:19px 20px}
.hero .big3 .k{font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 7px}
.hero .big3 .v{font-size:33px;font-weight:900;letter-spacing:-.035em;line-height:1.1}
.hero .big3 .v small{font-size:17px;font-weight:800;margin-left:2px}
.hero .big3 .d{margin-top:7px;font-size:12.5px;font-weight:700;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hero .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:1px;
  background:var(--line);border-top:1px solid var(--line)}
.hero .facts > div{background:var(--surface);padding:12px 20px}
.hero .facts .k{font-size:12px;color:var(--muted);font-weight:700;margin:0 0 3px}
.hero .facts .v{font-size:16px;font-weight:800}
.hero .facts .v em{font-style:normal;font-size:12.5px;font-weight:700;color:var(--muted);margin-left:4px}
.delta{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;
  font-size:12px;font-weight:800}
.delta.up{background:var(--good-soft);color:var(--good)}
.delta.down{background:var(--danger-soft);color:var(--danger)}
.delta.flat{background:var(--chip);color:var(--muted)}
.spark{padding:15px 20px 17px;border-top:1px solid var(--line)}
.spark .lab{display:flex;align-items:baseline;gap:8px;margin:0 0 11px}
.spark .lab b{font-size:13.5px;font-weight:800}
.spark .lab span{font-size:12px;color:var(--muted)}
.sgrid{display:flex;align-items:flex-end;gap:5px;height:84px}
.sgrid .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;
  height:100%;min-width:0;border:0;background:none;padding:0;font:inherit;cursor:pointer}
.sgrid .bar{background:var(--brand-soft);border-radius:4px 4px 0 0;min-height:3px}
.sgrid .col.on .bar,.sgrid .col:hover .bar{background:var(--brand)}
.sgrid .t{font-size:10.5px;color:var(--muted);text-align:center;font-weight:700;
  white-space:nowrap;overflow:hidden}
.sgrid .col.on .t{color:var(--brand);font-weight:900}
@media (max-width:760px){ .hero .big3{grid-template-columns:1fr} .hero .big3 .v{font-size:28px} }
.seg{display:inline-flex;background:var(--chip);border-radius:11px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--text);font:inherit;
  font-size:13.5px;font-weight:700;padding:8px 15px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--brand);
  box-shadow:0 1px 2px rgba(16,24,40,.08)}
.rowbar{display:flex;gap:2px;height:14px;min-width:70px;align-items:center}
.rowbar i{display:block;height:14px;border-radius:2px;min-width:2px}
.rowbar .f{background:var(--s-fee)} .rowbar .r{background:var(--s-rep)} .rowbar .s{background:var(--s-ins)}

/* ───────── 달 고르기 (달력) ───────── */
.ymwrap{position:relative;display:inline-block}
.ymbtn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);cursor:pointer;
  font-size:14.5px;font-weight:800;letter-spacing:-.01em;min-width:132px;justify-content:space-between}
.ymbtn:hover{border-color:var(--brand)}
.ymbtn .ic{font-size:13px;color:var(--muted);font-weight:600}
.ympop{position:absolute;z-index:70;top:calc(100% + 6px);left:0;width:270px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;
  box-shadow:0 2px 6px rgba(16,24,40,.08),0 16px 40px -18px rgba(11,37,69,.45)}
.ympop[hidden]{display:none}
.ymhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ymhead b{font-size:16px;font-weight:900}
.ymhead button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface);cursor:pointer;font-size:15px;font-weight:900;line-height:1}
.ymhead button:hover{border-color:var(--brand);color:var(--brand)}
.ymgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ymgrid button{padding:10px 0;border-radius:9px;border:1px solid var(--line);
  background:var(--surface);cursor:pointer;font-size:13.5px;font-weight:700}
.ymgrid button:hover{border-color:var(--brand);background:var(--brand-soft)}
.ymgrid button[aria-selected=true]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:900}
.ymgrid button[disabled]{opacity:.32;cursor:default}
.ymgrid button[disabled]:hover{border-color:var(--line);background:var(--surface)}
.ymquick{display:flex;gap:6px;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.ymquick button{flex:1;padding:8px 0;border-radius:9px;border:1px solid var(--line);
  background:var(--surface);cursor:pointer;font-size:12.5px;font-weight:700}
.ymquick button:hover{border-color:var(--brand);color:var(--brand)}

/* ───────── 매출 ───────── */
:root{ --s-fee:#1668C4; --s-ins:#7A3E96; --s-rep:#127a4b; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --s-fee:#3E8FD6; --s-ins:#9B63C4; --s-rep:#1FA96B; }
}
:root[data-theme="dark"]{ --s-fee:#3E8FD6; --s-ins:#9B63C4; --s-rep:#1FA96B; }
.sbar{display:flex;align-items:center;gap:2px;height:16px;min-width:90px}
.sbar i{display:block;height:16px;border-radius:0}
.sbar i:first-child{border-radius:4px 0 0 4px}
.sbar i:last-child{border-radius:0 4px 4px 0}
.sbar i:only-child{border-radius:4px}
.sbar .f{background:var(--s-fee)} .sbar .r{background:var(--s-rep)} .sbar .s{background:var(--s-ins)}
.slegend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:10px 0 0}
.slegend span{display:inline-flex;align-items:center;gap:6px}
.slegend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.up{color:var(--good);font-weight:800} .down{color:var(--danger);font-weight:800}
.flat{color:var(--muted);font-weight:700}

/* ───────── 로그인 ───────── */
.login{min-height:100vh;display:grid;place-items:center;padding:28px 16px}
.loginbox{width:100%;max-width:400px}
.loginbox .top{text-align:center;margin-bottom:22px}
.loginbox .lg{width:54px;height:54px;border-radius:14px;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-weight:900;font-size:20px;margin:0 auto 12px}
.loginbox .top h1{font-size:29px;font-weight:900;letter-spacing:-.03em;margin:0 0 5px}
.loginbox .top p{margin:0;color:var(--muted);font-size:13.5px}
.loginbox .lcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:26px 24px;box-shadow:0 1px 2px rgba(16,24,40,.06),0 10px 30px -18px rgba(11,37,69,.35)}
.loginbox .lcard h2{font-size:19px;font-weight:900;margin:0 0 18px;letter-spacing:-.02em}
.loginbox label.f{display:block;font-size:13.5px;font-weight:700;margin:0 0 7px}
.loginbox input{width:100%;font-size:16px;padding:14px 15px;border-radius:11px;
  border:1px solid var(--line);background:var(--surface)}
.loginbox input:focus{border-color:var(--brand);outline:2px solid var(--brand-soft)}
.loginbox .fld{margin-bottom:16px}
.loginbox .go{width:100%;padding:15px;font-size:17px;font-weight:800;border-radius:11px;
  border:0;background:var(--brand);color:#fff;cursor:pointer}
.loginbox .go:disabled{opacity:.6;cursor:default}
.loginbox hr{border:0;border-top:1px solid var(--line);margin:22px 0 14px}
.loginbox .sub2{width:100%;padding:13px;font-size:15px;font-weight:600;border-radius:11px;
  border:1px solid var(--line);background:var(--surface);cursor:pointer;margin-bottom:8px}
.loginbox .note{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.7;margin:14px 0 0}
.loginbox .foot{text-align:center;margin:18px 0 0;font-size:12.5px;color:var(--muted)}
.msg{margin:12px 0 0;padding:11px 13px;border-radius:10px;font-size:13.5px;font-weight:700;line-height:1.55}
.msg.info{background:var(--brand-soft);color:var(--brand)}
.msg.ok{background:var(--good-soft);color:var(--good)}
.msg.err{background:var(--danger-soft);color:var(--danger)}
.hide{display:none}
#bar:empty{display:none}
#bar{margin:0 0 12px}
.loading{text-align:center;padding:44px 12px;color:var(--muted);font-weight:700}
.todo .n.g{background:var(--good-soft);color:var(--good)}
</style>

</head>

<!-- 차곳간 공통 부품 cgg-j4 JS — 제품 스크립트보다 먼저 (README 1.1) -->
<script>
/* ═══════════════════════════════════════════════════════════════════
   차곳간 공통 부품 · J안 4판 · cgg-j4 1.5 (2026-10-15, 디자인 방)
   ① 메뉴 배치 셋  ② 폰 아래 탭바  ③ 홈 할 일 카드 3장  ④ 사람 단추 ▾ 펼침 (1.1)  ⑤ 체험 모드 (1.2)  ⑥ 본문 (1.3)
   바탕: 관리 v4.0 의 관리/v4재료/j4.js. 관리 전용 이름(TAB · render · NAV)에 묶이지 않게
         «무엇을 보여 줄지»와 «눌렀을 때 할 일»을 제품이 넘겨 주는 식으로 바꿨어요.
   서버를 부르지 않아요. 저장은 «이 기기에만»(localStorage) — 못 쓰면 가로 메뉴로 그냥 보여요.

   쓰는 법 (이 파일 내용을 제품 스크립트보다 «먼저» 따로 <script> 하나로 넣고, 제품 스크립트 안에서)
     CGG.layout.init(document.querySelector(".cgg-app"), "cgg_check_layout");   // 저장 이름은 제품마다
     CGG.layout.chooser(상자, function(v){ 창 닫기 · 알림 });                     // 화면 설정 창 안에 고르기 칸 그리기
     CGG.tabbar(document.querySelector(".cgg-tbar"),
       [{key:"home",icon:"home",label:"홈"}, … 5칸], 지금 key, function(key){ 화면 이동 });
     CGG.todos(document.querySelector(".cgg-acts"),
       [{tone:"chk",icon:"car",title:"출고 확인 3대",sub:"한빛모터스 외 2곳 · 오늘"}, … 3장], function(i){ 그 화면으로 });
     CGG.menu(사람단추, {name:"홍길순", role:"대표"}, [                                    // 1.1
       {key:"me",icon:"user",label:"마이페이지"}, {key:"trash",icon:"trash",label:"휴지통",count:3}, "-",
       {key:"lay",icon:"pc",label:"화면 설정",note:CGG.layout.name()}, "-", {key:"out",icon:"out",label:"로그아웃"}], function(key){ … });
     CGG.badge(사람단추, 3);   // 사람 단추 위 빨간 개수 (0이면 숨김)
   tone: run(파랑 · 진행 중) · chk(주황 · 확인 필요) · stop(빨강 · 보류)
   ═══════════════════════════════════════════════════════════════════ */
var CGG = (function(){
  var IC = {
    home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    car:'<path d="M3 17h18v-4l-2.2-5.2A1.5 1.5 0 0 0 17.4 7H6.6a1.5 1.5 0 0 0-1.4.8L3 13z"/><path d="M7 17v2M17 17v2M3 13h18"/>',
    wallet:'<path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H3z"/><path d="M3 7l11-4v4M16 14h2"/>',
    receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
    file:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>',
    chart:'<path d="M5 20V11M12 20V5M19 20v-6M3 20h18"/>',
    shop:'<path d="M4 10h16v10H4zM3 10l2-6h14l2 6M9 20v-5h6v5"/>',
    user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
    bell:'<path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
    gear:'<circle cx="12" cy="12" r="3"/><path d="M19 12h2M3 12h2M12 3v2M12 19v2M17 7l1.4-1.4M5.6 18.4L7 17M17 17l1.4 1.4M5.6 5.6L7 7"/>',
    box:'<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
    today:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
    out:'<path d="M12 21V9M7 14l5-5 5 5M4 3h16"/>', in:'<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>',
    more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
    trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
    pc:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
    down:'<path d="M12 4v12M6 12l6 6 6-6M4 20h16"/>', plus:'<path d="M12 5v14M5 12h14"/>', search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>',

  function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }

  /* ① 메뉴 배치 — 문구는 워시 원본 LY_INFO 그대로 */
  var LAYS=[["top","가로 메뉴","메뉴가 화면 위에 가로로 놓여요. 지금까지 쓰던 모습이에요."],
            ["side","세로 메뉴","메뉴가 왼쪽에 세로로 놓여요. 메뉴 이름이 다 보여서 찾기 쉬워요."],

<script>

var API  = "https://ybfpxmmjofyvfprtvmhj.supabase.co/functions/v1/check-api";

function readJson(r){
  return r.text().then(function(t){
    var j=null; try{ j=JSON.parse(t); }catch(e){}
    if(j===null){ try{ console.warn("check-api 답이 JSON 이 아님", r.status, String(t).slice(0,300)); }catch(e){}
      throw new Error("서버에서 답을 받지 못했습니다. 잠시 뒤 다시 시도해 주세요."); }
    j.__status=r.status; return j;
  });

/* v39: 화면에는 쉬운 말만 — 자세한 까닭은 개발자 도구 콘솔에 */
function whyBad(j){
  var code=(j&&(j.code||j.statusCode||j.__status))||0;
  var msg=String((j&&(j.message||j.msg||j.error))||"");
  try{ console.warn("check-api 답을 알아듣지 못함", code, msg, JSON.stringify(j).slice(0,300)); }catch(e){}
  if(code===401 || code===404 || /authorization/i.test(msg))
    return "서버 설정이 맞지 않아 처리하지 못했습니다. 차곳간에 알려 주세요.";
  return "처리하지 못했습니다. 잠시 뒤 다시 시도해 주세요.";
}
function niceMsg(m){
  m=String(m==null?"":m).trim();
  if(!m) return "처리하지 못했습니다. 잠시 뒤 다시 시도해 주세요.";
  if(/Failed to fetch|NetworkError|Load failed|network|timed? ?out|aborted|offline/i.test(m))
    return "인터넷 연결이 불안정합니다. 연결을 확인하고 다시 시도해 주세요.";
  if(!/[가-힣]/.test(m) || /undefined|\bnull\b|NaN|\[object /.test(m)){
    try{ console.warn("화면에 그대로 보이지 않게 바꾼 오류 글:", m); }catch(e){}
    return "처리하지 못했습니다. 잠시 뒤 다시 시도해 주세요.";

var HASH={ home:"홈", sales:"매출", deposit:"입금", unpaid:"보험료대조", bill:"청구서", billgrp:"청구처묶음",

function pageOfHash(){
  var h=decodeURIComponent(String(location.hash||"").replace(/^#/,"")).trim();
  if(!h) return "";
  if(PAGE[h]) return h;                      /* #popbill 처럼 영어로 적어도 됩니다 */
  for(var k in HASH) if(HASH[k]===h) return k;
  return "";
}
var HASH_BUSY=false;
function setHash(p){
  var want="#"+encodeURIComponent(HASH[p]||p);
  if(location.hash===want) return;
  HASH_BUSY=true; location.hash=want;
  setTimeout(function(){ HASH_BUSY=false; },50);
}
window.addEventListener("hashchange",function(){
  if(HASH_BUSY) return;
  var p=pageOfHash();
  if(p && p!==page) go(p);
});

  page=(k==="set")?SETS[0][0]:k;

function mapDrive(r){

function chkMemos(){
  /* v39: 검사소별로 저장 — 같은 PC에서 다른 검사소로 로그인해도 서로 안 보이게. 예전(검사소 없는) 메모는 처음 연 검사소로 옮김 */

    var k="cgg_memos:"+(ST.shop||"");
    var v=localStorage.getItem(k);
    if(v===null){ var old=localStorage.getItem("cgg_memos"); if(old!==null && ST.shop){ localStorage.setItem(k, old); localStorage.removeItem("cgg_memos"); v=old; } }
    return JSON.parse(v || "[]");
  } catch(e){ return []; }
}
function chkMemoSave(list){
  try { if(ST.shop) localStorage.setItem("cgg_memos:"+ST.shop, JSON.stringify(list)); } catch(e){}
}
function chkMemoSort(a,b){
  if(!!a.done !== !!b.done) return a.done ? 1 : -1;
  return String(a.time||"~").localeCompare(String(b.time||"~"));
}
function chkMemoBoxHtml(k){

            amount:r.amount||0, reason:r.item||"", qty:r.qty||1,
            kind: r.kind==="ext" ? "전산외" : r.kind==="repair" ? "정비" : "검사" };

  return {fee:fee, rep:rep};
}

AFTER.bill=function(){

      var b=BILLS.filter(function(x){return x.name===OPEN_BILL;})[0];
      draw();

        call("invoiceRows",[b.id]).then(function(list){ b.rows=list||[]; draw(); })
          .catch(function(e){ b.rows=[]; fail(e); draw(); });

  });

    b.onclick=function(){ OPEN_KIND=b.getAttribute("data-kind"); ts("bdet").page=1; ts("bdet").q=""; draw(); };

  ["shutBill","shutBill2"].forEach(function(id){ var e=$(id); if(e) e.onclick=shut; });

};

/* 보내는 형식·방식에 따라 미리보기와 요금이 바뀝니다 */
function wireSend(){
  var fmt=$("sendFmt"), way=$("sendWay");
  if(!fmt||!way) return;
  var BODY="○○검사소 2026년 9월 청구서\n\n홍길동 님\n2026년 9월 성능점검 검사비 내역을 보내드립니다.\n\n· 검사 40건\n· 합계 1,243,000원\n\n입금 계좌 : 국민 000-00-0000-000 홍길동";
  var SHORT="○○검사소 2026-09 청구서 40건 1,243,000원\n입금 국민 000-00-0000-000";
  function paint(){
    var f=fmt.value, w=way.value;
    /* 알림톡은 사진을 못 붙입니다 — 그림 고르기를 막습니다 */
    var img=way.querySelector('option[value="img"]');
    if(img) img.disabled=(f==="ata");
    if(f==="ata" && w==="img"){ way.value="link"; w="link"; }
    var btn=$("phoneBtn"), msg=$("phoneMsg"), meta=$("msgMeta"), note=$("wayNote");
    var text = (w==="short") ? SHORT : BODY;
    var tail = "";
    if(w==="link") tail = "\n\n검사비 · 정비비 청구서는 아래 '청구서 보기' 버튼에서 보실 수 있습니다.";
    else if(w==="img") tail = "\n\n청구서 그림을 함께 보냅니다.";
    if(w!=="short") tail += "\n문의 : 031-000-0000";
    if(f==="ata") tail += "\n\n본 안내는 ○○검사소의 요청으로 차곳간이 보내드립니다.";
    msg.textContent = text + tail;

    var showBtn = (w==="link");
    btn.hidden = !showBtn;
    btn.textContent = "청구서 보기";

    var kind, cost, pic;
    if(f==="ata"){ kind="알림톡"; cost="13원"; pic="버튼으로 열기"; }
    else if(w==="img"){ kind="MMS"; cost="110원"; pic="검사비 · 정비비 2장"; }
    else if(w==="short"){ kind="SMS"; cost="20원"; pic="안 붙임"; }
    else { kind="LMS"; cost="45원"; pic=(w==="link"?"주소로 열기":"안 붙임"); }
    meta.innerHTML='<span>글자 수 <b>'+msg.textContent.length+'자</b></span>'+
      '<span>종류 <b>'+kind+'</b></span><span>사진 <b>'+pic+'</b></span>'+
      '<span>한 통 약 <b>'+cost+'</b></span>';

    if(f==="ata"){
      note.innerHTML = "알림톡은 <b>사진을 붙일 수 없어요</b> — 카카오가 템플릿에 등록한 고정 그림만 쓰기 때문이에요. "+
        "대신 맨 아래 <b>「청구서 보기」 버튼</b>이 붙고, 누르면 그 딜러의 <b>검사비 · 정비비 청구서가 한 화면에 같이</b> 열려요. "+
        "누가 열어봤는지도 «확인» 칸에 남아요.";
    } else if(w==="img"){
      note.innerHTML = "문자에 <b>검사비 · 정비비 청구서 그림 2장</b>을 붙여 보내요. 한 통 약 110원이에요.";
    } else if(w==="link"){
      note.innerHTML = "문자 끝에 <b>청구서 주소</b>를 글자로 넣어 보내요. 누르면 검사비 · 정비비 청구서가 같이 열려요.";
    } else {
      note.innerHTML = "글자만 보내요. 청구서를 보려면 따로 알려주셔야 해요.";
    }
  }
  fmt.onchange=paint; way.onchange=paint; paint();
}

var INSFIL="";
AFTER.unpaid=function(){
  wireTable("unp",function(){ draw(); });

  dropZone("insBox","insFile","insMsg");
  var run=$("insRun");
  if(run) run.onclick=function(){
    say("insMsg","카모두 기록과 맞춰 보는 중…","info"); busy(true);
    call("insMatch",[ST.ym]).then(function(r){
      busy(false);
      if(!r.n){ say("insMsg","대조할 보험사 청구가 없습니다. 위에서 엑셀을 먼저 올려 주세요.","err"); return; }
      var c=(r.cancelN?r.cancelN.n:0)+(r.cancelP?r.cancelP.n:0);
      say("insMsg", won(r.n)+"건을 맞췄어요 — 그대로 낼 것 "+won(r.ok?r.ok.n:0)+"건 · "+
        "취소 요청 "+won(c)+"건"+(r.notFound&&r.notFound.n?" · 못 찾음 "+won(r.notFound.n)+"건":""),
        c?"err":"ok");
      refresh(["ins"]);
    }).catch(function(e){ busy(false); say("insMsg",(e&&e.message)||"안 됐습니다.","err"); });
  };
  var fil=$("insFil");
  if(fil){
    fil.value=INSFIL;
    setInsQ();                      /* 그려 놓은 표의 상태만 맞춥니다 — 여기서 draw() 를 부르면 끝없이 되돌아옵니다 */
    fil.onchange=function(){ INSFIL=fil.value; setInsQ(); draw(); };
  }
  function setInsQ(){
    var st=ts("unp");
    st.q = INSFIL==="cancel" ? "취소 요청"
         : INSFIL==="plate"  ? "차량번호"
         : INSFIL;
    st.page=1;
  }
  var line=$("insLine");
  if(line){
    var ins=0; INS.forEach(function(r){ ins+=(r.ins||0); });
    line.innerHTML='모두 <b>'+won(INS.length)+'건</b> · 보험사 청구 <b>'+won(ins)+'원</b>';
  }
  function xls(only){
    var list = only ? INS.filter(insCancel) : INS;
    if(!list.length){ tell("내려받을 것이 없습니다","해당하는 줄이 없습니다."); return; }
    var h=["차대번호","성능번호","차량번호","차명","점검일","딜러","상사",
           "카모두 기록","보험사 청구","딜러에게 받은 것","찾은 방법","할 일"];
    var b=list.map(function(r){ return [r.vin,r.no,r.plate,r.car,r.date,r.dealer,r.comp,
      r.pay,r.ins,r.ours,r.how,r.state]; });
    if(typeof XLSX==="undefined"){ bar("엑셀 도구를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침(F5)해 주세요.","err"); return; }   /* v39 */
    var wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([h].concat(b)),
      only?"청구 취소 요청":"보험료 대조");
    XLSX.writeFile(wb,"차곳간체크_보험료"+(only?"_취소요청":"")+"_"+ST.ym+".xlsx");
  }
  var a=$("insXls"); if(a) a.onclick=function(){ xls(false); };
  var c2=$("insCxl");
  if(c2) c2.onclick=function(){
    var list=INS.filter(insCancel);
    var amt=0; list.forEach(function(r){ amt+=(r.ins||0); });
    ask({ title:"보험사에 청구 취소를 넣어요",
      sub: ymText(ST.ym)+"분 · 목록을 엑셀로 내려받아요",
      k1:"취소할 건수", v1:won(list.length)+'<span style="font-size:14px">건</span>',
      k2:"취소할 금액", v2:won(amt)+'<span style="font-size:14px">원</span>',
      rows:list.slice(0,12).map(function(r){
        return [esc(r.plate)+' <span style="color:var(--muted);font-weight:600">'+
          (r.pay==="P"?"면제 P":"못 받음 N")+'</span>', won(r.ins)+"원"]; }),
      warn:"엑셀을 보험사에 보내 취소를 요청하시면 돼요. 차곳간체크가 보험사로 직접 보내지는 않아요.",
      yes:"엑셀 내려받기" }, function(){ xls(true); });

function delivAct(what){
  var ids=picked("drv");
  if(what==="fill"){
    bar("차량 장부에서 빈 차명을 채우는 중…","info"); busy(true);
    call("deliv_fillBlanks",[ST.key]).then(function(r){
      busy(false); bar(won((r&&r.n)||0)+"건의 차명을 채웠어요.","ok"); refresh(["deliv"]);
    }).catch(fail);
    return;
  }
  if(!ids.length){ bar("먼저 왼쪽 네모로 줄을 골라 주세요.","err"); return; }
  if(what==="resend"){
    askPicked(won(ids.length)+"건에 알림을 다시 보낼까요?", drvRows(ids), "다시 보내기", function(){
    bar(won(ids.length)+"건을 다시 보내는 중…","info"); busy(true);
    call("deliv_resend",[ST.key,ids]).then(function(r){
      busy(false); clearPick("drv");
      bar("다시 보냄 — 성공 "+won((r&&r.ok)||0)+"건 · 실패 "+won((r&&r.bad)||0)+"건","ok");
      refresh(["deliv"]);
    }).catch(fail);
    }, "딜러에게 문자(알림톡)가 다시 나가요.");
  } else if(what==="cancel"){
    askPicked(won(ids.length)+"건을 취소로 표시할까요?", drvRows(ids), "취소 표시", function(){
    busy(true);
    call("deliv_cancel",[ST.key,ids,false]).then(function(){
      busy(false); clearPick("drv"); bar(won(ids.length)+"건을 취소로 표시했어요.","ok"); refresh(["deliv"]);
    }).catch(fail);
    });
  } else if(what==="trash"){
    askPicked(won(ids.length)+"건을 휴지통으로 보낼까요?", drvRows(ids), "휴지통으로", function(){
    busy(true);
    call("deliv_trash",[ST.key,ids,false,ST.who]).then(function(){
      busy(false); clearPick("drv"); bar(won(ids.length)+"건을 휴지통으로 보냈어요.","ok");
      refresh(["deliv","delivtrash"]);
    }).catch(fail);
  });
  }
}

      bar((r&&r.ok)?"다시 보냈습니다.":"보내지 못했습니다 — 연락처를 확인해 주세요.",(r&&r.ok)?"ok":"err");

    }).catch(fail);

  };

            (r.made||[]).slice(0,10).join(" · ")+((r.made||[]).length>10?" 외":""))
          : "넣을 이름이 없어요. 이미 다 들어 있어요.", r.n?"ok":"info");
      DEALERS=[]; refresh(["set","up","bill"]);
    }).catch(function(e){ busy(false); say("xlMsg",(e&&e.message)||"안 됐습니다.","err"); });
  });

  var mk=$("xlMake"); if(mk) mk.onclick=function(){ addMissing(ST.ym); };

  if(f) f.onchange=function(){
