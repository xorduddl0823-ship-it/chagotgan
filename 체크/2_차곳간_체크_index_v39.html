/* ═══════════ 엑셀 읽기 ═══════════ */
/* 열 이름 읽기 — ① 똑같은 이름을 먼저 잡고 ② 남은 것만 비슷한 이름으로 잡습니다.
   («차명» 과 «차종», «보험료납부» 와 «보험료납부일» 이 서로 덮어쓰던 것을 막습니다) */
var XEXACT={
  "성능번호":"성능번호","성능점검번호":"성능번호","점검번호":"성능번호",
  "검사일":"검사일","점검일":"검사일","작업일":"검사일","성능점검일":"검사일",
  "차량번호":"차량번호","등록번호":"차량번호","차번":"차량번호",
  "차대번호":"차대번호","차대":"차대번호","VIN":"차대번호",
  "차명":"차명","모델":"차명","모델명":"차명","차량명":"차명","차량모델":"차명",
  "회사명":"회사명","상사명":"회사명","상사":"회사명","매매상사":"회사명",
  "신청인":"신청인","딜러":"신청인","의뢰인":"신청인","딜러명":"신청인","담당딜러":"신청인",
  "상품명":"상품명","상품":"상품명","품목":"상품명",
  "금액":"금액","검사비":"금액","수수료":"금액",
  "성능보험료":"성능보험료","청구보험료":"성능보험료","보험료":"성능보험료","보증보험료":"성능보험료",
  "보험료납부":"보험료납부","납부":"보험료납부","납부여부":"보험료납부",
  "작업내용":"작업내용","정비내용":"작업내용","내용":"작업내용","사유":"작업내용",
  "면제":"면제"
};
/* 아래 이름은 절대 쓰지 않습니다 (비슷해 보여도 다른 칸입니다) */
var XSKIP=["접수일","보험료납부일","입금일","결제","차종","주행거리","년식","사고","변속기",
  "진단이력","검사자","비고","연료","순번","번호",
  /* 보험사 청구서에 같이 오는, 우리가 안 쓰는 칸들 */
  "책임보험료","특약보험료","특약상품","보험사","보험증권번호","보험상태","이전일","이전내역",
  "사유","국/외","국외","120일초과","증권번호"];
var XFUZZY={
  "성능번호":["성능"], "검사일":["일자","날짜"], "차량번호":["번호판"],
  "차명":["차이름"], "회사명":["소속"], "신청인":["담당"],
  "금액":["공급가"], "성능보험료":["보증"], "작업내용":["항목"]
};
function xHeaderMap(headRow){
  var map={}, used={};
  var names=(headRow||[]).map(function(h){ return String(h==null?"":h).replace(/\s/g,""); });
  /* ① 똑같은 이름 */
  names.forEach(function(t,c){
    if(!t || XSKIP.indexOf(t)>=0) return;
    var k=XEXACT[t];
    if(k && !used[k]){ map[c]=k; used[k]=1; }
  });
  /* ② 남은 칸만 비슷한 이름으로 */
  names.forEach(function(t,c){
    if(!t || map[c] || XSKIP.indexOf(t)>=0) return;
    for(var k in XFUZZY){
      if(used[k]) continue;
      for(var i=0;i<XFUZZY[k].length;i++){
        if(t.indexOf(XFUZZY[k][i])>=0){ map[c]=k; used[k]=1; return; }
      }
    }
  });
  return map;
}
function xDate(v){
  if(v==null||v==="") return "";
  if(typeof v==="number"){               /* 엑셀 날짜 숫자 */
    var d=new Date(Math.round((v-25569)*86400000));
    return d.toISOString().slice(0,10);
  }
  var t=String(v).trim().replace(/[.\/]/g,"-").replace(/\s.*$/,"");
  var m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return m[1]+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[3]).slice(-2);
  var m2=t.match(/^(\d{4})(\d{2})(\d{2})$/);
  if(m2) return m2[1]+"-"+m2[2]+"-"+m2[3];
  return "";
}
function xNum(v){ return Number(String(v==null?"":v).replace(/[^0-9.-]/g,""))||0; }

/* 엑셀 파일 하나를 줄 목록으로 */
function readExcel(file){
  return new Promise(function(done, bad){
    var fr=new FileReader();
    fr.onerror=function(){ bad(new Error(file.name+" 을 읽지 못했습니다.")); };
    fr.onload=function(){
      try{
        if(typeof XLSX==="undefined"){ bad(new Error("엑셀 도구를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침(F5)해 주세요.")); return; }   /* v39 */
        var wb=XLSX.read(new Uint8Array(fr.result), {type:"array"});
        var best=null;
        wb.SheetNames.forEach(function(nm){
          if(/작성안내|안내|도움말|설명/.test(nm)) return;
          var aoa=XLSX.utils.sheet_to_json(wb.Sheets[nm], {header:1, raw:true, defval:""});
          for(var i=0;i<Math.min(aoa.length,15);i++){
            var map=xHeaderMap(aoa[i]);
            var keys=Object.keys(map);
            if(keys.length<3) continue;                 /* 아는 칸이 3개는 있어야 머리줄 */
            var rows=[];
            for(var j=i+1;j<aoa.length;j++){
              var line=aoa[j]||[], o={}, any=false;
              keys.forEach(function(c){
                var k=map[c], v=line[c];
                if(v!=="" && v!=null) any=true;
                if(k==="검사일") o[k]=xDate(v);
                else if(k==="금액"||k==="성능보험료") o[k]=xNum(v);
                else o[k]=String(v==null?"":v).trim();
              });
              if(any) rows.push(o);
            }
            if(!best || rows.length>best.rows.length)
              best={sheet:nm, rows:rows, cols:keys.map(function(c){return map[c];})};
            break;
          }
        });
        if(!best || !best.rows.length){
          bad(new Error(file.name+" 에서 읽을 줄을 못 찾았습니다. 첫 줄에 열 이름(성능번호 · 차량번호 · 검사일 …)이 있는지 봐 주세요."));
          return;
        }
        done(best);
      }catch(e){ try{ console.warn(file.name, e); }catch(e2){} bad(new Error(file.name+" 을 읽지 못했습니다. 엑셀 파일(xlsx · xls · csv)인지 확인해 주세요.")); }
    };
    fr.readAsArrayBuffer(file);
  });
}
/* 파일 이름에 든 달을 읽습니다 — 202608 · 2026-08 · 2026_08 */
function ymFromName(name){
  var n=String(name||"");
  var m=n.match(/(20\d{2})[._\-]?(0[1-9]|1[0-2])(?!\d)/);
  return m ? m[1]+"-"+m[2] : "";
}
/* 파일 이름과 열 모양으로 무슨 엑셀인지 알아냅니다 */
function guessKind(name, cols){
  var n=String(name||"");
  if(/carcheck|차량리스트|접수차량/i.test(n)) return "접수리스트";
  if(/전산외/.test(n)) return "전산외";
  if(/정비/.test(n)) return "정비비";
  if(/청구보험료|보험료|보험/.test(n)) return "청구보험료";
  if(/접수|리스트/.test(n)) return "접수리스트";
  if(cols.indexOf("작업내용")>=0) return "정비비";
  if(cols.indexOf("성능보험료")>=0 && cols.indexOf("상품명")<0 && cols.indexOf("금액")<0) return "청구보험료";
  if(cols.indexOf("상품명")>=0 || cols.indexOf("검사일")>=0) return "접수리스트";
  return "";
}
/* 엑셀 한 장을 1,000줄씩 나눠 보냅니다 (14,000줄도 올라갑니다) */
function putOne(kind, rows, file, where, ym){
  ym = ym || ST.ym;
  var SIZE=1000, at=0, got=0, total=rows.length;
  return new Promise(function(done, bad){
    (function step(){
      if(at>=total){
        /* 마지막 — 기록을 남기고 딜러를 이어붙입니다 */
        call("excelPut",[kind, [], ym, {file:file, first:false, last:true, total:got}])
          .then(function(){ done(got); }).catch(bad);
        return;
      }
      var part=rows.slice(at, at+SIZE);
      say(where, file+" → "+kind+" "+won(Math.min(at+SIZE,total))+" / "+won(total)+"줄 올리는 중…","info");
      call("excelPut",[kind, part, ym,
        {file:file, first:(at===0), last:false, total:total}])
        .then(function(r){ got+=(r&&r.n)||part.length; at+=SIZE; step(); })
        .catch(bad);
    })();
  });
}
/* 엑셀 여러 개를 차례로 올립니다 */
function putExcels(files, where){
  var list=[].slice.call(files||[]);
  if(!list.length) return;
  var i=0, done=[], bad=[];
  busy(true);
  (function next(){
    if(i>=list.length){
      busy(false);
      say(where, (done.length? "다 올렸어요 — "+done.join(" · ")+(/보험/.test(done.join(" "))?" (대조까지 끝냈어요)":"") : "")+
                 (bad.length? (done.length?" / ":"")+"안 된 것 : "+bad.join(" / ") : ""),
          bad.length?"err":"ok");
      refresh(["set","up","bill","ins"]);
      return;
    }
    var f=list[i++];
    say(where, f.name+" 읽는 중…","info");
    readExcel(f).then(function(res){
      var kind=guessKind(f.name, res.cols);
      if(!kind){ bad.push(f.name+" (무슨 엑셀인지 모르겠어요)"); next(); return; }
      /* 정비비 · 청구보험료는 파일 이름에 달이 있으면 그 달로 넣습니다 */
      var ym=ST.ym;
      if(kind==="청구보험료"||kind==="정비비"){ var g=ymFromName(f.name); if(g) ym=g; }
      return putOne(kind, res.rows, f.name, where, ym).then(function(n){
        done.push(kind+" "+won(n)+"줄"+(ym!==ST.ym?" ("+ymText(ym)+"분)":"")); next();
      });
    }).catch(function(e){ bad.push((e&&e.message)||f.name); next(); });
  })();
}
/* 끌어다 놓기 · 눌러서 고르기를 한꺼번에 붙입니다 */
function dropZone(boxId, inputId, where){
  var box=$(boxId), inp=$(inputId);
  if(!box||!inp) return;
  box.onclick=function(){ inp.click(); };
  inp.onchange=function(){ putExcels(inp.files, where); inp.value=""; };
  ["dragenter","dragover"].forEach(function(ev){
    box.addEventListener(ev,function(e){ e.preventDefault(); box.style.borderColor="var(--brand)";
      box.style.background="var(--brand-soft)"; });
  });
  ["dragleave","drop"].forEach(function(ev){
    box.addEventListener(ev,function(e){ e.preventDefault(); box.style.borderColor=""; box.style.background=""; });
  });
  box.addEventListener("drop",function(e){
    e.preventDefault();
    putExcels(e.dataTransfer && e.dataTransfer.files, where);
  });
}

/* ═══ 가온정산 «전체 옮기기 파일» 가져오기 ═══ */
function runImport(text){
  var o; try{ o=JSON.parse(text); }catch(e){ o=null; }
  if(!o){ say("impMsg","파일을 읽지 못했습니다.","err"); return; }
  function pick(v){
    if(v==null) return null;
    if(typeof v==="object") return v;
    try{ return JSON.parse(v); }catch(e){ return null; }
  }
  var cfg=null, carBox=null;
  if(o.__type==="gaon-move" && o.data){
    cfg=pick(o.data["gaon.tools.cfg.v1"]); carBox=pick(o.data["gaon.tools.cars.v1"]);
  } else if(o.__type==="gaon-tools" && o.cfg){ cfg=o.cfg; }
  else if(o.bands || o.companies || o.dealers){ cfg=o; }
  if(!cfg && !carBox){
    say("impMsg","가온정산에서 만든 «전체 옮기기 파일»이 아닙니다. 설정 → 설정 백업 → «전체 옮기기 파일 만들기»로 받은 파일을 넣어 주세요.","err");
    return;
  }
  var jobs=[];
  if(cfg && cfg.supplier) jobs.push(["office","검사소 정보",[cfg.supplier]]);
  if(cfg && cfg.bands && cfg.bands.length)
    jobs.push(["band","단가표", cfg.bands.map(function(b){
      return { from:String(b.from||"").slice(0,10), items:b.items||[] }; })]);
  if(cfg && cfg.companies && cfg.companies.length)
    jobs.push(["company","매매상사", cfg.companies.map(function(c){
      return { 상사명:c.상사명||c.상호||"", 사업자등록번호:c.사업자등록번호||"",
               대표자:c.대표자||"", 주소:c.사업장주소||"", 전화:c.전화||c.연락처||"",
               담당자:c.담당자||"", 담당자휴대폰:c.담당자휴대폰||"" };
    }).filter(function(c){ return c.상사명; })]);
  if(cfg && cfg.dealers && cfg.dealers.length)
    jobs.push(["dealer","딜러", cfg.dealers.map(function(d){
      var hasBiz=!!String(d.사업자등록번호||"").trim();
      return { 딜러:String(d.딜러||"").trim(), 소속:d.소속||"", 휴대폰:d.휴대폰||"",
               추가번호:d.추가번호||[],
               발행근거: hasBiz ? "딜러 사업자" : (d.소속 ? "소속 상사" : "미등록"),
               발행처: d.상호||"", 사업자등록번호: d.사업자등록번호||"",
               계산서발행여부: d.계산서발행여부||"" };
    }).filter(function(d){ return d.딜러; })]);
  if(carBox && carBox.rows){
    var list=[];
    Object.keys(carBox.rows).forEach(function(plate){
      var o2=carBox.rows[plate]; if(!o2) return;
      var all=(o2.all && o2.all.length) ? o2.all : [o2];
      all.forEach(function(x){
        if(!x || !String(x.date||"").slice(0,10)) return;
        list.push({ 성능번호:x.no||"", 차량번호:plate, 차명:x.car||"",
                    검사일:String(x.date).slice(0,10), 회사명:x.comp||"",
                    신청인:x.dealer||"", 상품명:x.goods||"", 금액:x.fee||0,
                    성능보험료:x.ins||0, 보험료납부:x.pay||"N" });
      });
    });
    if(list.length) jobs.push(["car","차량", list]);
  }
  if(!jobs.length){ say("impMsg","옮길 자료가 없습니다.","err"); return; }
  var i=0, done=[]; busy(true);
  (function next(){
    if(i>=jobs.length){
      say("impMsg","다 옮겼어요 — "+done.join(" · "),"ok"); busy(false);
      LOADED={}; DEALERS=[]; call("dataCount",[]).then(function(c){ COUNTS=c||{}; draw(); });
      return;
    }
    var j=jobs[i];
    sendChunks(j[0], j[2], j[1], function(n){ done.push(j[1]+" "+won(n)); i++; next(); },
      function(e){ say("impMsg", j[1]+" 옮기다 멈췄습니다 : "+e.message, "err"); busy(false); });
  })();
}
function sendChunks(part, rows, label, ok, bad){
  var size=400, at=0, got=0;
  (function go2(){
    if(at>=rows.length){ ok(got); return; }
    var chunk=rows.slice(at, at+size);
    say("impMsg", label+" "+won(Math.min(at+size,rows.length))+" / "+won(rows.length)+" 옮기는 중…","info");
    call("importLegacy",[part, chunk]).then(function(r){
      got+=(r&&r.n)||chunk.length; at+=size; go2();
    }).catch(bad);
  })();
}

PAGE.partner=function(){

/* 선택한 딜러를 한 청구처로 묶습니다 — 맨 위에 고른 사람이 대표가 됩니다 */
function tieDealers(undo){
  var ids=picked("dlr");
  if(!ids.length){ bar("딜러를 먼저 골라 주세요. 이름 왼쪽 네모를 누르면 됩니다.","err"); return; }
  var nameOf={}; DEALERS.forEach(function(d){ nameOf[d.id]=d.name; });
  var names=ids.map(function(i){ return nameOf[i]||i; });
  if(undo){
    askPicked("딜러 "+won(ids.length)+"명의 묶음을 풀까요?", names.map(function(n){ return [n,""]; }), "묶음 풀기", function(){
    bar("묶음을 푸는 중…","info"); busy(true);
    call("billGroupSet",[ids, null, "always", ST.ym]).then(function(){
      busy(false); clearPick("dlr"); bar("묶음을 풀었어요.","ok"); refresh(["set","bill"]);
    }).catch(fail);
    });
    return;
  }
  if(ids.length<2){ bar("두 명 이상 골라 주세요. 맨 처음 고른 분이 청구 받는 분이 됩니다.","err"); return; }
  askPicked(names[0]+" 님 앞으로 "+won(ids.length-1)+"명을 묶을까요?", names.map(function(n,i){ return [n, i?"":"청구 받는 분"]; }), "묶기", function(){
  bar("묶는 중…","info"); busy(true);
  call("billGroupSet",[ids.slice(1), ids[0], "always", ST.ym]).then(function(){
    busy(false); clearPick("dlr");
    bar(names[0]+" 님 앞으로 "+(ids.length-1)+"명을 묶었어요.","ok"); refresh(["set","bill"]);
  }).catch(fail);
  });
}

function pbKo(msg){
  var m=String(msg||"");
  if(/-10010030|신규가입 API|가입 API/.test(m))
    return "팝빌이 «연동회원 신규가입 API»를 막아 두었습니다. "+

      "팝빌에 그 기능을 열어 달라고 신청하시면 됩니다.";
  if(/이미 가입|-10010010/.test(m))
    return "이미 가입된 사업자번호입니다. 오른쪽 «이미 회원이면 — 아이디만 저장하고 연결» 을 누르세요.";

    return "그 팝빌 아이디는 이미 쓰고 있습니다. 다른 아이디로 적어 주세요.";

    m=m.replace(new RegExp("\\b"+k+"\\b","g"), PBFLD[k]);

  return m.replace("설정 → 거래처에서 먼저 채워 주세요.","바로 위 칸에 적고 다시 눌러 주세요.");

<!-- ===== 차곳간 공통: 요금제 · 캐시 · 공지 (워시와 같은 모듈, check-api 로 부름) ===== -->
<script>
/* ===== 요금제·사용량 표시 =====
   실제로는 서버(me / login)가 내려주는 값으로 채웁니다.
   지금은 시안이라 아래 PLAN 을 바꿔가며 보여줍니다. */
(function(){
  var PLAN = null, open = false;

  function won(n){ return (Number(n)||0).toLocaleString("ko-KR"); }
  function esc(v){ return String(v==null?"":v).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  /* 상태 판정 */
  function tone(p){
    if(!p) return "";
    if(p.trial) return "";
    if(p.smsStop) return "bad";
    if(p.smsLeft===0) return "bad";
    if(p.daysLeft<=0) return "bad";
    if(p.daysLeft<=7) return "warn";
    if(p.taxLeft===0 && p.taxFree>0) return "warn";
    return "";
  }
  function band(p){
    if(!p) return null;
    if(p.trial){
      if(p.smsFree>0 && p.smsLeft===0) return {t:"warn", b:"무료 문자를 다 썼어요. 충전하면 다시 보낼 수 있어요.",
        s:"체험 무료 건수를 모두 썼어요 · 충전하시면 바로 다시 나가요", go:"문자 충전하기"};
      if(p.daysLeft!=null && p.daysLeft<=0) return {t:"bad", b:"무료 체험 기간이 끝났어요.",
        s:"요금제를 정하시면 문자가 다시 나가요", go:"요금제 보기"};
      if(p.daysLeft!=null && p.daysLeft<=7) return {t:"warn", b:p.daysLeft+"일 뒤에 무료 체험이 끝나요.",
        s:"미리 요금제를 정해 두시면 끊기지 않아요", go:"요금제 보기"};
      return null;
    }
    if(p.smsStop) return {t:"bad", b:"문자 발송이 멈췄어요. 충전해야 다시 나가요.",
      s:"자료 올리기와 청구서 만들기는 그대로 돼요 · 충전하시면 바로 다시 나가요", go:"지금 충전하기"};
    if(p.smsLeft===0) return {t:"warn", b:"무료 문자를 다 썼어요. 충전하면 다시 보낼 수 있어요.",
      s:"지금 보내는 문자는 곧 멈춰요 · 충전하시면 바로 다시 나가요", go:"문자 충전하기"};
    if(p.daysLeft<=0) return {t:"bad", b:"이용 기간이 지났어요.",
      s:"연장하셔야 문자가 다시 나가요", go:"지금 연장하기"};
    if(p.daysLeft<=7) return {t:"warn", b:p.daysLeft+"일 뒤에 이용이 멈춰요.",
      s:"미리 연장해 두시면 끊기지 않아요", go:"연장하기"};
    return null;
  }

  var NAR = false;   /* 띠가 들어갈 자리가 좁은지 — 창이 아니라 띠 자신의 폭으로 봅니다 */
  function chips(p){
    var c=[], n=NAR;
    function ch(k,v,t,cl){ return '<span class="pl-chip'+(cl?" "+cl:"")+(t?" "+t:"")+'">'+
      (k?'<span class="k">'+esc(k)+'</span>':'')+'<span class="v">'+esc(v)+'</span></span>'; }
    if(p.trial){
      c.push(ch(n?"":"요금제","무료 체험","","pl-p"));
      c.push(ch(n?"":"남은 기간",
        (p.daysLeft==null?"기한 없음":(p.daysLeft>0?p.daysLeft+"일":"지남")),
        (p.daysLeft!=null&&p.daysLeft<=0)?"bad":((p.daysLeft!=null&&p.daysLeft<=7)?"warn":""),"pl-d"));
      c.push(ch("문자",
        (p.smsFree>0? (won(p.smsLeft)+(n?"":"건")) : "넉넉"),
        (p.smsFree>0&&p.smsLeft===0)?"bad":"","pl-s"));
      c.push(ch("계산서",
        (p.taxFree>0? (won(p.taxLeft)+(n?"":"건")) : "넉넉"),
        (p.taxFree>0&&p.taxLeft===0)?"warn":"","pl-t"));
      return c.join("");
    }
    c.push(ch(n?"":"요금제", p.name, "", "pl-p"));
    c.push(ch(n?"":"남은 기간", p.daysLeft>0 ? p.daysLeft+"일" : "지남",
      p.daysLeft<=0?"bad":(p.daysLeft<=7?"warn":""), "pl-d"));
    c.push(ch("문자", p.smsStop ? "멈춤" : (won(p.smsLeft)+(n?"":"건")),
      (p.smsStop||p.smsLeft===0)?"bad":"", "pl-s"));
    c.push(ch("계산서", p.taxFree>0 ? (won(p.taxLeft)+(n?"":"건")) : "—",
      (p.taxFree>0&&p.taxLeft===0)?"warn":"", "pl-t"));
    return c.join("");
  }

  function detail(p){
    function cell(o){
      return '<div class="pmCell'+(o.tone?" "+o.tone:"")+'">'+
        '<div class="t">'+esc(o.t)+'</div><div class="v">'+o.v+'</div>'+
        '<div class="s">'+esc(o.s)+'</div>'+
        '<div class="pmBar"><i style="width:'+(o.pct||0)+'%"></i></div>'+
        (o.nt?'<div class="nt">'+esc(o.nt)+'</div>':'')+'</div>';
    }
    var cells, tag, sub, foot;
    if(p.trial){
      var tDay=(p.daysLeft==null)?null:Math.max(0,p.daysLeft);
      tag=(p.smsFree>0&&p.smsLeft===0)?["문자 소진","bad"]
         :((tDay!=null&&tDay<=7)?["곧 만료","warn"]:["이용 중",""]);
      sub=p.shop+" · 무료 체험 · 결제 시스템이 준비되면 요금제로 바뀌어요";
      cells=[
        cell({t:"남은 기간",
              v:(tDay==null?"기한 없음":tDay+'<small>일</small>'),
              s:(p.until?p.until+"까지 무료로 쓰실 수 있어요":"테스트 기간 동안 계속 쓰실 수 있어요"),
              pct:(tDay==null?100:Math.max(0,Math.min(100,Math.round(tDay/60*100)))),
              tone:(tDay!=null&&tDay<=0)?"bad":((tDay!=null&&tDay<=7)?"warn":"")}),
        cell(p.smsFree>0
          ? {t:"문자", v:won(p.smsLeft)+'<small>건 남음</small>',
             s:"체험 무료 "+won(p.smsFree)+"건 중 "+won(Math.max(0,p.smsFree-(p.smsLeft-(p.smsPaid||0))))+"건 사용",
             pct:Math.round(Math.max(0,p.smsFree-(p.smsLeft-(p.smsPaid||0)))/p.smsFree*100),
             tone:(p.smsLeft===0)?"bad":"",
             nt:(p.smsLeft===0?"충전해야 계속 보낼 수 있어요":"")}
          : {t:"문자",v:"넉넉",s:"테스트 중에는 건수를 세지 않아요",pct:12}),
        cell(p.taxFree>0

         shop = (typeof ST!=="undefined" && ST.shop) || localStorage.getItem("cgg_shop") || ""; }catch(e){}

    /* 체크 열쇠(chk_)가 아니면(워시 열쇠로 들어온 경우) 워시 서버가 다른 업체로 보고 거절함 — 미리 안내 */
    if(String(sid).indexOf("chk_") !== 0)

    return fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify({shop:shop,token:sid,fn:fn,args:args||[]})})
      .then(function(r){ return r.text(); },function(){ throw {message:"서버에 연결하지 못했습니다"}; })
      .then(function(t){

            (l.memo?('<br><span style="font-size:11.5px;color:#667389">'+esc2(l.memo)+'</span>'):'')+'</span>'+
          '<span style="font-size:13px;font-weight:800;white-space:nowrap;color:'+(dd>0?"#1A7F4B":"#14202E")+'">'+
            (dd>0?"+":"")+w(dd)+'</span>'+
          '<span style="font-size:11.5px;color:#667389;white-space:nowrap;min-width:64px;text-align:right">'+
            w(l.bal_after)+'</span></div>';
      }).join("") : '<div style="padding:16px;text-align:center;color:#667389;font-size:13px">아직 쓰신 내역이 없습니다.</div>')+
      '</div>'+
      '<div class="sheetbtns" style="margin-top:16px"><button class="btn" data-cwclose style="flex:1">닫기</button></div>';

    cashBox(h);

    var amt = document.getElementById("cwAmt");
    function calc(){ /* 건수 환산은 보여 주지 않습니다 — 단가가 역산됩니다 */
      var el = document.getElementById("cwCalc");
      if (el) el.textContent = "유효기간 — 넣은 날부터 1년";
    }
    amt.oninput = calc; calc();
    Array.prototype.forEach.call(document.querySelectorAll("[data-cw]"), function(b){
      b.onclick = function(){ amt.value = b.getAttribute("data-cw"); calc(); };
    });
    var cardBtn = document.getElementById("cwCard");
    function cwRange(v){ if(v < 10000 || v > 3000000){ document.getElementById("cwMsg").innerHTML =
        '<span style="color:#C0392B">1만 원부터 300만 원까지 충전할 수 있어요.</span>'; return false; } return true; }
    if(cardBtn) cardBtn.onclick = function(){ var v=Number(amt.value)||0; if(!cwRange(v)) return; cwPay("cash", v, 0); };
    var planBtn = document.getElementById("cwPlanPay");
    if(planBtn) planBtn.onclick = function(){
      var q = CW.due || {};
      var uc = 0;
      var ck = document.getElementById("cwUseCash");
      if(ck && ck.checked) uc = Math.min(Number((CW.data&&CW.data.balance)||0), Number(q.full||0));
      cwPay("plan", 0, uc);
    };
    document.getElementById("cwAsk").onclick = function(){
      var v = Number(amt.value)||0;
      if(!cwRange(v)) return;
      this.disabled = true;
      cwRpc("cashAsk",[v,""]).then(function(){
        document.getElementById("cwMsg").innerHTML =
          '<span style="color:#1A7F4B">신청했습니다. 입금이 확인되면 바로 넣어 드립니다.</span>';
        try{ window.ccwCashRefresh(); }catch(e){}
      }).catch(function(e){
        document.getElementById("cwAsk").disabled = false;
        document.getElementById("cwMsg").innerHTML =
          '<span style="color:#C0392B">'+esc2((e&&e.message)||"신청하지 못했습니다")+'</span>';
      });
    };
  }

  /* ===== 카드 결제 ===== */
  /* v120: 서버(sb10)가 sdk:"v2" 를 주면 v2 창, 옛 서버면 v1 창 */
  var TOSSVER = "";
  function loadToss(ver){
    ver = ver === "v2" ? "v2" : "v1";
    return new Promise(function(res, rej){
      if(window.TossPayments && (TOSSVER === ver || window.TossPayments.__preview)) return res(window.TossPayments);
      if(TOSSVER && TOSSVER !== ver) return rej({message:"결제 창을 다시 열려면 화면을 새로고침해 주세요"});
      TOSSVER = ver;
      var sc = document.createElement("script");
      sc.src = ver === "v2" ? "https://js.tosspayments.com/v2/standard" : "https://js.tosspayments.com/v1/payment";
      sc.onload = function(){ res(window.TossPayments); };
      sc.onerror = function(){ rej({message:"카드 결제 창을 불러오지 못했습니다"}); };
      document.head.appendChild(sc);
    });
  }
  var MSGID = "cwMsg";
  function cwMsg(html){
    var el = document.getElementById(MSGID) || document.getElementById("cwMsg");
    if(el) el.innerHTML = html;
  }
  function cwPay(kind, amount, useCash, msgId){
    MSGID = msgId || "cwMsg";
    cwMsg('<span style="color:#667389">결제 준비 중입니다…</span>');
    cwRpc("payStart",[kind, amount, useCash]).then(function(r){
      if(!r || r.ok === false){
        cwMsg('<span style="color:#B45309">'+esc2((r&&r.note)||"카드 결제는 아직 준비 중입니다")+'</span>');
        return;
      }
      if(r.done){   /* 캐시만으로 다 낸 경우 */
        cwMsg('<span style="color:#1A7F4B">캐시로 결제했습니다.</span>');
        try{ window.ccwCashRefresh(); }catch(e){}
        return;
      }
      try{ localStorage.setItem("ccw_pay", JSON.stringify({orderId:r.orderId, amount:r.amount, kind:kind})); }catch(e){}
      var v2 = r.sdk === "v2";
      return loadToss(v2 ? "v2" : "v1").then(function(TP){
        var back = location.origin + location.pathname;
        var tp = TP(r.clientKey);
        if(v2){
          var ck = (!r.customerKey || r.customerKey === "ANONYMOUS") ? TP.ANONYMOUS : r.customerKey;
          return tp.payment({customerKey: ck}).requestPayment({
            method: "CARD",
            amount: {currency: "KRW", value: r.amount},
            orderId: r.orderId, orderName: r.orderName,
            customerName: r.customerName,
            successUrl: back + "?pay=ok",
            failUrl:    back + "?pay=no"
          });
        }
        return tp.requestPayment("카드", {
          amount: r.amount, orderId: r.orderId, orderName: r.orderName,
          customerName: r.customerName,
          successUrl: back + "?pay=ok",
          failUrl:    back + "?pay=no"
        });
      });
    }).catch(function(e){
      cwMsg('<span style="color:#C0392B">'+esc2((e&&e.message)||"결제하지 못했습니다")+'</span>');
    });
  }

  /* 카드사 창에서 돌아왔을 때 — 주소에 붙어 온 값으로 승인을 끝냅니다 */
  function afterPay(){
    try{
      var q = new URLSearchParams(location.search);
      if(!q.get("pay")) return;
      var ok  = q.get("pay") === "ok";
      var pk  = q.get("paymentKey") || "";
      var oid = q.get("orderId") || "";
      var amt = Number(q.get("amount") || 0);
      var clean = location.origin + location.pathname;
      try{ history.replaceState(null, "", clean); }catch(e){}
      if(!ok){
        var why = q.get("message") || "결제가 취소되었습니다";
        setTimeout(function(){
          cashBox('<h3 style="margin:0 0 6px">결제가 되지 않았습니다</h3>'+
            '<div style="border:1px solid #F0B9B4;background:#FCEDEB;border-radius:12px;padding:14px 16px;'+
            'font-size:14px;line-height:1.8;color:#7A2018">'+esc2(why)+'</div>'+
            '<div class="sheetbtns" style="margin-top:16px"><button class="btn" data-cwclose style="flex:1">닫기</button></div>');
        }, 700);
        return;
      }
      if(!pk || !oid) return;
      setTimeout(function(){
        cashBox('<h3 style="margin:0 0 6px">결제 확인 중</h3><div class="sub">잠시만 기다려 주세요…</div>');
        cwRpc("payConfirm",[oid, pk, amt]).then(function(r){
          try{ localStorage.removeItem("ccw_pay"); }catch(e){}
          try{ window.ccwCashRefresh(); }catch(e){}
          cashBox('<h3 style="margin:0 0 6px">결제가 끝났습니다</h3>'+
            '<div style="border:1px solid #B7E4CC;background:#E9F6EF;border-radius:12px;padding:14px 16px;'+
            'font-size:14.5px;line-height:1.8;color:#14532D">'+
            w(amt)+' 결제되었습니다.'+
            (r && r.balance !== undefined ? ('<br>남은 캐시 <b>'+w(r.balance)+'</b>') : '')+'</div>'+
            '<div class="sheetbtns" style="margin-top:16px">'+
            '<button class="btn primary" data-cwclose style="flex:1">확인</button></div>');
        }).catch(function(e){
          cashBox('<h3 style="margin:0 0 6px">결제 확인을 못 했습니다</h3>'+
            '<div style="border:1px solid #F0B9B4;background:#FCEDEB;border-radius:12px;padding:14px 16px;'+
            'font-size:14px;line-height:1.8;color:#7A2018">'+
            esc2((e&&e.message)||"")+'<br><br>돈이 빠졌는데 이 창이 나오면 차곳간으로 연락해 주세요. '+
            '주문번호 '+esc2(oid)+'</div>'+
            '<div class="sheetbtns" style="margin-top:16px"><button class="btn" data-cwclose style="flex:1">닫기</button></div>');
        });
      }, 700);
    }catch(e){}
  }
  try{
    if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", function(){ setTimeout(afterPay, 1200); });
    else setTimeout(afterPay, 1200);
  }catch(e){}

  /* v122 · 결제 확인표 W5 — 내 결제 내역 (payMine) */
  var PAYST={paid:["완료","#1E9E5A"],ready:["결제 중","#1668C4"],failed:["실패","#D64545"],canceled:["환불","#B26B00"]};
  var PAYKIND={plan:"이용요금",cash:"캐시 충전"};
  function payHist(){
    cashBox('<h3 style="margin:0 0 6px">결제 내역</h3><div class="sub">불러오는 중이에요…</div>');
    cwRpc("payMine",[]).then(function(r){
      var L=((r&&r.orders)||[]).slice(0,50);
      cashBox('<h3 style="margin:0 0 4px">결제 내역</h3><div class="sub" style="margin-bottom:12px">최근 '+L.length+'건 · 영수증은 결제할 때 토스가 보내 드린 안내에서 볼 수 있어요</div>'+
        '<div style="border:1px solid #DDE3EC;border-radius:12px;max-height:56vh;overflow:auto">'+
        (L.length?L.map(function(o){var st=PAYST[o.status]||[o.status||"-","#667085"];
          return '<div style="display:flex;gap:10px;align-items:center;padding:11px 13px;border-bottom:1px solid #EEF2F7;font-size:13.5px">'+
            '<span style="min-width:74px;color:#667085;font-size:12px">'+esc2(String(o.paid_at||o.created_at||"").slice(0,10))+'</span>'+
            '<span style="flex:1;min-width:0">'+esc2(o.order_name||PAYKIND[o.kind]||"-")+'<br><small style="color:#667085">'+esc2(PAYKIND[o.kind]||o.kind||"")+(o.method?' · '+esc2(o.method):'')+(Number(o.use_cash)>0?' · 캐시 '+w(o.use_cash):'')+'</small></span>'+
            '<b style="white-space:nowrap">'+w(o.amount)+'</b>'+
            '<span style="min-width:52px;text-align:center;font-size:12px;font-weight:700;color:'+st[1]+'">'+esc2(st[0])+'</span></div>';}).join("")
          :'<div style="padding:16px;text-align:center;color:#667085;font-size:13px">아직 결제한 내역이 없어요.</div>')+'</div>'+
        '<div class="sheetbtns" style="margin-top:14px"><button class="btn" type="button" id="phBack">이용요금 창으로</button><button class="btn" data-cwclose>닫기</button></div>');
      var bk=document.getElementById("phBack"); if(bk) bk.onclick=function(){ window.ccwPlanPay(); };
    }).catch(function(e){
      cashBox('<h3 style="margin:0 0 6px">결제 내역</h3><div style="color:#C0392B;font-size:14px">'+esc2((e&&e.message)||"불러오지 못했어요")+'</div>'+
        '<div class="sheetbtns" style="margin-top:14px"><button class="btn" data-cwclose>닫기</button></div>');
    });
  }
  document.addEventListener("click",function(ev){ var t=ev.target&&ev.target.closest&&ev.target.closest("[data-pvhist]"); if(t){ ev.preventDefault(); payHist(); } });
  window.ccwPayHist = payHist;

  /* 요금제만 결제하는 창 */
  window.ccwPlanPay = function(){
    if(!cashAllowed()){
      cashBox('<h3 style="margin:0 0 6px">이용요금</h3>'+
        '<div class="sub" style="margin-bottom:14px">대표님만 보실 수 있습니다</div>'+
        '<div style="border:1px solid #DDE3EC;background:#F8FAFD;border-radius:12px;padding:14px 16px;'+
        'font-size:14px;line-height:1.8">요금 결제는 <b>대표 계정</b>에서만 됩니다.</div>'+
        '<div class="sheetbtns" style="margin-top:16px"><button class="btn" data-cwclose style="flex:1">닫기</button></div>');
      return;
    }
    cashBox('<h3 style="margin:0 0 6px">이번 달 이용요금</h3><div class="sub">불러오는 중입니다…</div>');
    Promise.all([
      cwRpc("payDue",[]),
      cwRpc("cashInfo",[]).catch(function(){ return null; })
    ]).then(function(rs){
      var q = rs[0] || {};
      var ci = rs[1] || {};
      if(q.off || q.notLinked){ offNotice(q.note); return; }   /* v31: 이 검사소에 지갑이 아직 안 이어짐 */
      CW.due = q;
      if(ci && ci.on) { CW.data = ci; BAL.on = true; BAL.bal = Number(ci.balance||0); BAL.at = Date.now(); paintChip(true); }
      var bal = Number((ci && ci.balance) || 0);

      if(q.trial){
        cashBox('<h3 style="margin:0 0 6px">이번 달 이용요금</h3>'+
          '<div class="sub" style="margin-bottom:14px">지금은 무료 체험 중입니다</div>'+
          '<div style="border:1px solid #BBD8F5;background:#EAF3FD;border-radius:12px;padding:14px 16px;'+
          'font-size:14.5px;line-height:1.8">무료 체험 기간에는 내실 요금이 없습니다.<br>'+
          '체험이 끝나기 전에 차곳간에서 안내 문자를 보내드립니다.</div>'+
          '<div class="sheetbtns" style="margin-top:16px"><button class="btn" data-cwclose style="flex:1">닫기</button></div>');
        return;
      }
      if(q.paid){
        cashBox('<h3 style="margin:0 0 6px">이번 달 이용요금</h3>'+
          '<div class="sub" style="margin-bottom:14px">'+esc2(q.planName)+' · '+esc2(q.period)+'</div>'+
          '<div style="border:1px solid #B7E4CC;background:#E9F6EF;border-radius:12px;padding:14px 16px;'+
          'font-size:14.5px;line-height:1.8;color:#14532D"><b>이번 달은 이미 결제하셨습니다.</b><br>'+
          '이용기한 '+esc2(String(q.paidUntil||"").slice(0,10))+' 까지</div>'+
          '<div class="sheetbtns" style="margin-top:16px"><button class="btn" type="button" data-pvhist="1">결제 내역</button><button class="btn" data-cwclose style="flex:1">닫기</button></div>');
        return;
      }

      var use = Math.min(bal, Number(q.full||0));
      var rest = Math.max(0, Number(q.full||0) - use);
      var h =
        '<h3 style="margin:0 0 4px">이번 달 이용요금</h3>'+
        '<div class="sub" style="margin-bottom:14px">'+esc2(q.planName)+' · '+esc2(q.period)+'</div>'+
        '<div style="border:1px solid #DDE3EC;border-radius:12px;padding:14px 16px;font-size:14px;line-height:2">'+
          '<div style="display:flex"><span style="flex:1;color:#667389">이용요금</span><b>'+w(q.price)+'</b></div>'+
          '<div style="display:flex"><span style="flex:1;color:#667389">부가세</span><b>'+w(q.vat)+'</b></div>'+
          '<div style="display:flex;border-top:1px solid #EEF2F7;margin-top:6px;padding-top:6px">'+
            '<span style="flex:1;font-weight:800">모두</span>'+
            '<b style="font-size:18px">'+w(q.full)+'</b></div>'+
        '</div>';

      if(bal > 0){
        h += '<div style="margin-top:12px;border:1px solid #BBD8F5;background:#EAF3FD;border-radius:12px;'+
          'padding:13px 15px;font-size:13.5px;line-height:1.9">'+
          '남은 캐시 <b>'+w(bal)+'</b><br>'+
          '<label style="display:flex;gap:8px;align-items:center;margin-top:6px;cursor:pointer">'+
          '<input type="checkbox" id="pvUse" checked style="width:18px;height:18px"> '+
          '캐시로 '+w(use)+' 먼저 내기</label>'+
          '<div id="pvCalc" style="margin-top:6px;color:#0E4E9B;font-weight:700"></div></div>';
      }

      h += (q.pgOn
        ? '<button class="btn primary" id="pvGo" style="width:100%;margin-top:14px;padding:13px;font-size:15px">카드로 결제</button>'
        : '<div style="margin-top:12px;border:1px solid #DDE3EC;background:#F8FAFD;border-radius:11px;'+
          'padding:12px 14px;font-size:13px;color:#667389;line-height:1.8">'+
          esc2(q.note || "카드 결제는 준비 중입니다.")+'<br>계좌로 입금해 주시면 차곳간에서 확인하고 처리해 드립니다.</div>')+
        '<div id="pvMsg" style="margin-top:8px;font-size:13px"></div>'+
        '<div class="sheetbtns" style="margin-top:14px">'+
        '<button class="btn" type="button" data-pvhist="1">결제 내역</button>'+
        '<button class="btn" id="pvCash" style="flex:1">캐시 충전 화면</button>'+
        '<button class="btn" data-cwclose style="flex:1">닫기</button></div>';

      cashBox(h);

      function calc(){
        var ck = document.getElementById("pvUse");
        var u = (ck && ck.checked) ? use : 0;
        var el = document.getElementById("pvCalc");
        if(el) el.textContent = "카드로 낼 금액 " + w(Math.max(0, Number(q.full||0) - u));
        return u;
      }
      var ck2 = document.getElementById("pvUse");
      if(ck2) ck2.onchange = calc;
      calc();
      var go = document.getElementById("pvGo");
      if(go) go.onclick = function(){
        var u = calc();
        document.getElementById("pvMsg").innerHTML = '<span style="color:#667389">결제 준비 중입니다…</span>';
        cwPay("plan", 0, u, "pvMsg");
      };
      var cb = document.getElementById("pvCash");
      if(cb) cb.onclick = function(){ window.ccwCashOpen(); };
    }).catch(function(e){
      cashBox('<h3 style="margin:0 0 6px">이번 달 이용요금</h3>'+
        '<div style="border:1px solid #F0B9B4;background:#FCEDEB;border-radius:12px;padding:14px 16px;'+
        'font-size:14px;line-height:1.8;color:#7A2018">'+esc2((e&&e.message)||"불러오지 못했습니다")+'</div>'+
        '<div class="sheetbtns" style="margin-top:16px"><button class="btn" data-cwclose style="flex:1">닫기</button></div>');
    });
  };

  /* 밖에서 부르는 문 */
  /* 다른 조각(잠금 안내)에서도 이 창을 쓸 수 있게 열어 둡니다 */
  window.ccwBox = cashBox;

  window.ccwCashOpen = function(){
    if(!cashAllowed()){
      cashBox('<h3 style="margin:0 0 6px">캐시 지갑</h3>'+
        '<div class="sub" style="margin-bottom:14px">대표님만 보실 수 있습니다</div>'+
        '<div style="border:1px solid #DDE3EC;background:#F8FAFD;border-radius:12px;padding:14px 16px;'+
        'font-size:14px;line-height:1.8;color:#14202E">'+
        '충전과 캐시 확인은 <b>대표 계정</b>에서만 됩니다.<br>'+
        '대표님께 말씀해 주세요.</div>'+
        '<div class="sheetbtns" style="margin-top:16px"><button class="btn" data-cwclose style="flex:1">닫기</button></div>');
      return;
    }
    if(CW.busy) return;
    CW.busy = true;
    cashBox('<h3 style="margin:0 0 6px">내 캐시</h3><div class="sub">불러오는 중입니다…</div>');
    Promise.all([
      cwRpc("cashInfo",[]),
      cwRpc("payDue",[]).catch(function(){ return null; })
    ]).then(function(rs){
      var r = rs[0];
      CW.busy = false;
      CW.due = rs[1];
      if(!r || r.on === false || r.off || r.ok === false){ offNotice(r && r.note); return; }   /* v31: 지갑 안 이어짐(notLinked) 포함 */
      CW.data = r;
      BAL.on = !!r.on; BAL.bal = Number(r.balance||0); BAL.at = Date.now();
      paintChip(true);
      draw();
    }).catch(function(e){
      CW.busy = false;
      offNotice("지금은 이용하실 수 없습니다.\n" + ((e&&e.message)||""));
    });
  };

  /* 캐시는 «대표»만 다룹니다. PC든 현장이든 상관없습니다.
     대표님이 밖에 계실 때 휴대폰으로도 충전하실 수 있어야 하니까요.
     직원 계정에는 아예 보이지 않습니다. */
  function cashAllowed(){
    try{

    var sid=(function(){ try{ var k=(typeof ST!=="undefined" && ST.key) || localStorage.getItem("cgg_key") || ""; return String(k).indexOf("chk_")===0 ? k : ""; }catch(e){ return ""; } })();   /* v34: 체크 열쇠 */
    if(!sid) return Promise.resolve([]);
    NT.busy = rpcN("noticeList",[]).then(function(r){
      NT.list=(r&&r.list)||[]; NT.at=Date.now();
      return NT.list;
    }).catch(function(){ return NT.list||[]; })
      .then(function(v){ NT.busy=null; paintDot(); return v; });
    return NT.busy;
  }

  /* 안 읽은 공지가 있으면 버튼에 빨간 점 */
  function unreadCount(){
    var hid=hidLocal();
    return (NT.list||[]).filter(function(n){
      return !n.seen && hid.indexOf(n.id)<0;
    }).length;
  }
  function paintDot(){
    var b=document.getElementById("ccwNotiBtn"); if(!b) return;
    var n=unreadCount();
    b.innerHTML = '공지사항' + (n?('<span class="ntDot">'+n+'</span>'):'');
  }

  /* ── 공지 목록 창 (탭: 전체 · 업데이트 · 요금 · 기타) ── */
  window.ccwNotice = function(kind){
    if(kind) NT.tab=kind;
    box('<h3 style="margin:0 0 6px">공지사항</h3><div class="sub">불러오는 중이에요…</div>');
    load(true).then(function(list){ draw(list); });
  };
  function draw(list){
    var hid=hidLocal();
    var tabs=[["all","전체"],["update","업데이트"],["price","요금"],["etc","기타"]];
    var use=(NT.tab==="all")?list:list.filter(function(n){ return n.kind===NT.tab; });

    var h='<h3 style="margin:0 0 10px">공지사항</h3>'+
      '<div class="ntTabs">'+tabs.map(function(t){
        var c=(t[0]==="all")?list.length:list.filter(function(n){return n.kind===t[0];}).length;
        return '<button data-nt="'+t[0]+'"'+(NT.tab===t[0]?' class="on"':'')+'>'+t[1]+
               (c?(' <i>'+c+'</i>'):'')+'</button>';
      }).join("")+'</div>';

    if(!use.length){
      h+='<div style="border:1px solid #DDE3EC;background:#F8FAFD;border-radius:12px;padding:20px 16px;'+
         'font-size:14px;color:#667389;text-align:center">올라온 공지가 없어요.</div>';
    }else{
      h+='<div class="ntList">'+use.map(function(n){
        var isNew = !n.seen && hid.indexOf(n.id)<0;
        return '<div class="ntItem'+(n.pin?" pin":"")+'" data-no="'+n.id+'">'+
          '<div class="ntHd">'+
            '<span class="ntK k-'+e4(n.kind)+'">'+e4(KIND[n.kind]||"기타")+'</span>'+
            (n.pin?'<span class="ntK pinK">중요</span>':'')+
            (isNew?'<span class="ntK newK">새 글</span>':'')+
            '<span class="ntDay">'+e4(day(n.at))+'</span></div>'+
          '<div class="ntTt">'+e4(n.title)+'</div>'+
          '<div class="ntBd">'+nl(n.body)+'</div></div>';
      }).join("")+'</div>';
    }
    h+='<div class="sheetbtns" style="margin-top:14px">'+
       '<button class="btn" data-cwclose style="flex:1">닫기</button></div>';
    box(h);

    var sh=document.getElementById("sheet"); if(!sh) return;
    Array.prototype.forEach.call(sh.querySelectorAll("[data-nt]"),function(b){
      b.onclick=function(){ NT.tab=b.getAttribute("data-nt"); draw(list); };
    });
    /* 목록을 열어 본 것만으로 «읽음» 으로 치지는 않습니다 (창으로 뜨는 것만 따로 셉니다) */
  }

  /* ── 로그인할 때 뜨는 안내창 ── */
  function popNext(queue, i){
    if(i >= queue.length){ close(); return; }
    var n=queue[i];
    box('<h3 style="margin:0 0 4px">'+e4(n.title)+'</h3>'+
      '<div class="sub" style="margin-bottom:12px">'+
        '<span class="ntK k-'+e4(n.kind)+'">'+e4(KIND[n.kind]||"기타")+'</span> '+
        e4(day(n.at))+(queue.length>1?(' · '+(i+1)+' / '+queue.length):'')+'</div>'+
      '<div style="border:1px solid #DDE3EC;background:#F8FAFD;border-radius:12px;padding:14px 16px;'+
      'font-size:14.5px;line-height:1.9;max-height:46vh;overflow:auto">'+nl(n.body)+'</div>'+
      '<div class="sheetbtns" style="margin-top:16px">'+
        '<button class="btn" id="ntNever" style="flex:1">다시 보지 않기</button>'+
        '<button class="btn primary" id="ntOk" style="flex:1">확인</button></div>');
    var go=function(){ setTimeout(function(){ popNext(queue, i+1); }, 120); };
    var ok=document.getElementById("ntOk");
    var nv=document.getElementById("ntNever");
    if(ok) ok.onclick=go;
    if(nv) nv.onclick=function(){
      hidAdd(n.id);
      n.seen=true;
      rpcN("noticeHide",[n.id]).catch(function(){});
      paintDot();
      go();
    };
  }
  function popIfAny(){
    if(NT.popped) return;
    var sid=(function(){ try{ var k=(typeof ST!=="undefined" && ST.key) || localStorage.getItem("cgg_key") || ""; return String(k).indexOf("chk_")===0 ? k : ""; }catch(e){ return ""; } })();   /* v34: 체크 열쇠 */
    if(!sid) return;
    NT.popped=true;
    load(true).then(function(list){
      var hid=hidLocal();
      var q=(list||[]).filter(function(n){
        return n.pop && !n.seen && hid.indexOf(n.id)<0;
      }).slice(0,3);
      if(!q.length) return;
      /* 다른 창(잠금 안내 등)과 겹치지 않게 조금 기다립니다 */
      setTimeout(function(){
        var sh=document.getElementById("sheet");
        if(sh && sh.classList.contains("show")) return;   /* 이미 다른 창이 떠 있으면 다음에 */
        popNext(q, 0);
      }, 2200);
    });
  }

  /* ── 머리말에 버튼 하나 ── */
  function hook(){
    try{
      if(document.getElementById("ccwNotiBtn")) { paintDot(); return; }
      var host=document.getElementById("btnHelp") || document.getElementById("btnRefresh");
      if(!host || !host.parentNode) return;
      var b=document.createElement("button");
      b.type="button"; b.id="ccwNotiBtn"; b.className=host.className || "mini";
      b.title="차곳간 공지사항";
      b.innerHTML="공지사항";
      b.onclick=function(){ window.ccwNotice(); };
      host.parentNode.insertBefore(b, host);
      paintDot();
    }catch(e){}
  }

  try{
    var st=document.createElement("style");
    st.textContent=
      "#ccwNotiBtn{position:relative}"+
      ".ntDot{display:inline-block;min-width:16px;height:16px;line-height:16px;padding:0 4px;margin-left:4px;"+
        "border-radius:99px;background:#C0392B;color:#fff;font-size:10.5px;font-weight:800;text-align:center}"+
      ".ntTabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}"+
      ".ntTabs button{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--surface);"+
        "color:var(--text);border-radius:999px;padding:7px 13px;cursor:pointer}"+
      ".ntTabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}"+
      ".ntTabs button i{font-style:normal;opacity:.7;font-size:11.5px}"+
      ".ntList{max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:9px}"+
      ".ntItem{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}"+
      ".ntItem.pin{border-color:var(--brand)}"+
      ".ntHd{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:5px}"+
      ".ntK{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:800}"+
      ".ntK.k-update{background:#E7F2FC;color:#1668C4}"+
      ".ntK.k-price{background:#FDF4E5;color:#9a4b06}"+
      ".ntK.k-etc{background:var(--surface2);color:var(--muted)}"+
      ".ntK.pinK{background:#EAF3FD;color:#0E4E9B}"+
      ".ntK.newK{background:#C0392B;color:#fff}"+
      ".ntDay{margin-left:auto;font-size:12px;color:var(--muted)}"+
      ".ntTt{font-size:15px;font-weight:800;margin-bottom:5px}"+
      ".ntBd{font-size:13.5px;line-height:1.85;color:var(--text);white-space:normal}"+
      "@media(max-width:560px){.ntDay{margin-left:0;width:100%}}";
    document.head.appendChild(st);
  }catch(e){}

  setInterval(hook, 1500);
  try{
    if(document.readyState==="loading")
      document.addEventListener("DOMContentLoaded",function(){ setTimeout(function(){ hook(); popIfAny(); },1800); });
    else setTimeout(function(){ hook(); popIfAny(); },1800);
  }catch(e){}
  window.ccwNoticeRefresh=function(){ NT.popped=false; return load(true); };
})();

</script>

<!-- ===== 차곳간 UI 1.0 — 머리말 버튼 차례를 워시와 같게 ===== -->
<script>
(function(){
  /* 워시와 같은 차례: 공지 · 도움말 · 주소 · 새로고침 · 자동 · 연결 · 휴지통 · 마이페이지
     「화면(밝기)」은 마이페이지 창의 「화면」 칸으로 옮겼습니다. */
  var ORDER = ["ccwNotiBtn","btnHelp","btnLink","btnRefresh","pollSel","dbState","btnTrash","hWho"];
  function fix(){
    var host = document.getElementById("hWho");
    host = host && host.parentNode;
    if (!host) return;
    var th = document.getElementById("btnTheme");
    if (th) th.style.display = "none";          /* 마이페이지 안으로 옮김 */
    ORDER.forEach(function(id){
      var el = document.getElementById(id);
      if (el && el.parentNode === host) host.appendChild(el);
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", fix);
  else fix();
  setTimeout(fix, 300); setTimeout(fix, 1200);   /* 공지 버튼이 늦게 생겨도 맞춥니다 */
  /* 공지 버튼은 나중에 만들어지므로, 생긴 뒤 딱 한 번만 더 맞춥니다 */
  var done = false;
  var tick = setInterval(function(){
    if (done) { clearInterval(tick); return; }
    var n = document.getElementById("ccwNotiBtn");
    if (!n) return;
    done = true; clearInterval(tick); fix();
  }, 250);
  setTimeout(function(){ done = true; clearInterval(tick); }, 10000);
})();
</script>

<!-- ═══════ 차곳간 UI 1.0 — 마지막 손질 (앞의 규칙보다 뒤에 있어야 이깁니다) ═══════
     워시·체크 두 제품에 똑같이 들어갑니다. -->
<style>
/* ═══════ 차곳간 공통 UI — cgg-ui 1.1 (이 블록만 갈아 끼우면 디자인이 바뀝니다) ═══════ */
/* ════════════════════════════════════════════════════════════════════
   차곳간 공통 UI 규격  ·  cgg-ui 1.1  ·  2026-10-12
   워시 · 체크 · 관리가 똑같이 쓰는 한 벌입니다.

   새 디자인을 입히실 때는 이 파일만 갈아 끼우면 됩니다.
   아래 「이름표」를 그대로 쓰시면 세 제품이 한 번에 맞습니다.

     머리말    .bizname b / .bizname small / #hVer · #hdVer / #btnTrash / .trbdg
     홈 격자   .dash.homegrid > .hgL / .hgR
     달력      .dow / .cal / .cal .d / .cal .n / .cal .todaytag / .cal .amt
               .cal .cars / .cal .bar / .cal .memo / .legend
     할 일     .todo > button / .cnt / .tx / .go / .imp / .imptag
               .memo-todo / .todoMore
     카드      .card / .card h2 · h3 / .csub / .rt
     숫자 칸   .sums / .sums.c5 / .sum / .sum span / .sum b / .sum.bad
     줄        .kv / .mini-row / .prog / .legend / .sumline
     표        .tablebox / thead th / td / .c-name / .c-chk / .num / .mid
               .ar / .pager / .pager .pg / .empty
   ════════════════════════════════════════════════════════════════════ */


/* ───────── 1. 머리말 ───────── */
.bizname b{font-size:19px;font-weight:900;letter-spacing:-.03em;line-height:1.25;
  -webkit-text-stroke:0;paint-order:normal}
.bizname small{font-size:11.5px;line-height:1.35;opacity:.78}
#hVer,#hdVer{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
#hdWho{display:none!important}                 /* 사람 글씨는 마이페이지 안으로 */
#btnTrash{background:var(--brand-soft);border-color:#C6E0F8;color:#10508F;font-weight:700}
.trbdg{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 5px;
  margin-left:3px;border-radius:9px;background:var(--danger);color:#fff;
  font-size:10.5px;font-weight:900;line-height:1}


/* ───────── 2. 홈 머리 ───────── */
.dashhead{margin:0 0 14px}
.dashhead .dh-row{display:flex;align-items:center;gap:10px}
.dashhead h2{font-size:26px;font-weight:900;letter-spacing:-.03em;margin:0}
.dashhead .sub2,.sub2{font-size:13px;color:var(--muted);margin-top:2px}


/* ───────── 3. 홈 격자 ─────────
   왼쪽 = 일정(달력) 한 장, 오른쪽 = 오늘 할 일 · 이번 달 수금 · 이번 달 일감.
   일정 카드가 오른쪽 줄 «아래 끝»까지 내려오고, 남는 높이는 달력 칸이 나눠 갖습니다. */
.dash,.homegrid{margin-bottom:14px}
.dash{align-items:stretch}
.dash>div:first-child{display:flex;flex-direction:column}
.dash>div:first-child>.card:first-child{flex:1 1 auto;display:flex;flex-direction:column;
  margin-bottom:0}
.dash>div:first-child>.card:first-child .cal{flex:1 1 auto}
.homegrid{align-items:stretch}
.homegrid>.hgL,.homegrid>.hgR{display:grid;gap:14px;min-width:0}
.homegrid>.hgR{align-content:start}
.homegrid>.hgL{display:flex;flex-direction:column}
.homegrid>.hgL>.card{flex:1 1 auto;display:flex;flex-direction:column;margin-bottom:0}
.homegrid>.hgL .cal{flex:1 1 auto}
/* 두 칸의 마지막 카드 아래 여백을 없애 끝선을 딱 맞춥니다 */
.hgR>.card:last-child,.dash>div:last-child>.card:last-child{margin-bottom:0}


/* ───────── 4. 달력 ─────────
   요일 줄은 격자 «밖». 칸은 최소 44px, 남는 높이는 고르게 나눠 가집니다. */
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0 6px}
.dow span{text-align:center;font-size:12px;font-weight:800;color:var(--muted)}
.dow .sun{color:var(--danger)}
.dow .sat{color:var(--brand)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:0;
  grid-auto-rows:minmax(44px,1fr)}
.cal .d{display:block;height:auto;min-height:44px;border:1px solid var(--line);
  border-radius:10px;padding:6px 7px;background:var(--surface2);cursor:pointer;overflow:hidden}
.cal .d.blank,.cal .d.out{border:0;background:transparent;cursor:default}
.cal .d:hover{border-color:var(--brand)}
.cal .d.today{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft);
  background:var(--brand-soft)}
.cal .n{font-size:12px;font-weight:800;color:var(--muted)}
.cal .n.sun{color:var(--danger)}
.cal .n.sat{color:var(--brand)}
.cal .todaytag{display:inline-block;margin-left:5px;padding:1px 6px;border-radius:5px;
  background:#FFE9BF;color:#7A5410;font-size:10px;font-weight:800;vertical-align:1px}
.cal .amt{font-size:13.5px;font-weight:900;margin-top:5px;letter-spacing:-.02em}
.cal .cars{font-size:11px;color:var(--muted);margin-top:1px}
.cal .bar{height:3px;border-radius:2px;background:var(--brand);margin-top:4px;opacity:.85}
.cal .memo{display:block;font-size:11px;font-weight:700;color:#8a4a00;background:#fff1e0;
  border-radius:6px;padding:1px 5px;margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .memo.done{color:var(--muted);background:var(--surface2);
  text-decoration:line-through;font-weight:500}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend b{color:var(--text)}


/* ───────── 5. 오늘 할 일 ─────────
   바깥은 회색 바탕, 항목은 흰색. 급한 것은 빨강 + 「중요」, 메모는 주황.
   세 개만 보이고 나머지는 「모두 보기」로 가운데 창에 띄웁니다. */
.todo{display:grid;grid-template-columns:1fr;gap:8px;align-items:stretch;
  background:#F4F6F9;border:1px solid var(--line);border-radius:12px;padding:10px}
.todo button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  font-family:inherit;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--text)}
.todo button:hover{border-color:var(--brand)}
.todo button.imp{background:#fdecec;border:2px solid #d93025;
  box-shadow:0 2px 10px rgba(217,48,37,.15)}
.todo button.imp .cnt{color:#c5221f;font-size:24px}
.todo button.imp .tx b{color:#a50e0e;font-size:15.5px}
.todo button.memo-todo{background:#fff7ec;border-color:#f0c48a}
.todo button.memo-todo .cnt{color:#b45309;font-size:15px}
.todo .cnt{font-size:20px;font-weight:900;min-width:38px;text-align:center;color:var(--brand)}
.todo .tx{flex:1;min-width:0}
.todo .tx b{display:block;font-size:14.5px;font-weight:800}
.todo .tx span{font-size:12px;color:var(--muted)}
.todo .go{color:var(--muted);font-size:18px}
.imptag{display:inline-block;background:#d93025;color:#fff;font-size:11px;font-weight:900;
  border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:2px}
.todoMore{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;

.sums.c5{grid-template-columns:repeat(5,1fr)}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:11px 12px;text-align:center}
.sum span{display:block;font-size:11px;color:var(--muted);font-weight:700}
.sum b{font-size:17px;font-weight:900;letter-spacing:-.02em}
.sum.bad b,.sum b .rd,.rd{color:var(--danger)}

.kv,.mini-row{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;

.prog{height:12px;border-radius:7px;background:var(--surface2);overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;background:var(--good)}
.sumline,.callegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;
  color:var(--muted);margin-top:6px}
.sumline b{color:var(--text)}


/* ───────── 7. 표 ─────────
   머리 고정 · 이름 칸 틀고정 · 큰 체크칸 · 쪽 넘김 「처음 이전 N/M 다음 맨뒤」 */
.tablebox{border:1px solid var(--line);border-radius:12px;overflow:auto;background:var(--surface)}

.cgg-right .hb{height:32px;padding:0 11px;border-radius:10px;border:1px solid #ffffff30;background:#ffffff12;color:#fff;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}

.cgg-right select.hb option{color:#101828;background:#fff}
@media (min-width:1000px){ .lay-side .cgg-right .hb,.lay-icon .cgg-right .hb{height:40px;border-color:var(--ln2);background:var(--surface);color:var(--btn-ink)} }
.cgg-right .t-narrow{display:none}
@media (max-width:600px){ .cgg-right .t-wide{display:none} .cgg-right .t-narrow{display:inline} }
.cgg-main #main{margin:0}
.cgg-sublbl{flex:none;align-self:center;font-size:11.5px;font-weight:800;color:var(--muted);margin:0 2px 0 8px}
.cgg-sublbl:first-child{margin-left:0}
.cgg-more{margin:-6px 0 16px}
.cgg-more .todoMore{width:100%;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:13.5px;cursor:pointer}
.cgg-todo-list{margin:0;padding-left:20px;line-height:1.8;font-size:14px;color:var(--text)}
.cgg-todo-list b{font-weight:800}
/* v33: 층 순서 (cgg-j4 1.1) — 숫자 대신 이름 */
.sheetbg{z-index:var(--z-dialog)} .sheet{z-index:calc(var(--z-dialog) + 1)} .ovl{z-index:calc(var(--z-dialog) + 2)}
.cgg-right .me{position:relative}
/* v39: 오픈 베타 띠 — 홈페이지 시안 «넣은 안»과 같은 모양 */
:root{--beta:#0d2440;--beta-ink:#e8f0fb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--beta:#1d3a5f}}
:root[data-theme="dark"]{--beta:#1d3a5f}
.cgg-beta{background:var(--beta);color:var(--beta-ink);font-size:13.5px;padding:8px 16px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center;line-height:1.5}
.cgg-beta b{background:var(--beta-ink);color:var(--beta);border-radius:6px;padding:0 7px;font-size:12px;letter-spacing:.04em}
.cgg-main>.cgg-beta{margin:0 0 14px;border-radius:12px}
#root>.cgg-beta{border-radius:0}
@media (max-width:600px){ .cgg-beta{font-size:12.5px;padding:7px 12px;gap:6px} .cgg-main>.cgg-beta{border-radius:10px;margin-bottom:10px} }
/* v35: 표 거르기 줄 — 체크의 고르기 칸은 알약 모양, 일괄 버튼은 공통 흰 버튼 (공통 표에 «일괄 버튼» 칸이 없어 여기서) */
.cgg-filters select{height:32px;min-height:0;width:auto;border:1px dashed var(--ln2);border-radius:999px;padding:0 13px;font:inherit;font-size:13px;color:var(--btn-ink);background:var(--surface);cursor:pointer}
/* v37: 일괄 버튼은 공통 cgg-btn sm 그대로 — 예전 button.btn 모양이 새지 않게 되돌림 */
.cgg-filters button.cgg-btn.sm.btn{min-height:auto;transform:none;border:1px solid var(--ln2);background:var(--surface);color:var(--btn-ink);font-weight:700}
.cgg-filters button.cgg-btn.sm.btn.danger{color:var(--stop)}
.cgg-filters button.cgg-btn.sm.btn[disabled]{opacity:.45;cursor:default}
.cgg-filters button[data-n]::after{content:" (" attr(data-n) ")"}
.cgg-table .cgg-st+.b{display:block;font-size:10.5px;color:var(--muted);line-height:1.2}
.cgg-table td .two{display:flex;flex-direction:column;line-height:1.25}
.cgg-table td>.a,.cgg-table td>.b{display:block;line-height:1.25;overflow:hidden;text-overflow:ellipsis}
.cgg-table td>.b,.cgg-table td .two .b{font-size:11.5px;font-weight:600;color:var(--muted)}
/* 표 상자 안은 공통 예시와 같은 바탕 글자(글꼴 · 15px · 줄 간격 기본) — 대조 차이 0 */
/* 예전 .card 안에 표가 있으면 카드 속 카드가 되지 않게 — 표를 카드 가장자리까지 */
.card>.tblk.cgg-card{margin:14px -16px 0;border-radius:0;box-shadow:none;border-top:1px solid var(--line)}
.card>.tblk.cgg-card:first-child{margin-top:-16px;border-top:0;border-radius:inherit;border-bottom-left-radius:0;border-bottom-right-radius:0}
.card>.tblk.cgg-card:last-child{margin-bottom:-16px;border-bottom-left-radius:inherit;border-bottom-right-radius:inherit}
.card:has(>.tblk.cgg-card){overflow:hidden;border:0;background:var(--surface);border-radius:var(--r-card);box-shadow:var(--sh);margin:0 0 16px}
@media (max-width:600px){ .card:has(>.tblk.cgg-card){border-radius:14px;margin-bottom:10px} }
.tblk .cgg-pager select,.tblk .cgg-mhead select{width:auto;min-height:auto}
.cgg-help p{white-space:pre-line}
.tblk.cgg-card{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:normal}
/* v34: 홈 달력 칸이 화면 너비 안에서 줄어들게 (태블릿 넘침 고침) */
.dow,.cal{grid-template-columns:repeat(7,minmax(0,1fr))}
.cal .d{min-width:0;overflow:hidden}
.homegrid>.hgL,.homegrid>.hgR,.homegrid .card{min-width:0}
@media(max-width:820px){.homegrid{grid-template-columns:minmax(0,1fr)}}
.staff-add{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.staff-add input,.staff-add select{height:43px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;font-size:14.5px;background:var(--surface);color:var(--text);min-width:0}
.staff-add #stName{flex:1 1 120px} .staff-add #stPhone{flex:1 1 150px} .staff-add select{flex:0 0 96px}
.staff-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.staff-t{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
.staff-t th,.staff-t td{padding:0 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.staff-t tr:last-child td{border-bottom:0}
.staff-btns{display:flex;gap:6px;justify-content:flex-end}
.staff-btns .btn{min-height:34px;height:34px;padding:0 10px;font-size:12.5px;border-radius:10px}
.cgg-allm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cgg-allm button{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:14.5px;font-weight:700;cursor:pointer;text-align:left}
.cgg-allm svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;color:var(--brand)}
.cgg-offpick input{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;font-size:16px;text-transform:uppercase;background:var(--surface);color:var(--text)}
</style>

<script>
/* ===== 체크 v24 — 공통 부품 부르기 ===== */
(function(){
  CGG.layout.init(document.getElementById("wrap"), "cgg_check_layout");
  /* 홈 할 일 카드 3장 — 「오늘 할 일」(TODOS)의 앞 3개 */
  var GOIC={deposit:"wallet",bill:"file",partner:"shop",hometax:"receipt",home:"today"};
  window.cggTodos=function(){
    var el=document.getElementById("cggActs"); if(!el) return;
    var list=(TODOS||[]).slice(0,3);
    CGG.todos(el, list.map(function(x){
      var memo=(x[1]==="memo");
      return { tone: x[1]==="r"?"stop": x[1]==="w"?"chk":"run", icon: GOIC[x[4]]||"file",
               title: memo? x[2] : (x[2]+" "+x[0]+"건"),
               sub: x[3] || (Number(x[0])? "눌러서 바로 처리해요" : "지금은 할 일이 없어요") }; }),
      function(i){ var t=list[i]; if(t && t[4] && t[4]!=="home") go(t[4]); });
    var more=document.getElementById("cggMore");
    if(more) more.innerHTML=(TODOS||[]).length>3
      ? '<button type="button" class="todoMore" id="todoMoreBtn">할 일 <b>'+TODOS.length+'건</b> 모두 보기</button>' : "";
  };
  /* v33: 사람 버튼 ▾ — 마이페이지 · 요금제 · 휴지통 · ― · 화면 설정 · ― · 로그아웃 (README 1.1 차례) */
  var hw=document.getElementById("hWho");
  if(hw){
    CGG.menu(hw, function(){ return {name:(ST&&ST.who)||"", role:(ST&&ST.role)==="owner"?"대표":"직원"}; }(), function(){
      var owner=(ST&&ST.role)==="owner";
      return [{key:"me",icon:"user",label:"마이페이지"}]
        .concat(owner?[{key:"plan",icon:"wallet",label:"요금제"}]:[])
        .concat([{key:"trash",icon:"trash",label:"휴지통"},"-",
                 {key:"lay",icon:"pc",label:"화면 설정",note:CGG.layout.name()},"-",
                 {key:"out",icon:"out",label:"로그아웃"}]);
    }, function(k){
      if(k==="me") chkMyPage();
      else if(k==="plan"){ try{ window.ccwPlanPay(); }catch(e){ bar("요금제 기능이 아직 준비 중이에요"); } }
      else if(k==="trash") go("trash");
      else if(k==="lay") cggScreenSet();
      else if(k==="out") $("btnOut").click();
    });
  }
  /* 화면 설정 창 — 메뉴 배치 + 밝기 */
  window.cggScreenSet=function(){
    var th=(function(){ try{ return localStorage.getItem("ccw_theme")||"auto"; }catch(e){ return "auto"; } })();
    $("sheet").innerHTML='<h3 style="margin:0 0 2px">화면 설정</h3><div style="color:var(--muted);font-size:12.5px;margin-bottom:12px">이 기기에만 저장돼요</div>'+
      '<div class="mcard"><div class="mh"><b>메뉴 배치</b><span>넓은 화면에서만 바뀌어요</span></div><div id="cggLay"></div></div>'+
      '<div class="mcard"><div class="mh"><b>밝기</b></div><div class="fzrow">'+
        [["auto","기기에 맞춤"],["light","밝게"],["dark","어둡게"]].map(function(x){
          return '<button type="button" class="btn" data-th="'+x[0]+'" aria-selected="'+(th===x[0])+'">'+x[1]+'</button>'; }).join("")+'</div></div>'+
      '<div class="sheetbtns"><button class="btn" id="scrClose">닫기</button></div>';
    openSheet();
    CGG.layout.chooser(document.getElementById("cggLay"), function(){ drawTabs(); });
    $("scrClose").onclick=closeSheet;
    Array.prototype.forEach.call($("sheet").querySelectorAll("[data-th]"),function(b){
      b.onclick=function(){ var v=b.getAttribute("data-th");
        try{ localStorage.setItem("ccw_theme",v); }catch(e){}
        if(v==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme",v);
        Array.prototype.forEach.call($("sheet").querySelectorAll("[data-th]"),function(x){ x.setAttribute("aria-selected", String(x===b)); }); }; });
  };
  /* (v24~v32: 마이페이지 안 메뉴 배치 칸 — v33 부터는 화면 설정 창으로 옮겨 이 덧붙임은 쓰지 않음) */
  if(false)
  if(typeof chkMyPage==="function"){
    var _mp=chkMyPage;
    window.chkMyPage=chkMyPage=function(){
      _mp.apply(this, arguments);
      var out=document.querySelector("#sheet .mpout"); if(!out) return;
      var box=document.createElement("div"); box.className="mcard";
      box.innerHTML='<div class="mh"><b>메뉴 배치</b><span>넓은 화면에서만 바뀌어요 · 이 기기에만 저장</span></div><div id="cggLay"></div>';
      out.parentNode.insertBefore(box, out);
      CGG.layout.chooser(document.getElementById("cggLay"), function(){ drawTabs(); });
    };
  }
  /* 서버 v24 — 관리 계정이 검사소를 안 골랐을 때 */
  var picking=false;
  window.cggPickOffice=function(){
    if(picking) return; picking=true;
    $("sheet").innerHTML='<h3 style="margin:0 0 4px">검사소를 선택해 주세요</h3>'+
      '<div style="color:var(--muted);font-size:13px;margin-bottom:12px">관리 계정은 들어갈 검사소 코드를 입력해야 해요.</div>'+
      '<div class="cgg-offpick"><input id="cggOff" placeholder="검사소 코드" autocomplete="off" value="'+esc(ST.shop||"")+'"></div>'+
      '<div class="sheetbtns"><button class="btn" id="offNo">닫기</button><button class="btn primary" id="offYes">이 검사소로 들어가기</button></div>';
    openSheet();
    function done(){ picking=false; }
    $("offNo").onclick=function(){ closeSheet(); done(); };
    $("offYes").onclick=function(){
      var v=String($("cggOff").value||"").trim().toUpperCase(); if(!v){ $("cggOff").focus(); return; }
      ST.shop=v; set("cgg_shop",v); LOADED={}; closeSheet(); done(); openApp(); };
  };
  if(!document.getElementById("wrap").hidden){ drawTabs(); if(typeof draw==="function") draw(); }
})();
</script>
</body>
</html>
