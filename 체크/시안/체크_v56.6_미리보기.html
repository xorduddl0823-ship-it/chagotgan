  /* 줄마다 차례로(한 번에 4개씩) — 하나가 안 돼도 나머지는 계속 */
  function each(list, fn, prog){
    var i=0, done=0, ok=0, fails=[], N=list.length;
    return new Promise(function(res){
      function next(){
        if(i>=N){ if(done>=N) res({n:ok, fails:fails}); return; }
        var x=list[i++];
        Promise.resolve().then(function(){ return fn(x); }).then(function(){ ok++; }, function(e){ fails.push({line:x.line, c:x.c, why:x.failWhy||"저장하지 못했어요. 다시 올려 주세요."}); })
          .then(function(){ done++; prog && prog(done, N); if(done>=N) res({n:ok, fails:fails}); else next(); });
      }
      if(!N) res({n:0, fails:[]}); for(var k=0;k<4;k++) next();
    }); }

  /* ════════ 거래처(상사 · 딜러) ════════ */
  var PCOLS=[{k:"comp", label:"상사 이름", alias:["상사","상사명","매매상사","매매상사명","소속상사","소속","회사명","상호","상호명","회사","업체","업체명","사업장","사업장명"]},
             {k:"name", label:"딜러 이름", alias:["딜러","딜러명","딜러이름","이름","성명","담당자","담당자명","종사원","종사원명","사원명"]},
             {k:"tel",  label:"휴대폰", alias:["핸드폰","휴대폰번호","휴대전화","휴대전화번호","핸드폰번호","hp","mobile","연락처","딜러연락처","전화","전화번호"]},
             {k:"no",   label:"사업자번호", alias:["사업자등록번호","사업자","등록번호","사업자no"]},
             {k:"ceo",  label:"대표자", alias:["대표","대표자명","대표이사","대표자성명"]},
             {k:"email",label:"이메일", alias:["메일","email","e-mail","전자우편","이메일주소"]},
             {k:"ctel", label:"상사 전화", alias:["대표전화","대표전호","대표번호","회사전화","사무실전화","상사전화"]},
             {k:"caddr",label:"상사 주소", alias:["상사주소","회사주소","사업장주소","본점주소"], solo:{ifNo:"name", alias:["주소","소재지"]}, max:200},
             {k:"stat", label:"재직 · 영업", alias:["재직여부","영업여부","재직상태","영업상태","재직","상태"]},
             {k:"tax",  label:"세금계산서", alias:["계산서","세금계산서발행"]}];
  function statOk(v){ return /^(재직|재직중|영업|영업중|정상|계속|계속사업자)$/.test(key(v)); }
  function taxOf(v){ var k=key(v);
    if(!k) return "";
    if(/^(상사|상사이름|상사이름으로|상사로|상사앞)$/.test(k)) return "co";
    if(/^(딜러본인|본인|딜러|개인사업자|본인이름으로)$/.test(k)) return "own";
    if(/^(안끊음|안함|없음|미발행|발행안함|x)$/.test(k)) return "none";
    if(/^(나중에|미정|모름)$/.test(k)) return "later";
    return null; }
  var TAXW={co:"상사 이름으로", own:"딜러 본인", none:"안 끊음", later:"나중에"};
  function checkPartners(o, recs){
    var have={}, haveNm={}, comps={}, seen={}, newComps={}, list=[];
    (o.dealers||[]).forEach(function(d){ var nk=key(d.comp)+"|"+key(d.name); have[nk+"|"+dig(d.tel)]=1; (haveNm[nk]=haveNm[nk]||[]).push(dig(d.tel)); });
    (o.companies||[]).forEach(function(c){ comps[key(c.name)]=c; });
    var skips={};
    recs.forEach(function(x){ var c=x.c, tel=telDig(c.tel), no=dig(c.no), why=[], notes=[], ct=telDig(c.ctel);
      if(x.ex){ x.st="ex"; x.why="양식의 예시 줄이라 건너뛰어요."; list.push(x); return; }
      if(c.stat && !statOk(c.stat)){ var sv=String(c.stat).trim().slice(0,10); skips[sv]=(skips[sv]||0)+1; x.st="skip"; x.why="재직 · 영업 칸이 «"+sv+"»라 건너뛰어요."; list.push(x); return; }
      if(ct && (ct.length<8 || ct.length>12)){ ct=""; notes.push("상사 전화가 맞지 않아 뺐어요"); }
      else if(ct && ct===dig(c.ctel)) ct=String(c.ctel).trim();   /* 0이 안 지워졌으면 적힌 모양(02-123-4567) 그대로 */
      var tax=taxOf(c.tax);
      if(!c.comp && !c.name) why.push("상사 이름이나 딜러 이름을 넣어 주세요");
      if(tel && !telOk(tel)) why.push("휴대폰 번호가 맞지 않아요(010으로 시작하는 10~11자리)");
      if(no && !bizOk(no)) why.push("사업자번호가 맞지 않아요");
      if(c.email && !emailOk(c.email)) why.push("이메일 모양이 맞지 않아요");
      if(tax===null) why.push("세금계산서 칸은 «상사 이름으로 · 딜러 본인 · 안 끊음 · 나중에» 중 하나로 적어 주세요");
      if(c.name && tax==="co" && !c.comp) why.push("«상사 이름으로»는 상사 이름이 있어야 해요");
      if(why.length){ x.st="bad"; x.why=why.join(" · "); list.push(x); return; }
      if(!tax) tax=o.later?"later":(c.comp?"co":"none");
      if(tax==="later" && !o.later) tax=c.comp?"co":"none";
      var ck=key(c.comp), isOwn=c.name && tax==="own";
      if(!c.name){   /* 상사만 적은 줄 */
        if(comps[ck] || newComps[ck]){ x.st="dup"; x.why=comps[ck]?"이미 있는 상사예요.":"파일 안에서 두 번 나와요."; list.push(x); return; }
      } else {
        var nk=ck+"|"+key(c.name);
        if(have[nk+"|"+tel]){ x.st="dup"; x.why="이미 있는 딜러예요."; list.push(x); return; }
        if(haveNm[nk] && (!tel || haveNm[nk].indexOf("")>=0)){ x.st="dup"; x.why="같은 상사에 같은 이름 딜러가 있어요. 번호는 거래처 화면에서 넣어 주세요."; list.push(x); return; }
        if(seen[nk+"|"+tel]){ x.st="dup"; x.why="파일 안에서 두 번 나와요."; list.push(x); return; }
        seen[nk+"|"+tel]=1;
        if(haveNm[nk]) notes.push("같은 이름 딜러가 있어요(번호 다름)");
        if(!tel) notes.push("휴대폰이 없어 알림톡이 안 가요");
        x.d={name:c.name, tel:tel, comp:comps[ck]?comps[ck].name:(newComps[ck]?newComps[ck].name:c.comp), tax:tax,
             biz:isOwn?{name:"", no:no, ceo:c.ceo, email:c.email}:null};
        if(isOwn) notes.push("딜러 상호는 거래처 화면에서 넣어 주세요");
        notes.unshift("세금계산서 "+TAXW[tax]);
      }
      if(c.comp && !comps[ck]){
        var nc=newComps[ck];
        if(!nc){ nc=newComps[ck]={name:c.comp, no:"", ceo:"", email:"", tel:"", addr:"", line:x.line, c:c}; notes.push("새 상사도 같이 만들어요"); }
        if(!isOwn){ if(!nc.no && no) nc.no=no; if(!nc.ceo && c.ceo) nc.ceo=c.ceo; if(!nc.email && c.email) nc.email=c.email; }
        if(!nc.tel && ct) nc.tel=ct; if(!nc.addr && c.caddr) nc.addr=c.caddr;
      } else if(c.comp && ((!isOwn && (no || c.ceo || c.email)) || ct || c.caddr)) notes.push("상사가 이미 있어 상사 정보는 바꾸지 않아요");
      x.st="new"; x.why=notes.join(" · "); list.push(x); });
    var nn=Object.keys(newComps).length;
    return {list:list, comps:newComps, skips:skips, extra:nn?"새 상사 "+nn+"곳 포함":""};

  function savePartners(o, r, prog){
    var cs=Object.keys(r.comps).map(function(k){ return r.comps[k]; }),
        ds=r.list.filter(function(x){ return x.st==="new" && x.d; }), bad={}, total=cs.length+ds.length, step=0;
    function tick(){ step++; prog && prog(step, total); }
    return each(cs, function(c){ return Promise.resolve(o.api.saveCompany({name:c.name, no:c.no, ceo:c.ceo, email:c.email, tel:c.tel, addr:c.addr}))
        .catch(function(e){ bad[key(c.name)]=1; c.failWhy="상사를 만들지 못했어요."; throw e; }); }, tick)
      .then(function(){
        ds.forEach(function(x){ if(bad[key(x.d.comp)]) x.failWhy="소속 상사를 만들지 못해 딜러도 넣지 않았어요."; });
        return each(ds, function(x){ if(bad[key(x.d.comp)]) return Promise.reject(new Error("comp"));
          return o.api.saveDealer(x.d, true); }, tick).then(function(rd){
          var oc=r.list.filter(function(x){ return x.st==="new" && !x.d; }), cf=[];
          oc.forEach(function(x){ if(bad[key(x.c.comp)]) cf.push({line:x.line, c:x.c, why:"상사를 만들지 못했어요. 다시 올려 주세요."}); });
          return {n:rd.n+oc.length-cf.length, fails:cf.concat(rd.fails).sort(function(a,b){ return a.line-b.line; })}; });
      }); }
  function partners(o){

  function checkPlaces(o, recs){
    var have={}, seen={}, list=[];

    recs.forEach(function(x){ var c=x.c, why=[], ph=telDig(c.phone), k=key(c.name);

  function places(o){

      check:function(recs){ return checkPlaces(o, recs); },

<script>
/* ═══ v51 — 검사비 금액 바로잡기 (대표님 10/18 «체크 금액이 안 맞아요»)
   까닭: 서버(invoiceBuild · salesStat)는 단가 항목을 «코드 = 접수리스트 상품명»으로만 찾아요. 코드가 비거나 이름과 다르면 못 찾고
         «금액 − 성능보험료»로 대신 셈해서 검사비가 부풀었어요. (선납_* 는 서버가 0원으로 셈해요)
   ① 단가 저장 때 코드가 비면 이름을 코드로 (만들기 도구에서 priceAddGo 고침)
   ② 단가표 화면 띠: «가온 규칙으로 맞추기» ~2026-05-31 국산 25,000 · 수입 35,000 / 2026-06-01~ 30,000 · 40,000 (부가세 별도, 대표님 확정)
      코드가 이름과 다른 항목이 있으면 «코드를 이름으로 맞추기»
   재검 · 가성능 0원 · 수출 가성능 손 입력 · 이름으로도 찾기는 서버 방 요청(체크/요청서/2026-10-18_검사비_단가_서버_요청.md) ═══ */
(function(){
var G1="2020-01-01", G2="2026-06-01", CARS=["국산차","수입차"];
var GAON={}; GAON[G1]={"국산차":25000,"수입차":35000}; GAON[G2]={"국산차":30000,"수입차":40000};
function nm(i){ return String(i.name||"").trim(); }
function cd(i){ return String(i.code||"").trim(); }
/* 서버는 코드 = 상품명으로 찾아요 — 이름이 있는데 코드가 다르면 못 찾아요 */
function badCode(i){ return !!nm(i) && cd(i)!==nm(i); }
function badN(){ var n=0; PRICE_BANDS.forEach(function(b){ b.items.forEach(function(i){ if(badCode(i)) n++; }); }); return n; }
function others(){ return PRICE_BANDS.filter(function(b){ return b.from!==G1&&b.from!==G2; }).map(function(b){ return b.from; }); }
function saveBands(list, done){
  busy(true);
  list.reduce(function(p,b){ return p.then(function(){ return call("priceSave",[{from:b.from, items:b.items}]); }); }, Promise.resolve())
    .then(function(){ busy(false); PRICE_OK=null; bar(done+" 매출은 바로 바뀌어요. 청구서는 그 달 «청구서 만들기»를 한 번 더 누르면 새 단가로 바뀌어요.","ok"); refresh(["set","sales","bill"]); })
    .catch(function(e){ busy(false); PRICE_OK=null; bar(niceMsg(e&&e.message)+" — 일부만 바뀌었을 수 있어요. 단가표를 보고 한 번 더 눌러 주세요.","err"); refresh(["set"]); });
}
/* 가온 규칙으로 맞추기 — 두 구간의 국산차 · 수입차만 바꾸고, 같은 구간의 다른 항목은 그대로 */
function gaonGo(){
  var chg=[], keepN=0;
  var list=[G1,G2].map(function(from){
    var old=(PRICE_BANDS.filter(function(b){ return b.from===from; })[0]||{items:[]}).items;
    var keep=old.filter(function(i){ return CARS.indexOf(cd(i))<0 && CARS.indexOf(nm(i))<0; }).map(function(i){ return {code:cd(i)||nm(i), name:i.name, price:i.price}; });
    keepN+=keep.length;
    CARS.forEach(function(c){ var was=old.filter(function(i){ return cd(i)===c||nm(i)===c; })[0];
      chg.push(from+" "+c+" "+(was?won(was.price):"없음")+" → "+won(GAON[from][c])+"원"); });
    return {from:from, items:CARS.map(function(c){ return {code:c, name:c, price:GAON[from][c]}; }).concat(keep)}; });
  var ot=others();
  ask({title:"가온 규칙으로 단가를 맞출까요?\n구간 2개 · 국산차 · 수입차 4줄 바꿈 · 다른 항목 "+keepN+"줄 그대로 (부가세 별도)",
       rows:chg.map(function(t){ return [esc(t),""]; }), rowsTitle:"바뀌는 줄",
       warn:ot.length?"따로 넣어 둔 구간("+esc(ot.join(", "))+")은 그 기간에 그 단가가 쓰여요. 틀렸으면 표에서 지워 주세요.":"", yes:"맞추기"}, function(){
    saveBands(list, "가온 규칙으로 단가를 맞췄어요.");
  });
}
/* 코드를 이름으로 맞추기 — 같은 구간에 이름이 같은 줄이 생기면(단가가 다르면) 멈추고 표에서 정리하게 */
function fixCodes(){
  var clash=[], gone=0;
  var list=PRICE_BANDS.filter(function(b){ return b.items.some(badCode); }).map(function(b){
    var by={}, items=[];
    b.items.forEach(function(i){ var k=nm(i)||cd(i), x={code:k, name:i.name||k, price:i.price};
      if(by[k]){ if(by[k].price!==x.price) clash.push(b.from+" «"+k+"» "+won(by[k].price)+" · "+won(x.price)+"원"); else gone++; return; }
      by[k]=x; items.push(x); });
    return {from:b.from, items:items}; });
  if(!list.length) return;
  if(clash.length){ tell("이름이 같은데 단가가 다른 줄이 있어요","표에서 하나를 지운 뒤 다시 눌러 주세요: "+esc(clash.join(" / "))); return; }
  ask({title:"코드를 이름과 같게 "+badN()+"줄 맞출까요?\n구간 "+list.length+"개"+(gone?" · 이름 · 단가가 똑같은 겹친 줄 "+gone+"개는 하나만 남겨요":""),
       k1:"구간", v1:list.map(function(b){ return b.from; }).join(", "), k2:"맞추는 값", v2:"항목 이름 그대로 (예: 국산차)", yes:"맞추기"}, function(){
    saveBands(list, "코드를 이름으로 맞췄어요.");
  });
}
var a=AFTER.price;
AFTER.price=function(){
  if(a) a.apply(this,arguments);
  if(PRICE_OK!==true||!isOwner()||$("v51Gaon")) return;
  var h=$("main").querySelector(".cgg-head"); if(!h) return;
  var n=badN(), ot=others();
  var has=function(from){ return CARS.every(function(c){ return PRICE_BANDS.some(function(b){ return b.from===from && b.items.some(function(i){ return cd(i)===c && i.price===GAON[from][c]; }); }); }); };
  var ok=has(G1)&&has(G2);
  var box=document.createElement("div"); box.id="v51Gaon";
  box.className="cgg-band "+(n||!ok||ot.length?"chk":"done"); box.setAttribute("role","status");
  box.innerHTML='<span class="tx">'+(n?"코드가 이름(상품명)과 다른 단가 "+n+"줄은 청구서 · 매출에 안 쓰여요 (금액이 부풀어요)"
      : !ok?"가온 규칙(2026-06-01 인상) 단가가 아직 없어요"
      : ot.length?"가온 규칙 단가는 들어 있어요 · 다른 구간 "+ot.length+"개("+esc(ot.join(", "))+")가 그 기간에 먼저 쓰여요"
      : "가온 규칙 단가가 들어 있어요 (2026-06-01 인상 · 선납 0원)")+'</span>'+
    (n?'<button type="button" class="cgg-btn" id="v51Fix">코드를 이름으로 맞추기</button>':'')+
    (ok?'':'<button type="button" class="cgg-btn pri" id="v51Go">가온 규칙으로 맞추기</button>');
  var bd=$("chkBand"); h.parentNode.insertBefore(box, (bd&&bd.parentNode===h.parentNode)?bd.nextSibling:h.nextSibling);
  var f=$("v51Fix"); if(f) f.onclick=fixCodes;
  var g=$("v51Go"); if(g) g.onclick=gaonGo;
};
})();
</script>

<script>
/* ═══ v52 — 서버 check-api v44(검사비 셈 바로잡기)에 맞춘 화면
   · 매출 · 월별 청구서: «단가표에 없는 상품명 ○○ N대» · «금액 넣을 수출 가성능 N대» 알림 (salesStat rows[].unknown · feeNeed)
   · 월별 청구서: «수출 가성능 금액 넣기» — 이 달 청구서 줄(invoiceRows) 가운데 수출 가성능 차마다 검사비(부가세 별도) → carFeeSet (대표만)
   unknown[].goods 는 엑셀에서 온 글이라 늘 esc (보안 방 당부) ═══ */
(function(){
var EXP=/수출\s*가성능/;
function salesOf(ym){ return (SALES||[]).filter(function(x){ return x.ym===ym; })[0]||null; }
function warnText(r){
  if(!r) return "";
  var t=[], u=Array.isArray(r.unknown)?r.unknown:[];
  if(u.length) t.push("단가표에 없는 상품명 "+u.slice(0,3).map(function(x){ return "«"+String(x.goods||"")+"» "+(Number(x.n)||0)+"대"; }).join(", ")+(u.length>3?" 외 "+(u.length-3)+"가지":"")+" — 0원으로 셈했어요");
  if(Number(r.feeNeed)>0) t.push("금액 넣을 수출 가성능 "+Number(r.feeNeed)+"대");
  return t.join(" · ");
}
function addBand(id, text, btn, onBtn){
  if(!text||$(id)) return;
  var h=$("main").querySelector(".cgg-head"); if(!h) return;
  var box=document.createElement("div"); box.id=id; box.className="cgg-band chk"; box.setAttribute("role","status");
  box.innerHTML='<span class="tx">'+esc(text)+'</span>'+(btn?'<button type="button" class="cgg-btn pri">'+esc(btn)+'</button>':'');
  var bd=$("chkBand"); h.parentNode.insertBefore(box,(bd&&bd.parentNode===h.parentNode)?bd.nextSibling:h.nextSibling);
  var b=box.querySelector("button"); if(b) b.onclick=onBtn;
}
/* 수출 가성능 금액 넣기 */
function expGo(){
  if(!isOwner()){ tell("대표만 할 수 있어요","검사비 넣기는 대표 계정으로 해 주세요."); return; }
  if(!BILLS.length){ tell("이 달 청구서가 없어요","먼저 «청구서 만들기»를 눌러 주세요."); return; }
  busy(true); bar("청구서 줄을 불러오는 중…","info");
  billLoadRows(BILLS.slice()).then(function(){
    busy(false); bar("");
    var L=[]; BILLS.forEach(function(b){ (b.rows||[]).forEach(function(r){ if(r.car_id && EXP.test(String(r.item||""))) L.push({b:b, r:r}); }); });
    if(!L.length){ tell("수출 가성능 차가 없어요", esc(ymText(ST.ym))+" 청구서에 수출 가성능 줄이 없어요. 딜러가 이어지지 않은 차는 설정 › 자료 올리기에서 딜러를 먼저 이어 주세요."); return; }
    var seq={};
    CGG.dialog({size:"form", title:"수출 가성능 검사비 넣기", desc:ymText(ST.ym)+" · "+L.length+"대 · 금액은 부가세 별도 · 비운 칸은 그대로 둬요",
      body:'<div style="display:grid;gap:8px;max-height:52vh;overflow:auto">'+L.map(function(x,i){
        var k=x.b.name; seq[k]=(seq[k]||0)+1; var car=x.r.car||{};
        var who=(car.plate?car.plate+" · ":"")+(car.check_date?String(car.check_date).slice(5,10)+" · ":"")+x.b.name+(car.plate?"":" · "+seq[k]+"번째 수출 가성능");
        var v=Number(x.r.unit)||0;
        return '<label style="display:flex;gap:10px;align-items:center;font-weight:600;color:var(--text)"><span style="flex:1;min-width:0">'+esc(who)+'</span>'+
          '<input type="text" inputmode="numeric" maxlength="9" data-ex="'+i+'" value="'+(v?won(v):"")+'" data-was="'+(v?won(v):"")+'" placeholder="금액" style="width:130px;text-align:right" aria-label="'+esc(who)+' 검사비"> 원</label>'; }).join("")+'</div>'+
        '<div class="msg err" id="exErr" hidden style="margin-top:8px"></div>',
      ok:"저장", cancel:"닫기",
      onOk:function(){
        var e=$("exErr"), go=[];
        for(var i=0;i<L.length;i++){ var inp=document.querySelector('[data-ex="'+i+'"]'), typed=String(inp?inp.value:"").trim(), raw=typed.replace(/[^0-9]/g,"");
          if(!typed||typed===inp.getAttribute("data-was")) continue;
          if(!raw){ e.hidden=false; e.textContent=(i+1)+"번째 칸에 숫자로 넣어 주세요."; return false; }   /* 빈칸 · 그대로인 칸은 안 보냄 (0 을 쳤으면 0원으로 보냄) */
          var fee=raw===""?0:Number(raw); if(!(fee>=0&&fee<=10000000)){ e.hidden=false; e.textContent=(i+1)+"번째 금액을 0~10,000,000원으로 넣어 주세요."; return false; }
          go.push({carId:String(L[i].r.car_id), fee:fee}); }
        if(!go.length){ CGG.closeDialog(); return; }
        var okb=document.querySelector(".cgg-dlg [data-dok]"); if(okb) okb.disabled=true;
        go.reduce(function(p,x){ return p.then(function(){ return call("carFeeSet",[x]); }); }, Promise.resolve()).then(function(){
          CGG.closeDialog(); bar(go.length+"대 검사비를 넣었어요. «청구서 만들기»를 한 번 더 누르면 청구서에 들어가요 (매출은 바로 바뀌어요).","ok"); refresh(["sales","bill"]);
        }).catch(function(er){ if(okb) okb.disabled=false; e.hidden=false; e.textContent=niceMsg(er&&er.message); });
        return false; }});
  }).catch(function(e){ busy(false); fail(e); });
}
var ab=AFTER.bill;
AFTER.bill=function(){ if(ab) ab.apply(this,arguments);
  var r=salesOf(ST.ym); addBand("v52Bill", warnText(r), (r&&Number(r.feeNeed)>0&&isOwner())?"수출 가성능 금액 넣기":"", expGo); };
var as=AFTER.sales;
AFTER.sales=function(){ if(as) as.apply(this,arguments);
  var r=(typeof HERO!=="undefined"&&SALES[HERO])||SALES[0]; var t=warnText(r);
  var unk=Array.isArray(r&&r.unknown)&&r.unknown.length, need=r&&Number(r.feeNeed)>0;
  if(t) addBand("v52Sales", (r?ymText(r.ym)+" · ":"")+t, !isOwner()?"":unk?"단가표 보기":need?"청구서에서 금액 넣기":"", function(){ if(unk){ go("price"); return; } if(r&&r.ym){ ST.ym=r.ym; try{ set("cgg_ym",r.ym); }catch(e){} } go("bill"); }); };
})();
</script>

  /* 잠긴 칸 — 고치는 칸(textarea)이 아니라 글로만 보여 줘요. 예시 값이 없으면 #{…} 자리를 파란 글씨로 */
  function box(key, vars, opt){ opt=opt||{};

      '<div style="white-space:pre-wrap;font-size:13.5px;line-height:1.55">'+body+'</div>'+

    '</div>';
  }
  return {V:V, list:T, fill:fill, box:box};
})();

<script>
/* ═══ 체크 v56.3 = v56.2 + 공통 부품 1.13.2 (표 처음 정렬 · 고르기 칸 없는 표 · 한글 찾기 · 실패 까닭 CGG.sendWhy · «발행» 말) ═══
   ═══ 체크 v56.2 = v56.1 + 공통 부품 1.13.1 («이번 달 어디까지 왔나» = CGG.steps · 밀린 달 확인 창 받는 사람 펼쳐 보기) ═══
   ═══ 체크 v56.1 = v56 + 공통 부품 1.13 (결과 목록 · 진행 줄 · 밀린 달 창은 1.13 공통 CGG.listify · CGG.progress · CGG.bundle 로) ═══
   ═══ 체크 v56 — 디자인 통합 2단계 (대표님 승인 10/18 · 대조표 74줄 추천 그대로)
   ① 메뉴 = 디자인 방 메뉴 지도 CGG_MENU_CHECK 그대로(이름 · 차례 · «체크 전용» 묶음) — 체크 화면 열쇠로만 잇기
   ② 홈 = 공통 CGG.home(워시와 같은 차례) + 체크 전용 칸(어디까지 왔나 · 많이 밀린 곳 · 성능보증보험료)
   ③ 결과 창 줄바꿈 · ④ 알림톡 문구 잠금(보기만) · ⑤ 밀린 달 한꺼번에(check-api v51) · ⑥ 배달 휴지통은 휴지통 안으로
   돈 계산 함수(청구서 · 입금 · 세금계산서 · 정산)는 건드리지 않아요 — 화면 그리기만 ═══ */
(function(){
var M=window.CGG_MENU_CHECK||{groups:[],tabs:[],feats:[]};
/* ① 메뉴 지도 열쇠 → 체크 화면 열쇠 */
var GK={delivery:"deliv"};
var PK={"bill/month":"bill","bill/group":"billgrp","deposit/in":"deposit","deposit/due":"recv","deposit/ins":"unpaid",
  "hometax/issue":"hometax","hometax/ledger":"history","delivery/log":"deliv","delivery/dest":"delivplace","delivery/msg":"delivmsg",
  "delivery/driver":"delivdriver","set/biz":"office","set/backup":"backup","set/partner":"partner","set/staff":"staff","set/price":"price",
  "set/popbill":"popbill","set/alarm":"alarm","set/fee":"fee","set/upload":"files"};
function gk(k){ return GK[k]||k; }
function toChk(go){ go=String(go||"home"); if(/^(me|hdr|field)\//.test(go)) return go; var p=PK[go]; if(p) return gk(go.split("/")[0])+"/"+p; return gk(go.split("/")[0]); }
window.chkGroups=chkGroups=function(){
  return M.groups.map(function(g){ var o={key:gk(g.key), label:g.label, icon:g.icon, isNew:g.isNew};
    if(g.subs) o.subs=g.subs.map(function(s){ return s.key ? {key:PK[g.key+"/"+s.key]||s.key, label:s.label} : {group:s.group}; });
    return o; });
};
window.chkFeats=chkFeats=function(){
  return M.feats.map(function(f){ var x={}; for(var k in f) x[k]=f[k]; x.go=toChk(f.go); return x; });
};
/* 안쪽 칸 목록(머리 글 · 폰 작은 탭)도 메뉴 지도 이름으로 */
function subsOf(key){ var g=chkGroups().filter(function(x){ return x.key===key; })[0]; return g&&g.subs?g.subs.filter(function(s){ return s.key; }).map(function(s){ return [s.key,s.label]; }):null; }
["bill","deposit","hometax","deliv","set"].forEach(function(k){ var L=subsOf(k); if(!L) return;
  var T={bill:BILLSUB,deposit:DEPSUB,hometax:TAXSUB,deliv:DELIVSUB,set:SETS}[k]; T.length=0; L.forEach(function(x){ T.push(x); }); });
SETLBL={};
/* 알림톡 문구 화면은 설정 › 알림 안 (메뉴 지도 «알림톡 문구» = 설정 › 알림) */
var _g1=groupOf;
window.groupOf=groupOf=function(p){ if(p==="billtpl"||p==="sms") return ["set",SETS]; if(p==="delivtrash") return ["deliv",DELIVSUB]; return _g1.apply(this,arguments); };
var _cc=chkCur;
window.chkCur=chkCur=function(){ if(page==="billtpl") return "set/alarm"; if(page==="sms") return "set/popbill"; if(page==="delivtrash") return "deliv/deliv"; return _cc.apply(this,arguments); };
/* 폰 작은 탭에 «체크 전용» 묶음 이름 */
var _dt=drawTabs;
window.drawTabs=drawTabs=function(){ _dt.apply(this,arguments);
  var G=groupOf(page), sub=$("cggSub"); if(!sub||!G[1]) return;
  var g=chkGroups().filter(function(x){ return x.key===G[0]; })[0]; if(!g||!g.subs) return;
  var html=g.subs.map(function(s){ return s.key ? '<button role="tab" aria-selected="'+(page===s.key?"true":"false")+'" data-go="'+esc(s.key)+'">'+esc(s.label)+'</button>' : '<span class="cgg-nsgrp">'+esc(s.group||"")+'</span>'; }).join("");
  sub.innerHTML=html;
  Array.prototype.forEach.call(sub.querySelectorAll("[data-go]"),function(b){ b.onclick=function(){ go(b.getAttribute("data-go")); }; });
};
/* 폰 아래 탭 5칸 — 메뉴 지도 tabs (홈 · 청구서 · 배달 · 입·출금 · 전체) */
window.cggTabbar=cggTabbar=function(grp){
  if(!window.CGG) return;
  var T=M.tabs.map(function(t){ return {key:t.key==="__all"?"all":gk(t.key), icon:t.icon, label:t.label}; });
  var main=T.map(function(t){ return t.key; }).filter(function(k){ return k!=="all"; });
  CGG.tabbar($("cggTbar"), T, main.indexOf(grp)>=0?grp:"all",
    function(k){ if(k==="all"){ if(!CGG.closeSheet()) cggAllMenu(); } else { CGG.closeSheet(); go(k); } });
};
/* 기능 찾기 — 머리말 · 사람 단추 · 빛낼 칸(spot) */
var _gf=chkGoFeat;
window.chkGoFeat=chkGoFeat=function(f){
  var g=String((f&&f.go)||"");
  try{ CGG.closeSheet(); }catch(e){}
  if(g==="hdr/link"){ $("btnLink").click(); return; }
  if(f&&f.id==="outbox"){ go("sendlog"); return; }   /* v56.2: 보낸 기록 화면 */
  if(g==="hdr/help"){ $("btnHelp").click(); return; }
  if(g==="hdr/notice"){ if(window.ccwNotice) window.ccwNotice(); return; }
  if(g==="me/plan"){ try{ window.ccwPlanPay(); }catch(e){ bar("요금제는 마이페이지에서 봐요"); } return; }
  _gf.apply(this,arguments);
  if(f&&f.spot) setTimeout(function(){ var c=document.querySelector(f.spot); if(c&&CGG.spot) CGG.spot(c); },400);
};

/* ② 홈 — 공통 CGG.home (워시와 같은 차례 · 같은 첫 줄 규칙) */
var HOMEIC={deposit:"wallet",bill:"file",partner:"shop",hometax:"receipt",home:"today"};

PAGE.home=function(){ return '<div id="chkHome"></div>'; };
AFTER.home=function(){
  var el=$("chkHome"); if(!el||!CGG.home) return;
  var totFee=0,totRep=0,totPaid=0,cnt=0,dom=0,imp=0,etc=0;
  BILLS.forEach(function(b){ totFee+=b.fee; totRep+=b.rep; totPaid+=b.paid; cnt+=b.cnt; dom+=b.dom; imp+=b.imp; etc+=b.etc; });
  var tot=totFee+totRep, left=tot-totPaid;
  var cy=Number(ST.ym.slice(0,4)), cm=Number(ST.ym.slice(5,7)), now=new Date();
  var thisMonth=(now.getFullYear()===cy && now.getMonth()+1===cm);
  /* 할 일 — v55.1 과 같은 셈(메모 · 확인 필요 입금 · 안 보낸 청구서 · 번호 없음 · 세금계산서) */
  var wait=DEPS.filter(function(d){return d.state==="확인 대기";}), notSent=BILLS.filter(function(b){return b.sendState==="안 보냄";}),
      noTel=BILLS.filter(function(b){return !b.tel;}), taxWait=BILLS.filter(function(b){return b.tax==="끊음";});
  var tk=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0"), ms=[];
  try{ ms=chkMemos().filter(function(m){ return m.day===tk && !m.done; }); }catch(e){}
  TODOS=ms.slice(0,3).map(function(m){ return [(m.time||"메모"),"memo","오늘 메모 · "+m.text,(m.by?m.by+" 적음":""),"home"]; });
  [[wait.length,"w","확인 필요 입금","deposit"],[notSent.length,"w","아직 안 보낸 청구서","bill"],[noTel.length,"r","보낼 번호가 없는 청구처","partner"],[taxWait.length,"","세금계산서 대상","hometax"]]
    .forEach(function(x){ if(Number(x[0])>0) TODOS.push([x[0],x[1],x[2],"",x[3]]); });
  function todoItem(x){ var memo=x[1]==="memo";
    return {tone:x[1]==="r"?"stop":x[1]==="w"?"chk":"run", icon:HOMEIC[x[4]]||"file", title:memo?x[2]:(x[2]+" "+won(x[0])+"건"), sub:x[3]||"눌러서 바로 처리해요"}; }
  /* 숫자 칸 4개 — 모두 작은 그래프 + 비교 줄 (차량 · 청구는 매출 기록, 입금 · 받을 금액은 이번 달 날마다) */
  var S=(SALES||[]).slice(0,7).slice().reverse(), sn=S.map(function(x){ return Number(x.n)||0; }), st=S.map(function(x){ return Number(x.total)||0; });
  var prev=(SALES||[]).filter(function(x){ return String(x.ym)<ST.ym; })[0]||null;
  function dlt(a,b,unit){ if(b==null) return {delta:"",vs:"지난달 자료 없음"}; var d=a-b; return {delta:(d>=0?"+":"−")+won(Math.abs(d))+unit, down:d<0, vs:"지난달보다"}; }
  var last=new Date(cy,cm,0).getDate(), upto=thisMonth?now.getDate():last, day=[], acc=0;
  for(var d=1; d<=upto; d++){ DEPS.forEach(function(x){ if(String(x.day).slice(0,7)===ST.ym && Number(String(x.day).slice(8,10))===d) acc+=(x.amount||0); }); day.push(acc); }
  var pct=tot?Math.round(totPaid/tot*100):0, leftN=BILLS.filter(function(b){ return b.left>0; }).length;
  var curS=(SALES||[]).filter(function(x){ return String(x.ym)===ST.ym; })[0]||null;   /* 비교는 매출 기록끼리(같은 셈) */
  var k1=dlt(curS?Number(curS.n)||0:cnt, prev?Number(prev.n)||0:null, "대"), k2=dlt(curS?Number(curS.total)||0:tot, prev?Number(prev.total)||0:null, "원");
  var kp=[{label:"이번 달 차량", value:won(cnt), unit:"대", spark:sn.length>1?sn:null, delta:k1.delta, down:k1.down, vs:k1.vs},
          {label:"이번 달 청구", value:won(tot), unit:"원", spark:st.length>1?st:null, delta:k2.delta, down:k2.down, vs:k2.vs},
          {label:"이번 달 입금", value:won(totPaid), unit:"원", tone:"in", zeroMuted:true, spark:day.length>1?day:null, delta:pct+"%", vs:"청구 중 받은 몫"},
          {label:"받을 금액", value:won(left), unit:"원", tone:"due", zeroMuted:true, spark:day.length>1?day.map(function(v){ return Math.max(0,tot-v); }):null, delta:won(leftN)+"곳", down:leftN>0, vs:"아직 덜 받은 곳"}];

               sub: x[3] || (Number(x[0])? "눌러서 바로 처리해요" : "지금은 할 일이 없어요") }; }),
      function(i){ var t=list[i]; if(t && t[4] && t[4]!=="home") go(t[4]); });
    var more=document.getElementById("cggMore");
    if(more) more.innerHTML=(TODOS||[]).length>3
      ? '<button type="button" class="todoMore" id="todoMoreBtn">할 일 <b>'+TODOS.length+'건</b> 모두 보기</button>' : "";
  };
  /* v33: 사람 버튼 ▾ — 마이페이지 · 요금제 · 휴지통 · ― · 화면 설정 · ― · 로그아웃 (README 1.1 차례) */
  var hw=document.getElementById("hWho");
  if(hw){
    CGG.menu(hw, function(){ return {name:(ST&&ST.who)||"", role:(ST&&ST.role)==="owner"?"대표":"직원"}; }(), function(){
      var owner=(ST&&ST.role)==="owner";
      return [{key:"me",icon:"user",label:"마이페이지"}]
        .concat(owner?[{key:"plan",icon:"wallet",label:"요금제"}]:[])
        .concat([{key:"trash",icon:"trash",label:"휴지통"},"-",
                 {key:"lay",icon:"pc",label:"화면 설정",note:CGG.layout.name()},"-",
                 {key:"out",icon:"out",label:"로그아웃"}]);
    }, function(k){
      if(k==="me") chkMyPage();
      else if(k==="plan"){ try{ window.ccwPlanPay(); }catch(e){ bar("요금제 기능이 아직 준비 중이에요"); } }
      else if(k==="trash") go("trash");
      else if(k==="lay") cggScreenSet();
      else if(k==="out") $("btnOut").click();
    });
  }
  /* 화면 설정 창 — 메뉴 배치 + 밝기 */
  window.cggScreenSet=function(){
    var th=(function(){ try{ return localStorage.getItem("ccw_theme")||"auto"; }catch(e){ return "auto"; } })();
    $("sheet").innerHTML='<h3 style="margin:0 0 2px">화면 설정</h3><div style="color:var(--muted);font-size:12.5px;margin-bottom:12px">이 기기에만 저장돼요</div>'+
      '<div class="mcard"><div class="mh"><b>메뉴 배치</b><span>넓은 화면에서만 바뀌어요</span></div><div id="cggLay"></div></div>'+
      '<div class="mcard"><div class="mh"><b>밝기</b></div><div class="fzrow">'+
        [["auto","기기에 맞춤"],["light","밝게"],["dark","어둡게"]].map(function(x){
          return '<button type="button" class="btn" data-th="'+x[0]+'" aria-selected="'+(th===x[0])+'">'+x[1]+'</button>'; }).join("")+'</div></div>'+
      '<div class="sheetbtns"><button class="btn" id="scrClose">닫기</button></div>';
    openSheet();
    CGG.layout.chooser(document.getElementById("cggLay"), function(){ drawTabs(); });
    $("scrClose").onclick=closeSheet;
    Array.prototype.forEach.call($("sheet").querySelectorAll("[data-th]"),function(b){
      b.onclick=function(){ var v=b.getAttribute("data-th");
        try{ localStorage.setItem("ccw_theme",v); }catch(e){}
        if(v==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme",v);
        Array.prototype.forEach.call($("sheet").querySelectorAll("[data-th]"),function(x){ x.setAttribute("aria-selected", String(x===b)); }); }; });
  };
  /* (v24~v32: 마이페이지 안 메뉴 배치 칸 — v33 부터는 화면 설정 창으로 옮겨 이 덧붙임은 쓰지 않음) */
  if(false)
  if(typeof chkMyPage==="function"){
    var _mp=chkMyPage;
    window.chkMyPage=chkMyPage=function(){
      _mp.apply(this, arguments);
      var out=document.querySelector("#sheet .mpout"); if(!out) return;
      var box=document.createElement("div"); box.className="mcard";
      box.innerHTML='<div class="mh"><b>메뉴 배치</b><span>넓은 화면에서만 바뀌어요 · 이 기기에만 저장</span></div><div id="cggLay"></div>';
      out.parentNode.insertBefore(box, out);
      CGG.layout.chooser(document.getElementById("cggLay"), function(){ drawTabs(); });
    };
  }
  /* 서버 v24 — 관리 계정이 검사소를 안 골랐을 때 */
  var picking=false;
  window.cggPickOffice=function(){
    if(picking) return; picking=true;
    $("sheet").innerHTML='<h3 style="margin:0 0 4px">검사소를 선택해 주세요</h3>'+
      '<div style="color:var(--muted);font-size:13px;margin-bottom:12px">관리 계정은 들어갈 검사소 코드를 입력해야 해요.</div>'+
      '<div class="cgg-offpick"><input id="cggOff" placeholder="검사소 코드" autocomplete="off" value="'+esc(ST.shop||"")+'"></div>'+
      '<div class="sheetbtns"><button class="btn" id="offNo">닫기</button><button class="btn primary" id="offYes">이 검사소로 들어가기</button></div>';
    openSheet();
    function done(){ picking=false; }
    $("offNo").onclick=function(){ closeSheet(); done(); };
    $("offYes").onclick=function(){
      var v=String($("cggOff").value||"").trim().toUpperCase(); if(!v){ $("cggOff").focus(); return; }
      ST.shop=v; set("cgg_shop",v); LOADED={}; closeSheet(); done(); openApp(); };
  };
  if(!document.getElementById("wrap").hidden){ drawTabs(); if(typeof draw==="function") draw(); }
})();
</script>
<script>
/* ═══ 체크 v56.6 — 기록 저장 믿음 (대표님 10/19 최우선 · 운영/긴급/2026-10-19_기록_알림톡_출시마감_요청.md «체크» 줄)
   돈 셈 · 서버 부르기 함수(call) 본문은 그대로 두고, 바깥에서 감싸요.
   ① 같은 일 표시(rid): 저장 · 고치기 · 지우기 · 보내기 창구에만 «한 번 누름»마다 무작위 24자를 몸통 {shop, token, fn, args, rid} 에 붙여요.
      답을 못 받은 일(연결 끊김 · 답 못 읽음)을 다시 하면 같은 rid — 서버가 같은 rid 를 한 번만 처리하면 두 번 생기지 않아요(서버 방 약속).
   ② 겹침 막기: 같은 창구 · 같은 내용이 아직 처리 중이면 새로 보내지 않고 처음 것의 답을 같이 받아요(연속 클릭 · 엔터 두 번).
      확인 창 단추를 0.8초 안에 또 누르면 무시하고, 화면 단추는 저장이 끝날 때까지 잠가요.
   ③ 실패하면 «저장됨»이 아니라 빨간 글 + «다시 하기» 단추(처음 누른 단추를 다시 눌러 줘요).
   ④ 검사자 수수료(feeRules)처럼 실패를 조용히 넘기던 저장도 빨간 글로 알려요. ═══ */
(function(){
  if(typeof window.call!=="function" || typeof API==="undefined") return;
  var WR={};
  ("bankDel bankSave billBundleSend billGroupSet billSend carFeeSet companyDel companySave dealerAddMissing dealerDel dealerSave "+
   "delivApproveDealer delivRejectDealer depositApply depositDel depositImport depositKind depositMatch depositRestore depositUnapply "+
   "excelPut feeRules importLegacy insMatch invoiceBuild invoiceDel invoiceMove invoiceRekey invoiceUnsend officeSave popJoin "+
   "priceDel priceSave relink remindOff remindRuleSave remindSend smsConf staffAdd staffEdit taxIssue taxSkip tplSave "+
   "deliv_update deliv_cancel deliv_trash deliv_resend deliv_fillBlanks deliv_saveConf deliv_addDest deliv_accountAdd deliv_accountEdit").split(" ").forEach(function(k){ WR[k]=1; });
  /* 읽기로 쓰는 경우(빈 args) — feeRules() · smsConf() 는 읽기 */
  function isWrite(fn,args){ if(!WR[fn]) return false; if((fn==="feeRules"||fn==="smsConf") && !(args&&args.length)) return false; return true; }
  var A="abcdefghijklmnopqrstuvwxyz0123456789";
  function newRid(){ var a=new Uint8Array(24); try{ crypto.getRandomValues(a); }catch(e){ for(var i=0;i<24;i++) a[i]=Math.floor(Math.random()*256); }
    return Array.prototype.map.call(a,function(x){ return A[x%36]; }).join(""); }
  var FLY={}, LOST={}, CUR="";
  function keyOf(fn,args){ var s=""; try{ s=JSON.stringify(args||[]); }catch(e){ s=String(Math.random()); } return fn+"|"+s; }
  function unknown(m){ return /연결이 잠시 끊겼|서버에서 답을 받지 못했|Failed to fetch|NetworkError|Load failed|timed? ?out/i.test(String(m||"")); }

  /* 몸통에 rid 붙이기 — call 이 fetch 를 바로(같은 차례에) 부르는 동안만 */
  var rawFetch=window.fetch;
  window.fetch=function(url,opt){
    if(CUR && String(url)===String(API) && opt && typeof opt.body==="string"){
      try{ var b=JSON.parse(opt.body); if(b && typeof b==="object" && !b.rid){ b.rid=CUR; opt=Object.assign({},opt,{body:JSON.stringify(b)}); } }catch(e){}
    }
    return rawFetch.apply(this,[url,opt]);
  };

  /* 누른 단추 기억 (다시 하기 · 잠그기) */
  var LAST={el:null,t:0}, PAGEBTN={el:null,t:0}, TAPS=[];
  document.addEventListener("click",function(ev){
    var b=ev.target&&ev.target.closest&&ev.target.closest("button,[role=button],a.btn,a.cgg-btn");
    if(!b || b.hasAttribute("data-v566-retry")) return;
    var now=Date.now();
    var dup=TAPS.filter(function(x){ return x.el===b && now-x.t<800; }).length;
    TAPS=TAPS.filter(function(x){ return now-x.t<800; }); TAPS.push({el:b,t:now});
    if(dup && b.closest(".cgg-dlg,#ovl,.sheet,.cgg-sheet")){ ev.preventDefault(); ev.stopImmediatePropagation(); return; }   /* 확인 창 단추를 0.8초 안 두 번 (화면 단추는 저장 중 잠금으로 막아요) */
    LAST={el:b,t:now};
    if(!b.closest(".cgg-dlg,#ovl,.sheet,.cgg-sheet")) PAGEBTN={el:b,t:now};
  },true);

  function lockBtn(b){ if(!b || b.disabled) return null; b.disabled=true; b.setAttribute("aria-busy","true"); return b; }
  function unlockBtn(b){ if(!b) return; b.disabled=false; b.removeAttribute("aria-busy"); }

  /* 다시 하기 단추 */
  function retryBtn(origin){
    return function(){
      var target=(origin.el&&origin.el.isConnected&&!origin.el.closest("[hidden]"))?origin.el:(origin.page&&origin.page.isConnected?origin.page:null);
      if(target){ target.disabled=false; target.click(); }
      else if(typeof bar==="function") bar("처음 누른 단추를 다시 눌러 주세요.","info");
    };
  }
  function niceMsgSafe(m){ try{ return typeof niceMsg==="function"?niceMsg(m):String(m||"저장하지 못했어요. 다시 시도해 주세요."); }catch(e){ return "저장하지 못했어요. 다시 시도해 주세요."; } }
  function showRetry(origin, msg){
    setTimeout(function(){
      var where=null, m=document.querySelector("#bar .msg.err");
      /* 누른 단추가 열린 창(배달 상세 · 시트) 안이면 맨 위 알림이 창에 가려요 — 창 안에 빨간 글 + 다시 하기 */
      var box=origin.el&&origin.el.isConnected&&origin.el.closest(".modal,.sheet,.cgg-sheet");
      if(box && box.getClientRects().length){
        var old=box.querySelector("[data-v566-err]"); if(old) old.remove();
        var d=document.createElement("div"); d.className="msg err"; d.setAttribute("data-v566-err","1"); d.setAttribute("role","alert");
        d.style.margin="0 0 10px"; d.textContent=(m&&m.firstChild&&m.firstChild.nodeType===3?m.firstChild.nodeValue:"")||niceMsgSafe(msg);
        var host=origin.el.parentNode; host.parentNode.insertBefore(d,host); where=d;
      }
      else if(m) where=m;
      else{   /* 화면 안 알림 칸(say) — 대화 창 안은 그 창 단추로 다시 해요 */
        var cand=Array.prototype.filter.call(document.querySelectorAll("#main .err, #main .msg.err"),function(e){
          return e.offsetParent!==null && !e.closest(".cgg-dlg,#ovl") && (!msg || String(e.textContent).indexOf(String(msg).slice(0,12))>=0); });
        where=cand[cand.length-1]||null;
      }
      if(!where || where.querySelector("[data-v566-retry]")) return;
      var r=document.createElement("button"); r.type="button"; r.className="cgg-btn sm"; r.setAttribute("data-v566-retry","1");
      r.style.marginLeft="10px"; r.textContent="다시 하기"; r.onclick=retryBtn(origin); where.appendChild(r);
    },0);
  }

  var raw=window.call;
  window.call=function(fn,args){
    if(!isWrite(fn,args)) return raw.apply(this,arguments);
    var k=keyOf(fn,args);
    if(FLY[k]) return FLY[k];   /* 같은 일이 처리 중 — 새로 보내지 않음 */
    var lost=LOST[k], rid=(lost && Date.now()-lost.t<30*60000) ? lost.rid : newRid();
    var now=Date.now(), origin={el:(now-LAST.t<4000)?LAST.el:null, page:(now-PAGEBTN.t<60000)?PAGEBTN.el:null};
    var locked=lockBtn(origin.el && !origin.el.closest(".cgg-dlg,#ovl") ? origin.el : null);
    var p;
    CUR=rid; try{ p=raw.apply(this,arguments); } finally{ CUR=""; }
    FLY[k]=p;
    p.then(function(){ delete FLY[k]; delete LOST[k]; unlockBtn(locked); },
      function(e){ delete FLY[k]; unlockBtn(locked);
        var m=e&&e.message;
        if(unknown(m)) LOST[k]={rid:rid,t:Date.now()}; else delete LOST[k];
        if(fn==="feeRules" && typeof bar==="function") bar("검사자 수수료를 서버에 저장하지 못했어요 — "+(m||"다시 시도해 주세요."),"err");
        showRetry(origin, m); });
    return p;
  };
  window.chkV566={isWrite:isWrite, fly:function(){ return Object.keys(FLY).length; }};
})();
</script>

<script>
(function(){ function put(){ try{
  if(!window.CGG || !CGG.trial) return; var m=document.querySelector(".cgg-main"); if(!m || m.querySelector(".cgg-trial")) return;
