/* 세로·아이콘 메뉴에서만 그림을 씁니다 (가로 메뉴·폰은 글자만) */
.wrap.pc.side #tabs button::before{
  content:"";display:block;width:18px;height:18px;flex:0 0 auto;background-color:currentColor;
  -webkit-mask:var(--ic) center/contain no-repeat;mask:var(--ic) center/contain no-repeat;
  font-size:0;filter:none;opacity:1}
.wrap.pc.side #setSub button::before{display:none}
.wrap.pc:not(.side) #tabs button::before,.wrap:not(.pc) #tabs button::before{display:none}
/* 화면 안쪽 작은 탭에는 그림 자리를 만들지 않습니다 */
.tabs:not(#tabs) button::before{content:none !important;display:none !important}
.wrap.iconmenu > header .tabs button::before{width:22px;height:22px}
.wrap.iconmenu > header .tabs button{color:#8FA5C2}
.wrap.iconmenu > header .tabs button:hover{color:#fff}
.wrap.iconmenu > header .mini::before{
  content:"";display:block;width:19px;height:19px;background-color:currentColor;
  -webkit-mask:var(--ic) center/contain no-repeat;mask:var(--ic) center/contain no-repeat}
.wrap.iconmenu.setopen > header .mini::before{display:none}


/* ── 가로(위) 배치 — 시안대로 머리말 한 줄 ───────────────── */
@media (min-width:1000px){
  .wrap.pc:not(.side) > header{padding:13px 18px}
  .wrap.pc:not(.side) > header .brandrow{flex-wrap:nowrap;align-items:center;gap:0}
  .wrap.pc:not(.side) > header .logo{width:36px;height:36px;border-radius:11px;font-size:12px;flex:0 0 auto}
  .wrap.pc:not(.side) > header .brandrow > .logo + div{margin-left:10px;flex:0 0 auto}
  .wrap.pc:not(.side) > header .brandrow h1{font-size:14.5px;line-height:1.25}
  .wrap.pc:not(.side) > header .sub#hSub{font-size:10.5px;margin-top:1px}
  .wrap.pc:not(.side) > header #hVer{font-size:10px;opacity:.5;margin-top:0}
  .wrap.pc:not(.side) > header .bizcard{display:flex;align-items:center;flex:1 1 auto;min-width:0;margin-left:16px}
  .wrap.pc:not(.side) > header .bizname{margin:0;padding:2px 0 2px 16px;border-left:2px solid var(--line);
    max-width:none;flex:1 1 auto;min-width:0}
  .wrap.pc:not(.side) > header .bizname b{font-size:21px;font-weight:900;letter-spacing:-.02em;color:var(--text);
    -webkit-text-stroke:0}
  .wrap.pc:not(.side) > header .bizname small{font-size:11px}
  .wrap.pc:not(.side) > header .hdr-right{flex:0 0 auto;align-items:center;gap:5px;flex-wrap:wrap;
    justify-content:flex-end;max-width:62%}
  .wrap.pc:not(.side) > header .hr1,.wrap.pc:not(.side) > header .hr2{display:contents}
  .wrap.pc:not(.side) > header .mini{font-size:11.5px;padding:6px 9px;border-radius:8px}
  .wrap.pc:not(.side) > header .who{font-size:10.5px;line-height:1.2;text-align:right;margin-right:3px}
  .wrap.pc:not(.side) > header .who b{font-size:12px}
  .wrap.pc:not(.side) > header .who .av{display:none}
  .wrap.pc:not(.side) > header #pollSel{font-size:11.5px;padding:5px 7px}
  .wrap.pc:not(.side) > header #dbState{background:var(--good-soft,#E7F7EF);border-color:var(--good);
    color:var(--good);font-weight:800}
  .wrap.pc:not(.side) > header #btnMode{background:var(--brand);border-color:var(--brand);color:#fff}
  .wrap.pc:not(.side) .tabs{margin-top:10px}
  .wrap.pc:not(.side) .tabs button{padding:11px 14px}
}
/* 메뉴 아이콘은 단색 느낌으로 (선택된 것만 또렷하게) */
.wrap.side:not(.iconmenu) > header .hr1 #btnLayout{order:-1 !important}
.wrap.iconmenu > header .hr1 #btnLayout{order:-1 !important}

/* ── 세로(사이드) 배치 — 시안 MainB 수치 그대로 ───────────── */
@media (min-width:1000px){
  .wrap.side:not(.iconmenu){max-width:none;width:auto;margin:0;padding:18px 24px 28px 272px}
  .wrap.side:not(.iconmenu) > header{
    position:fixed;left:0;top:0;bottom:var(--fixbot,0px);width:248px;margin:0;z-index:40;
    padding:16px 14px 14px;border-bottom:0;border-right:1px solid var(--line);background:var(--surface);
    overflow-y:auto;display:flex;flex-direction:column}

  /* 맨 위: 로고 + 프로그램 이름 */
  .wrap.side:not(.iconmenu) > header .brandrow{display:grid;grid-template-columns:42px minmax(0,1fr);
    align-items:center;column-gap:11px;padding:0 4px;flex:none}
  .wrap.side:not(.iconmenu) > header .logo{margin:0;width:42px;height:42px;border-radius:11px;font-size:13px}
  .wrap.side:not(.iconmenu) > header .brandrow > .logo + div{min-width:0}
  .wrap.side:not(.iconmenu) > header .brandrow h1{font-size:15.5px;line-height:1.25;letter-spacing:-.02em}
  .wrap.side:not(.iconmenu) > header .sub#hSub{display:none}
  .wrap.side:not(.iconmenu) > header #hVer{font-size:11px;color:#94A0B3;opacity:1;margin-top:1px}

  /* 업체 카드 */
  .wrap.side:not(.iconmenu) > header .bizcard{display:block;grid-column:1/-1;width:100%;margin:14px 0 12px;padding:12px 13px;
    border-radius:11px;background:var(--surface2);border:1px solid var(--line);flex:none}
  .wrap.side:not(.iconmenu) > header .bizcard .bizname{display:block;margin:0;padding:0;border-left:0;max-width:none;width:auto}
  .wrap.side:not(.iconmenu) > header .bizcard .bizname b{font-size:17px;font-weight:700;white-space:normal;
    line-height:1.3;letter-spacing:-.025em;overflow:visible;text-overflow:clip;-webkit-text-stroke:0;color:var(--accent)}
  .wrap.side:not(.iconmenu) > header .bizcard .bizname small{display:none}
  .wrap.side:not(.iconmenu) > header .bizcard .who{display:flex;align-items:center;gap:7px;width:auto;margin:8px 0 0;
    text-align:left;max-width:none;overflow:visible;white-space:normal}
  .wrap.side:not(.iconmenu) > header .bizcard .who br{display:none}
  .wrap.side:not(.iconmenu) > header .bizcard .who .wt{min-width:0}
  .wrap.side:not(.iconmenu) > header .bizcard .who b{display:block;font-size:13px;font-weight:700;color:var(--text)}
  .wrap.side:not(.iconmenu) > header .bizcard .who #meRole{display:block;font-size:11px;color:var(--muted)}
  .wrap.side:not(.iconmenu) > header .who .av{display:flex;width:26px;height:26px;font-size:11.5px}

  /* 큰 메뉴 */
  .wrap.side:not(.iconmenu) > header .tabs{flex-direction:column;background:transparent;padding:0;gap:2px;
    margin:0;overflow:visible;flex:none;border-radius:0}
  .wrap.side:not(.iconmenu) > header .tabs button{flex:0 0 auto;text-align:left;padding:11px 13px;font-size:14.5px;
    border-radius:10px;display:flex;align-items:center;gap:11px;font-weight:500;color:#3C4758;
    border:1px solid transparent;box-shadow:none;min-width:0}
  .wrap.side:not(.iconmenu) > header #tabs button::before{width:18px;height:18px}
  .wrap.side:not(.iconmenu) > header .tabs button:hover{background:var(--surface2)}
  .wrap.side:not(.iconmenu) > header .tabs button[aria-selected="true"]{background:var(--brand-soft);
    border-color:#C6E0F8;color:#10508F;font-weight:700;box-shadow:none}

  /* 설정 안 작은 메뉴 */
  .wrap.side:not(.iconmenu) > header #setSub{margin:4px 0 0 26px;padding:4px 0 0 10px;flex:none;
    border-left:2px solid var(--line);gap:0;flex-direction:column;background:transparent;overflow:visible}
  .wrap.side:not(.iconmenu) > header #setSub button{font-size:13px;padding:8px 10px;color:var(--muted);
    font-weight:600;text-align:left;flex:none;border:0}
  .wrap.side:not(.iconmenu) > header #setSub button::before{display:none}
  .wrap.side:not(.iconmenu) > header #setSub button[aria-selected="true"]{background:transparent;color:var(--brand);font-weight:800}

  /* 맨 아래: 연결됨 · 현장 화면 · 작은 버튼 3개 */
  .wrap.side:not(.iconmenu) > header > .hdr-right{display:flex;flex-direction:column;align-items:stretch;gap:8px;
    margin:auto 0 0;padding-top:14px;flex:none;width:100%;grid-column:1/-1}
  .wrap.side:not(.iconmenu) > header .hr1{display:flex;gap:6px;order:2}
  .wrap.side:not(.iconmenu) > header .hr2{display:flex;flex-direction:column;gap:8px;order:1}
  .wrap.side:not(.iconmenu) > header .mini{width:100%;justify-content:center;display:flex;align-items:center;
    height:34px;padding:0 12px;border-radius:9px;font-size:12.5px;font-weight:600}
  .wrap.side:not(.iconmenu) > header .hr1 .mini{flex:1 1 0;width:auto;padding:0 8px;font-size:12px}
  .wrap.side:not(.iconmenu) > header #dbState{order:1;background:#EAF7F0;border-color:#B7E4CC;
    color:#0F6B43;font-weight:700}
  .wrap.side:not(.iconmenu) > header #btnMode{order:2;background:var(--brand);border-color:var(--brand);color:#fff;
    height:40px;font-size:14.5px;font-weight:700;border-radius:10px}
  .wrap.side:not(.iconmenu) > header #btnHelp{color:#C0392B;font-weight:700}
  .wrap.side:not(.iconmenu) > header #hdrBreak,.wrap.side:not(.iconmenu) > header #btnOut{display:none}
  .wrap.side:not(.iconmenu) > header #btnMore{display:none}

  /* 본문 맨 위 오른쪽 도구 버튼 (시안 수치) */
  .wrap.side:not(.iconmenu) #topBar,.wrap.iconmenu #topBar{display:flex;justify-content:flex-end;align-items:center;
    gap:7px;margin:0 0 14px;min-height:32px;flex-wrap:wrap}
  .wrap.side:not(.iconmenu) #topBar .mini,.wrap.iconmenu #topBar .mini{width:auto;height:32px;padding:0 11px;
    font-size:12.5px;border-radius:9px;font-weight:600}
  .wrap.side:not(.iconmenu) #topBar #pollSel,.wrap.iconmenu #topBar #pollSel{max-width:none;width:auto;height:32px}
  .wrap.side:not(.iconmenu) #topBar #btnTrash{background:var(--brand-soft);border-color:#C6E0F8;color:#10508F;font-weight:700}

  /* ── 아이콘만 보이는 좁은 세로 메뉴 (시안 MainC 수치 그대로) ── */
  .wrap.iconmenu{padding:0 24px 28px 102px}
  .wrap.iconmenu > header{position:fixed;left:0;top:0;bottom:var(--fixbot,0px);width:78px;margin:0;z-index:40;
    padding:14px 0;background:#0B2545;border-right:0;border-bottom:0;overflow-y:auto;
    display:flex;flex-direction:column;align-items:center;gap:6px}
  .wrap.iconmenu > header .brandrow{display:flex;flex-direction:column;align-items:center;width:100%;gap:0;flex:none}

  .wrap.iconmenu > header .bizcard,
  .wrap.iconmenu > header .sub,
  .wrap.iconmenu > header h1,
  .wrap.iconmenu > header #setSub,
  .wrap.iconmenu > header #hdrBreak{display:none}
  .wrap.iconmenu > header .logo{width:44px;height:44px;border-radius:12px;margin:0 0 6px;flex:0 0 auto;font-size:13px}
  .wrap.iconmenu > header .tabs{width:auto;gap:6px;margin:0;flex:none;flex-direction:column;align-items:center;
    background:transparent;padding:0;border-radius:0;overflow:visible}

    color:#5B6577;background:transparent;border:1px solid transparent;box-shadow:none}
  .wrap.iconmenu > header #tabs button::before{width:21px;height:21px}
  .wrap.iconmenu > header .tabs button:hover{background:rgba(255,255,255,.07);color:#9FB6D0}
  .wrap.iconmenu > header .tabs button[aria-selected="true"]{background:#E7F2FC;border-color:#C6E0F8;color:#10508F;box-shadow:none}
  .wrap.iconmenu > header > .hdr-right{display:flex;flex-direction:column;align-items:center;
    margin:auto 0 0;gap:8px;padding:0;width:auto;flex:none}
  .wrap.iconmenu > header .hr1,.wrap.iconmenu > header .hr2{display:contents}
  .wrap.iconmenu > header .mini{width:46px;height:46px;border-radius:12px;padding:0;font-size:0;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;
    background:transparent;border:1px solid rgba(255,255,255,.22);color:#B7DDF7}
  .wrap.iconmenu > header .mini::before{width:21px;height:21px}
  .wrap.iconmenu > header #btnMode{order:1 !important;background:#1668C4;border-color:#1668C4;color:#fff}
  .wrap.iconmenu > header #btnMore{order:2 !important}
  .wrap.iconmenu > header .who{order:3 !important;display:flex;align-items:center;justify-content:center;
    width:auto;max-width:none;margin:0;overflow:visible;cursor:pointer;flex:0 0 auto}
  .wrap.iconmenu > header .who .wt{display:none}
  .wrap.iconmenu > header .who .av{display:flex;width:34px;height:34px;background:rgba(255,255,255,.16);
    color:#fff;font-size:12.5px;font-weight:700}
  .wrap.iconmenu > header #dbState,
  .wrap.iconmenu > header #btnHelp,
  .wrap.iconmenu > header #btnOut2,
  .wrap.iconmenu > header #btnInvite,
  .wrap.iconmenu > header #btnRefresh{display:none}

  /* 아이콘 배치 위쪽 가로 띠 (시안 수치) */
  .wrap.iconmenu #topBand{display:flex;align-items:center;gap:14px;background:var(--surface);
    border-bottom:1px solid var(--line);margin:0 -24px 16px;padding:11px 24px}
  .wrap.iconmenu #topBand .tb-logo{display:none}
  .wrap.iconmenu #topBand .tb-name{min-width:0;flex:1 1 auto;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .wrap.iconmenu #topBand .tb-name b{font-size:20px;font-weight:700;letter-spacing:-.025em;color:var(--text)}
  .wrap.iconmenu #topBand .tb-name small{font-size:12px;color:var(--muted);font-weight:500}
  .wrap.iconmenu #topBand .tb-right{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .wrap.iconmenu #topBand .tb-who{text-align:right;white-space:nowrap;line-height:1.25}
  .wrap.iconmenu #topBand .tb-who b{display:block;font-size:12.5px;font-weight:700}
  .wrap.iconmenu #topBand .tb-who span{display:block;font-size:11px;color:var(--muted)}
  .wrap.iconmenu #topBand #dbState{display:flex;align-items:center;height:32px;padding:0 11px;border-radius:9px;
    border:1px solid #B7E4CC;background:#EAF7F0;color:#0F6B43;font-size:12.5px;font-weight:700}
  .wrap.iconmenu #topBar{margin:0 0 14px}
  .wrap.iconmenu #topBar .mini{height:32px;padding:0 11px;font-size:12.5px;border-radius:9px}

  /* 설정에 들어가면 메뉴 이름을 볼 수 있게 잠깐 넓어집니다 */
  .wrap.iconmenu.setopen{padding-left:250px}
  .wrap.iconmenu.setopen > header{width:224px;align-items:stretch;padding:16px 13px;gap:0}
  .wrap.iconmenu.setopen > header .brandrow{flex-direction:row;align-items:flex-start;gap:9px}
  .wrap.iconmenu.setopen > header .brandrow::after{display:none}
  .wrap.iconmenu.setopen > header .brandrow > .logo + div{display:block;flex:1 1 90px;min-width:0}
  .wrap.iconmenu.setopen > header h1{display:block;font-size:15px;color:#fff;line-height:1.25}
  .wrap.iconmenu.setopen > header .sub#hVer{display:block;color:#8FC9F2;opacity:.8;font-size:10.5px}
  .wrap.iconmenu.setopen > header .logo{width:34px;height:34px;margin:0}
  .wrap.iconmenu.setopen > header .tabs{width:100%;align-items:stretch;margin-top:16px;gap:2px}
  .wrap.iconmenu.setopen > header .tabs button{width:100%;font-size:14px;height:auto;padding:10px 11px;
    text-align:left;justify-content:flex-start;gap:9px;color:#9FB6D0;border-radius:9px}
  .wrap.iconmenu.setopen > header #tabs button::before{width:17px;height:17px}
  .wrap.iconmenu.setopen > header .tabs button[aria-selected="true"]{background:rgba(255,255,255,.12);
    border-color:transparent;color:#fff}
  .wrap.iconmenu.setopen > header #setSub{display:flex;flex-direction:column;margin:4px 0 0 26px;
    padding:4px 0 0 10px;border-left:2px solid rgba(255,255,255,.2);background:transparent;gap:0}
  .wrap.iconmenu.setopen > header #setSub button{font-size:13px;padding:8px 10px;color:#9DB0C6;
    text-align:left;font-weight:600;width:100%}
  .wrap.iconmenu.setopen > header #setSub button[aria-selected="true"]{color:#fff;font-weight:800;background:transparent}
  .wrap.iconmenu.setopen > header > .hdr-right{align-items:stretch;width:100%;padding-top:14px}
  .wrap.iconmenu.setopen > header .mini{width:100%;font-size:12px;height:auto;padding:8px 10px}
  .wrap.iconmenu.setopen > header .mini::before{display:none}
  .wrap.iconmenu.setopen > header .who{justify-content:flex-start}

  .wrap.side .sums{grid-template-columns:repeat(4,1fr)}
  .wrap.side .pcgrid{grid-template-columns:1fr 1fr}
  .wrap.side table{font-size:13.5px}
  .wrap.side th,.wrap.side td{padding:10px 9px}
}
/* ── 가로(위) 배치에서 설정 안 메뉴 구분 ───────────────── */
.wrap:not(.side) > header #setSub{
  background:transparent;border-top:1px solid var(--line);border-radius:0;
  padding:8px 0 0 28px;margin-top:8px;gap:2px;justify-content:flex-start}
.wrap:not(.side) > header #setSub button{
  flex:none;font-size:13.5px;padding:8px 14px;color:var(--muted);border-radius:8px}
.wrap:not(.side) > header #setSub button[aria-selected="true"]{
  background:var(--brand-soft);color:var(--brand);box-shadow:none}
.wrap:not(.side) > header #setSub::before{
  content:"설정";align-self:center;font-size:11.5px;font-weight:800;color:var(--muted);
  margin-right:6px;opacity:.7}

/* ── 대시보드 ─────────────────────────── */
.dash{display:grid;grid-template-columns:1.45fr 1fr;gap:14px;align-items:start}
@media (max-width:1100px){.dash{grid-template-columns:1fr}}
.dashhead{margin:0 0 14px}
.dashhead h2{font-size:26px;font-weight:900;margin:0;letter-spacing:-.02em}
.dashhead .sub2{font-size:13px;color:var(--muted);margin-top:2px}
.dh-row{display:flex;align-items:center;gap:8px;position:relative}
.calbtn{font-size:26px;line-height:1;display:inline-flex;align-items:center;justify-content:center;padding:6px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);color:var(--brand);cursor:pointer}
.calbtn:hover{background:var(--brand-soft)}
.mpop{position:absolute;top:calc(100% + 8px);left:0;z-index:40;width:300px;max-width:calc(100vw - 32px);background:var(--surface);
  border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(16,32,52,.18);padding:12px}
.mpop .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mpop .mh b{font-size:17px}
.mpop .mh button{border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:9px;width:38px;height:34px;font-size:18px;cursor:pointer}
.mpop .mg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mpop .mg button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:9px 0 6px;cursor:pointer;font-size:14.5px;font-weight:700}
.mpop .mg button small{display:block;font-size:10.5px;font-weight:600;color:var(--muted);min-height:14px}
.mpop .mg button.has small{color:var(--brand)}
.mpop .mg button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.mpop .mg button.on small{color:#fff}
.mpop .mg button.now{outline:2px solid var(--accent);outline-offset:-2px}
.mpop .mf{display:flex;gap:6px;margin-top:10px}
.mpop .mf button{flex:1;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:9px;padding:8px;font-weight:700;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.cal .hd{text-align:center;font-size:11.5px;color:var(--muted);font-weight:800;padding:2px 0}
.cal .d{min-height:78px;border:1px solid var(--line);border-radius:10px;padding:6px 7px;
  background:var(--surface2);cursor:pointer;overflow:hidden}
.cal .d.blank{border:0;background:transparent;cursor:default}
.cal .d:hover{border-color:var(--brand)}
.cal .d.today{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.cal .n{font-size:12px;font-weight:800;color:var(--muted)}
.cal .n.sun{color:var(--danger)}
.cal .amt{font-size:13.5px;font-weight:900;margin-top:5px;letter-spacing:-.02em}
.cal .cars{font-size:11px;color:var(--muted);margin-top:1px}
.cal .memo{font-size:11px;font-weight:700;color:#8a4a00;background:#fff1e0;border-radius:6px;padding:1px 5px;margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .memo.done{color:var(--muted);background:var(--surface2);text-decoration:line-through;font-weight:500}
.memorow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.memorow input[type=checkbox]{width:24px;height:24px;flex:none}
.memorow .mt{flex:1;min-width:0;font-size:15px;word-break:break-all}
.memorow.done .mt{color:var(--muted);text-decoration:line-through}
.memorow .mtime{font-weight:800;color:var(--brand);margin-right:6px}
.memorow small{color:var(--muted);font-size:11.5px}
.cal .bar{height:3px;border-radius:2px;background:var(--brand);margin-top:4px;opacity:.85}
.todo{display:grid;gap:8px}
.todo button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-family:inherit;
  background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--text)}
.todo button:hover{border-color:var(--brand)}
.todo .cnt{font-size:20px;font-weight:900;min-width:38px;text-align:center}
.todo .tx{flex:1}
.todo .tx b{display:block;font-size:14.5px;font-weight:800}
.todo .tx span{font-size:12px;color:var(--muted)}
.todo .go{color:var(--muted);font-size:18px}
/* 중요한 할 일 (자재 부족 · 청구서 · 세금계산서) */
.todo button.imp{background:#fdecec;border:2px solid #d93025;box-shadow:0 2px 10px rgba(217,48,37,.15)}
.todo button.imp .cnt{color:#c5221f !important;font-size:24px}
.todo button.imp .tx b{color:#a50e0e;font-size:15.5px}
.todo button.imp .tx span{color:#8c1d18;font-weight:600}
.todo button.imp .go{color:#c5221f}
.todo .imptag{display:inline-block;background:#d93025;color:#fff;font-size:11px;font-weight:900;border-radius:6px;
  padding:1px 7px;margin-right:6px;vertical-align:2px;animation:impblink 1.6s ease-in-out infinite}
@keyframes impblink{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.todo .imptag{animation:none}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .todo button.imp{background:#3a1512}
  :root:not([data-theme="light"]) .todo button.imp .tx b{color:#ffb4ab}:root:not([data-theme="light"]) .todo button.imp .tx span{color:#ffdad6}}
.prog{height:12px;border-radius:7px;background:var(--surface2);overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;background:var(--good)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend b{color:var(--text)}
.mini-row{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.mini-row:last-child{border-bottom:0}

.phone{border:10px solid #222c39;border-radius:26px;background:var(--surface);padding:0 0 14px;max-width:330px;margin:0 auto;overflow:hidden}
.phone-top{background:#222c39;color:#fff;text-align:center;font-size:12px;font-weight:700;padding:6px}
.phone-from{text-align:center;font-size:11px;color:var(--muted);padding:8px 0 6px}
.phone-msg{background:var(--surface2);border-radius:14px;margin:0 12px;padding:12px 13px;
  font-size:13px;white-space:pre-wrap;line-height:1.6;min-height:120px;word-break:break-all;overflow-wrap:anywhere}
#smsPrev,#billPrev,#bmPrev,#of_prev{word-break:break-all;overflow-wrap:anywhere}

.thumb{width:44px;height:34px;object-fit:cover;border-radius:6px;vertical-align:middle;border:1px solid var(--line)}
.photo2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.photo2 .pl{font-size:11.5px;font-weight:800;color:var(--muted);margin-bottom:4px}
.photo2 img{width:100%;height:150px;object-fit:cover;border-radius:10px;display:block}
.photo2 .noph{height:150px;border-radius:10px;background:var(--surface2);border:1px dashed var(--line);
  display:grid;place-items:center;color:var(--muted);font-size:12px}

.pgnums{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;align-items:center}
.pgnum{min-width:34px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);
  font-family:inherit;font-weight:700;font-size:13px;color:var(--text);cursor:pointer}
.pgnum:hover{border-color:var(--brand)}
.pgnum.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pgdots{color:var(--muted);padding:0 2px;font-size:13px}

/* 현장 화면 미리보기 (넓은 화면에서 폰처럼) */
@media (min-width:1000px){
  .wrap.fieldview{max-width:430px;margin:18px auto;padding-left:16px;padding-right:16px;
    border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 50px rgba(16,32,52,.16);
    background:var(--bg);overflow:hidden}
  .wrap.fieldview > header{margin:0 -16px 20px;border-radius:22px 22px 0 0}
  .fieldnote{position:fixed;left:50%;transform:translateX(-50%);top:8px;z-index:60;
    background:var(--brand);color:#fff;font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:999px;
    box-shadow:var(--shadow)}
}
.fieldnote{display:none}

.lyrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lycard{font-family:inherit;text-align:left;cursor:pointer;background:var(--surface);
  border:2px solid var(--line);border-radius:14px;padding:11px;display:block}
.lycard b{display:block;font-size:14px;margin-top:9px}
.lycard small{display:block;font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:3px}
.lycard[aria-selected="true"]{border-color:var(--brand);background:var(--brand-soft)}
.lyt{height:96px;border-radius:9px;background:#EEF2F7;border:1px solid var(--line);
  overflow:hidden;display:flex;flex-direction:column}
.lyt.sd2{flex-direction:row}
.lyt .hd{height:17px;background:#fff;border-bottom:1px solid #DCE4EE;display:flex;align-items:center;gap:3px;padding:0 5px}
.lyt .lg{width:9px;height:9px;border-radius:3px;background:var(--brand);flex:0 0 auto}
.lyt .nm{height:5px;width:34px;border-radius:3px;background:#B9C8DA}
.lyt .mt{height:13px;background:#fff;display:flex;gap:4px;align-items:center;padding:0 5px;border-bottom:1px solid #DCE4EE}
.lyt .mt .m{height:5px;width:16px;border-radius:3px;background:#C9D6E5}
.lyt .mt .m:first-child{background:var(--brand)}
.lyt .sb{width:30px;flex:0 0 auto;background:#fff;border-right:1px solid #DCE4EE;padding:5px 4px;
  display:flex;flex-direction:column;gap:4px;align-items:center}
.lyt .sb .bc{width:100%;height:11px;border-radius:3px;background:var(--brand-soft)}
.lyt .ms{width:100%;display:flex;flex-direction:column;gap:3px}
.lyt .ms .m{height:5px;width:100%;border-radius:3px;background:#C9D6E5}
.lyt .ms .m:first-child{background:var(--brand)}
.lyt .sb.nar{width:14px;background:#0B2545;border-right:0;padding:5px 3px}
.lyt .sb.nar .lg{background:#4E8FD8}
.lyt .ms.ic .m{height:6px;width:100%;background:#42587A;border-radius:2px}
.lyt .ms.ic .m:first-child{background:#fff}
.lyt .rt2{flex:1 1 auto;display:flex;flex-direction:column;min-width:0}
.lyt .bnd{height:14px;background:#fff;border-bottom:1px solid #DCE4EE}
.lyt .bdy{flex:1 1 auto;display:flex;gap:4px;padding:5px}
.lyt .bdy .c{flex:1 1 auto;border-radius:4px;background:#fff;border:1px solid #DCE4EE}
.lyt .bdy .c.s{flex:0 0 26px}
@media (max-width:640px){.lyrow{grid-template-columns:1fr}}
.fzrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fzrow .btn{font-weight:800}
.fzrow .btn[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:#fff}

/* ── 현장(폰) 머리말 · 아래 탭바 — 시안대로 ────────────── */
.wrap:not(.pc) > header{background:#0B2545;border-bottom:0;border-radius:0}
.wrap:not(.pc) > header .brandrow{align-items:center}
.wrap:not(.pc) > header .logo{background:rgba(255,255,255,.14)}
.wrap:not(.pc) > header .bizname{border-left:0;padding-left:0;margin-left:10px}
.wrap:not(.pc) > header .bizname b{color:#fff;font-size:18px;font-weight:800;-webkit-text-stroke:0}
.wrap:not(.pc) > header .bizname small{color:#B7C6DE;opacity:1;font-size:11.5px;display:flex;

.wrap:not(.pc) > header .bizname small .dot{width:7px;height:7px;border-radius:50%;background:#5BD6A4;flex:0 0 auto}
.fhcam .shot,.fhcam .top .cic{filter:none}

.wrap:not(.pc) > header .mini{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.26);color:#fff}
.wrap:not(.pc) > header .who{color:#B7C6DE}
.wrap:not(.pc) > header .who b{color:#fff}
.wrap:not(.pc) > header #dbState{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.26);color:#9EE6C4}

.wrap:not(.pc) .tabs{background:rgba(255,255,255,.1);margin:8px 0 0;padding:3px;border-radius:11px}
.wrap:not(.pc) .tabs button{color:#B7C6DE;font-size:13.5px;padding:8px 6px}
.wrap:not(.pc) .tabs button[aria-selected="true"]{background:rgba(255,255,255,.16);color:#fff;box-shadow:none}
.wrap:not(.pc) .tabs button::before{display:none}
.wrap:not(.pc) #setSub{display:none}

/* ── 현장(모바일) 홈 ───────────────────────────── */
.fhbig{display:flex;gap:9px;margin-bottom:9px}
.fhbig button{flex:1;height:70px;border:0;border-radius:16px;color:#fff;cursor:pointer;
  font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  box-shadow:0 6px 18px rgba(11,37,69,.18);-webkit-tap-highlight-color:transparent}

.fhbig .tx{font-size:16px;font-weight:800;letter-spacing:-.02em}
.fhbig .fin{background:var(--accent)}
.fhbig .fout{background:var(--brand)}
