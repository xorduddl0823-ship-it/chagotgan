        yes:"확인", no:false, warnKind:kind });
}
function fail(e){ bar((e&&e.message)||"처리하지 못했어요. 다시 시도해 주세요.", "err"); busy(false); }

/* ───────── 로그인 화면 ───────── */
var LG_TICK="";   /* v28: 처음 비밀번호 확인 짝 (login 응답 __tick) */
function drawLogin(){
  $("wrap").hidden=true;
  var out=""; try{ out=sessionStorage.getItem("cgg_out")||""; sessionStorage.removeItem("cgg_out"); }catch(e){}
  if(out==="1") setTimeout(function(){ say("lg-msg","로그인 시간이 지났습니다. 다시 로그인해 주세요.","info"); },30);
  $("root").innerHTML =
  '<div class="login"><div class="loginbox">'+
    '<div class="top"><div class="lg">체크</div><h1>차곳간체크</h1>'+
      '<p>성능점검 정산 · 청구 · 입금</p></div>'+
    '<div class="lcard">'+
      '<h2>로그인</h2>'+
      '<div class="fld"><label class="f" for="lg-ph">휴대폰 번호</label>'+
        '<input type="text" id="lg-ph" inputmode="numeric" placeholder="010-0000-0000" autocomplete="username"></div>'+
      '<div class="fld"><label class="f" for="lg-pw">비밀번호</label>'+
        '<input type="password" id="lg-pw" placeholder="비밀번호" autocomplete="current-password"></div>'+
      '<div class="fld" id="lg-codebox" hidden><label class="f" for="lg-code">확인 번호 6자리</label>'+
        '<input type="text" id="lg-code" inputmode="numeric" maxlength="6" placeholder="문자로 받은 6자리" autocomplete="one-time-code"></div>'+
      '<button class="go" id="lg-go">로그인</button>'+
      '<div id="lg-msg" class="hide"></div>'+
      '<hr>'+
      '<button class="sub2" id="lg-find">비밀번호를 잊으셨나요?</button>'+
      '<button class="sub2" id="lg-ask">직원 계정이 필요하세요?</button>'+
      '<p class="note">처음 들어오시는 분은 6자 이상 비밀번호를 적고 로그인을 누르세요.<br>'+
        '휴대폰으로 확인 번호 6자리를 보내 드리며, 확인 번호를 넣으면 그 비밀번호로 정해집니다.<br>'+
        '차곳간에서 쓰시던 계정으로도 들어올 수 있습니다.</p>'+
    '</div>'+
    '<p class="foot">차곳간체크 · 티와이컴퍼니</p>'+
  '</div></div>';
  $("lg-find").onclick=function(){ say("lg-msg","대표님께 비밀번호를 다시 정해 달라고 하시면 됩니다. (설정 → 직원 권한)","info"); };
  $("lg-ask").onclick=function(){ say("lg-msg","대표님이 설정 → 직원 권한에서 휴대폰 번호를 넣어 주시면 바로 들어올 수 있습니다.","info"); };
  var ph=$("lg-ph"), pw=$("lg-pw");
  ph.value=get("cgg_lastph",""); (ph.value?pw:ph).focus();
  function go(){
    var p=ph.value.replace(/[^0-9]/g,""), w=pw.value;
    if(p.length<10){ say("lg-msg","휴대폰 번호를 다시 확인해 주세요.","err"); return; }
    if(w.length<4){ say("lg-msg","비밀번호를 다시 확인해 주세요.","err"); return; }
    /* v27: 처음 비밀번호는 문자 확인 뒤에 (서버 v26) — 확인 번호 칸이 열려 있으면 loginCode */
    var needCode=!$("lg-codebox").hidden, cd=String($("lg-code").value||"").replace(/[^0-9]/g,"");
    if(needCode && cd.length!==6){ say("lg-msg","문자로 받은 확인 번호 6자리를 입력해 주세요.","err"); $("lg-code").focus(); return; }
    say("lg-msg",needCode?"확인 중…":"로그인 중…","info"); busy(true); $("lg-go").disabled=true;
    fetch(API,{ method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(needCode ? { fn:"loginCode", args:[p, cd, LG_TICK, "", navigator.userAgent] }
                                    : { fn:"login", args:[p, w, "", navigator.userAgent] }) })
      .then(readJson)
      .then(function(j){
        if(j.__err){ var er=new Error(j.__err); er.need=j.__need; er.tick=j.__tick; throw er; }
        if(!j || j.result===undefined) throw new Error(whyBad(j));
        var d=j.result;
        ST.key=d.key; ST.shop=d.shop; ST.who=d.who; ST.role=d.role; ST.shopName=d.shopName;
        set("cgg_key",d.key); set("cgg_shop",d.shop); set("cgg_who",d.who);
        set("cgg_role",d.role); set("cgg_shopname",d.shopName); set("cgg_lastph",p);
        openApp();
      })
      .catch(function(e){
        var m=(e&&e.message)||"로그인하지 못했습니다.";
        if(e && e.need==="code"){
          LG_TICK=String(e.tick||"");   /* v28: 이 화면과 짝인 표 — 확인 번호와 함께 돌려보냄 */
          $("lg-codebox").hidden=false; $("lg-code").value=""; $("lg-code").focus();
          $("lg-go").textContent="확인하고 로그인"; say("lg-msg", m, "info"); return;
        }
        if(/확인 시간이 지났습니다/.test(m)){ $("lg-codebox").hidden=true; $("lg-go").textContent="로그인"; }
        say("lg-msg", m, /잠겼습니다|확인 시간이 지났습니다/.test(m) ? "info" : "err");
      })
      .then(function(){ busy(false); var b=$("lg-go"); if(b) b.disabled=false; });
  }
  $("lg-go").onclick=go;
  /* 번호나 비밀번호를 바꾸면 확인 번호 칸은 닫고 처음부터 */
  [ph,pw].forEach(function(e){ e.addEventListener("input",function(){
    if(!$("lg-codebox").hidden){ $("lg-codebox").hidden=true; $("lg-go").textContent="로그인"; LG_TICK=""; say("lg-msg",""); } }); });
  $("lg-code").onkeydown=function(ev){ if(ev.key==="Enter") go(); };
  [ph,pw].forEach(function(e){ e.onkeydown=function(ev){ if(ev.key==="Enter") go(); }; });
}
function signOut(quiet){
  var k=ST.key, done=false;
  ST.key=""; del("cgg_key"); del("cgg_shop"); del("cgg_who"); del("cgg_role"); del("cgg_shopname");
  del("cgg_lastph"); try{ localStorage.removeItem("ccw_pay"); }catch(e){}   /* v40: 보안 낮음 */
  LOADED={}; drawLogin();
  /* v39: 서버 로그아웃을 기다린 뒤(최대 1.5초) 새로 불러와서, 화면 메모리에 남은 검사소 자료까지 비움 */
  try{ sessionStorage.setItem("cgg_out", quiet?"1":"0"); }catch(e){}
  function go2(){ if(done) return; done=true; try{ location.reload(); }catch(e){} }
  if(k){ try{ fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({shop:"",token:k,fn:"logout",args:[k]})}).then(go2,go2); }catch(e){ go2(); } }
  setTimeout(go2, k?1500:0);
}

<script>
var $=function(id){return document.getElementById(id);};
/* ===== 차곳간 UI 1.0 — 워시 공통 모듈이 쓰는 받침대 =====
   워시에는 있고 체크에는 없던 것들만 채웁니다. 기존 동작은 건드리지 않습니다. */
function isOwner(){ try { return !!(ST && ST.role === "owner"); } catch(e){ return false; } }
function isAdmin(){ return false; }
function openSheet(){
  var bg = document.getElementById("sheetbg"), sh = document.getElementById("sheet");
  if (bg) bg.classList.add("show");
  if (sh) sh.classList.add("show");
}
function closeSheet(){
  var bg = document.getElementById("sheetbg"), sh = document.getElementById("sheet");
  if (bg) bg.classList.remove("show");
  if (sh) sh.classList.remove("show");
}
function toast(msg, bad){ try { bar(String(msg||"")); } catch(e) {} }

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function won(n){return (Number(n)||0).toLocaleString("ko-KR");}

/* ───────── 메뉴 ───────── */
var TODOS=[];   /* 오늘 할 일 전부 — 3개만 보이고 나머지는 「모두 보기」 */
var DAYPOP="";  /* 달력에서 고른 날 */
/* J안 4판 메뉴 (v22) — 일하는 차례 그대로. 「정산 기록」은 이름 · 자리(3번째) 그대로.
   묶음 안 화면은 머리말 아래 작은 탭(#setSub)으로 나옵니다. */
/* v50 통합(대표님 시안 확인 10/18): 돈 도는 차례 — 홈 → 정산 기록 → 매출 → 월별 청구서 → 입·출금 내역 → 세금계산서 → (체크 전용: 배달 · 재검사 알림) → 설정
   메뉴 · 기능 찾기 · 폰 아래 탭 · 전체 메뉴는 공통 부품 cgg-j4 1.9 (CGG.nav · CGG.find · CGG.tabbar · CGG.allMenu) */
/* v53(대표님 결정): «정산 기록»은 세금계산서 안쪽 탭 «달마다 장부»로 — 큰 메뉴 차례는 워시와 같게 */
var JOBS=[["home","홈"],["sales","매출"],["bill","월별 청구서"],
  ["deposit","입·출금 내역"],["hometax","세금계산서"],["deliv","배달"],["remind","재검사 알림"],["set","설정"]];
/* 설정 안 — 자료 올리기는 «매출» 안으로, 휴지통은 마이페이지 안으로, 도움말은 머리말로 옮겼습니다 (「가」안)
   v50: «직원 계정 · 권한»을 «설정 백업»에서 꺼내 따로 칸으로 */
var SETS=[["office","우리 사업장"],["backup","백업 · 기기"],["partner","거래처"],["staff","직원 계정"],["price","작업 항목 · 단가표"],
  ["popbill","입금 자동 확인"],["alarm","알림"],["fee","검사자 수수료"],["files","자료 올리기"]];   /* v55: 디자인 메뉴 지도(워시와 같은 차례 · 이름) · 체크 전용은 맨 아래 */
var SETLBL={fee:"체크 전용"};
var SALESUB=[];   /* v55: 자료 올리기는 설정 › 자료 올리기로 */
/* 큰 메뉴 아이콘 (공통 부품 CGG.ic 이름) */
var JOBIC={home:"home",history:"today",sales:"chart",bill:"file",deposit:"wallet",hometax:"receipt",deliv:"truck",remind:"bell",set:"gear"};
function cggIc(n){ return (window.CGG&&CGG.ic)?CGG.ic(n):""; }
/* v25: 홈 옛 「오늘 할 일」 칸은 그리지 않음 (할 일 계산만 하고 버림) */
function cggNoCard(){ return ""; }
/* 폰 아래 탭바 5칸 — 홈 · 매출 · 월별 청구서 · 입·출금 · 전체 (v53: 정산 기록은 세금계산서 안으로) */
function cggTabbar(grp){
  if(!window.CGG) return;
  var main=["home","sales","bill","deposit"];
  CGG.tabbar($("cggTbar"),[{key:"home",icon:"home",label:"홈"},{key:"sales",icon:"chart",label:"매출"},
    {key:"bill",icon:"file",label:"월별 청구서"},{key:"deposit",icon:"wallet",label:"입·출금"},{key:"all",icon:"more",label:"전체"}],
    main.indexOf(grp)>=0?grp:"all", function(k){ if(k==="all"){ if(!CGG.closeSheet()) cggAllMenu(); } else { CGG.closeSheet(); go(k); } });
}
/* 「전체」 — 공통 전체 메뉴 판(맨 위 기능 찾기 + 모든 메뉴) */
function cggAllMenu(focus){
  try{ CGG.allMenu(chkGroups(), chkCur(), chkPick, chkFeats(), chkGoFeat, {focus:!!focus}); }catch(e){}
}
/* 보험료 미납 대조는 «입·출금 내역» 안쪽 작은 탭으로 들어갑니다 */
var DEPSUB=[["deposit","입금 · 출금"],["recv","받을 금액"],["unpaid","보험료 대조"]];
/* 월별 청구서 + 청구서 발송은 «월별 청구서» 하나로 묶고 안쪽 탭으로 나눕니다 */
var BILLSUB=[["bill","월별 청구서"],["billgrp","청구처 묶음"],["billtpl","알림톡 템플릿"]];
var TAXSUB=[["hometax","발행"],["history","달마다 장부"]];
function subBar(list, now){
  return '<div id="subTabs">'+list.map(function(s){
    return '<button data-go="'+s[0]+'" aria-selected="'+(now===s[0]?"true":"false")+'">'+s[1]+'</button>';
  }).join("")+'</div>';
}
/* 작은 탭은 이제 머리말 아래 한 곳(#setSub)에서만 그립니다 — 화면 안에서는 그리지 않음 */
function subTabs(now){ return ""; }
function billTabs(now){ return ""; }
/* 큰 메뉴 하나 → 그 안의 작은 탭 (v50: 배달 · 재검사 알림은 큰 메뉴 둘로) */
function groupOf(p){
  if(SALESUB.some(function(x){return x[0]===p;})) return ["sales",SALESUB];
  if(BILLSUB.some(function(x){return x[0]===p;})) return ["bill",BILLSUB];
  if(DEPSUB.some(function(x){return x[0]===p;})) return ["deposit",DEPSUB];
  if(TAXSUB.some(function(x){return x[0]===p;})) return ["hometax",TAXSUB];
  if(typeof DELIVSUB!=="undefined" && DELIVSUB.some(function(x){return x[0]===p;})) return ["deliv",DELIVSUB];
  if(SETS.some(function(x){return x[0]===p;})) return ["set",SETS];
  return [p,null];
}
var page="home";
/* 공통 메뉴 묶음 — {key, label, icon, subs:[{key,label}]} · 지금 위치 열쇠 = "묶음/화면" */
function chkGroups(){
  return JOBS.map(function(t){ var G=groupOf(t[0]==="set"?SETS[0][0]:t[0])[1];
    var g={key:t[0], label:t[1], icon:JOBIC[t[0]]};
    if(G) g.subs=G.map(function(s){ return {key:s[0], label:s[1]}; });
    return g; });
}
function chkCur(){ var G=groupOf(page); return G[1]?G[0]+"/"+page:G[0]; }
function chkPick(k){ try{ CGG.closeSheet(); }catch(e){} var p=String(k||"home").split("/"); go(p[1]||p[0]); }

    {id:"home",label:"홈 (달력 · 할 일)",path:"홈",go:"home",words:"처음 첫 화면 달력 일정 오늘 할 일"},
    {id:"history",label:"달마다 장부 (정산 기록)",path:"세금계산서 › 달마다 장부",go:"hometax/history",words:"정산 기록 장부 검사 기록 월별 기록 지난 청구 입금 남은 금액"},
    {id:"sales",label:"매출 보기",path:"매출 › 매출 내역",go:"sales/sales",words:"매출 실적 월별 연 합계 검사 대수 얼마 벌었"},
    {id:"files",label:"접수리스트 엑셀 올리기",path:"설정 › 자료 올리기",go:"set/files",words:"엑셀 올리기 업로드 접수리스트 자료 파일"},
    {id:"bill-make",label:"청구서 만들기",path:"월별 청구서",go:"bill/bill",words:"청구서 정산서 청구 만들기 명세 딜러"},
    {id:"bill-send",label:"청구서 보내기 (알림톡)",path:"월별 청구서 › 2. 청구서 보내기",go:"bill/bill",words:"청구서 발송 알림톡 문자 보내기 시험 입금 기한"},
    {id:"bill-print",label:"청구서 인쇄 · 그림 · 엑셀",path:"월별 청구서 › 표 위 단추",go:"bill/bill",words:"인쇄 출력 그림 jpg png 엑셀 내려받기 다운로드"},
    {id:"billgrp",label:"청구처 묶음 (받는 곳 합치기)",path:"월별 청구서 › 청구처 묶음",go:"bill/billgrp",words:"청구처 묶음 받는 곳 합치기 대표 딜러 청구서 받는 사람"},
    {id:"billtpl",label:"알림톡 템플릿",path:"월별 청구서 › 알림톡 템플릿",go:"bill/billtpl",words:"알림톡 문구 템플릿 카카오 메시지"},
    {id:"recv",label:"받을 금액 (안 들어온 돈)",path:"입·출금 내역 › 받을 금액",go:"deposit/recv",words:"받을 금액 미수 안 들어온 돈 입금 대기 외상"},

    {id:"dep-xls",label:"은행 거래내역 엑셀 가져오기",path:"입·출금 내역 › 입금 · 출금 › 아래쪽",go:"deposit/deposit",words:"은행 엑셀 거래내역 인터넷뱅킹 가져오기"},
    {id:"unpaid",label:"보험료 대조",path:"입·출금 내역 › 보험료 대조",go:"deposit/unpaid",words:"보험료 성능보증보험 미납 상사 대조"},
    {id:"hometax",label:"세금계산서 발행",path:"세금계산서",go:"hometax",words:"세금계산서 계산서 홈택스 발행 국세청 팝빌 부가세"},
    {id:"deliv",label:"차량 배달 기록",path:"배달 › 배달 기록",go:"deliv/deliv",words:"배달 탁송 기사 배달 기록 알림"},
    {id:"delivplace",label:"목적지 추가",path:"배달 › 목적지 관리",go:"deliv/delivplace",words:"목적지 배달 도착지 추가"},

function pageOfHash(){
  var h=decodeURIComponent(String(location.hash||"").replace(/^#/,"")).trim();
  if(!h) return "";
  if(PAGE[h]) return h;                      /* #popbill 처럼 영어로 적어도 됩니다 */
  for(var k in HASH) if(HASH[k]===h) return k;
  if(h==="정산기록") return "history";       /* v53 전 주소(즐겨찾기)도 열려요 */
  return "";
}
var HASH_BUSY=false;
function setHash(p){
  var want="#"+encodeURIComponent(HASH[p]||p);
  if(location.hash===want) return;
  HASH_BUSY=true; location.hash=want;
  setTimeout(function(){ HASH_BUSY=false; },50);
}
window.addEventListener("hashchange",function(){
  if(HASH_BUSY) return;
  var p=pageOfHash();
  if(p && p!==page) go(p);
});

function chkMemos(){
  /* v39: 검사소별로 저장 — 같은 PC에서 다른 검사소로 로그인해도 서로 안 보이게. 예전(검사소 없는) 메모는 처음 연 검사소로 옮김 */

    var k="cgg_memos:"+(ST.shop||"")+(ST.who?":"+ST.who:"");   /* v40: 검사소 + 사람별 (이름을 모르면 검사소 칸) */
    var v=localStorage.getItem(k);
    if(v===null && ST.who){ ["cgg_memos:"+(ST.shop||""), "cgg_memos"].some(function(ok){ var old=localStorage.getItem(ok);
      if(old!==null && ST.shop){ localStorage.setItem(k, old); localStorage.removeItem(ok); v=old; return true; } return false; }); }
    return JSON.parse(v || "[]");
  } catch(e){ return []; }
}
function chkMemoSave(list){

/* ── 은행 거래내역 엑셀: 이 기기에서 읽기 → 칸 찾기 → 미리보기 → 넣기 ── */
var DEPX=null;   /* {rows:[[…]], head:n, col:{date,time,amt,who}} */
function depXlsRead(file){
  if(!window.XLSX){ tell("엑셀을 읽을 수 없어요","인터넷 연결을 확인하고 새로고침해 주세요."); return; }
  if(file.size>8*1024*1024){ tell("파일이 너무 커요","8MB 안의 거래내역 파일로 해 주세요."); return; }
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(rd.result),{type:"array", cellDates:true});   /* 날짜 칸은 Date 로 받음 (은행마다 글 모양이 달라서) */
      var sh=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(sh,{header:1, raw:true, defval:""}).slice(0,3000);
      DEPX={rows:rows, head:-1, col:{}}; depXlsGuess(); depXlsDraw();
    }catch(e){ tell("엑셀을 읽지 못했어요","은행에서 받은 거래내역 파일(.xlsx · .xls · .csv)인지 확인해 주세요."); }
  };
  rd.readAsArrayBuffer(file);
}
function depXlsGuess(){
  var R=DEPX.rows, best=-1, bs=0;
  for(var i=0;i<Math.min(20,R.length);i++){ var t=R[i].map(function(x){ return x instanceof Date?"":String(x); }).join("|"), sc=0;
    if(/거래\s*일|일시|날짜|일자/.test(t)) sc++; if(/입금|맡기신/.test(t)) sc++; if(/적요|내용|보낸|입금자|의뢰인|기재/.test(t)) sc++;
    if(sc>bs){ bs=sc; best=i; } }
  DEPX.head=best; var H=best>=0?R[best].map(function(x){ return String(x||"").replace(/\s/g,""); }):[];
  function find(re, not){ for(var j=0;j<H.length;j++) if(re.test(H[j]) && !(not&&not.test(H[j]))) return j; return -1; }
  DEPX.col={ date:find(/거래일시|거래일자|거래일|일시|날짜|일자/), time:find(/시간|시각/, /일시/),
    amt:find(/입금액|맡기신금액|입금금액|입금\(원\)|^입금$|맡기신/, /출금|찾으신/),
    who:(function(){ var k=find(/보낸분|입금자|의뢰인|기재내용|받는분/); return k>=0?k:find(/적요|내용|메모/); })() };
}
function depXlsParse(){
  var R=DEPX.rows, c=DEPX.col, out=[], bad=0;
  for(var i=DEPX.head+1;i<R.length;i++){ var r=R[i]; if(!r || !r.some(function(x){ return x!=="" && x!=null; })) continue;
    var av=r[c.amt]; var amt=Math.round(typeof av==="number"?av:(Number(String(av==null||av instanceof Date?"":av).replace(/[^0-9.-]/g,""))||0));
    if(c.amt<0 || amt<=0) continue;
    var when=depXlsWhen(r[c.date], c.time>=0?r[c.time]:"");
    if(!when){ bad++; continue; }
    var wv=c.who>=0?r[c.who]:""; if(wv instanceof Date) wv="";
    out.push({tx_at:when, sender:String(wv).trim().slice(0,40)||"입금자미상", amount:amt});
  }
  return {rows:out, bad:bad};
}
function depXlsWhen(d,t){
  function p(x){ return (x<10?"0":"")+x; }
  if(d instanceof Date && !isNaN(d)){   /* 엑셀이 날짜로 읽은 칸 — 이 기기 시각 그대로 */
    var hh=d.getHours(), mi=d.getMinutes(), se=d.getSeconds(), tt=String(t instanceof Date?"":t||"").match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);
    if(t instanceof Date){ hh=t.getHours(); mi=t.getMinutes(); se=t.getSeconds(); } else if(tt){ hh=+tt[1]; mi=+tt[2]; se=+(tt[3]||0); }
    if(d.getFullYear()<2000) return "";
    return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(hh)+":"+p(mi)+":"+p(se)+"+09:00"; }
  if(t instanceof Date) t=p(t.getHours())+":"+p(t.getMinutes())+":"+p(t.getSeconds());
  var s=String(d==null?"":d).trim(), m=s.match(/(\d{4})[.\-\/년\s]*(\d{1,2})[.\-\/월\s]*(\d{1,2})/) || s.match(/^(\d{4})(\d{2})(\d{2})/);
  if(!m){ var n=Number(s); if(n>30000 && n<80000){ var dt=new Date(Math.round((n-25569)*86400000)); m=[0,dt.getUTCFullYear(),dt.getUTCMonth()+1,dt.getUTCDate()]; } else return ""; }
  var tm=(String(t||"")+" "+s).match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  var y=+m[1], mo=+m[2], da=+m[3]; if(y<2000||mo<1||mo>12||da<1||da>31) return "";
  return y+"-"+p(mo)+"-"+p(da)+"T"+(tm?p(+tm[1])+":"+tm[2]+":"+(tm[3]||"00"):"00:00:00")+"+09:00";
}

  function pick(k,label){ return '<label class="f">'+esc(label)+'<select data-dxc="'+k+'" style="width:100%">'+

    '<p class="note" style="margin:10px 0">입금 <b>'+won(P.rows.length)+'</b>건 · 합계 <b>'+won(sum)+'</b>원'+(P.bad?' · 날짜를 못 읽은 줄 '+won(P.bad)+'개는 빼요':'')+' (출금 줄은 넣지 않아요)</p>'+
    '<div class="cgg-twrap"><table class="cgg-table"><thead><tr><th>거래 일시</th><th>보낸 분</th><th class="n">입금액</th></tr></thead><tbody>'+
      (P.rows.slice(0,10).map(function(r){ return '<tr><td>'+esc(r.tx_at.slice(0,16).replace("T"," "))+'</td><td>'+esc(r.sender)+'</td><td class="n">'+won(r.amount)+'</td></tr>'; }).join("")||
       '<tr><td colspan="3" class="cgg-empty">넣을 입금이 없어요. 위 칸을 바꿔 보세요.</td></tr>')+
    '</tbody></table></div>'+(P.rows.length>10?'<p class="note">앞의 10건만 보여 드려요.</p>':'')+
    '<div class="tools" style="margin-top:10px"><button class="btn primary" id="dxGo"'+(P.rows.length?'':' disabled')+'>'+won(P.rows.length)+'건 넣기</button><button class="btn" id="dxNo">취소</button></div>';
  Array.prototype.forEach.call(box.querySelectorAll("[data-dxc]"),function(s){ s.onchange=function(){ DEPX.col[s.getAttribute("data-dxc")]=Number(s.value); depXlsDraw(); }; });
  var no=$("dxNo"); if(no) no.onclick=function(){ DEPX=null; box.innerHTML=""; };

/* 열 이름 읽기 — ① 똑같은 이름을 먼저 잡고 ② 남은 것만 비슷한 이름으로 잡습니다.
   («차명» 과 «차종», «보험료납부» 와 «보험료납부일» 이 서로 덮어쓰던 것을 막습니다) */
var XEXACT={
  "성능번호":"성능번호","성능점검번호":"성능번호","점검번호":"성능번호",

  "차량번호":"차량번호","등록번호":"차량번호","차번":"차량번호",
  "차대번호":"차대번호","차대":"차대번호","VIN":"차대번호",
  "차명":"차명","모델":"차명","모델명":"차명","차량명":"차명","차량모델":"차명",
  "회사명":"회사명","상사명":"회사명","상사":"회사명","매매상사":"회사명",
  "신청인":"신청인","딜러":"신청인","의뢰인":"신청인","딜러명":"신청인","담당딜러":"신청인",
  "상품명":"상품명","상품":"상품명","품목":"상품명",
  "금액":"금액","검사비":"금액","수수료":"금액",
  "성능보험료":"성능보험료","청구보험료":"성능보험료","보험료":"성능보험료","보증보험료":"성능보험료",
  "보험료납부":"보험료납부","납부":"보험료납부","납부여부":"보험료납부",
  "작업내용":"작업내용","정비내용":"작업내용","내용":"작업내용","사유":"작업내용",
  "면제":"면제"
};
/* 아래 이름은 절대 쓰지 않습니다 (비슷해 보여도 다른 칸입니다) */
var XSKIP=["접수일","보험료납부일","입금일","결제","차종","주행거리","년식","사고","변속기",
  "진단이력","검사자","비고","연료","순번","번호",
  /* 보험사 청구서에 같이 오는, 우리가 안 쓰는 칸들 */
  "책임보험료","특약보험료","특약상품","보험사","보험증권번호","보험상태","이전일","이전내역",
  "사유","국/외","국외","120일초과","증권번호"];
var XFUZZY={
  "성능번호":["성능"], "검사일":["일자","날짜"], "차량번호":["번호판"],
  "차명":["차이름"], "회사명":["소속"], "신청인":["담당"],
  "금액":["공급가"], "성능보험료":["보증"], "작업내용":["항목"]
};
function xHeaderMap(headRow){
  var map={}, used={};
  var names=(headRow||[]).map(function(h){ return String(h==null?"":h).replace(/\s/g,""); });
  /* ① 똑같은 이름 */
  names.forEach(function(t,c){
    if(!t || XSKIP.indexOf(t)>=0) return;
    var k=XEXACT[t];
    if(k && !used[k]){ map[c]=k; used[k]=1; }
  });
  /* ② 남은 칸만 비슷한 이름으로 */
  names.forEach(function(t,c){
    if(!t || map[c] || XSKIP.indexOf(t)>=0) return;
    for(var k in XFUZZY){
      if(used[k]) continue;
      for(var i=0;i<XFUZZY[k].length;i++){
        if(t.indexOf(XFUZZY[k][i])>=0){ map[c]=k; used[k]=1; return; }
      }
    }
  });
  return map;
}
function xDate(v){
  if(v==null||v==="") return "";
  if(typeof v==="number"){               /* 엑셀 날짜 숫자 */
    var d=new Date(Math.round((v-25569)*86400000));
    return d.toISOString().slice(0,10);
  }
  var t=String(v).trim().replace(/[.\/]/g,"-").replace(/\s.*$/,"");
  var m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return m[1]+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[3]).slice(-2);
  var m2=t.match(/^(\d{4})(\d{2})(\d{2})$/);
  if(m2) return m2[1]+"-"+m2[2]+"-"+m2[3];
  return "";
}
function xNum(v){ return Number(String(v==null?"":v).replace(/[^0-9.-]/g,""))||0; }

/* 엑셀 파일 하나를 줄 목록으로 */
function readExcel(file){
  return new Promise(function(done, bad){
    var fr=new FileReader();
    fr.onerror=function(){ bad(new Error(file.name+" 을 읽지 못했어요.")); };
    fr.onload=function(){
      try{
        if(typeof XLSX==="undefined"){ bad(new Error("엑셀 도구를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침(F5)해 주세요.")); return; }   /* v39 */
        var wb=XLSX.read(new Uint8Array(fr.result), {type:"array"});
        var best=null;
        wb.SheetNames.forEach(function(nm){
          if(/작성안내|안내|도움말|설명/.test(nm)) return;
          var aoa=XLSX.utils.sheet_to_json(wb.Sheets[nm], {header:1, raw:true, defval:""});
          for(var i=0;i<Math.min(aoa.length,15);i++){
            var map=xHeaderMap(aoa[i]);
            var keys=Object.keys(map);
            if(keys.length<3) continue;                 /* 아는 칸이 3개는 있어야 머리줄 */
            var rows=[];
            for(var j=i+1;j<aoa.length;j++){
              var line=aoa[j]||[], o={}, any=false;
              keys.forEach(function(c){
                var k=map[c], v=line[c];
                if(v!=="" && v!=null) any=true;
                if(k==="검사일") o[k]=xDate(v);
                else if(k==="금액"||k==="성능보험료") o[k]=xNum(v);
                else o[k]=String(v==null?"":v).trim();
              });
              if(any) rows.push(o);
            }
            if(!best || rows.length>best.rows.length)
              best={sheet:nm, rows:rows, cols:keys.map(function(c){return map[c];})};
            break;
          }
        });
        if(!best || !best.rows.length){
          bad(new Error(file.name+" 에서 읽을 줄을 못 찾았어요. 첫 줄에 열 이름(성능번호 · 차량번호 · 검사일 …)이 있는지 봐 주세요."));
          return;
        }
        done(best);
      }catch(e){ try{ console.warn(file.name, e); }catch(e2){} bad(new Error(file.name+" 을 읽지 못했어요. 엑셀 파일(xlsx · xls · csv)인지 확인해 주세요.")); }
    };
    fr.readAsArrayBuffer(file);
  });
}
/* 파일 이름에 든 달을 읽습니다 — 202608 · 2026-08 · 2026_08 */
function ymFromName(name){
  var n=String(name||"");
  var m=n.match(/(20\d{2})[._\-]?(0[1-9]|1[0-2])(?!\d)/);
  return m ? m[1]+"-"+m[2] : "";
}
/* 파일 이름과 열 모양으로 무슨 엑셀인지 알아냅니다 */
function guessKind(name, cols){
  var n=String(name||"");
  if(/carcheck|차량리스트|접수차량/i.test(n)) return "접수리스트";
  if(/전산외/.test(n)) return "전산외";
  if(/정비/.test(n)) return "정비비";
  if(/청구보험료|보험료|보험/.test(n)) return "청구보험료";
  if(/접수|리스트/.test(n)) return "접수리스트";
  if(cols.indexOf("작업내용")>=0) return "정비비";
  if(cols.indexOf("성능보험료")>=0 && cols.indexOf("상품명")<0 && cols.indexOf("금액")<0) return "청구보험료";
  if(cols.indexOf("상품명")>=0 || cols.indexOf("검사일")>=0) return "접수리스트";
  return "";
}
/* 엑셀 한 장을 1,000줄씩 나눠 보냅니다 (14,000줄도 올라갑니다) */
function putOne(kind, rows, file, where, ym){
  ym = ym || ST.ym;
  var SIZE=1000, at=0, got=0, total=rows.length;
  return new Promise(function(done, bad){
    (function step(){
      if(at>=total){
        /* 마지막 — 기록을 남기고 딜러를 이어붙입니다 */
        call("excelPut",[kind, [], ym, {file:file, first:false, last:true, total:got}])
          .then(function(){ done(got); }).catch(bad);
        return;
      }
      var part=rows.slice(at, at+SIZE);
      say(where, file+" → "+kind+" "+won(Math.min(at+SIZE,total))+" / "+won(total)+"줄 올리는 중…","info");
      call("excelPut",[kind, part, ym,
        {file:file, first:(at===0), last:false, total:total}])
        .then(function(r){ got+=(r&&r.n)||part.length; at+=SIZE; step(); })
        .catch(bad);
    })();
  });
}
/* 엑셀 여러 개를 차례로 올립니다 */
function putExcels(files, where){
  var list=[].slice.call(files||[]);
  if(!list.length) return;
  var i=0, done=[], bad=[];
  busy(true);
  (function next(){
    if(i>=list.length){
      busy(false);
      say(where, (done.length? "다 올렸어요 — "+done.join(" · ")+(/보험/.test(done.join(" "))?" (대조까지 끝냈어요)":"") : "")+
                 (bad.length? (done.length?" / ":"")+"안 된 것 : "+bad.join(" / ") : ""),
          bad.length?"err":"ok");
      refresh(["set","up","bill","ins"]);
      return;
    }
    var f=list[i++];
    say(where, f.name+" 읽는 중…","info");
    readExcel(f).then(function(res){
      var kind=guessKind(f.name, res.cols);
      if(!kind){ bad.push(f.name+" (무슨 엑셀인지 모르겠어요)"); next(); return; }
      /* 정비비 · 청구보험료는 파일 이름에 달이 있으면 그 달로 넣습니다 */
      var ym=ST.ym;
      if(kind==="청구보험료"||kind==="정비비"){ var g=ymFromName(f.name); if(g) ym=g; }
      return putOne(kind, res.rows, f.name, where, ym).then(function(n){
        done.push(kind+" "+won(n)+"줄"+(ym!==ST.ym?" ("+ymText(ym)+"분)":"")); next();
      });
    }).catch(function(e){ bad.push((e&&e.message)||f.name); next(); });
  })();
}
/* 끌어다 놓기 · 눌러서 고르기를 한꺼번에 붙입니다 */
function dropZone(boxId, inputId, where){
  var box=$(boxId), inp=$(inputId);
  if(!box||!inp) return;
  box.onclick=function(){ inp.click(); };
  inp.onchange=function(){ putExcels(inp.files, where); inp.value=""; };
  ["dragenter","dragover"].forEach(function(ev){
    box.addEventListener(ev,function(e){ e.preventDefault(); box.style.borderColor="var(--brand)";
      box.style.background="var(--brand-soft)"; });
  });
  ["dragleave","drop"].forEach(function(ev){
    box.addEventListener(ev,function(e){ e.preventDefault(); box.style.borderColor=""; box.style.background=""; });
  });
  box.addEventListener("drop",function(e){
    e.preventDefault();
    putExcels(e.dataTransfer && e.dataTransfer.files, where);
  });
}

/* ═══ 가온정산 «전체 옮기기 파일» 가져오기 ═══ */
function runImport(text){
  var o; try{ o=JSON.parse(text); }catch(e){ o=null; }
  if(!o){ say("impMsg","파일을 읽지 못했어요.","err"); return; }
  function pick(v){
    if(v==null) return null;
    if(typeof v==="object") return v;
    try{ return JSON.parse(v); }catch(e){ return null; }
  }
  var cfg=null, carBox=null;
  if(o.__type==="gaon-move" && o.data){
    cfg=pick(o.data["gaon.tools.cfg.v1"]); carBox=pick(o.data["gaon.tools.cars.v1"]);
  } else if(o.__type==="gaon-tools" && o.cfg){ cfg=o.cfg; }
  else if(o.bands || o.companies || o.dealers){ cfg=o; }
  if(!cfg && !carBox){
    say("impMsg","가온정산에서 만든 «전체 옮기기 파일»이 아니에요. 설정 → 설정 백업 → «전체 옮기기 파일 만들기»로 받은 파일을 넣어 주세요.","err");
    return;
  }
  var jobs=[];
  if(cfg && cfg.supplier) jobs.push(["office","검사소 정보",[cfg.supplier]]);
  if(cfg && cfg.bands && cfg.bands.length)
    jobs.push(["band","단가표", cfg.bands.map(function(b){
      return { from:String(b.from||"").slice(0,10), items:b.items||[] }; })]);
  if(cfg && cfg.companies && cfg.companies.length)
    jobs.push(["company","매매상사", cfg.companies.map(function(c){
      return { 상사명:c.상사명||c.상호||"", 사업자등록번호:c.사업자등록번호||"",
               대표자:c.대표자||"", 주소:c.사업장주소||"", 전화:c.전화||c.연락처||"",
               담당자:c.담당자||"", 담당자휴대폰:c.담당자휴대폰||"" };
    }).filter(function(c){ return c.상사명; })]);
  if(cfg && cfg.dealers && cfg.dealers.length)
    jobs.push(["dealer","딜러", cfg.dealers.map(function(d){
      var hasBiz=!!String(d.사업자등록번호||"").trim();
      return { 딜러:String(d.딜러||"").trim(), 소속:d.소속||"", 휴대폰:d.휴대폰||"",
               추가번호:d.추가번호||[],
               발행근거: hasBiz ? "딜러 사업자" : (d.소속 ? "소속 상사" : "미등록"),
               발행처: d.상호||"", 사업자등록번호: d.사업자등록번호||"",
               계산서발행여부: d.계산서발행여부||"" };
    }).filter(function(d){ return d.딜러; })]);
  if(carBox && carBox.rows){
    var list=[];
    Object.keys(carBox.rows).forEach(function(plate){
      var o2=carBox.rows[plate]; if(!o2) return;
      var all=(o2.all && o2.all.length) ? o2.all : [o2];
      all.forEach(function(x){
        if(!x || !String(x.date||"").slice(0,10)) return;
        list.push({ 성능번호:x.no||"", 차량번호:plate, 차명:x.car||"",
                    검사일:String(x.date).slice(0,10), 회사명:x.comp||"",
                    신청인:x.dealer||"", 상품명:x.goods||"", 금액:x.fee||0,
                    성능보험료:x.ins||0, 보험료납부:x.pay||"N" });
      });
    });
    if(list.length) jobs.push(["car","차량", list]);
  }
  if(!jobs.length){ say("impMsg","옮길 자료가 없어요.","err"); return; }
  var i=0, done=[]; busy(true);
  (function next(){
    if(i>=jobs.length){
      say("impMsg","다 옮겼어요 — "+done.join(" · "),"ok"); busy(false);
      LOADED={}; DEALERS=[]; call("dataCount",[]).then(function(c){ COUNTS=c||{}; draw(); });
      return;
    }
    var j=jobs[i];
    sendChunks(j[0], j[2], j[1], function(n){ done.push(j[1]+" "+won(n)); i++; next(); },
      function(e){ try{ console.warn(j[1], e); }catch(e2){} say("impMsg", j[1]+" 옮기다 멈췄어요. 다시 시도해 주세요.", "err"); busy(false); });
  })();
}
function sendChunks(part, rows, label, ok, bad){
  var size=400, at=0, got=0;
  (function go2(){
    if(at>=rows.length){ ok(got); return; }
    var chunk=rows.slice(at, at+size);
    say("impMsg", label+" "+won(Math.min(at+size,rows.length))+" / "+won(rows.length)+" 옮기는 중…","info");
    call("importLegacy",[part, chunk]).then(function(r){
      got+=(r&&r.n)||chunk.length; at+=size; go2();
    }).catch(bad);
  })();
}

function ptSaveDealer(nd, isNew, old){

var PBFLD={ Addr:"사업장 주소", CEOName:"대표자", CorpName:"상호", BizType:"업태",
  BizClass:"종목", ContactName:"담당자 이름", ContactEmail:"담당자 이메일",
  ContactTEL:"담당자 전화", ID:"팝빌 아이디", Password:"팝빌 비밀번호", CorpNum:"사업자등록번호" };
function pbKo(msg){
  var m=String(msg||"");
  if(/-10010030|신규가입 API|가입 API/.test(m))
    return "팝빌에서 바로 가입이 막혀 있습니다. 아래 «팝빌에서 직접 가입하기»로 가입해 주세요.";
  if(/이미 가입|-10010010/.test(m))
    return "이미 가입된 사업자번호입니다. 오른쪽 «이미 회원이면 — 아이디만 저장하고 연결» 을 누르세요.";
  if(/아이디.*(중복|이미)|-10010020/.test(m))
    return "그 팝빌 아이디는 이미 쓰고 있습니다. 다른 아이디로 적어 주세요.";
  Object.keys(PBFLD).forEach(function(k){
    m=m.replace(new RegExp("\\b"+k+"\\b","g"), PBFLD[k]);
  });
  return m.replace("설정 → 거래처에서 먼저 채워 주세요.","바로 위 칸에 적고 다시 눌러 주세요.");
}

        POP.linked?"ok":"err");
    delete LOADED.set; draw();
  });
}

<script>
/* ===== 요금제·사용량 표시 =====
   실제로는 서버(me / login)가 내려주는 값으로 채웁니다.
   지금은 시안이라 아래 PLAN 을 바꿔가며 보여줍니다. */
(function(){
  var PLAN = null, open = false;

  function won(n){ return (Number(n)||0).toLocaleString("ko-KR"); }
  function esc(v){ return String(v==null?"":v).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  /* 상태 판정 */
  function tone(p){
    if(!p) return "";
    if(p.trial) return "";
    if(p.smsStop) return "bad";
    if(p.smsLeft===0) return "bad";
    if(p.daysLeft<=0) return "bad";
    if(p.daysLeft<=7) return "warn";
    if(p.taxLeft===0 && p.taxFree>0) return "warn";
    return "";
  }
  function band(p){
    if(!p) return null;
    if(p.trial){
      if(p.smsFree>0 && p.smsLeft===0) return {t:"warn", b:"무료 알림을 다 썼어요.",
        s:"체험 기본 건수를 모두 썼어요 · 충전하면 바로 다시 나가요", go:"알림 충전하기"};
      if(p.daysLeft!=null && p.daysLeft<=0) return {t:"bad", b:"무료 체험 기간이 끝났어요.",
        s:"요금제를 정하시면 문자가 다시 나가요", go:"요금제 보기"};
      if(p.daysLeft!=null && p.daysLeft<=7) return {t:"warn", b:p.daysLeft+"일 뒤에 무료 체험이 끝나요.",
        s:"미리 요금제를 정해 두시면 끊기지 않아요", go:"요금제 보기"};
      return null;
    }
    if(p.smsStop) return {t:"bad", b:"문자 발송이 멈췄어요. 충전해야 다시 나가요.",
      s:"청구서 만들기와 기록 보기는 그대로 돼요 · 충전하면 바로 다시 나가요", go:"지금 충전하기"};
    if(p.smsLeft===0) return {t:"warn", b:"무료 알림을 다 썼어요.",
      s:"지금 보내는 문자는 곧 멈춰요 · 충전하시면 바로 다시 나가요", go:"알림 충전하기"};
    if(p.daysLeft<=0) return {t:"bad", b:"이용 기간이 지났어요.",
      s:"연장하셔야 문자가 다시 나가요", go:"지금 연장하기"};
    if(p.daysLeft<=7) return {t:"warn", b:p.daysLeft+"일 뒤에 이용이 멈춰요.",
      s:"미리 연장해 두시면 끊기지 않아요", go:"연장하기"};
    return null;
  }

  var NAR = false;   /* 띠가 들어갈 자리가 좁은지 — 창이 아니라 띠 자신의 폭으로 봅니다 */
  function chips(p){
    var c=[], n=NAR;
    function ch(k,v,t,cl){ return '<span class="pl-chip'+(cl?" "+cl:"")+(t?" "+t:"")+'">'+
      (k?'<span class="k">'+esc(k)+'</span>':'')+'<span class="v">'+esc(v)+'</span></span>'; }
    if(p.trial){
      c.push(ch(n?"":"요금제","무료 체험","","pl-p"));
      c.push(ch(n?"":"남은 기간",
        (p.daysLeft==null?"기한 없음":(p.daysLeft>0?p.daysLeft+"일":"지남")),
        (p.daysLeft!=null&&p.daysLeft<=0)?"bad":((p.daysLeft!=null&&p.daysLeft<=7)?"warn":""),"pl-d"));
      c.push(ch("문자",
        (p.smsFree>0? (won(p.smsLeft)+(n?"":"건")) : "넉넉"),
        (p.smsFree>0&&p.smsLeft===0)?"bad":"","pl-s"));
      c.push(ch("세금계산서",
        (p.taxFree>0? (won(p.taxLeft)+(n?"":"건")) : "넉넉"),
        (p.taxFree>0&&p.taxLeft===0)?"warn":"","pl-t"));
      return c.join("");
    }
    c.push(ch(n?"":"요금제", p.name, "", "pl-p"));
    c.push(ch(n?"":"남은 기간", p.daysLeft>0 ? p.daysLeft+"일" : "지남",
      p.daysLeft<=0?"bad":(p.daysLeft<=7?"warn":""), "pl-d"));
    c.push(ch("문자", p.smsStop ? "멈춤" : (won(p.smsLeft)+(n?"":"건")),
      (p.smsStop||p.smsLeft===0)?"bad":"", "pl-s"));
    c.push(ch("세금계산서", p.taxFree>0 ? (won(p.taxLeft)+(n?"":"건")) : "—",
      (p.taxFree>0&&p.taxLeft===0)?"warn":"", "pl-t"));
    return c.join("");
  }

  function detail(p){
    function cell(o){
      return '<div class="pmCell'+(o.tone?" "+o.tone:"")+'">'+
        '<div class="t">'+esc(o.t)+'</div><div class="v">'+o.v+'</div>'+
        '<div class="s">'+esc(o.s)+'</div>'+
        '<div class="pmBar"><i style="width:'+(o.pct||0)+'%"></i></div>'+
        (o.nt?'<div class="nt">'+esc(o.nt)+'</div>':'')+'</div>';
    }
    var cells, tag, sub, foot;
    if(p.trial){
      var tDay=(p.daysLeft==null)?null:Math.max(0,p.daysLeft);
      tag=(p.smsFree>0&&p.smsLeft===0)?["알림 다 씀","bad"]
         :((tDay!=null&&tDay<=7)?["곧 만료","warn"]:["이용 중",""]);
      sub=p.shop+" · 무료 체험 · 결제 시스템이 준비되면 요금제로 바뀌어요";
      cells=[
        cell({t:"남은 기간",
              v:(tDay==null?"기한 없음":tDay+'<small>일</small>'),
              s:(p.until?p.until+"까지 무료로 쓰실 수 있어요":"테스트 기간 동안 계속 쓰실 수 있어요"),
              pct:(tDay==null?100:Math.max(0,Math.min(100,Math.round(tDay/60*100)))),
              tone:(tDay!=null&&tDay<=0)?"bad":((tDay!=null&&tDay<=7)?"warn":"")}),
        cell(p.smsFree>0
          ? {t:"문자", v:won(p.smsLeft)+'<small>건 남음</small>',
             s:"체험 무료 "+won(p.smsFree)+"건 중 "+won(Math.max(0,p.smsFree-(p.smsLeft-(p.smsPaid||0))))+"건 사용",
             pct:Math.round(Math.max(0,p.smsFree-(p.smsLeft-(p.smsPaid||0)))/p.smsFree*100),
             tone:(p.smsLeft===0)?"bad":"",
             nt:(p.smsLeft===0?"충전해야 계속 보낼 수 있어요":"")}
          : {t:"문자",v:"넉넉",s:"테스트 중에는 건수를 세지 않아요",pct:12}),
        cell(p.taxFree>0
          ? {t:"세금계산서", v:won(p.taxLeft)+'<small>건 남음</small>',
             s:"체험 무료 "+won(p.taxFree)+"건 중 "+won(Math.max(0,p.taxFree-(p.taxLeft-(p.taxPaid||0))))+"건 사용",
             pct:Math.round(Math.max(0,p.taxFree-(p.taxLeft-(p.taxPaid||0)))/p.taxFree*100),
             tone:(p.taxLeft===0)?"warn":""}
          : {t:"세금계산서",v:"넉넉",s:"테스트 중에는 건수를 세지 않아요",pct:8})];
      foot=[(p.smsFree>0&&p.smsLeft===0)?"그때 대표님 휴대폰으로 알림톡(안 되면 문자)이 가요."
            :"요금제가 정해지면 여기에 금액과 남은 날짜가 떠요.",
            (p.until?"체험 종료 "+p.until:"무료 체험 중")];
    } else {
      var dTone = p.daysLeft<=0?"bad":(p.daysLeft<=7?"warn":"");
      var sTone = (p.smsStop||p.smsLeft===0)?"bad":"";
      cells=[
        cell({t:"남은 기간", v:(p.daysLeft>0?p.daysLeft:0)+'<small>일</small>',
              s:p.paidAt+" 결제 · "+p.until+"까지", pct:Math.max(0,Math.round(p.daysLeft/30*100)), tone:dTone}),
        cell({t:"문자", v:(p.smsStop?"멈춤":won(p.smsLeft)+'<small>건 남음</small>'),
              s:(p.smsPaid? "무료 "+won(p.smsFree)+"건 모두 사용 · 충전분 "+won(p.smsPaid)+"건"
                          : "무료 "+won(p.smsFree)+"건 중 "+won(p.smsFree-p.smsLeft)+"건 사용"),
              pct:(p.smsPaid?0:Math.round((p.smsFree-p.smsLeft)/p.smsFree*100)), tone:sTone,
              nt:(p.smsStop?"충전하시면 바로 다시 나가요":(p.smsLeft===0?"충전해야 계속 보낼 수 있어요":""))}),
        cell(p.taxFree>0

             pct:Math.round((p.taxFree-p.taxLeft)/p.taxFree*100), tone:(p.taxLeft===0?"warn":"")}
          : {t:"세금계산서", v:"—", s:p.name+"은 세금계산서를 쓸 수 없어요", pct:0})
      ];
      tag = p.smsStop?["알림 멈춤","bad"]:(p.smsLeft===0?["알림 다 씀","bad"]:
            (p.daysLeft<=7?["곧 만료","warn"]:["이용 중",""]));
      sub = p.shop+" · 월 "+won(p.price)+"원 (부가세 별도) · 결제일 기준 30일";
      foot = [(p.smsLeft===0?"그때 대표님 휴대폰으로 알림톡(안 되면 문자)이 가요."
                            :"문자·세금계산서 건수는 결제일마다 새로 채워져요."),

    }
    var btns = p.trial ? '<button class="mini">요금제 보기</button>'
      : (p.smsLeft===0||p.smsStop
          ? '<button class="pl-go bad">알림 충전하기</button>'

    return '<div class="pmBox" style="margin:9px 0 3px">'+
      '<div class="pmTop"><div><h3 class="pmName">'+esc(p.trial?"무료 체험":p.name)+

  var rsT=null;

      else startRO();
    }

  window.ccwPlanSet = function(p){ PLAN = p; paint(); }; window.ccwPlanGet = function(){ return PLAN; };

  window.ccwPlanLoad = function(){
    try{
      return;   /* v34: 체크에는 워시 요금제 불러오기가 없음 — 요금은 결제 칸(cwRpc)이 받음 */

    ver = ver === "v2" ? "v2" : "v1";
    return new Promise(function(res, rej){
      if(window.TossPayments && (TOSSVER === ver || window.TossPayments.__preview)) return res(window.TossPayments);
      if(TOSSVER && TOSSVER !== ver) return rej({message:"결제 창을 다시 열려면 화면을 새로고침해 주세요"});
      TOSSVER = ver;
      var sc = document.createElement("script");
      sc.src = ver === "v2" ? "https://js.tosspayments.com/v2/standard" : "https://js.tosspayments.com/v1/payment";
      sc.onload = function(){ res(window.TossPayments); };
      sc.onerror = function(){ rej({message:"카드 결제 창을 불러오지 못했습니다"}); };
      document.head.appendChild(sc);
    });

<!-- ===== 차곳간 UI 1.0 — 머리말 버튼 차례를 워시와 같게 ===== -->
<script>
(function(){
  /* 워시와 같은 차례: 공지 · 도움말 · 주소 · 새로고침 · 자동 · 연결 · 휴지통 · 마이페이지
     「화면(밝기)」은 마이페이지 창의 「화면」 칸으로 옮겼습니다. */
  var ORDER = ["ccwNotiBtn","btnHelp","btnLink","btnRefresh","pollSel","dbState","btnTrash","hWho"];
  function fix(){
    var host = document.getElementById("hWho");
    host = host && host.parentNode;
    if (!host) return;
    var th = document.getElementById("btnTheme");
    if (th) th.style.display = "none";          /* 마이페이지 안으로 옮김 */
    ORDER.forEach(function(id){
      var el = document.getElementById(id);
      if (el && el.parentNode === host) host.appendChild(el);
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", fix);
  else fix();
  setTimeout(fix, 300); setTimeout(fix, 1200);   /* 공지 버튼이 늦게 생겨도 맞춥니다 */
  /* 공지 버튼은 나중에 만들어지므로, 생긴 뒤 딱 한 번만 더 맞춥니다 */
  var done = false;
  var tick = setInterval(function(){
    if (done) { clearInterval(tick); return; }
    var n = document.getElementById("ccwNotiBtn");
    if (!n) return;
    done = true; clearInterval(tick); fix();
  }, 250);
  setTimeout(function(){ done = true; clearInterval(tick); }, 10000);
})();
</script>

:root{

}

/* ───────── ① 틀: 가로 메뉴 (기본) ───────── */

.cgg-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 22px}

.cgg-brand .cgg-ci{width:34px;height:34px;border-radius:10px;background:var(--sky);color:var(--navy);display:grid;place-items:center;font-weight:900;flex:none}

/* ───────── ③ 홈 할 일 카드 3장 ───────── */
.cgg-acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 16px}
.cgg-act{display:flex;align-items:center;gap:12px;padding:16px 18px;border:0;font:inherit;text-align:left;cursor:pointer;color:inherit;background:var(--surface);border-radius:var(--r-card);box-shadow:var(--sh);transition:transform .15s;min-width:0}
.cgg-act:hover{transform:translateY(-2px)}
.cgg-act .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.cgg-act .ico.chk{background:var(--chk-bg);color:var(--chk)} .cgg-act .ico.stop{background:var(--stop-bg);color:var(--stop)} .cgg-act .ico.run{background:var(--run-bg);color:var(--run)}
.cgg-act .tx{min-width:0} .cgg-act b{display:block;font-size:14.5px} .cgg-act small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

/* ───────── ④ 사람 단추 ▾ 펼침 (1.1) — 마이페이지 · 요금제 · 휴지통 · 화면 설정 · 로그아웃 ───────── */
.cgg-drop{position:fixed;z-index:var(--z-drop);box-sizing:border-box;width:240px;max-width:calc(100vw - 16px);background:var(--surface);color:var(--text);border-radius:14px;box-shadow:0 12px 34px #0B254538;padding:8px;display:flex;flex-direction:column;word-break:keep-all}
.cgg-drop[hidden]{display:none}
.cgg-drop .who{padding:8px 12px 10px;font-size:12.5px;color:var(--muted);line-height:1.4} .cgg-drop .who b{display:block;color:var(--text);font-size:14px}
.cgg-drop button{display:flex;align-items:center;gap:9px;border:0;background:transparent;font:inherit;font-size:14px;padding:10px 12px;border-radius:9px;cursor:pointer;text-align:left;color:var(--text)}
.cgg-drop button:hover,.cgg-drop button:focus-visible{background:var(--hov)}
.cgg-drop button svg.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}
.cgg-drop button small{margin-left:auto;font-size:12px;color:var(--muted)}
.cgg-drop button .cnt{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--stop);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.cgg-drop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
/* 사람 단추 위 빨간 개수 (휴지통 건수 — 2026-10-14 「나」안) */
.cgg-badge{position:absolute;top:-7px;right:-7px;left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--stop);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;font-style:normal;line-height:1}

/* 창 · 알림 글 층 (1.1) — 제품의 창에 이 class 를 «더하거나», 제품 CSS 에서 z-index:var(--z-dialog) 로 맞춰요 */
.cgg-dialog{z-index:var(--z-dialog)!important} .cgg-toast{z-index:var(--z-toast)!important}

/* ───────── ⑤ 체험 모드 (1.2) — 미리 써 보기(가입 전) · 체험판(결제 전) 같은 모양 ───────── */
.cgg-trial{display:flex;align-items:center;gap:14px;background:var(--navy);color:#fff;border-radius:var(--r-card);padding:14px 18px;margin:0 0 16px}
.cgg-trial .tag{flex:none;background:var(--sky);color:var(--navy);font-weight:900;font-size:12.5px;border-radius:999px;padding:4px 11px}
.cgg-trial .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cgg-trial .tx b{font-size:14.5px} .cgg-trial .tx small{font-size:12.5px;opacity:.78;line-height:1.5}
.cgg-trial .go{flex:none;height:40px;padding:0 16px;border-radius:12px;border:1px solid #ffffff40;background:#ffffff14;color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.cgg-trial .prog{display:block;height:4px;border-radius:2px;background:#ffffff26;margin-top:6px;overflow:hidden}
.cgg-trial .prog i{display:block;height:100%;background:var(--sky)}
.cgg-lock{display:inline-flex;margin-left:5px;vertical-align:-2px;opacity:.75} .cgg-lock svg.ic{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cgg-left{margin-left:8px;font-size:11.5px;font-weight:700;color:var(--run);background:var(--run-bg);border-radius:999px;padding:2px 8px;white-space:nowrap}
.cgg-left.out{color:var(--muted);background:var(--bg)}
.cgg-cls{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--sh);padding:18px 20px;margin:0 0 16px}
.cgg-cls h3{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:16px} .cgg-cls h3 small{font-size:12px;color:var(--muted);font-weight:500}

.cgg-clsrow .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px} .cgg-clsrow .nm b{font-size:14px} .cgg-clsrow .nm small{font-size:12.5px;color:var(--muted)}
.cgg-clsrow .st{font-size:12.5px;color:var(--muted)}
.cgg-clsrow button{flex:none;white-space:nowrap;height:36px;padding:0 12px;border-radius:var(--r-ctl);border:1px solid var(--ln2);background:var(--surface);color:var(--btn-ink);font:inherit;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.cgg-k{flex:none;display:inline-flex;align-items:center;gap:3px;min-width:52px;justify-content:center;height:24px;border-radius:999px;font-size:12px;font-weight:700}
.cgg-k.lock{background:var(--stop-bg);color:var(--stop)} .cgg-k.try{background:var(--run-bg);color:var(--run)} .cgg-k.see{background:var(--done-bg);color:var(--done)}
.cgg-k svg.ic{width:12px;height:12px}
.cgg-clsrow button svg.ic{width:16px;height:16px}
@media (max-width:600px){

  .cgg-clsrow{flex-wrap:wrap;gap:8px 12px} .cgg-clsrow .nm{flex:1 1 calc(100% - 76px)} .cgg-clsrow button,.cgg-clsrow .st{margin-left:64px}
}

/* ═══════════ ⑥ 화면 일곱 칸 본문 (1.3) — J안 4판 값 그대로 ═══════════ */
/* ② 화면 머리: 묶음 › 화면 + 말하는 제목 + 설명 한 줄 + 오른쪽 버튼 */
.cgg-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:0 0 18px}
.cgg-head .hello{min-width:0;flex:1 1 320px}
.cgg-head .hello small{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.cgg-head .hello h1{margin:0;font-size:28px;font-weight:900;letter-spacing:-.8px;line-height:1.3;text-wrap:balance}
.cgg-head .hello h1 em{font-style:normal;color:inherit} .cgg-head.hi .hello h1 em{color:var(--blue)}  /* 1.12 대표님 10/18: 화면 제목 숫자는 홈까지 모두 기본 글자색 — 파랑은 head({hi:true})일 때만(지금 쓰는 곳 없음) */
.cgg-head .hello p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.cgg-head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
/* 버튼 — 높이 43 · 모서리 12 · 파란 버튼은 한 화면에 하나 */
.cgg-btn{height:var(--ctl);padding:0 18px;border-radius:var(--r-ctl);border:1px solid var(--ln2);background:var(--surface);font:inherit;font-weight:700;font-size:14px;color:var(--btn-ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.cgg-btn:hover{border-color:var(--muted)}
.cgg-btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 16px -8px #1668C4cc}
.cgg-btn:disabled{opacity:.45;cursor:default}
.cgg-btn svg.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cgg-card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--sh);margin:0 0 16px}
/* ⑤ 숫자 카드 4개 — 큰 숫자 + 작은 그래프 + 지난주보다 */
.cgg-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 16px}
.cgg-kpi{position:relative;padding:18px 20px;background:var(--surface);border-radius:var(--r-card);box-shadow:var(--sh);min-width:0}
.cgg-kpi small{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
/* 1.6 — 오른쪽 빈자리는 작은 그래프가 있을 때만 (그래프가 없는데 이름이 두 줄로 꺾이던 것) */
.cgg-kpi.has-sp small,.cgg-kpi:has(>svg.sp) small{padding-right:80px}
.cgg-kpi small i{width:10px;height:10px;border-radius:3px;flex:none}
.cgg-kpi strong{display:block;font-size:30px;font-weight:900;letter-spacing:-.8px;margin-top:8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cgg-kpi strong em{font-style:normal;font-size:14px;color:var(--muted);font-weight:700;margin-left:3px}
.cgg-kpi .tr{font-size:12.5px;font-weight:700;color:var(--done);margin-top:4px;display:block} .cgg-kpi .tr.dn{color:var(--stop)} .cgg-kpi .tr span{color:var(--muted);font-weight:500}
.cgg-kpi svg.sp{position:absolute;right:18px;top:18px;width:72px;height:26px}
/* ⑥ 데이터 카드 — 상태 탭+개수 · 거르기 알약 · 검색 · 표(머리 40 · 줄 50) · 쪽 */
.cgg-tabsH{display:flex;gap:2px;padding:4px 16px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.cgg-tabsH button{border:0;background:transparent;font:inherit;font-size:14px;color:var(--muted);padding:13px 10px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.cgg-tabsH button b{margin-left:5px;font-size:12px;font-weight:700;color:var(--muted);background:var(--bg);border-radius:999px;padding:1px 8px}
.cgg-tabsH button[aria-selected="true"]{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
.cgg-tabsH button[aria-selected="true"] b{background:var(--tabon);color:var(--blue)}
.cgg-filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.cgg-fp{height:32px;border:1px dashed var(--ln2);border-radius:999px;padding:0 13px;font:inherit;font-size:13px;color:var(--btn-ink);background:var(--surface);cursor:pointer}
.cgg-fp.on{border-style:solid;color:var(--blue);background:var(--tabon);font-weight:700}
.cgg-filters .sp{flex:1}
.cgg-find{height:36px;border:1px solid var(--ln2);border-radius:10px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;color:var(--muted);background:var(--surface)}
.cgg-find input{border:0;font:inherit;font-size:13.5px;width:170px;background:transparent;color:var(--text);outline:0}
.cgg-twrap{overflow-x:auto}
.cgg-table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;min-width:900px;table-layout:fixed}
.cgg-table th{height:40px;padding:0 14px;text-align:left;font-size:12.5px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface);white-space:nowrap;cursor:pointer;user-select:none}
.cgg-table td{height:50px;padding:0 14px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--surface)}

.cgg-table .n{text-align:right;font-variant-numeric:tabular-nums} .cgg-table .c{text-align:center}
.cgg-table .fx0{position:sticky;left:0;z-index:1;text-align:center;width:56px}

.cgg-table .nm{border:0;background:transparent;font:inherit;font-weight:700;color:inherit;cursor:pointer;padding:0;text-align:left}
.cgg-table .nm:hover{color:var(--blue);text-decoration:underline}
/* 1.6 — 두 줄 칸: render 가 {html:'<span class="a">윗줄</span><span class="b">아랫줄</span>'} 을 주면 표 · 폰 목록 모두 두 줄 */
.cgg-table td>.a,.cgg-table td>.b,.cgg-mrow .r>b>.a,.cgg-mrow .r>b>.b{display:block;line-height:1.25;overflow:hidden;text-overflow:ellipsis}

.cgg-app input[type=checkbox]:checked,.cgg-dlg input[type=checkbox]:checked{background:var(--blue);border-color:var(--blue)}
.cgg-app input[type=checkbox]:checked::after,.cgg-dlg input[type=checkbox]:checked::after{opacity:1}
/* 상태 칩 4가지 (진행 중 · 완료 · 확인 필요 · 보류) */
.cgg-st{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:6px;font-size:12px;font-weight:700;white-space:nowrap}
.cgg-st.run{background:var(--run-bg);color:var(--run)} .cgg-st.done{background:var(--done-bg);color:var(--done)} .cgg-st.chk{background:var(--chk-bg);color:var(--chk)} .cgg-st.stop{background:var(--stop-bg);color:var(--stop)}
.cgg-pager{display:flex;align-items:center;gap:8px;padding:12px 16px;font-size:13px;color:var(--muted);flex-wrap:wrap}

.cgg-btn.sm{height:32px;padding:0 10px;font-size:12.5px;border-radius:9px}
.cgg-btn.danger{color:var(--stop)}
.cgg-filters .cgg-btn.sm{height:32px}
.cgg-acts-cell{white-space:nowrap} .cgg-acts-cell .cgg-btn+.cgg-btn{margin-left:4px}
.cgg-mlist{display:none}
/* ⑦ 도움 카드 (접힘) */
.cgg-help{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--sh);padding:0 20px;margin:0 0 16px}
.cgg-help summary{height:50px;display:flex;align-items:center;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer}

.cgg-dim{position:fixed;inset:0;z-index:var(--z-dialog);background:#0B254573;display:grid;place-items:center;padding:16px}
.cgg-dim[hidden]{display:none}
.cgg-dlg{box-sizing:border-box;background:var(--surface);color:var(--text);border-radius:22px;width:min(400px,100%);padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 24px 60px #0B254559;max-height:calc(100vh - 32px);overflow:auto;word-break:keep-all}
.cgg-dlg.form{width:min(560px,100%)}

.cgg-dlg.detail{width:min(520px,100%);height:100%;max-height:none;border-radius:22px 0 0 22px}
.cgg-dlg h3{margin:0;font-size:18px;font-weight:900;letter-spacing:-.3px}

.cgg-dlg dt{color:var(--muted)} .cgg-dlg dd{margin:0;font-weight:800;font-variant-numeric:tabular-nums}
.cgg-dlg .ft{display:flex;gap:8px;justify-content:flex-end;margin-top:auto}
.cgg-dlg .fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.cgg-dlg input:not([type=checkbox]),.cgg-dlg select,.cgg-dlg textarea{height:var(--ctl);border:1px solid var(--ln2);border-radius:12px;padding:0 12px;font:inherit;font-size:14.5px;background:var(--surface);color:var(--text)}
.cgg-dlg .x{position:absolute;right:14px;top:14px}

.cgg-toastbox[hidden]{display:none}
@media (max-width:1100px){ .cgg-kpis{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:600px){
  .cgg-head{margin-bottom:12px;gap:10px} .cgg-head .hello h1{font-size:19px;letter-spacing:-.5px;line-height:1.35} .cgg-head .hello p{font-size:12.5px;margin-top:3px} .cgg-head .hello small{font-size:11.5px;margin-bottom:3px}

  .cgg-kpis{gap:8px;margin-bottom:10px} .cgg-kpi{padding:11px 12px;border-radius:14px} .cgg-kpi small{font-size:11.5px;gap:6px} .cgg-kpi.has-sp small,.cgg-kpi:has(>svg.sp) small{padding-right:46px} .cgg-kpi strong{font-size:19px;margin-top:4px;letter-spacing:-.4px} .cgg-kpi strong em{font-size:11.5px} .cgg-kpi .tr{font-size:11px;margin-top:1px} .cgg-kpi svg.sp{width:44px;height:16px;right:10px;top:12px}
  .cgg-tabsH{padding:0 8px} .cgg-tabsH button{font-size:13px;padding:10px 7px} .cgg-tabsH button b{font-size:11px;padding:0 6px;margin-left:3px}

.cgg-cal .lg{display:flex;flex-wrap:wrap;gap:6px 14px;padding:12px 18px 16px;font-size:12.5px;color:var(--muted)}
.cgg-cal .lg span{display:inline-flex;align-items:center;gap:5px} .cgg-cal .lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* 오른쪽 칸 */
.cgg-side{padding-bottom:16px}
.cgg-side .big{padding:10px 18px 0;font-size:26px;font-weight:900;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.cgg-side .big em{font-style:normal;font-size:13px;color:var(--muted);font-weight:700;margin-left:3px}
.cgg-side .bar{margin:10px 18px 0;height:10px;border-radius:5px;background:var(--bg);overflow:hidden}
.cgg-side .bar i{display:block;height:100%;background:var(--done);border-radius:5px}
.cgg-side .lgd{display:flex;flex-wrap:wrap;gap:4px 14px;padding:8px 18px 0;font-size:12.5px;color:var(--muted)}
.cgg-side .lgd b{color:var(--text)} .cgg-side .lgd b.done{color:var(--done)} .cgg-side .lgd b.chk{color:var(--chk)} .cgg-side .lgd .pc{margin-left:auto;font-weight:800;color:var(--text)}
.cgg-side dl{margin:12px 18px 0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;border-top:1px solid var(--line);padding-top:10px}
.cgg-side dt{color:var(--muted)} .cgg-side dd{margin:0;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.cgg-side .sub{margin:4px 18px 0;font-size:12.5px;color:var(--muted)}
.cgg-side .rk{display:flex;flex-direction:column;gap:9px;padding:12px 18px 0}
.cgg-side .rk .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13.5px}
.cgg-side .rk .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .cgg-side .rk .v{font-weight:800;font-variant-numeric:tabular-nums}
.cgg-side .rk .b{grid-column:1/-1;height:6px;border-radius:3px;background:var(--bg);overflow:hidden} .cgg-side .rk .b i{display:block;height:100%;background:var(--blue);border-radius:3px}
@media (max-width:1100px){ .cgg-homegrid{grid-template-columns:minmax(0,1fr)} }
@media (max-width:600px){
  :root{--hdr-h:48px;--logo:26px;--brand-fs:14px;--hb-h:34px;--pad:12px;--h1-fs:19px;--sec-gap:10px;--cal-cell:58px}
  .cgg-brand .cgg-ci{border-radius:8px;font-size:12px}
  .cgg-right .cgg-hb.cgg-wide{display:none}
  .cgg-hb{background:#ffffff12;border-color:#ffffff30;color:#fff;padding:0 10px}
  .cgg-main{padding:12px var(--pad) 18px}
  .cgg-sech b{font-size:14.5px} .cgg-link{font-size:12.5px}
  .cgg-cardh{padding:12px 12px 0} .cgg-cardh b{font-size:14.5px} .cgg-cardh .cgg-btn.sm{height:28px;padding:0 8px;font-size:11.5px}
  .cgg-cal .ym{padding:2px 12px 0} .cgg-cal .dow,.cgg-cal .grid{gap:3px;padding:0 10px} .cgg-cal .d{padding:4px 3px;border-radius:8px}
  .cgg-cal .d .n{font-size:11px} .cgg-cal .d .n i{display:none} .cgg-cal .d .amt{font-size:10.5px} .cgg-cal .d .amt .w{display:none} .cgg-cal .d .amt .s{display:inline}
  .cgg-cal .d .mk span{font-size:9.5px;padding:0 3px;line-height:13px} .cgg-cal .lg{padding:10px 12px 12px;font-size:11.5px}
  .cgg-side .big{padding:8px 12px 0;font-size:21px} .cgg-side .bar{margin:8px 12px 0} .cgg-side .lgd,.cgg-side .rk{padding-left:12px;padding-right:12px} .cgg-side dl{margin:10px 12px 0} .cgg-side .sub{margin:4px 12px 0}
}

/* 1.8 보강 — 업체명 우선: 자리가 모자라면 접기 (CGG.header 가 cgg-fold1 · cgg-fold2 를 붙여요) */
.cgg-hb.cgg-more{display:none}
.cgg-top.cgg-fold1 .cgg-hfind .in{display:none}
.cgg-top.cgg-fold1 .cgg-hfind .ph{display:grid;place-items:center;width:var(--hb-h);height:var(--hb-h);border-radius:10px;border:1px solid #ffffff30;background:#ffffff12;color:#fff;cursor:pointer;padding:0}
.cgg-top.cgg-fold1 .cgg-hfind .ph svg.ic{width:17px;height:17px}
.cgg-top.cgg-fold2 .cgg-right .cgg-wide{display:none}
.cgg-top.cgg-fold2 .cgg-hb.cgg-more{display:inline-flex}
@media (min-width:1000px){ .lay-side .cgg-top.cgg-fold1 .cgg-hfind .ph,.lay-icon .cgg-top.cgg-fold1 .cgg-hfind .ph{border-color:var(--ln2);background:var(--surface);color:var(--btn-ink)} }
/* 줄 높이를 뼈대가 정해요 — 제품 body 줄 높이와 상관없이 같은 크기 (워시 방 알림 10/18) */
.cgg-top,.cgg-head,.cgg-quick,.cgg-sec,.cgg-acts,.cgg-kpis,.cgg-cal,.cgg-side,.cgg-help{line-height:1.45}
.cgg-act .tx b,.cgg-act .tx small{line-height:1.45}
.cgg-act .tx{min-width:0} .cgg-act .tx b,.cgg-act .tx small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}   /* 할 일 카드 높이가 글 길이로 달라지지 않게 */
/* 폰: 머리말에 업체명을 보여요 (제품 이름 대신) — 두 줄까지, 자르지 않음 */
@media (max-width:600px){
  .cgg-top .cgg-brand b,.cgg-top .cgg-brand small{display:none}
  .cgg-hdr .cgg-top .cgg-hdr-biz{display:block;flex:1 1 auto;max-width:none;min-width:0}
  .cgg-hdr .cgg-top .cgg-hdr-biz b{font-size:13.5px;line-height:1.2;display:-webkit-box;-webkit-box-orient:vertical;overflow:visible}
  .cgg-hdr .cgg-top .cgg-hdr-biz small{display:none}
  .cgg-top .cgg-hb[data-hb="refresh"] span{display:none}
  .cgg-top .cgg-hb[data-hb="refresh"]{padding:0;width:var(--hb-h);justify-content:center}
  .cgg-top .cgg-hb.cgg-me{max-width:92px;overflow:visible} .cgg-top .cgg-hb.cgg-me>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}

@media (min-width:1000px){
  /* 세로 · 아이콘 배치: 단추 줄이 넘치면 오른쪽으로 넘치게 해서(접기 판단용) 왼쪽 메뉴 위로 겹치지 않게 */
  .lay-side .cgg-right,.lay-icon .cgg-right{justify-content:flex-start;overflow:hidden}
  .lay-side .cgg-right>:first-child,.lay-icon .cgg-right>:first-child{margin-left:auto}
  /* 왼쪽 메뉴 안 업체명은 칸 폭을 다 써요 (두 줄까지, 자르지 않음) */
  .lay-side .cgg-hdr .cgg-hdr-biz{max-width:none;flex:none}
  .lay-side .cgg-hdr .cgg-hdr-biz small{white-space:normal;overflow:visible}
}

/* 기능 찾기 칸이 몰래 줄어들지 않게 (두 제품이 같은 때 접히도록) */
.cgg-right .cgg-hfind{flex:none}

/* 1.8 보강 — 세로 · 아이콘 배치에서 오픈 베타 띠가 머리말에 가려지지 않게 (체크 방 알림 10/18)
   띠를 맨 위에 붙이고(--beta-h = 띠 높이, CGG.layout 이 잼), 붙어 있는 머리말 · 윗줄 · 작은 탭 · 본문을 그만큼 내려요 */
@media (min-width:1000px){
  html.cgg-lay-fixed .cgg-beta{position:fixed;top:0;left:0;right:0;z-index:calc(var(--z-hdr) + 2)}
  .lay-side > .cgg-hdr,.lay-icon > .cgg-hdr{top:var(--beta-h,0px)}
  .lay-side .cgg-right,.lay-icon .cgg-right{top:var(--beta-h,0px)}
  .lay-side .cgg-sub,.lay-icon .cgg-sub{top:calc(64px + var(--beta-h,0px))}
  .lay-side > .cgg-main,.lay-icon > .cgg-main{padding-top:calc(var(--hdr-h) + 22px + var(--beta-h,0px))}
  .lay-side.hasSub > .cgg-main,.lay-icon.hasSub > .cgg-main{padding-top:calc(132px + var(--beta-h,0px))}
  .lay-icon .cgg-hdr .cgg-hdr-biz{top:var(--beta-h,0px)}
}

/* 1.8 최종 — 워시 · 체크 방 알림 10/18
   ① 메뉴 줄도 뼈대 줄 높이 1.45 (위 메뉴 58px)  ② 좁은 PC(600~900)에서 머리말이 넘치면 셋째로 접어요:
   제품 이름 글자를 숨기고 로고만 둬요. 업체명은 남은 폭을 다 쓰고 두 줄까지 보여요(자르지 않음)  ③ 자동 새로고침 고르기 칸 폭 */
.cgg-nav,.cgg-navsub,.cgg-nav button,.cgg-navsub button{line-height:1.45}
select.cgg-hb{width:auto}
.cgg-top.cgg-fold3 .cgg-brand{width:auto}
.cgg-top.cgg-fold3 .cgg-brand > div{display:none}
.cgg-hdr .cgg-top.cgg-fold3 .cgg-hdr-biz{flex:1 1 auto;max-width:none;min-width:0}
/* ④ 화면 안 작은 탭이 메뉴 아래 칸 줄과 겹치지 않게 — 601px 이상에서는 아래 칸이 늘 보여요(가로: 메뉴 밑 줄 / 세로: 왼쪽 펼침).
   제품 화면 안에 같은 아래 칸을 또 그리는 줄에는 class="cgg-dup-sub" 를 붙여요. 폰(600 이하)에서만 보여요 */
@media (min-width:601px){ .cgg-dup-sub{display:none !important} }

/* ═════════ 1.9 — 새 규칙(.claude/skills/chagotgan-builder/SKILL.md) 맞춤 · 대표님 10/18 «화면 통합은 출시 전에» ═════════ */
/* 숫자 칸 4개: 가운데 정렬 · 자릿수 맞춤. 작은 그래프는 오른쪽 위 그대로 (워시 시안 v132) */
.cgg-kpi .tr{display:block} .cgg-kpi strong{font-variant-numeric:tabular-nums}
.cgg-kpi{text-align:center}
.cgg-kpi small{justify-content:center}
/* 도구줄 안 칸 · 단추 높이 43px (폰 42px) */
.cgg-find,.cgg-fp,.cgg-filters .cgg-btn.sm,.cgg-tools .cgg-btn.sm,.cgg-pager .cgg-btn,.cgg-pager select,.cgg-mhead select,.cgg-clsrow button,.cgg-mbtn,.cgg-band .cgg-btn{height:var(--ctl)}
.cgg-fp{padding:0 16px;font-size:13.5px}
.cgg-filters .cgg-btn.sm{padding:0 14px;font-size:13.5px}
@media (max-width:600px){
  :root{--ctl:42px}
  .cgg-btn,.cgg-head .acts .cgg-btn,.cgg-pager .cgg-btn,.cgg-trial .go{height:var(--ctl)}
}
/* 표 체크칸 크게 (이름 칸은 1.6부터 틀 고정 .fx1) */
.cgg-table input[type=checkbox],.cgg-mlist input[type=checkbox]{width:22px;height:22px}
/* 할 일 띠 + [해결하러 가기] — CGG.todoBand (워시 시안 v132 모양: 색 바탕 · 굵은 글 한 줄 · 오른쪽 파란 단추) */
.cgg-band{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-radius:var(--r-card);padding:12px 16px;margin:0 0 var(--sec-gap);font-weight:700;line-height:1.45;background:var(--chk-bg);color:var(--chk)}
.cgg-band .tx{flex:1 1 240px;min-width:0}
.cgg-band .cgg-btn{flex:none}
.cgg-band.stop{background:var(--stop-bg);color:var(--stop)}
.cgg-band.run{background:var(--run-bg);color:var(--run)}
.cgg-band.done{background:var(--done-bg);color:var(--done)}
/* 달력식 달 고르기 — CGG.monthPick (가운데 창 · 4×3 칸 높이 52) */
.cgg-mpick{display:inline-flex}
.cgg-mbtn b{font-variant-numeric:tabular-nums}
.cgg-myr{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.cgg-myr b{font-size:18px;font-variant-numeric:tabular-nums}
.cgg-dlg .cgg-myr .cgg-btn{flex:none;width:auto;height:36px;padding:0 12px}
.cgg-mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cgg-mgrid button{height:52px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font:inherit;font-weight:700;cursor:pointer}
.cgg-mgrid button:hover{background:var(--hov)}
.cgg-mgrid button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.cgg-mgrid button.now:not([aria-pressed="true"]){border-color:var(--blue);color:var(--blue)}
.cgg-mgrid button:disabled,.cgg-myr button:disabled{opacity:.35;cursor:default}
/* 머리말 «연결됨» — 초록 점(8px · 바깥 고리 3px) + 글, 테두리 없음 */
.cgg-hb.cgg-conn{background:transparent;border-color:transparent;gap:6px}
.cgg-hb.cgg-conn i{width:8px;height:8px;border-radius:50%;background:#3DD68C;box-shadow:0 0 0 3px #3DD68C33;flex:none}
@media (min-width:1000px){ .lay-side .cgg-hb.cgg-conn,.lay-icon .cgg-hb.cgg-conn{border-color:transparent;color:var(--done)} }
/* 사람 단추 두 줄: 위 «김대표 ▾», 아래 작게 «마이페이지 · 휴지통» (폰은 아래 줄 숨김) */
.cgg-hb.cgg-me{height:auto;min-height:var(--hb-h);padding-block:3px;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;line-height:1.2}
.cgg-hb.cgg-me small{font-size:10.5px;opacity:.75;font-weight:500}
@media (max-width:600px){ .cgg-hb.cgg-me small{display:none} }
/* 머리말 [찾기] 단추 → 기능 찾기 창 */
.cgg-hb.cgg-findbtn{gap:6px} .cgg-hb.cgg-findbtn svg.ic{width:16px;height:16px}
.cgg-finddlg{min-height:260px}
.cgg-finddlg label.in{flex-direction:row;margin:0}
.cgg-finddlg input::placeholder{color:var(--muted)}
.cgg-finddlg .in{display:flex;align-items:center;gap:8px;width:100%;height:var(--ctl);box-sizing:border-box;padding:0 12px;border:1px solid var(--ln2);border-radius:var(--r-ctl);background:var(--surface);color:var(--muted)}
.cgg-finddlg .in input{border:0;background:transparent;height:auto;padding:0;margin:0;box-shadow:none;width:auto;flex:1;min-width:0;font:inherit;font-size:15px;color:var(--text);outline:none}
.cgg-finddlg .res{position:static;width:auto;box-shadow:none;border:1px solid var(--line);margin-top:8px}
.cgg-finddlg .res button{text-align:left;align-items:flex-start}
/* 마이페이지 창 — CGG.myPage */
.cgg-mypage{display:grid;gap:12px}
.cgg-mypage section{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.cgg-mypage h4{margin:0 0 8px;font-size:14px}
.cgg-mypage dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.cgg-mypage dt{color:var(--muted)}
.cgg-mypage dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.cgg-mypage .bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px;grid-column:1 / -1}
.cgg-mypage .bar i{display:block;height:100%;background:var(--blue)}
/* 알림 색 — 입고 파랑 · 출고 초록 · 입금 남색 (SKILL.md 1). 상태 칩 «입금 완료» = .cgg-st.pay */
:root{--pay:#0B2545;--pay-bg:#E3E8F0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pay:#c9d6ea;--pay-bg:#1c2a3d}}
:root[data-theme="dark"]{--pay:#c9d6ea;--pay-bg:#1c2a3d}
.cgg-st.pay{background:var(--pay-bg);color:var(--pay)}
.cgg-cal .mk .pay,.cgg-cal .lg .pay{background:var(--pay-bg);color:var(--pay)}
.cgg-cal .lg i.pay{background:var(--pay)}
/* 도구줄 — 화면 뼈대 «할 일 띠» 다음 줄: 달 고르기 · 거르기 · 단추 (높이 43 / 폰 42) */
.cgg-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 var(--sec-gap);line-height:1.45}
.cgg-tools .sp{flex:1}
@media (max-width:600px){ .cgg-tools .sp{display:none} }
/* 오픈 베타 띠 — 1.9부터 공통 부품에 들어 있어요(제품이 따로 붙이지 않아요). 색은 머리말과 같은 남색 #0B2545 (총괄 10/18 · 홈페이지 · 앱 방 점검) */
:root{--beta-bg:#0B2545;--beta-ink:#e8f0fb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--beta-bg:#1d3a5f}}
:root[data-theme="dark"]{--beta-bg:#1d3a5f}
.cgg-beta{background:var(--beta-bg);color:var(--beta-ink);font-size:13.5px;line-height:1.5;word-break:keep-all}
.cgg-beta .in{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cgg-beta b{background:var(--beta-ink);color:var(--beta-bg);border-radius:6px;padding:1px 8px;font-size:12px;font-weight:800;flex:none}
.cgg-beta[hidden]{display:none}
@media (max-width:600px){ .cgg-beta{font-size:12.5px} .cgg-beta .in{display:block;padding-block:6px} .cgg-beta b{margin-right:6px} }
/* 기능 찾기 = 메뉴 줄 오른쪽 끝 (대표님 10/18 확정) — CGG.nav(…, {find}). 흰 바탕 칸 · 결과는 아래로 펼침
   좁은 화면(1000 이하) · 세로 · 아이콘 배치에서는 숨고, 머리말 [찾기] 단추(.cgg-findalt)가 창으로 대신해요 */
.cgg-nav .cgg-navfind{margin-left:auto;align-self:center;width:260px;flex:0 1 260px;min-width:170px;position:relative;z-index:var(--z-drop)}
.cgg-nav:has(.cgg-navfind){overflow:visible}
.cgg-navfind .in{display:flex;align-items:center;gap:7px;height:calc(var(--nav-h) - 18px);width:100%;box-sizing:border-box;border-radius:var(--r-ctl);padding:0 12px;background:var(--surface);border:1px solid var(--ln2);color:var(--muted)}
.cgg-navfind input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:14px;color:var(--text);outline:none;box-shadow:none;height:auto;padding:0;margin:0}
.cgg-navfind .in:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px #1668C422}
.cgg-navfind input::placeholder{color:var(--muted)}
.cgg-navfind .ph{display:none}
.cgg-navfind .res{left:auto;right:0;width:340px}
.cgg-navfind .res button{text-align:left;align-items:flex-start}
.cgg-hb.cgg-findalt{display:none}
@media (max-width:1000px){ .cgg-nav .cgg-navfind{display:none} .cgg-hb.cgg-findalt{display:inline-flex} .cgg-nav:has(.cgg-navfind){overflow-x:auto} }

/* 입금 문자 · 시트 줄 읽기 — «[신한] 10/08 14:21 123-456-789012 입금 1,243,000 홍길동» 꼴 */
function smsParse(text){
  var now=new Date(), out=[], bad=0;
  String(text||"").split(/\n\s*\n|\r?\n(?=\s*\[)/).forEach(function(blk){
    var lines=/\t/.test(blk)?blk.split(/\r?\n/):[blk.replace(/\s+/g," ")];
    lines.forEach(function(s){ s=String(s||"").trim(); if(!s) return;
      if(/출금|지급|이체출금/.test(s) && !/입금/.test(s)) return;
      var am=s.match(/입금\s*([\d,]{2,})\s*원?/) || s.match(/([\d]{1,3}(?:,\d{3})+)\s*원?/);
      var amt=am?Number(am[1].replace(/,/g,"")):0;
      var dm=s.match(/(20\d{2})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/) || s.match(/(?:^|\D)(\d{1,2})[\/.\-](\d{1,2})(?=\D|$)/);
      var tm=s.match(/(\d{1,2}):(\d{2})/);
      if(!amt||!dm){ bad++; return; }
      var y,mo,da; if(dm.length===4){ y=+dm[1]; mo=+dm[2]; da=+dm[3]; } else { mo=+dm[1]; da=+dm[2]; y=now.getFullYear(); if(mo>now.getMonth()+1) y--; }
      if(mo<1||mo>12||da<1||da>31){ bad++; return; }
      var who="";
      if(am&&am.index!=null){ var rest=s.slice(am.index+am[0].length).replace(/잔액\s*[\d,]+원?.*/,"").replace(/[\d,\-]{5,}/g," ").trim(); who=(rest.split(/\s+/)[0]||""); }
      if(!who){ var t2=s.split(/\t/); who=(t2.length>2?t2[t2.length-1]:""); }
      function p(x){ return (x<10?"0":"")+x; }
      out.push({tx_at:y+"-"+p(mo)+"-"+p(da)+"T"+(tm?p(+tm[1])+":"+tm[2]:"00:00")+":00+09:00", sender:String(who||"입금자미상").replace(/[<>]/g,"").slice(0,40), amount:amt});
    });
  });
  return {rows:out, bad:bad};
}

<script>
/* 차곳간 엑셀(CSV) 한꺼번에 올리기 부품 csvup 1.0 — 체크/부품/엑셀올리기_부품_1.0.js 글자 그대로 */
/* 워시 v134(보안 통과) 에서 그대로 옮긴 공통 부품 — 체크 v55 */
/* 차곳간 엑셀(CSV · xlsx) 한꺼번에 올리기 부품 csvup 1.1 (워시 v134~ · 체크도 같은 부품을 그대로 가져다 씀)
   1.1 (대표님 10/18): 카모두 전산에서 받은 딜러 명부를 «그대로» 올려도 되게
     · 칸 맞추기: 칸 이름 비슷한 말 사전으로 차곳간 칸에 자동 짝 → 미리보기 위 «칸 짝짓기» 한 줄에서 바꿀 수 있음(«안 씀» 포함)
     · 고른 짝은 이 기기에 업체별로 기억(o.store — 비면 기억 안 함) — 칸 이름만 저장, 손님 자료는 저장 안 함
     · 칸 이름 줄 찾기: 맨 위 제목 줄이 있어도 앞 10줄 안에서 칸 이름 줄을 찾아요
     · 카모두 딜러리스트 · 상사리스트(총괄 10/18 칸 이름): 회사명 · 딜러명 · 핸드폰 / 회사명 · 대표자 · 대표전호 · 주소
       재직여부 «재직» · 영업여부 «영업» 만 넣고 나머지(퇴사 · 폐업 …)는 건너뜀(미리보기에 몇 명인지)
     · ⚠ 개인정보 칸(회사코드 · 주민등록번호 · 법인등록번호 · 생년월일 …)은 읽자마자 지우고 짝짓기에서도 못 골라요.

     · «상사로 거르기»: 미리보기에서 넣을 상사만 고르기(여러 개)
     · .xlsx 도 받기 — 바깥 엑셀 읽기 도구(SheetJS) 없이 브라우저 기본 압축 풀기(DecompressionStream)로 첫 시트만 읽어요
       (못 쓰는 브라우저 · 옛 .xls 는 «CSV로 저장» 안내. 웹 표를 .xls 이름으로 내려 주는 전산 파일은 표로 읽어요)
   1.0 (워시 v133):
   대표님 10/18: 브라더광택이 거래처(상사 · 딜러) · 배달 장소를 양식 파일에 적어 직접 한 번에 올려요.
   순서: [엑셀 양식 받기] → 엑셀에서 적고 저장 → [엑셀로 한꺼번에 올리기] → 미리보기(몇 줄 · 새로 · 이미 있음 · 틀린 줄과 까닭) → [N건 넣기]

   · 이미 있는 것은 고치지 않고 건너뛰어요(새로 넣기만) — 고치기 · 지우기는 거래처 화면에서
   · 서버에 따로 창구가 없어도 돼요: 제품이 주는 저장 함수(거래처 부품 cpt 와 같은 api)를 줄마다 불러요
   쓰는 공통 부품: CGG.dialog · CGG.closeDialog · CGG.toast · CGG.esc (cgg-j4 1.5 이상)

   CGG_CSVUP.partners(o)   거래처
     o = { owner, tplText(양식 파일 글자), dealers, companies   ← 거래처 부품 cpt 와 같은 모양
           later:true/false(«나중에» 저장 가능 · 없으면 상사 있으면 «상사 이름으로», 없으면 «안 끊음»),
           api:{ saveCompany({name,no,ceo,email}) → Promise, saveDealer({name,tel,comp,tax,biz}, true) → Promise },
           done(msg), fail(err) → 쉬운 말 }
   CGG_CSVUP.places(o)     배달 장소
     o = { owner, tplText, places:[{name,addr,phone,memo}], api:{ savePlaces([{name,addr,phone,memo}]) → Promise }, done, fail }
   CGG_CSVUP.download(name, text)  양식 받기(BOM 붙여서) */
var CGG_CSVUP = (function(){

  /* 엑셀이 숫자로 바꾸며 맨 앞 0을 지운 번호(1012345678 · 212345678) → 0 붙여 되살림 */

  function toast(t){ try{ CGG.toast(t); }catch(e){} }
  function $id(i){ return document.getElementById(i); }
  function closeD(){ try{ CGG.closeDialog(); }catch(e){} }
  function bizOk(v){ var d=dig(v); if(d.length!==10 || /^0+$/.test(d)) return false;
    var w=[1,3,7,1,3,7,1,3,5], s=0; for(var i=0;i<9;i++) s+=(+d[i])*w[i]; s+=Math.floor((+d[8])*5/10); return (10-s%10)%10===(+d[9]); }
  function telOk(v){ return /^01[016789]\d{7,8}$/.test(dig(v)); }
  function emailOk(v){ return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v); }
  function key(s){ return String(s==null?"":s).replace(/\s+/g,"").toLowerCase(); }

  /* ── 파일 글자 읽기 · 나누기 ── */
  function decode(buf){ var u=new Uint8Array(buf), t;

    catch(e){ try{ t=new TextDecoder("euc-kr").decode(u); }catch(e2){ t=new TextDecoder("utf-8").decode(u); } }
    return t.replace(/^﻿/,""); }
  function parse(text){

  function pickFile(done){

  /* ── .xlsx 읽기 (첫 시트) — zip 안 sheet1 · sharedStrings 만 풀어서 XML 로 읽어요. 수식 · 서식 · 매크로는 안 봐요 ── */

  /* 웹 표를 .xls 이름으로 내려 주는 전산 파일 — 첫 표를 읽어요(스크립트는 실행되지 않아요) */

  /* ── 1단계 창: 양식 받기 · 파일 고르기 ── */
  function open(o){
    if(!o.owner){ toast("엑셀로 올리기는 대표만 할 수 있어요."); return; }
    CGG.dialog({size:"form", title:o.title, desc:"양식이나 전산에서 받은 엑셀을 올리면, 넣기 전에 한 번 보여 드려요.",
      body:'<ol class="csu-steps"><li>«엑셀 양식 받기»로 받은 파일에 적거나, 전산에서 받은 엑셀을 그대로 써요.</li><li>«파일 고르기»로 올려요. 칸 이름이 달라도 «칸 짝짓기»에서 맞출 수 있어요.</li></ol>'+
        (o.hint?'<div class="csu-hint">'+esc(o.hint)+'</div>':'')+
        '<div class="csu-drop" id="csuDrop">여기에 파일을 끌어다 놓아도 돼요 (.xlsx · .csv)</div>'+
        '<div class="cpt-err" id="csuErr" hidden></div>'+
        '<div class="csu-btns"><button type="button" class="cgg-btn" id="csuTpl">엑셀 양식 받기</button>'+
        '<button type="button" class="cgg-btn pri" id="csuPick">파일 고르기</button></div>',
      cancel:"닫기"});

    var dz=$id("csuDrop");

    dz.ondragleave=function(){ dz.classList.remove("on"); };
    dz.ondrop=function(e){ e.preventDefault(); dz.classList.remove("on"); var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(f) readFile(o, f); };
  }
  function err(t){ var b=$id("csuErr"); if(b){ b.hidden=!t; b.textContent=t||""; } else if(t) toast(t); }
  function readFile(o, f){

  /* 기억한 짝 — 이 기기 · 업체별 · 칸 이름만 */
  function memKey(o){ return "cgg.csvup."+o.kind+"."+String(o.store||"").slice(0,80); }
  function memGet(o){ if(!o.store) return {}; try{ return JSON.parse(localStorage.getItem(memKey(o))||"{}")||{}; }catch(e){ return {}; } }
  function memPut(o, head, at){ if(!o.store) return; try{ var m={}; o.cols.forEach(function(c){ m[c.k]=at[c.k]==null?"":String(head[at[c.k]]||""); }); localStorage.setItem(memKey(o), JSON.stringify(m)); }catch(e){} }

  /* ── 2단계 창: 칸 짝짓기 + 상사로 거르기 + 미리보기 → 넣기 ── */
  var ST={ "new":["새로","csu-new"], dup:["이미 있음","csu-dup"], bad:["틀린 줄","csu-bad"], ex:["예시 줄","csu-dup"], skip:["건너뜀","csu-dup"] };

      rows.push(["틀린 줄 (건너뜀)", cnt.bad+"줄"]);

    function rowsHtml(){

      return '<table><thead><tr><th>줄</th><th>상태</th><th>내용</th><th>까닭 · 알림</th></tr></thead><tbody>'+
        (v.length?v.slice(0,SHOW).map(function(x){ return '<tr><td class="n">'+x.line+'</td><td><span class="csu-chip '+ST[x.st][1]+'">'+ST[x.st][0]+'</span></td>'+
          '<td>'+esc(o.label(x.c))+'</td><td class="w">'+esc(x.why||"")+'</td></tr>'; }).join(""):'<tr><td colspan="4" class="em">없어요</td></tr>')+
        '</tbody></table>'+(more?'<div class="csu-hint">앞의 '+SHOW+'줄만 보여요 (이 칸 모두 '+v.length+'줄).</div>':''); }
    function mapHtml(){
      var bl=F.blk.length?'<div class="csu-hint">«'+esc(F.blk.map(function(i){ return F.head[i]; }).join(" · "))+'» 칸은 개인정보일 수 있어 읽지 않아요.</div>':'';
      if(!F.open) return '<div class="csu-map"><div class="csu-mapc"><span><b>칸 짝짓기</b> '+
        esc(o.cols.filter(function(c){ return F.at[c.k]!=null; }).map(function(c){ return c.label+" ← "+(F.head[F.at[c.k]]||colName(F.at[c.k])+"열"); }).join(" · "))+
        '</span><button type="button" class="cgg-btn sm" data-csuo="1">바꾸기</button></div>'+bl+'</div>';
      return '<div class="csu-map"><div class="csu-maph"><b>칸 짝짓기</b><span class="csu-hint">'+(unsure?'주황 칸을 확인해 주세요. 올린 파일의 어느 칸인지 골라요.':'올린 파일의 어느 칸인지 골라요. 쓰지 않는 칸은 «안 씀».')+'</span></div><div class="csu-mapr">'+
        o.cols.map(function(c){ var cur=F.at[c.k], warn=warnOf(c);
          return '<label class="'+(warn?"warn":"")+'"><span>'+esc(c.label)+'</span><select data-csum="'+c.k+'"><option value="">안 씀</option>'+

        '<button type="button" class="cgg-btn sm" data-csuf="1">'+(F.fopen?"닫기":"고르기")+'</button></div>'+
