.fhcam .top .cic{width:23px;height:23px;flex:0 0 auto;border-radius:7px;background:var(--brand);
  display:flex;align-items:center;justify-content:center;font-size:12px}
.fhcam .top b{font-size:13px;color:#fff;font-weight:700}
.fhcam .row{display:flex;align-items:center;gap:12px}
.fhcam .plate{flex:1;min-width:0;height:44px;border-radius:10px;border:2px solid var(--sky);
  background:rgba(143,201,242,.12);display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:800;letter-spacing:.5px;color:#fff;text-align:center;padding:0 8px}
.fhcam .plate.wait{font-size:12.5px;font-weight:600;color:#9DB0C6;letter-spacing:0}
.fhcam .shot{width:44px;height:44px;flex:0 0 auto;border-radius:50%;border:3px solid rgba(255,255,255,.28);
  background:#fff;color:#071829;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.fhcam .shot:active{transform:scale(.96)}
.fhcam .sub{font-size:11px;color:#9DB0C6;line-height:1.4}
.fhcam .sub .ok{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:16px;
  background:rgba(22,104,196,.92);color:#fff;font-size:11.5px;font-weight:700;margin-right:6px}
.fhnums{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:7px 8px;margin-bottom:9px}
.fhnums > div{flex:1;text-align:center}
.fhnums > div span{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.fhnums > div b{display:block;font-size:19px;font-weight:800;margin-top:0}
.fhnums > i{width:1px;background:var(--line)}
.fhh2{display:flex;align-items:center;gap:8px;margin:0 0 6px}
.fhh2 h2{margin:0;font-size:14px;font-weight:800}
.fhh2 .lnk{margin-left:auto;background:none;border:0;color:var(--brand);font-size:13px;font-weight:700;
  cursor:pointer;font-family:inherit;padding:4px}
.fhrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:8px 11px;margin-bottom:7px}
.fhrow .l{flex:1;min-width:0}
.fhrow .pl{font-size:16px;font-weight:800;letter-spacing:-.02em}
.fhrow .m1{font-size:12.5px;color:var(--ink2,#3C424E);margin-top:2px}
.fhrow .m2{font-size:11.5px;color:var(--muted);margin-top:1px}
.fhrow .go{flex:0 0 auto;height:36px;padding:0 14px;border-radius:10px;border:0;background:var(--brand);
  color:#fff;font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit}
.fhrow .go:active{transform:translateY(1px)}

/* 현장 화면 머리말 간결하게 */
.wrap:not(.pc) > header{padding:7px 14px 8px;margin:0 -14px 12px}
.wrap:not(.pc) > header .logo{width:26px;height:26px;font-size:11px;border-radius:8px}
.wrap:not(.pc) > header h1{font-size:15px;letter-spacing:-.03em}
.wrap:not(.pc) > header .sub#hSub{display:none}
.wrap:not(.pc) > header #hVer{font-size:9.5px;opacity:.5;margin-top:0}
.wrap:not(.pc) > header .who{font-size:10.5px;line-height:1.2}
.wrap:not(.pc) > header .who b{font-size:12px}
.wrap:not(.pc) > header .mini{padding:6px 9px;font-size:11.5px}
.wrap:not(.pc) > header .hdr-right{gap:4px;flex-wrap:wrap;max-width:100%;min-width:0}
.wrap:not(.pc) > header .hr1,.wrap:not(.pc) > header .hr2{flex-wrap:wrap;justify-content:flex-end;max-width:100%;min-width:0;row-gap:4px}
.wrap:not(.pc) > header #pollSel{max-width:96px}
.wrap:not(.pc) > header .mini{white-space:nowrap}
.brandrow{flex-wrap:wrap}
.wrap:not(.pc) > header .tabs{margin-top:9px}
.wrap:not(.pc) > header .tabs button{padding:9px 6px;font-size:14.5px}
/* 사진 올리는 중 알림 띠 */
#upBadge{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:70;
  background:var(--brand);color:#fff;border-radius:999px;padding:10px 18px;font-size:13.5px;
  font-weight:800;box-shadow:0 10px 26px rgba(11,93,143,.35);max-width:calc(100vw - 32px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 파일 끌어다 놓는 칸 */
.dropzone{margin-top:12px;border:2px dashed var(--line);border-radius:14px;padding:22px 16px;
  text-align:center;color:var(--muted);cursor:pointer;background:var(--surface2);
  transition:border-color .15s,background .15s}
.dropzone b{display:block;font-size:15px;color:var(--text);margin-bottom:4px}
.dropzone span{font-size:12.5px}
.dropzone:hover{border-color:var(--brand)}
.dropzone.over{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
/* PC 실시간 알림 (입고·출고가 생기면 뜨는 창) */
#ntfBox{position:fixed;right:18px;bottom:18px;z-index:80;display:flex;flex-direction:column;gap:10px;
  max-width:min(400px,calc(100vw - 36px));pointer-events:none}
.ntf{pointer-events:auto;background:var(--surface);border-radius:16px;padding:14px 16px;
  box-shadow:0 14px 40px rgba(10,22,40,.28);border-left:6px solid var(--brand);
  animation:ntfIn .25s ease-out}
.ntf.out{border-left-color:var(--good)}
.ntf.pay{border-left-color:var(--pay)}
.ntf.pay .np{color:var(--pay)}
.ntf .nt{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:900;color:var(--text)}
.ntf .nt .x{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:20px;
  cursor:pointer;line-height:1;padding:0 2px}
.ntf .np{font-size:22px;font-weight:900;margin:6px 0 2px;letter-spacing:-.02em}
.ntf .nl{font-size:13px;color:var(--muted);line-height:1.5}
.ntf .nl b{color:var(--text)}
.ntf .ng{margin-top:10px;display:flex;gap:6px}
.ntf .ng button{flex:1;border:1px solid var(--line);background:var(--surface2);color:var(--text);
  border-radius:9px;padding:8px 6px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
.ntf .ng button.go{background:var(--brand);color:#fff;border-color:var(--brand)}
@keyframes ntfIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (max-width:700px){#ntfBox{display:none}}
/* 가운데 큰 알림 (확인을 눌러야 넘어감) */
#ntfBg{position:fixed;inset:0;background:rgba(8,16,28,.62);z-index:95;display:none;
  align-items:center;justify-content:center;padding:20px}
#ntfBg.show{display:flex}
#ntfBig{background:var(--surface);border-radius:22px;padding:26px 28px 22px;width:min(520px,100%);
  box-shadow:0 30px 80px rgba(0,0,0,.45);border-top:10px solid var(--brand);animation:ntfIn .22s ease-out;
  max-height:88vh;overflow:auto}
#ntfBig.out{border-top-color:var(--good)}
#ntfBig .bt{font-size:27px;font-weight:900;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
#ntfBig .bp{font-size:40px;font-weight:900;margin:12px 0 4px;letter-spacing:-.03em;color:var(--brand)}
#ntfBig.out .bp{color:var(--good)}
#ntfBig.pay{border-top-color:var(--pay)}
#ntfBig.pay .bp{color:var(--pay)}
#ntfBig .bl{font-size:16px;line-height:1.75;color:var(--muted);margin-top:8px}
#ntfBig .bl b{color:var(--text)}
#ntfBig .bq{margin-top:10px;font-size:13px;color:var(--muted)}
#ntfBig .bb{margin-top:20px;display:flex;gap:8px}
#ntfBig .bb button{flex:1;border:1px solid var(--line);background:var(--surface2);color:var(--text);
  border-radius:12px;padding:15px 10px;font-family:inherit;font-size:17px;font-weight:800;cursor:pointer}
#ntfBig .bb button.go{flex:2;background:var(--brand);color:#fff;border-color:var(--brand)}
#ntfBig.out .bb button.go{background:var(--good);border-color:var(--good)}
#ntfBig.pay .bb button.go{background:var(--pay);border-color:var(--pay);color:var(--pay-ink)}
/* 찾기 목록 */
.findrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface2);
  border-radius:11px;padding:10px 12px;cursor:pointer;margin-bottom:6px}
.findrow:active{background:var(--brand-soft)}
.findrow b{font-size:15px}
.findrow small{color:var(--muted);font-size:12px}
.findrow .r{margin-left:auto;font-size:11.5px;color:var(--muted)}
.picked{display:flex;align-items:center;gap:10px;background:var(--brand-soft);border-radius:11px;padding:12px 14px}
.picked .p1{font-size:16px;font-weight:800;color:var(--brand)}
.picked .p2{font-size:12.5px;color:var(--muted)}
.seg{display:flex;gap:6px;background:var(--surface2);padding:4px;border-radius:12px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font-family:inherit;font-size:14px;
  font-weight:700;padding:9px 6px;border-radius:9px;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--brand);box-shadow:var(--shadow)}
.sum.clickable{cursor:pointer}
.sum.clickable[aria-selected="true"]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}

.sheetx{position:absolute;top:10px;right:12px;width:34px;height:34px;border-radius:50%;
  border:0;background:rgba(120,130,145,.25);color:#fff;font-size:17px;font-weight:800;cursor:pointer;
  display:grid;place-items:center;z-index:5}
.sheetx:hover{background:rgba(120,130,145,.45)}
.sheet{position:fixed}
.phgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.phcell{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--surface2);
  border:1px dashed var(--line);display:grid;place-items:center;cursor:pointer;font-size:12px;color:var(--muted)}
.phcell img{width:100%;height:100%;object-fit:cover}
.phcell .del{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;
  background:rgba(0,0,0,.6);color:#fff;font-size:13px;cursor:pointer}
.memoline{font-size:13.5px;color:var(--text);font-weight:600}
.memoline .cam{color:var(--brand);font-weight:800}

.wrap:not(.pc) > header .hdr-right{display:flex;flex-direction:row;flex-wrap:wrap;
  align-items:center;justify-content:flex-end;gap:4px;row-gap:4px;flex:1 1 auto;min-width:0}
.hr1,.hr2{display:contents}
.datebar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.datebar button{flex:1;min-width:64px;border:1px solid var(--line);background:var(--surface2);color:var(--text);
  border-radius:9px;padding:9px 6px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
.datebar button[aria-selected="true"]{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}

/* ── 폰(현장) 머리말: 상호명 + 버튼 두 줄 ── */
.wrap:not(.pc) > header .brandrow{display:flex;flex-wrap:nowrap;align-items:center;gap:7px}
.wrap:not(.pc) > header .hdr-right{display:flex;flex-direction:column;flex-wrap:nowrap;
  align-items:flex-end;justify-content:center;gap:4px;flex:0 0 auto;margin-left:auto;min-width:0;max-width:none}
.wrap:not(.pc) > header .hr1,.wrap:not(.pc) > header .hr2{display:flex;flex-wrap:nowrap;
  align-items:center;justify-content:flex-end;gap:4px;max-width:none;min-width:0}
.wrap:not(.pc) > header #hdrBreak{display:none !important}
.wrap:not(.pc) > header .mini{padding:6px 8px;font-size:11.5px;white-space:nowrap;flex:0 0 auto}
.wrap:not(.pc) > header #pollSel{min-width:0;max-width:82px;font-size:11px;padding:5px 6px}
.wrap:not(.pc) > header .who{font-size:10px;line-height:1.15;margin-right:1px;flex:0 0 auto}
.wrap:not(.pc) > header .who b{font-size:11.5px}
/* 권한 설명은 도움말에 있으니 폰에서는 이름만 보여 자리를 아낍니다 */
.wrap:not(.pc) > header .who #meRole,.wrap:not(.pc) > header .who br{display:none}
.wrap:not(.pc) > header .who{max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:389px){
  .wrap:not(.pc) > header .mini{padding:5px 7px;font-size:10.5px}
  .wrap:not(.pc) > header #pollSel{max-width:72px;font-size:10px;padding:4px 5px}
  .wrap:not(.pc) > header .bizname b{font-size:17px}
  .wrap:not(.pc) > header .who{max-width:56px;font-size:9.5px}
  .wrap:not(.pc) > header .who b{font-size:10.5px}
}
.wrap:not(.pc) > header .hdr-right{flex:0 1 auto}
.wrap:not(.pc) > header .hr1 .mini,.wrap:not(.pc) > header .hr2 .mini{min-width:0}
/* 즐겨찾기 목적지 */
.favs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.fav{position:relative;border:1px solid var(--line);background:var(--surface2);color:var(--text);
  border-radius:10px;padding:10px 8px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav:active,.fav[aria-selected="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.fav .st{position:absolute;top:2px;left:4px;font-size:10px;color:#f5b301}
.destrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface2);
  border-radius:11px;padding:11px 13px;margin-bottom:6px;cursor:pointer}
.destrow b{font-size:15px}
.destrow small{color:var(--muted);font-size:12px;display:block}
.destrow .star{margin-left:auto;font-size:18px;color:#f5b301;background:none;border:0;cursor:pointer}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.lc{display:flex;gap:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);
  padding:9px;cursor:pointer;box-shadow:var(--shadow)}
.lc:hover{border-color:var(--brand)}
.lc-ph{width:74px;height:64px;flex:none;border-radius:9px;background:var(--surface2);overflow:hidden;
  display:grid;place-items:center;font-size:10.5px;color:var(--muted)}
.lc-ph img{width:100%;height:100%;object-fit:cover}
.lc-b{flex:1;min-width:0}
.lc-t{display:flex;align-items:center;gap:6px;font-size:15px}
.lc-t b{font-weight:900}
.lc-s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc-f{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px;font-size:12px;color:var(--muted)}
.lc-f b{font-size:14px;color:var(--text)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 12px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h2 .rt{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted)}
.step{width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px;display:grid;place-items:center;font-weight:800;flex:none}
label.f{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 6px}
input[type=text],input[type=tel],input[type=number],input[type=password],select,textarea{
  width:100%;font-family:inherit;font-size:16px;color:var(--text);background:var(--surface2);
  border:1px solid var(--line);border-radius:11px;padding:12px 13px;outline:none}
textarea{min-height:92px;resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus{border-color:var(--brand);background:var(--surface)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.fld{margin-bottom:13px}
.hint{font-size:12px;color:var(--muted);margin-top:5px}
button.btn{font-family:inherit;font-size:15px;font-weight:700;border-radius:11px;border:1px solid var(--line);
  background:var(--surface2);color:var(--text);padding:11px 14px;cursor:pointer}
button.btn:active{transform:translateY(1px)}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
button.go{background:var(--good);border-color:var(--good);color:#fff}
button.ghost{background:transparent}
button.danger{color:var(--danger);border-color:var(--line);background:transparent}
button.btn[disabled]{opacity:.5;cursor:default}
.big{width:100%;padding:15px;font-size:17px;font-weight:800}

.photobox{border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;background:var(--surface2)}
.photobox img{max-width:100%;max-height:230px;border-radius:10px;display:block;margin:0 auto 10px}
.plate-result{margin-top:10px;padding:10px 12px;border-radius:10px;font-weight:700;font-size:14px}
.plate-result.ok{background:var(--good-soft);color:var(--good)}
.plate-result.warn{background:var(--warn-soft);color:var(--warn)}
.plate-input{font-size:22px !important;font-weight:800;text-align:center;letter-spacing:.06em}

.work{display:grid;grid-template-columns:1fr 122px 40px;gap:8px;align-items:center;margin-bottom:8px}
.work input[type=number]{text-align:right}
.work .del{border:0;background:transparent;color:var(--muted);font-size:22px;cursor:pointer;padding:0;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 12px}
.chip{border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:999px;
  padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.chip small{color:var(--muted);font-weight:500;margin-left:3px}
.chip:active{background:var(--brand-soft)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;background:var(--brand-soft);border-radius:11px;margin-top:6px}
.total b{font-size:22px;color:var(--brand);font-weight:900}

.sums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;text-align:center}
.sum span{display:block;font-size:11px;color:var(--muted);font-weight:700}
.sum b{font-size:17px;font-weight:900;letter-spacing:-.02em}

/* 날짜 칸 — 다른 칸과 같은 모양 (예전엔 스타일이 빠져 브라우저 기본 모양이었습니다) */
input[type=date]{width:auto;font-family:inherit;font-size:14px;color:var(--text);background:var(--surface2);
  border:1px solid var(--line);border-radius:11px;padding:0 11px;outline:none;height:43px}
input[type=date]:focus{border-color:var(--brand);background:var(--surface)}
/* 폼 안·두 칸 격자 안의 날짜는 칸을 꽉 채웁니다 */
.fld input[type=date],.row2 input[type=date],.row3 input[type=date],#sheet input[type=date]{width:100%}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tools input[type=text]{flex:1;min-width:150px}
.tools select{width:auto;padding:10px 11px;font-size:14px}
/* 날짜 검색 줄 — 칸·버튼 높이를 43px 로 똑같이 (시안 가) */
.tools > input[type=date],.tools > input[type=text],.tools > select,
.tools > button.btn,.tools > label.chip{height:43px}
.tools > select{padding:0 32px 0 11px;font-size:14px}
.tools > button.btn{padding:0 14px;font-size:14.5px;display:inline-flex;align-items:center;gap:5px}
.tools > input[type=text]{padding:0 13px;font-size:15px}
.tools > label.chip{display:inline-flex;align-items:center;gap:6px;padding:0 13px;margin:0}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);-webkit-overflow-scrolling:touch}
table:not(.cgg-table){border-collapse:separate;border-spacing:0;width:100%;min-width:760px;font-size:14px}
:not(.cgg-table)>*>tr>th,:not(.cgg-table)>*>tr>td{padding:11px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
:not(.cgg-table)>thead th{background:var(--surface2);font-size:12.5px;color:var(--muted);font-weight:800;cursor:pointer;
  user-select:none;position:sticky;top:0;z-index:2}
thead th .ar{opacity:.45;font-size:10px}
thead th.on{color:var(--brand)} thead th.on .ar{opacity:1}
th.c-chk,td.c-chk{position:sticky;left:0;z-index:3;width:46px;text-align:center;padding-left:12px;padding-right:6px}
thead th.c-chk{z-index:4}
th.c-name,td.c-name{position:sticky;z-index:3;font-weight:700;box-shadow:1px 0 0 var(--line)}
thead th.c-name{z-index:4}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
th.num{text-align:right}
.howto{display:grid;gap:10px}
.howto > div{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:start;
  padding:10px 12px;background:var(--surface2);border-radius:10px}
.howto > div > b{font-size:13px;color:var(--text)}
.howto > div > span{font-size:12.5px;color:var(--muted);line-height:1.65}
@media(max-width:700px){ .howto > div{grid-template-columns:1fr;gap:4px} }
th.num .ar{margin-left:2px}
td.mid,th.mid{text-align:center}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--brand);margin:0;cursor:pointer}
:not(.cgg-table)>tbody tr{cursor:pointer}
:not(.cgg-table)>tbody tr:hover td{background:var(--surface2)}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:800}
/* 출고가 늦어지는 차 — 줄 전체 표시 */
tbody tr.lateRow td{background:#fffaf3}
tbody tr.lateRow2 td{background:#fff5f4}
tbody tr.lateRow:hover td{background:#fff3e6}
tbody tr.lateRow2:hover td{background:#ffecea}
tbody tr.lateRow td.c-chk{box-shadow:inset 4px 0 0 var(--warn),1px 0 0 var(--line)}
tbody tr.lateRow2 td.c-chk{box-shadow:inset 4px 0 0 var(--danger),1px 0 0 var(--line)}
.lateMark{display:inline-flex;align-items:center;justify-content:center;width:21px;height:21px;border-radius:7px;
  background:var(--warn);color:#fff;font-size:12px;font-weight:900;margin-right:5px;vertical-align:-4px;flex:0 0 auto}
tr.lateRow2 .lateMark,.lateMark.r2{background:var(--danger)}
.tag.dly{background:var(--warn);color:#fff}
/* 홈 화면 — 출고가 늦어지는 차 */
.lateBox{margin:0 0 12px}
.lateBox .lt{display:flex;align-items:center;gap:7px;font-weight:900;font-size:14px;margin:0 0 8px;color:var(--text)}
.lateBox .lt .n{background:var(--danger);color:#fff;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:800}
.lateBox .lt .n.w{background:var(--warn)}
.lateItem{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:10px;margin-bottom:6px;
  background:#fffaf3;border:1px solid #f0ddc6;border-left:4px solid var(--warn);cursor:pointer;
  font-family:inherit;text-align:left;width:100%}
.lateItem.r{background:#fff5f4;border-color:#f3d2cf;border-left-color:var(--danger)}
.lateItem:last-of-type{margin-bottom:0}
.lateItem:hover{filter:brightness(.985)}
.lateItem .l{flex:1;min-width:0}
.lateItem .pl{display:block;font-weight:800;font-size:14px;color:var(--text)}
.lateItem small{display:block;color:var(--muted);font-size:12px;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 입출금 기록 — 손 갈 일 카드 */
.mnTodo{margin:0 0 12px;padding:13px 14px;border-radius:12px;background:#fff5f4;border:1px solid #f3d2cf}
.mnTodo .lt{display:flex;align-items:center;gap:7px;font-weight:900;font-size:14px;margin:0 0 9px;color:var(--text)}
.mnTodo .lt .n{background:var(--danger);color:#fff;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:800}
.mnItem{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:10px;margin-bottom:6px;
  background:#fff;border:1px solid var(--line);border-left:4px solid var(--danger);cursor:pointer;
  font-family:inherit;text-align:left;width:100%}
.mnItem:last-of-type{margin-bottom:0}
.mnItem:hover{background:var(--surface2)}
.mnItem .l{flex:1;min-width:0}
.mnItem .pl{display:block;font-weight:800;font-size:14.5px;color:var(--good)}
.mnItem small{display:block;color:var(--muted);font-size:12px;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mnItem .go{flex:0 0 auto;font-size:12.5px;font-weight:800;color:var(--brand);
  background:var(--brand-soft);border-radius:8px;padding:6px 10px}
.mnOk{display:flex;align-items:center;gap:8px;margin:0 0 12px;padding:11px 13px;border-radius:12px;
  background:var(--good-soft);border:1px solid var(--line);font-weight:800;font-size:13.5px;color:var(--text)}
.lateMark.ok{background:var(--good)}
.sum.clickable{cursor:pointer}
.sum.clickable:hover{background:var(--surface2)}
.tag.dly2{background:var(--danger);color:#fff}
.tag .dly-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#fff;margin-right:5px;vertical-align:1px}
.tag.in{background:var(--brand-soft);color:var(--brand)}
.tag.out{background:var(--warn-soft);color:var(--warn)}
.tag.paid{background:var(--good-soft);color:var(--good)}
.empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:14px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--muted)}
.pager button{padding:8px 13px;font-size:14px}

.clist{display:grid;gap:9px}
.cx{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;box-shadow:var(--shadow)}
.cx:active{background:var(--surface2)}
.cx .p{font-size:19px;font-weight:900;letter-spacing:.02em}
.cx .m{font-size:13px;color:var(--muted);margin-top:2px}
.cx .a{float:right;font-weight:900;color:var(--brand);font-size:16px}

.banner{border-radius:11px;padding:11px 13px;font-size:13.5px;font-weight:600;margin-bottom:12px;display:none}
.banner.warn{background:var(--warn-soft);color:var(--warn);display:block}
.askbg{position:fixed;inset:0;background:rgba(10,18,28,.6);z-index:90;display:none}
.askbg.show{display:block}
.askbox{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:91;display:none;
  background:var(--surface);border-radius:16px;padding:20px 18px;width:min(420px,90vw);
  box-shadow:0 10px 40px rgba(0,0,0,.35);max-height:80vh;overflow:auto}
.askbox.show{display:block}
.askbox .msg{font-size:15.5px;font-weight:600;white-space:pre-wrap;margin-bottom:16px;line-height:1.6}
.askbox .row{display:flex;gap:8px}
.askbox .row .btn{flex:1;padding:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));
  background:#14202e;color:#fff;padding:13px 20px;border-radius:12px;font-weight:700;font-size:15px;z-index:100;
  box-shadow:0 6px 22px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
.toast.show{opacity:1}
.toast.bad{background:var(--danger)}

.sheetbg{position:fixed;inset:0;background:rgba(10,18,28,.55);z-index:80;display:none}
.sheetbg.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:81;background:var(--surface);border-radius:18px 18px 0 0;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;display:none;
  box-shadow:0 -6px 24px rgba(0,0,0,.2)}
.sheet.show{display:block}
@media (min-width:900px){.sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);
  width:560px;border-radius:16px;max-height:84vh}}
.sheet h3{margin:0 0 4px;font-size:19px;font-weight:900}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv span{color:var(--muted);font-weight:700}
/* 직원 목록 한 줄 — 좁은 화면에서는 두 줄로 깔끔하게 내려갑니다 */
.stRow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:11px 0}
.stL{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;flex:1 1 260px;min-width:0}
.stR{display:flex;flex-wrap:nowrap;align-items:center;gap:8px;flex:0 0 auto}
.stR .btn{padding:7px 12px;font-size:13px;white-space:nowrap;min-height:0}
.stCk{width:20px;height:20px;flex:0 0 auto;margin:0}
.stNm{color:var(--text);font-weight:700;white-space:nowrap}
.stNm small{color:var(--muted);font-weight:600;margin-left:4px}
.stPh{color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap;
  font-variant-numeric:tabular-nums;letter-spacing:.2px}
.stLg{font-size:12.5px;font-weight:700;white-space:nowrap}
@media(max-width:700px){
  .stRow{align-items:flex-start}
  .stL{flex:1 1 100%}
  .stR{flex:1 1 100%;justify-content:flex-end}
}
.sheet img.photo{width:100%;border-radius:12px;margin:12px 0}
.sheetbtns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.sheetbtns .btn{flex:1;min-width:110px}

/* 로그인 */
.auth{max-width:380px;margin:0 auto;padding:40px 16px}
.auth .card{padding:22px}
.auth .logo{width:52px;height:52px;font-size:18px;border-radius:15px;margin:0 auto 12px}
.auth h1{text-align:center;font-size:22px;margin-bottom:4px}
.auth .sub{text-align:center;margin-bottom:20px}
.codein{font-size:26px !important;text-align:center;letter-spacing:.5em;font-weight:900;padding-left:.5em !important;
  -webkit-text-security:disc;text-security:disc}
.peoplelist{display:grid;gap:8px;margin-bottom:14px}
.spotpin{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;
  color:#5B2E9B;background:#F1E9FA;border:1px solid #E1D3F5;padding:2px 8px;border-radius:6px}
.person{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface2);
  border-radius:11px;padding:11px 13px;cursor:pointer;font-family:inherit;font-size:15px;font-weight:700;width:100%;text-align:left;color:var(--text)}
.person[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.person .r{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--muted)}
.lock{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:12.5px;font-weight:600;margin-top:14px}
.center{text-align:center}
.mono{font-variant-numeric:tabular-nums}
.pcgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:820px){.pcgrid{grid-template-columns:1fr} .sums{grid-template-columns:1fr 1fr} .row3{grid-template-columns:1fr}}
@media (max-width:420px){.row2{grid-template-columns:1fr}}

/* ── 좁은 화면(폰)에서 줄이 흐트러지지 않게 고르게 맞춥니다 ─────────── */
@media (max-width:759px){
  /* 화면 제목 */
  .dashhead{margin:0 0 10px}
  .dashhead h2{font-size:19px;letter-spacing:-.025em}
  .dashhead .sub2{font-size:12px;line-height:1.35;margin-top:3px}
  /* 카드 제목 — 설명은 아랫줄로 내립니다 */
  .card h2{flex-wrap:wrap;gap:4px 8px;font-size:14.5px;margin:0 0 10px}
  .card h2 .rt{margin-left:0;flex:1 1 100%;font-size:11.5px;line-height:1.35}
  /* 숫자 칸 — 두 칸씩 고르게, 글자는 한 줄로 */
  .sums{grid-template-columns:1fr 1fr !important;gap:8px;margin-bottom:12px}
  .sum{padding:10px 8px}
  .sum span{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sum b{font-size:16px}
  /* 날짜 칸 — 두 칸 나란히 */
  .row2.drow{grid-template-columns:1fr 1fr !important;gap:8px}
  input[type="date"]{font-size:13px;padding:0 8px;min-width:0;height:42px}
  /* 빠른 날짜 버튼 — 세 칸 격자 */
  .datebar{gap:6px;flex-wrap:nowrap}
  .datebar button{flex:1 1 0;min-width:0;padding:10px 2px;font-size:12.5px;white-space:nowrap}
  /* 날짜 도구 한 줄 (출고 기록·청구서 등) */
  .dtools{display:flex;flex-wrap:wrap;gap:7px;margin:0}
  .dtools > .btn{flex:1 1 calc(33.333% - 5px);min-width:0;padding:0 4px;font-size:13px;height:42px}
  .dtools > input[type="date"]{flex:1 1 calc(50% - 4px);width:auto !important;min-width:0;height:42px}
  .tools > input[type=date],.tools > input[type=text],.tools > select,
  .tools > button.btn,.tools > label.chip{height:42px}
  .datebar button{height:42px}
  .dtools > .dtil{display:none}
  .dtools > .btn.primary{flex:1 1 100%}
}
.helpbody ul,.helpbody ol{margin:6px 0;padding-left:22px}.helpbody li{margin:3px 0}
.helpbody .hl{background:var(--warn-soft);color:var(--text);padding:8px 12px;border-radius:9px;margin:8px 0 0}

/* ===== 요금제 띠 (본문 맨 위 · 메뉴 칸 밖) ===== */
#planStrip{min-width:0}
/* 가로메뉴·현장 화면 — 머리말(탭줄) 바로 밑에 이어 붙는 흰 띠.
   머리말의 아래 여백을 없애고 띠가 그 자리를 이어받습니다 (배치마다 여백 값이 달라서 음수 여백을 쓰지 않습니다) */
.wrap:not(.side).hasplan > header{margin-bottom:0}
.wrap:not(.side) #planStrip{background:var(--surface);border-bottom:1px solid var(--line);
  margin:0 -14px 18px;padding:9px 14px}
@media (min-width:1000px){
  /* 현장 화면 미리보기(폰 모양 틀) — 좌우 여백이 16px 입니다 */
  .wrap.fieldview #planStrip{margin:0 -16px 16px;padding:9px 16px}
  /* 세로메뉴 — 본문 칸 맨 위에 꽉 차게 붙는 흰 띠 */
  .wrap.side:not(.iconmenu) #planStrip{background:var(--surface);border-bottom:1px solid var(--line);
    margin:-18px -24px 16px;padding:11px 24px;border-radius:0}
  /* 아이콘메뉴 — 위쪽 흰 띠(상호 줄) 바로 밑에 이어 붙습니다 */
  .wrap.iconmenu #planStrip{background:var(--surface);border-bottom:1px solid var(--line);
    margin:-16px -24px 16px;padding:10px 24px;border-radius:0}
}
/* 장부 점검 줄 */
.lcRow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);
  border-radius:11px;margin-bottom:7px;cursor:pointer;background:var(--surface)}
.lcRow:hover{border-color:var(--brand);background:var(--brand-soft)}
.lcN{flex:0 0 auto;min-width:38px;height:38px;border-radius:10px;display:inline-flex;
  align-items:center;justify-content:center;font-weight:900;font-size:16px;padding:0 8px}
.lcN.bad{background:var(--danger-soft);color:var(--danger)}
.lcN.warn{background:var(--warn-soft);color:var(--warn)}
.lcT{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lcT b{font-size:14px;font-weight:800}
.lcT i{font-style:normal;font-size:12.5px;color:var(--muted)}
.lcGo{flex:0 0 auto;font-size:12.5px;font-weight:700;color:var(--brand)}
@media(max-width:560px){ .lcGo{display:none} }

/* 도움말 안의 작은 표 (권한 비교) */
.htb{width:100%;border-collapse:collapse;margin:10px 0 12px;font-size:13px}
.htb th,.htb td{border:1px solid var(--line);padding:7px 9px;text-align:center}
.htb th{background:var(--surface2);font-weight:800;font-size:12.5px}
.htb td:first-child,.htb th:first-child{text-align:left}
.htb td.x{color:var(--muted)}
.htb tr:nth-child(even) td{background:var(--surface2)}

.pl-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0}
.pl-lead{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.02em;margin-right:2px;flex:0 0 auto}
.pl-chip{display:inline-flex;align-items:baseline;gap:6px;background:var(--surface2);
  border:1px solid var(--line);border-radius:999px;padding:5px 11px;white-space:nowrap;max-width:100%}
.pl-chip .k{font-size:11px;color:var(--muted)}
.pl-chip .v{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.pl-chip.warn{background:var(--warn-soft);border-color:transparent}
.pl-chip.warn .v{color:var(--warn)}
.pl-chip.bad{background:var(--danger-soft);border-color:transparent}
.pl-chip.bad .v{color:var(--danger)}
.pl-sp{flex:1 1 0;min-width:0}
.pl-more{font:inherit;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.pl-more:hover{background:var(--surface2)}
.pl-badge{font:inherit;display:inline-flex;align-items:center;gap:8px;max-width:100%;
  background:var(--brand);color:#fff;border:0;border-radius:999px;padding:6px 14px;cursor:pointer;
  font-size:13px;font-weight:800;line-height:1.55;white-space:nowrap}
.pl-badge .d{font-weight:600;opacity:.86;font-variant-numeric:tabular-nums}
.pl-badge .ar{font-style:normal;font-size:11px;opacity:.85}
.pl-badge.warn{background:var(--warn)}
.pl-badge.bad{background:var(--danger)}
.pl-go{font:inherit;font-size:12.5px;font-weight:700;border:0;border-radius:9px;padding:7px 13px;
  background:var(--brand);color:#fff;cursor:pointer;white-space:nowrap}
.pl-go.warn{background:var(--warn)} .pl-go.bad{background:var(--danger)}
.pl-band{display:flex;align-items:center;gap:10px;margin-top:7px;padding:10px 12px;border-radius:11px;
  background:var(--warn-soft);color:var(--warn)}
.pl-band.bad{background:var(--danger-soft);color:var(--danger)}
.pl-band .ic{width:20px;height:20px;flex:0 0 auto;border-radius:50%;background:var(--warn);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.pl-band.bad .ic{background:var(--danger)}
.pl-band .tx{flex:1;min-width:0;font-size:13px;line-height:1.45}
.pl-band .tx b{display:block;font-weight:800}
.pl-band .tx small{font-size:11.8px;opacity:.88}
@media(max-width:820px){
  .pl-band{flex-wrap:wrap}
  .pl-band .tx{flex:1 1 100%}
  .pl-band .pl-go{width:100%}
}
/* 좁은 자리(현장 화면·폰) — 한 줄에 모두 들어가도록 글씨를 줄입니다 */
#planStrip.pl-nar .pl-row{flex-wrap:nowrap;gap:4px}
#planStrip.pl-nar .pl-lead{font-size:10.5px;margin:0;white-space:nowrap}
#planStrip.pl-nar .pl-chip{padding:3px 7px;gap:3px;flex:0 1 auto;min-width:0;overflow:hidden}
#planStrip.pl-nar .pl-chip .k{font-size:9.5px}
#planStrip.pl-nar .pl-chip .v{font-size:11px;overflow:hidden;text-overflow:ellipsis}
#planStrip.pl-nar .pl-sp{display:none}
#planStrip.pl-nar .pl-more{padding:3px 8px;font-size:11px}
#planStrip.pl-xs .pl-lead{font-size:10px}
#planStrip.pl-xs .pl-chip{padding:2px 6px}
#planStrip.pl-xs .pl-chip .k{font-size:9px}
#planStrip.pl-xs .pl-chip .v{font-size:10.5px}
/* 좁은 자리에서 「자세히」를 펼쳤을 때 — 칸을 눕혀서 높이를 줄입니다 */
#planStrip.pl-nar .pmBox{padding:12px 13px;margin-top:8px;border-radius:12px}
#planStrip.pl-nar .pmTop{gap:9px}
#planStrip.pl-nar .pmName{font-size:16.5px;gap:6px}
#planStrip.pl-nar .pmTag{font-size:10px;padding:3px 8px}
#planStrip.pl-nar .pmSub{font-size:11.5px;margin-top:2px}
#planStrip.pl-nar .pmTop .mini,#planStrip.pl-nar .pmTop .pl-go{font-size:11.5px;padding:6px 10px}
#planStrip.pl-nar .pmCells{grid-template-columns:1fr;gap:7px;margin-top:11px}
#planStrip.pl-nar .pmCell{display:grid;grid-template-columns:1fr auto;column-gap:8px;
  align-items:baseline;padding:9px 11px;border-radius:10px}
#planStrip.pl-nar .pmCell .t{font-size:11.5px}
#planStrip.pl-nar .pmCell .v{font-size:19px;line-height:1.15;margin:0;text-align:right;white-space:nowrap}
#planStrip.pl-nar .pmCell .v small{font-size:11px;margin-left:3px;white-space:nowrap}
#planStrip.pl-nar .pmCell .s{grid-column:1/-1;font-size:11px;margin-top:2px}
#planStrip.pl-nar .pmCell .pmBar{grid-column:1/-1;height:5px;margin-top:7px}
#planStrip.pl-nar .pmCell .nt{grid-column:1/-1;font-size:11px;margin-top:5px}
#planStrip.pl-nar .pmFoot{flex-direction:column;align-items:flex-start;gap:3px;
  font-size:11px;margin-top:11px;padding-top:10px}
/* 좁은 화면에서 쉽게 찾는 「접기」 버튼 — 펼친 상자 맨 아래에 가로로 꽉 차게 */
.pl-close{display:none}
#planStrip.pl-nar .pl-close{display:block;width:100%;margin-top:11px;font:inherit;font-size:13px;
  font-weight:700;color:var(--brand);background:var(--brand-soft);border:1px solid #C6E0F8;
  border-radius:10px;padding:10px 0;cursor:pointer}
#planStrip.pl-nar .pl-more{background:var(--brand-soft);border-color:#C6E0F8;color:var(--brand);
  font-size:12px;font-weight:800;padding:4px 9px}
/* ===== 설정 → 내 요금제 ===== */
.pmBox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.pmTop{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.pmName{margin:0;font-size:20px;font-weight:800;letter-spacing:-.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pmTag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand)}
.pmTag.warn{background:var(--warn-soft);color:var(--warn)}
.pmTag.bad{background:var(--danger-soft);color:var(--danger)}
.pmSub{font-size:13px;color:var(--muted);margin-top:3px}
.pmCells{display:grid;gap:11px;margin-top:16px;grid-template-columns:1.2fr 1fr 1fr}
@media(max-width:760px){.pmCells{grid-template-columns:1fr}}
.pmCell{background:var(--surface2);border-radius:12px;padding:13px 15px;min-width:0}
.pmCell .t{font-size:12px;font-weight:700;color:var(--muted)}
.pmCell .v{font-size:25px;font-weight:800;letter-spacing:-.9px;margin-top:2px;line-height:1.25;font-variant-numeric:tabular-nums}
.pmCell .v small{font-size:13px;font-weight:600;color:var(--muted);margin-left:4px;letter-spacing:0}
.pmCell .s{font-size:12px;color:var(--muted);margin-top:3px}
.pmBar{height:7px;border-radius:999px;background:var(--line);margin-top:10px;overflow:hidden}
.pmBar i{display:block;height:100%;border-radius:999px;background:var(--brand)}
.pmCell.warn .v{color:var(--warn)}.pmCell.warn .pmBar i{background:var(--warn)}
.pmCell.bad .v{color:var(--danger)}.pmCell.bad .pmBar i{background:var(--danger)}
.pmCell .nt{margin-top:8px;font-size:12px;font-weight:700}
.pmCell.warn .nt{color:var(--warn)}.pmCell.bad .nt{color:var(--danger)}
.pmFoot{margin-top:15px;padding-top:13px;border-top:1px solid var(--line);display:flex;
  justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}

/* 청구서 — 계산서 끊음 여부 딱지
   «세금계산서 끊음» 과 «세금계산서 안 끊음» 의 칸 너비를 같게 맞춥니다 */
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 10px;
  border-radius:999px;white-space:nowrap;line-height:1.7;text-align:center;
  min-width:86px;font-variant-numeric:tabular-nums}
.pill.ok{background:var(--good-soft,#e2f5ec);color:var(--good);
  text-align:justify;text-align-last:justify;text-justify:inter-character}
.pill.no{background:var(--danger-soft,#fdeceb);color:var(--danger)}

/* ===== 도움말 (새 구조) ===== */
.hpTop{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.hpHd{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.hpHd h2{margin:0;font-size:23px;font-weight:800;letter-spacing:-.8px}
.hpHd p{margin:3px 0 0;font-size:13.5px;color:var(--muted)}
.hpBtns{display:flex;gap:7px;flex-wrap:wrap}
.hpSbox{position:relative;margin-top:14px}
.hpSin{display:flex;align-items:center;gap:10px;background:var(--surface2);
  border:1.5px solid var(--line);border-radius:12px;padding:0 13px;transition:border-color .12s}
.hpSbox.on .hpSin{border-color:var(--brand);background:var(--surface)}
.hpSin .mg{font-size:16px;color:var(--muted);flex:0 0 auto}
.hpSin input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:inherit;
  font:inherit;font-size:16px;padding:13px 0}
.hpSin .clr{border:0;background:var(--line);color:var(--muted);font:inherit;font-size:12.5px;
  font-weight:700;border-radius:999px;padding:5px 11px;cursor:pointer}
.hpSug{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:60;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 32px rgba(16,32,52,.18);
  overflow:hidden;max-height:min(56vh,430px);overflow-y:auto}
.hpSug .gp{font-size:10.5px;font-weight:800;letter-spacing:.09em;color:var(--muted);padding:10px 14px 4px}
.hpSug > button{display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;
  font:inherit;padding:10px 14px;cursor:pointer;border-top:1px solid var(--line)}
.hpSug .gp + button{border-top:0}
.hpSug > button:hover,.hpSug > button.cur{background:var(--brand-soft)}
.hpSug .tt{display:block;font-size:14.5px;font-weight:700}
.hpSug .ss{display:block;font-size:12.5px;color:var(--muted);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hpSug .none{padding:15px 14px;font-size:14px;color:var(--muted)}
.hpSug .wds{display:flex;flex-wrap:wrap;gap:6px;padding:9px 14px 13px;border-top:1px solid var(--line)}
.hpSug .wds button{border:1px solid var(--line);background:var(--surface2);border-radius:999px;
  padding:5px 11px;font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;width:auto}
.hpSug .wds button:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.hpSug mark, .hpBody mark{background:var(--warn-soft);color:var(--warn);border-radius:3px;padding:0 2px}
.hpQuick{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px;align-items:center}
.hpQuick > span{font-size:12.5px;color:var(--muted);font-weight:700;margin-right:3px}
.hpQuick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:6px 13px;font:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.hpQuick button:hover{border-color:var(--brand);color:var(--brand)}
.hpCats{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.hpCat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:16px 18px;text-align:left;font:inherit;color:inherit;cursor:pointer;
  transition:border-color .12s,transform .12s}
.hpCat:hover{border-color:var(--brand);transform:translateY(-2px)}
.hpCat .n{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:8px;
  background:var(--brand-soft);color:var(--brand);font-size:13px;font-weight:800;margin-bottom:8px}
.hpCat b{display:block;font-size:16px;font-weight:800;letter-spacing:-.3px}
.hpCat i{display:block;font-style:normal;font-size:12.8px;color:var(--muted);margin-top:2px}
.hpCat em{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:8px;font-weight:700;opacity:.75}
.hpBack2{border:0;background:transparent;font:inherit;font-size:14px;font-weight:700;color:var(--brand);
  cursor:pointer;padding:0;margin-bottom:10px}
.hpH3{margin:0 0 2px;font-size:19px;font-weight:800;letter-spacing:-.5px}
.hpCnt{margin:0 0 12px;font-size:12.5px;color:var(--muted)}
.hpSecs{display:flex;flex-direction:column;gap:8px}
.hpSec{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.hpSec > button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;
  background:transparent;color:inherit;font:inherit;padding:13px 15px;cursor:pointer}
.hpSec > button:hover{background:var(--surface2)}
.hpSec .ar{color:var(--muted);font-size:11px;transition:transform .15s;flex:0 0 auto}
.hpSec.open .ar{transform:rotate(90deg)}
.hpSec .tt{flex:1;min-width:0}
.hpSec .tt b{display:block;font-size:15.5px;font-weight:700}
.hpSec .tt i{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:1px}
.hpSec .hpBody{padding:0 15px 15px;font-size:14.3px;line-height:1.8}
.hpTag{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--surface2);
  color:var(--muted);flex:0 0 auto}
.hpTag.pc{background:var(--brand-soft);color:var(--brand)}
.hpTag.ad{background:var(--warn-soft);color:var(--warn)}
@media(max-width:700px){
  .hpTop{padding:15px 15px}
  .hpHd h2{font-size:21px}
  .hpBtns{width:100%}
  .hpBtns .btn{flex:1}
}

/* ── QR 코드 화면 ── */
.qrWrap{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.qrPaper{background:#fff;border:1px solid #d8e3ed;border-radius:14px;padding:22px 20px 18px;
         text-align:center;flex:0 0 320px;max-width:100%}
.qrBrand{font-size:26px;font-weight:900;color:#1668C4;letter-spacing:-1px}
.qrShop{margin-top:4px;font-size:18px;font-weight:800;color:#0F2C4C}
.qrImg{margin:14px auto 0;width:210px;max-width:100%;border:2px solid #0F2C4C;border-radius:10px;padding:9px;background:#fff}
.qrImg svg{display:block;width:100%;height:auto}
.qrUrl{margin-top:12px;font-size:17px;font-weight:800;color:#1668C4}
.qrSteps{counter-reset:qs;margin:14px 0 0;padding:0 0 0 4px;list-style:none;text-align:left;font-size:13.5px;color:#24435F;line-height:1.9}
.qrSteps li{counter-increment:qs}
.qrSteps li::before{content:counter(qs) ". ";font-weight:800;color:#1668C4}
.qrFoot{margin-top:14px;font-size:11.5px;color:#8b9aa8}
.qrSide{flex:1 1 260px;min-width:0}
@media (max-width:640px){.qrPaper{flex:1 1 100%}.qrImg{width:190px}}
@media print{
  body *{visibility:hidden!important}
  #qrPaper,#qrPaper *{visibility:visible!important}
  #qrPaper{position:absolute!important;left:0;top:0;width:100%;border:0;padding:0}
  #qrPaper .qrImg{width:74mm}
}
/* ── 팝빌 준비 3단계 ── */
.pbSteps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:760px){.pbSteps{grid-template-columns:1fr}}
.pbStep{border:1.5px solid var(--line);border-radius:11px;padding:13px 14px;background:var(--surface2)}
.pbStep.ok{border-color:var(--good);background:var(--good-soft)}
.pbStep .n{font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
.pbStep.ok .n{color:var(--good)}
.pbStep .t{font-size:15px;font-weight:800;margin:3px 0 5px}
.pbStep .d{font-size:12.5px;color:var(--text2,#41607C);line-height:1.6}
/* ── 받을 금액 · 입금 확인 ── */
.pill.paid{background:var(--good-soft);color:var(--good)}
#dueBox .card{margin-bottom:14px}
.dueSum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 12px}
@media(max-width:620px){.dueSum{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dueSum .s{background:var(--surface2);border-radius:10px;padding:10px 12px}
.dueSum .s span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.dueSum .s b{display:block;font-size:18px;font-weight:800;margin-top:2px}
.dueT{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.dueT th,.dueT td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.dueT th{background:var(--surface2);font-size:12.5px;color:var(--muted);font-weight:700;cursor:pointer}
.dueT td.num,.dueT th.num{text-align:right}
.dueT tr:last-child td{border-bottom:0}
.dueT .stick{position:sticky;left:0;background:var(--surface);box-shadow:1px 0 0 var(--line)}
.dueT th.stick{background:var(--surface2)}
.dueWrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.dueAmt{text-align:center;background:var(--brand-soft);color:var(--brand);border-radius:12px;
  padding:16px 12px;font-size:30px;font-weight:900;letter-spacing:-.5px;margin-top:4px}
.dueWarn{margin-top:11px;padding:10px 12px;border-radius:9px;font-size:13px;
  background:var(--warn-soft);color:var(--warn);font-weight:700}

.pbGuide{margin-top:10px;display:flex;flex-direction:column;gap:7px;font-size:13px;line-height:1.65}
.pbGuide > div{padding-left:2px}
.pbCode{display:inline-block;background:var(--line-soft,#eef2f7);border:1px solid var(--line,#d7dee8);
  border-radius:7px;padding:2px 9px;font-family:Consolas,monospace;font-weight:800;letter-spacing:.4px}
.dupList{margin-top:12px;display:flex;flex-direction:column;gap:9px;max-height:300px;overflow:auto}
.dupRow{border:1.5px solid var(--warn);background:var(--warn-soft);border-radius:10px;padding:10px 12px}
.dupTop{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:14px}
.dupAmt{margin-left:auto;font-weight:800}
.dupMemo{font-size:12px;color:var(--muted);margin-top:4px;word-break:break-all}
.dupPrev{font-size:12px;color:var(--muted);margin-top:2px}

/* ===== 차곳간체크에서 더한 것 ===== */
.phead{margin:0 0 16px}
.phead h2{font-size:21px;font-weight:900;margin:0 0 4px;letter-spacing:-.02em;text-wrap:balance}
.phead p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.6}
.card h3{font-size:15px;margin:0 0 4px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .rt{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted)}
.csub{margin:0 0 12px;color:var(--muted);font-size:12.5px;line-height:1.6}
.note{margin:10px 0 0;color:var(--muted);font-size:12px;line-height:1.6}
.sums.c3{grid-template-columns:repeat(3,1fr)}
.sums.c5{grid-template-columns:repeat(5,1fr)}
@media(max-width:560px){.sums,.sums.c3,.sums.c5{grid-template-columns:repeat(2,1fr)}}
.pager{display:flex;gap:6px;align-items:center;justify-content:center;padding:11px 0;flex-wrap:wrap}
.pager button.btn{padding:7px 11px;font-size:13px;min-width:40px}
.pager .pg{font-size:12.5px;color:var(--muted);padding:0 6px}
.demo{display:flex;align-items:center;gap:8px;background:var(--warn-soft);color:var(--warn);
  border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin:0 0 14px;font-size:13px;font-weight:700}
/* 홈 — 달력 */
.homegrid{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;align-items:start}
.homegrid .wide{grid-column:1/-1}
@media(max-width:820px){.homegrid{grid-template-columns:1fr}}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.dow span{text-align:center;font-size:12px;font-weight:800;color:var(--muted)}
.dow .sun{color:var(--danger)} .dow .sat{color:var(--brand)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .d{min-height:84px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);
  padding:7px 8px;font-size:12px;display:flex;flex-direction:column;gap:2px}
.cal .d.out{opacity:.35;background:transparent;border-color:transparent}
.cal .d.today{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft) inset;background:var(--surface)}
.cal .d .dn{font-size:12.5px;font-weight:800;color:var(--muted)}
.cal .d .dn.sun{color:var(--danger)} .cal .d .dn.sat{color:var(--brand)}
.cal .d .amt{font-size:14px;font-weight:900;letter-spacing:-.02em;margin-top:3px}
.cal .d .bar{display:flex;gap:2px;height:5px;margin:4px 0 3px}
.cal .d .bar i{display:block;height:100%;border-radius:999px}
.cal .d .bar i.f{background:var(--brand)} .cal .d .bar i.r{background:var(--good)} .cal .d .bar i.s{background:var(--accent)}
.cal .d .leg{display:flex;gap:7px;flex-wrap:wrap;font-size:10.5px;font-weight:800;line-height:1.3}
.cal .d .leg .f{color:var(--brand)} .cal .d .leg .r{color:var(--good)} .cal .d .leg .s{color:var(--accent)}
.cal .d .memo{font-style:normal;font-size:10.5px;color:var(--muted);margin-top:auto}
.callegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 0}
.callegend span{display:inline-flex;align-items:center;gap:5px}
.callegend i{display:block;width:12px;height:5px;border-radius:999px}
.callegend i.f{background:var(--brand)} .callegend i.r{background:var(--good)} .callegend i.s{background:var(--accent)}
/* 홈 — 오늘 할 일 */
.todo{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font-family:inherit;cursor:pointer;
  background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:7px}
.todo:hover{background:var(--brand-soft)}
.todo .n{flex:0 0 auto;width:26px;height:26px;border-radius:9px;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-weight:900;font-size:13px}
.todo .n.w{background:var(--warn)} .todo .n.r{background:var(--danger)}
.todo .l{flex:1;min-width:0}
.todo .l b{display:block;font-size:13.5px;font-weight:800}
.todo .l small{display:block;color:var(--muted);font-size:11.5px}
.todo .go{color:var(--muted);font-size:17px}
/* 홈 — 4단계 */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:620px){.steps{grid-template-columns:repeat(2,1fr)}}
.stp{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--surface2)}
.stp .n{font-size:11px;font-weight:800;color:var(--muted)}
.stp b{display:block;font-size:14px;font-weight:800;margin:2px 0 4px}
.stp .bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.stp .bar i{display:block;height:100%;background:var(--brand)}
.stp.done .bar i{background:var(--good)}
.stp small{display:block;color:var(--muted);font-size:11.5px;margin-top:5px}
/* 진행 막대 */
.prog{height:9px;border-radius:999px;background:var(--line);overflow:hidden;margin:8px 0 6px}
.prog i{display:block;height:100%;background:var(--good)}
.tmpl{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:12px 13px;
  font-size:13px;line-height:1.75;white-space:pre-wrap;color:var(--text)}
.tmpl b{color:var(--brand)}
#subTabs,.subtabbar{display:flex;gap:5px;background:var(--surface2);padding:4px;border-radius:12px;
  overflow-x:auto;margin:0 0 14px}
#subTabs button,.subtabbar button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);font-family:inherit;
  font-size:13.5px;font-weight:800;padding:9px 14px;border-radius:9px;cursor:pointer;white-space:nowrap}
#subTabs button[aria-selected="true"],.subtabbar button[aria-selected="true"]{background:var(--surface);color:var(--brand);box-shadow:var(--shadow)}
header .logo{font-size:13px;font-weight:900;letter-spacing:-.02em}
.ckbar{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);
  border-left:4px solid var(--good);border-radius:12px;padding:13px 15px;margin:0 0 14px;box-shadow:var(--shadow)}
.ckbar .l{flex:1;min-width:0}
.ckbar b{display:block;font-size:13.5px;font-weight:800}
.ckbar small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.ckbar .r{flex:0 0 auto;font-size:12.5px;font-weight:800;color:var(--good)}
.ckbar.warn{border-left-color:var(--warn)} .ckbar.warn .r{color:var(--warn)}
.sendgrid{display:grid;grid-template-columns:minmax(0,1fr) 352px;gap:20px;align-items:start}
@media(max-width:900px){.sendgrid{grid-template-columns:1fr}}
.tokchips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.tokchips button{font-family:inherit;font-size:12.5px;font-weight:700;border:1px solid var(--line);
  background:var(--surface2);color:var(--brand);border-radius:999px;padding:6px 11px;cursor:pointer}

     count 가 0이면 초록 띠에 o.empty(없으면 «지금 처리할 일이 없어요»), 단추 없음. 글은 한 줄 */
  function todoBand(el, o){ if(!el) return; o=o||{}; var n=o.count==null?1:(Number(o.count)||0), t=n?(["chk","stop","run"].indexOf(o.tone)>=0?o.tone:"chk"):"done";

  /* 달력식 달 고르기 — 선택 상자 대신 (SKILL.md 5. 날짜 · 달 고르기 · 워시 시안 v132 모양)
     el 은 빈 칸. o = {y:2026, m:10, min:"2024-01", max:"2026-12", today:{y,m}(없으면 오늘), onPick:function(y,m){}}
     단추 «2026년 10월 ▾»를 누르면 가운데 창(form)에 «‹ 2025 | 2026년 | 2027 ›» + 4×3 달 칸. 고른 달 = 파랑 채움, 오늘 달 = 파란 테두리 */
  function monthPick(el, o){ if(!el) return {}; o=o||{}; var now=new Date(), y=Number(o.y)||now.getFullYear(), m=Number(o.m)||now.getMonth()+1;
    var ty=o.today?Number(o.today.y):now.getFullYear(), tm=o.today?Number(o.today.m):now.getMonth()+1;
    function key(a,b){ return a*100+b; } function lim(s2){ if(!s2) return null; var p=String(s2).split("-"); return key(Number(p[0]),Number(p[1])); }

    function body(vy){ var h='<div class="cgg-myr"><button type="button" class="cgg-btn sm" data-y="-1"'+(lo&&key(vy-1,12)<lo?' disabled':'')+'>‹ '+(vy-1)+'</button><b>'+vy+'년</b><button type="button" class="cgg-btn sm" data-y="1"'+(hi&&key(vy+1,1)>hi?' disabled':'')+'>'+(vy+1)+' ›</button></div><div class="cgg-mgrid">';
      for(var i=1;i<=12;i++){ var k=key(vy,i), off=(lo&&k<lo)||(hi&&k>hi); h+='<button type="button" data-m="'+i+'" aria-pressed="'+(vy===y&&i===m)+'"'+(vy===ty&&i===tm?' class="now"':'')+(off?' disabled':'')+'>'+i+'월</button>'; }
      return h+'</div>'; }
    btn.onclick=function(){ var vy=y;
      dialog({size:"form", title:"달 고르기", desc:"볼 달을 눌러요. 오늘이 있는 달은 파란 테두리예요.", body:'<div class="cgg-mpbox"></div>'});
      var box=document.querySelector(".cgg-dialog .cgg-mpbox"); if(!box) return;
      function bind(){ box.innerHTML=body(vy);
        Array.prototype.forEach.call(box.querySelectorAll("[data-y]"),function(x){ x.onclick=function(){ vy+=Number(x.getAttribute("data-y")); bind(); }; });
        Array.prototype.forEach.call(box.querySelectorAll("[data-m]"),function(x){ x.onclick=function(){ y=vy; m=Number(x.getAttribute("data-m")); label(); closeDialog(); o.onPick&&o.onPick(y,m); }; }); }

  /* 기능 찾기 창 — 머리말 [찾기] 단추(find.mode:"button")가 열어요. 가운데 창 안에 찾기 칸(43px) + 결과 목록 */
  function findDialog(feats, onGo){

  /* 마이페이지 창 — 사람 단추 › 마이페이지 (SKILL.md: 요금제 · 사용량은 여기서)

  function myPage(o){ o=o||{};

      return '<dt>'+esc(u[0])+'</dt><dd>'+won(v)+(lim?' / '+won(lim):'')+esc(unit)+'</dd>'+(lim?'<span class="bar"><i style="width:'+Math.min(100,Math.round(v/lim*100))+'%"></i></span>':''); }).join("")+'</dl>';
    dialog({size:"detail", title:"마이페이지", desc:o.who||"",

      ok:o.ok, cancel:"닫기", onOk:o.onOk}); }

  /* ───── 1.13 체크 v56 에서 옮겨 온 공통 몫 (워시 v137 · 체크 v56.1 같이 써요) ───── */
  /* 여러 건 결과 목록 — «… N곳 — 가(까닭) / 나(까닭)» 한 줄을 한 곳씩 줄 바꾼 목록으로. html 은 이미 esc 된 글이어야 해요 */
  function listify(html){
    return String(html==null?"":html).split(/<br\s*\/?>/i).map(function(line){
      var m=line.match(/^(.*?(?:\d+\s*(?:곳|건|줄|명))\s*)—\s*(.+)$/);

      return m[1]+'<ul class="cgg-list">'+m[2].split(/\s+\/\s+/).map(function(x){ return '<li>'+x+'</li>'; }).join("")+'</ul>'; }).join("<br>"); }

     4칸이 기본(넓은 화면 한 줄 · 폰은 한 칸씩). 글자는 모두 esc. 지금 칸은 aria-current="step" */

      +'<ol>'+(items||[]).map(function(x,i){ var st=S[x.state]?x.state:"todo";
        return '<li class="'+st+'"'+(st==="now"?' aria-current="step"':'')+'><i>'+(st==="done"?"✓":(i+1))+'</i><span><b>'+esc(x.label)+'</b><small>'+esc(x.note!=null?x.note:S[st])+'</small></span></li>'; }).join("")+'</ol>'; }
  /* 얇은 진행 줄 — 화면 맨 위 3px. CGG.progress(3,10,"보내는 중") · CGG.progress(null) 로 닫아요 */

  /* 밀린 달 한꺼번에 — 화면 모양만(서버 부르기는 제품이 onNext · send 로 해요)

.cpt-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cpt-tools .cpt-q{flex:1 1 200px;min-width:0}
.cpt input.cpt-q,.cpt select.cpt-per{font:inherit;font-size:14.5px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:43px;height:43px;box-sizing:border-box}
.cpt select.cpt-per{width:auto}
.cpt-tools .cgg-btn,.cpt-pager .cgg-btn{min-height:43px;height:43px;box-sizing:border-box}
.cpt-tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch}
.cpt-tbl table{border-collapse:separate;border-spacing:0;width:100%;min-width:640px;font-variant-numeric:tabular-nums}
.cpt-tbl th,.cpt-tbl td{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;background:var(--surface);font-size:14px;line-height:1.4}
.cpt-tbl tbody tr:last-child td{border-bottom:0}
.cpt-tbl th{font-size:13px;color:var(--muted);font-weight:700;cursor:pointer;user-select:none}
.cpt-tbl tbody tr[data-id]{cursor:pointer}
.cpt-tbl tbody tr[data-id]:hover td{background:var(--surface2)}
.cpt-tbl th.ck,.cpt-tbl td.ck{width:52px;min-width:52px;text-align:center;cursor:default;position:sticky;left:0;z-index:1}
.cpt-tbl .nm{position:sticky;left:52px;z-index:1;box-shadow:1px 0 0 var(--line);font-weight:700}
.cpt-tbl input[type=checkbox]{width:24px;height:24px;accent-color:var(--brand);cursor:pointer;margin:0;vertical-align:middle}
.cpt-tbl .em{text-align:center;color:var(--muted);cursor:default;white-space:normal}
.cpt-chip{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--brand-soft);color:var(--brand)}
.cpt-chip.need{background:var(--warn-soft);color:var(--warn)}
.cpt-chip.no{background:var(--surface2);color:var(--muted)}
.cpt-chip.ok{background:var(--good-soft);color:var(--good)}
.cpt-bad{color:var(--danger)}
.cpt-dim{color:var(--muted)}
.cpt-pager{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.cpt-pager span.b{display:inline-flex;gap:6px;align-items:center}
.cpt-note{margin:0;font-size:13px;color:var(--muted)}
/* 창 안 (CGG.dialog body) */
.cpt-f{display:grid;gap:12px}
.cpt-f h4{margin:4px 0 0;font-size:14.5px;color:var(--brand)}
.cpt-f label.l{font-size:13px;font-weight:700;display:grid;gap:4px;color:var(--text)}
.cpt-f input[type=text],.cpt-f input[type=tel],.cpt-f select{font:inherit;font-size:15px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-height:43px;box-sizing:border-box}
.cpt-f input:disabled,.cpt-f select:disabled{background:var(--surface2);color:var(--muted)}
.cpt-g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cpt-g2 .full{grid-column:1/-1}
.cpt-radios{display:grid;gap:6px}
.cpt-f .cpt-radios label{display:flex;flex-direction:row;gap:9px;align-items:center;justify-content:flex-start;text-align:left;font-size:14.5px;font-weight:500;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin:0;cursor:pointer}
.cpt-f .cpt-radios input[type=radio]{width:20px;height:20px;min-height:0;flex:none;accent-color:var(--brand);margin:0;padding:0}
.cpt-f .cpt-radios label:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.cpt-box{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;background:var(--surface2)}
.cpt-box b.t{font-size:14px}
.cpt-msg{font-size:13px}
.cpt-msg.ok{color:var(--good)} .cpt-msg.bad{color:var(--danger)}
.cpt-err{background:var(--danger-soft);color:var(--danger);border-radius:10px;padding:9px 11px;font-size:13.5px}
.cpt-sm{justify-self:start}
@media (max-width:600px){ .cpt-g2{grid-template-columns:1fr} .cpt-seg button{padding:8px 14px}
  .cpt input.cpt-q,.cpt select.cpt-per,.cpt-tools .cgg-btn,.cpt-pager .cgg-btn{min-height:42px;height:42px} }
</style>
<script>
/* 차곳간 거래처 부품 cpt 1.3 (체크 v47.1~ · 워시가 그대로 가져다 씀)
   1.3 (대표님 TEST v47 시험 10/18): 국세청 확인이 안 될 때(ready:false + why) 까닭을 보여 주고 «다시 확인» 단추 — 열쇠가 아직 없을 때(«준비 중»)만 조용히
   1.2 (보안 v47 덧붙임 · 10/18): 창을 열기만 해서는 국세청에 묻지 않음 — 번호를 고치거나 사진으로 채울 때, 또는 «국세청에 확인» 단추를 누를 때만 (하루 한도 아끼기)
   1.1 (대표님 v46 시험 10/18): 사업자등록증 사진 → 연락처 · 이메일도 채우기 · 명함 → 이메일 · 국세청 확인(api.verifyBiz, 있으면)
       · 모양 검사 글은 «번호 모양 맞음»(진짜 확인과 헷갈리지 않게) · 휴업/폐업/없는 번호는 저장 전에 한 번 더 묻기
   시안: https://claude.ai/artifact/J6CqnRvhvefztsjWtqYH2Y
   제품은 «정리한 자료 + 창구 함수»만 넘겨요. 서버 모양은 제품 쪽 이음새(adapter)가 맞춰요.
   쓰는 공통 부품: CGG.dialog · CGG.closeDialog · CGG.toast · CGG.esc (cgg-j4 1.5 이상)

   CGG_PARTNER.mount(el, o)
   o = {
     state: {}                       제품의 전역 변수 하나 — 다시 그려도 보기 · 찾기 · 정렬 · 쪽 · 고른 줄이 남아요
     owner: true/false               넣기 · 고치기 · 지우기는 대표만 (직원은 보기만)
     dealers:  [{id,name,tel,compId,comp,tax:"co"|"own"|"none"|"later",biz:{name,no,ceo,addr,email,upte,jongmok},billTo,billToName,last}]
     companies:[{id,name,biz:{no,ceo,tel,addr,email,upte,jongmok},n}]
     caps: {later, more, last, billTo}  later=«나중에» 저장 가능 · more=주소·이메일·업태·종목 칸 · last=마지막 거래 칸 · billTo=«청구서 받는 사람» 칸
     api: { saveDealer(d, isNew) → Promise, saveCompany(c) → Promise<{id,name}>,
            delDealers(ids) → Promise<{n}>, delCompanies(ids) → Promise<{n,kept:[{id,name,dealerN}]}>,
            readCard(b64) → Promise<{name,phone,company,email,…}>, readBiz(b64) → Promise<{bizNo,bizName,ceo,addr,upte,jongmok,tel,email,start}>,
            verifyBiz({no,ceo,start}) → Promise<{ready, state:"계속"|"휴업"|"폐업"|"없음", since, match:{ceo,start}}>  (없으면 모양 검사만) }
     done(msg)                       저장 · 지우기가 끝나면 (제품이 자료를 다시 불러 다시 그림)
     fail(msg)                       서버 오류 글 (쉬운 말로 바꿔 보여 줌)
   } */
var CGG_PARTNER = (function(){
  var V="cpt 1.3";
  var VERIFY=null, VST={}, VSTART={}, VCACHE={}, WIRE_AUTO={};   /* WIRE_AUTO[pre]=true → 다음 wireBizNo 때 바로 물음(사진으로 채운 뒤) */   /* 1.1: 국세청 확인 — 창마다 새로 */
  function esc(s){ return (window.CGG&&CGG.esc) ? CGG.esc(s) : String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function dig(v){ return String(v==null?"":v).replace(/\D/g,""); }
  function bizOk(v){ var d=dig(v); if(d.length!==10) return false;
    var w=[1,3,7,1,3,7,1,3,5], s=0; for(var i=0;i<9;i++) s+=(+d[i])*w[i]; s+=Math.floor((+d[8])*5/10); return (10-s%10)%10===(+d[9]); }
  function bizFmt(v){ var d=dig(v).slice(0,10); return d.length>5?d.slice(0,3)+"-"+d.slice(3,5)+"-"+d.slice(5):d.length>3?d.slice(0,3)+"-"+d.slice(3):d; }
  function telFmt(v){ var d=dig(v); if(d.length===11) return d.slice(0,3)+"-"+d.slice(3,7)+"-"+d.slice(7);
    if(d.length===10) return d.slice(0,3)+"-"+d.slice(3,6)+"-"+d.slice(6); return String(v==null?"":v); }
  function telOk(v){ return /^01[016789]\d{7,8}$/.test(dig(v)); }
  function toast(t){ try{ CGG.toast(t); }catch(e){} }
  function $id(i){ return document.getElementById(i); }

  /* 딜러 한 명의 세금계산서 상태 — 계산서를 끊으려면 사업자번호(맞는 번호)가 있어야 해요 */
  function compOf(o, d){ for(var i=0;i<o.companies.length;i++) if(String(o.companies[i].id)===String(d.compId)) return o.companies[i]; return null; }
  function compFull(c){ return !!(c && bizOk(c.biz&&c.biz.no)); }
  function ownFull(b){ return !!(b && b.name && bizOk(b.no)); }
  function state(o, d){
    if(d.tax==="none") return {c:"no", t:"안 끊음"};
    if(d.tax==="own")  return ownFull(d.biz) ? {c:"ok", t:"본인 사업자"} : {c:"need", t:"정보 필요 · 본인"};
    if(d.tax==="co"){ var c=compOf(o,d);
      if(!c) return {c:"need", t:"정보 필요 · 상사 없음"};
      return compFull(c) ? {c:"ok", t:"상사로"} : {c:"need", t:"정보 필요 · 상사"}; }
    return {c:"need", t:"정보 필요"};
  }

  var BIZ_OWN=[["name","상호",1],["no","사업자등록번호",1],["ceo","대표자"],["addr","사업장 주소",0,"full"]];
  var BIZ_CO =[["no","사업자등록번호",1],["ceo","대표자"],["tel","연락처"]];
  var BIZ_MORE=[["email","계산서 받을 이메일"],["addr","사업장 주소",0,"full"],["upte","업태"],["jongmok","종목"]];

  function mount(el, o){
    if(!el) return;
    o.state=o.state||{}; var S=o.state;
    if(!S.view){ S.view="d"; S.q=""; S.k=""; S.dir=1; S.page=1; S.per=10; S.sel={}; S.need=false; }
    o.caps=o.caps||{}; o.dealers=o.dealers||[]; o.companies=o.companies||[];
    var isD=S.view==="d";
    /* 지금 없는 줄의 고른 표시는 빼요 (사라진 줄에 지우기가 가지 않게) */
    var live={}; (isD?o.dealers:o.companies).forEach(function(r){ live[String(r.id)]=1; });
    Object.keys(S.sel).forEach(function(k){ if(!live[k]) delete S.sel[k]; });

    var needD=o.dealers.filter(function(d){ return state(o,d).c==="need"; }).length;
    var needC=o.companies.filter(function(c){ return !compFull(c); }).length;
    var nNeed=isD?needD:needC;

    var cols=isD ? [["name","딜러"],["comp","상사"],["tel","휴대폰"],["tax","세금계산서"]]
                   .concat(o.caps.billTo?[["billToName","청구서 받는 사람"]]:[]).concat(o.caps.last?[["last","마지막 거래"]]:[])
                 : [["name","상사"],["no","사업자등록번호"],["ceo","대표자"],["n","딜러 수"],["ok","계산서 정보"]];
    var rows=isD ? o.dealers.map(function(d){ var s=state(o,d);
                     return {id:String(d.id), name:d.name, comp:d.comp||"", tel:d.tel||"", tax:s.t, _c:s.c, billToName:d.billToName||"", last:d.last||"", _d:d}; })
                 : o.companies.map(function(c){ var ok=compFull(c);
                     return {id:String(c.id), name:c.name, no:(c.biz&&c.biz.no)||"", ceo:(c.biz&&c.biz.ceo)||"", n:Number(c.n)||0, ok:ok?"다 있음":"정보 필요", _c:ok?"ok":"need", _co:c}; });
    var q=String(S.q||"").trim().toLowerCase();
    var all=rows.filter(function(r){
      if(S.need && r._c!=="need") return false;
      if(!q) return true;
      return [r.name, r.comp, r.tel, dig(r.tel), r.no, dig(r.no), r.ceo, r.billToName].join(" ").toLowerCase().indexOf(q)>=0; });
    if(S.k){ all.sort(function(a,b){ var x=a[S.k], y=b[S.k];
      if(typeof x==="number") return (x-y)*S.dir;
      return String(x==null?"":x).localeCompare(String(y==null?"":y),"ko")*S.dir; }); }
    else all.sort(function(a,b){ return String(a.name).localeCompare(String(b.name),"ko"); });
    if([5,10,20,30,50].indexOf(S.per)<0) S.per=10;
    var pages=Math.max(1,Math.ceil(all.length/S.per)); if(S.page>pages) S.page=pages; if(S.page<1) S.page=1;
    var part=all.slice((S.page-1)*S.per, S.page*S.per);
    var nSel=Object.keys(S.sel).filter(function(k){ return S.sel[k]; }).length;
    var allOn=part.length>0 && part.every(function(r){ return S.sel[r.id]; });
    var own=!!o.owner, hasPhoto=own && (isD?!!o.api.readCard:!!o.api.readBiz);

    var h='<div class="cpt" data-cpt="'+V+'">'+
      '<div class="cpt-top"><h3>'+(isD?"딜러":"매매상사")+' <span class="cpt-dim" style="font-size:14px;font-weight:500">'+(isD?o.dealers.length+"명":o.companies.length+"곳")+'</span></h3>'+
        '<div class="cpt-seg" role="group" aria-label="보기"><button type="button" data-cv="d" aria-pressed="'+isD+'">딜러</button><button type="button" data-cv="c" aria-pressed="'+(!isD)+'">상사</button></div></div>';
    if(nNeed || S.need) h+='<div class="cpt-alert">'+(S.need
        ? '<span>«정보 필요»만 보는 중이에요</span><button type="button" class="cgg-btn sm" data-cneed="0">전체 보기</button>'
        : '<span>계산서 정보가 빠진 '+(isD?'딜러':'상사')+' <b>'+nNeed+(isD?'명':'곳')+'</b></span><button type="button" class="cgg-btn sm" data-cneed="1">모아 보기</button>')+'</div>';
    h+='<div class="cpt-tools"><input type="search" class="cpt-q" data-cq="1" placeholder="'+(isD?"이름 · 상사 · 번호 찾기":"상사 · 사업자번호 · 대표자 찾기")+'" aria-label="찾기" value="'+esc(S.q)+'">'+
      (own?'<button type="button" class="cgg-btn pri" data-cadd="1">＋ '+(isD?"딜러":"상사")+' 추가</button>':'')+
      (hasPhoto?'<button type="button" class="cgg-btn" data-cphoto="1">'+(isD?"명함 사진으로 추가":"사업자등록증 사진으로 추가")+'</button>':'')+
      (own?'<button type="button" class="cgg-btn danger" data-cdel="1"'+(nSel?'':' disabled')+'>선택한 줄 지우기'+(nSel?' ('+nSel+')':'')+'</button>':'')+'</div>';
    h+='<div class="cpt-tbl"><table><thead><tr><th class="ck"><input type="checkbox" data-call="1" aria-label="이 쪽 모두 고르기"'+(allOn?' checked':'')+'></th>'+
      cols.map(function(c,i){ return '<th data-ck="'+c[0]+'"'+(i===0?' class="nm"':'')+' aria-sort="'+(S.k===c[0]?(S.dir>0?"ascending":"descending"):"none")+'">'+esc(c[1])+(S.k===c[0]?(S.dir>0?" ▲":" ▼"):" ↕")+'</th>'; }).join("")+'</tr></thead><tbody>';
    if(!part.length) h+='<tr><td class="em" colspan="'+(cols.length+1)+'">'+(q||S.need?"찾는 항목이 없어요.":(isD?"아직 딜러가 없어요.":"아직 매매상사가 없어요."))+'</td></tr>';
    part.forEach(function(r){
      h+='<tr data-id="'+esc(r.id)+'"><td class="ck"><input type="checkbox" data-cpk="'+esc(r.id)+'"'+(S.sel[r.id]?' checked':'')+' aria-label="'+esc(r.name)+' 고르기"></td>';
      cols.forEach(function(c,i){ var v=r[c[0]], t;
        if(c[0]==="tax"||c[0]==="ok") t='<span class="cpt-chip '+r._c+'">'+esc(v)+'</span>';
        else if(c[0]==="tel") t=v?esc(telFmt(v)):'<span class="cpt-bad">없음</span>';
        else if(c[0]==="no") t=v?esc(bizFmt(v)):'<span class="cpt-dim">—</span>';
        else if(c[0]==="n") t=esc(v)+'명';
        else if(c[0]==="billToName") t=v?esc(v):'<span class="cpt-dim">본인</span>';
        else if(c[0]==="last") t=v?esc(v):'<span class="cpt-dim">거래 없음</span>';
        else t=v?esc(v):'<span class="cpt-dim">—</span>';
        h+='<td'+(i===0?' class="nm"':'')+'>'+t+'</td>'; });
      h+='</tr>'; });
    h+='</tbody></table></div>'+
      '<div class="cpt-pager"><span>전체 '+all.length+(isD?'명':'곳')+' · '+S.page+' / '+pages+'쪽</span><span class="b">'+
      '<select class="cpt-per" data-cper="1" aria-label="한 번에 보일 개수">'+[5,10,20,30,50].map(function(n){ return '<option value="'+n+'"'+(S.per===n?' selected':'')+'>'+n+'개씩 보기</option>'; }).join("")+'</select>'+
      '<button type="button" class="cgg-btn" data-cpg="'+(S.page-1)+'"'+(S.page<=1?' disabled':'')+'>이전</button>'+
      '<button type="button" class="cgg-btn" data-cpg="'+(S.page+1)+'"'+(S.page>=pages?' disabled':'')+'>다음</button></span></div>'+
      (own?'':'<p class="cpt-note">딜러 · 매매상사를 넣고 고치고 지우는 것은 대표만 할 수 있어요. 줄을 누르면 내용을 볼 수 있어요.</p>')+
      '</div>';
    el.innerHTML=h;

    function redraw(){ mount(el,o); }
    function on(sel, ev, fn){ Array.prototype.forEach.call(el.querySelectorAll(sel), function(x){ x["on"+ev]=fn; }); }
    on("[data-cv]","click",function(){ var v=this.getAttribute("data-cv"); if(v===S.view) return;
      S.view=v; S.k=""; S.dir=1; S.page=1; S.sel={}; S.need=false; redraw(); });
    on("[data-cneed]","click",function(){ S.need=this.getAttribute("data-cneed")==="1"; S.page=1; redraw(); });
    var qt=null;
    on("[data-cq]","input",function(){ var me=this; clearTimeout(qt); qt=setTimeout(function(){ S.q=me.value; S.page=1; redraw();
      var e=el.querySelector("[data-cq]"); if(e){ e.focus(); try{ e.setSelectionRange(e.value.length,e.value.length); }catch(x){} } },200); });
    on("[data-cper]","change",function(){ S.per=Number(this.value)||10; S.page=1; redraw(); });
    on("[data-cpg]","click",function(){ S.page=Number(this.getAttribute("data-cpg"))||1; redraw(); });
    on("th[data-ck]","click",function(){ var k=this.getAttribute("data-ck"); if(S.k===k) S.dir=-S.dir; else { S.k=k; S.dir=1; } redraw(); });
    on("[data-cpk]","click",function(e){ e.stopPropagation(); });
    on("[data-cpk]","change",function(){ var k=this.getAttribute("data-cpk"); if(this.checked) S.sel[k]=true; else delete S.sel[k]; redraw(); });
    on("[data-call]","change",function(){ var c=this.checked; part.forEach(function(r){ if(c) S.sel[r.id]=true; else delete S.sel[r.id]; }); redraw(); });
    on("tbody tr[data-id]","click",function(){ var id=this.getAttribute("data-id");
      if(isD){ var d=o.dealers.filter(function(x){ return String(x.id)===id; })[0]; if(d) dealerPop(o,d); }
      else { var c=o.companies.filter(function(x){ return String(x.id)===id; })[0]; if(c) companyPop(o,c); } });

  /* ── 사진 고르기 → 긴 변 1600px 안팎 JPEG 로 줄여 data: 앞부분을 뗀 글자 ── */
  function pickPhoto(done){
    var i=document.createElement("input"); i.type="file"; i.accept="image/*";

    i.click();

  function shrink(file, done){
    var rd=new FileReader();
    rd.onerror=function(){ toast("사진을 열지 못했어요. 다른 사진으로 해 주세요."); };
    rd.onload=function(){ var img=new Image();
      img.onerror=function(){ toast("사진을 열지 못했어요. 다른 사진으로 해 주세요."); };
      img.onload=function(){ var M=1600, w=img.naturalWidth, h=img.naturalHeight, r=Math.min(1, M/Math.max(w,h));
        var cv=document.createElement("canvas"); cv.width=Math.round(w*r); cv.height=Math.round(h*r);
        cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        var u=cv.toDataURL("image/jpeg",0.85); done(u.slice(u.indexOf(",")+1)); };
      img.src=rd.result; };
    rd.readAsDataURL(file);
  }

function niceMsg(m, formal){
