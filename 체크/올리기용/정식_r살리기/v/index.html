<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>차곳간 보기</title>
<style>body{margin:0;font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#F4F6F9;color:#0B2545;display:grid;place-items:center;min-height:100vh}
.b{background:#fff;border-radius:14px;padding:24px 20px;max-width:360px;width:calc(100% - 32px);text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.06)}
a{color:#1668C4;font-weight:700}</style></head>
<body><div class="b" id="m">새 보기 화면으로 옮기는 중이에요…</div>
<script>
/* 체크 정식 — 옛 주소 /v/열쇠 를 새 보기 화면(app.cgg.co.kr/v.html)으로 넘겨요. 열쇠는 글자 · 숫자 · - _ 만 (64자까지) */
(function(){
  var k=(location.pathname.match(/\/v\/([A-Za-z0-9_-]{1,64})/)||[])[1]||(location.search.match(/[?&]c=([A-Za-z0-9_-]{1,64})/)||[])[1]||"";
  var m=document.getElementById("m");
  if(!k){ m.textContent="주소가 잘못됐어요. 받은 문자의 주소를 다시 눌러 주세요."; return; }
  var to="https://app.cgg.co.kr/v.html?c="+encodeURIComponent(""+k);
  m.innerHTML='새 보기 화면으로 옮기는 중이에요… <br><a href="'+to+'">바로 열기</a>';
  location.replace(to);
})();
</script></body></html>
