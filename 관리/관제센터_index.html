<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2545">
<meta name="robots" content="noindex, nofollow">
<title>차곳간 관제센터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1668C4; --blue-deep:#0E4E9B; --navy:#0B2545; --sky:#8FC9F2;
  --bg:#F3F6FA; --surface:#fff; --surface2:#F8FAFD; --line:#DDE3EC;
  --text:#14202E; --muted:#667389;
  --ok:#1A7F4B; --warn:#B45309; --danger:#C0392B;
  --good:#1A7F4B; --good-soft:#E9F6EF; --warn-soft:#FDF4E5; --danger-soft:#FCEDEB;
  --blue-soft:#EAF3FD; --block:#E6EDF7; --block-line:#D3DEED;
  --r:13px; --f:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0C1420; --surface:#141E2C; --surface2:#1A2534;
  --line:#26364A; --text:#E8EEF6; --muted:#93A3B8; --blue:#5AA6F0; --blue-deep:#8AC2F8; --navy:#0A121C;
  --ok:#4ED09A; --good:#4ED09A; --warn:#E8A33D; --danger:#F07267;
  --good-soft:#12301F; --warn-soft:#31240F; --danger-soft:#331A19;
  --blue-soft:#10263C; --block:#101A29; --block-line:#223145;
}}
:root[data-theme="dark"]{
  --bg:#0C1420; --surface:#141E2C; --surface2:#1A2534; --line:#26364A;
  --text:#E8EEF6; --muted:#93A3B8; --blue:#5AA6F0; --blue-deep:#8AC2F8; --navy:#0A121C;
  --ok:#4ED09A; --good:#4ED09A; --warn:#E8A33D; --danger:#F07267;
  --good-soft:#12301F; --warn-soft:#31240F; --danger-soft:#331A19;
  --blue-soft:#10263C; --block:#101A29; --block-line:#223145;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--f);font-size:15px;line-height:1.6;
  -webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;color:inherit}

/* ===== 로그인 ===== */
#gate{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;
  justify-content:center;padding:20px}
.gbox{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:28px 24px;box-shadow:0 4px 20px rgba(11,37,69,.10)}
.glogo{text-align:center;margin-bottom:22px}
.glogo b{display:block;font-size:28px;font-weight:800;letter-spacing:-1px}
.glogo span{font-size:13px;color:var(--muted)}
.glogo .gver{display:block;margin-top:6px;font-size:12px;color:var(--muted);opacity:.8}
header .ver{font-size:11.5px;color:rgba(255,255,255,.62);margin-left:2px;white-space:nowrap}
label.f{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 6px}
input[type=text],input[type=tel],input[type=password],input[type=number],input[type=date],select,textarea{
  width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);font-size:15px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
.btn{display:inline-block;padding:11px 16px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-deep);border-color:var(--blue-deep)}
.btn.danger{color:var(--danger);border-color:var(--line)}
.btn.danger:hover{border-color:var(--danger)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.big{display:block;width:100%;padding:14px;font-size:16px;margin-top:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.msg{font-size:13.5px;margin-top:12px;min-height:20px;color:var(--muted)}
.msg.bad{color:var(--danger);font-weight:700}
.msg.ok{color:var(--ok);font-weight:700}

/* ===== 뼈대 ===== */
#app{display:none}
header{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;
  display:flex;align-items:center;gap:14px;padding:11px 16px;flex-wrap:wrap}
header .brand{font-weight:800;font-size:18px;letter-spacing:-.5px}
header .tag{font-size:11.5px;background:rgba(255,255,255,.16);padding:3px 8px;border-radius:99px}
header .sp{flex:1}
header .who{font-size:13px;opacity:.85}
header button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;
  padding:7px 12px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer}
header button:hover{background:rgba(255,255,255,.22)}
nav{background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:2px;
  padding:0 10px;overflow-x:auto;position:sticky;top:51px;z-index:40}
nav button{background:none;border:none;border-bottom:3px solid transparent;padding:13px 14px;
  font-size:14.5px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--blue);border-bottom-color:var(--blue)}
main{padding:18px 16px 60px;max-width:1500px;margin:0 auto}
h2.sec{font-size:19px;margin:0 0 4px}
p.lead{font-size:13.5px;color:var(--muted);margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.tbar select.flt{max-width:140px}
/* 보안 점검 */
.secTop{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 14px}
@media(max-width:820px){.secTop{grid-template-columns:1fr}}
.secTop .kbox{width:100%;text-align:left}
.secGrp{margin:0 0 6px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.02em}
.secRow{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line);
  border-radius:11px;background:var(--surface);margin-bottom:7px}
.secRow .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;margin-top:5px;background:var(--good)}
.secRow.lv1 .dot{background:var(--warn)} .secRow.lv2 .dot{background:var(--danger)}
.secRow.lv1{border-color:#F0D9A8;background:var(--warn-soft)}
.secRow.lv2{border-color:#F0B9B4;background:var(--danger-soft)}
.secRow .bd{flex:1;min-width:0}
.secRow .nm{font-size:14px;font-weight:700;color:var(--text)}
.secRow .tx{font-size:13px;color:var(--muted);margin-top:2px;word-break:keep-all}
.secRow .how{font-size:12.5px;font-weight:700;margin-top:5px}
.secRow.lv1 .how{color:var(--warn)} .secRow.lv2 .how{color:var(--danger)}
.secChk{display:flex;gap:11px;align-items:flex-start;padding:12px 13px;border:1px solid var(--line);
  border-radius:11px;background:var(--surface);margin-bottom:7px;cursor:pointer}
.secChk input{width:22px;height:22px;flex:0 0 auto;margin-top:2px;cursor:pointer}
.secChk.on{background:var(--good-soft);border-color:#B7E4CC}
.secChk .nm{font-size:14px;font-weight:700}
.secChk .tx{font-size:12.5px;color:var(--muted);margin-top:3px;word-break:keep-all}
.secChk .dn{font-size:12px;color:var(--good);font-weight:700;margin-top:4px}
/* 요금제 한눈에 비교표 */
.cmpWrap{margin:0 0 14px}
/* 묶음 판 */
.block{background:var(--block);border:1px solid var(--block-line);border-radius:15px;padding:12px;margin-bottom:12px}
.block>.dRow:last-child,.block>.gauges:last-child{margin-bottom:0}
.block .opsHd{margin:0 0 10px}
@media(max-width:620px){.block{padding:10px;border-radius:12px}}
/* 공지사항 요약 줄 */
.ntSum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ntSum>div{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:var(--surface2)}
.ntSum span{display:block;font-size:12px;color:var(--muted);font-weight:700}
.ntSum b{display:block;font-size:19px;font-weight:900;margin-top:3px}
@media(max-width:620px){.ntSum{grid-template-columns:1fr}}

.opsHd{display:flex;align-items:center;gap:8px;margin:18px 0 10px}
.opsHd h3{font-size:16px;font-weight:800;margin:0}
.opsHd .sp{flex:1}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:12px}
@media(max-width:820px){.gauges{grid-template-columns:1fr}}
.gauges .gauge{margin:0}
/* 홈 2단 */
.homeMain{display:grid;gap:12px;align-items:start;grid-template-columns:minmax(0,1.85fr) minmax(0,1fr)}
@media(max-width:980px){.homeMain{grid-template-columns:1fr}}
.homeMain>div{display:grid;gap:12px;align-content:start}
.homeMain .cal{margin:0}
.homeMain .block{margin:0}
.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:13px 15px}
.panel h3{font-size:14.5px;font-weight:800;margin:0 0 9px}
/* 캘린더 */
.cal{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 15px;margin:0 0 14px}
.calHd{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.calHd h3{font-size:15.5px;font-weight:800;margin:0}
.calHd .sp{flex:1}
.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calGrid .dow{text-align:center;font-size:11.5px;color:var(--muted);font-weight:700;padding:2px 0}
.calCell{min-height:62px;border:1px solid transparent;border-radius:9px;padding:5px 6px;background:var(--surface2);overflow:hidden}
.calCell.out{opacity:.32}
.calCell.today{border-color:var(--blue);background:rgba(22,104,196,.08)}
.calCell .d{font-size:12.5px;font-weight:800;color:var(--muted)}
.calCell.sun .d{color:var(--danger)} .calCell.sat .d{color:var(--blue)}
.calEv{display:block;font-size:11.5px;line-height:1.35;margin-top:3px;padding:2px 5px;border-radius:6px;
  background:var(--blue);color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calEv.w{background:var(--warn)} .calEv.d{background:var(--danger)} .calEv.g{background:var(--ok)}
.calEv.x{background:var(--muted)}
.calLg{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--muted)}
.calLg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@media(max-width:700px){.calCell{min-height:54px;padding:3px}.calEv{font-size:10px;padding:1px 3px;margin-top:2px}}
/* 할 일 */
.todoAdd{display:flex;gap:7px;margin-bottom:9px}
.todoAdd input{flex:1;min-width:0;font-family:inherit;font-size:13.5px;padding:9px 11px;
  border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text)}
#tdList{max-height:330px;overflow-y:auto}
.tdRow{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);
  border-radius:10px;background:var(--surface);margin-bottom:6px}
.tdRow input[type=checkbox]{width:19px;height:19px;flex:0 0 auto;margin-top:1px;accent-color:var(--blue);cursor:pointer}
.tdRow .tt{flex:1;min-width:0;font-size:13.5px;word-break:keep-all}
.tdRow .when{font-size:11.5px;color:var(--muted);white-space:nowrap}
.tdRow.done{opacity:.55} .tdRow.done .tt{text-decoration:line-through}
.tdRow .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;padding:2px 3px}
.tdRow .x:hover{color:var(--danger)}
/* 시각 · 칩 */
.hm{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.hm input{width:82px;font-family:inherit;font-size:19px;font-weight:800;text-align:center;
  padding:9px 6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text)}
.hm span{font-size:14px;font-weight:700;color:var(--muted)}
.hm b{font-size:13.5px;color:var(--blue-deep);margin-left:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;background:var(--surface);cursor:pointer;font-size:13.5px;font-weight:700;
  color:var(--text);font-family:inherit}
.chip input{width:18px;height:18px;accent-color:var(--blue)}
.chip.on{border-color:var(--blue);background:var(--blue-soft,rgba(22,104,196,.08))}
.tplTabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.tplTabs button{font-family:inherit;font-size:13px;font-weight:700;padding:7px 12px;border-radius:9px;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.tplTabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.prev{border:1px solid var(--line);border-radius:12px;background:var(--surface2);padding:12px 14px;margin-top:10px}
.prev .ph{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}
.prev .msg{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px;
  font-size:13.5px;line-height:1.75;white-space:pre-wrap;word-break:keep-all;text-align:left;color:var(--text)}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.keys code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--surface2);
  border:1px solid var(--line);border-radius:7px;padding:3px 7px;color:var(--blue-deep)}
.saveRow{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
table.cmp{width:100%;border-collapse:collapse;background:var(--surface);font-size:14px}
table.cmp th,table.cmp td{border-bottom:1px solid var(--line);padding:11px 13px;text-align:center;white-space:nowrap}
table.cmp thead th{background:var(--surface2);font-size:13.5px;font-weight:800;color:var(--text)}
table.cmp th.stick,table.cmp td.stick{text-align:left;position:sticky;left:0;background:var(--surface);
  font-weight:700;color:var(--muted);min-width:150px;box-shadow:1px 0 0 var(--line)}
table.cmp thead th.stick{background:var(--surface2)}
table.cmp tbody tr:last-child td{border-bottom:0}
table.cmp .yes{color:var(--ok);font-weight:700}
table.cmp .no{color:var(--muted)}
/* 운영 상태 */
.opsTop{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 14px}
@media(max-width:1100px){.opsTop{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.opsTop{grid-template-columns:1fr}}
.opsTop .kbox{width:100%;text-align:left}
.gauge{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 15px;margin-bottom:10px}
.gauge .gh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.gauge .gn{font-size:14px;font-weight:800}
.gauge .gv{font-size:13px;color:var(--muted);margin-left:auto}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--good);transition:width .3s}
.bar.w>i{background:var(--warn)} .bar.d>i{background:var(--danger)}
.gauge .gs{font-size:12.5px;color:var(--muted);margin-top:7px;word-break:keep-all}
.opsGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.opsGrid{grid-template-columns:1fr}}
/* 결제 화면 요약 칸 */
.paySum{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 14px}
@media(max-width:820px){.paySum{grid-template-columns:1fr}}
.paySum .kbox{width:100%;text-align:left}

/* ===== 요약 타일 ===== */
/* ===== 대시보드 ===== */
.dash{display:grid;gap:12px;margin-bottom:18px}
.dRow{display:grid;gap:12px}
.dRow.money{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.dRow.mini{grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
.kbox{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:15px 17px;font:inherit;color:inherit;cursor:pointer;
  transition:border-color .12s,box-shadow .12s}
.kbox:hover{border-color:var(--blue);box-shadow:0 1px 8px rgba(22,104,196,.10)}
.kbox .t{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:-.2px}
.kbox .v{font-weight:800;letter-spacing:-.8px;margin-top:4px;line-height:1.25;
  font-variant-numeric:tabular-nums}
.kbox .s{font-size:12px;color:var(--muted);margin-top:1px}
.dRow.money .v{font-size:30px}
.dRow.mini  .v{font-size:23px}
.kbox.hl{border-color:var(--blue);background:linear-gradient(0deg,rgba(22,104,196,.05),rgba(22,104,196,.05))}
.kbox.warn .v{color:var(--warn)}
.dRow.money .kbox{padding:17px 19px}
/* 손봐야 할 것 */
.todoHd{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.todoHd h2{font-size:17px;margin:0}
.dotOk{width:8px;height:8px;border-radius:99px;background:var(--ok);flex:0 0 auto}
.dotWarn{width:8px;height:8px;border-radius:99px;background:var(--warn);flex:0 0 auto}
.todoRow{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);
  cursor:pointer}
.todoRow:last-child{border-bottom:0}
.todoRow:hover .tdT{color:var(--blue)}
.tdT{font-size:14px}
.usg{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:6px}
.ub{background:var(--surface2);border-radius:11px;padding:10px 12px;display:flex;flex-direction:column}
.ub .t{font-size:11.5px;color:var(--muted);font-weight:700}
.ub .v{font-size:16px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.ub .s{font-size:11.5px;color:var(--muted);margin-top:1px}
/* 유지비 줄 */
.svcList{display:grid;gap:2px}
.svcRow{display:grid;grid-template-columns:minmax(120px,1.1fr) minmax(0,1.6fr) minmax(160px,1fr) auto;
  gap:10px;align-items:center;padding:11px 10px;border-radius:10px;border:1px solid transparent}
.svcRow+.svcRow{border-top:1px solid var(--line);border-radius:0}
.svcRow .sN{font-weight:700;font-size:14px}
.autoTag{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:99px;vertical-align:1px;
  background:rgba(26,127,75,.12);color:var(--ok)}
.autoTag.hand{background:rgba(102,115,137,.15);color:var(--muted)}
.svcRow .sW{font-size:12.5px;color:var(--muted)}
.svcRow .sS{font-size:13px;display:flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums}
.svcRow.lv2{background:rgba(192,57,43,.06)}
.svcRow.lv1{background:rgba(180,83,9,.06)}
@media(max-width:760px){
  .svcRow{grid-template-columns:1fr auto;gap:4px 10px;padding:12px 8px}
  .svcRow .sW{grid-column:1/-1}
  .svcRow .sS{grid-column:1/2}
}
/* 정산 표 */
.stl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.stl th,.stl td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right;font-size:14px}
.stl th:first-child,.stl td:first-child{text-align:left}
.stl th{font-size:12.5px;color:var(--muted);font-weight:700}
.stl tfoot td{font-weight:800;border-bottom:0}
.minus{color:var(--danger)}

/* ===== 표 ===== */
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tbar input.q{flex:1 1 220px;max-width:340px;padding:9px 12px;font-size:14px}
.tbar select{width:auto;padding:9px 10px;font-size:13.5px}
.tbar .sp{flex:1}
.tbar .cnt{font-size:13px;color:var(--muted);font-weight:700}
.twrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{background:var(--surface2);font-size:13px;font-weight:700;color:var(--muted);
  position:sticky;top:0;z-index:2;cursor:pointer;user-select:none}
thead th.nosort{cursor:default}
thead th i{font-style:normal;color:var(--blue);margin-left:4px}
tbody tr:hover td{background:var(--surface2)}
tbody tr:last-child td{border-bottom:none}
th.stick,td.stick{position:sticky;left:0;z-index:3;background:var(--surface);
  box-shadow:1px 0 0 var(--line)}
thead th.stick{z-index:5;background:var(--surface2)}
tbody tr:hover td.stick{background:var(--surface2)}
td.stick b{font-weight:700}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--blue);margin:0;cursor:pointer}
th.ck,td.ck{width:46px;padding-left:14px;padding-right:0}
.pg{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.pg button{padding:7px 12px;font-size:13px;border:1px solid var(--line);background:var(--surface);
  border-radius:8px;cursor:pointer;font-weight:700}
.pg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pg button[disabled]{opacity:.4;cursor:not-allowed}
.empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:14px}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700}

/* 잠금 흐름 그림 */
.lkFlow{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.lkStep{flex:1 1 150px;min-width:140px;border:1px solid var(--line);border-radius:12px;padding:12px 13px;
  background:var(--surface2)}
.lkStep b{display:block;font-size:13.5px;font-weight:800;margin-bottom:4px}
.lkStep span{font-size:12.5px;color:var(--muted);line-height:1.7}
.lkStep.ok{background:var(--good-soft);border-color:transparent}
.lkStep.ok b{color:var(--ok)}
.lkStep.warn{background:var(--warn-soft);border-color:transparent}
.lkStep.warn b{color:var(--warn)}
.lkStep.bad{background:var(--danger-soft);border-color:transparent}
.lkStep.bad b{color:var(--danger)}
.lkStep.gray b{color:var(--muted)}
.lkArw{align-self:center;color:var(--muted);font-size:20px;font-weight:800;flex:0 0 auto}
@media(max-width:700px){ .lkArw{display:none} .lkStep{flex:1 1 100%} }
.pill.ok{background:rgba(26,127,75,.12);color:var(--ok)}
.pill.off{background:rgba(192,57,43,.12);color:var(--danger)}
.pill.wait{background:rgba(180,83,9,.12);color:var(--warn)}
.pill.gray{background:var(--surface2);color:var(--muted)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:'Consolas',monospace;font-size:13px;letter-spacing:.2px}

/* ===== 창 ===== */
#bg{position:fixed;inset:0;background:rgba(11,37,69,.42);z-index:90;display:none}
#bg.show{display:block}
#sheet{position:fixed;z-index:100;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(560px,calc(100% - 32px));max-height:88vh;overflow:auto;background:var(--surface);
  border:1px solid var(--line);border-radius:16px;padding:24px;display:none;
  box-shadow:0 12px 40px rgba(11,37,69,.22)}
#sheet.show{display:block}
#sheet h3{margin:0 0 4px;font-size:19px}
#sheet .sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
.btns{display:flex;gap:8px;margin-top:20px}
.btns .btn{flex:1;text-align:center;padding:13px}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.6}

  border-radius:10px;padding:12px 13px;font-size:13px;font-weight:700;margin:14px 0}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--navy);color:#fff;
  padding:13px 20px;border-radius:11px;font-size:14px;font-weight:700;z-index:300;opacity:0;
  transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.toast.bad{background:var(--danger)}
</style>
</head>
<body>

<!-- ===== 로그인 ===== -->

  <div class="gbox">

<!-- ===== 본문 ===== -->
<div id="app">
  <header>
    <span class="brand">차곳간</span>

    <span class="ver" id="hdVer"></span>

    <button id="btnOut">로그아웃</button>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<div id="bg"></div>
<div id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
/* 관제센터 판 번호 — 고칠 때마다 이 줄만 바꾸면 화면에 그대로 나옵니다 */
var ADM_VER="v3.5 목록에 비고 칸 (2026-09-29)";
try{
  document.title = "차곳간 관제센터 " + ADM_VER.split(" ")[0];
  var _g=document.getElementById("gVer"); if(_g) _g.textContent = ADM_VER;
  var _h=document.getElementById("hdVer"); if(_h) _h.textContent = ADM_VER.split(" ")[0];
}catch(e){}
"use strict";

/* =========================================================
   서버 연결
   ========================================================= */
var API = "https://ybfpxmmjofyvfprtvmhj.supabase.co/functions/v1/wash-api?forceFunctionRegion=ap-northeast-2";
var SHOP = "ADMIN";
var SIDKEY = "cgg_admin_sid";

function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k)||""; localStorage.setItem(k,v); }catch(e){} return ""; }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

function post(bodyObj){
  return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(bodyObj)})
    .then(function(r){return r.text();},function(){throw new Error("서버에 연결하지 못했습니다 (인터넷 확인)");})
    .then(function(x){
      var j; try{ j=JSON.parse(x); }catch(e){ throw new Error("서버 응답을 읽지 못했습니다"); }
      if(j && j.__err) throw new Error(j.__err);
      return j ? j.result : null;
    });
}
function open_(fn,args){ return post({shop:"",token:"",fn:fn,args:args||[]}); }
function api(fn,args){
  var sid = ls(SIDKEY);
  if(!sid) return Promise.reject(new Error("로그인이 필요합니다"));
  return post({shop:SHOP,token:sid,fn:fn,args:args||[]}).catch(function(e){
    if(/로그인이 필요|열쇠|세션/.test(e.message||"")){ lsDel(SIDKEY); showGate("다시 로그인해 주세요"); }
    throw e;
  });
}

/* =========================================================
   공통 도구
   ========================================================= */
function $(id){ return document.getElementById(id); }
function esc(v){ return String(v==null?"":v).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function digits(v){ return String(v||"").replace(/[^0-9]/g,""); }
function phoneFmt(v){
  var s=String(v||""); if(!/^[0-9]+$/.test(s)) return s;   /* 글자 아이디는 그대로 */
  var d=digits(s);
  if(d.length===11) return d.slice(0,3)+"-"+d.slice(3,7)+"-"+d.slice(7);
  if(d.length===10) return d.slice(0,3)+"-"+d.slice(3,6)+"-"+d.slice(6);
  return s;
}
function won(n){ return (Number(n)||0).toLocaleString("ko-KR")+"원"; }
function dt(v,withTime){
  if(!v) return "-";
  var d=new Date(v); if(isNaN(d)) return "-";
  var s=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  if(withTime) s+=" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  return s;
}
function ago(v){
  if(!v) return "기록 없음";
  var ms=Date.now()-new Date(v).getTime();
  if(isNaN(ms)) return "-";
  var d=Math.floor(ms/864e5);
  if(d<=0) return "오늘";
  if(d===1) return "어제";
  if(d<30) return d+"일 전";
  if(d<365) return Math.floor(d/30)+"달 전";
  return Math.floor(d/365)+"년 전";
}
var toastT=null;
function toast(msg,bad){
  var el=$("toast"); el.textContent=msg; el.className="toast show"+(bad?" bad":"");
  clearTimeout(toastT); toastT=setTimeout(function(){ el.className="toast"; },2600);
}
function closeSheet(){ $("sheet").className=""; $("bg").className=""; $("sheet").innerHTML=""; }
function openSheet(html){
  $("sheet").innerHTML=html; $("sheet").className="show"; $("bg").className="show";
  var f=$("sheet").querySelector("input,select,textarea"); if(f) setTimeout(function(){ try{f.focus();}catch(e){} },60);
}
$("bg").onclick=closeSheet;
function confirmBox(title,text,okText,danger,onOk){
  openSheet('<h3>'+esc(title)+'</h3><div class="sub">'+esc(text)+'</div>'+
    '<div class="btns"><button class="btn" id="cNo">취소</button>'+
    '<button class="btn '+(danger?"danger":"primary")+'" id="cYes" style="flex:2">'+esc(okText||"네")+'</button></div>');
  $("cNo").onclick=closeSheet;
  $("cYes").onclick=function(){ closeSheet(); onOk(); };
}

/* =========================================================
   표 만들기 (정렬 · 검색 · 보기 개수 · 틀 고정 · 체크칸)
   ========================================================= */
var TSTATE = {};
function makeTable(o){
  /* o: {id, cols:[{k,label,w,stick,num,html,nosort}], rows, search:[k], checks, bulk, onRow} */
  var st = TSTATE[o.id] || (TSTATE[o.id]={q:"",size:20,page:1,key:o.sortKey||"",dir:o.sortDir||"asc",sel:{}});
  if(!st.f) st.f = {};
  var host = $(o.id);
  if(!host) return;

  function val(r,c){ return c.sortVal ? c.sortVal(r) : r[c.k]; }
  function draw(){
    var rows = (o.rows||[]).slice();
    /* 거르기 — 권한·상태 같은 칸을 골라서 봅니다 */
    (o.filters||[]).forEach(function(f){
      var v = st.f[f.k];
      if(v===undefined || v==="") return;
      rows = rows.filter(function(r){ return String(f.get?f.get(r):r[f.k]) === String(v); });
    });
    /* 검색 */
    var q = st.q.trim().toLowerCase();
    if(q && o.search && o.search.length){
      rows = rows.filter(function(r){
        return o.search.some(function(k){
          return String(r[k]==null?"":r[k]).toLowerCase().indexOf(q)>=0; });
      });
    }
    /* 정렬 */
    if(st.key){
      var col = o.cols.filter(function(c){return c.k===st.key;})[0];
      if(col){
        rows.sort(function(a,b){
          var x=val(a,col), y=val(b,col);
          if(x==null) x=""; if(y==null) y="";
          if(typeof x==="number" && typeof y==="number") return st.dir==="asc"?x-y:y-x;
          x=String(x); y=String(y);
          return st.dir==="asc" ? x.localeCompare(y,"ko") : y.localeCompare(x,"ko");
        });
      }
    }
    var total = rows.length;
    var pages = Math.max(1, Math.ceil(total/st.size));
    if(st.page>pages) st.page=pages;
    var view = rows.slice((st.page-1)*st.size, st.page*st.size);

    var h = '<div class="tbar">'+
      '<input class="q" type="text" id="'+o.id+'_q" placeholder="검색" value="'+esc(st.q)+'">'+
      (o.filters||[]).map(function(f){
        var cur = st.f[f.k]===undefined ? "" : String(st.f[f.k]);
        return '<select class="flt" data-f="'+esc(f.k)+'" title="'+esc(f.label)+'">'+
          f.opts.map(function(op){
            return '<option value="'+esc(op[0])+'"'+(cur===String(op[0])?" selected":"")+'>'+esc(op[1])+'</option>';
          }).join("")+'</select>';
      }).join("")+
      (o.filters&&o.filters.length ? '<button class="btn sm" id="'+o.id+'_fclr">거르기 지우기</button>' : '')+
      '<select id="'+o.id+'_size">'+[5,10,20,30,50].map(function(n){
        return '<option value="'+n+'"'+(st.size===n?" selected":"")+'>'+n+'개씩</option>'; }).join("")+'</select>'+
      (o.bulk?('<button class="btn sm danger" id="'+o.id+'_bulk">선택 처리</button>'):'')+
      '<span class="sp"></span><span class="cnt">전체 '+total+'건</span></div>';

    h += '<div class="twrap"><table><thead><tr>';
    if(o.checks) h += '<th class="ck stick"><input type="checkbox" id="'+o.id+'_all"></th>';
    o.cols.forEach(function(c,i){
      var stick = c.stick && !o.checks;
      var arrow = (st.key===c.k) ? '<i>'+(st.dir==="asc"?"▲":"▼")+'</i>' : '';
      h += '<th data-k="'+esc(c.k)+'" class="'+(c.nosort?"nosort ":"")+(stick?"stick":"")+'"'+
           (c.w?(' style="min-width:'+c.w+'px"'):'')+'>'+esc(c.label)+arrow+'</th>';
    });
    h += '</tr></thead><tbody>';
    if(!view.length){
      h += '</tbody></table><div class="empty">'+
           esc((typeof o.empty==="function"?o.empty(o.rows||[]):o.empty)||"보여드릴 자료가 없습니다.")+'</div></div>';
    }else{
      view.forEach(function(r,ri){
        var rid = o.rowId ? o.rowId(r) : ri;
        h += '<tr data-id="'+esc(rid)+'">';
        if(o.checks) h += '<td class="ck stick"><input type="checkbox" data-ck="'+esc(rid)+'"'+(st.sel[rid]?" checked":"")+'></td>';
        o.cols.forEach(function(c){
          var stick = c.stick && !o.checks;
          var cellv = c.html ? c.html(r) : esc(r[c.k]==null?"":r[c.k]);
          h += '<td class="'+(c.num?"num ":"")+(c.mono?"mono ":"")+(stick?"stick":"")+'">'+cellv+'</td>';
        });
        h += '</tr>';
      });
      h += '</tbody></table></div>';
    }

    /* 쪽 넘기기 */
    if(pages>1){
      h += '<div class="pg"><button id="'+o.id+'_prev"'+(st.page<=1?" disabled":"")+'>이전</button>';
      var from=Math.max(1,st.page-2), to=Math.min(pages,from+4); from=Math.max(1,to-4);
      for(var p=from;p<=to;p++) h += '<button data-p="'+p+'"'+(p===st.page?' class="on"':'')+'>'+p+'</button>';
      h += '<button id="'+o.id+'_next"'+(st.page>=pages?" disabled":"")+'>다음</button>'+
           '<span class="cnt" style="margin-left:6px">'+st.page+' / '+pages+' 쪽</span></div>';
    }
    host.innerHTML = h;
    bind(pages);
  }

  function bind(pages){
    var qi=$(o.id+"_q");
    if(qi) qi.oninput=function(){ st.q=qi.value; st.page=1; var pos=qi.selectionStart; draw();
      var n=$(o.id+"_q"); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} } };
    Array.prototype.forEach.call(host.querySelectorAll("select.flt"),function(sel){
      sel.onchange=function(){ st.f[sel.getAttribute("data-f")]=sel.value; st.page=1; draw(); };
    });
    var fc=$(o.id+"_fclr");
    if(fc) fc.onclick=function(){ st.f={}; st.page=1; draw(); };
    var se=$(o.id+"_size");
    if(se) se.onchange=function(){ st.size=Number(se.value)||20; st.page=1; draw(); };
    var pv=$(o.id+"_prev"); if(pv) pv.onclick=function(){ if(st.page>1){st.page--;draw();} };
    var nx=$(o.id+"_next"); if(nx) nx.onclick=function(){ if(st.page<pages){st.page++;draw();} };
    Array.prototype.forEach.call(host.querySelectorAll(".pg button[data-p]"),function(b){
      b.onclick=function(){ st.page=Number(b.getAttribute("data-p")); draw(); }; });
    Array.prototype.forEach.call(host.querySelectorAll("thead th[data-k]"),function(th){
      if(th.className.indexOf("nosort")>=0) return;
      th.onclick=function(){
        var k=th.getAttribute("data-k");
        if(st.key===k) st.dir = (st.dir==="asc"?"desc":"asc"); else { st.key=k; st.dir="asc"; }
        draw();
      };
    });
    var all=$(o.id+"_all");
    if(all) all.onchange=function(){
      Array.prototype.forEach.call(host.querySelectorAll("input[data-ck]"),function(c){
        c.checked=all.checked; st.sel[c.getAttribute("data-ck")]=all.checked; });
    };
    Array.prototype.forEach.call(host.querySelectorAll("input[data-ck]"),function(c){
      c.onchange=function(){ st.sel[c.getAttribute("data-ck")]=c.checked; }; });
    var bk=$(o.id+"_bulk");
    if(bk) bk.onclick=function(){
      var ids=Object.keys(st.sel).filter(function(k){return st.sel[k];});
      if(!ids.length) return toast("먼저 왼쪽 네모칸을 체크해 주세요",true);
      o.bulk(ids, function(){ st.sel={}; });
    };
    if(o.onRow){
      Array.prototype.forEach.call(host.querySelectorAll("tbody tr[data-id]"),function(tr){
        tr.onclick=function(ev){
          if(ev.target && (ev.target.tagName==="INPUT"||ev.target.tagName==="BUTTON")) return;
          o.onRow(tr.getAttribute("data-id"));
        };
        tr.style.cursor="pointer";
      });
    }
  }
  draw();
}

/* =========================================================
   자료 보관
   ========================================================= */
var D = { me:null, sum:null, shops:[], users:[], pays:[], invites:[], plans:[], sess:[] };
var PLAN_NAME = {trial:"무료 체험"};

function loadAll(){
  return Promise.all([
    api("hqSummary",[]).then(function(r){ D.sum=r; }),
    api("hqShops",[]).then(function(r){ D.shops=(r&&r.shops)||[]; }),
    api("hqUsers",[]).then(function(r){ D.users=(r&&r.users)||[]; }),
    api("hqPayments",[]).then(function(r){ D.pays=(r&&r.payments)||[]; }),
    api("inviteList",[]).then(function(r){ D.invites=(r&&r.invites)||[]; }),
    api("hqPlans",[]).then(function(r){ D.plans=(r&&r.plans)||[];
      PLAN_NAME={trial:"무료 체험"}; D.plans.forEach(function(p){ PLAN_NAME[p.code]=p.name; }); }),
    api("hqSessions",[]).then(function(r){ D.sess=(r&&r.sessions)||[]; },function(){ D.sess=[]; }),
    api("hqServices",[]).then(function(r){ D.svcs=(r&&r.services)||[]; },function(){ D.svcs=[]; }),
    api("hqExpenses",[]).then(function(r){ D.exps=(r&&r.expenses)||[]; },function(){ D.exps=[]; }),
    api("hqInfo",[]).then(function(r){ D.hq=(r&&r.hq)||{}; D.hasPopbill=!!(r&&r.hasPopbill); },
      function(){ D.hq={}; }),
    api("hqPacks",[]).then(function(r){ D.packs=(r&&r.packs)||[]; },function(){ D.packs=[]; }),
    api("hqTopups",[]).then(function(r){ D.topups=(r&&r.topups)||[]; },function(){ D.topups=[]; })
  ]);
}

/* =========================================================
   화면 — 요약
   ========================================================= */
function viewSummary(){
  var s = D.sum || {};

  /* 손봐야 할 것 먼저 모읍니다 (위쪽 칸에서도 씁니다) */
  var todo = [];
  (D.shops||[]).forEach(function(s2){
    if(s2.shop==="ADMIN") return;
    if(s2.active===false) todo.push(["멈춘 업체", s2.name+" — 이용이 멈춰 있습니다", "shops"]);
    if(s2.paid_until && new Date(s2.paid_until).getTime() < Date.now())
      todo.push(["내는 날 지남", s2.name+" — "+dt(s2.paid_until)+"까지였습니다", "pays"]);
  });
  (D.pays||[]).filter(function(p){return p.status==="ready";}).forEach(function(p){
    todo.push(["못 받은 돈", (p.shopName||p.biz_name||"")+" "+won(p.amount)+" ("+(p.period||"기간 없음")+")", "pays"]);
  });
  (D.plans||[]).forEach(function(p){
    if(p.active && !p.price) todo.push(["요금 미정", p.name+" 요금제 금액이 0원입니다", "plans"]);
  });
  (D.svcs||[]).filter(function(v){return v.active!==false;}).forEach(function(v){

/* 운영 서비스 하나의 상태를 봅니다 — {lv, txt}  lv: 0 넉넉 / 1 곧 / 2 급함 */
function svcState(v){
  var lv=0, txt="", day=864e5;
  if(v.kind==="charge"){
    var bal=Number(v.balance||0), min=Number(v.min_bal||0);
    txt = won(bal)+" 남음";
    if(min>0 && bal<=min) lv=2;
    else if(min>0 && bal<=min*2) lv=1;
    if(lv===2) txt += " — 충전이 필요합니다";
  }
  if(v.next_due){
    var left = Math.ceil((new Date(v.next_due+"T00:00:00").getTime()-Date.now())/day);
    var wd = Number(v.warn_days||14);
    var dtxt = left<0 ? ("기한 "+(-left)+"일 지남") : (left===0 ? "오늘까지" : ("D-"+left));
    txt = (txt?txt+" · ":"")+dtxt;
    if(left<0) lv=2; else if(left<=wd) lv=Math.max(lv,1);
  }
  if(!txt) txt = (v.kind==="sub"?"매달 결제":"확인 필요");
  if(v.auto && v.auto_err) { lv=Math.max(lv,1); txt = "자동 읽기 실패 — "+v.auto_err; }
  else if(v.auto_note && v.kind!=="charge" && !v.next_due) txt = v.auto_note;
  return {lv:lv, txt:txt, note:(v.auto?(v.auto_note||""):"")};
}
function svcPill(lv){
  return lv===2 ? '<span class="pill off">급함</span>'
       : lv===1 ? '<span class="pill wait">곧</span>'
                : '<span class="pill ok">넉넉</span>';
}

/* 오늘 날짜를 «9월 25일 (목)» 처럼 적습니다 */
function dtFull(){
  var d = new Date(), w = ["일","월","화","수","목","금","토"][d.getDay()];
  return (d.getMonth()+1)+"월 "+d.getDate()+"일 ("+w+")";
}

/* 이 업체의 문자·계산서 총량과 남은 량을 계산합니다
   무료(요금제 또는 체험분) → 충전분 → 여유분 20건 순서로 씁니다 */
function usageOf(r){
  var trial = !r.plan || r.plan==="trial";
  var pl = (D.plans||[]).filter(function(p){return p.code===r.plan;})[0] || {};
  var smsFree = trial ? Number(r.trial_sms==null?300:r.trial_sms) : Number(pl.sms_free||0);
  var taxFree = trial ? Number(r.trial_tax==null?20:r.trial_tax)  : Number(pl.tax_free||0);
  var smsUsed = Number(r.sms_used||0), taxUsed = Number(r.tax_used||0);
  var smsPaid = Number(r.sms_paid||0), taxPaid = Number(r.tax_paid||0);
  var spareMax = Number(r.spare_max==null?20:r.spare_max), spareUsed = Number(r.spare_used||0);
  return {
    trial:trial,
    smsFree:smsFree, smsUsed:Math.min(smsUsed,smsFree), smsPaid:smsPaid,
    smsLeft:Math.max(0,smsFree-smsUsed)+smsPaid,
    smsTotal:smsFree+smsPaid,
    taxFree:taxFree, taxUsed:Math.min(taxUsed,taxFree), taxPaid:taxPaid,
    taxLeft:Math.max(0,taxFree-taxUsed)+taxPaid,
    taxTotal:taxFree+taxPaid,
    spareLeft:Math.max(0,spareMax-spareUsed), spareMax:spareMax
  };
}
/* 건수를 「1,000건」처럼 적습니다 (금액이 아닙니다) */
function cnt(n){ return Number(n||0).toLocaleString("ko-KR")+"건"; }
/* 「342건 / 500건」처럼 남은 량과 총량을 같이 보여 줍니다 */
function useCell(left,total,extra){
  if(total===0) return '<span style="color:var(--muted)">못 씀</span>';
  var col = left===0 ? "var(--danger)" : (left<=total*0.1 ? "var(--warn)" : "var(--text)");
  return '<b style="color:'+col+'">'+cnt(left)+'</b><span style="color:var(--muted)"> / '+cnt(total)+'</span>'+
         (extra?'<div style="font-size:11px;color:var(--muted)">'+esc(extra)+'</div>':'');
}

function usageBoxBind(code){

    var qty=Number($("sTopQty").value)||0;
    if(!qty) return toast("건수를 적어주세요",true);
    api("hqTopup",[code,{ kind:$("sTopKind").value, qty:qty,
      amount:Number($("sTopAmt").value)||0, memo:$("sTopMemo").value.trim() }])
      .then(function(r){ return loadAll().then(function(){ return r; }); })
      .then(function(r){ toast((r&&r.kind==="tax"?"계산서 ":"문자 ")+(r&&r.qty)+"건을 넣었습니다"); shopSheet(code); })

      '<input type="text" id="dName" placeholder="'+esc(s.name)+'">'+
      '<div class="btns"><button class="btn" id="dNo">취소</button>'+
      '<button class="btn danger" id="dYes" style="flex:2">지우기</button></div>');

      api("hqShopDel",[code,$("dName").value]).then(function(){ return loadAll(); })
        .then(function(){ closeSheet(); toast("지웠습니다"); render(); })
        .catch(function(e){ toast(e.message,true); });
    };
  };
}

         return [s2.shop, s2.name||s2.shop]; }))},

      {k:"active", label:"상태", get:function(r){ return r.active===false?"off":"on"; },
       opts:[["","상태 전체"],["on","쓰는 중"],["off","정지"]]},

         if(!r.last_login) return "never";

       opts:[["","접속 전체"],["today","오늘"],["w1","7일 이내"],["m1","30일 이내"],["old","30일 넘음"],["never","한 번도 없음"]]},
      {k:"_made", label:"만든 날", get:function(r){

         return d<7?"w1":(d<30?"m1":"old"); },
       opts:[["","만든 날 전체"],["w1","최근 7일"],["m1","최근 30일"],["old","30일 넘음"]]}
    ],
    cols:[

      {k:"phone", label:"아이디", w:140, mono:true, html:function(r){ return esc(phoneFmt(r.phone)); }},
      {k:"role", label:"권한", w:90, html:function(r){

      {k:"active", label:"상태", w:80, sortVal:function(r){ return r.active===false?0:1; },

      {k:"last_login", label:"마지막 접속", w:110, html:function(r){ return esc(ago(r.last_login)); }},

      '<button class="btn primary" id="uSave" style="flex:2">저장</button></div>'+

function planForm(code){

    name:$("pl_n_"+code).value.trim(),

    seats:Number($("pl_s_"+code).value)||0,
    pcMax:Number($("pl_pc_"+code).value)||0,
    staffPc:$("pl_sp_"+code).value==="1",
    smsFree:Number($("pl_sf_"+code).value)||0,
    taxFree:Number($("pl_tf_"+code).value)||0,
    active:$("pl_a_"+code).value==="1" };
}
/* 요금제 한눈에 비교표 */
function planCmp(){
  var ps = (D.plans||[]);
  if(!ps.length) return "";
  function lim(n){ n=Number(n||0); return n?cnt(n).replace("건","")+"대":"제한 없음"; }
  var rows = [
    ["월 요금", function(p){ return '<b>'+won(p.price||0)+'</b>'; }],
    ["계정 수 (휴대폰)", function(p){ return lim(p.seats); }],
    ["PC 대수", function(p){ return lim(p.pc_max); }],
    ["직원도 PC", function(p){ return p.staff_pc
        ? '<span class="yes">가능</span>' : '<span class="no">휴대폰만</span>'; }],
    ["문자 무료 (달마다)", function(p){ return Number(p.sms_free||0)?cnt(p.sms_free):'<span class="no">없음</span>'; }],
    ["계산서 무료 (달마다)", function(p){ return Number(p.tax_free||0)?cnt(p.tax_free):'<span class="no">못 씀</span>'; }],
    ["가입 화면", function(p){ return p.active
        ? '<span class="yes">보임</span>' : '<span class="no">숨김</span>'; }]
  ];
  var h = '<div class="twrap cmpWrap"><table class="cmp"><thead><tr><th class="stick">항목</th>'+
    ps.map(function(p){ return '<th>'+esc(p.name)+'</th>'; }).join("")+'</tr></thead><tbody>';
  rows.forEach(function(r){
    h += '<tr><td class="stick">'+esc(r[0])+'</td>'+
      ps.map(function(p){ return '<td>'+r[1](p)+'</td>'; }).join("")+'</tr>';
  });
  h += '</tbody></table></div>';
  return h;
}

var OPS = {};

function gbTxt(b){
  b = Number(b)||0;
  if(b < 1024) return b+" B";
  if(b < 1024*1024) return (b/1024).toFixed(1)+" KB";
  if(b < 1024*1024*1024) return (b/1024/1024).toFixed(1)+" MB";
  return (b/1024/1024/1024).toFixed(2)+" GB";
}

function opsGauge(name, used, capGb, warnPct, sub){
  var cap = capGb*1024*1024*1024;
  var pct = cap>0 ? Math.min(100, used/cap*100) : 0;
  var cls = pct>=95 ? " d" : (pct>=warnPct ? " w" : "");
  return '<div class="gauge"><div class="gh"><span class="gn">'+esc(name)+'</span>'+
    '<span class="gv">'+gbTxt(used)+' / '+capGb+' GB · '+pct.toFixed(1)+'%</span></div>'+
    '<div class="bar'+cls+'"><i style="width:'+Math.max(1,pct).toFixed(1)+'%"></i></div>'+
    (sub?('<div class="gs">'+sub+'</div>'):'')+'</div>';
}

var CALM=null, TODO={list:null};

function calEvents(){
  var ev=[];
  (D.svcs||[]).filter(function(v){ return v.active!==false && v.next_due; }).forEach(function(v){
    ev.push({d:String(v.next_due).slice(0,10),
      t:v.name+(Number(v.cost||0)?(" "+won(v.cost)):"")+" 결제", c:"w", go:"svc"});
  });
  (D.shops||[]).forEach(function(x){
    if(x.shop==="ADMIN") return;
    var isT=!x.plan||x.plan==="trial";
    if(isT && x.trial_until) ev.push({d:String(x.trial_until).slice(0,10), t:(x.name||x.shop)+" 체험 끝", c:"d", go:"shops"});
    else if(x.paid_until)    ev.push({d:String(x.paid_until).slice(0,10), t:(x.name||x.shop)+" 이용기한", c:"", go:"shops"});
  });
  ((TODO.list)||[]).filter(function(t){ return t.due_at && !t.done; }).forEach(function(t){
    ev.push({d:String(t.due_at).slice(0,10), t:t.title, c:"g", go:"sum"});
  });
  return ev;
}
function calHtml(){
  var now=new Date();
  if(!CALM) CALM=new Date(now.getFullYear(), now.getMonth(), 1);
  var y=CALM.getFullYear(), m=CALM.getMonth();
  var first=new Date(y,m,1), last=new Date(y,m+1,0), start=new Date(y,m,1-first.getDay());
  function ds(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  var todayS=ds(now), byDay={};
  calEvents().forEach(function(e){ (byDay[e.d]||(byDay[e.d]=[])).push(e); });

  var h='<div class="cal"><div class="calHd">'+
    '<h3>'+y+'년 '+(m+1)+'월 일정</h3>'+
    '<span style="display:inline-flex;gap:6px">'+
      '<button class="btn sm" id="calPrev">‹ 지난달</button>'+
      '<button class="btn sm" id="calNow">이번 달</button>'+
      '<button class="btn sm" id="calNext">다음달 ›</button></span>'+
    '<span class="sp"></span><span class="cnt">결제일 · 이용기한 · 체험 끝나는 날</span></div>'+
    '<div class="calGrid">'+["일","월","화","수","목","금","토"].map(function(d){
      return '<div class="dow">'+d+'</div>'; }).join("");
  var cur=new Date(start), guard=0;
  while(guard++<42){
    var k=ds(cur), cls="calCell";
    if(cur.getMonth()!==m) cls+=" out";
    if(k===todayS) cls+=" today";
    if(cur.getDay()===0) cls+=" sun";
    if(cur.getDay()===6) cls+=" sat";
    var list=byDay[k]||[];
    h+='<div class="'+cls+'"><span class="d">'+cur.getDate()+'</span>'+
      list.slice(0,3).map(function(e){
        return '<span class="calEv '+e.c+'" data-go="'+esc(e.go)+'" title="'+esc(e.t)+'">'+esc(e.t)+'</span>'; }).join("")+
      (list.length>3?'<span class="calEv x">외 '+(list.length-3)+'건</span>':'')+'</div>';
    cur.setDate(cur.getDate()+1);
    if(cur>last && cur.getDay()===0) break;
  }
  h+='</div><div class="calLg">'+
    '<span><i style="background:var(--warn)"></i>유지비 결제일</span>'+
    '<span><i style="background:var(--blue)"></i>업체 이용기한</span>'+

function todoBind(){

      api("hqTodoDone",[Number(c.getAttribute("data-id")), c.checked])

  $("main").innerHTML='<h2 class="sec">카드 결제</h2>'+
    '<p class="lead">PG사 승인이 나면 여기서 켜기만 하면 됩니다. 켜는 순간부터 업체가 앱에서 카드로 충전·요금 결제를 할 수 있습니다.</p>'+
    '<div class="tbar"><button class="btn primary sm" id="pgGo">다시 불러오기</button>'+

    '<div id="pgBody"><div class="hint">불러오는 중입니다…</div></div>';

function pgLoad(){
  if(PG.busy) return; PG.busy=true;
  api("hqPg",[]).then(function(r){
    PG.loaded=true; PG.err="";
    PG.on=!!(r&&r.on); PG.provider=(r&&r.provider)||"toss";
    PG.clientKey=(r&&r.clientKey)||""; PG.fee=Number((r&&r.fee)||0);
    PG.note=(r&&r.note)||""; PG.hasSecret=!!(r&&r.hasSecret);
    PG.orders=(r&&r.orders)||[]; PG.names=(r&&r.names)||{};
    PG.at=new Date().toISOString();
  },function(e){ PG.loaded=true; PG.err=e.message||"불러오지 못했습니다"; })
  .then(function(){ PG.busy=false;
    var at=$("pgAt"); if(at) at.textContent=PG.at?("마지막 확인 "+dtTime(PG.at)):"";
    pgDraw(); });
}

  $("pgSw").onclick=function(){

function viewSec(){
  var h = '<h2 class="sec">보안 점검</h2>'+
    '<p class="lead">차곳간이 지금 어떤 상태인지 한 번에 봅니다. '+
    '「지금 다시 확인」을 누르면 서버에 직접 물어봅니다.</p>'+
    '<div class="tbar"><button class="btn primary" id="secGo">지금 다시 확인</button>'+
      '<span class="sp"></span><span class="cnt" id="secAt">'+

    '<div id="secBody"></div>';
  $("main").innerHTML = h;

function dtTime(iso){
  if(!iso) return "-";
  var d=new Date(iso);
  return (d.getMonth()+1)+"월 "+d.getDate()+"일 "+
    String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}

function secLoad(){
  if(SEC.busy) return;
  SEC.busy = true;
  var b=$("secGo"); if(b){ b.disabled=true; b.textContent="확인하는 중…"; }
  api("hqSecurity",[]).then(function(r){
    SEC.checks = (r&&r.checks)||[];
    SEC.state  = (r&&r.state)||{};
    SEC.at     = (r&&r.at)||new Date().toISOString();
    SEC.ver    = (r&&r.ver)||"";
  },function(e){
    SEC.checks = null;
    toast(e.message||"확인하지 못했습니다",true);
  }).then(function(){
    SEC.busy=false;
    var b2=$("secGo"); if(b2){ b2.disabled=false; b2.textContent="지금 다시 확인"; }
    var at=$("secAt"); if(at) at.textContent = SEC.at?("마지막 확인 "+dtTime(SEC.at)):"확인하지 못했습니다";
    secDraw();
  });
}

function secDraw(){
  var host=$("secBody"); if(!host) return;
  var c = SEC.checks;
  var h = "";

  if(!c){
    h += '<div class="hint">아직 확인 전입니다. 위의 「지금 다시 확인」을 눌러 주세요.<br>'+
         '「보안 점검 기록」 같은 말이 나오면 보안점검 SQL 을 아직 안 돌리신 것입니다.</div>';
  }else{
    var bad=c.filter(function(x){return x.lv===2;}).length;
    var warn=c.filter(function(x){return x.lv===1;}).length;
    var ok=c.filter(function(x){return x.lv===0;}).length;
    h += '<div class="secTop">'+
      '<div class="kbox'+(bad?' warn':'')+'"><span class="t">지금 위험</span>'+
        '<span class="v" style="display:block;color:'+(bad?'var(--danger)':'var(--text)')+'">'+bad+'건</span>'+
        '<span class="s" style="display:block">'+(bad?'바로 손보셔야 합니다':'없습니다')+'</span></div>'+
      '<div class="kbox'+(warn?' warn':'')+'"><span class="t">한 번 봐주실 것</span>'+
        '<span class="v" style="display:block;color:'+(warn?'var(--warn)':'var(--text)')+'">'+warn+'건</span>'+
        '<span class="s" style="display:block">'+(warn?'급하지는 않습니다':'없습니다')+'</span></div>'+
      '<div class="kbox"><span class="t">잘 되어 있는 것</span>'+
        '<span class="v" style="display:block;color:var(--good)">'+ok+'건</span>'+
        '<span class="s" style="display:block">서버 '+esc(SEC.ver||"")+'</span></div>'+
    '</div>';

    var groups=[];
    c.forEach(function(x){ if(groups.indexOf(x.group)<0) groups.push(x.group); });
    groups.forEach(function(g){
      h += '<div class="card"><div class="secGrp">'+esc(g)+'</div>';
      c.filter(function(x){return x.group===g;})
       .sort(function(a,b){ return b.lv-a.lv; })
       .forEach(function(x){
         h += '<div class="secRow lv'+x.lv+'"><span class="dot"></span><div class="bd">'+
              '<div class="nm">'+esc(x.name)+'</div>'+
              '<div class="tx">'+esc(x.txt)+'</div>'+
              (x.how?'<div class="how">→ '+esc(x.how)+'</div>':'')+
              '</div><span class="pill '+(x.lv===2?'off':(x.lv===1?'wait':'ok'))+'">'+
              secPill(x.lv)+'</span></div>';
       });
      h += '</div>';
    });
  }

  /* 손으로 확인하는 목록 */
  var st = SEC.state||{};
  var doneN = SEC_MANUAL.filter(function(m){return st[m[0]];}).length;
  h += '<div class="card"><div class="todoHd">'+
       '<span class="'+(doneN===SEC_MANUAL.length?"dotOk":"dotWarn")+'"></span>'+
       '<h2>손으로 확인하는 것 ('+doneN+' / '+SEC_MANUAL.length+')</h2></div>'+
       '<p class="lead" style="margin:2px 0 12px">직접 눌러 봐야 아는 것들입니다. '+
       '확인하신 것은 네모를 눌러 표시해 두세요 — 누가 언제 확인했는지 같이 남습니다.</p>';
  SEC_MANUAL.forEach(function(m){
    var d = st[m[0]];
    h += '<label class="secChk'+(d?' on':'')+'" data-m="'+esc(m[0])+'">'+
         '<input type="checkbox"'+(d?' checked':'')+'>'+
         '<span class="bd"><span class="nm">'+esc(m[1])+'</span>'+
         '<div class="tx">'+esc(m[2])+'</div>'+
         (d?'<div class="dn">✔ '+dtTime(d.at)+' 확인'+(d.who?(" · "+esc(phoneFmt(d.who))):"")+'</div>':'')+
         '</span></label>';
  });
  h += '</div>';

  host.innerHTML = h;
  Array.prototype.forEach.call(host.querySelectorAll("label.secChk"),function(el){
    var box = el.querySelector("input");
    box.onchange = function(){
      var k = el.getAttribute("data-m"), on = box.checked;
      box.disabled = true;
      api("hqSecSave",[k,on]).then(function(r){
        SEC.state = (r&&r.state)||SEC.state;
        secDraw();
      },function(e){
        box.checked = !on; box.disabled = false;
        toast(e.message||"저장하지 못했습니다",true);
      });
    };
  });
}

      {k:"balance", label:"지금 남은 돈", w:110, num:true, html:function(r){

      {k:"next_due", label:"다음 결제일", w:110, html:function(r){
        return r.next_due ? esc(r.next_due) : '<span style="color:var(--muted)">-</span>'; }},
      {k:"_st", label:"상태", w:150, nosort:true, html:function(r){

      {k:"auto", label:"읽는 법", w:90, html:function(r){

      {k:"auto_note", label:"읽어온 내용", w:230, html:function(r){
        return esc(r.auto_err || r.auto_note || "-"); }},
      {k:"auto_at", label:"마지막 확인", w:110, html:function(r){ return esc(ago(r.auto_at||r.balance_at)); }},
      {k:"active", label:"쓰는 중", w:80, html:function(r){
        return r.active===false ? '<span class="pill off">안 씀</span>' : '<span class="pill ok">씀</span>'; }}
    ]
  });
  $("svAdd").onclick = function(){ svcSheet(""); };
  $("svRef").onclick = svcRefresh;

function svcRefresh(){
  toast("연결된 곳에 물어보는 중…");
  api("hqSvcRefresh",[]).then(function(r){
    return loadAll().then(function(){
      var ok=(r&&r.done)||[], bad=(r&&r.failed)||[];
      render();
      if(bad.length) openSheet('<h3>상태를 새로 받았습니다</h3>'+
        '<div class="sub">'+ok.length+'곳 성공 · '+bad.length+'곳 실패</div>'+
        (ok.length?('<label class="f">잘 읽은 곳</label><div class="hint">'+
          ok.map(function(x){return esc(x);}).join("<br>")+'</div>'):'')+
        '<label class="f">못 읽은 곳</label><div class="hint" style="color:var(--warn)">'+
          bad.map(function(x){return esc(x);}).join("<br>")+'</div>'+
        '<div class="hint" style="margin-top:10px">열쇠를 넣어 달라는 말이 보이면, 수파베이스 Edge Functions → Secrets 에 그 이름으로 넣어 주세요. 넣기 전까지는 그 줄만 직접 적으시면 됩니다.</div>'+
        '<div class="btns"><button class="btn primary" id="rOk" style="flex:1">닫기</button></div>');
      else toast(ok.length+"곳 상태를 새로 받았습니다");
      if($("rOk")) $("rOk").onclick=closeSheet;
    });
  }).catch(function(e){ toast(e.message,true); });
}

function svcSheet(code){

  function kOpt(k,t){ return '<option value="'+k+'"'+(v.kind===k?" selected":"")+'>'+t+'</option>'; }
  openSheet(
    '<h3>'+(isNew?"서비스 넣기":esc(v.name))+'</h3>'+
    '<div class="sub">'+(isNew?"돈을 내야 하는 곳을 하나 더 넣습니다":("코드 "+esc(v.code)))+'</div>'+
    (isNew?'<label class="f">영문 코드 (예: naver)</label><input type="text" id="vCode" placeholder="naver">':'')+

    '<label class="f">무엇에 쓰는지</label><input type="text" id="vWhat" value="'+esc(v.what||"")+'">'+
    '<label class="f">충전·결제하러 가는 주소</label><input type="text" id="vUrl" value="'+esc(v.url||"")+'" placeholder="https://...">'+
    '<div class="row2">'+
      '<div><label class="f">돈 내는 방식</label><select id="vKind">'+
        kOpt("charge","충전식 — 미리 넣어두고 씁니다")+kOpt("sub","매달 결제 — 카드에서 빠집니다")+
        kOpt("renew","연장 — 기한이 오면 다시 냅니다")+'</select></div>'+
      '<div><label class="f">다음 결제일 · 만료일</label><input type="date" id="vDue" value="'+
        esc(v.next_due||"")+'"></div>'+
    '</div>'+
    '<div class="row2">'+
      '<div><label class="f">지금 남은 돈 (원)</label><input type="number" id="vBal" value="'+(v.balance||0)+'"></div>'+
      '<div><label class="f">한 번에 나가는 돈 (원)</label><input type="number" id="vCost" value="'+(v.cost||0)+'"></div>'+
    '</div>'+
    '<div class="row2">'+
      '<div><label class="f">이 돈 밑이면 알림 (원)</label><input type="number" id="vMin" value="'+(v.min_bal||0)+'"></div>'+
      '<div><label class="f">기한 며칠 전부터 알림</label><input type="number" id="vWarn" value="'+(v.warn_days||14)+'"></div>'+
    '</div>'+
    '<div class="row2">'+
      '<div><label class="f">자동으로 읽기</label><select id="vAuto">'+
        '<option value="1"'+(v.auto?" selected":"")+'>켬 — 서버가 직접 물어봅니다</option>'+
        '<option value="0"'+(!v.auto?" selected":"")+'>끔 — 내가 직접 적습니다</option></select></div>'+
      '<div><label class="f">읽은 값 (도메인일 때만)</label><input type="text" id="vRef" value="'+esc(v.ref||"")+'" placeholder="cgg.co.kr"></div>'+
    '</div>'+
    (v.auto_note?('<div class="hint">마지막으로 읽은 것 — '+esc(v.auto_note)+' ('+esc(ago(v.auto_at))+')</div>'):'')+
    (v.auto_err?('<div class="hint" style="color:var(--warn)">못 읽음 — '+esc(v.auto_err)+'</div>'):'')+

      '<option value="1"'+(v.active!==false?" selected":"")+'>씁니다</option>'+

    '<label class="f">메모</label><textarea id="vMemo" rows="2">'+esc(v.memo||"")+'</textarea>'+

     .then(function(){ closeSheet(); toast("저장했습니다"); render(); })
     .catch(function(e){ toast(e.message,true); });

  if($("vDel")) $("vDel").onclick = function(){
    confirmBox("서비스 지우기", v.name+" 를 목록에서 뺍니다. 지출 기록은 그대로 남습니다.","지우기",true,function(){
      api("hqSvcDel",[code]).then(function(){ return loadAll(); })

var SETTLE_YEAR = String(new Date().getFullYear());
function viewSettle(){
  $("main").innerHTML = '<h2 class="sec">정산</h2>'+
    '<p class="lead">달마다 업체에서 받은 돈과 유지비로 나간 돈을 견줍니다.</p>'+
    '<div class="card"><div class="empty">불러오는 중…</div></div>';
  api("hqSettle",[SETTLE_YEAR]).then(function(r){
    var ms = (r&&r.months)||[], inc=(r&&r.income)||0, exp=(r&&r.expense)||0, prof=inc-exp;
    var yNow = new Date().getFullYear(), yOpt="";
    for(var y=yNow; y>=yNow-4; y--) yOpt += '<option value="'+y+'"'+(String(y)===SETTLE_YEAR?" selected":"")+'>'+y+'년</option>';

    var h = '<h2 class="sec">정산</h2>'+
      '<p class="lead">달마다 업체에서 받은 돈과 유지비로 나간 돈을 견줍니다.</p>'+
      '<div class="tbar"><select id="stYear" style="max-width:130px">'+yOpt+'</select>'+
        '<button class="btn primary" id="exAdd">＋ 지출 적기</button>'+
        '<span class="cnt">솔라피 충전·가비아 연장처럼 나간 돈을 여기에 적어두면 아래 표에 바로 반영됩니다</span></div>'+
      '<div class="dash"><div class="dRow money">'+
        '<button class="kbox hl" data-none><span class="t">'+SETTLE_YEAR+'년 번 돈</span>'+
          '<span class="v" style="display:block">'+esc(won(inc))+'</span>'+
          '<span class="s" style="display:block">업체에서 받은 돈</span></button>'+
        '<button class="kbox" data-none><span class="t">'+SETTLE_YEAR+'년 쓴 돈</span>'+
          '<span class="v" style="display:block">'+esc(won(exp))+'</span>'+
          '<span class="s" style="display:block">유지비로 나간 돈</span></button>'+
        '<button class="kbox '+(prof<0?"warn":"")+'" data-none><span class="t">'+SETTLE_YEAR+'년 남은 것</span>'+
          '<span class="v" style="display:block">'+esc(won(prof))+'</span>'+
          '<span class="s" style="display:block">'+(prof<0?"적자입니다":"번 돈 − 쓴 돈")+'</span></button>'+
      '</div></div>';

    h += '<div class="card"><h2 class="sec" style="font-size:17px">달마다 보기</h2>';
    if(!ms.length) h += '<div class="empty">'+SETTLE_YEAR+'년에는 아직 기록이 없습니다.</div>';
    else {
      h += '<div style="overflow:auto"><table class="stl"><thead><tr>'+
        '<th>달</th><th>번 돈</th><th>건수</th><th>쓴 돈</th><th>남은 것</th></tr></thead><tbody>';
      ms.forEach(function(m){
        h += '<tr><td><b>'+esc(m.ym)+'</b></td><td>'+esc(won(m.income))+'</td>'+
          '<td>'+(m.cnt||0)+'건</td><td>'+esc(won(m.expense))+'</td>'+
          '<td'+(m.profit<0?' class="minus"':'')+'>'+esc(won(m.profit))+'</td></tr>';
      });
      h += '</tbody><tfoot><tr><td>합계</td><td>'+esc(won(inc))+'</td><td>-</td>'+
        '<td>'+esc(won(exp))+'</td><td'+(prof<0?' class="minus"':'')+'>'+esc(won(prof))+'</td>'+
        '</tr></tfoot></table></div>';
    }
    h += '</div>';

    h += '<div class="card"><h2 class="sec" style="font-size:17px">지출 적은 것</h2>'+
      '<p class="lead" style="margin:2px 0 10px">줄 끝의 지우기를 누르면 그 기록만 지워집니다.</p><div id="tExp"></div></div>';
    $("main").innerHTML = h;

    $("stYear").onchange = function(){ SETTLE_YEAR=this.value; viewSettle(); };
    $("exAdd").onclick = function(){ expSheet(); };
    makeTable({
      id:"tExp", rows:(D.exps||[]), search:["name","memo","period"], sortKey:"paid_at", sortDir:"desc",
      rowId:function(r){ return String(r.id); },
      cols:[
        {k:"paid_at", label:"낸 날", w:110, stick:true},
        {k:"name", label:"무엇에", w:200, html:function(r){ return '<b>'+esc(r.name)+'</b>'; }},
        {k:"svc", label:"서비스", w:130, html:function(r){
          var v=(D.svcs||[]).filter(function(x){return x.code===r.svc;})[0];
          return esc(v?v.name:(r.svc||"-")); }},
        {k:"amount", label:"금액", w:110, num:true, html:function(r){ return esc(won(r.amount)); }},
        {k:"period", label:"어느 달치", w:100},
        {k:"memo", label:"메모", w:180},
        {k:"_d", label:"", w:80, nosort:true, html:function(r){
          return '<button class="btn sm danger" data-ex="'+r.id+'">지우기</button>'; }}
      ]
    });
    Array.prototype.forEach.call($("main").querySelectorAll("button[data-ex]"), function(b){
      b.onclick = function(ev){
        ev.stopPropagation();
        api("hqExpenseDel",[b.getAttribute("data-ex")]).then(function(){ return loadAll(); })
          .then(function(){ toast("지웠습니다"); viewSettle(); })
          .catch(function(e){ toast(e.message,true); });
      };
    });
  }).catch(function(e){
    $("main").innerHTML = '<h2 class="sec">정산</h2><div class="card"><div class="empty">'+esc(e.message)+'</div></div>';
  });
}

function expSheet(){
  var today = new Date().toISOString().slice(0,10);
  var opts = '<option value="">(고르지 않음)</option>' + (D.svcs||[]).map(function(v){
    return '<option value="'+esc(v.code)+'">'+esc(v.name)+'</option>'; }).join("");
  openSheet(
    '<h3>지출 적기</h3><div class="sub">유지비로 실제로 낸 돈을 적습니다</div>'+
    '<label class="f">어느 서비스</label><select id="eSvc">'+opts+'</select>'+
    '<label class="f">무엇에 쓴 돈인지</label><input type="text" id="eName" placeholder="예: 솔라피 문자 충전">'+
    '<div class="row2">'+
      '<div><label class="f">금액 (원)</label><input type="number" id="eAmt" placeholder="100000"></div>'+
      '<div><label class="f">낸 날</label><input type="date" id="eDate" value="'+today+'"></div>'+
    '</div>'+
    '<label class="f">어느 달치</label><input type="text" id="ePer" value="'+today.slice(0,7)+'" placeholder="2026-09">'+
    '<label class="f">충전식이면 남은 돈도 그만큼 올릴까요?</label>'+
    '<select id="eAdd"><option value="1">네, 올려주세요</option><option value="0">아니요</option></select>'+
    '<div class="hint" id="eAddHint"></div>'+
    '<label class="f">메모</label><textarea id="eMemo" rows="2"></textarea>'+
    '<div class="btns"><button class="btn" id="eCancel">취소</button>'+
      '<button class="btn primary" id="eSave" style="flex:2">적기</button></div>'
  );
  function eSync(){
    var code=$("eSvc").value;
    var v=(D.svcs||[]).filter(function(x){return x.code===code;})[0];
    if(v && !$("eName").value.trim()) $("eName").value = v.name;
    if(v && v.cost && !$("eAmt").value) $("eAmt").value = v.cost;
    var auto = !!(v && v.auto);
    $("eAdd").value = auto ? "0" : "1";
    $("eAdd").disabled = auto;
    $("eAddHint").innerHTML = auto
      ? '이 곳은 <b>자동으로 읽는 곳</b>이라 남은 돈은 건드리지 않습니다. 실제 잔액은 「연결된 곳 상태 새로 받기」로 맞춰집니다.'
      : '직접 적는 곳이라, 충전한 만큼 남은 돈을 올려둘 수 있습니다.';
  }
  $("eSvc").onchange = eSync;
  eSync();
  $("eCancel").onclick = closeSheet;
  $("eSave").onclick = function(){
    var o = { svc:$("eSvc").value, name:$("eName").value.trim(), amount:Number($("eAmt").value)||0,
      paidAt:$("eDate").value, period:$("ePer").value.trim(), memo:$("eMemo").value.trim(),
      addBalance:$("eAdd").value==="1" };
    if(!o.name) return toast("무엇에 쓴 돈인지 적어주세요",true);
    if(!o.amount) return toast("금액을 적어주세요",true);
    api("hqExpenseAdd",[o]).then(function(r){
      return loadAll().then(function(){ return r; });
    }).then(function(r){
      closeSheet();
      toast((r&&r.note) ? r.note : "적었습니다");
      viewSettle();
    }).catch(function(e){ toast(e.message,true); });
  };
}

var TAXLOG={ rows:null, busy:false };
var TAXHQ={ open:null };
function taxLogLoad(force){
  var box=document.getElementById("tLog"); if(!box) return;
  if(TAXLOG.rows && !force){ taxLogDraw(); return; }
  if(TAXLOG.busy) return;
  TAXLOG.busy=true;
  api("hqTaxLog",[]).then(function(r){
    TAXLOG.rows=(r&&r.logs)||[];
    if(r&&r.warn) toast("기록을 읽다가 막혔습니다: "+r.warn,true);
  }).catch(function(e){
    TAXLOG.rows=[];
    var b=document.getElementById("tLog");
    if(b) b.innerHTML='<div class="hint" style="color:var(--danger)">'+esc(e.message||"불러오지 못했습니다")+'</div>';
  }).then(function(){ TAXLOG.busy=false; if(TAXLOG.rows) taxLogDraw(); });
}
function taxLogDraw(){
  var box=document.getElementById("tLog"); if(!box) return;
  var rows=(TAXLOG.rows||[]).slice();
  if(box.innerHTML.indexOf('id="tLogT"')<0) box.innerHTML='<div id="tLogT"></div>';

function bizFmt(v){
  var d=String(v||"").replace(/[^0-9]/g,"");
  return d.length===10 ? d.slice(0,3)+"-"+d.slice(3,5)+"-"+d.slice(5) : (v||"");
}

function taxSend(sh,code,v,force){
  toast(force?"그대로 다시 보내는 중입니다…":"팝빌로 보내는 중입니다…");
  var body=Object.assign({},v); if(force) body.force=true;
  api("hqTaxIssue",[code,body])
    .then(function(r){
      if(r && r.dup && !force){ closeSheet(); taxDupSheet(sh,code,v,r); return; }
      closeSheet(); taxLogLoad(true); taxDoneSheet(sh,r,"");

    var real = D.hq && D.hq.pb_test===false;
    /* 이 달에 이미 보낸 게 있으면 알려 줍니다 (겹쳐 보내는 사고 막기) */
    var per6=per.replace(/[^0-9]/g,"").slice(0,6);
    var head="CGG"+code+"-"+per6;
    var dup=(TAXLOG.rows||[]).filter(function(r){
      return r.ok && String(r.mgt_key||"").indexOf(head)===0; });
    var dupMsg = dup.length
      ? ("\n\n[알림] "+sh.name+" 에 "+per+" 계산서를 이미 "+dup.length+"장 보냈습니다"+
         (dup[0].nts_no?(" (마지막 승인번호 "+dup[0].nts_no+")"):"")+
         ". 금액과 비고까지 똑같으면 보내기 직전에 한 번 더 물어봅니다.")
      : "";
    confirmBox("계산서 보내기",
      sh.name+" 에 "+won(amt+Math.round(amt/10))+" 짜리 계산서를 보냅니다."+
      (real?" 실제 발행이라 국세청으로 바로 갑니다.":" 지금은 시험 발행이라 국세청에는 가지 않습니다.")+dupMsg,
      dup.length?"그래도 보내기":"보내기", real||!!dup.length, function(){
      taxSend(sh,code,{ amount:amt, period:per, itemName:item, memo:memo });
    });
  };
}

    '끝나자마자 내쫓지 않고, 며칠은 <b>보기만</b> 되게 두었다가 그 뒤에 로그인을 막습니다.</p>'+

  $("lkGo").onclick=lkLoad;

}
function lkLoad(){
  if(LOCK.busy) return; LOCK.busy=true;
  Promise.all([ api("hqLock",[]), api("hqPurgeList",[]).catch(function(){ return null; }) ])
  .then(function(rs){
    var r=rs[0]||{};
    LOCK.loaded=true; LOCK.err="";
    LOCK.cfg=(r&&r.cfg)||{}; LOCK.shops=(r&&r.shops)||[]; LOCK.logs=(r&&r.logs)||[];
    LOCK.today=(r&&r.today)||""; LOCK.purge=(rs[1]&&rs[1].list)||[];
    LOCK.at=new Date().toISOString();
  },function(e){ LOCK.loaded=true; LOCK.err=e.message||"불러오지 못했습니다"; })
  .then(function(){ LOCK.busy=false;
    var at=$("lkAt"); if(at) at.textContent=LOCK.at?("마지막 확인 "+dtTime(LOCK.at)):"";
    lkDraw(); });
}
function lkPill(st){
  return st==="blocked" ? '<span class="pill off">로그인 막힘</span>'

        return r.ready?'<span class="pill off">오늘부터</span>':(r.left+"일"); }},

  /* 기록 표 */
  var W={lock:"잠금 시작",block:"차단 알림",del:"정리 예고",open:"열어 두기",paidsay:"업체가 «입금했습니다»",purge:"자료 정리함"};

  var row=null;
