  if(!row) return;
  var t=new Date(Date.now()+7*864e5).toISOString().slice(0,10);
  openSheet('<h3>'+esc(row.name||code)+' — 열어 두기</h3>'+
    '<p class="lead">이 날짜까지는 잠금·차단과 상관없이 <b>평소처럼 다</b> 쓸 수 있습니다. '+
    '입금은 됐는데 아직 이용기한을 못 늘렸을 때 쓰세요.</p>'+
    '<label class="f" for="lkoD">언제까지 열어 둘까요</label>'+
    '<input type="date" id="lkoD" value="'+esc(row.openUntil||t)+'">'+
    '<label class="f" for="lkoM">왜 열어 두는지 (기록에 남습니다)</label>'+
    '<input type="text" id="lkoM" value="'+esc(row.openMemo||"")+'" placeholder="예) 9/26 입금 확인, 계산서 발행 대기">'+
    '<label class="f" for="lkoL">이 업체만 잠금 일수를 다르게 (비우면 기본값)</label>'+
    '<input type="number" id="lkoL" value="'+esc(row.own===null||row.own===undefined?"":row.own)+'" min="0" max="180" placeholder="비워 두면 기본값">'+
    '<div class="saveRow"><button class="btn primary sm" id="lkoGo">저장</button>'+
    '<button class="btn sm" id="lkoOff">열어 둔 것 취소</button></div>');
  $("lkoGo").onclick=function(){
    var L=$("lkoL").value.trim();
    api("hqLockShop",[code,{ openUntil:$("lkoD").value, memo:$("lkoM").value, lockDays:(L===""?null:Number(L)) }])
    .then(function(){ closeSheet(); toast("저장했습니다"); LOCK.loaded=false; lkLoad(); })
    .catch(function(e){ toast(e.message,true); });
  };
  $("lkoOff").onclick=function(){
    api("hqLockShop",[code,{ openUntil:"", memo:"" }])
    .then(function(){ closeSheet(); toast("취소했습니다"); LOCK.loaded=false; lkLoad(); })
    .catch(function(e){ toast(e.message,true); });
  };
}

/* 자료 정리 — 두 번 확인합니다 */
function lkPurgeBox(code){
  api("hqPurgePeek",[code]).then(function(r){
    var pk=(r&&r.peek)||{}, st=(r&&r.state)||{};
    var nm=st.name||code;
    openSheet('<h3 style="color:var(--danger)">'+esc(nm)+' — 자료 정리</h3>'+
      '<p class="lead">아래 자료가 <b>영영 지워집니다.</b> 되돌릴 수 없습니다.</p>'+
      '<div class="hint" style="background:var(--danger-soft);border-color:#F0B9B4">'+
        '기록 <b>'+(pk.rows>=0?pk.rows:"?")+'</b>줄 · 문자기록 <b>'+(pk.send>=0?pk.send:"?")+'</b>줄 · '+
        '계정 <b>'+(pk.users>=0?pk.users:"?")+'</b>개<br>'+
        '끝난 날 '+esc(st.endAt||"-")+' · 정리 예정일 '+esc(st.delAt||"-")+'</div>'+
      '<label class="f" for="lkpN">지우시려면 업체명을 그대로 적어 주세요</label>'+
      '<input type="text" id="lkpN" placeholder="'+esc(nm)+'">'+
      '<div class="saveRow"><button class="btn sm" id="lkpGo" style="background:var(--danger);border-color:var(--danger);color:#fff">이 업체 자료 지우기</button></div>', nm);
    $("lkpGo").onclick=function(){
      api("hqPurgeRun",[code,$("lkpN").value])
      .then(function(){ closeSheet(); toast("정리했습니다"); LOCK.loaded=false; lkLoad(); })
      .catch(function(e){ toast(e.message,true); });
    };
  }).catch(function(e){ toast(e.message,true); });
}


/* ══════════════════════════════════════════════════════════
   공지사항 — 한 번 쓰면 앱과 홈페이지에 같이 올라갑니다
   ══════════════════════════════════════════════════════════ */
var NOTI = {};
var NKIND = {update:"업데이트", price:"요금", etc:"기타"};
var NWHERE = {both:"앱 + 홈페이지", app:"앱만", home:"홈페이지만"};

function viewNotice(){
  $("main").innerHTML='<h2 class="sec">공지사항</h2>'+
    '<p class="lead">여기서 한 번 쓰면 <b>업체 앱</b>과 <b>홈페이지</b>에 같이 올라갑니다. '+
    '창으로 뜨는 것은 <b>업체 앱에서만</b>이고, 홈페이지는 <b>공지사항 칸에 글로만</b> 올라갑니다.</p>'+
    '<div class="tbar"><button class="btn primary sm" id="ntNew">＋ 새 공지 쓰기</button>'+
      '<button class="btn sm" id="ntGo">다시 불러오기</button>'+
      '<span class="sp"></span><span class="cnt" id="ntAt"></span></div>'+
    '<div id="ntBody"><div class="hint">불러오는 중입니다…</div></div>';
  $("ntGo").onclick=ntLoad;
  $("ntNew").onclick=function(){ ntEdit(null); };
  if(NOTI.loaded) ntDraw(); else ntLoad();
}
function ntLoad(){
  if(NOTI.busy) return; NOTI.busy=true;
  api("hqNotices",[]).then(function(r){
    NOTI.loaded=true; NOTI.err="";
    NOTI.list=(r&&r.list)||[]; NOTI.today=(r&&r.today)||"";
    NOTI.at=new Date().toISOString();
  },function(e){ NOTI.loaded=true; NOTI.err=e.message||"불러오지 못했습니다"; })
  .then(function(){ NOTI.busy=false;
    var at=$("ntAt"); if(at) at.textContent=NOTI.at?("마지막 확인 "+dtTime(NOTI.at)):"";
    ntDraw(); });
}
/* 지금 보이는 공지인가 */
function ntLive(n){
  if(!n.active) return false;
  var t=NOTI.today||new Date().toISOString().slice(0,10);
  if(n.from_at && String(n.from_at).slice(0,10) > t) return false;
  if(n.to_at   && String(n.to_at).slice(0,10)   < t) return false;
  return true;
}
function ntState(n){
  if(!n.active) return '<span class="pill gray">꺼둠</span>';
  var t=NOTI.today||new Date().toISOString().slice(0,10);
  if(n.from_at && String(n.from_at).slice(0,10) > t) return '<span class="pill wait">예정</span>';
  if(n.to_at   && String(n.to_at).slice(0,10)   < t) return '<span class="pill gray">지남</span>';
  return '<span class="pill ok">올라와 있음</span>';
}
function ntDraw(){
  var host=$("ntBody"); if(!host) return;
  if(NOTI.err){ host.innerHTML='<div class="hint"><b>불러오지 못했습니다.</b><br>'+esc(NOTI.err)+
    '<br><br>공지사항 SQL 을 아직 안 돌리셨다면 먼저 돌려 주세요.</div>'; return; }
  var list=NOTI.list||[];
  var live=list.filter(ntLive).length, pop=list.filter(function(n){return ntLive(n)&&n.pop;}).length;

  host.innerHTML=
    '<div class="card"><div class="ntSum">'+
      '<div><span>전체</span><b>'+list.length+'건</b></div>'+
      '<div><span>지금 보이는 것</span><b>'+live+'건</b></div>'+
      '<div><span>앱에서 창으로 뜨는 것</span><b>'+pop+'건</b></div>'+
    '</div>'+
    '<div class="hint" style="margin:10px 0 0">창은 <b>업체 앱에서만</b> 뜹니다. 홈페이지에는 창이 뜨지 않습니다.<br>'+
    '창으로 뜨는 공지가 너무 많으면 업체가 피곤해합니다. 한 번에 <b>한두 개</b>만 켜두시길 권합니다.</div></div>'+
    '<div id="ntTable"></div>';

  makeTable({ id:"ntTable", sortKey:"at", sortDir:"desc",
    rows:list.map(function(n){
      return { id:n.id, kind:NKIND[n.kind]||n.kind, title:n.title||"",
               whereAt:NWHERE[n.where_at]||n.where_at,
               at:String(n.created_at||"").slice(0,10),
               period:(String(n.from_at||"").slice(0,10)||"바로")+" ~ "+(String(n.to_at||"").slice(0,10)||"계속"),
               pop:!!n.pop, pin:!!n.pin, hid:Number(n.hid||0), raw:n };
    }),
    search:["title","kind"],
    cols:[
      {k:"title",label:"제목",w:260,stick:true,html:function(r){
        return (r.pin?'<span class="pill wait" style="margin-right:5px">고정</span>':"")+esc(r.title); }},
      {k:"kind",label:"종류",w:90},
      {k:"whereAt",label:"어디에",w:110},
      {k:"period",label:"보이는 기간",w:180},
      {k:"pop",label:"창으로",w:100,nosort:true,html:function(r){
        if(r.raw.where_at==="home") return '<span class="pill gray">홈페이지 전용</span>';
        return r.pop?'<span class="pill ok">앱에서 띄움</span>':'<span class="pill gray">안 띄움</span>'; }},
      {k:"_st",label:"지금",w:110,nosort:true,html:function(r){ return ntState(r.raw); }},
      {k:"hid",label:"안 봄",w:80,num:true,html:function(r){
        return r.hid?('<span class="cnt">'+r.hid+'명</span>'):'<span class="cnt">-</span>'; }},
      {k:"_b",label:"",w:150,nosort:true,html:function(r){
        return '<span class="btn sm" data-nedit="'+r.id+'">고치기</span> '+
               '<span class="btn sm" data-ndel="'+r.id+'">지우기</span>'; }}
    ]});

  host.addEventListener("click",function(ev){
    var e=ev.target.getAttribute&&ev.target.getAttribute("data-nedit");
    var d=ev.target.getAttribute&&ev.target.getAttribute("data-ndel");
    if(e){ var n=(NOTI.list||[]).filter(function(x){return String(x.id)===String(e);})[0]; if(n) ntEdit(n); }
    if(d){ ntDel(d); }
  });
}
function ntDel(id){
  var n=(NOTI.list||[]).filter(function(x){return String(x.id)===String(id);})[0];
  confirmBox("공지 지우기", (n?n.title:"")+"\n\n지우면 앱과 홈페이지에서 바로 사라집니다.", "지우기", true, function(){
    api("hqNoticeDel",[Number(id)]).then(function(){ toast("지웠습니다"); NOTI.loaded=false; ntLoad(); })
      .catch(function(e){ toast(e.message,true); });
  });
}
function ntEdit(n){
  n = n || {kind:"update", where_at:"both", active:true, pop:true, pin:false, title:"", body:""};
  var isNew=!n.id;
  openSheet('<h3>'+(isNew?"새 공지 쓰기":"공지 고치기")+'</h3>'+
    '<label class="f">종류</label>'+
    '<div class="chips" id="ntKind">'+
      Object.keys(NKIND).map(function(k){
        return '<label class="chip'+(n.kind===k?" on":"")+'"><input type="radio" name="ntk" value="'+k+'"'+
               (n.kind===k?" checked":"")+'><span>'+NKIND[k]+'</span></label>'; }).join("")+'</div>'+
    '<label class="f" for="ntTitle" style="margin-top:12px">제목</label>'+
    '<input type="text" id="ntTitle" value="'+esc(n.title||"")+'" placeholder="예) 9월 26일 업데이트 안내" maxlength="120">'+
    '<label class="f" for="ntBodyIn" style="margin-top:10px">내용</label>'+
    '<textarea id="ntBodyIn" style="min-height:150px" placeholder="줄을 바꿔 쓰시면 그대로 보입니다.">'+esc(n.body||"")+'</textarea>'+
    '<div class="row2" style="margin-top:12px">'+
      '<div><label class="f" for="ntFrom">언제부터</label>'+
        '<input type="date" id="ntFrom" value="'+esc(String(n.from_at||"").slice(0,10))+'">'+
        '<div class="hint" style="margin:4px 0 0">비우면 바로 올라갑니다</div></div>'+
      '<div><label class="f" for="ntTo">언제까지</label>'+
        '<input type="date" id="ntTo" value="'+esc(String(n.to_at||"").slice(0,10))+'">'+
        '<div class="hint" style="margin:4px 0 0">비우면 계속 보입니다</div></div>'+
    '</div>'+
    '<label class="f" style="margin-top:12px">어디에 보일까요</label>'+
    '<div class="chips" id="ntWhere">'+
      Object.keys(NWHERE).map(function(k){
        return '<label class="chip'+(n.where_at===k?" on":"")+'"><input type="radio" name="ntw" value="'+k+'"'+
               (n.where_at===k?" checked":"")+'><span>'+NWHERE[k]+'</span></label>'; }).join("")+'</div>'+
    '<div class="hint" style="margin:6px 0 0">홈페이지에는 <b>창이 뜨지 않습니다.</b> '+
    '공지사항 칸에만 글로 올라갑니다. 창은 <b>업체 앱</b>에서만 뜹니다.</div>'+
    '<div class="chips" style="margin-top:12px">'+
      '<label class="chip'+(n.pop?" on":"")+'" id="ntPopLb"><input type="checkbox" id="ntPop"'+(n.pop?" checked":"")+'><span>업체 앱에서 로그인할 때 창으로 띄우기</span></label>'+
      '<label class="chip'+(n.pin?" on":"")+'"><input type="checkbox" id="ntPin"'+(n.pin?" checked":"")+'><span>맨 위에 고정</span></label>'+
      '<label class="chip'+(n.active!==false?" on":"")+'"><input type="checkbox" id="ntOn"'+(n.active!==false?" checked":"")+'><span>켜기</span></label>'+
    '</div>'+
    '<div class="hint" id="ntPopWhy" style="margin:6px 0 0" hidden></div>'+
    (isNew?"":'<div class="hint" style="margin-top:12px">이 공지를 «다시 보지 않기» 한 사람이 <b>'+
      Number(n.hid||0)+'명</b> 있습니다. 내용을 크게 고치셨으면 아래 [다시 띄우기] 를 눌러 주세요.</div>')+
    '<div class="btns" style="margin-top:16px">'+
      '<button class="btn" id="ntCancel">취소</button>'+
      (isNew?"":'<button class="btn" id="ntAgain">다시 띄우기</button>')+
      '<button class="btn primary" id="ntSave" style="flex:2">저장</button></div>');

  Array.prototype.forEach.call($("sheet").querySelectorAll(".chip input"),function(c){
    c.onchange=function(){
      if(c.type==="radio"){
        Array.prototype.forEach.call(c.closest(".chips").querySelectorAll(".chip"),function(l){ l.classList.remove("on"); });
      }
      c.parentNode.classList.toggle("on", c.checked);
      ntPopSync();
    };
  });
  /* 홈페이지에만 올리는 공지는 «창으로 띄우기» 가 쓸모없습니다 (홈페이지엔 로그인이 없으니까요) */
  function ntPopSync(){
    var w=($("sheet").querySelector('input[name="ntw"]:checked')||{}).value||"both";
    var only=(w==="home");
    var box=$("ntPop"), lb=$("ntPopLb"), why=$("ntPopWhy");
    if(!box) return;
    box.disabled=only;
    if(only){ box.checked=false; if(lb) lb.classList.remove("on"); }
    if(lb) lb.style.opacity = only ? ".45" : "";
    if(why){
      why.hidden=!only;
      why.innerHTML="홈페이지만 올리는 공지라 창은 뜨지 않습니다. 홈페이지에는 로그인이 없기 때문입니다.";
    }
  }
  ntPopSync();
  $("ntCancel").onclick=closeSheet;
  if($("ntAgain")) $("ntAgain").onclick=function(){
    api("hqNoticeAgain",[Number(n.id)]).then(function(){ toast("다시 띄웁니다"); NOTI.loaded=false; ntLoad(); closeSheet(); })
      .catch(function(e){ toast(e.message,true); });
  };
  $("ntSave").onclick=function(){
    var kind=($("sheet").querySelector('input[name="ntk"]:checked')||{}).value||"etc";
    var where=($("sheet").querySelector('input[name="ntw"]:checked')||{}).value||"both";
    var v={ id:n.id||0, kind:kind, whereAt:where,
            title:$("ntTitle").value.trim(), body:$("ntBodyIn").value,
            fromAt:$("ntFrom").value, toAt:$("ntTo").value,
            pop:$("ntPop").checked, pin:$("ntPin").checked, active:$("ntOn").checked };
    if(!v.title) return toast("제목을 넣어주세요",true);
    api("hqNoticeSave",[v]).then(function(){
      closeSheet(); toast("저장했습니다"); NOTI.loaded=false; ntLoad();
    }).catch(function(e){ toast(e.message,true); });
  };
}

var TABS = [
  ["sum","홈",viewSummary],
  ["ops","운영 상태",viewOps],
  ["inv","가입 코드",viewInvites],
  ["users","계정",viewUsers],
  ["shops","업체",viewShops],
  ["plans","요금제",viewPlans],
  ["pays","결제",viewPays],
  ["packs","충전",viewCash],
  ["settle","정산",viewSettle],
  ["svc","유지비",viewSvc],
  ["tax","세금계산서",viewTax],
  ["pg","카드 결제",viewPg],
  ["sms","기한 안내 문자",viewExp],
  ["lock","잠금·차단",viewLock],
  ["noti","공지사항",viewNotice],
  ["sec","보안",viewSec],
  ["me","내 계정",viewMe]
];
var TAB = "sum";
function render(){
  $("nav").innerHTML = TABS.map(function(t){
    return '<button data-t="'+t[0]+'"'+(TAB===t[0]?' class="on"':'')+'>'+esc(t[1])+'</button>'; }).join("");
  Array.prototype.forEach.call($("nav").children,function(b){
    b.onclick=function(){ TAB=b.getAttribute("data-t"); window.scrollTo(0,0); render(); }; });
  var f = TABS.filter(function(t){return t[0]===TAB;})[0];
  (f?f[2]:viewSummary)();
}

/* =========================================================
   로그인 · 시작
   ========================================================= */
function showGate(msg){
  $("app").style.display="none";
  $("gate").style.display="flex";
  $("gMsg").textContent = msg||"";
  $("gMsg").className = "msg"+(msg?" bad":"");
  closeSheet();
}
function showApp(){
  $("gate").style.display="none";
  $("app").style.display="block";
  $("who").textContent = (D.me?D.me.name:"")+" · "+(D.me?D.me.who:"");
  render();
}
function gmsg(x,bad){ $("gMsg").textContent=x||""; $("gMsg").className="msg"+(bad?" bad":""); }

var TICK="";
function step2(on){
  $("gStep2").hidden = !on;
  $("gGo").hidden = on;
  $("gid").disabled = on; $("gpw").disabled = on;
  if(on) setTimeout(function(){ try{ $("gcode").focus(); }catch(e){} }, 60);
}
function doLogin(){
  var id=$("gid").value.trim(), pw=$("gpw").value;
  if(!id||!pw) return gmsg("아이디와 비밀번호를 넣어주세요",true);
  $("gGo").disabled=true; gmsg("확인 중…");
  open_("hqLogin",[id,pw]).then(function(r){
    $("gGo").disabled=false;
    TICK=(r&&r.tick)||"";
    $("gTo").innerHTML="<b>"+esc((r&&r.to)||"")+"</b> 로 6자리를 보냈습니다.<br>5분 안에 넣어 주세요.";
    gmsg(""); step2(true);
  }).catch(function(e){ $("gGo").disabled=false; gmsg(e.message,true); });
}
function doCode(){
  var c=$("gcode").value.replace(/[^0-9]/g,"");
  if(c.length!==6) return gmsg("6자리를 넣어주세요",true);
  $("gGo2").disabled=true; gmsg("확인 중…");
  open_("hqLogin2",[TICK,c]).then(function(r){
    ls(SIDKEY, r.key);
    D.me={ who:$("gid").value.trim(), name:r.who||"", shop:r.shop, role:r.role, phone:$("gid").value.trim() };
    return loadAll().then(function(){ $("gGo2").disabled=false; step2(false); $("gcode").value=""; showApp(); });
  }).catch(function(e){ $("gGo2").disabled=false; gmsg(e.message,true); });
}
$("gGo").onclick=doLogin;
$("gGo2").onclick=doCode;
$("gBack").onclick=function(){ TICK=""; $("gcode").value=""; gmsg(""); step2(false); };
$("gcode").onkeydown=function(e){ if(e.key==="Enter") doCode(); };
$("gcode").oninput=function(){ if($("gcode").value.replace(/[^0-9]/g,"").length===6) doCode(); };
$("gpw").onkeydown=function(e){ if(e.key==="Enter") doLogin(); };
$("gid").onkeydown=function(e){ if(e.key==="Enter") $("gpw").focus(); };

$("btnOut").onclick=function(){
  confirmBox("로그아웃","관제센터에서 나갑니다.","로그아웃",false,function(){
    var sid=ls(SIDKEY); lsDel(SIDKEY);
    (sid?open_("logout",[sid]).catch(function(){}):Promise.resolve())
      .then(function(){ D={me:null,sum:null,shops:[],users:[],pays:[],invites:[],plans:[],sess:[]};
        $("gid").value=""; $("gpw").value=""; TICK=""; step2(false); showGate(""); });
  });
};
$("btnReload").onclick=function(){
  toast("불러오는 중…");
  loadAll().then(function(){ render(); toast("새로 불러왔습니다"); })
    .catch(function(e){ toast(e.message,true); });
};

/* 이미 로그인해 둔 기기라면 바로 들어갑니다 */
(function boot(){
  var sid = ls(SIDKEY);
  if(!sid){ showGate(""); return; }
  open_("me",[sid]).then(function(r){
    if(!r || r.shop!=="ADMIN"){ lsDel(SIDKEY); showGate(""); return; }
    D.me = { who:"(기억된 계정)", name:r.who||"", shop:r.shop, role:r.role, phone:"" };
    return loadAll().then(function(){
      /* 내 계정 화면에서 쓸 아이디를 계정 목록에서 찾아 둡니다 */
      var mine=(D.users||[]).filter(function(u){return u.shop==="ADMIN"&&u.name===D.me.name;})[0];
      if(mine){ D.me.who=mine.phone; D.me.phone=mine.phone; }
      showApp();
    });
  }).catch(function(){ lsDel(SIDKEY); showGate(""); });
})();

})();
</script>
</body>
