    '<div class="sub2">요금을 내야 차곳간이 계속 도는 곳들이에요. 줄을 누르면 고칠 수 있어요.</div></div>'+
    '<div class="tools">'+
      '<button class="btn primary" id="svAdd">＋ 서비스 넣기</button>'+

      {k:"what", label:"무엇에 쓰는지", w:250},
      {k:"kind", label:"방식", w:90, html:function(r){
        return esc({charge:"충전식",sub:"매달 결제",renew:"연장"}[r.kind]||r.kind||"-"); }},
      {k:"balance", label:"지금 남은 금액", w:110, num:true, html:function(r){
        return r.kind==="charge" ? esc(won(r.balance)) : '<span style="color:var(--muted)">-</span>'; }},
      {k:"next_due", label:"다음 결제일", w:110, html:function(r){
        return r.next_due ? esc(r.next_due) : '<span style="color:var(--muted)">-</span>'; }},
      {k:"_st", label:"상태", w:150, nosort:true, html:function(r){
        var st=svcState(r); return svcPill(st.lv)+' <span style="font-size:13px">'+esc(st.txt)+'</span>'; }},
      {k:"auto", label:"읽는 법", w:90, html:function(r){
        return r.auto ? (r.auto_err?'<span class="pill off" title="'+esc(r.auto_err)+'">자동으로 못 읽음</span>':'<span class="pill ok">자동</span>')
                      : '<span class="pill gray">직접</span>'; }},
      {k:"auto_note", label:"읽어온 내용", w:230, html:function(r){
        return esc(r.auto_err || r.auto_note || "-"); }},
      {k:"auto_at", label:"마지막 확인", w:110, html:function(r){ return esc(ago(r.auto_at||r.balance_at)); }},
      {k:"active", label:"사용", w:80, html:function(r){
        return r.active===false ? '<span class="pill off">안 씀</span>' : '<span class="pill ok">씀</span>'; }}
    ]
  });
  $("svAdd").onclick = function(){ svcSheet(""); };
  $("svRef").onclick = svcRefresh;

function svcRefresh(){
  toast("연결된 곳에 물어보는 중…");
  api("hqSvcRefresh",[]).then(function(r){
    return loadAll().then(function(){
      var ok=(r&&r.done)||[], bad=(r&&r.failed)||[];
      render();
      if(bad.length) openSheet('<h3>상태를 새로 받았어요</h3>'+
        '<div class="sub">'+ok.length+'곳 보냈어요 · '+bad.length+'곳은 보내지 못했어요</div>'+
        (ok.length?('<label class="f">잘 읽은 곳</label><div class="hint">'+
          ok.map(function(x){return esc(x);}).join("<br>")+'</div>'):'')+
        '<label class="f">못 읽은 곳</label><div class="hint" style="color:var(--warn)">'+
          bad.map(function(x){return esc(x);}).join("<br>")+'</div>'+
        '<div class="hint" style="margin-top:10px">열쇠를 넣어 달라는 말이 보이면, 수파베이스 Edge Functions → Secrets 에 그 이름으로 넣어 주세요. 넣기 전까지는 그 줄만 직접 적으시면 돼요.</div>'+
        '<div class="sheetbtns"><button class="btn primary" id="rOk" style="flex:1">닫기</button></div>');
      else toast(ok.length+"곳 상태를 새로 받았어요");
      if($("rOk")) $("rOk").onclick=closeSheet;
    });
  }).catch(function(e){ toast(emsg(e),true); });
}

function svcSheet(code){
  var isNew = !code;
  var v = isNew ? {kind:"charge",warn_days:14,active:true}
                : (D.svcs||[]).filter(function(x){return x.code===code;})[0];
  if(!v) return;
  function kOpt(k,t){ return '<option value="'+k+'"'+(v.kind===k?" selected":"")+'>'+t+'</option>'; }
  openSheet(
    '<h3>'+(isNew?"서비스 넣기":esc(v.name))+'</h3>'+
    '<div class="sub">'+(isNew?"요금을 내야 하는 곳을 하나 더 넣어요":("코드 "+esc(v.code)))+'</div>'+
    (isNew?'<label class="f">영문 코드 (예: naver)</label><input type="text" id="vCode" placeholder="naver">':'')+
    '<label class="f">이름</label><input type="text" id="vName" value="'+esc(v.name||"")+'">'+
    '<label class="f">무엇에 쓰는지</label><input type="text" id="vWhat" value="'+esc(v.what||"")+'">'+
    '<label class="f">충전·결제하러 가는 주소</label><input type="text" id="vUrl" value="'+esc(v.url||"")+'" placeholder="https://...">'+
    '<div class="row2">'+
      '<div><label class="f">결제 방식</label><select id="vKind">'+
        kOpt("charge","충전식 — 미리 넣어 두고 써요")+kOpt("sub","매달 결제 — 카드에서 빠져요")+
        kOpt("renew","연장 — 기한이 오면 다시 내요")+'</select></div>'+
      '<div><label class="f">다음 결제일 · 만료일</label><input type="date" id="vDue" value="'+
        esc(v.next_due||"")+'"></div>'+
    '</div>'+
    '<div class="row2">'+
      '<div><label class="f">지금 남은 금액 (원)</label><input type="number" id="vBal" value="'+(v.balance||0)+'"></div>'+
      '<div><label class="f">한 번에 나가는 금액 (원)</label><input type="number" id="vCost" value="'+(v.cost||0)+'"></div>'+
    '</div>'+
    '<div class="row2">'+
      '<div><label class="f">이 금액 밑이면 알림 (원)</label><input type="number" id="vMin" value="'+(v.min_bal||0)+'"></div>'+
      '<div><label class="f">기한 며칠 전부터 알림</label><input type="number" id="vWarn" value="'+(v.warn_days||14)+'"></div>'+
    '</div>'+
    '<div class="row2">'+
      '<div><label class="f">자동으로 읽기</label><select id="vAuto">'+
        '<option value="1"'+(v.auto?" selected":"")+'>켬 — 서버가 직접 물어봐요</option>'+
        '<option value="0"'+(!v.auto?" selected":"")+'>끔 — 내가 직접 적어요</option></select></div>'+
      '<div><label class="f">읽은 값 (도메인일 때만)</label><input type="text" id="vRef" value="'+esc(v.ref||"")+'" placeholder="cgg.co.kr"></div>'+
    '</div>'+
    (v.auto_note?('<div class="hint">마지막으로 읽은 것 — '+esc(v.auto_note)+' ('+esc(ago(v.auto_at))+')</div>'):'')+
    (v.auto_err?('<div class="hint" style="color:var(--warn)" title="'+esc(v.auto_err)+'">자동으로 읽지 못했어요. 그 회사 화면에서 보고 직접 적어 주세요.</div>'):'')+
    '<div class="hint">자동이 안 되는 곳은 그 회사 화면에서 보고 「남은 금액」·「다음 결제일」을 적어 주세요.</div>'+
    '<label class="f">사용</label><select id="vOn">'+
      '<option value="1"'+(v.active!==false?" selected":"")+'>써요</option>'+
      '<option value="0"'+(v.active===false?" selected":"")+'>안 써요 (화면에서 숨김)</option></select>'+
    '<label class="f">메모</label><textarea id="vMemo" rows="2">'+esc(v.memo||"")+'</textarea>'+
    '<div class="sheetbtns"><button class="btn" id="vCancel">취소</button>'+
      '<button class="btn primary" id="vSave" style="flex:2">저장</button></div>'+
    (isNew?'':'<button class="btn danger" id="vDel" style="width:100%;margin-top:18px">이 서비스 지우기</button>')
  );
  $("vCancel").onclick = closeSheet;
  $("vSave").onclick = function(){
    var o = { name:$("vName").value.trim(), what:$("vWhat").value.trim(), url:$("vUrl").value.trim(),
      kind:$("vKind").value, nextDue:$("vDue").value, balance:Number($("vBal").value)||0,
      cost:Number($("vCost").value)||0, minBal:Number($("vMin").value)||0,
      warnDays:Number($("vWarn").value)||0, memo:$("vMemo").value.trim(),
      ref:$("vRef").value.trim(), auto:$("vAuto").value==="1", active:$("vOn").value==="1" };
    if(!o.name) return toast("이름을 넣어 주세요",true);
    var p;
    if(isNew){ o.code=$("vCode").value.trim(); p=api("hqSvcAdd",[o]); }
    else p=api("hqSvcSave",[code,o]);
    p.then(function(){ return loadAll(); })
     .then(function(){ closeSheet(); toast("저장했어요"); render(); })
     .catch(function(e){ toast(emsg(e),true); });
  };
  if($("vDel")) $("vDel").onclick = function(){
    confirmBox("서비스 지우기", v.name+" 를 목록에서 빼요. 지출 기록은 그대로 남아요.","지우기",true,function(){
      api("hqSvcDel",[code]).then(function(){ return loadAll(); })
        .then(function(){ closeSheet(); toast("지웠어요"); render(); })
        .catch(function(e){ toast(emsg(e),true); });
    });
  };
}

/* =========================================================
   화면 — 정산 (들어온 금액 · 나간 금액)
   ========================================================= */
var SETTLE_YEAR = String(new Date().getFullYear());
function viewSettle(){
  $("main").innerHTML = '<div class="dashhead"><h2>정산</h2>'+
    '<div class="sub2">달마다 업체에서 받은 금액과 유지비로 나간 금액을 견줘요.</div></div>'+
    '<div class="card"><div class="empty">불러오는 중이에요…</div></div>';
  api("hqSettle",[SETTLE_YEAR]).then(function(r){
    var ms = (r&&r.months)||[], inc=(r&&r.income)||0, exp=(r&&r.expense)||0, prof=inc-exp;
    var yNow = new Date().getFullYear(), yOpt="";
    for(var y=yNow; y>=yNow-4; y--) yOpt += '<option value="'+y+'"'+(String(y)===SETTLE_YEAR?" selected":"")+'>'+y+'년</option>';

    var h = '<div class="dashhead"><h2>정산</h2>'+
    '<div class="sub2">달마다 업체에서 받은 금액과 유지비로 나간 금액을 견줘요.</div></div>'+
      '<div class="tools"><select id="stYear" style="max-width:130px">'+yOpt+'</select>'+
        '<button class="btn primary" id="exAdd">＋ 지출 적기</button>'+
        '<span class="cnt">솔라피 충전·가비아 연장처럼 나간 금액을 여기에 적어 두면 아래 표에 바로 반영돼요</span></div>'+
      '<div class="dash"><div class="dRow money">'+
        '<button class="kbox hl" data-none><span class="t">'+SETTLE_YEAR+'년 들어온 금액</span>'+
          '<span class="v" style="display:block">'+esc(won(inc))+'</span>'+
          '<span class="s" style="display:block">업체에서 받은 금액</span></button>'+
        '<button class="kbox" data-none><span class="t">'+SETTLE_YEAR+'년 나간 금액</span>'+
          '<span class="v" style="display:block">'+esc(won(exp))+'</span>'+
          '<span class="s" style="display:block">유지비로 나간 금액</span></button>'+
        '<button class="kbox '+(prof<0?"warn":"")+'" data-none><span class="t">'+SETTLE_YEAR+'년 남은 것</span>'+
          '<span class="v" style="display:block">'+esc(won(prof))+'</span>'+
          '<span class="s" style="display:block">'+(prof<0?"나간 금액이 더 많아요":"들어온 금액 − 나간 금액")+'</span></button>'+
      '</div></div>';

    h += '<div class="card"><h2>달마다 보기</h2>';
    if(!ms.length) h += '<div class="empty">'+SETTLE_YEAR+'년에는 아직 기록이 없어요.</div>';
    else {
      h += '<div style="overflow:auto"><table class="stl"><thead><tr>'+
        '<th>달</th><th>들어온 금액</th><th>건수</th><th>나간 금액</th><th>남은 것</th></tr></thead><tbody>';
      ms.forEach(function(m){
        h += '<tr><td><b>'+esc(m.ym)+'</b></td><td>'+esc(won(m.income))+'</td>'+
          '<td>'+(m.cnt||0)+'건</td><td>'+esc(won(m.expense))+'</td>'+
          '<td'+(m.profit<0?' class="minus"':'')+'>'+esc(won(m.profit))+'</td></tr>';
      });
      h += '</tbody><tfoot><tr><td>합계</td><td>'+esc(won(inc))+'</td><td>-</td>'+
        '<td>'+esc(won(exp))+'</td><td'+(prof<0?' class="minus"':'')+'>'+esc(won(prof))+'</td>'+
        '</tr></tfoot></table></div>';
    }
    h += '</div>';

    h += '<div class="card"><h2>지출 적은 것</h2>'+
      '<p class="lead" style="margin:2px 0 10px">줄 끝의 지우기를 누르면 그 기록만 지워져요.</p><div id="tExp"></div></div>';
    $("main").innerHTML = h;

    $("stYear").onchange = function(){ SETTLE_YEAR=this.value; viewSettle(); };
    $("exAdd").onclick = function(){ expSheet(); };
    makeTable({
      id:"tExp", rows:(D.exps||[]), search:["name","memo","period"], sortKey:"paid_at", sortDir:"desc",
      rowId:function(r){ return String(r.id); },
      cols:[
        {k:"paid_at", label:"낸 날", w:110, stick:true},
        {k:"name", label:"무엇에", w:200, html:function(r){ return '<b>'+esc(r.name)+'</b>'; }},
        {k:"svc", label:"서비스", w:130, html:function(r){
          var v=(D.svcs||[]).filter(function(x){return x.code===r.svc;})[0];
          return esc(v?v.name:(r.svc||"-")); }},
        {k:"amount", label:"금액", w:110, num:true, html:function(r){ return esc(won(r.amount)); }},
        {k:"period", label:"어느 달치", w:100},
        {k:"memo", label:"메모", w:180},
        {k:"_d", label:"", w:80, nosort:true, html:function(r){
          return '<button class="btn sm danger" data-ex="'+r.id+'">지우기</button>'; }}
      ]
    });
    Array.prototype.forEach.call($("main").querySelectorAll("button[data-ex]"), function(b){
      b.onclick = function(ev){
        ev.stopPropagation();
        api("hqExpenseDel",[b.getAttribute("data-ex")]).then(function(){ return loadAll(); })
          .then(function(){ toast("지웠어요"); viewSettle(); })
          .catch(function(e){ toast(emsg(e),true); });
      };
    });
  }).catch(function(e){
    $("main").innerHTML = '<div class="dashhead"><h2>정산</h2></div><div class="card"><div class="empty">'+esc(emsg(e))+'</div></div>';
  });
}

    '<select id="eAdd"><option value="1">남은 금액도 올리기</option><option value="0">올리지 않기</option></select>'+

      '<button class="btn primary" id="eSave" style="flex:2">적기</button></div>'
  );
  function eSync(){
    var code=$("eSvc").value;
    var v=(D.svcs||[]).filter(function(x){return x.code===code;})[0];
    if(v && !$("eName").value.trim()) $("eName").value = v.name;

    $("eAdd").value = auto ? "0" : "1";
    $("eAdd").disabled = auto;
    $("eAddHint").innerHTML = auto
      ? '이 곳은 <b>자동으로 읽는 곳</b>이라 남은 금액은 건드리지 않아요. 실제 잔액은 「연결된 곳 상태 새로 받기」로 맞춰져요.'
      : '직접 적는 곳이라, 충전한 만큼 남은 금액을 올려둘 수 있어요.';

    var o = { svc:$("eSvc").value, name:$("eName").value.trim(), amount:Number($("eAmt").value)||0,
      paidAt:$("eDate").value, period:$("ePer").value.trim(), memo:$("eMemo").value.trim(),
      addBalance:$("eAdd").value==="1" };

    if(!o.amount) return toast("금액을 적어 주세요",true);
    api("hqExpenseAdd",[o]).then(function(r){
      return loadAll().then(function(){ return r; });

      closeSheet();
      toast((r&&r.note) ? r.note : "적었어요");
      viewSettle();

function bizFmt(v){
  var d=String(v||"").replace(/[^0-9]/g,"");
  return d.length===10 ? d.slice(0,3)+"-"+d.slice(3,5)+"-"+d.slice(5) : (v||"");
}

        '<div><label class="f">종목</label><input type="text" id="tJong" value="'+esc(sh.jongmok||"")+'"></div>'+

        '<div><label class="f">담당자 연락처</label><input type="text" id="tPhone" value="'+esc(sh.tax_phone||sh.owner_phone||"")+'"></div>'+
      '</div>'+

    '</div>'+
    '<div class="row2">'+
      '<div><label class="f">공급가액 (부가세 별도, 원)</label><input type="number" id="tAmt" value="'+price+'"></div>'+

    '</div>'+

    '<div class="hint" id="tSum"></div>'+
    '<label class="f">메모</label><input type="text" id="tMemo" value="">'+

  );
  function sum(){
    var a=Number($("tAmt").value)||0, v=Math.round(a/10);
    $("tSum").innerHTML = '공급가액 '+esc(won(a))+' + 부가세 '+esc(won(v))+' = <b>합계 '+esc(won(a+v))+'</b>'+
      ((D.hq&&D.hq.pb_test===false)?' · <span style="color:var(--danger)">실제 발행</span>':' · 시험 발행');
  }
  sum(); $("tAmt").oninput = sum;

    api("hqShopSave",[code,{ bizNo:$("tNo").value, ceo:$("tCeo").value.trim(), addr:$("tAddr").value.trim(),
      upte:$("tUpte").value.trim(), jongmok:$("tJong").value.trim(),
      taxEmail:$("tEmail").value.trim(), taxPhone:$("tPhone").value }])

      .then(function(){ toast("받는 쪽 정보를 저장했어요"); })
      .catch(function(e){ toast(emsg(e),true); });

    var per=$("tPer").value.trim(), item=$("tItem").value.trim(), memo=$("tMemo").value.trim();

    var per6=per.replace(/[^0-9]/g,"").slice(0,6);
    var head="CGG"+code+"-"+per6;
    var dup=(TAXLOG.rows||[]).filter(function(r){
      return r.ok && String(r.mgt_key||"").indexOf(head)===0; });
    var dupMsg = dup.length

      : "";

      sh.name+" 에 "+won(amt+Math.round(amt/10))+" 짜리 세금계산서를 보내요."+
      (real?" 실제 발행이라 국세청으로 바로 가요.":" 지금은 시험 발행이라 국세청에는 가지 않아요.")+dupMsg,
      dup.length?"그래도 보내기":"보내기", real||!!dup.length, function(){
      taxSend(sh,code,{ amount:amt, period:per, itemName:item, memo:memo });
    });
  };
}

    '<div class="card"><h2>세금계산서 묶음</h2>'+rows(tax,"tax")+'</div>'+
    '<div class="card"><h2>넣어준 기록</h2>'+
      '<p class="lead" style="margin:2px 0 10px">업체 화면에서 «충전 넣어 주기»로 넣은 건수가 쌓여요.</p>'+
      '<div id="tTop"></div></div>';

  makeTable({
    id:"tTop", rows:(D.topups||[]), search:["shopName","memo"], sortKey:"at", sortDir:"desc",
    rowId:function(r){ return String(r.id); },
    cols:[
      {k:"at", label:"넣은 때", w:130, stick:true, html:function(r){ return dt(r.at,true); }},
      {k:"shopName", label:"업체", w:130, html:function(r){ return '<b>'+esc(r.shopName)+'</b>'; }},

      {k:"qty", label:"건수", w:90, num:true, html:function(r){ return (r.qty||0).toLocaleString("ko-KR")+"건"; }},
      {k:"amount", label:"받은 금액", w:110, num:true, html:function(r){ return esc(won(r.amount)); }},

    ]
  });

             best:$("pk_b_"+p.id).value==="1", active:$("pk_a_"+p.id).value==="1" };

        .catch(function(e){ toast(emsg(e),true); });

  });

  $("lkGo").onclick=lkLoad;

function lkLoad(){
  if(LOCK.busy) return; LOCK.busy=true;
  Promise.all([ api("hqLock",[]), api("hqPurgeList",[]).catch(function(){ return null; }) ])
  .then(function(rs){
    var r=rs[0]||{};
    LOCK.loaded=true; LOCK.err="";
    LOCK.cfg=(r&&r.cfg)||{}; LOCK.shops=(r&&r.shops)||[]; LOCK.logs=(r&&r.logs)||[];
    LOCK.today=(r&&r.today)||""; LOCK.purge=(rs[1]&&rs[1].list)||[];
    LOCK.at=new Date().toISOString();
  },function(e){ LOCK.loaded=true; LOCK.err=emsg(e,"불러오지 못했어요. 다시 시도해 주세요."); })
  .then(function(){ LOCK.busy=false;
    var at=$("lkAt"); if(at) at.textContent=LOCK.at?("마지막 확인 "+dtTime(LOCK.at)):"";
    lkDraw(); });
}

  return st==="blocked" ? '<span class="pill off">보류 · 로그인 안 됨</span>'

/* 업체 하나 열어 두기 */
function lkOpenBox(code){
  var row=null;
  (LOCK.shops||[]).forEach(function(x){ if(x.shop===code) row=x; });
  if(!row) return;
  var t=new Date(Date.now()+7*864e5).toISOString().slice(0,10);
  openSheet('<h3>'+esc(row.name||code)+' — 열어 두기</h3>'+
    '<p class="lead">이 날짜까지는 잠금·차단과 상관없이 <b>평소처럼 다</b> 쓸 수 있어요. '+
    '입금은 됐는데 아직 이용기한을 못 늘렸을 때 쓰세요.</p>'+
    '<label class="f" for="lkoD">언제까지 열어 둘까요</label>'+
    '<input type="date" id="lkoD" value="'+esc(row.openUntil||t)+'">'+
    '<label class="f" for="lkoM">왜 열어 두는지 (기록에 남아요)</label>'+
    '<input type="text" id="lkoM" value="'+esc(row.openMemo||"")+'" placeholder="예) 9/26 입금 확인, 세금계산서 발행 대기">'+
    '<label class="f" for="lkoL">이 업체만 잠금 일수를 다르게 (비우면 기본값)</label>'+
    '<input type="number" id="lkoL" value="'+esc(row.own===null||row.own===undefined?"":row.own)+'" min="0" max="180" placeholder="비워 두면 기본값">'+
    '<div class="saveRow"><button class="btn primary sm" id="lkoGo">저장</button>'+
    '<button class="btn sm" id="lkoOff">열어 둔 것 취소</button></div>');
  $("lkoGo").onclick=function(){
    var L=$("lkoL").value.trim();
    api("hqLockShop",[code,{ openUntil:$("lkoD").value, memo:$("lkoM").value, lockDays:(L===""?null:Number(L)) }])
    .then(function(){ closeSheet(); toast("저장했어요"); LOCK.loaded=false; lkLoad(); })
    .catch(function(e){ toast(emsg(e),true); });
  };
  $("lkoOff").onclick=function(){
    api("hqLockShop",[code,{ openUntil:"", memo:"" }])
    .then(function(){ closeSheet(); toast("취소했어요"); LOCK.loaded=false; lkLoad(); })
    .catch(function(e){ toast(emsg(e),true); });
  };
}

/* 자료 정리 — 두 번 확인합니다 */
function lkPurgeBox(code){
  api("hqPurgePeek",[code]).then(function(r){
    var pk=(r&&r.peek)||{}, st=(r&&r.state)||{};
    var nm=st.name||code;
    openSheet('<h3 style="color:var(--danger)">'+esc(nm)+' — 자료 정리</h3>'+
      '<p class="lead">아래 자료가 <b>영영 지워져요.</b> 되돌릴 수 없어요.</p>'+
      '<div class="hint" style="background:var(--danger-soft);border-color:#F0B9B4">'+
        '기록 <b>'+(pk.rows>=0?pk.rows:"?")+'</b>줄 · 문자기록 <b>'+(pk.send>=0?pk.send:"?")+'</b>줄 · '+
        '계정 <b>'+(pk.users>=0?pk.users:"?")+'</b>개<br>'+
        '끝난 날 '+esc(st.endAt||"-")+' · 정리 예정일 '+esc(st.delAt||"-")+'</div>'+
      '<label class="f" for="lkpN">지우시려면 업체명을 그대로 적어 주세요</label>'+
      '<input type="text" id="lkpN" placeholder="'+esc(nm)+'">'+
      '<div class="saveRow"><button class="btn sm" id="lkpGo" style="background:var(--danger);border-color:var(--danger);color:#fff">이 업체 자료 지우기</button></div>', nm);
    $("lkpGo").onclick=function(){
      api("hqPurgeRun",[code,$("lkpN").value])
      .then(function(){ closeSheet(); toast("정리했어요"); LOCK.loaded=false; lkLoad(); })
      .catch(function(e){ toast(emsg(e),true); });
    };
  }).catch(function(e){ toast(emsg(e),true); });
}


/* ══════════════════════════════════════════════════════════
   공지사항 — 한 번 쓰면 앱과 홈페이지에 같이 올라가요
   ══════════════════════════════════════════════════════════ */
var NOTI = {};
var NKIND = {update:"업데이트", price:"요금", etc:"기타"};
var NWHERE = {both:"앱 + 홈페이지", app:"앱만", home:"홈페이지만"};

function viewNotice(){
  $("main").innerHTML='<div class="dashhead"><h2>공지사항</h2>'+
    '<div class="sub2">여기서 한 번 쓰면 <b>업체 앱</b>과 <b>홈페이지</b>에 같이 올라가요. '+
    '창으로 뜨는 것은 <b>업체 앱에서만</b>이고, 홈페이지는 <b>공지사항 칸에 글로만</b> 올라가요.</div></div>'+
    '<div class="tools"><button class="btn primary sm" id="ntNew">＋ 새 공지 쓰기</button>'+
      '<button class="btn sm" id="ntGo">새로고침</button>'+
      '<span class="sp"></span><span class="cnt" id="ntAt"></span></div>'+
    '<div id="ntBody"><div class="hint">불러오는 중이에요…</div></div>';
  $("ntGo").onclick=ntLoad;
  $("ntNew").onclick=function(){ ntEdit(null); };
  if(NOTI.loaded) ntDraw(); else ntLoad();
}
function ntLoad(){
  if(NOTI.busy) return; NOTI.busy=true;
  api("hqNotices",[]).then(function(r){
    NOTI.loaded=true; NOTI.err="";
    NOTI.list=(r&&r.list)||[]; NOTI.today=(r&&r.today)||"";
    NOTI.at=new Date().toISOString();
  },function(e){ NOTI.loaded=true; NOTI.err=emsg(e,"불러오지 못했어요. 다시 시도해 주세요."); })
  .then(function(){ NOTI.busy=false;
    var at=$("ntAt"); if(at) at.textContent=NOTI.at?("마지막 확인 "+dtTime(NOTI.at)):"";
    ntDraw(); });
}
/* 지금 보이는 공지인가 */
function ntLive(n){
  if(!n.active) return false;
  var t=NOTI.today||new Date().toISOString().slice(0,10);
  if(n.from_at && String(n.from_at).slice(0,10) > t) return false;
  if(n.to_at   && String(n.to_at).slice(0,10)   < t) return false;
  return true;
}
function ntState(n){
  if(!n.active) return '<span class="pill gray">꺼둠</span>';
  var t=NOTI.today||new Date().toISOString().slice(0,10);
  if(n.from_at && String(n.from_at).slice(0,10) > t) return '<span class="pill wait">예정</span>';
  if(n.to_at   && String(n.to_at).slice(0,10)   < t) return '<span class="pill gray">지남</span>';
  return '<span class="pill ok">올라와 있음</span>';
}
function ntDraw(){
  var host=$("ntBody"); if(!host) return;
  if(NOTI.err){ host.innerHTML='<div class="hint"><b>공지사항 정보를 불러오지 못했어요.</b> 서버 준비가 아직이면 이렇게 보여요 — 서버 방에 확인해 주세요.</div>'; return; }
  var list=NOTI.list||[];
  var live=list.filter(ntLive).length, pop=list.filter(function(n){return ntLive(n)&&n.pop;}).length;

  host.innerHTML=
    '<div class="card"><div class="ntSum">'+
      '<div><span>전체</span><b>'+list.length+'건</b></div>'+
      '<div><span>지금 보이는 것</span><b>'+live+'건</b></div>'+
      '<div><span>앱에서 창으로 뜨는 것</span><b>'+pop+'건</b></div>'+
    '</div>'+
    '<div class="hint" style="margin:10px 0 0">창은 <b>업체 앱에서만</b> 떠요. 홈페이지에는 창이 뜨지 않아요.<br>'+
    '창으로 뜨는 공지가 너무 많으면 업체가 피곤해해요. 한 번에 <b>한두 개</b>만 켜 두시길 권해요.</div></div>'+
    '<div id="ntTable"></div>';

  makeTable({ id:"ntTable", sortKey:"at", sortDir:"desc",
    rows:list.map(function(n){
      return { id:n.id, kind:NKIND[n.kind]||n.kind, title:n.title||"",
               whereAt:NWHERE[n.where_at]||n.where_at,
               at:String(n.created_at||"").slice(0,10),
               period:(String(n.from_at||"").slice(0,10)||"바로")+" ~ "+(String(n.to_at||"").slice(0,10)||"계속"),
               pop:!!n.pop, pin:!!n.pin, hid:Number(n.hid||0), raw:n };
    }),
    search:["title","kind"],
    cols:[
      {k:"title",label:"제목",w:260,stick:true,html:function(r){
        return (r.pin?'<span class="pill wait" style="margin-right:5px">고정</span>':"")+esc(r.title); }},
      {k:"kind",label:"종류",w:90},
      {k:"whereAt",label:"어디에",w:110},
      {k:"period",label:"보이는 기간",w:180},
      {k:"pop",label:"창으로",w:100,nosort:true,html:function(r){
        if(r.raw.where_at==="home") return '<span class="pill gray">홈페이지 전용</span>';
        return r.pop?'<span class="pill ok">앱에서 띄움</span>':'<span class="pill gray">안 띄움</span>'; }},
      {k:"_st",label:"지금",w:110,nosort:true,html:function(r){ return ntState(r.raw); }},
      {k:"hid",label:"안 봄",w:80,num:true,html:function(r){
        return r.hid?('<span class="cnt">'+r.hid+'명</span>'):'<span class="cnt">-</span>'; }},
      {k:"_b",label:"",w:150,nosort:true,html:function(r){
        return '<span class="btn sm" data-nedit="'+r.id+'">고치기</span> '+
               '<span class="btn sm" data-ndel="'+r.id+'">지우기</span>'; }}
    ]});

  host.addEventListener("click",function(ev){
    var e=ev.target.getAttribute&&ev.target.getAttribute("data-nedit");
    var d=ev.target.getAttribute&&ev.target.getAttribute("data-ndel");
    if(e){ var n=(NOTI.list||[]).filter(function(x){return String(x.id)===String(e);})[0]; if(n) ntEdit(n); }
    if(d){ ntDel(d); }
  });
}
function ntDel(id){
  var n=(NOTI.list||[]).filter(function(x){return String(x.id)===String(id);})[0];
  confirmBox("공지 지우기", (n?n.title:"")+"\n\n지우면 앱과 홈페이지에서 바로 사라져요.", "지우기", true, function(){
    api("hqNoticeDel",[Number(id)]).then(function(){ toast("지웠어요"); NOTI.loaded=false; ntLoad(); })
      .catch(function(e){ toast(emsg(e),true); });
  });
}
function ntEdit(n){
  n = n || {kind:"update", where_at:"both", active:true, pop:true, pin:false, title:"", body:""};
  var isNew=!n.id;
  openSheet('<h3>'+(isNew?"새 공지 쓰기":"공지 고치기")+'</h3>'+
    '<label class="f">종류</label>'+
    '<div class="chips" id="ntKind">'+
      Object.keys(NKIND).map(function(k){
        return '<label class="chip'+(n.kind===k?" on":"")+'"><input type="radio" name="ntk" value="'+k+'"'+
               (n.kind===k?" checked":"")+'><span>'+NKIND[k]+'</span></label>'; }).join("")+'</div>'+
    '<label class="f" for="ntTitle" style="margin-top:12px">제목</label>'+
    '<input type="text" id="ntTitle" value="'+esc(n.title||"")+'" placeholder="예) 9월 26일 업데이트 안내" maxlength="120">'+
    '<label class="f" for="ntBodyIn" style="margin-top:10px">내용</label>'+
    '<textarea id="ntBodyIn" style="min-height:150px" placeholder="줄을 바꿔 쓰시면 그대로 보여요.">'+esc(n.body||"")+'</textarea>'+
    '<div class="row2" style="margin-top:12px">'+
      '<div><label class="f" for="ntFrom">언제부터</label>'+
        '<input type="date" id="ntFrom" value="'+esc(String(n.from_at||"").slice(0,10))+'">'+
        '<div class="hint" style="margin:4px 0 0">비우면 바로 올라가요</div></div>'+
      '<div><label class="f" for="ntTo">언제까지</label>'+
        '<input type="date" id="ntTo" value="'+esc(String(n.to_at||"").slice(0,10))+'">'+
        '<div class="hint" style="margin:4px 0 0">비우면 계속 보여요</div></div>'+
    '</div>'+
    '<label class="f" style="margin-top:12px">어디에 보일까요</label>'+
    '<div class="chips" id="ntWhere">'+
      Object.keys(NWHERE).map(function(k){
        return '<label class="chip'+(n.where_at===k?" on":"")+'"><input type="radio" name="ntw" value="'+k+'"'+
               (n.where_at===k?" checked":"")+'><span>'+NWHERE[k]+'</span></label>'; }).join("")+'</div>'+
    '<div class="hint" style="margin:6px 0 0">홈페이지에는 <b>창이 뜨지 않아요.</b> '+
    '공지사항 칸에만 글로 올라가요. 창은 <b>업체 앱</b>에서만 떠요.</div>'+
    '<div class="chips" style="margin-top:12px">'+
      '<label class="chip'+(n.pop?" on":"")+'" id="ntPopLb"><input type="checkbox" id="ntPop"'+(n.pop?" checked":"")+'><span>업체 앱에서 로그인할 때 창으로 띄우기</span></label>'+
      '<label class="chip'+(n.pin?" on":"")+'"><input type="checkbox" id="ntPin"'+(n.pin?" checked":"")+'><span>맨 위에 고정</span></label>'+
      '<label class="chip'+(n.active!==false?" on":"")+'"><input type="checkbox" id="ntOn"'+(n.active!==false?" checked":"")+'><span>켜기</span></label>'+
    '</div>'+
    '<div class="hint" id="ntPopWhy" style="margin:6px 0 0" hidden></div>'+
    (isNew?"":'<div class="hint" style="margin-top:12px">이 공지를 «다시 보지 않기» 한 사람이 <b>'+
      Number(n.hid||0)+'명</b> 있어요. 내용을 크게 고치셨으면 아래 [다시 띄우기] 를 눌러 주세요.</div>')+
    '<div class="sheetbtns" style="margin-top:16px">'+
      '<button class="btn" id="ntCancel">취소</button>'+
      (isNew?"":'<button class="btn" id="ntAgain">다시 띄우기</button>')+
      '<button class="btn primary" id="ntSave" style="flex:2">저장</button></div>');

  Array.prototype.forEach.call($("sheet").querySelectorAll(".chip input"),function(c){
    c.onchange=function(){
      if(c.type==="radio"){
        Array.prototype.forEach.call(c.closest(".chips").querySelectorAll(".chip"),function(l){ l.classList.remove("on"); });
      }
      c.parentNode.classList.toggle("on", c.checked);
      ntPopSync();
    };
  });
  /* 홈페이지에만 올리는 공지는 «창으로 띄우기» 가 쓸모없습니다 (홈페이지엔 로그인이 없으니까요) */
  function ntPopSync(){
    var w=($("sheet").querySelector('input[name="ntw"]:checked')||{}).value||"both";
    var only=(w==="home");
    var box=$("ntPop"), lb=$("ntPopLb"), why=$("ntPopWhy");
    if(!box) return;
    box.disabled=only;
    if(only){ box.checked=false; if(lb) lb.classList.remove("on"); }
    if(lb) lb.style.opacity = only ? ".45" : "";
    if(why){
      why.hidden=!only;
      why.innerHTML="홈페이지만 올리는 공지라 창은 뜨지 않아요. 홈페이지에는 로그인이 없기 때문이에요.";
    }
  }
  ntPopSync();
  $("ntCancel").onclick=closeSheet;
  if($("ntAgain")) $("ntAgain").onclick=function(){
    api("hqNoticeAgain",[Number(n.id)]).then(function(){ toast("다시 띄워요"); NOTI.loaded=false; ntLoad(); closeSheet(); })
      .catch(function(e){ toast(emsg(e),true); });
  };
  $("ntSave").onclick=function(){
    var kind=($("sheet").querySelector('input[name="ntk"]:checked')||{}).value||"etc";
    var where=($("sheet").querySelector('input[name="ntw"]:checked')||{}).value||"both";
    var v={ id:n.id||0, kind:kind, whereAt:where,
            title:$("ntTitle").value.trim(), body:$("ntBodyIn").value,
            fromAt:$("ntFrom").value, toAt:$("ntTo").value,
            pop:$("ntPop").checked, pin:$("ntPin").checked, active:$("ntOn").checked };
    if(!v.title) return toast("제목을 넣어 주세요",true);
    api("hqNoticeSave",[v]).then(function(){
      closeSheet(); toast("저장했어요"); NOTI.loaded=false; ntLoad();
    }).catch(function(e){ toast(emsg(e),true); });
  };
}

  ["check_arrive","차곳간체크_차량도착", "체크 — 차가 목적지에 도착했을 때 (본사 채널, 비면 검사소 템플릿 → 문자)", "심사 대기"],
  ["staff_link",  "차곳간_접속주소안내",   "직원에게 접속 주소를 보낼 때 (직원용 주소만, 로그인 열쇠 없음)", "심사 대기"],
  ["bill_on",     "차곳간_자동결제등록",   "자동 결제 카드를 등록했을 때",          "심사 대기"],
  ["bill_fail",   "차곳간_자동결제실패",   "자동 결제가 되지 않았을 때 (다음 시도일 안내)", "심사 대기"]

var ATA = {loaded:false, busy:false, err:"", tpls:{}, ready:[], stats:null, pfSet:false, at:""};
function ataYm(){ var d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function viewAta(){
  $("main").innerHTML='<div class="dashhead"><h2>알림톡 템플릿</h2>'+
    '<div class="sub2">안내는 알림톡이 먼저 나가고, 알림톡이 안 되면 문자로 대신 나가요. 코드가 빈 안내는 문자로만 나가요.</div></div>'+
    '<div id="ataBody"><div class="hint">불러오는 중이에요…</div></div>';
  if(ATA.loaded) ataDraw(); else ataLoad();
}
function ataLoad(){
  if(ATA.busy) return; ATA.busy=true;
  api("hqAta",[ataYm()]).then(function(r){
    ATA.loaded=true; ATA.err="";
    ATA.tpls=(r&&r.tpls)||{}; ATA.ready=(r&&r.ready)||[]; ATA.stats=(r&&r.stats)||null; ATA.pfSet=!!(r&&r.pfSet);
    ATA.at=new Date().toISOString();
  },function(e){ ATA.loaded=true; ATA.err=emsg(e,"불러오지 못했어요. 다시 시도해 주세요."); })
  .then(function(){ ATA.busy=false; ataDraw(); });
}
function ataDraw(){
  var host=$("ataBody"); if(!host) return;
  if(ATA.err){ host.innerHTML='<div class="card"><div class="hint"><b>알림톡 템플릿 정보를 불러오지 못했어요.</b> 서버 준비가 아직이면 이렇게 보여요 — 서버 방에 확인해 주세요.</div>'+
    '<div class="tools" style="margin:12px 0 0"><button class="btn" id="ataRe">새로고침</button></div></div>';
    $("ataRe").onclick=function(){ ATA.loaded=false; ataLoad(); }; return; }
  var have=ATA_LIST.filter(function(x){ return String(ATA.tpls[x[0]]||"").trim(); }).length;
  var st=ATA.stats||{}, ym=st.ym||ataYm();
  function cell(k){ var o=st[k]||{}; return {cnt:Number(o.cnt)||0, won:Number(o.won)||0}; }
  var a=cell("ata"), s=cell("sms"), l=cell("lms"), m=cell("mms");
  var tot=a.won+s.won+l.won+m.won;
  var h=
    /* 지난달 발송 — 알림톡 · 문자 건수와 금액 */
    '<div class="j-kpis">'+
      [["알림톡",a,"#1668C4","건당 13원"],["문자 단문",s,"#4C93E0","건당 18원"],["문자 장문",l,"#E08A00","건당 45원"],["사진 문자",m,"#0B2545","건당 110원"]].map(function(x){
        return '<div class="j-kpi"><small><i style="background:'+x[2]+'"></i>'+esc(x[0])+' · '+esc(ym.replace("-","년 "))+'월</small>'+
          '<strong>'+x[1].cnt.toLocaleString("ko-KR")+'<em>건</em></strong><span class="tr">'+won(x[1].won)+' · '+x[3]+'</span></div>'; }).join("")+
    '</div>'+
    '<div class="hint" style="margin:-6px 0 16px">지난달 합계 <b>'+won(tot)+'</b> (부가세 별도). 금액은 솔라피 단가로 계산한 값이라 실제 청구와 조금 다를 수 있어요.<br>'+
      '건수는 업체 화면에서 나간 발송만 세요. 인증번호와 업체 대표에게 가는 안내는 아직 세지 않아요.'+
      (st.error?' <b style="color:var(--stop)">'+esc(st.error)+'</b>':'')+'</div>'+
    /* 템플릿 코드 15줄 (확정본 13개 + 체크 차량도착 + 접속주소안내) */
    '<div class="card"><h2>템플릿 코드 <span class="rt">'+have+' / '+ATA_LIST.length+' 넣음</span></h2>'+
      '<div class="csub">솔라피 › 카카오 알림톡 › 템플릿에서 코드를 복사해 넣어 주세요. 템플릿 본문과 보내는 글자가 똑같아야 해서, 문구는 여기서 고치지 않아요.'+
      '</div>'+
      '<label class="f" style="margin-top:4px">카카오 채널 ID (pfId)</label>'+
      '<input type="text" id="ataPf" placeholder="'+(ATA.pfSet?"넣어 둠 — 바꿀 때만 적어 주세요":"비어 있음 — 솔라피 › 카카오 채널에서 복사")+'" style="max-width:420px;height:40px;margin-bottom:12px">'+
      (ATA.pfSet?'':'<div class="hint" style="margin:-6px 0 12px"><b style="color:var(--stop)">채널 ID가 아직 없어요. 그동안은 모두 문자로 나가요.</b></div>')+
      '<div class="tablebox"><table><thead><tr><th style="width:150px">템플릿 이름</th><th>언제 나가요</th><th class="mid" style="width:96px">검수</th><th style="width:260px">템플릿 코드</th><th class="mid" style="width:170px">보내는 방법</th></tr></thead><tbody>'+
      ATA_LIST.map(function(x){
        var code=String(ATA.tpls[x[0]]||"");
        return '<tr><td class="c-name">'+esc(x[1])+'</td><td>'+esc(x[2])+'</td>'+
          '<td class="mid"><span class="pill '+(x[3]==="통과"?"ok":"wait")+'">'+(x[3]==="통과"?"완료":(x[3]==="심사 대기"?"심사 대기":"확인 필요"))+'</span></td>'+
          '<td><input type="text" data-ata="'+x[0]+'" value="'+esc(code)+'" placeholder="비어 있음" style="height:36px;font-size:13.5px;font-family:ui-monospace,monospace"></td>'+
          '<td class="mid" data-ataway="'+x[0]+'">'+ataWay(code,x[0])+'</td></tr>'; }).join("")+
      '</tbody></table></div>'+
      '<div class="hint" style="margin:10px 0 0">«확인 필요» 템플릿은 카카오 재검수 중이고, «심사 대기»는 새로 심사받는 중이에요. 통과 전에 코드를 넣으면 알림톡이 실패하고 문자로 대신 나가요 — 안내가 끊기지는 않아요.</div>'+
      '<div class="tools" style="margin:14px 0 0"><button class="btn primary" id="ataSave">코드 저장</button>'+
        '<button class="btn" id="ataRe">새로고침</button></div>'+
    '</div>'+
    '<details class="j-help"><summary>이 화면 사용법</summary><p>코드를 넣고 «코드 저장»을 누르면 그 안내부터 알림톡으로 나가요. 코드를 지우고 저장하면 다시 문자로만 나가요. '+
      '알림톡은 정보만 알릴 수 있어서 결제·충전·연장을 권하는 문구와 버튼은 넣지 않아요.</p></details>';
  host.innerHTML=h;
  Array.prototype.forEach.call(host.querySelectorAll("[data-ata]"),function(inp){
    inp.oninput=function(){ var w=host.querySelector('[data-ataway="'+inp.getAttribute("data-ata")+'"]'); if(w) w.innerHTML=ataWay(inp.value,inp.getAttribute("data-ata")); }; });
  $("ataRe").onclick=function(){ ATA.loaded=false; ataLoad(); };
  $("ataSave").onclick=function(){
    /* 표에 없는 코드도 그대로 다시 보내요 — 서버는 보낸 것으로 통째로 바꿔서, 빠진 키는 지워져요 */
    var map={}, n=0, pf=$("ataPf").value.trim(); Object.keys(ATA.tpls||{}).forEach(function(k){ if(ATA.tpls[k]) map[k]=ATA.tpls[k]; }); if(pf) map.pfId=pf;
    Array.prototype.forEach.call(host.querySelectorAll("[data-ata]"),function(inp){ var v=inp.value.trim(); map[inp.getAttribute("data-ata")]=v; if(v) n++; });
    var tp={}; Object.keys(map).forEach(function(k){ if(k!=="pfId") tp[k]=map[k]; });
    confirmBox("코드를 저장할까요?","코드 넣음 "+n+"개 · 비어 있음(문자로 보냄) "+(ATA_LIST.length-n)+"개","저장",false,function(){
      $("ataSave").disabled=true;
      api("hqAtaSave",[map]).then(function(){ ATA.tpls=tp; if(pf) ATA.pfSet=true; toast("코드를 저장했어요"); ataDraw(); },
        function(e){ $("ataSave").disabled=false; toast(emsg(e,"저장하지 못했어요. 다시 시도해 주세요."),true); });
    });
  };
}
/* 코드 있음 + 서버 준비됨 → 알림톡 먼저 · 코드 있음 + 서버 아직 → 문자로 보냄(서버 준비 중) · 코드 없음 → 문자로 보냄 */
function ataWay(code,key){
  var row=ATA_LIST.filter(function(x){ return x[0]===key; })[0];
  if(row && row[3]==="심사 대기") return '<span class="pill wait" title="카카오 심사가 끝나면 알림톡으로 나가요">문자로 보냄 · 심사 대기</span>';
  if(!String(code||"").trim()) return '<span class="pill gray">문자로 보냄</span>';
  if(ATA.ready.length && ATA.ready.indexOf(key)<0) return '<span class="pill wait" title="서버가 이 안내를 아직 알림톡으로 보내지 않아요">문자로 보냄 · 서버 준비 중</span>';
  return '<span class="pill run">알림톡 먼저</span>'; }

/* ═══════ 받는 금액 › 카드 결제 — 환불 · 자동 결제 스위치 (관리 v4.2) ═══════
   결제 방 요청서 결제/요청서/2026-10-15_관리_환불화면_자동결제스위치.md · 서버 워시 sb10 (설계 12)
   - 환불 금액은 서버가 셈해요: hqPgQuote([주문번호]) → {kind:"plan"|"cash", amount, max, suggest, leftDays?, unusedCash?}
   - 확정: hqPgCancel([주문번호, 사유, 금액]) → {ok, amount, note}  (금액을 비우면 서버 한도)
     · 월 요금: 환불한 금액만큼 이용 기간을 빼요 (30일 기준) · 캐시: 안 쓴 캐시만 · 같은 주문 두 번 환불 안 됨 (서버가 막음)
   - 자동 결제 스위치: hqBillingOn([참/거짓]) · 처음엔 꺼짐 (지금 상태는 hqInfo 의 hq.billing_on) */
var RF_CYCLE = 30;   /* 서버 CYCLE_DAYS 와 같은 값 — 줄어드는 날수 미리 보기용 (실제 셈은 서버) */
function pgTestMode(){ return /^test_/.test(String(PG.clientKey||"")); }
function refundSheet(oid, row){
  openSheet('<h3 style="margin:0 0 4px">환불</h3><div class="hint" style="margin:0 0 12px">서버가 셈한 금액을 불러오는 중이에요…</div>');
  api("hqPgQuote",[oid]).then(function(q){
    q=q||{};
    var isPlan = q.kind==="plan", mx=Number(q.max)||0, sg=Number(q.suggest)||0, amt=Number(q.amount)||0;
    var why = isPlan
      ? ('남은 이용 기간 <b>'+(Number(q.leftDays)||0)+'일</b> / '+RF_CYCLE+'일 → 권장 <b>'+won(sg)+'</b>')
      : ('안 쓴 캐시 <b>'+won(Number(q.unusedCash)||0)+'</b> (부가세 포함 '+won(mx)+') — 쓴 캐시는 환불하지 않아요');
    $("sheet").innerHTML=
      '<h3 style="margin:0 0 4px">환불'+(pgTestMode()?' <span class="pill wait">시험 모드</span>':'')+'</h3>'+
      '<div class="hint" style="margin:0 0 12px">본사만 할 수 있어요. 금액은 서버가 셈한 한도 안에서만 돼요.</div>'+
      '<div class="kv"><span>업체</span><b>'+esc(row.shop)+'</b></div>'+
      '<div class="kv"><span>종류</span><b>'+esc(row.kind)+'</b></div>'+
      '<div class="kv"><span>카드 결제 금액</span><b>'+won(amt)+'</b></div>'+
      '<div class="kv"><span>환불 한도</span><b>최대 '+won(mx)+'</b></div>'+
      '<div class="hint" style="margin:8px 0 12px">'+why+'</div>'+
      '<label class="f" for="rfAmt">환불할 금액 (원)</label>'+
      '<input type="number" id="rfAmt" min="1" max="'+mx+'" value="'+(sg||mx)+'" placeholder="비우면 최대 '+mx+'원">'+
      '<div class="hint" id="rfDays" style="margin:6px 0 10px"></div>'+
      '<label class="f" for="rfWhy">사유</label>'+
      '<input type="text" id="rfWhy" maxlength="100" placeholder="예: 고객 요청 · 중복 결제">'+
      '<div class="sheetbtns" style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">'+
        '<button class="btn" id="rfNo">취소</button><button class="btn primary" id="rfGo"'+(mx>0?'':' disabled')+'>환불 확정</button></div>'+
      (mx>0?'':'<div class="hint" style="margin-top:8px"><b>환불할 금액이 없어요.</b> '+(isPlan?'남은 이용 기간이 없어요.':'남은 캐시가 없어요.')+'</div>');
    openSheet();
    function want(){ var v=$("rfAmt").value.trim(); return v===""?mx:Math.round(Number(v)||0); }
    function hint(){
      var w=want(), el=$("rfDays");
      if(w>mx){ el.innerHTML='<b style="color:var(--stop)">최대 '+won(mx)+'까지만 돼요.</b>'; $("rfGo").disabled=true; return; }
      $("rfGo").disabled = !(w>0);
      el.innerHTML = isPlan
        ? '이용 기간이 약 <b>'+Math.min(RF_CYCLE,Math.round(RF_CYCLE*w/Math.max(1,amt)))+'일</b> 줄어요 (환불한 날수만큼 빼요).'
        : '업체 캐시에서 <b>'+won(Math.round(w/1.1))+'</b>을 빼요.';
    }
    $("rfAmt").oninput=hint; hint();
    $("rfNo").onclick=closeSheet;
    $("rfGo").onclick=function(){
      var w=want(), reason=$("rfWhy").value.trim()||"고객 요청";
      if(!(w>0) || w>mx) return;

/* ═══════ 받는 금액 › 체크 지갑 잇기 (관리 v4.2) ═══════
   체크 검사소의 결제 · 캐시는 이어 둔 워시 지갑(업체)으로 처리돼요. 본사만 이어요. (워시 서버 sb11, 설계 13)
   - 목록: hqCheckWallets() → {ok, offices:[{code, name, wallet, bizNo?, ceo?}]}
       · bizNo · ceo (검사소 사업자번호 · 대표)는 서버 방에 더해 달라고 요청함 — 없으면 화면이 «확인 못 함»으로 더 세게 물어요
   - 잇기 · 바꾸기 · 끊기: hqCheckWallet([검사소코드, 업체코드 또는 ""])
   - 보안 방 권고: 양쪽 사업자번호 · 대표 이름을 나란히 보여 주고, 같은 회사일 때만 잇도록 확정 전에 한 번 더 묻기.
     다르거나 확인할 수 없으면 업체 이름을 직접 적어야 확정돼요. */
var CW = {loaded:false, busy:false, err:"", list:[]};
function cwBiz(v){ return String(v||"").replace(/[^0-9]/g,""); }
function cwName(v){ return String(v||"").replace(/\s+/g,""); }
function cwShop(code){ return (D.shops||[]).filter(function(s){ return s.shop===code; })[0]||null; }
function viewCwal(){
  $("main").innerHTML='<div class="dashhead"><h2>체크 지갑 잇기</h2>'+
    '<div class="sub2">체크 검사소의 이용요금 · 캐시는 여기서 이어 둔 워시 업체 지갑으로 처리돼요. 같은 회사(같은 사업자 · 같은 대표)끼리만 이어 주세요.</div></div>'+
    '<div id="cwBody"><div class="hint">불러오는 중이에요…</div></div>';
  if(CW.loaded) cwDraw(); else cwLoad();
}
function cwLoad(){
  if(CW.busy) return; CW.busy=true;
  api("hqCheckWallets",[]).then(function(r){ CW.loaded=true; CW.err=""; CW.list=(r&&r.offices)||[]; },
    function(e){ CW.loaded=true; CW.err=emsg(e,"불러오지 못했어요. 다시 시도해 주세요."); })
  .then(function(){ CW.busy=false; cwDraw(); });
}
function cwDraw(){
  var host=$("cwBody"); if(!host) return;
  if(CW.err){ host.innerHTML='<div class="card"><div class="hint"><b>체크 지갑 정보를 불러오지 못했어요.</b> 서버 준비가 아직이면 이렇게 보여요 — 서버 방에 확인해 주세요.</div>'+
    '<div class="tools" style="margin:12px 0 0"><button class="btn" id="cwRe">새로고침</button></div></div>';
    $("cwRe").onclick=function(){ CW.loaded=false; cwLoad(); }; return; }
  var linked=CW.list.filter(function(o){ return o.wallet; }).length;
  host.innerHTML='<div class="card"><h2>검사소 '+CW.list.length+'곳 <span class="rt">이어짐 '+linked+' · 안 이어짐 '+(CW.list.length-linked)+'</span></h2>'+
    '<div class="tablebox"><table><thead><tr><th class="c-name" style="left:0">검사소</th><th>사업자번호 · 대표</th><th>이어진 워시 업체</th><th>사업자번호 · 대표</th><th class="mid" style="width:104px">상태</th><th style="width:96px"></th></tr></thead><tbody>'+
    (CW.list.length? CW.list.map(function(o){
      var s=o.wallet?cwShop(o.wallet):null;
      var st=!o.wallet?'<span class="pill gray">안 이어짐</span>':cwMatchPill(o,s);
      return '<tr><td class="c-name" style="left:0">'+esc(o.name||o.code)+'<div class="hint" style="margin:0">'+esc(o.code)+'</div></td>'+
        '<td>'+cwWho(o.bizNo,o.ceo)+'</td>'+
        '<td>'+(o.wallet?esc((s&&s.name)||o.wallet)+'<div class="hint" style="margin:0">'+esc(o.wallet)+'</div>':'—')+'</td>'+
        '<td>'+(o.wallet?cwWho(s&&s.biz_no,s&&s.ceo):'—')+'</td>'+
        '<td class="mid">'+st+'</td>'+
        '<td><button type="button" class="btn sm" data-cw="'+esc(o.code)+'">'+(o.wallet?"바꾸기":"잇기")+'</button></td></tr>'; }).join("")
      : '<tr><td colspan="6" class="empty">체크 검사소가 아직 없어요.</td></tr>')+
    '</tbody></table></div></div>'+
    '<details class="j-help"><summary>이 화면 사용법</summary><p>[잇기]를 누르고 같은 회사의 워시 업체를 고르세요. 양쪽 사업자번호와 대표 이름을 나란히 보여 줘요. '+
    '잘못 이으면 다른 업체의 캐시에서 금액이 나가고 결제 내역이 보이니, 다르면 잇지 마세요. 끊으면 체크 화면은 다시 «아직 준비 중»으로 돌아가요.</p></details>';
  Array.prototype.forEach.call(host.querySelectorAll("[data-cw]"),function(b){
    b.onclick=function(){ cwSheet(b.getAttribute("data-cw")); }; });
}
function cwWho(biz,ceo){
  return (biz?esc(fmtBizNo(biz)):'<span class="hint" style="margin:0">번호 없음</span>')+' · '+(ceo?esc(ceo):'<span class="hint" style="margin:0">대표 없음</span>');
}
/* 같은 회사인지 — "same" 같음 · "diff" 다름 · "unknown" 확인 못 함 */
function cwMatch(o,s){
  if(!s) return "unknown";
  var b1=cwBiz(o.bizNo), b2=cwBiz(s.biz_no), c1=cwName(o.ceo), c2=cwName(s.ceo);
  if(!b1||!b2||!c1||!c2) return "unknown";
  return (b1===b2 && c1===c2) ? "same" : "diff";
}
function cwMatchPill(o,s){
  var m=cwMatch(o,s);
  return m==="same"?'<span class="pill ok">같은 회사</span>':(m==="diff"?'<span class="pill off">다른 회사</span>':'<span class="pill wait">확인 못 함</span>');
}
function cwSheet(code){
  var o=CW.list.filter(function(x){ return x.code===code; })[0]; if(!o) return;
  var shops=(D.shops||[]).filter(function(s){ return s.shop!=="ADMIN"; });
  /* 사업자번호가 같은 업체를 위로 */
  var b1=cwBiz(o.bizNo);
  shops.sort(function(x,y){ return (cwBiz(y.biz_no)===b1&&!!b1)-(cwBiz(x.biz_no)===b1&&!!b1) || String(x.name).localeCompare(String(y.name)); });
  openSheet('<h3 style="margin:0 0 4px">체크 지갑 잇기 — '+esc(o.name||o.code)+'</h3>'+
    '<div class="hint" style="margin:0 0 12px">이 검사소의 이용요금 · 캐시를 처리할 워시 업체를 고르세요. 같은 회사끼리만 이어요.</div>'+
    '<label class="f" for="cwSel">워시 업체</label>'+
    '<select id="cwSel"><option value="">— 끊기 (아무 지갑과도 잇지 않음)</option>'+
      shops.map(function(s){ return '<option value="'+esc(s.shop)+'"'+(s.shop===o.wallet?" selected":"")+'>'+esc(s.name||s.shop)+' ('+esc(s.shop)+')'+(b1&&cwBiz(s.biz_no)===b1?' · 사업자번호 같음':'')+'</option>'; }).join("")+
    '</select>'+
    '<div id="cwCmp" style="margin-top:14px"></div>'+
    '<div class="sheetbtns" style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">'+
      '<button class="btn" id="cwNo">취소</button><button class="btn primary" id="cwGo">확정</button></div>');
  function cmp(){
    var w=$("cwSel").value, s=w?cwShop(w):null, m=w?cwMatch(o,s):"";
    function row(k,v1,v2,hl){ return '<div style="color:var(--muted);font-weight:700">'+k+'</div><div style="min-width:0;overflow-wrap:anywhere">'+v1+'</div><div style="min-width:0;overflow-wrap:anywhere'+(hl?';font-weight:700':'')+'">'+v2+'</div>'; }
    var tb='<div style="display:grid;grid-template-columns:72px minmax(0,1fr) minmax(0,1fr);gap:8px 12px;font-size:13.5px;padding:12px 14px;border:1px solid var(--line);border-radius:12px">'+
      row('','<b>체크 검사소</b>','<b>워시 업체</b>')+
      row('이름',esc(o.name||o.code),s?esc(s.name||s.shop):'—')+
      row('사업자번호',o.bizNo?esc(fmtBizNo(o.bizNo)):'없음',s&&s.biz_no?esc(fmtBizNo(s.biz_no)):(s?'없음':'—'))+
      row('대표',o.ceo?esc(o.ceo):'없음',s&&s.ceo?esc(s.ceo):(s?'없음':'—'))+'</div>';
    var msg = !w ? '<div class="hint" style="margin-top:10px">끊으면 이 검사소의 체크 결제 화면은 «아직 준비 중»으로 돌아가요.</div>'
      : m==="same" ? '<div class="hint" style="margin-top:10px"><span class="pill ok">같은 회사</span> 사업자번호와 대표가 같아요.</div>'
      : '<div class="hint" style="margin-top:10px;background:var(--stop-bg);border-radius:10px;padding:10px 12px">'+
          '<b style="color:var(--stop)">'+(m==="diff"?"사업자번호나 대표가 달라요.":"양쪽을 비교할 수 없어요 (번호나 대표가 비어 있음).")+'</b><br>'+
          '잘못 이으면 다른 업체의 캐시에서 금액이 나가고 결제 내역이 보여요. 정말 같은 회사라면 아래에 워시 업체 이름 <b>'+esc(s?(s.name||s.shop):"")+'</b>을 그대로 적어 주세요.'+
          '<input type="text" id="cwType" placeholder="업체 이름 그대로" style="margin-top:8px"></div>';
    $("cwCmp").innerHTML=(w?tb:'')+msg;
    var need=w && m!=="same";
    function ok(){ $("cwGo").disabled = need && cwName($("cwType")&&$("cwType").value)!==cwName(s&&(s.name||s.shop)); }
    if($("cwType")) $("cwType").oninput=ok; ok();
  }
  $("cwSel").onchange=cmp; cmp();
  $("cwNo").onclick=closeSheet;
  $("cwGo").onclick=function(){
    var w=$("cwSel").value, s=w?cwShop(w):null, m=w?cwMatch(o,s):"";
    if(w===String(o.wallet||"")){ closeSheet(); return; }
    var t = !w ? (o.name+"을(를) 지갑에서 끊을까요?") : (o.name+" ↔ "+(s?s.name:w)+" 을(를) 이을까요?");
    var body = !w ? "체크 결제 화면이 «아직 준비 중»으로 돌아가요."
      : "사업자번호 "+(o.bizNo?fmtBizNo(o.bizNo):"없음")+" / "+(s&&s.biz_no?fmtBizNo(s.biz_no):"없음")+" · 대표 "+(o.ceo||"없음")+" / "+(s&&s.ceo||"없음")+
        (m==="same"?"":"\n같은 회사인지 확인하지 못했어요.")+"\n이 검사소의 결제 · 캐시가 이 업체 지갑으로 처리돼요.";
    confirmBox(t, body, w?"잇기":"끊기", m!=="same", function(){
      $("cwGo").disabled=true;
      api("hqCheckWallet",[o.code, w]).then(function(){ o.wallet=w; closeSheet(); toast(w?"이었어요":"끊었어요"); cwDraw(); },
        function(e){ $("cwGo").disabled=false; toast(emsg(e,"바꾸지 못했어요. 다시 시도해 주세요."),true); });
    });
  };
}

/* ═══════ 계정 › 번호로 계정 찾기 (관리 v4.3 시안) ═══════
   대표님 지시 (결정 기록 2026-10-15): 모든 제품의 계정을 관리 한 곳에서 컨트롤.
   창구 모양: 워시 서버 sb12 (보안 통과) · 서버/설계/14
     hqPerson([휴대폰 전체]) → {phone, wash:[{shop,name,role,active,last_login}], washOwnerOf:[{shop,name,active}],
        check:[{office,officeName,name,role,active,pwSet}], drivers:[{id,office,officeName,name,active,lastIn,mustChange}],
        dealer:{name,active,withdrawn,lastLogin}|null, cgg:{name,products,active,twoStep,locked}|null,
        locks:{wash,check,cgg}, sessions:{wash,check,cgg,dealer}}   — 찾기만 해도 기록에 남아요
     hqPersonAct([휴대폰, 동작, 대상, 확인]) — 동작 stop · resume · pwReset · unlock · kick · grant · revoke
        멈추기 대상 all · wash · check:<검사소> · driver:<id> · dealer · cgg / 끊기 · 잠금 풀기 대상 all · wash · check · driver · cgg · dealer
        비밀번호 초기화 wash · check:<검사소> · driver:<id> → {note}. 기사 임시 비밀번호는 기사 휴대폰으로 문자로만 가요 (화면에 안 보여요)
        제품 열기(grant) 가 처음이면 {confirm:true, why} → 한 번 더 묻고 확인=true 로 다시 보내요
        한 시간에 바꿀 수 있는 횟수가 정해져 있어요 (넘으면 서버가 알려 줘요)
     hqAudit([휴대폰]) → {list:[{at,who,action,target_phone,product(=대상),result,detail}]}
     hqCheckPwSms([]) → {on} · ([true|false]) 켜고 끄기 — 체크 비밀번호 초기화는 이것이 켜져 있어야 돼요 */
var PPL = {q:"", busy:false, err:"", r:null, audit:[], pwSms:null};
var PACT_LOG = {view:"찾아봄", checkPwSms:"체크 비밀번호 문자 켜기 · 끄기"};
var PROD_NAME = {wash:"워시", check:"체크", dealer:"딜러", cgg:"통합 로그인", driver:"배달 기사", parking:"파킹", studio:"스튜디오"};
var PACT = {
  stop:   ["멈추기",        "이 계정으로 로그인할 수 없게 되고, 켜 둔 기기도 끊겨요. 자료는 그대로 남아요.", true],
  resume: ["다시 쓰기",     "멈춘 계정을 다시 쓸 수 있게 해요.", false],
  pwReset:["비밀번호 초기화","지금 비밀번호를 못 쓰게 하고 로그인을 끊어요. 워시는 본인이 «비밀번호 찾기»로, 체크는 다음 로그인 때 문자 확인으로 새로 정해요. 배달 기사는 임시 비밀번호가 기사 휴대폰으로 문자로 가요.", true],
  unlock: ["잠금 풀기",     "비밀번호 · 인증번호를 여러 번 틀려 잠긴 것을 풀어요.", false],
  kick:   ["접속 끊기",     "지금 켜 둔 기기에서 모두 로그아웃시켜요. 다시 로그인하면 쓸 수 있어요.", true],
  grant:  ["제품 열기",     "통합 로그인에서 이 제품을 쓸 수 있게 열어요.", false],
  revoke: ["제품 닫기",     "통합 로그인에서 이 제품이 사라져요. 다른 제품은 그대로예요.", true]
};
function pv(o,ks,d){ for(var i=0;i<ks.length;i++){ if(o && o[ks[i]]!==undefined && o[ks[i]]!==null && o[ks[i]]!=="") return o[ks[i]]; } return d; }
function tgtTxt(t){ t=String(t||""); var p=t.split(":");
  if(t==="all") return "모든 제품"; if(p[0]==="driver") return "배달 기사 "+(p[1]||""); return (PROD_NAME[p[0]]||p[0])+(p[1]?" · "+p[1]:""); }
function roleTxt(r){ return ({owner:"대표",staff:"직원",manager:"관리자",admin:"관리자",driver:"기사",dealer:"딜러"})[r]||r||"-"; }
/* 체크 비밀번호 초기화 준비 스위치 — 체크 서버 v26 이상(첫 비밀번호 문자 확인)이 운영 중일 때만 켜요 */
function pplSwDraw(){

   받는 번호는 서버가 가려 주지만, 화면에서도 한 번 더 가려요 (앞 3자리 · 끝 4자리만).
   요금은 대략: 알림톡 13원 · SMS 18원 · LMS 45원 (VAT 별도) — 알림톡 방 · 결제 방 기준 */
var SLOG = {from:"", to:"", list:null, err:"", busy:false};

function slv(o,ks,d){ for(var i=0;i<ks.length;i++){ var v=o&&o[ks[i]]; if(v!==undefined&&v!==null&&v!=="") return v; } return d; }
function slMask(p){ var t=String(p||""), d=t.replace(/\D/g,"");
  if(!d) return "-";
  if(/\*/.test(t) && d.length<=7) return t;            /* 서버가 이미 가린 모양 (010-****-1234) 그대로 */
  if(d.length>=8) return d.slice(0,3)+"-****-"+d.slice(-4);

/* 최종 결과 넷: ata(알림톡 도착) · sms(문자 대체) · fail(실패) · wait(대기) */

  if(/sms|lms|문자|대체|fallback|replace/.test(t)) return "sms";

  return "wait"; }

function navOf(t){ return NAV.filter(function(g){ return g[2].indexOf(t)>=0; })[0]||null; }

function render(){
  var sb0=$("setSub"); if(sb0 && sb0.parentNode!==$("jh")) $("jh").appendChild(sb0);
  var g = navOf(TAB);
  if(g) NAV_LAST[g[0]] = TAB;
  $("nav").innerHTML = NAV.map(function(n){
    var on = !!g && g[0]===n[0];
    return '<button data-t="'+n[0]+'" role="tab" title="'+esc(n[1])+'" aria-selected="'+on+'">'+ic(NAVIC[n[0]]||"menu")+'<span class="lbl">'+esc(n[1])+'</span></button>';
  }).join("");
  Array.prototype.forEach.call($("nav").children,function(b){
    b.onclick=function(){
      var k=b.getAttribute("data-t"), cur=navOf(TAB);
      /* 설정을 한 번 더 누르면 원래 보던 화면으로 — 워시와 같음 */
      if(k==="settings" && cur && cur[0]==="settings"){ TAB=NAV_PREV||"sum"; window.scrollTo(0,0); render(); return; }
      if(!cur || cur[0]!=="settings") NAV_PREV=TAB;
      var n=NAV.filter(function(x){return x[0]===k;})[0];
      /* 설정만 마지막에 본 작은 탭을 기억합니다 (워시와 같음). 나머지 묶음은 누르면 첫 화면 */
      TAB = (k==="settings" && NAV_LAST[k]) || n[2][0];
      window.scrollTo(0,0); render(); };
  });
  /* 둘째 줄 — 묶음 안에 화면이 둘 이상일 때만 (워시 설정 줄과 같은 모양) */
  var subs = g ? g[2] : [];
  $("setSub").hidden = subs.length<2;
  $("setSub").setAttribute("data-label", g ? g[1] : "");
  $("setSub").innerHTML = subs.length<2 ? "" : subs.map(function(t){
    return '<button data-s="'+t+'" aria-selected="'+(t===TAB)+'">'+esc(tabLabel(t))+'</button>'; }).join("");
  Array.prototype.forEach.call($("setSub").children,function(b){
    b.onclick=function(){ TAB=b.getAttribute("data-s"); window.scrollTo(0,0); render(); }; });

  (f?f[2]:viewSummary)();
  /* ② 묶음 › 화면 이름 (모든 화면 같은 자리) */
  addCrumb();
  tbarDraw();
}

    ["sum","shops","pays","tax"].indexOf(k)<0?"all":k,
    function(t){ if(t==="all") allSheet(); else { var n=NAV.filter(function(z){return z[0]===t;})[0]; jgo(n?n[2][0]:t); } });
}
function allSheet(){
  openSheet('<h3 style="margin:0 0 12px">전체 메뉴</h3><div class="j-allm">'+NAV.map(function(n){
    return '<div><h4>'+esc(n[1])+'</h4><div class="row">'+n[2].map(function(t){
      return '<button type="button" data-go2="'+t+'" class="'+(t===TAB?"on":"")+'">'+esc(tabLabel(t))+'</button>'; }).join("")+'</div></div>'; }).join("")+
    '<div><h4>마이페이지</h4><div class="row"><button type="button" data-go3="lay">화면 설정</button><button type="button" data-go3="out">로그아웃</button></div></div></div>');
  Array.prototype.forEach.call($("sheet").querySelectorAll("[data-go2]"),function(b){
    b.onclick=function(){ closeSheet(); jgo(b.getAttribute("data-go2")); }; });
  Array.prototype.forEach.call($("sheet").querySelectorAll("[data-go3]"),function(b){
    b.onclick=function(){ closeSheet(); if(b.getAttribute("data-go3")==="lay") laySheet(); else $("btnOut").click(); }; });
}

/* ② 화면 머리 — 공통 부품 1.3 의 모양(.cgg-head > .hello + .acts)으로 맞춰요.
   화면마다 만든 제목 · 설명 · 버튼을 «옮기기만» 해서 id 와 누르면 하는 일은 그대로예요. 화면이 다시 그려져도 늘 붙어요. */
function addCrumb(){
  var dh=$("main").querySelector(".dashhead"); if(!dh || dh.classList.contains("cgg-head")) return;
  var g=navOf(TAB), kids=Array.prototype.slice.call(dh.children);
  var hello=document.createElement("div"); hello.className="hello";
  var acts=document.createElement("div"); acts.className="acts";
  if(!dh.querySelector(":scope > .jcrumb") && g)
    hello.insertAdjacentHTML("beforeend",'<small class="jcrumb">'+esc(g[1])+(g[1]===tabLabel(TAB)?"":" › "+esc(tabLabel(TAB)))+'</small>');
  kids.forEach(function(c){ (c.tagName==="BUTTON"||c.classList.contains("btns")?acts:hello).appendChild(c); });
  dh.classList.add("cgg-head"); dh.appendChild(hello); if(acts.children.length) dh.appendChild(acts);
}
try{ new MutationObserver(addCrumb).observe($("main"),{childList:true}); }catch(e){}
