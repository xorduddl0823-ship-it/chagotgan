body{background:var(--bg);color:var(--text);font-size:15px}
svg.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}


/* ───────── 머리말 — 관리만 있는 것 (틀 · 메뉴 · 배치 · 탭바 · 할 일 카드 · 사람 단추 ▾는 공통 부품 cgg-j4 1.2) ───────── */
.cgg-hdr{color:#fff}
.j-ci{font-size:15px}
.jh-brand b{display:flex;align-items:center;gap:6px;color:#fff}
.jh-prod{height:24px;padding:0 9px;border-radius:999px;border:1px solid #ffffff40;background:#ffffff1a;color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center}
.jh-brand small #hVer{display:inline;font-size:inherit;opacity:1;max-width:none}
#hBiz.jh-biz{color:#fff;max-width:none}
#hBiz.jh-biz b{font-weight:700;color:inherit;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hBiz.jh-biz small{display:block;font-size:12px;opacity:.7}
.jhb{height:32px;padding:0 11px;border-radius:10px;border:1px solid #ffffff30;background:#ffffff12;color:#fff;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.jhb:hover{background:#ffffff22}
.jhb svg.ic{width:15px;height:15px}
.jh-me{height:38px;padding:0 12px 0 6px;border-radius:999px;border:1px solid #ffffff30;background:#ffffff12;color:#fff;display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:13px;cursor:pointer;position:relative;text-align:left;line-height:1.2}
.jh-me b{display:block;font-size:13px;font-weight:700}
.jh-me small{display:block;opacity:.7;font-size:11px}
.j-av{width:28px;height:28px;border-radius:50%;background:var(--sky);color:var(--navy);display:grid;place-items:center;font-weight:900;font-size:12px;flex:none}
.jh-me .car{opacity:.8;font-size:11px}
.cgg-nav button{min-width:0;box-shadow:none}
.cgg-sub{background:var(--bg)}
.cgg-sub[hidden]{display:none}
.cgg-sub button{min-width:0;font-weight:500;box-shadow:none}
.cgg-sub button[aria-selected="true"]{font-weight:700}
.cgg-act .ar{color:#98A2B3}
@media (min-width:1000px){
  .lay-side .jhb,.lay-icon .jhb{height:40px;border-radius:12px;border:1px solid var(--ln2);background:var(--surface);color:var(--btn-ink);font-size:13px}
  .lay-side .jh-me,.lay-icon .jh-me{border-color:var(--ln2);background:var(--surface);color:var(--text)}
  .lay-side #hBiz.jh-biz{color:#ffffffb3}
  .lay-side #hBiz.jh-biz b{color:#fff;font-size:13.5px;white-space:normal}
  .lay-icon #hBiz.jh-biz{color:var(--text)}
  .lay-icon #hBiz.jh-biz b{color:var(--text);font-size:15px}
  .lay-icon #hBiz.jh-biz small{color:var(--muted);opacity:1}
}

/* ───────── 본문 머리 (② 묶음 › 제목 + 설명) ───────── */
.jcrumb{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
.dashhead{margin:0 0 18px}
.dashhead h2{font-size:28px;font-weight:900;letter-spacing:-.8px;line-height:1.3;text-wrap:balance}
.dashhead .sub2,.sub2{font-size:14px;color:var(--muted);margin-top:6px}
.dashhead h2 em,.jtalk em{font-style:normal;color:var(--blue)}

/* ───────── 카드 · 숫자 칸 ───────── */
.card{background:var(--surface);border:0;border-radius:var(--r-card);box-shadow:var(--sh);padding:20px 22px;margin-bottom:16px}
.card h2,.card h3{font-size:16px;font-weight:900}
.sums{gap:12px;margin-bottom:16px}
.sum{background:var(--surface);border:0;border-radius:var(--r-card);box-shadow:var(--sh);padding:18px 20px;text-align:left}
.sum span{font-size:13px;color:var(--muted);font-weight:500}
.sum b{display:block;font-size:26px;font-weight:900;letter-spacing:-.6px;margin-top:6px;font-variant-numeric:tabular-nums}

/* ───────── 버튼 · 입력 칸 (높이 43, 모서리 12) ───────── */
button.btn{height:var(--ctl);padding:0 18px;border-radius:var(--r-ctl);border:1px solid var(--ln2);background:var(--surface);font-size:14px;font-weight:700;color:var(--btn-ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.btn:hover{border-color:#C9D2DC}
button.btn.pri,button.btn.primary,button.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 16px -8px #1668C4cc}
input[type=text],input[type=tel],input[type=number],input[type=password],input[type=date],select,textarea{border-radius:var(--r-ctl);border-color:var(--ln2);background:var(--surface)}
.tools > input[type=date],.tools > input[type=text],.tools > select,.tools > button.btn,.tools > label.chip{height:var(--ctl)}
.mini{border-radius:10px;border-color:var(--ln2)}

/* ───────── 표 (머리 40 · 줄 50 · 가로선만 · 선택 네모 20) ───────── */
.tablebox{border:0;border-radius:var(--r-card);box-shadow:var(--sh);background:var(--surface)}
.tablebox table{font-size:14px}
.tablebox th,.tablebox td{padding:0 14px;border-bottom:1px solid #F0F2F5}
.tablebox thead th{height:40px;background:var(--surface);font-size:12.5px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line)}
.tablebox td{height:50px}
.tablebox tbody tr:hover td{background:var(--hov)}
.tablebox thead th.c-name,.tablebox thead th.c-chk{background:var(--surface)}
.tablebox th.c-chk,.tablebox td.c-chk{width:56px}
.tablebox td.c-name{font-weight:700;box-shadow:6px 0 6px -6px #0B254522}
input[type=checkbox]{appearance:none;-webkit-appearance:none;margin:0;width:20px;height:20px;border:1.5px solid #C5CED8;border-radius:6px;
  background:#fff;display:inline-grid;place-content:center;cursor:pointer;vertical-align:middle;color-scheme:light}
input[type=checkbox]::after{content:"";width:10px;height:6px;border:2.2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
input[type=checkbox]:checked{background:var(--blue);border-color:var(--blue)}
input[type=checkbox]:checked::after{opacity:1}
.tablebox input[type=checkbox]{width:20px;height:20px}
.pager .btn{height:34px;padding:0 12px;font-size:13px}

/* ───────── 상태 표시 (진행 중 · 완료 · 확인 필요 · 보류) ───────── */
.pill{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:6px;font-size:12px;font-weight:700}
.pill.run{background:var(--run-bg);color:var(--run)}
.pill.ok{background:var(--done-bg);color:var(--done)}
.pill.wait{background:var(--chk-bg);color:var(--chk)}
.pill.off{background:var(--stop-bg);color:var(--stop)}

.j-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 16px}
.j-kpi{position:relative;padding:18px 20px;background:var(--surface);border-radius:var(--r-card);box-shadow:var(--sh);min-width:0}
.j-kpi small{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.j-kpi small i{width:10px;height:10px;border-radius:3px}
.j-kpi strong{display:block;font-size:30px;font-weight:900;letter-spacing:-.8px;margin-top:8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.j-kpi strong em{font-style:normal;font-size:14px;color:var(--muted);font-weight:700;margin-left:3px}
.j-kpi .tr{font-size:12.5px;font-weight:500;color:var(--muted);margin-top:4px;display:block}
.j-kpi .tr.bad{color:var(--stop);font-weight:700}
@media (max-width:1100px){ .j-kpis{grid-template-columns:repeat(2,minmax(0,1fr))} }
/* 도움 카드 (⑦ 이 화면 사용법) */
.j-help{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--sh);padding:0 20px;margin-top:16px}
.j-help summary{height:50px;display:flex;align-items:center;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer}
.j-help p{margin:0 0 16px;font-size:14px;color:var(--muted);line-height:1.7}

/* 창 (확인 400 · 입력 560) */
.askbox{border-radius:var(--r-card);max-width:400px}
.sheet{border-radius:var(--r-card) var(--r-card) 0 0}
@media (min-width:700px){ .sheet{max-width:560px;border-radius:var(--r-card)} }


/* ───────── 폰 (600px 이하) — 관리 본문 ───────── */
@media (max-width:600px){
  body{font-size:13.5px}
  .jh-prod{height:22px;font-size:11px;padding:0 8px}
  #btnReload{height:28px;padding:0 9px;font-size:12px;border-radius:8px}
  #btnReload .lbl{display:none}
  .jh-me{height:30px;padding:0;border:0;background:transparent}
  .jh-me .wt,.jh-me .car{display:none}
  .dashhead h2{font-size:19px;letter-spacing:-.5px;line-height:1.35}
  .dashhead .sub2{font-size:12.5px;margin-top:3px}
  .jcrumb{font-size:11.5px;margin-bottom:3px}
  .card{border-radius:14px;padding:14px 14px;margin-bottom:10px}
  .sums{gap:8px;margin-bottom:10px}
  .sum{border-radius:14px;padding:11px 12px}
  .sum span{font-size:11.5px}
  .sum b{font-size:19px;margin-top:4px}
  button.btn{height:38px;font-size:13px;padding:0 12px}
  .tools > input[type=date],.tools > input[type=text],.tools > select,.tools > button.btn,.tools > label.chip{height:38px}
  .tablebox{border-radius:14px}
  .j-kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}
  .j-kpi{padding:11px 12px;border-radius:14px}
  .j-kpi small{font-size:11.5px;gap:6px}
  .j-kpi strong{font-size:19px;margin-top:4px;letter-spacing:-.4px}
  .j-kpi strong em{font-size:11.5px}
  .j-kpi .tr{font-size:11px;margin-top:1px}
  .askbox{max-width:calc(100vw - 24px)}
}

/* 「전체 메뉴」 창 (폰 아래 탭바 «전체») */
.j-allm{display:grid;gap:14px}
.j-allm h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:700}
.j-allm .row{display:flex;flex-wrap:wrap;gap:6px}
.j-allm .row button{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--ln2);background:var(--surface);font:inherit;font-size:13.5px;color:var(--text);cursor:pointer}
.j-allm .row button.on{background:var(--tabon);color:var(--blue);border-color:transparent;font-weight:700}

/* ═══ 공통 부품 1.3 에 맞춘 관리 몫 ═══ */
/* 창 · 묻는 창 · 알림 글 — 층은 이름(--z-…)만 써요 */
.sheetbg,.sheet{z-index:var(--z-dialog)}
.sheet{border-radius:22px 22px 0 0}
@media (min-width:700px){ .sheet{border-radius:22px} }
.sheetx svg.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.cgg-dlg .jask{white-space:pre-wrap;font-size:14.5px;line-height:1.6;color:var(--text);margin:-4px 0 0}
.cgg-dlg .cgg-btn.pri.danger{background:var(--stop);border-color:var(--stop);box-shadow:none}
.cgg-toastbox.bad{background:var(--stop)}
/* 글 속 작은 선 아이콘 (예전 그림 문자 자리) */
.jic{display:inline-flex;vertical-align:-2px} .jic svg.ic{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* 화면 머리 — 관리 제목은 h2 · 설명은 .sub2 로 남겨 두고 공통 칸 안에 넣어요 */
.dashhead.cgg-head .hello h2{margin:0}
.dashhead.cgg-head .acts .btn{white-space:nowrap}

/* 관리 v4.4 — 거르기 알약 안 고르기 상자 · 표 안 꼬리표 */
.cgg-fp.jfp{text-align:center}
.cgg-fp.jfp select{border:0;background:transparent;font:inherit;font-weight:inherit;color:inherit;height:auto;width:auto;padding:0;margin:0;cursor:pointer;outline:0;max-width:200px;line-height:normal;-webkit-appearance:none;appearance:none}
/* 예전 관리 표 · 글자 규칙이 공통 표에 새지 않게 (줄 높이 · 머리 고정 · 칸 맞춤 · 고르기 너비 · 폰 글자) */
.cgg-card{line-height:normal}
.cgg-card .cgg-table th:not(.fx0):not(.fx1){position:static}
.cgg-card .cgg-table td:not(.n):not(.c):not(.fx0){text-align:start}
.cgg-card .cgg-st{text-align:inherit}
.cgg-card select{width:auto;min-width:0;max-width:none;margin:0}
.cgg-card .cgg-find input{height:auto;padding:1px 2px;border:0;box-shadow:none;margin:0;min-width:0;max-width:none;border-radius:0}
@media (max-width:600px){ .cgg-card{font-size:15px} }
.cgg-table td .cgg-st+.cgg-st{margin-left:4px} .cgg-table td.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.card>.cgg-card{box-shadow:none;margin:0}
/* ═══ 공통 부품 (디자인 방 · 글자 그대로) ═══ */
/* ═══════════════════════════════════════════════════════════════════
   차곳간 공통 부품 · J안 4판 · cgg-j4 1.5 (2026-10-15, 디자인 방)
   ① 메뉴 배치 셋 (가로 · 세로 · 아이콘)  ② 폰 아래 탭바  ③ 홈 할 일 카드 3장  ④ 사람 단추 ▾ 펼침 (1.1)
   ⑤ 체험 모드 — 미리 써 보기(가입 전) · 체험판(결제 전) 띠 · 자물쇠 · 3번 표시 · 기능 카드 (1.2)
   ⑥ 화면 일곱 칸 본문 — 화면 머리 · 버튼 · 숫자 카드 4개 · 데이터 카드(상태 탭 · 거르기 · 표 · 폰 목록 · 쪽) · 도움 카드 · 창 3종 · 알림 글 (1.3)
   + 한국어 낱말 단위 줄바꿈 (keep-all)
   바탕: 관리 v4.0 의 관리/v4재료/j4.css (값 그대로). 관리 전용 id(#app · #nav · #setSub · #main)를
         모든 제품이 붙일 수 있는 이름표(class)로 바꿨어요.

   붙이는 법 — 원래 id · class 는 그대로 두고 아래 class 만 «더해» 주세요 (JS 가 쓰는 이름은 안 바꿈)
     바깥 상자      class="cgg-app"          (메뉴 배치는 cgg-j4.js 가 lay-top · lay-side · lay-icon 를 붙임)
     머리말         class="cgg-hdr"          그 안: .cgg-top > .cgg-brand · .cgg-biz · .cgg-right
     큰 메뉴        class="cgg-nav"          단추마다 <svg class="ic">아이콘</svg><span class="lbl">이름</span>, 고른 것은 aria-selected="true"
     안쪽 작은 탭   class="cgg-sub"
     본문           class="cgg-main"
     폰 아래 탭바   <nav class="cgg-tbar"></nav>   (cgg-j4.js 의 CGG.tabbar 가 채움)
     할 일 카드     <div class="cgg-acts"></div>    (cgg-j4.js 의 CGG.todos 가 채움)
   이 파일은 각 제품 <style> 의 «맨 마지막»에 넣어요 (앞의 값을 덮어야 해서).
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --blue:#1668C4; --navy:#0B2545; --sky:#8FC9F2;
  --bg:#F3F5F8; --surface:#FFFFFF; --surface2:#F7F9FC; --text:#101828; --muted:#667085;
  --line:#EAECF0; --ln2:#E3E8EE; --hov:#F7F9FC; --tabon:#E8F1FC;
  --run:#1668C4; --run-bg:#E6F0FB; --done:#1E9E5A; --done-bg:#E4F5EC;
  --chk:#B26B00; --chk-bg:#FFF2DD; --stop:#D64545; --stop-bg:#FDE8E8;
  --btn-ink:#344054; --r-card:18px; --r-ctl:12px; --ctl:43px;
  --sh:0 1px 2px #1018280d,0 12px 32px -20px #0B254540;
  /* 층 순서 (1.1) — 모든 제품이 이 값만 써요. 숫자를 직접 쓰지 않아요.
     본문 0 < 작은 탭 28 < 머리말 30 < 폰 아래 탭바 60 < 사람 단추 ▾ 70 < 창(어두운 막 + 확인 · 입력 · 자세히) 90 < 알림 글(토스트) 100 */
  --z-sub:28; --z-hdr:30; --z-tbar:60; --z-drop:70; --z-dialog:90; --z-toast:100;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e141c;--surface:#161e28;--surface2:#1d2733;--text:#e8edf4;--muted:#95a3b6;--line:#2b3644;--ln2:#334052;
  --hov:#1d2733;--tabon:#102B47;--blue:#5FA8E8;
  --run:#5FA8E8;--run-bg:#102B47;--done:#4ad48f;--done-bg:#12312a;--chk:#f0a95e;--chk-bg:#332412;--stop:#ff8b82;--stop-bg:#331614;
  --sh:0 2px 10px rgba(0,0,0,.4);--btn-ink:#d0d8e2;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141c;--surface:#161e28;--surface2:#1d2733;--text:#e8edf4;--muted:#95a3b6;--line:#2b3644;--ln2:#334052;
  --hov:#1d2733;--tabon:#102B47;--blue:#5FA8E8;
  --run:#5FA8E8;--run-bg:#102B47;--done:#4ad48f;--done-bg:#12312a;--chk:#f0a95e;--chk-bg:#332412;--stop:#ff8b82;--stop-bg:#331614;
  --sh:0 2px 10px rgba(0,0,0,.4);--btn-ink:#d0d8e2;color-scheme:dark}

/* 한국어 줄바꿈은 낱말 단위로 («받을 금/액»처럼 끊기지 않게) */
.cgg-app,.cgg-sheet{word-break:keep-all;overflow-wrap:anywhere}
.cgg-app svg.ic,.cgg-tbar svg.ic,.cgg-acts svg.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ───────── ① 틀: 가로 메뉴 (기본) ───────── */
.cgg-app{box-sizing:border-box;background:var(--bg);color:var(--text);min-height:100%}
.cgg-app *,.cgg-tbar *{box-sizing:border-box}
.cgg-hdr{box-sizing:border-box;position:sticky;top:env(safe-area-inset-top,0px);z-index:var(--z-hdr);background:var(--navy);color:#fff}
.cgg-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 22px}
.cgg-brand{display:flex;align-items:center;gap:10px;width:300px;min-width:0;flex:none}
.cgg-brand .cgg-ci{width:34px;height:34px;border-radius:10px;background:var(--sky);color:var(--navy);display:grid;place-items:center;font-weight:900;flex:none}
.cgg-brand b{font-size:16px;font-weight:900}
.cgg-brand small{display:block;font-size:11.5px;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cgg-biz{font-size:12.5px;line-height:1.35;min-width:0} .cgg-biz b{display:block;font-size:14px}
.cgg-right{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.cgg-nav{display:flex;gap:4px;padding:8px 18px 10px;background:var(--surface);overflow-x:auto;scrollbar-width:none;box-shadow:0 1px 0 var(--line)}
.cgg-nav button{flex:none;border:0;background:transparent;font:inherit;font-size:14px;color:#6B7684;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.cgg-nav button svg.ic{display:none}
.cgg-nav button:hover{color:var(--text)}
.cgg-nav button[aria-selected="true"]{color:var(--blue);background:var(--tabon);font-weight:700}
.cgg-sub{display:flex;gap:6px;padding:12px 22px 0;overflow-x:auto;scrollbar-width:none}
.cgg-sub button{flex:none;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--ln2);background:var(--surface);font:inherit;font-size:13px;cursor:pointer;color:var(--muted)}
.cgg-sub button[aria-selected="true"]{background:var(--tabon);color:var(--blue);border-color:transparent;font-weight:700}
.cgg-main{padding:22px 22px 44px}
.cgg-app :focus-visible{outline:3px solid var(--sky);outline-offset:2px}

/* ───────── ① 세로 메뉴 · 아이콘 메뉴 (넓은 화면에서만, 폰은 늘 같은 모양) ───────── */
@media (min-width:1000px){
  .cgg-app.lay-side{padding-left:252px} .cgg-app.lay-icon{padding-left:76px}
  .lay-side > .cgg-hdr,.lay-icon > .cgg-hdr{position:fixed;left:0;top:0;bottom:0;width:252px;overflow-y:auto;display:flex;flex-direction:column;padding:18px 14px;gap:3px}
  .lay-icon > .cgg-hdr{width:76px;padding:14px 0;align-items:center;gap:4px}
  .lay-side .cgg-top,.lay-icon .cgg-top{display:contents}
  .lay-side .cgg-brand{width:auto;padding:2px 4px 14px}
  .lay-side .cgg-biz{background:#ffffff0f;border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:12px;color:#ffffffb3}
  .lay-side .cgg-nav,.lay-icon .cgg-nav{order:2;flex-direction:column;background:transparent;box-shadow:none;padding:0;gap:3px;overflow:visible}
  .lay-side .cgg-nav button{position:relative;width:100%;gap:12px;font-size:14.5px;color:#ffffffb8;padding:10px 12px;text-align:left}
  .lay-side .cgg-nav button svg.ic,.lay-icon .cgg-nav button svg.ic{display:block}
  .lay-side .cgg-nav button:hover,.lay-icon .cgg-nav button:hover{background:#ffffff0d;color:#fff}
  .lay-side .cgg-nav button[aria-selected="true"]{background:#ffffff1a;color:#fff;font-weight:700}
  .lay-side .cgg-nav button[aria-selected="true"]::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--sky)}
  /* 오른쪽 위 버튼은 본문 윗줄(흰 띠)로 — 남색이 두 겹이 되지 않게 */
  .lay-side .cgg-right,.lay-icon .cgg-right{position:fixed;top:0;right:0;left:252px;z-index:calc(var(--z-hdr) - 1);height:64px;margin:0;padding:0 32px;background:var(--surface);box-shadow:0 1px 0 var(--line);justify-content:flex-end;flex-wrap:nowrap}
  .lay-icon .cgg-right{left:76px}
  .lay-side .cgg-sub,.lay-icon .cgg-sub{position:fixed;top:64px;left:252px;right:0;z-index:var(--z-sub);padding:12px 32px;background:var(--bg)}
  .lay-icon .cgg-sub{left:76px}
  .lay-side > .cgg-main,.lay-icon > .cgg-main{padding:86px 32px 44px}
  .lay-side.hasSub > .cgg-main,.lay-icon.hasSub > .cgg-main{padding-top:132px}
  .lay-icon .cgg-brand{width:auto;padding:0 0 12px} .lay-icon .cgg-brand > div{display:none}
  .lay-icon .cgg-biz{position:fixed;top:0;left:100px;height:64px;z-index:var(--z-hdr);display:flex;flex-direction:column;justify-content:center;color:var(--text)}
  .lay-icon .cgg-biz small{color:var(--muted)}
  .lay-icon .cgg-nav button{width:56px;flex-direction:column;gap:4px;font-size:10.5px;color:#ffffffa6;padding:9px 0 7px;border-radius:12px;justify-content:center}
  .lay-icon .cgg-nav button svg.ic{width:21px;height:21px}
  .lay-icon .cgg-nav button[aria-selected="true"]{background:#ffffff1f;color:#fff;font-weight:700}
  .lay-icon .cgg-nav button .lbl{white-space:nowrap;max-width:56px;overflow:hidden;text-overflow:ellipsis}
}

/* ───────── ③ 홈 할 일 카드 3장 ───────── */
.cgg-acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 16px}
.cgg-act{display:flex;align-items:center;gap:12px;padding:16px 18px;border:0;font:inherit;text-align:left;cursor:pointer;color:inherit;background:var(--surface);border-radius:var(--r-card);box-shadow:var(--sh);transition:transform .15s;min-width:0}
.cgg-act:hover{transform:translateY(-2px)}
.cgg-act .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.cgg-act .ico.chk{background:var(--chk-bg);color:var(--chk)} .cgg-act .ico.stop{background:var(--stop-bg);color:var(--stop)} .cgg-act .ico.run{background:var(--run-bg);color:var(--run)}
.cgg-act .tx{min-width:0} .cgg-act b{display:block;font-size:14.5px} .cgg-act small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.cgg-act .ar{margin-left:auto;color:var(--muted);font-size:18px}
@media (max-width:1100px){ .cgg-acts{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){ .cgg-act{transition:none} .cgg-act:hover{transform:none} }

/* ───────── ④ 사람 단추 ▾ 펼침 (1.1) — 마이페이지 · 요금제 · 휴지통 · 화면 설정 · 로그아웃 ───────── */
.cgg-drop{position:fixed;z-index:var(--z-drop);box-sizing:border-box;width:240px;max-width:calc(100vw - 16px);background:var(--surface);color:var(--text);border-radius:14px;box-shadow:0 12px 34px #0B254538;padding:8px;display:flex;flex-direction:column;word-break:keep-all}
.cgg-drop[hidden]{display:none}
.cgg-drop .who{padding:8px 12px 10px;font-size:12.5px;color:var(--muted);line-height:1.4} .cgg-drop .who b{display:block;color:var(--text);font-size:14px}
.cgg-drop button{display:flex;align-items:center;gap:9px;border:0;background:transparent;font:inherit;font-size:14px;padding:10px 12px;border-radius:9px;cursor:pointer;text-align:left;color:var(--text)}
.cgg-drop button:hover,.cgg-drop button:focus-visible{background:var(--hov)}
.cgg-drop button svg.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}
.cgg-drop button small{margin-left:auto;font-size:12px;color:var(--muted)}
.cgg-drop button .cnt{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--stop);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.cgg-drop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
/* 사람 단추 위 빨간 개수 (휴지통 건수 — 2026-10-14 「나」안) */
.cgg-badge{position:absolute;top:-5px;left:22px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--stop);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;font-style:normal;line-height:1}

/* 창 · 알림 글 층 (1.1) — 제품의 창에 이 class 를 «더하거나», 제품 CSS 에서 z-index:var(--z-dialog) 로 맞춰요 */
.cgg-dialog{z-index:var(--z-dialog)!important} .cgg-toast{z-index:var(--z-toast)!important}

/* ───────── ⑤ 체험 모드 (1.2) — 미리 써 보기(가입 전) · 체험판(결제 전) 같은 모양 ───────── */
.cgg-trial{display:flex;align-items:center;gap:14px;background:var(--navy);color:#fff;border-radius:var(--r-card);padding:14px 18px;margin:0 0 16px}
.cgg-trial .tag{flex:none;background:var(--sky);color:var(--navy);font-weight:900;font-size:12.5px;border-radius:999px;padding:4px 11px}
.cgg-trial .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cgg-trial .tx b{font-size:14.5px} .cgg-trial .tx small{font-size:12.5px;opacity:.78;line-height:1.5}
.cgg-trial .go{flex:none;height:40px;padding:0 16px;border-radius:12px;border:1px solid #ffffff40;background:#ffffff14;color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.cgg-trial .prog{display:block;height:4px;border-radius:2px;background:#ffffff26;margin-top:6px;overflow:hidden}
.cgg-trial .prog i{display:block;height:100%;background:var(--sky)}
.cgg-lock{display:inline-flex;margin-left:5px;vertical-align:-2px;opacity:.75} .cgg-lock svg.ic{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cgg-left{margin-left:8px;font-size:11.5px;font-weight:700;color:var(--run);background:var(--run-bg);border-radius:999px;padding:2px 8px;white-space:nowrap}
.cgg-left.out{color:var(--muted);background:var(--bg)}
.cgg-cls{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--sh);padding:18px 20px;margin:0 0 16px}
.cgg-cls h3{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:16px} .cgg-cls h3 small{font-size:12px;color:var(--muted);font-weight:500}
.cgg-clsrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)} .cgg-clsrow:first-of-type{border-top:0}
.cgg-clsrow .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px} .cgg-clsrow .nm b{font-size:14px} .cgg-clsrow .nm small{font-size:12.5px;color:var(--muted)}
.cgg-clsrow .st{font-size:12.5px;color:var(--muted)}
.cgg-clsrow button{flex:none;height:36px;padding:0 12px;border-radius:var(--r-ctl);border:1px solid var(--ln2);background:var(--surface);color:var(--btn-ink);font:inherit;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.cgg-k{flex:none;display:inline-flex;align-items:center;gap:3px;min-width:52px;justify-content:center;height:24px;border-radius:999px;font-size:12px;font-weight:700}
.cgg-k.lock{background:var(--stop-bg);color:var(--stop)} .cgg-k.try{background:var(--run-bg);color:var(--run)} .cgg-k.see{background:var(--done-bg);color:var(--done)}
.cgg-k svg.ic{width:12px;height:12px}
@media (max-width:600px){
  .cgg-trial{flex-wrap:wrap;gap:8px 10px;padding:12px;border-radius:14px}
  .cgg-trial .tx{flex-basis:calc(100% - 70px)} .cgg-trial .go{width:100%;height:38px}
  .cgg-clsrow{flex-wrap:wrap;gap:8px 12px} .cgg-clsrow .nm{flex:1 1 calc(100% - 76px)} .cgg-clsrow button,.cgg-clsrow .st{margin-left:64px}
}

/* ═══════════ ⑥ 화면 일곱 칸 본문 (1.3) — J안 4판 값 그대로 ═══════════ */
/* ② 화면 머리: 묶음 › 화면 + 말하는 제목 + 설명 한 줄 + 오른쪽 버튼 */
.cgg-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:0 0 18px}
.cgg-head .hello{min-width:0;flex:1 1 320px}
.cgg-head .hello small{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.cgg-head .hello h1{margin:0;font-size:28px;font-weight:900;letter-spacing:-.8px;line-height:1.3;text-wrap:balance}
.cgg-head .hello h1 em{font-style:normal;color:var(--blue)}
.cgg-head .hello p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.cgg-head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
/* 버튼 — 높이 43 · 모서리 12 · 파란 버튼은 한 화면에 하나 */
.cgg-btn{height:var(--ctl);padding:0 18px;border-radius:var(--r-ctl);border:1px solid var(--ln2);background:var(--surface);font:inherit;font-weight:700;font-size:14px;color:var(--btn-ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.cgg-btn:hover{border-color:var(--muted)}
.cgg-btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 16px -8px #1668C4cc}
.cgg-btn:disabled{opacity:.45;cursor:default}
.cgg-btn svg.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cgg-card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--sh);margin:0 0 16px}
/* ⑤ 숫자 카드 4개 — 큰 숫자 + 작은 그래프 + 지난주보다 */
.cgg-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 16px}
.cgg-kpi{position:relative;padding:18px 20px;background:var(--surface);border-radius:var(--r-card);box-shadow:var(--sh);min-width:0}
.cgg-kpi small{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding-right:80px}
.cgg-kpi small i{width:10px;height:10px;border-radius:3px;flex:none}
.cgg-kpi strong{display:block;font-size:30px;font-weight:900;letter-spacing:-.8px;margin-top:8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cgg-kpi strong em{font-style:normal;font-size:14px;color:var(--muted);font-weight:700;margin-left:3px}
.cgg-kpi .tr{font-size:12.5px;font-weight:700;color:var(--done);margin-top:4px;display:block} .cgg-kpi .tr.dn{color:var(--stop)} .cgg-kpi .tr span{color:var(--muted);font-weight:500}
.cgg-kpi svg.sp{position:absolute;right:18px;top:18px;width:72px;height:26px}
/* ⑥ 데이터 카드 — 상태 탭+개수 · 거르기 알약 · 검색 · 표(머리 40 · 줄 50) · 쪽 */
.cgg-tabsH{display:flex;gap:2px;padding:4px 16px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.cgg-tabsH button{border:0;background:transparent;font:inherit;font-size:14px;color:var(--muted);padding:13px 10px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.cgg-tabsH button b{margin-left:5px;font-size:12px;font-weight:700;color:var(--muted);background:var(--bg);border-radius:999px;padding:1px 8px}
.cgg-tabsH button[aria-selected="true"]{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
.cgg-tabsH button[aria-selected="true"] b{background:var(--tabon);color:var(--blue)}
.cgg-filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.cgg-fp{height:32px;border:1px dashed var(--ln2);border-radius:999px;padding:0 13px;font:inherit;font-size:13px;color:var(--btn-ink);background:var(--surface);cursor:pointer}
.cgg-fp.on{border-style:solid;color:var(--blue);background:var(--tabon);font-weight:700}
.cgg-filters .sp{flex:1}
.cgg-find{height:36px;border:1px solid var(--ln2);border-radius:10px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;color:var(--muted);background:var(--surface)}
.cgg-find input{border:0;font:inherit;font-size:13.5px;width:170px;background:transparent;color:var(--text);outline:0}
.cgg-twrap{overflow-x:auto}
.cgg-table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;min-width:900px;table-layout:fixed}
.cgg-table th{height:40px;padding:0 14px;text-align:left;font-size:12.5px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface);white-space:nowrap;cursor:pointer;user-select:none}
.cgg-table td{height:50px;padding:0 14px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--surface)}
.cgg-table tbody tr:hover td{background:var(--hov)}
.cgg-table .n{text-align:right;font-variant-numeric:tabular-nums} .cgg-table .c{text-align:center}
.cgg-table .fx0{position:sticky;left:0;z-index:1;text-align:center;width:56px}
.cgg-table .fx1{position:sticky;left:56px;z-index:1;font-weight:700;box-shadow:6px 0 6px -6px #0B254522}
.cgg-table .nm{border:0;background:transparent;font:inherit;font-weight:700;color:inherit;cursor:pointer;padding:0;text-align:left}
.cgg-table .nm:hover{color:var(--blue);text-decoration:underline}
.cgg-app input[type=checkbox],.cgg-dlg input[type=checkbox]{appearance:none;-webkit-appearance:none;margin:0;width:20px;height:20px;border:1.5px solid var(--ln2);border-radius:6px;background:var(--surface);display:inline-grid;place-content:center;cursor:pointer;vertical-align:middle}
.cgg-app input[type=checkbox]::after,.cgg-dlg input[type=checkbox]::after{content:"";width:10px;height:6px;border:2.2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.cgg-app input[type=checkbox]:checked,.cgg-dlg input[type=checkbox]:checked{background:var(--blue);border-color:var(--blue)}
.cgg-app input[type=checkbox]:checked::after,.cgg-dlg input[type=checkbox]:checked::after{opacity:1}
/* 상태 칩 4가지 (진행 중 · 완료 · 확인 필요 · 보류) */
.cgg-st{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:6px;font-size:12px;font-weight:700;white-space:nowrap}
.cgg-st.run{background:var(--run-bg);color:var(--run)} .cgg-st.done{background:var(--done-bg);color:var(--done)} .cgg-st.chk{background:var(--chk-bg);color:var(--chk)} .cgg-st.stop{background:var(--stop-bg);color:var(--stop)}
.cgg-pager{display:flex;align-items:center;gap:8px;padding:12px 16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.cgg-pager .sp{flex:1} .cgg-pager .cgg-btn{height:34px;padding:0 12px;font-size:13px}
.cgg-pager select,.cgg-mhead select{height:34px;border:1px solid var(--ln2);border-radius:10px;background:var(--surface);color:var(--text);font:inherit;font-size:13px;padding:0 10px}
.cgg-empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}
/* 줄 버튼 (1.4) — 표 맨 오른쪽 «할 일» 칸. 작은 흰 버튼, 한 줄에 둘까지. 파란 버튼은 줄 안에 쓰지 않아요 */
.cgg-btn.sm{height:32px;padding:0 10px;font-size:12.5px;border-radius:9px}
.cgg-btn.danger{color:var(--stop)}
.cgg-filters .cgg-btn.sm{height:32px}
.cgg-acts-cell{white-space:nowrap} .cgg-acts-cell .cgg-btn+.cgg-btn{margin-left:4px}
.cgg-mlist{display:none}
/* ⑦ 도움 카드 (접힘) */
.cgg-help{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--sh);padding:0 20px;margin:0 0 16px}
.cgg-help summary{height:50px;display:flex;align-items:center;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer}
.cgg-help p{margin:0 0 16px;font-size:14px;color:var(--muted);line-height:1.7}
/* 창 3종 — 확인 400 · 입력 560 · 자세히 520(오른쪽) · 폰은 아래에서 올라옴 */
.cgg-dim{position:fixed;inset:0;z-index:var(--z-dialog);background:#0B254573;display:grid;place-items:center;padding:16px}
.cgg-dim[hidden]{display:none}
.cgg-dlg{box-sizing:border-box;background:var(--surface);color:var(--text);border-radius:22px;width:min(400px,100%);padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 24px 60px #0B254559;max-height:calc(100vh - 32px);overflow:auto;word-break:keep-all}
.cgg-dlg.form{width:min(560px,100%)}
.cgg-dim.side{place-items:stretch end;padding:0}
.cgg-dlg.detail{width:min(520px,100%);height:100%;max-height:none;border-radius:22px 0 0 22px}
.cgg-dlg h3{margin:0;font-size:18px;font-weight:900;letter-spacing:-.3px}
.cgg-dlg .desc{margin:-8px 0 0;font-size:13.5px;color:var(--muted)}
.cgg-dlg dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:14.5px;background:var(--bg);border-radius:14px;padding:16px 18px}
.cgg-dlg dt{color:var(--muted)} .cgg-dlg dd{margin:0;font-weight:800;font-variant-numeric:tabular-nums}
.cgg-dlg .ft{display:flex;gap:8px;justify-content:flex-end;margin-top:auto}
.cgg-dlg .fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cgg-dlg label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.cgg-dlg input:not([type=checkbox]),.cgg-dlg select,.cgg-dlg textarea{height:var(--ctl);border:1px solid var(--ln2);border-radius:12px;padding:0 12px;font:inherit;font-size:14.5px;background:var(--surface);color:var(--text)}
.cgg-dlg .x{position:absolute;right:14px;top:14px}
/* 알림 글 (토스트) */

<!-- ===== 로그인 — 워시 로그인 화면과 같은 모양 ===== -->
<div id="gate" style="position:fixed;inset:0;z-index:var(--z-toast);background:var(--bg,#f4f6f9);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;font-family:inherit;color:var(--text,#14202e)">

    </div>
    <div style="background:var(--surface,#fff);border:1px solid var(--line,#dde3ec);border-radius:var(--r,14px);padding:22px 20px;box-shadow:var(--shadow,0 2px 10px rgba(16,32,52,.08))">

      <label style="font-size:14px;font-weight:600;color:var(--muted,#667389);margin-top:14px;display:block" for="gpw">비밀번호</label>
      <input id="gpw" type="password" autocomplete="current-password" placeholder="비밀번호" style="width:100%;box-sizing:border-box;padding:15px 14px;font-size:17px;border-radius:12px;border:1px solid var(--line,#dde3ec);background:var(--surface,#fff);color:var(--text,#14202e);margin-top:7px">
      <button id="gGo" style="width:100%;padding:16px;font-size:17px;font-weight:700;border:0;border-radius:12px;background:var(--brand,#0b5d8f);color:#fff;cursor:pointer;margin-top:16px">로그인</button>
      <div id="gStep2" hidden>
        <div style="font-size:14px;color:var(--muted,#667389);margin-top:14px;line-height:1.6" id="gTo"></div>
        <label style="font-size:14px;font-weight:600;color:var(--muted,#667389);margin-top:14px;display:block" for="gcode">문자로 받은 인증번호 6자리</label>
        <input id="gcode" type="tel" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code" style="width:100%;box-sizing:border-box;padding:15px 14px;font-size:17px;border-radius:12px;border:1px solid var(--line,#dde3ec);background:var(--surface,#fff);color:var(--text,#14202e);margin-top:7px;letter-spacing:8px;font-size:24px;text-align:center;font-weight:700">
        <button id="gGo2" style="width:100%;padding:16px;font-size:17px;font-weight:700;border:0;border-radius:12px;background:var(--brand,#0b5d8f);color:#fff;cursor:pointer;margin-top:16px">확인</button>
        <button id="gBack" style="width:100%;padding:14px;font-size:16px;border:1px solid var(--line,#dde3ec);border-radius:12px;background:transparent;color:var(--muted,#667389);cursor:pointer;margin-top:10px">처음부터 다시</button>
      </div>
      <div id="gMsg" style="font-size:14px;margin-top:12px;min-height:20px;line-height:1.5"></div>
    </div>
    <div style="text-align:center;font-size:12px;color:var(--muted,#667389);margin-top:16px;line-height:1.8" id="gVer"></div>
  </div>
</div>

<!-- ===== 본 화면 — 워시 머리말과 같은 뼈대 ===== -->
<div class="cgg-app" id="app" style="display:none">
<div class="jh cgg-hdr" id="jh" role="banner">
  <div class="jh-top cgg-top">

      <div><b>차곳간 <span class="jh-prod">관리</span></b><small id="hSub">본사 관리 · <span id="hVer"></span></small></div></div>

      <button type="button" class="jhb cgg-wide" id="btnHelp"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7M12 17h.01"/></svg>도움말</button>
      <button type="button" class="jhb cgg-wide" id="btnLink"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>링크 복사</button>
      <button type="button" class="jhb" id="btnReload" title="새로고침"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg><span class="lbl">새로고침</span></button>
      <button type="button" class="jh-me" id="hWho" aria-haspopup="menu" aria-expanded="false" title="마이페이지"><span class="j-av" id="hAv">·</span><span class="wt"><b id="meName">-</b><small id="meRole">본사 관리자</small></span><span class="car">▾</span></button>

  <nav class="cgg-nav" id="nav" aria-label="메뉴"></nav>

</div>

<div class="sheetbg" id="sheetbg"></div>
<div style="position:fixed;right:12px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:var(--z-drop,70);background:#B26B00;color:#fff;font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;box-shadow:0 4px 12px #0003;pointer-events:none">미리보기 · 지어낸 자료 · 저장 안 됨</div>
<div class="sheet" id="sheet"></div>
<nav class="cgg-tbar" id="jTbar" aria-label="아래 메뉴"></nav>

<script>
/* ═══════════════════════════════════════════════════════════════════
   차곳간 공통 부품 · J안 4판 · cgg-j4 1.5 (2026-10-15, 디자인 방)
   ① 메뉴 배치 셋  ② 폰 아래 탭바  ③ 홈 할 일 카드 3장  ④ 사람 단추 ▾ 펼침 (1.1)  ⑤ 체험 모드 (1.2)  ⑥ 본문 (1.3)
   바탕: 관리 v4.0 의 관리/v4재료/j4.js. 관리 전용 이름(TAB · render · NAV)에 묶이지 않게
         «무엇을 보여 줄지»와 «눌렀을 때 할 일»을 제품이 넘겨 주는 식으로 바꿨어요.
   서버를 부르지 않아요. 저장은 «이 기기에만»(localStorage) — 못 쓰면 가로 메뉴로 그냥 보여요.

   쓰는 법 (이 파일 내용을 제품 스크립트보다 «먼저» 따로 <script> 하나로 넣고, 제품 스크립트 안에서)
     CGG.layout.init(document.querySelector(".cgg-app"), "cgg_check_layout");   // 저장 이름은 제품마다
     CGG.layout.chooser(상자, function(v){ 창 닫기 · 알림 });                     // 화면 설정 창 안에 고르기 칸 그리기
     CGG.tabbar(document.querySelector(".cgg-tbar"),
       [{key:"home",icon:"home",label:"홈"}, … 5칸], 지금 key, function(key){ 화면 이동 });
     CGG.todos(document.querySelector(".cgg-acts"),
       [{tone:"chk",icon:"car",title:"출고 확인 3대",sub:"한빛모터스 외 2곳 · 오늘"}, … 3장], function(i){ 그 화면으로 });
     CGG.menu(사람단추, {name:"홍길순", role:"대표"}, [                                    // 1.1
       {key:"me",icon:"user",label:"마이페이지"}, {key:"trash",icon:"trash",label:"휴지통",count:3}, "-",
       {key:"lay",icon:"pc",label:"화면 설정",note:CGG.layout.name()}, "-", {key:"out",icon:"out",label:"로그아웃"}], function(key){ … });
     CGG.badge(사람단추, 3);   // 사람 단추 위 빨간 개수 (0이면 숨김)
   tone: run(파랑 · 진행 중) · chk(주황 · 확인 필요) · stop(빨강 · 보류)
   ═══════════════════════════════════════════════════════════════════ */
var CGG = (function(){
  var IC = {
    home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    car:'<path d="M3 17h18v-4l-2.2-5.2A1.5 1.5 0 0 0 17.4 7H6.6a1.5 1.5 0 0 0-1.4.8L3 13z"/><path d="M7 17v2M17 17v2M3 13h18"/>',
    wallet:'<path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H3z"/><path d="M3 7l11-4v4M16 14h2"/>',
    receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
    file:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>',
    chart:'<path d="M5 20V11M12 20V5M19 20v-6M3 20h18"/>',
    shop:'<path d="M4 10h16v10H4zM3 10l2-6h14l2 6M9 20v-5h6v5"/>',
    user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
    bell:'<path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
    gear:'<circle cx="12" cy="12" r="3"/><path d="M19 12h2M3 12h2M12 3v2M12 19v2M17 7l1.4-1.4M5.6 18.4L7 17M17 17l1.4 1.4M5.6 5.6L7 7"/>',
    box:'<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
    today:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
    out:'<path d="M12 21V9M7 14l5-5 5 5M4 3h16"/>', in:'<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>',
    more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
    trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
    pc:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
    down:'<path d="M12 4v12M6 12l6 6 6-6M4 20h16"/>', plus:'<path d="M12 5v14M5 12h14"/>', search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>',
    lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'
  };
  function ic(n){ return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+(IC[n]||"")+'</svg>'; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }

  /* ① 메뉴 배치 — 문구는 워시 원본 LY_INFO 그대로 */
  var LAYS=[["top","가로 메뉴","메뉴가 화면 위에 가로로 놓여요. 지금까지 쓰던 모습이에요."],
            ["side","세로 메뉴","메뉴가 왼쪽에 세로로 놓여요. 메뉴 이름이 다 보여서 찾기 쉬워요."],
            ["icon","아이콘 메뉴","왼쪽에 아이콘만 놓여요. 화면을 가장 넓게 쓸 수 있어요."]];
  var layout = { app:null, key:"cgg_layout",
    init:function(app,key){ this.app=app; if(key) this.key=key; this.apply(this.get()); },
    get:function(){ var v=store(this.key); return (v==="side"||v==="icon")?v:"top"; },
    set:function(v){ store(this.key,v); this.apply(v); },
    apply:function(v){ if(!this.app) return; this.app.classList.remove("lay-top","lay-side","lay-icon"); this.app.classList.add("lay-"+v); },
    name:function(v){ for(var i=0;i<LAYS.length;i++) if(LAYS[i][0]===(v||this.get())) return LAYS[i][1]; return ""; },
    chooser:function(box,done){ var self=this, cur=this.get();
      box.innerHTML='<div class="cgg-lays" role="group" aria-label="메뉴 배치">'+LAYS.map(function(x){
        return '<button type="button" data-lay="'+x[0]+'" aria-pressed="'+(x[0]===cur)+'"><b>'+x[1]+'</b><small>'+x[2]+'</small></button>'; }).join("")+'</div>';
      Array.prototype.forEach.call(box.querySelectorAll("[data-lay]"),function(b){
        b.onclick=function(){ var v=b.getAttribute("data-lay"); self.set(v);
          Array.prototype.forEach.call(box.querySelectorAll("[data-lay]"),function(o){ o.setAttribute("aria-pressed", String(o===b)); });

  /* ⑥ 데이터 카드 — 표 열 차례: 선택 → 이름 → 번호 → 내용 → 날짜 → 금액 → 상태 (열 너비는 kinds 로 자동)

      if(st.key===k) st.dir=(st.dir==="asc"?"desc":"asc"); else { st.key=k; st.dir="asc"; } draw(); });
    on("[data-p]","onclick",function(n){ st.page=Number(n.getAttribute("data-p"))||1; draw(); });
    on("[data-msort]","onchange",function(n){ var p2=n.value.split(","); st.key=p2[0]; st.dir=p2[1]; st.page=1; draw(); });
    on("[data-size]","onchange",function(n){ st.size=Number(n.value)||20; st.page=1; draw(); });
    on("[data-fp]","onchange",function(n){ st.f[n.getAttribute("data-fp")]=n.value; st.page=1; draw(); });
    var fc=$(o.id+"_fclr"); if(fc) fc.onclick=function(){ st.f={}; st.page=1; draw(); };
    on("[data-ck]","onchange",function(n){ st.sel[n.getAttribute("data-ck")]=n.checked; draw(); });
    on("[data-all]","onchange",function(n){ host.querySelectorAll(".cgg-twrap [data-ck]").forEach(function(c){ st.sel[c.getAttribute("data-ck")]=n.checked; }); draw(); });
    on("[data-ck]","onclick",function(n,e){ e.stopPropagation(); });
    var qi=$(o.id+"_q");
    if(qi) qi.oninput=function(){ var pos=qi.selectionStart; st.q=qi.value; st.page=1; draw(); var n=$(o.id+"_q"); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} } };
    var bk=$(o.id+"_bulk");
    if(bk) bk.onclick=function(){ var ids=Object.keys(st.sel).filter(function(k){ return st.sel[k]; });
      if(!ids.length) return toast("먼저 왼쪽 네모칸을 체크해 주세요",true);
      o.bulk(ids,function(){ st.sel={}; }); };
    if(o.onRow) on("tbody tr[data-id],.cgg-mrow[data-id]","onclick",function(n,ev){
      var t=ev.target; if(t && (t.tagName==="INPUT"||t.tagName==="SELECT"||t.closest("button,.cgg-btn,.btn,a"))) return;
      o.onRow(n.getAttribute("data-id")); });
  }
  draw();
}

/* =========================================================
   화면 — 요약
   ========================================================= */
function viewSummary(){
  var s = D.sum || {};
  var now = new Date();
  if(!CALM) CALM = new Date(now.getFullYear(), now.getMonth(), 1);
  var Y = CALM.getFullYear(), M = CALM.getMonth()+1;
  function ds(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  var todayK = ds(now);

  /* ── 손봐야 할 것 — 원래 계산 그대로 모읍니다 ── */
  var stop=[], late=[], unpaid=[], noPrice=[], svcBad=[];
  (D.shops||[]).forEach(function(s2){
    if(s2.shop==="ADMIN") return;
    if(s2.active===false) stop.push(s2);
    if(s2.paid_until && new Date(s2.paid_until).getTime() < Date.now()) late.push(s2);
  });
  (D.pays||[]).filter(function(p){return p.status==="ready";}).forEach(function(p){ unpaid.push(p); });
  (D.plans||[]).forEach(function(p){ if(p.active && !p.price) noPrice.push(p); });
  (D.svcs||[]).filter(function(v){return v.active!==false;}).forEach(function(v){
    var st = svcState(v); if(st.lv===2) svcBad.push({v:v,st:st}); });
  var unpaidAmt = unpaid.reduce(function(a2,p){ return a2+(Number(p.amount)||0); },0);
  var prof = Number(s.salesMonth||0) - Number(s.expMonth||0);
  function names(list,f,n){ n=n||3; return list.slice(0,n).map(f).join(", ")+(list.length>n?" 외":""); }

  /* ── 달력 칸 — 워시 달력과 같은 이름표 (d · n · todaytag · amt · cars · memo) ── */
  var byDay = {};
  calEvents().forEach(function(e){ (byDay[e.d]||(byDay[e.d]={w:0,b:0,r:0,amt:0}));
    if(e.c==="w"){ byDay[e.d].w++; byDay[e.d].amt += Number(e.cost||0); }
    else if(e.c==="d") byDay[e.d].r++;
    else if(e.c!=="g") byDay[e.d].b++; });
  var memoBy = {};
  (TODO.list||[]).forEach(function(t){ if(!t.due_at) return; var k=String(t.due_at).slice(0,10); (memoBy[k]=memoBy[k]||[]).push(t); });
  var first = new Date(Y,M-1,1), last = new Date(Y,M,0).getDate();
  var cal = "";
  for(var i=0;i<first.getDay();i++) cal += '<div class="d blank"></div>';
  var tw=0, tb=0, tr=0, tamt=0, tmemo=0;
  for(var day=1; day<=last; day++){
    var k = Y+"-"+String(M).padStart(2,"0")+"-"+String(day).padStart(2,"0");
    var v = byDay[k], ms = memoBy[k]||[], open = ms.filter(function(m){return !m.done;});
    var isToday = (k===todayK), dow = (first.getDay()+day-1)%7;
    if(v){ tw+=v.w; tb+=v.b; tr+=v.r; tamt+=v.amt; }
    tmemo += open.length;
    var parts = [];
    if(v && v.w) parts.push('<span style="color:var(--warn)">결제 '+v.w+'</span>');
    if(v && v.b) parts.push('<span style="color:var(--brand)">기한 '+v.b+'</span>');
    if(v && v.r) parts.push('<span style="color:var(--danger)">체험 '+v.r+'</span>');
    cal += '<div class="d'+(isToday?" today":"")+'" data-k="'+k+'">'+
      '<div class="n'+(dow===0?" sun":"")+'">'+day+(isToday?'<span class="todaytag">오늘</span>':'')+'</div>'+
      (v && v.amt ? '<div class="amt">'+won(v.amt)+'</div>' : '')+
      (parts.length ? '<div class="cars">'+parts.join(" · ")+'</div>' : '')+
      (ms.length ? ('<div class="memo'+(open.length?"":" done")+'" title="'+esc(ms.map(function(m){return m.title;}).join("\n"))+'"><span class="jic">'+CGG.ic("file")+'</span> '+
        esc((open[0]||ms[0]).title)+(ms.length>1?(" 외 "+(ms.length-1)):"")+'</div>') : '')+
      '</div>';
  }

  /* ── 오늘 할 일 — 워시와 같은 [숫자, 제목, 설명, 누르면, 중요] 꼴 ── */
  function go(t){ return function(){ TAB=t; window.scrollTo(0,0); render(); }; }
  var memoToday = (TODO.list||[]).filter(function(t){ return !t.done && (!t.due_at || String(t.due_at).slice(0,10)===todayK); });
  var memoOld   = (TODO.list||[]).filter(function(t){ return !t.done && t.due_at && String(t.due_at).slice(0,10)<todayK; });
  var memoTodos = memoToday.slice(0,5).map(function(m){
    return ["memo","오늘 메모 · "+m.title,"누르면 완료 표시·지우기",function(){ hqDaySheet(todayK); }]; });
  if(memoToday.length>5) memoTodos.push([memoToday.length-5,"오늘 메모 더 있음","달력 오늘 칸을 눌러 보세요",function(){ hqDaySheet(todayK); }]);
  if(memoOld.length) memoTodos.push([memoOld.length,"지난 날 메모 · 아직 완료 안 됨",
    String(memoOld[0].due_at).slice(5,10).replace("-","/")+" "+memoOld[0].title+(memoOld.length>1?" 외":""),
    function(){ hqDaySheet(String(memoOld[0].due_at).slice(0,10)); }]);
  var pwNeed = (PW.list||[]).filter(function(x){ return x.paidOrder || Number(x.days)>=7; });
  var todos = memoTodos.concat([
    [pwNeed.length,"결제 대기 · 확인할 업체", pwNeed.length?names(pwNeed,function(x){return (x.paidOrder?"결제됨 · ":"")+(x.name||x.shop);}):"7일 넘게 결제를 안 한 곳", go("wait"), pwNeed.some(function(x){return x.paidOrder;})?"imp":undefined],
    [unpaid.length,"못 받은 금액", unpaid.length?(won(unpaidAmt)+" · "+names(unpaid,function(p){return p.shopName||p.biz_name||"";})):"", go("pays"),"imp"],
    [late.length,"이용 기한 지남", names(late,function(x){return x.name||x.shop;}), go("pays"),"imp"],
    [svcBad.length,"유지비 — 끊기기 직전", names(svcBad,function(x){return x.v.name+" "+x.st.txt;},2), go("svc"),"imp"],
    [stop.length,"멈춘 업체", stop.length?names(stop,function(x){return x.name||x.shop;}):"이용이 멈춘 곳", go("shops")],
    [Number(s.waitInvite||0),"가입 코드 · 아직 가입 안 함","코드를 받고 가입을 안 한 번호", go("inv")],
    [noPrice.length,"금액을 안 정한 요금제", noPrice.length?names(noPrice,function(p){return p.name;}):"금액이 0원인 요금제", go("plans")]
  ]);   /* 0건도 빼지 않아요 — 워시와 같이 늘 세 줄이 보여요 */

  /* ── 아래 넓은 카드 — 운영 상태 · 유지비 ── */

  var svcs = (D.svcs||[]).filter(function(x){return x.active!==false;})
    .sort(function(x,y){ return svcState(y).lv - svcState(x).lv || (x.sort||0)-(y.sort||0); });

  var h =
    /* ② 말하는 제목 — 숫자는 파랑 (J안) */
    '<div class="dashhead"><small class="jcrumb">안녕하세요, '+esc((D.me&&D.me.name)||"")+' 님 · '+(now.getMonth()+1)+'월 '+now.getDate()+'일 '+"일월화수목금토"[now.getDay()]+'요일 · '+
        String(now.getHours()).padStart(2,"0")+':'+String(now.getMinutes()).padStart(2,"0")+' 기준</small>'+
      '<h2>'+((late.length||unpaid.length)
        ? ('결제일 지난 업체 <em>'+late.length+'곳</em>, 못 받은 금액 <em>'+won(unpaidAmt)+'</em>이 남아 있어요')
        : ('오늘 급한 일은 없어요. 업체 <em>'+(s.shops||0)+'곳</em>이 진행 중이에요'))+'</h2>'+
      '<div class="sub2">'+Y+'년 '+M+'월 · 할 일 <b>'+todos.length+'건</b> <button class="btn sm" id="todoAll" style="height:30px;margin-left:6px;font-size:12.5px">모두 보기</button></div></div>'+
    /* ③ 할 일 카드 3장 */

    /* ⑤ 숫자 카드 4개 — 지난주 값은 서버에 없어 «지난주보다» 대신 지금 상태 한 줄 */
    '<div class="j-kpis" id="homeSums">'+

       ["이번 달 들어온 금액",(Number(s.salesMonth)||0).toLocaleString("ko-KR"),"원","pays","#4C93E0","받은 비율 "+(function(){ var pd=Number(s.salesMonth||0), bl=pd+unpaidAmt; return bl?Math.round(pd/bl*100):0; })()+"%",""],
       ["이번 달 나간 금액",(Number(s.expMonth)||0).toLocaleString("ko-KR"),"원","settle","#0B2545","남은 것 "+won(prof),prof<0?"bad":""],
       ["못 받은 금액",unpaidAmt.toLocaleString("ko-KR"),"원","pays","#E08A00",unpaid.length?("입금 대기 "+unpaid.length+"건"):"없어요",unpaid.length?"bad":""]].map(function(x){

    '</div>'+
    '<div class="dash homegrid">'+
      '<div class="hgL">'+
        '<div class="card">'+
          '<h2>일정</h2>'+

          '<div class="cal" id="cal">'+cal+'</div>'+

            '<span><span style="color:var(--brand)">■</span> 업체 이용기한 <b>'+tb+'건</b></span>'+
            '<span><span style="color:var(--danger)">■</span> 체험 끝 <b>'+tr+'건</b></span>'+
            '<span><span class="jic">'+CGG.ic("file")+'</span> 할 일 <b>'+tmemo+'건</b></span>'+
          '</div>'+
        '</div>'+
      '</div>'+
      '<div class="hgR">'+

        '<div class="card" id="dashMoneyCard">'+
          '<h2>이번 달 입금</h2>'+
          '<div id="dashMoney"></div>'+
        '</div>'+
        '<div class="card">'+
          '<h2>업체·계정 <span class="rt" id="dashStatTop">7일 동안 쓴 기기 '+(s.active7||0)+'대</span></h2>'+
          '<div id="dashStat">'+
            '<div class="mini-row"><span>업체</span><b>'+(s.shops||0)+' 곳</b></div>'+
            '<div class="mini-row"><span>진행 중 / 보류</span><b>'+Math.max(0,(s.shops||0)-(s.shopsOff||0))+' 곳 / '+(s.shopsOff||0)+' 곳</b></div>'+
            '<div class="mini-row"><span>로그인 계정 / 쓸 수 있는 것</span><b>'+(s.users||0)+' 개 / '+(s.usersOn||0)+' 개</b></div>'+

    /* 운영 상태 — 격자 밖 전체 너비 (워시 「작업 항목별」 자리) */

/* 운영 서비스 하나의 상태를 봐요 — {lv, txt}  lv: 0 넉넉 / 1 곧 / 2 급함 */
function svcState(v){
  var lv=0, txt="", day=864e5;
  if(v.kind==="charge"){
    var bal=Number(v.balance||0), min=Number(v.min_bal||0);
    txt = won(bal)+" 남음";
    if(min>0 && bal<=min) lv=2;
    else if(min>0 && bal<=min*2) lv=1;
    if(lv===2) txt += " — 충전이 필요해요";
  }
  if(v.next_due){
    var left = Math.ceil((new Date(v.next_due+"T00:00:00").getTime()-Date.now())/day);
    var wd = Number(v.warn_days||14);
    var dtxt = left<0 ? ("기한 "+(-left)+"일 지남") : (left===0 ? "오늘까지" : ("D-"+left));
    txt = (txt?txt+" · ":"")+dtxt;
    if(left<0) lv=2; else if(left<=wd) lv=Math.max(lv,1);
  }
  if(!txt) txt = (v.kind==="sub"?"매달 결제":"확인 필요");
  if(v.auto && v.auto_err) { lv=Math.max(lv,1); txt = "자동으로 읽지 못했어요. 그 회사 화면에서 보고 직접 적어 주세요."; }
  else if(v.auto_note && v.kind!=="charge" && !v.next_due) txt = v.auto_note;
  return {lv:lv, txt:txt, note:(v.auto?(v.auto_note||""):"")};
}
function svcPill(lv){
  return lv===2 ? '<span class="pill off">충전 필요</span>'
       : lv===1 ? '<span class="pill wait">곧 충전</span>'
                : '<span class="pill ok">넉넉해요</span>';
}

/* 오늘 날짜를 «9월 25일 (목)» 처럼 적어요 */
function dtFull(){
  var d = new Date(), w = ["일","월","화","수","목","금","토"][d.getDay()];
  return (d.getMonth()+1)+"월 "+d.getDate()+"일 ("+w+")";
}

/* 이 업체의 문자·세금계산서 총량과 남은 량을 계산합니다
   무료(요금제 또는 체험분) → 충전분 → 여유분 20건 순서로 써요 */
function usageOf(r){
  var trial = !r.plan || r.plan==="trial";
  var pl = (D.plans||[]).filter(function(p){return p.code===r.plan;})[0] || {};
  var smsFree = trial ? Number(r.trial_sms==null?300:r.trial_sms) : Number(pl.sms_free||0);
  var taxFree = trial ? Number(r.trial_tax==null?20:r.trial_tax)  : Number(pl.tax_free||0);
  var smsUsed = Number(r.sms_used||0), taxUsed = Number(r.tax_used||0);
  var smsPaid = Number(r.sms_paid||0), taxPaid = Number(r.tax_paid||0);
  var spareMax = Number(r.spare_max==null?20:r.spare_max), spareUsed = Number(r.spare_used||0);
  return {
    trial:trial,
    smsFree:smsFree, smsUsed:Math.min(smsUsed,smsFree), smsPaid:smsPaid,
    smsLeft:Math.max(0,smsFree-smsUsed)+smsPaid,
    smsTotal:smsFree+smsPaid,
    taxFree:taxFree, taxUsed:Math.min(taxUsed,taxFree), taxPaid:taxPaid,
    taxLeft:Math.max(0,taxFree-taxUsed)+taxPaid,
    taxTotal:taxFree+taxPaid,
    spareLeft:Math.max(0,spareMax-spareUsed), spareMax:spareMax
  };
}
/* 건수를 「1,000건」처럼 적어요 (금액이 아닙니다) */
function cnt(n){ return Number(n||0).toLocaleString("ko-KR")+"건"; }
/* 「342건 / 500건」처럼 남은 량과 총량을 같이 보여 줘요 */
function useCell(left,total,extra){
  if(total===0) return '<span style="color:var(--muted)">못 씀</span>';
  var col = left===0 ? "var(--danger)" : (left<=total*0.1 ? "var(--warn)" : "var(--text)");
  return '<b style="color:'+col+'">'+cnt(left)+'</b><span style="color:var(--muted)"> / '+cnt(total)+'</span>'+
         (extra?'<div style="font-size:11px;color:var(--muted)">'+esc(extra)+'</div>':'');
}

/* 업체 시트 안의 사용량·충전 상자 */
function usageBoxHtml(s){

  var sf=pl?(pl.sms_free||0):0, tf=pl?(pl.tax_free||0):0;
  var su=s.sms_used||0, tu=s.tax_used||0, sp=s.sms_paid||0, tp=s.tax_paid||0;
  if(!s.plan || s.plan==="trial")
    return '<div class="hint" style="margin-top:12px">무료 체험 중이라 건수를 세지 않아요.</div>';

    '<div class="usg">'+
      '<div class="ub"><span class="t">문자</span>'+
        '<span class="v">'+(su)+' / '+(sf)+'건</span>'+
        '<span class="s">충전분 '+sp+'건</span></div>'+
      '<div class="ub"><span class="t">세금계산서</span>'+
        '<span class="v">'+(tf?(tu+" / "+tf+"건"):"못 씀")+'</span>'+
        '<span class="s">충전분 '+tp+'건</span></div>'+
    '</div>'+
    '<div class="row2" style="margin-top:10px">'+
      '<div><label class="f">충전 넣기 — 종류</label><select id="sTopKind">'+
        '<option value="sms">문자</option><option value="tax">세금계산서</option></select></div>'+
      '<div><label class="f">건수</label><input type="number" id="sTopQty" placeholder="1000"></div>'+
    '</div>'+
    '<div class="row2">'+
      '<div><label class="f">받은 금액 (원)</label><input type="number" id="sTopAmt" placeholder="18000"></div>'+
      '<div><label class="f">메모</label><input type="text" id="sTopMemo" placeholder="계좌이체"></div>'+

function usageBoxBind(code){
  var b=$("sTopGo"); if(!b) return;
  b.onclick=function(){
    var qty=Number($("sTopQty").value)||0;
    if(!qty) return toast("건수를 적어 주세요",true);
    api("hqTopup",[code,{ kind:$("sTopKind").value, qty:qty,
      amount:Number($("sTopAmt").value)||0, memo:$("sTopMemo").value.trim() }])
      .then(function(r){ return loadAll().then(function(){ return r; }); })
      .then(function(r){ toast((r&&r.kind==="tax"?"세금계산서 ":"문자 ")+(r&&r.qty)+"건을 넣었어요"); shopSheet(code); })
      .catch(function(e){ toast(emsg(e),true); });
  };
}

      '<div><label class="f">여유분 (업체당 한 번)</label><input type="number" id="sSpare" value="'+

      $("sTrial").value = t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");

      .then(function(){ closeSheet(); toast("저장했어요"); render(); })
      .catch(function(e){ toast(emsg(e),true); });
  };
  $("sDel").onclick=function(){
    openSheet('<h3>업체 지우기</h3>'+

      '<div class="warnbox">입출고 기록, 거래처, 청구서, 계정이 전부 사라져요. 되돌릴 수 없어요.</div>'+
      '<label class="f">확인하려면 업체명을 그대로 적어 주세요</label>'+
      '<input type="text" id="dName" placeholder="'+esc(s.name)+'">'+
      '<div class="sheetbtns"><button class="btn" id="dNo">취소</button>'+
      '<button class="btn danger" id="dYes" style="flex:2">지우기</button></div>');

    $("dYes").onclick=function(){
      api("hqShopDel",[code,$("dName").value]).then(function(){ return loadAll(); })
        .then(function(){ closeSheet(); toast("지웠어요"); render(); })
        .catch(function(e){ toast(emsg(e),true); });
    };
  };
}

var ROLE = {owner:"대표", manager:"매니저", staff:"직원", admin:"본사 관리자"};

  $("main").innerHTML =
    '<div class="dashhead"><h2>계정 관리</h2>'+
    '<div class="sub2">모든 업체의 대표·직원 계정이에요. 줄을 누르면 고칠 수 있어요.</div></div>'+
    '<div id="tUsers"></div>';
  makeTable({
    id:"tUsers", rows:(D.users||[]).slice(), search:["name","phone","shopName"],
    sortKey:"shopName", rowId:function(r){ return r.phone; },
    onRow:function(ph){ userSheet(ph); },
    filters:[
      {k:"shop", label:"업체", get:function(r){ return r.shop; },
       opts:[["","업체 전체"]].concat((D.shops||[]).map(function(s2){
         return [s2.shop, s2.name||s2.shop]; }))},
      {k:"role", label:"권한", get:function(r){ return r.role; },
       opts:[["","권한 전체"],["admin","본사 관리자"],["owner","대표"],["manager","매니저"],["staff","직원"]]},
      {k:"active", label:"상태", get:function(r){ return r.active===false?"off":"on"; },
       opts:[["","상태 전체"],["on","진행 중"],["off","보류"]]},
      {k:"_seen", label:"마지막 접속", get:function(r){
         if(!r.last_login) return "never";
         var d=(Date.now()-new Date(r.last_login).getTime())/864e5;
         return d<1?"today":(d<7?"w1":(d<30?"m1":"old")); },
       opts:[["","접속 전체"],["today","오늘"],["w1","7일 이내"],["m1","30일 이내"],["old","30일 넘음"],["never","한 번도 없음"]]},
      {k:"_made", label:"만든 날", get:function(r){
         if(!r.created_at) return "old";
         var d=(Date.now()-new Date(r.created_at).getTime())/864e5;
         return d<7?"w1":(d<30?"m1":"old"); },
       opts:[["","만든 날 전체"],["w1","최근 7일"],["m1","최근 30일"],["old","30일 넘음"]]}
    ],
    cols:[
      {k:"name", label:"이름", w:110, stick:true, html:function(r){ return '<b>'+esc(r.name)+'</b>'; }},
      {k:"shopName", label:"업체", w:130, html:function(r){
        return esc(r.shopName||r.shop)+(r.shopOn===false?' <span class="pill off">보류</span>':''); }},
      {k:"phone", label:"아이디", w:140, mono:true, html:function(r){ return esc(phoneFmt(r.phone)); }},
      {k:"role", label:"권한", w:90, html:function(r){
        return '<span class="pill '+(r.role==="owner"?"ok":(r.role==="admin"?"wait":(r.role==="manager"?"wait":"gray")))+'">'+
          esc(ROLE[r.role]||r.role)+'</span>'; }},
      {k:"active", label:"상태", w:80, sortVal:function(r){ return r.active===false?0:1; },
        html:function(r){ return r.active===false
          ? '<span class="pill off">보류</span>' : '<span class="pill run">진행 중</span>'; }},
      {k:"last_login", label:"마지막 접속", w:110, html:function(r){ return esc(ago(r.last_login)); }},
      {k:"created_at", label:"만든 날", w:100, html:function(r){ return dt(r.created_at); }},
      {k:"_", label:"", w:70, nosort:true, html:function(r){
        return '<button class="btn sm" data-u="'+esc(r.phone)+'">고치기</button>'; }}
    ]
  });
  Array.prototype.forEach.call($("tUsers").querySelectorAll("button[data-u]"),function(b){
    b.onclick=function(e){ e.stopPropagation(); userSheet(b.getAttribute("data-u")); }; });
}

function payAddSheet(){
  var shopOpts = (D.shops||[]).filter(function(s){return s.shop!=="ADMIN";})
    .map(function(s){ return '<option value="'+esc(s.shop)+'" data-plan="'+esc(s.plan||"")+'">'+
      esc(s.name)+'</option>'; }).join("");
  var planOpts = (D.plans||[]).map(function(p){
    return '<option value="'+esc(p.code)+'" data-price="'+(p.price||0)+'">'+esc(p.name)+'</option>'; }).join("");
  var ym = new Date().toISOString().slice(0,7);
  openSheet('<h3>청구 만들기</h3><div class="sub">받을 금액을 한 건 적어 둬요.</div>'+
    '<label class="f">업체</label><select id="pShop">'+shopOpts+'</select>'+
    '<div class="row2">'+
      '<div><label class="f">요금제</label><select id="pPlan">'+planOpts+'</select></div>'+
      '<div><label class="f">기간</label><input type="text" id="pPeriod" value="'+ym+'" placeholder="2026-09"></div>'+
    '</div>'+
    '<label class="f">금액 (원)</label><input type="number" id="pAmt" value="0">'+
    '<label class="f">메모</label><input type="text" id="pMemo" placeholder="선택">'+
    '<div class="sheetbtns"><button class="btn" id="pNo">취소</button>'+
      '<button class="btn primary" id="pYes" style="flex:2">만들기</button></div>');
  function sync(){
    var sel=$("pPlan"), o=sel.options[sel.selectedIndex];
    if(o) $("pAmt").value = o.getAttribute("data-price")||0;
  }
  $("pPlan").onchange=sync;
  $("pShop").onchange=function(){
    var o=$("pShop").options[$("pShop").selectedIndex];
    var pc=o?o.getAttribute("data-plan"):"";
    if(pc){ for(var i=0;i<$("pPlan").options.length;i++){
      if($("pPlan").options[i].value===pc){ $("pPlan").selectedIndex=i; break; } } }
    sync();
  };
  sync();
  $("pNo").onclick=closeSheet;
  $("pYes").onclick=function(){
    api("hqPayAdd",[$("pShop").value,$("pPlan").value,Number($("pAmt").value)||0,
      $("pPeriod").value.trim(),$("pMemo").value.trim()])
      .then(function(){ return loadAll(); })
      .then(function(){ closeSheet(); toast("청구를 만들었어요"); render(); })
      .catch(function(e){ toast(emsg(e),true); });
  };
}

function paySheet(id){
  var p = (D.pays||[]).filter(function(x){return x.id===id;})[0];
  if(!p) return;
  var s = PST[p.status]||["?","gray"];
  openSheet('<h3>'+esc(p.shopName||p.biz_name||"-")+'</h3>'+
    '<div class="sub">'+esc(p.period||"기간 없음")+' · '+won(p.amount)+' · <span class="pill '+s[1]+'">'+s[0]+'</span></div>'+
    '<div class="hint" style="margin-bottom:14px">주문번호 '+esc(p.id)+'</div>'+
    (p.status==="ready"
      ? '<label class="f">어떻게 받으셨나요</label>'+
        '<select id="pMethod"><option>계좌이체</option><option>현금</option><option>카드</option><option>기타</option></select>'+
        '<button class="btn primary" id="pPaid" style="width:100%;margin-top:14px">받음으로 바꾸기</button>'
      : '<button class="btn" id="pBack" style="width:100%">못 받음으로 되돌리기</button>')+
    '<div class="sheetbtns" style="margin-top:22px"><button class="btn" id="pClose">닫기</button>'+
      '<button class="btn danger" id="pDel">이 건 지우기</button></div>');
  $("pClose").onclick=closeSheet;
  if($("pPaid")) $("pPaid").onclick=function(){
    api("hqPayMark",[id,"paid",$("pMethod").value]).then(function(){ return loadAll(); })
      .then(function(){ closeSheet(); toast("받음으로 바꿨어요"); render(); })
      .catch(function(e){ toast(emsg(e),true); });
  };
  if($("pBack")) $("pBack").onclick=function(){
    api("hqPayMark",[id,"ready",""]).then(function(){ return loadAll(); })
      .then(function(){ closeSheet(); toast("되돌렸어요"); render(); })
      .catch(function(e){ toast(emsg(e),true); });
  };
  $("pDel").onclick=function(){
    confirmBox("결제 건 지우기","이 기록을 지워요. 회계 증빙이 필요하면 지우지 말고 «취소» 상태로 두세요.",
      "지우기", true, function(){
      api("hqPayDel",[id]).then(function(){ return loadAll(); })
        .then(function(){ toast("지웠어요"); render(); })
        .catch(function(e){ toast(emsg(e),true); });
    });
  };
}

function planForm(code){
  return { code:code,
    name:$("pl_n_"+code).value.trim(),
    price:Number($("pl_p_"+code).value)||0,
    seats:Number($("pl_s_"+code).value)||0,
    pcMax:Number($("pl_pc_"+code).value)||0,
    staffPc:$("pl_sp_"+code).value==="1",
    smsFree:Number($("pl_sf_"+code).value)||0,
    taxFree:Number($("pl_tf_"+code).value)||0,
    active:$("pl_a_"+code).value==="1" };
}
/* 요금제 한눈에 비교표 */
function planCmp(){
  var ps = (D.plans||[]);
  if(!ps.length) return "";
  function lim(n){ n=Number(n||0); return n?cnt(n).replace("건","")+"대":"제한 없음"; }
  var rows = [
    ["월 요금", function(p){ return '<b>'+won(p.price||0)+'</b>'; }],
    ["계정 수 (휴대폰)", function(p){ return lim(p.seats); }],
    ["PC 대수", function(p){ return lim(p.pc_max); }],
    ["직원도 PC", function(p){ return p.staff_pc
        ? '<span class="yes">가능</span>' : '<span class="no">휴대폰만</span>'; }],
    ["문자 무료 (달마다)", function(p){ return Number(p.sms_free||0)?cnt(p.sms_free):'<span class="no">없음</span>'; }],
    ["세금계산서 무료 (달마다)", function(p){ return Number(p.tax_free||0)?cnt(p.tax_free):'<span class="no">못 씀</span>'; }],
    ["가입 화면", function(p){ return p.active
        ? '<span class="yes">보임</span>' : '<span class="no">숨김</span>'; }]
  ];
  var h = '<div class="tablebox cmpWrap"><table class="cmp"><thead><tr><th class="c-name" style="left:0">항목</th>'+
    ps.map(function(p){ return '<th>'+esc(p.name)+'</th>'; }).join("")+'</tr></thead><tbody>';
  rows.forEach(function(r){
    h += '<tr><td class="c-name" style="left:0">'+esc(r[0])+'</td>'+
      ps.map(function(p){ return '<td>'+r[1](p)+'</td>'; }).join("")+'</tr>';
  });
  h += '</tbody></table></div>';
  return h;
}

      '<div><label class="f">이름</label><input type="text" id="pl_n_'+c+'" value="'+esc(p.name)+'"></div>'+
      '<div><label class="f">월 요금 (원)</label><input type="number" id="pl_p_'+c+'" value="'+(p.price||0)+'"></div>'+
      '</div><div class="row2">'+
      '<div><label class="f">계정 수 = 휴대폰 대수 (0 = 제한 없음)</label><input type="number" id="pl_s_'+c+'" value="'+(p.seats||0)+'"></div>'+
      '<div><label class="f">보이기</label><select id="pl_a_'+c+'">'+
        '<option value="1"'+(p.active?" selected":"")+'>가입 화면에 보임</option>'+
        '<option value="0"'+(!p.active?" selected":"")+'>숨김</option></select></div>'+
      '</div><div class="row2">'+
      '<div><label class="f">PC 대수 — 업체 전체 (0 = 제한 없음)</label><input type="number" id="pl_pc_'+c+'" value="'+(p.pc_max||0)+'"></div>'+
      '<div><label class="f">직원도 PC 로 들어올 수 있게</label><select id="pl_sp_'+c+'">'+
        '<option value="0"'+(!p.staff_pc?" selected":"")+'>안 됨 — 직원은 휴대폰만</option>'+
        '<option value="1"'+(p.staff_pc?" selected":"")+'>됨 — 직원도 PC 가능</option></select></div>'+
      '</div>'+
      '</div><div class="row2">'+
      '<div><label class="f">문자 무료 건수 (달마다)</label><input type="number" id="pl_sf_'+c+'" value="'+(p.sms_free||0)+'"></div>'+
      '<div><label class="f">세금계산서 무료 건수 (0 = 못 씀)</label><input type="number" id="pl_tf_'+c+'" value="'+(p.tax_free||0)+'"></div>'+
      '<div class="hint">코드 '+c+' · 기능: '+esc((p.features||[]).join(", ")||"-")+'</div>'+
      '<button class="btn primary sm" id="pl_b_'+c+'" style="margin-top:12px;justify-self:start;align-self:start">이것만 저장</button></div>';
  });
  if(!(D.plans||[]).length) h += '<div class="card"><div class="empty">요금제가 없어요.</div></div>';
  $("main").innerHTML = h;
  (D.plans||[]).forEach(function(p){
    $("pl_b_"+p.code).onclick=function(){
      api("hqPlanSave",[p.code,planForm(p.code)]).then(function(){ return loadAll(); })
        .then(function(){ toast(p.name+" 요금제를 저장했어요"); render(); })
        .catch(function(e){ toast(emsg(e),true); });
    };
  });
  if($("plAll")) $("plAll").onclick=function(){
    var list=(D.plans||[]).map(function(p){ return planForm(p.code); });
    if(!list.length) return;
    toast("저장 중…");
    api("hqPlanSaveAll",[list]).then(function(r){ return loadAll().then(function(){ return r; }); })
      .then(function(r){ toast("요금제 "+((r&&r.done)||list.length)+"개를 한 번에 저장했어요"); render(); })
      .catch(function(e){ toast(emsg(e),true); });
  };
}

var OPS = {};

function gbTxt(b){
  b = Number(b)||0;
  if(b < 1024) return b+" B";
  if(b < 1024*1024) return (b/1024).toFixed(1)+" KB";
  if(b < 1024*1024*1024) return (b/1024/1024).toFixed(1)+" MB";
  return (b/1024/1024/1024).toFixed(2)+" GB";
}

function viewOps(){
  var h = '<div class="dashhead"><h2>운영 상태</h2>'+
    '<div class="sub2">자료와 사진이 얼마나 쌓였는지, 다달이 나가는 금액이 얼마인지 한 번에 봐요. '+
    '「지금 다시 확인」을 누르면 서버에 직접 물어봐요.</div></div>'+
    '<div class="tools"><button class="btn primary" id="opsGo">지금 다시 확인</button>'+
      '<button class="btn sm" id="opsSvc">유지비 화면으로</button>'+
      '<span class="sp"></span><span class="cnt" id="opsAt">'+
      (OPS.at?("마지막 확인 "+dtTime(OPS.at)):"아직 확인하지 않았어요")+'</span></div>'+
    '<div id="opsBody"></div>';
  $("main").innerHTML = h;
  $("opsGo").onclick = opsLoad;
  $("opsSvc").onclick = function(){ TAB="svc"; window.scrollTo(0,0); render(); };
  opsDraw();
  if(!OPS.loaded) opsLoad();

function opsLoad(){
  if(OPS.busy) return;
  OPS.busy = true;
  var b=$("opsGo"); if(b){ b.disabled=true; b.textContent="확인하는 중…"; }
  api("hqOps",[]).then(function(r){
    OPS.loaded = true;
    OPS.usage    = (r&&r.usage)||null;
    OPS.usageErr = (r&&r.usageErr)||"";
    OPS.names    = (r&&r.names)||{};
    OPS.limits   = (r&&r.limits)||{dbGb:8,fileGb:100,warnPct:80};
    OPS.grow     = (r&&r.grow)||null;
    OPS.services = (r&&r.services)||[];
    OPS.monthCost= Number((r&&r.monthCost)||0);
    OPS.due      = (r&&r.due)||[];
    OPS.low      = (r&&r.low)||[];
    OPS.at       = (r&&r.at)||new Date().toISOString();
  },function(e){
    OPS.loaded = true; OPS.err = emsg(e,"확인하지 못했어요. 다시 시도해 주세요.");
    toast(OPS.err,true);
  }).then(function(){
    OPS.busy=false;
    var b2=$("opsGo"); if(b2){ b2.disabled=false; b2.textContent="지금 다시 확인"; }
    var at=$("opsAt"); if(at) at.textContent = OPS.at?("마지막 확인 "+dtTime(OPS.at)):"확인하지 못했어요";
    opsDraw();
  });
}

function opsGauge(name, used, capGb, warnPct, sub){
  var cap = capGb*1024*1024*1024;
  var pct = cap>0 ? Math.min(100, used/cap*100) : 0;
  var cls = pct>=95 ? " d" : (pct>=warnPct ? " w" : "");
  return '<div class="gauge"><div class="gh"><span class="gn">'+esc(name)+'</span>'+
    '<span class="gv">'+gbTxt(used)+' / '+capGb+' GB · '+pct.toFixed(1)+'%</span></div>'+
    '<div class="prog'+cls+'"><i style="width:'+Math.max(1,pct).toFixed(1)+'%"></i></div>'+
    (sub?('<div class="gs">'+sub+'</div>'):'')+'</div>';
}

function opsDraw(){

        '<div class="how">→ '+esc(w.how)+'</div></div></div>';
    });
    h += '<div style="height:12px"></div>';
  }

  /* 큰 숫자 4칸 */
  var sms = (OPS.services||[]).filter(function(v){return v.code==="solapi";})[0];
  h += '<div class="opsTop">'+
    '<div class="kbox"><span class="t">자료 용량</span>'+
      '<span class="v" style="display:block">'+(u?gbTxt(u.db_bytes):"—")+'</span>'+

function cgSend(minus){
  var shop=$("cgShop").value, v=Number($("cgAmt").value)||0,
      d=Number($("cgDays").value)||365, memo=$("cgMemo").value.trim();
  if(!shop || v<=0) return toast("업체와 금액을 확인해 주세요",true);
  if(minus){
    confirmBox("캐시 빼기", shop+" 에서 "+won(v)+" 을 빼요.","빼기",true,function(){
      api("hqCashTake",[shop,v,memo||"본사 조정"]).then(function(){ toast("뺐어요"); cashLoad(); })
        .catch(function(e){ toast(emsg(e),true); });
    });
    return;
  }
  api("hqCashAdd",[shop,v,d,memo,"paid"]).then(function(r){
    if(r && r.confirm){
      confirmBox("큰 금액이에요", won(v)+" 을 "+shop+" 지갑에 넣어요. 맞나요?","넣기",false,function(){
        api("hqCashAdd",[shop,v,d,memo,"paid",true]).then(function(){ toast("넣었어요"); cashLoad(); })
          .catch(function(e){ toast(emsg(e),true); });
      });
      return;
    }
    toast("넣었어요"); cashLoad();
  }).catch(function(e){ toast(emsg(e),true); });
}

function expLoad(){
  if(EXP.busy) return; EXP.busy=true;
  api("hqExp",[]).then(function(r){
    EXP.loaded=true; EXP.err="";
    EXP.cfg=(r&&r.cfg)||{}; EXP.shops=(r&&r.shops)||[]; EXP.logs=(r&&r.logs)||[];
    EXP.cron=!!(r&&r.cronReady); EXP.at=new Date().toISOString();
    if(!EXP.cfg.tpls || !EXP.cfg.tpls.length) EXP.cfg.tpls=[{name:"기본",text:""},{name:"",text:""},{name:"",text:""}];
    while(EXP.cfg.tpls.length<3) EXP.cfg.tpls.push({name:"",text:""});
    if(EXP.ti===undefined) EXP.ti=Number(EXP.cfg.tplIdx||0);
  },function(e){ EXP.loaded=true; EXP.err=emsg(e,"불러오지 못했어요. 다시 시도해 주세요."); })
  .then(function(){ EXP.busy=false;
    var at=$("expAt"); if(at) at.textContent=EXP.at?("마지막 확인 "+dtTime(EXP.at)):"";
    expDraw(); });
}

function koTime(h,m){

  return t+" "+twoD(m)+"분";
}

var CALM=null, TODO={list:null};

function calEvents(){
  var ev=[];
  (D.svcs||[]).filter(function(v){ return v.active!==false && v.next_due; }).forEach(function(v){
    ev.push({d:String(v.next_due).slice(0,10),
      t:v.name+(Number(v.cost||0)?(" "+won(v.cost)):"")+" 결제", c:"w", go:"svc", cost:Number(v.cost||0)});
  });
  (D.shops||[]).forEach(function(x){
    if(x.shop==="ADMIN") return;
    var isT=!x.plan||x.plan==="trial";
    if(isT && x.trial_until) ev.push({d:String(x.trial_until).slice(0,10), t:(x.name||x.shop)+" 체험 끝", c:"d", go:"shops"});
    else if(x.paid_until)    ev.push({d:String(x.paid_until).slice(0,10), t:(x.name||x.shop)+" 이용기한", c:"", go:"shops"});
  });
  ((TODO.list)||[]).filter(function(t){ return t.due_at && !t.done; }).forEach(function(t){
    ev.push({d:String(t.due_at).slice(0,10), t:t.title, c:"g", go:"sum"});
  });
  return ev;
}
function calHtml(){
  var now=new Date();
  if(!CALM) CALM=new Date(now.getFullYear(), now.getMonth(), 1);
  var y=CALM.getFullYear(), m=CALM.getMonth();
  var first=new Date(y,m,1), last=new Date(y,m+1,0), start=new Date(y,m,1-first.getDay());
  function ds(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  var todayS=ds(now), byDay={};
  calEvents().forEach(function(e){ (byDay[e.d]||(byDay[e.d]=[])).push(e); });

  var h='<div class="cal"><div class="calHd">'+
    '<h3>'+y+'년 '+(m+1)+'월 일정</h3>'+
    '<span style="display:inline-flex;gap:6px">'+
      '<button class="btn sm" id="calPrev">‹ 지난달</button>'+
      '<button class="btn sm" id="calNow">이번 달</button>'+
      '<button class="btn sm" id="calNext">다음 달 ›</button></span>'+
    '<span class="sp"></span><span class="cnt">결제일 · 이용기한 · 체험 끝나는 날</span></div>'+
    '<div class="calGrid">'+["일","월","화","수","목","금","토"].map(function(d){
      return '<div class="dow">'+d+'</div>'; }).join("");
  var cur=new Date(start), guard=0;
  while(guard++<42){
    var k=ds(cur), cls="calCell";
    if(cur.getMonth()!==m) cls+=" out";
    if(k===todayS) cls+=" today";
    if(cur.getDay()===0) cls+=" sun";
    if(cur.getDay()===6) cls+=" sat";
    var list=byDay[k]||[];
    h+='<div class="'+cls+'"><span class="d">'+cur.getDate()+'</span>'+
      list.slice(0,3).map(function(e){
        return '<span class="calEv '+e.c+'" data-go="'+esc(e.go)+'" title="'+esc(e.t)+'">'+esc(e.t)+'</span>'; }).join("")+
      (list.length>3?'<span class="calEv x">외 '+(list.length-3)+'건</span>':'')+'</div>';
    cur.setDate(cur.getDate()+1);
    if(cur>last && cur.getDay()===0) break;
  }
  h+='</div><div class="calLg">'+
    '<span><i style="background:var(--warn)"></i>유지비 결제일</span>'+
    '<span><i style="background:var(--blue)"></i>업체 이용기한</span>'+
    '<span><i style="background:var(--danger)"></i>체험 끝나는 날</span>'+
    '<span><i style="background:var(--ok)"></i>할 일</span></div></div>';
  return h;
}
function calBind(){
  function mv(n){ CALM=new Date(CALM.getFullYear(), CALM.getMonth()+n, 1); render(); }

  if($("calNext")) $("calNext").onclick=function(){mv(1);};

      '<div class="kbox'+(warn?' warn':'')+'"><span class="t">한 번 봐주실 것</span>'+
        '<span class="v" style="display:block;color:'+(warn?'var(--warn)':'var(--text)')+'">'+warn+'건</span>'+
        '<span class="s" style="display:block">'+(warn?'급하지는 않아요':'없어요')+'</span></div>'+
      '<div class="kbox"><span class="t">잘 되어 있는 것</span>'+
        '<span class="v" style="display:block;color:var(--good)">'+ok+'건</span>'+
        '<span class="s" style="display:block">서버 '+esc(SEC.ver||"")+'</span></div>'+
    '</div>';

    var groups=[];
    c.forEach(function(x){ if(groups.indexOf(x.group)<0) groups.push(x.group); });
    groups.forEach(function(g){
      h += '<div class="card"><div class="secGrp">'+esc(g)+'</div>';
      c.filter(function(x){return x.group===g;})
       .sort(function(a,b){ return b.lv-a.lv; })
       .forEach(function(x){
         h += '<div class="secRow lv'+x.lv+'"><span class="dot"></span><div class="bd">'+
              '<div class="nm">'+esc(x.name)+'</div>'+
              '<div class="tx">'+esc(x.txt)+'</div>'+
              (x.how?'<div class="how">→ '+esc(x.how)+'</div>':'')+
              '</div><span class="pill '+(x.lv===2?'off':(x.lv===1?'wait':'ok'))+'">'+
              secPill(x.lv)+'</span></div>';
       });
      h += '</div>';
    });
  }

  /* 손으로 확인하는 목록 */
  var st = SEC.state||{};
  var doneN = SEC_MANUAL.filter(function(m){return st[m[0]];}).length;
  h += '<div class="card"><div class="todoHd">'+
       '<span class="'+(doneN===SEC_MANUAL.length?"dotOk":"dotWarn")+'"></span>'+
       '<h2>손으로 확인하는 것 ('+doneN+' / '+SEC_MANUAL.length+')</h2></div>'+
       '<p class="lead" style="margin:2px 0 12px">직접 눌러 봐야 아는 것들이에요. '+
       '확인하신 것은 네모를 눌러 표시해 두세요 — 누가 언제 확인했는지 같이 남아요.</p>';
  SEC_MANUAL.forEach(function(m){
    var d = st[m[0]];
    h += '<label class="secChk'+(d?' on':'')+'" data-m="'+esc(m[0])+'">'+
         '<input type="checkbox"'+(d?' checked':'')+'>'+
         '<span class="bd"><span class="nm">'+esc(m[1])+'</span>'+
         '<div class="tx">'+esc(m[2])+'</div>'+
         (d?'<div class="dn">확인함 · '+dtTime(d.at)+' 확인'+(d.who?(" · "+esc(phoneFmt(d.who))):"")+'</div>':'')+
         '</span></label>';
  });
  h += '</div>';

  host.innerHTML = h;
  Array.prototype.forEach.call(host.querySelectorAll("label.secChk"),function(el){
    var box = el.querySelector("input");
    box.onchange = function(){
      var k = el.getAttribute("data-m"), on = box.checked;
      box.disabled = true;
      api("hqSecSave",[k,on]).then(function(r){
        SEC.state = (r&&r.state)||SEC.state;
        secDraw();
      },function(e){
        box.checked = !on; box.disabled = false;
        toast(emsg(e,"저장하지 못했어요. 다시 시도해 주세요."),true);
      });
    };
  });
}

function viewSvc(){
