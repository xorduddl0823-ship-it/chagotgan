<script>
(function(){
/* 관리 판 번호 — 고칠 때마다 이 줄만 바꾸면 화면에 그대로 나와요 (워시 APP_VER 와 같은 꼴) */
var ADM_VER="관리 v4.1 · UI 3.0 · 2026-10-15";
try{
  document.title = "차곳간 관리";
  var _g=document.getElementById("gVer"); if(_g) _g.textContent = ADM_VER;
  /* 판 번호는 짧게 — 「v3.6 · UI 1.1」 (전체는 마우스를 올리면 보여요) — 워시와 같은 식 */
  var _h=document.getElementById("hVer");
  if(_h){ _h.textContent = ADM_VER.replace(/^\S+\s+/,"").replace(/\s*·\s*\d{4}-\d{2}-\d{2}\s*$/,""); _h.title = ADM_VER; }
}catch(e){}
"use strict";

/* =========================================================
   서버 연결
   ========================================================= */
var API = "https://ybfpxmmjofyvfprtvmhj.supabase.co/functions/v1/wash-api?forceFunctionRegion=ap-northeast-2";
var SHOP = "ADMIN";
var SIDKEY = "cgg_admin_sid";

function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k)||""; localStorage.setItem(k,v); }catch(e){} return ""; }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

function post(bodyObj){
  return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(bodyObj)})
    .then(function(r){return r.text();},function(){throw new Error("서버에 연결하지 못했습니다 (인터넷 확인)");})
    .then(function(x){
      var j; try{ j=JSON.parse(x); }catch(e){ throw new Error("서버 응답을 읽지 못했습니다"); }
      if(j && j.__err) throw new Error(j.__err);
      return j ? j.result : null;
    });
}
function open_(fn,args){ return post({shop:"",token:"",fn:fn,args:args||[]}); }
function api(fn,args){
  var sid = ls(SIDKEY);
  if(!sid) return Promise.reject(new Error("로그인이 필요합니다"));
  return post({shop:SHOP,token:sid,fn:fn,args:args||[]}).catch(function(e){
    if(/로그인이 필요|열쇠|세션/.test(e.message||"")){ lsDel(SIDKEY); showGate("다시 로그인해 주세요"); }
    throw e;
  });
}

/* =========================================================
   공통 도구
   ========================================================= */
function $(id){ return document.getElementById(id); }
function esc(v){ return String(v==null?"":v).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function digits(v){ return String(v||"").replace(/[^0-9]/g,""); }
function phoneFmt(v){
  var s=String(v||""); if(!/^[0-9]+$/.test(s)) return s;   /* 글자 아이디는 그대로 */
  var d=digits(s);
  if(d.length===11) return d.slice(0,3)+"-"+d.slice(3,7)+"-"+d.slice(7);
  if(d.length===10) return d.slice(0,3)+"-"+d.slice(3,6)+"-"+d.slice(6);
  return s;
}
function won(n){ return (Number(n)||0).toLocaleString("ko-KR")+"원"; }
function dt(v,withTime){
  if(!v) return "-";
  var d=new Date(v); if(isNaN(d)) return "-";
  var s=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  if(withTime) s+=" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  return s;
}
function ago(v){
  if(!v) return "기록 없음";
  var ms=Date.now()-new Date(v).getTime();
  if(isNaN(ms)) return "-";
  var d=Math.floor(ms/864e5);
  if(d<=0) return "오늘";
  if(d===1) return "어제";
  if(d<30) return d+"일 전";
  if(d<365) return Math.floor(d/30)+"달 전";
  return Math.floor(d/365)+"년 전";
}
var toastT=null;
function toast(msg,bad){
  var el=$("toast"); el.textContent=msg; el.className="toast show"+(bad?" bad":"");
  clearTimeout(toastT); toastT=setTimeout(function(){ el.className="toast"; },2600);
}
function closeSheet(){ $("sheet").classList.remove("show"); $("sheetbg").classList.remove("show"); $("sheet").innerHTML=""; }
function openSheet(html){
  /* 워시와 같은 창 — 오른쪽 위 ✕ 단추, 아래 단추 줄은 sheetbtns (UI 1.1) */
  var sh=$("sheet");
  if(html!==undefined) sh.innerHTML=String(html).replace(/class="sheetbtns"/g,'class="sheetbtns"');
  if(!sh.querySelector(".sheetx")){
    var x=document.createElement("button");x.type="button";x.className="sheetx";x.textContent="✕";
    x.onclick=closeSheet;sh.insertBefore(x,sh.firstChild);
  }
  sh.classList.add("show");$("sheetbg").classList.add("show");
  var f=sh.querySelector("input:not([type=checkbox]),select,textarea"); if(f) setTimeout(function(){ try{f.focus();}catch(e){} },60);
}
$("sheetbg").onclick=closeSheet;
/* 묻는 창 — 워시 ask() 그대로 (가운데 작은 창) */
function closeAsk(){$("askbox").classList.remove("show");$("askbg").classList.remove("show");}
function ask(msg,onOk,okText,danger){
  $("askbox").innerHTML='<div class="msg">'+esc(msg)+'</div>'+
    '<div class="row"><button class="btn" id="askNo">취소</button>'+
    '<button class="btn '+(danger?"danger":"primary")+'" id="askYes">'+esc(okText||"네, 진행")+'</button></div>';
  $("askbox").classList.add("show");$("askbg").classList.add("show");
  $("askNo").onclick=closeAsk;
  $("askYes").onclick=function(){closeAsk();if(onOk)onOk();};
}
function confirmBox(title,text,okText,danger,onOk){ ask(title+(text?"\n"+text:""), onOk, okText, danger); }

/* =========================================================
   표 만들기 (정렬 · 검색 · 보기 개수 · 틀 고정 · 체크칸)
   ========================================================= */
var TSTATE = {};
function makeTable(o){
  /* o: {id, cols:[{k,label,w,stick,num,html,nosort}], rows, search:[k], checks, bulk, onRow} */
  var st = TSTATE[o.id] || (TSTATE[o.id]={q:"",size:20,page:1,key:o.sortKey||"",dir:o.sortDir||"asc",sel:{}});
  if(!st.f) st.f = {};
  var host = $(o.id);
  if(!host) return;

  function val(r,c){ return c.sortVal ? c.sortVal(r) : r[c.k]; }
  function draw(){
    var rows = (o.rows||[]).slice();
    /* 거르기 — 권한·상태 같은 칸을 골라서 봐요 */
    (o.filters||[]).forEach(function(f){
      var v = st.f[f.k];
      if(v===undefined || v==="") return;
      rows = rows.filter(function(r){ return String(f.get?f.get(r):r[f.k]) === String(v); });
    });
    /* 검색 */
    var q = st.q.trim().toLowerCase();
    if(q && o.search && o.search.length){
      rows = rows.filter(function(r){
        return o.search.some(function(k){
          return String(r[k]==null?"":r[k]).toLowerCase().indexOf(q)>=0; });
      });
    }
    /* 정렬 */
    if(st.key){
      var col = o.cols.filter(function(c){return c.k===st.key;})[0];
      if(col){
        rows.sort(function(a,b){
          var x=val(a,col), y=val(b,col);
          if(x==null) x=""; if(y==null) y="";
          if(typeof x==="number" && typeof y==="number") return st.dir==="asc"?x-y:y-x;
          x=String(x); y=String(y);
          return st.dir==="asc" ? x.localeCompare(y,"ko") : y.localeCompare(x,"ko");
        });
      }
    }
    var total = rows.length;
    var pages = Math.max(1, Math.ceil(total/st.size));
    if(st.page>pages) st.page=pages;
    var view = rows.slice((st.page-1)*st.size, st.page*st.size);

    /* ── 워시 표와 똑같은 뼈대 (UI 1.1): 도구줄 → tablebox → 쪽 넘김 ── */
    var h = '<div class="tools">'+
      '<input class="gq" type="text" id="'+o.id+'_q" placeholder="🔍 검색" value="'+esc(st.q)+'">'+
      '<select class="gs" id="'+o.id+'_size">'+[5,10,20,30,50].map(function(n){
        return '<option value="'+n+'"'+(st.size===n?" selected":"")+'>'+n+'개씩</option>'; }).join("")+'</select>'+
      (o.filters||[]).map(function(f){
        var cur = st.f[f.k]===undefined ? "" : String(st.f[f.k]);
        return '<select class="flt" data-f="'+esc(f.k)+'" title="'+esc(f.label)+'">'+
          f.opts.map(function(op){
            return '<option value="'+esc(op[0])+'"'+(cur===String(op[0])?" selected":"")+'>'+esc(op[1])+'</option>';
          }).join("")+'</select>';
      }).join("")+
      (o.filters&&o.filters.length ? '<button class="btn" id="'+o.id+'_fclr">거르기 지우기</button>' : '')+
      (o.bulk?('<button class="btn danger" id="'+o.id+'_bulk">선택 처리</button>'):'')+
      '</div>';

    var L0 = o.checks ? 46 : 0;
    h += '<div class="gbody"><div class="tablebox"><table style="min-width:'+(o.min||760)+'px"><thead><tr>';
    if(o.checks) h += '<th class="c-chk"><input type="checkbox" id="'+o.id+'_all"></th>';
    o.cols.forEach(function(c,i){
      var on = st.key===c.k;
      h += '<th data-k="'+esc(c.k)+'" class="'+(i===0?"c-name ":"")+(c.nosort?"nosort ":"")+(on?"on":"")+'" style="'+
           (i===0?("left:"+L0+"px;"):"")+(c.num?"text-align:right;":"")+(c.w?("min-width:"+c.w+"px;"):"")+'">'+
           esc(c.label)+(c.nosort?"":(' <span class="ar">'+(on?(st.dir==="asc"?"▲":"▼"):"↕")+'</span>'))+'</th>';
    });
    h += '</tr></thead><tbody>';
    view.forEach(function(r,ri){
      var rid = o.rowId ? o.rowId(r) : ri;
      h += '<tr data-id="'+esc(rid)+'">';
      if(o.checks) h += '<td class="c-chk"><input type="checkbox" data-ck="'+esc(rid)+'"'+(st.sel[rid]?" checked":"")+'></td>';
      o.cols.forEach(function(c,i){
        var cellv = c.html ? c.html(r) : esc(r[c.k]==null?"":r[c.k]);
        h += '<td class="'+(i===0?"c-name ":"")+(c.num?"num ":"")+(c.mono?"mono ":"")+'"'+
             (i===0?(' style="left:'+L0+'px;"'):'')+'>'+cellv+'</td>';
      });
      h += '</tr>';
    });
    h += '</tbody></table>'+(view.length?'':('<div class="empty">'+
         esc((typeof o.empty==="function"?o.empty(o.rows||[]):o.empty)||"보여드릴 자료가 없어요.")+'</div>'))+'</div>';

    /* 쪽 넘김 — 워시·체크와 같은 모양 (처음 · 이전 · N / M · 모두 N줄 · 다음 · 맨뒤) */
    h += '<div class="pager">'+
      '<button class="btn gfirst" id="'+o.id+'_first"'+(st.page<=1?" disabled":"")+'>처음</button>'+
      '<button class="btn gprev" id="'+o.id+'_prev"'+(st.page<=1?" disabled":"")+'>이전</button>'+
      '<span class="pg">'+st.page+' / '+pages+' · 모두 '+total+'줄</span>'+
      '<button class="btn gnext" id="'+o.id+'_next"'+(st.page>=pages?" disabled":"")+'>다음</button>'+
      '<button class="btn glast" id="'+o.id+'_last"'+(st.page>=pages?" disabled":"")+'>맨뒤</button></div></div>';
    host.innerHTML = h;
    bind(pages);
  }

  function bind(pages){
    var qi=$(o.id+"_q");
    if(qi) qi.oninput=function(){ st.q=qi.value; st.page=1; var pos=qi.selectionStart; draw();
      var n=$(o.id+"_q"); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} } };
    Array.prototype.forEach.call(host.querySelectorAll("select.flt"),function(sel){
      sel.onchange=function(){ st.f[sel.getAttribute("data-f")]=sel.value; st.page=1; draw(); };
    });
    var fc=$(o.id+"_fclr");
    if(fc) fc.onclick=function(){ st.f={}; st.page=1; draw(); };
    var se=$(o.id+"_size");
    if(se) se.onchange=function(){ st.size=Number(se.value)||20; st.page=1; draw(); };
    var pv=$(o.id+"_prev"); if(pv) pv.onclick=function(){ if(st.page>1){st.page--;draw();} };
    var nx=$(o.id+"_next"); if(nx) nx.onclick=function(){ if(st.page<pages){st.page++;draw();} };
    var fs=$(o.id+"_first"); if(fs) fs.onclick=function(){ if(st.page>1){st.page=1;draw();} };
    var ls_=$(o.id+"_last"); if(ls_) ls_.onclick=function(){ if(st.page<pages){st.page=pages;draw();} };
    Array.prototype.forEach.call(host.querySelectorAll(".pg button[data-p]"),function(b){
      b.onclick=function(){ st.page=Number(b.getAttribute("data-p")); draw(); }; });
    Array.prototype.forEach.call(host.querySelectorAll("thead th[data-k]"),function(th){
      if(th.className.indexOf("nosort")>=0) return;
      th.onclick=function(){
        var k=th.getAttribute("data-k");
        if(st.key===k) st.dir = (st.dir==="asc"?"desc":"asc"); else { st.key=k; st.dir="asc"; }
        draw();
      };
    });
    var all=$(o.id+"_all");
    if(all) all.onchange=function(){
      Array.prototype.forEach.call(host.querySelectorAll("input[data-ck]"),function(c){
        c.checked=all.checked; st.sel[c.getAttribute("data-ck")]=all.checked; });
    };
    Array.prototype.forEach.call(host.querySelectorAll("input[data-ck]"),function(c){
      c.onchange=function(){ st.sel[c.getAttribute("data-ck")]=c.checked; }; });
    var bk=$(o.id+"_bulk");
    if(bk) bk.onclick=function(){
      var ids=Object.keys(st.sel).filter(function(k){return st.sel[k];});
      if(!ids.length) return toast("먼저 왼쪽 네모칸을 체크해 주세요",true);
      o.bulk(ids, function(){ st.sel={}; });
    };
    if(o.onRow){
      Array.prototype.forEach.call(host.querySelectorAll("tbody tr[data-id]"),function(tr){
        tr.onclick=function(ev){
          if(ev.target && (ev.target.tagName==="INPUT"||ev.target.tagName==="BUTTON")) return;
          o.onRow(tr.getAttribute("data-id"));
        };
        tr.style.cursor="pointer";
      });
    }
  }
  draw();
}

/* =========================================================
   자료 보관
   ========================================================= */
var D = { me:null, sum:null, shops:[], users:[], pays:[], invites:[], plans:[], sess:[] };
var PLAN_NAME = {trial:"무료 체험"};

function loadAll(){
  return Promise.all([
    api("hqSummary",[]).then(function(r){ D.sum=r; }),
    api("hqShops",[]).then(function(r){ D.shops=(r&&r.shops)||[]; }),
    api("hqUsers",[]).then(function(r){ D.users=(r&&r.users)||[]; }),
    api("hqPayments",[]).then(function(r){ D.pays=(r&&r.payments)||[]; }),
    api("inviteList",[]).then(function(r){ D.invites=(r&&r.invites)||[]; }),
    api("hqPlans",[]).then(function(r){ D.plans=(r&&r.plans)||[];

/* 운영 서비스 하나의 상태를 봐요 — {lv, txt}  lv: 0 넉넉 / 1 곧 / 2 급함 */
function svcState(v){
  var lv=0, txt="", day=864e5;
  if(v.kind==="charge"){
    var bal=Number(v.balance||0), min=Number(v.min_bal||0);
    txt = won(bal)+" 남음";
    if(min>0 && bal<=min) lv=2;
    else if(min>0 && bal<=min*2) lv=1;
    if(lv===2) txt += " — 충전이 필요해요";
  }
  if(v.next_due){
    var left = Math.ceil((new Date(v.next_due+"T00:00:00").getTime()-Date.now())/day);
    var wd = Number(v.warn_days||14);
    var dtxt = left<0 ? ("기한 "+(-left)+"일 지남") : (left===0 ? "오늘까지" : ("D-"+left));
    txt = (txt?txt+" · ":"")+dtxt;
    if(left<0) lv=2; else if(left<=wd) lv=Math.max(lv,1);
  }
  if(!txt) txt = (v.kind==="sub"?"매달 결제":"확인 필요");
  if(v.auto && v.auto_err) { lv=Math.max(lv,1); txt = "자동 읽기 실패 — "+v.auto_err; }
  else if(v.auto_note && v.kind!=="charge" && !v.next_due) txt = v.auto_note;
  return {lv:lv, txt:txt, note:(v.auto?(v.auto_note||""):"")};
}
function svcPill(lv){
  return lv===2 ? '<span class="pill off">급함</span>'
       : lv===1 ? '<span class="pill wait">곧</span>'
                : '<span class="pill ok">넉넉</span>';
}

/* 오늘 날짜를 «9월 25일 (목)» 처럼 적어요 */
function dtFull(){
  var d = new Date(), w = ["일","월","화","수","목","금","토"][d.getDay()];
  return (d.getMonth()+1)+"월 "+d.getDate()+"일 ("+w+")";
}

/* 이 업체의 문자·계산서 총량과 남은 량을 계산합니다
   무료(요금제 또는 체험분) → 충전분 → 여유분 20건 순서로 써요 */
function usageOf(r){
  var trial = !r.plan || r.plan==="trial";
  var pl = (D.plans||[]).filter(function(p){return p.code===r.plan;})[0] || {};
  var smsFree = trial ? Number(r.trial_sms==null?300:r.trial_sms) : Number(pl.sms_free||0);
  var taxFree = trial ? Number(r.trial_tax==null?20:r.trial_tax)  : Number(pl.tax_free||0);
  var smsUsed = Number(r.sms_used||0), taxUsed = Number(r.tax_used||0);
  var smsPaid = Number(r.sms_paid||0), taxPaid = Number(r.tax_paid||0);
  var spareMax = Number(r.spare_max==null?20:r.spare_max), spareUsed = Number(r.spare_used||0);
  return {
    trial:trial,
    smsFree:smsFree, smsUsed:Math.min(smsUsed,smsFree), smsPaid:smsPaid,
    smsLeft:Math.max(0,smsFree-smsUsed)+smsPaid,
    smsTotal:smsFree+smsPaid,
    taxFree:taxFree, taxUsed:Math.min(taxUsed,taxFree), taxPaid:taxPaid,
    taxLeft:Math.max(0,taxFree-taxUsed)+taxPaid,
    taxTotal:taxFree+taxPaid,
    spareLeft:Math.max(0,spareMax-spareUsed), spareMax:spareMax
  };
}
/* 건수를 「1,000건」처럼 적어요 (금액이 아닙니다) */
function cnt(n){ return Number(n||0).toLocaleString("ko-KR")+"건"; }
/* 「342건 / 500건」처럼 남은 량과 총량을 같이 보여 줘요 */
function useCell(left,total,extra){
  if(total===0) return '<span style="color:var(--muted)">못 씀</span>';
  var col = left===0 ? "var(--danger)" : (left<=total*0.1 ? "var(--warn)" : "var(--text)");
  return '<b style="color:'+col+'">'+cnt(left)+'</b><span style="color:var(--muted)"> / '+cnt(total)+'</span>'+
         (extra?'<div style="font-size:11px;color:var(--muted)">'+esc(extra)+'</div>':'');
}

var ROLE = {owner:"대표", manager:"매니저", staff:"직원", admin:"본사 관리자"};

    id:"tUsers", rows:(D.users||[]).slice(), search:["name","phone","shopName"],
    sortKey:"shopName", rowId:function(r){ return r.phone; },

    filters:[
      {k:"shop", label:"업체", get:function(r){ return r.shop; },
       opts:[["","업체 전체"]].concat((D.shops||[]).map(function(s2){
         return [s2.shop, s2.name||s2.shop]; }))},
      {k:"role", label:"권한", get:function(r){ return r.role; },
       opts:[["","권한 전체"],["admin","본사 관리자"],["owner","대표"],["manager","매니저"],["staff","직원"]]},
      {k:"active", label:"상태", get:function(r){ return r.active===false?"off":"on"; },
       opts:[["","상태 전체"],["on","진행 중"],["off","보류"]]},
      {k:"_seen", label:"마지막 접속", get:function(r){
         if(!r.last_login) return "never";
         var d=(Date.now()-new Date(r.last_login).getTime())/864e5;
         return d<1?"today":(d<7?"w1":(d<30?"m1":"old")); },

      {k:"_made", label:"만든 날", get:function(r){

         return d<7?"w1":(d<30?"m1":"old"); },
       opts:[["","만든 날 전체"],["w1","최근 7일"],["m1","최근 30일"],["old","30일 넘음"]]}
    ],

      {k:"shopName", label:"업체", w:130, html:function(r){

      {k:"phone", label:"아이디", w:140, mono:true, html:function(r){ return esc(phoneFmt(r.phone)); }},
      {k:"role", label:"권한", w:90, html:function(r){

function userSheet(phone){
  var u = (D.users||[]).filter(function(x){return x.phone===phone;})[0];
  if(!u) return;
  var isMe = D.me && D.me.phone===phone;
  openSheet(
    '<h3>'+esc(u.name)+'</h3>'+
    '<div class="sub">'+esc(u.shopName||u.shop)+' · 아이디 '+esc(phoneFmt(u.phone))+'</div>'+
    (isMe?'<div class="warnbox">지금 로그인해 쓰고 있는 계정이에요.</div>':'')+
    '<label class="f">이름</label><input type="text" id="uName" value="'+esc(u.name)+'">'+
    '<div class="row2">'+
      '<div><label class="f">권한</label><select id="uRole">'+
        '<option value="staff"'+(u.role==="staff"?" selected":"")+'>직원 — 현장(휴대폰)에서 입고·출고만</option>'+
        '<option value="manager"'+(u.role==="manager"?" selected":"")+'>매니저 — PC 도 됨, 정산·설정 빼고</option>'+
        '<option value="owner"'+(u.role==="owner"?" selected":"")+'>대표 — 전부</option>'+
        (u.shop==="ADMIN"?'<option value="admin"'+(u.role==="admin"?" selected":"")+'>본사 관리자</option>':'')+
        '</select></div>'+
      '<div><label class="f">상태</label><select id="uOn">'+
        '<option value="1"'+(u.active!==false?" selected":"")+'>진행 중</option>'+
        '<option value="0"'+(u.active===false?" selected":"")+'>정지</option></select></div>'+
    '</div>'+
    '<div class="sheetbtns"><button class="btn" id="uCancel">취소</button>'+
      '<button class="btn primary" id="uSave" style="flex:2">저장</button></div>'+
    '<label class="f" style="margin-top:24px">비밀번호</label>'+
    '<div class="row2"><input type="text" id="uPw" placeholder="새 비밀번호 (비우면 무작위 6자리)">'+
      '<button class="btn" id="uPwGo">비밀번호 바꾸기</button></div>'+
    '<div class="hint">바꾸면 그분이 켜 둔 모든 기기에서 로그아웃돼요.</div>'+
    (isMe?'':'<div class="warnbox" style="margin-top:22px">계정을 지우면 그분은 로그인할 수 없게 돼요. 입출고 기록은 남아요.</div>'+
      '<button class="btn danger" id="uDel" style="width:100%">이 계정 지우기</button>')
  );
  $("uCancel").onclick=closeSheet;
  $("uSave").onclick=function(){
    var v={ name:$("uName").value.trim(), role:$("uRole").value, active:$("uOn").value==="1" };
    if(!v.name) return toast("이름을 넣어주세요",true);
    api("hqUserSave",[phone,v]).then(function(){ return loadAll(); })
      .then(function(){ closeSheet(); toast("저장했어요"); render(); })
      .catch(function(e){ toast(e.message,true); });
  };
  $("uPwGo").onclick=function(){
    var pw = $("uPw").value.trim();          // 비우면 서버가 무작위 6자리를 만들어 줘요
    confirmBox("비밀번호 바꾸기", u.name+" 님의 비밀번호를 «"+pw+"» 로 바꿔요.", "바꾸기", false, function(){
      if(pw && pw.length < 6) return toast("비밀번호는 6자 이상으로 해주세요",true);
      api("hqUserPw",[phone,pw||null]).then(function(r){
        toast("비밀번호를 바꿨어요 — "+((r&&r.pw)||pw)+" (이 화면에서만 보여요)"); })
        .catch(function(e){ toast(e.message,true); });
    });
  };
  if($("uDel")) $("uDel").onclick=function(){
    confirmBox("계정 지우기", u.name+" 님의 로그인 계정을 지워요. 되돌릴 수 없어요.", "지우기", true, function(){
      api("hqUserDel",[phone]).then(function(){ return loadAll(); })
        .then(function(){ toast("지웠어요"); render(); })
        .catch(function(e){ toast(e.message,true); });
    });
  };
}

function payAddSheet(){
  var shopOpts = (D.shops||[]).filter(function(s){return s.shop!=="ADMIN";})
    .map(function(s){ return '<option value="'+esc(s.shop)+'" data-plan="'+esc(s.plan||"")+'">'+
      esc(s.name)+'</option>'; }).join("");
  var planOpts = (D.plans||[]).map(function(p){
    return '<option value="'+esc(p.code)+'" data-price="'+(p.price||0)+'">'+esc(p.name)+'</option>'; }).join("");
  var ym = new Date().toISOString().slice(0,7);
  openSheet('<h3>청구 만들기</h3><div class="sub">받을 금액을 한 건 적어 둬요.</div>'+
    '<label class="f">업체</label><select id="pShop">'+shopOpts+'</select>'+
    '<div class="row2">'+
      '<div><label class="f">요금제</label><select id="pPlan">'+planOpts+'</select></div>'+
      '<div><label class="f">기간</label><input type="text" id="pPeriod" value="'+ym+'" placeholder="2026-09"></div>'+
    '</div>'+
    '<label class="f">금액 (원)</label><input type="number" id="pAmt" value="0">'+
    '<label class="f">메모</label><input type="text" id="pMemo" placeholder="선택">'+
    '<div class="sheetbtns"><button class="btn" id="pNo">취소</button>'+
      '<button class="btn primary" id="pYes" style="flex:2">만들기</button></div>');
  function sync(){
    var sel=$("pPlan"), o=sel.options[sel.selectedIndex];
    if(o) $("pAmt").value = o.getAttribute("data-price")||0;
  }
  $("pPlan").onchange=sync;
  $("pShop").onchange=function(){
    var o=$("pShop").options[$("pShop").selectedIndex];
    var pc=o?o.getAttribute("data-plan"):"";
    if(pc){ for(var i=0;i<$("pPlan").options.length;i++){
      if($("pPlan").options[i].value===pc){ $("pPlan").selectedIndex=i; break; } } }
    sync();
  };
  sync();
  $("pNo").onclick=closeSheet;
  $("pYes").onclick=function(){
    api("hqPayAdd",[$("pShop").value,$("pPlan").value,Number($("pAmt").value)||0,
      $("pPeriod").value.trim(),$("pMemo").value.trim()])
      .then(function(){ return loadAll(); })
      .then(function(){ closeSheet(); toast("청구를 만들었어요"); render(); })
      .catch(function(e){ toast(e.message,true); });
  };

  var rows = [
    ["월 요금", function(p){ return '<b>'+won(p.price||0)+'</b>'; }],
    ["계정 수 (휴대폰)", function(p){ return lim(p.seats); }],
    ["PC 대수", function(p){ return lim(p.pc_max); }],
    ["직원도 PC", function(p){ return p.staff_pc
        ? '<span class="yes">가능</span>' : '<span class="no">휴대폰만</span>'; }],
    ["문자 무료 (달마다)", function(p){ return Number(p.sms_free||0)?cnt(p.sms_free):'<span class="no">없음</span>'; }],
    ["계산서 무료 (달마다)", function(p){ return Number(p.tax_free||0)?cnt(p.tax_free):'<span class="no">못 씀</span>'; }],
    ["가입 화면", function(p){ return p.active
        ? '<span class="yes">보임</span>' : '<span class="no">숨김</span>'; }]
  ];
  var h = '<div class="tablebox cmpWrap"><table class="cmp"><thead><tr><th class="c-name" style="left:0">항목</th>'+

      ps.map(function(p){ return '<td>'+r[1](p)+'</td>'; }).join("")+'</tr>';

  return h;
}

function secPill(lv){ return lv===2?"위험":(lv===1?"주의":"좋음"); }

/* ========== 운영 상태 (용량 · 고정비) ========== */
var OPS = {};

function gbTxt(b){
  b = Number(b)||0;
  if(b < 1024) return b+" B";
  if(b < 1024*1024) return (b/1024).toFixed(1)+" KB";
  if(b < 1024*1024*1024) return (b/1024/1024).toFixed(1)+" MB";
  return (b/1024/1024/1024).toFixed(2)+" GB";
}

function viewOps(){
  var h = '<div class="dashhead"><h2>운영 상태</h2>'+
    '<div class="sub2">자료와 사진이 얼마나 쌓였는지, 다달이 나가는 금액이 얼마인지 한 번에 봐요. '+
    '「지금 다시 확인」을 누르면 서버에 직접 물어봐요.</div></div>'+
    '<div class="tools"><button class="btn primary" id="opsGo">지금 다시 확인</button>'+
      '<button class="btn sm" id="opsSvc">유지비 화면으로</button>'+
      '<span class="sp"></span><span class="cnt" id="opsAt">'+
      (OPS.at?("마지막 확인 "+dtTime(OPS.at)):"아직 확인하지 않았어요")+'</span></div>'+
    '<div id="opsBody"></div>';
  $("main").innerHTML = h;
  $("opsGo").onclick = opsLoad;
  $("opsSvc").onclick = function(){ TAB="svc"; window.scrollTo(0,0); render(); };
  opsDraw();
  if(!OPS.loaded) opsLoad();
}

function opsLoad(){
  if(OPS.busy) return;
  OPS.busy = true;
  var b=$("opsGo"); if(b){ b.disabled=true; b.textContent="확인하는 중…"; }
  api("hqOps",[]).then(function(r){
    OPS.loaded = true;
    OPS.usage    = (r&&r.usage)||null;
    OPS.usageErr = (r&&r.usageErr)||"";
    OPS.names    = (r&&r.names)||{};
    OPS.limits   = (r&&r.limits)||{dbGb:8,fileGb:100,warnPct:80};
    OPS.grow     = (r&&r.grow)||null;
    OPS.services = (r&&r.services)||[];
    OPS.monthCost= Number((r&&r.monthCost)||0);
    OPS.due      = (r&&r.due)||[];
    OPS.low      = (r&&r.low)||[];
    OPS.at       = (r&&r.at)||new Date().toISOString();
  },function(e){
    OPS.loaded = true; OPS.err = e.message||"확인하지 못했습니다";
    toast(OPS.err,true);
  }).then(function(){
    OPS.busy=false;
    var b2=$("opsGo"); if(b2){ b2.disabled=false; b2.textContent="지금 다시 확인"; }
    var at=$("opsAt"); if(at) at.textContent = OPS.at?("마지막 확인 "+dtTime(OPS.at)):"확인하지 못했습니다";
    opsDraw();
  });
}

function opsGauge(name, used, capGb, warnPct, sub){
  var cap = capGb*1024*1024*1024;
  var pct = cap>0 ? Math.min(100, used/cap*100) : 0;
  var cls = pct>=95 ? " d" : (pct>=warnPct ? " w" : "");
  return '<div class="gauge"><div class="gh"><span class="gn">'+esc(name)+'</span>'+
    '<span class="gv">'+gbTxt(used)+' / '+capGb+' GB · '+pct.toFixed(1)+'%</span></div>'+
    '<div class="prog'+cls+'"><i style="width:'+Math.max(1,pct).toFixed(1)+'%"></i></div>'+
    (sub?('<div class="gs">'+sub+'</div>'):'')+'</div>';
}

function opsDraw(){
  var host=$("opsBody"); if(!host) return;
  if(!OPS.loaded){
    host.innerHTML = '<div class="hint">불러오는 중이에요…</div>';
    return;
  }

      opsGauge("차량 사진", u.file_bytes, L.fileGb, L.warnPct,

  var h='<div class="dashhead"><h2>충전 — 캐시 지갑</h2>'+

    '문자 종류마다 금액이 달라도 그대로 반영돼요.</div></div>'+
    '<div class="tools"><button class="btn primary sm" id="cashGo">다시 불러오기</button>'+
      '<span class="sp"></span><span class="cnt" id="cashAt"></span></div>'+
    '<div id="cashBody"><div class="hint">불러오는 중이에요…</div></div>';
  $("main").innerHTML=h;
  $("cashGo").onclick=cashLoad;

function cashLoad(){
  if(CASH.busy) return; CASH.busy=true;
  var b=$("cashGo"); if(b){ b.disabled=true; b.textContent="불러오는 중…"; }
  api("hqCash",[]).then(function(r){
    CASH.loaded=true; CASH.err="";
    CASH.on=!!(r&&r.on); CASH.note=(r&&r.note)||""; CASH.bank=(r&&r.bank)||"";
    CASH.price=(r&&r.price)||{}; CASH.wallets=(r&&r.wallets)||[]; CASH.logs=(r&&r.logs)||[];
    CASH.at=new Date().toISOString();
  },function(e){ CASH.loaded=true; CASH.err=e.message||"불러오지 못했습니다"; })
  .then(function(){
    CASH.busy=false;
    var b2=$("cashGo"); if(b2){ b2.disabled=false; b2.textContent="다시 불러오기"; }
    var at=$("cashAt"); if(at) at.textContent = CASH.at?("마지막 확인 "+dtTime(CASH.at)):"";
    cashDraw();
  });
}

function cgSend(minus){

      d=Number($("cgDays").value)||365, memo=$("cgMemo").value.trim();

var CALM=null, TODO={list:null};

function calEvents(){
  var ev=[];
  (D.svcs||[]).filter(function(v){ return v.active!==false && v.next_due; }).forEach(function(v){
    ev.push({d:String(v.next_due).slice(0,10),
      t:v.name+(Number(v.cost||0)?(" "+won(v.cost)):"")+" 결제", c:"w", go:"svc", cost:Number(v.cost||0)});
  });
  (D.shops||[]).forEach(function(x){
    if(x.shop==="ADMIN") return;
    var isT=!x.plan||x.plan==="trial";
    if(isT && x.trial_until) ev.push({d:String(x.trial_until).slice(0,10), t:(x.name||x.shop)+" 체험 끝", c:"d", go:"shops"});
    else if(x.paid_until)    ev.push({d:String(x.paid_until).slice(0,10), t:(x.name||x.shop)+" 이용기한", c:"", go:"shops"});
  });
  ((TODO.list)||[]).filter(function(t){ return t.due_at && !t.done; }).forEach(function(t){
    ev.push({d:String(t.due_at).slice(0,10), t:t.title, c:"g", go:"sum"});
  });
  return ev;
}
function calHtml(){
  var now=new Date();
  if(!CALM) CALM=new Date(now.getFullYear(), now.getMonth(), 1);
  var y=CALM.getFullYear(), m=CALM.getMonth();
  var first=new Date(y,m,1), last=new Date(y,m+1,0), start=new Date(y,m,1-first.getDay());
  function ds(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  var todayS=ds(now), byDay={};
  calEvents().forEach(function(e){ (byDay[e.d]||(byDay[e.d]=[])).push(e); });

  var h='<div class="cal"><div class="calHd">'+
    '<h3>'+y+'년 '+(m+1)+'월 일정</h3>'+
    '<span style="display:inline-flex;gap:6px">'+
      '<button class="btn sm" id="calPrev">‹ 지난달</button>'+
      '<button class="btn sm" id="calNow">이번 달</button>'+
      '<button class="btn sm" id="calNext">다음달 ›</button></span>'+
    '<span class="sp"></span><span class="cnt">결제일 · 이용기한 · 체험 끝나는 날</span></div>'+
    '<div class="calGrid">'+["일","월","화","수","목","금","토"].map(function(d){
      return '<div class="dow">'+d+'</div>'; }).join("");
  var cur=new Date(start), guard=0;
  while(guard++<42){
    var k=ds(cur), cls="calCell";
    if(cur.getMonth()!==m) cls+=" out";
    if(k===todayS) cls+=" today";
    if(cur.getDay()===0) cls+=" sun";
    if(cur.getDay()===6) cls+=" sat";
    var list=byDay[k]||[];
    h+='<div class="'+cls+'"><span class="d">'+cur.getDate()+'</span>'+
      list.slice(0,3).map(function(e){
        return '<span class="calEv '+e.c+'" data-go="'+esc(e.go)+'" title="'+esc(e.t)+'">'+esc(e.t)+'</span>'; }).join("")+
      (list.length>3?'<span class="calEv x">외 '+(list.length-3)+'건</span>':'')+'</div>';
    cur.setDate(cur.getDate()+1);
    if(cur>last && cur.getDay()===0) break;
  }
  h+='</div><div class="calLg">'+
    '<span><i style="background:var(--warn)"></i>유지비 결제일</span>'+
    '<span><i style="background:var(--blue)"></i>업체 이용기한</span>'+
    '<span><i style="background:var(--danger)"></i>체험 끝나는 날</span>'+
    '<span><i style="background:var(--ok)"></i>할 일</span></div></div>';
  return h;
}
function calBind(){
  function mv(n){ CALM=new Date(CALM.getFullYear(), CALM.getMonth()+n, 1); render(); }
  if($("calPrev")) $("calPrev").onclick=function(){mv(-1);};
  if($("calNext")) $("calNext").onclick=function(){mv(1);};
  if($("calNow"))  $("calNow").onclick =function(){CALM=null; render();};
}

function todoBind(){

function pgLoad(){

    PG.loaded=true; PG.err="";
    PG.on=!!(r&&r.on); PG.provider=(r&&r.provider)||"toss";
    PG.clientKey=(r&&r.clientKey)||""; PG.fee=Number((r&&r.fee)||0);
    PG.note=(r&&r.note)||""; PG.hasSecret=!!(r&&r.hasSecret);
    PG.orders=(r&&r.orders)||[]; PG.names=(r&&r.names)||{};
    PG.at=new Date().toISOString();
  },function(e){ PG.loaded=true; PG.err=e.message||"불러오지 못했습니다"; })
  .then(function(){ PG.busy=false;
    var at=$("pgAt"); if(at) at.textContent=PG.at?("마지막 확인 "+dtTime(PG.at)):"";
    pgDraw(); });
}

function dtTime(iso){
  if(!iso) return "-";
  var d=new Date(iso);
  return (d.getMonth()+1)+"월 "+d.getDate()+"일 "+
    String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}

function secLoad(){
  if(SEC.busy) return;
  SEC.busy = true;
  var b=$("secGo"); if(b){ b.disabled=true; b.textContent="확인하는 중…"; }
  api("hqSecurity",[]).then(function(r){
    SEC.checks = (r&&r.checks)||[];
    SEC.state  = (r&&r.state)||{};
    SEC.at     = (r&&r.at)||new Date().toISOString();
    SEC.ver    = (r&&r.ver)||"";
  },function(e){
    SEC.checks = null;
    toast(e.message||"확인하지 못했습니다",true);
  }).then(function(){
    SEC.busy=false;
    var b2=$("secGo"); if(b2){ b2.disabled=false; b2.textContent="지금 다시 확인"; }
    var at=$("secAt"); if(at) at.textContent = SEC.at?("마지막 확인 "+dtTime(SEC.at)):"확인하지 못했습니다";
    secDraw();
  });
}

function secDraw(){
  var host=$("secBody"); if(!host) return;
  var c = SEC.checks;
  var h = "";

  if(!c){
    h += '<div class="hint">아직 확인 전이에요. 위의 「지금 다시 확인」을 눌러 주세요.<br>'+
         '「보안 점검 기록」 같은 말이 나오면 보안점검 SQL 을 아직 안 돌리신 거예요.</div>';
  }else{
    var bad=c.filter(function(x){return x.lv===2;}).length;
    var warn=c.filter(function(x){return x.lv===1;}).length;
    var ok=c.filter(function(x){return x.lv===0;}).length;
    h += '<div class="secTop">'+
      '<div class="kbox'+(bad?' warn':'')+'"><span class="t">지금 위험</span>'+
        '<span class="v" style="display:block;color:'+(bad?'var(--danger)':'var(--text)')+'">'+bad+'건</span>'+
        '<span class="s" style="display:block">'+(bad?'바로 손보셔야 해요':'없어요')+'</span></div>'+
      '<div class="kbox'+(warn?' warn':'')+'"><span class="t">한 번 봐주실 것</span>'+
        '<span class="v" style="display:block;color:'+(warn?'var(--warn)':'var(--text)')+'">'+warn+'건</span>'+
        '<span class="s" style="display:block">'+(warn?'급하지는 않아요':'없어요')+'</span></div>'+
      '<div class="kbox"><span class="t">잘 되어 있는 것</span>'+
        '<span class="v" style="display:block;color:var(--good)">'+ok+'건</span>'+
        '<span class="s" style="display:block">서버 '+esc(SEC.ver||"")+'</span></div>'+
    '</div>';

    var groups=[];
    c.forEach(function(x){ if(groups.indexOf(x.group)<0) groups.push(x.group); });
    groups.forEach(function(g){
      h += '<div class="card"><div class="secGrp">'+esc(g)+'</div>';
      c.filter(function(x){return x.group===g;})
       .sort(function(a,b){ return b.lv-a.lv; })
       .forEach(function(x){
         h += '<div class="secRow lv'+x.lv+'"><span class="dot"></span><div class="bd">'+
              '<div class="nm">'+esc(x.name)+'</div>'+
              '<div class="tx">'+esc(x.txt)+'</div>'+
              (x.how?'<div class="how">→ '+esc(x.how)+'</div>':'')+
              '</div><span class="pill '+(x.lv===2?'off':(x.lv===1?'wait':'ok'))+'">'+
              secPill(x.lv)+'</span></div>';
       });
      h += '</div>';
    });
  }

  /* 손으로 확인하는 목록 */
  var st = SEC.state||{};
  var doneN = SEC_MANUAL.filter(function(m){return st[m[0]];}).length;
  h += '<div class="card"><div class="todoHd">'+
       '<span class="'+(doneN===SEC_MANUAL.length?"dotOk":"dotWarn")+'"></span>'+
       '<h2>손으로 확인하는 것 ('+doneN+' / '+SEC_MANUAL.length+')</h2></div>'+
       '<p class="lead" style="margin:2px 0 12px">직접 눌러 봐야 아는 것들이에요. '+
       '확인하신 것은 네모를 눌러 표시해 두세요 — 누가 언제 확인했는지 같이 남아요.</p>';
  SEC_MANUAL.forEach(function(m){
    var d = st[m[0]];
    h += '<label class="secChk'+(d?' on':'')+'" data-m="'+esc(m[0])+'">'+
         '<input type="checkbox"'+(d?' checked':'')+'>'+
         '<span class="bd"><span class="nm">'+esc(m[1])+'</span>'+
         '<div class="tx">'+esc(m[2])+'</div>'+
         (d?'<div class="dn">✔ '+dtTime(d.at)+' 확인'+(d.who?(" · "+esc(phoneFmt(d.who))):"")+'</div>':'')+
         '</span></label>';
  });
  h += '</div>';

  host.innerHTML = h;
  Array.prototype.forEach.call(host.querySelectorAll("label.secChk"),function(el){
    var box = el.querySelector("input");
    box.onchange = function(){
      var k = el.getAttribute("data-m"), on = box.checked;
      box.disabled = true;
      api("hqSecSave",[k,on]).then(function(r){
        SEC.state = (r&&r.state)||SEC.state;
        secDraw();
      },function(e){
        box.checked = !on; box.disabled = false;
        toast(e.message||"저장하지 못했습니다",true);
      });
    };
  });
}

      {k:"next_due", label:"다음 결제일", w:110, html:function(r){

      {k:"_st", label:"상태", w:150, nosort:true, html:function(r){

      {k:"active", label:"사용", w:80, html:function(r){

function svcRefresh(){
  toast("연결된 곳에 물어보는 중…");
  api("hqSvcRefresh",[]).then(function(r){
    return loadAll().then(function(){
      var ok=(r&&r.done)||[], bad=(r&&r.failed)||[];
      render();
      if(bad.length) openSheet('<h3>상태를 새로 받았어요</h3>'+
        '<div class="sub">'+ok.length+'곳 성공 · '+bad.length+'곳 실패</div>'+
        (ok.length?('<label class="f">잘 읽은 곳</label><div class="hint">'+
          ok.map(function(x){return esc(x);}).join("<br>")+'</div>'):'')+
        '<label class="f">못 읽은 곳</label><div class="hint" style="color:var(--warn)">'+
          bad.map(function(x){return esc(x);}).join("<br>")+'</div>'+
        '<div class="hint" style="margin-top:10px">열쇠를 넣어 달라는 말이 보이면, 수파베이스 Edge Functions → Secrets 에 그 이름으로 넣어 주세요. 넣기 전까지는 그 줄만 직접 적으시면 돼요.</div>'+
        '<div class="sheetbtns"><button class="btn primary" id="rOk" style="flex:1">닫기</button></div>');
      else toast(ok.length+"곳 상태를 새로 받았어요");
      if($("rOk")) $("rOk").onclick=closeSheet;
    });
  }).catch(function(e){ toast(e.message,true); });
}

function svcSheet(code){

  var v = isNew ? {kind:"charge",warn_days:14,active:true}
                : (D.svcs||[]).filter(function(x){return x.code===code;})[0];
  if(!v) return;
  function kOpt(k,t){ return '<option value="'+k+'"'+(v.kind===k?" selected":"")+'>'+t+'</option>'; }
  openSheet(
    '<h3>'+(isNew?"서비스 넣기":esc(v.name))+'</h3>'+
    '<div class="sub">'+(isNew?"요금을 내야 하는 곳을 하나 더 넣어요":("코드 "+esc(v.code)))+'</div>'+
    (isNew?'<label class="f">영문 코드 (예: naver)</label><input type="text" id="vCode" placeholder="naver">':'')+
    '<label class="f">이름</label><input type="text" id="vName" value="'+esc(v.name||"")+'">'+
    '<label class="f">무엇에 쓰는지</label><input type="text" id="vWhat" value="'+esc(v.what||"")+'">'+
    '<label class="f">충전·결제하러 가는 주소</label><input type="text" id="vUrl" value="'+esc(v.url||"")+'" placeholder="https://...">'+
    '<div class="row2">'+
      '<div><label class="f">결제 방식</label><select id="vKind">'+
        kOpt("charge","충전식 — 미리 넣어두고 써요")+kOpt("sub","매달 결제 — 카드에서 빠져요")+
        kOpt("renew","연장 — 기한이 오면 다시 내요")+'</select></div>'+
      '<div><label class="f">다음 결제일 · 만료일</label><input type="date" id="vDue" value="'+
        esc(v.next_due||"")+'"></div>'+
    '</div>'+
    '<div class="row2">'+
      '<div><label class="f">지금 남은 금액 (원)</label><input type="number" id="vBal" value="'+(v.balance||0)+'"></div>'+
      '<div><label class="f">한 번에 나가는 금액 (원)</label><input type="number" id="vCost" value="'+(v.cost||0)+'"></div>'+
    '</div>'+
    '<div class="row2">'+
      '<div><label class="f">이 금액 밑이면 알림 (원)</label><input type="number" id="vMin" value="'+(v.min_bal||0)+'"></div>'+
      '<div><label class="f">기한 며칠 전부터 알림</label><input type="number" id="vWarn" value="'+(v.warn_days||14)+'"></div>'+
    '</div>'+
    '<div class="row2">'+
      '<div><label class="f">자동으로 읽기</label><select id="vAuto">'+
        '<option value="1"'+(v.auto?" selected":"")+'>켬 — 서버가 직접 물어봐요</option>'+
        '<option value="0"'+(!v.auto?" selected":"")+'>끔 — 내가 직접 적어요</option></select></div>'+
      '<div><label class="f">읽은 값 (도메인일 때만)</label><input type="text" id="vRef" value="'+esc(v.ref||"")+'" placeholder="cgg.co.kr"></div>'+
    '</div>'+
    (v.auto_note?('<div class="hint">마지막으로 읽은 것 — '+esc(v.auto_note)+' ('+esc(ago(v.auto_at))+')</div>'):'')+
    (v.auto_err?('<div class="hint" style="color:var(--warn)">못 읽음 — '+esc(v.auto_err)+'</div>'):'')+
    '<div class="hint">자동이 안 되는 곳은 그 회사 화면에서 보고 「남은 금액」·「다음 결제일」을 적어주세요.</div>'+
    '<label class="f">사용</label><select id="vOn">'+
      '<option value="1"'+(v.active!==false?" selected":"")+'>써요</option>'+
      '<option value="0"'+(v.active===false?" selected":"")+'>안 써요 (화면에서 숨김)</option></select>'+
    '<label class="f">메모</label><textarea id="vMemo" rows="2">'+esc(v.memo||"")+'</textarea>'+
    '<div class="sheetbtns"><button class="btn" id="vCancel">취소</button>'+
      '<button class="btn primary" id="vSave" style="flex:2">저장</button></div>'+
    (isNew?'':'<button class="btn danger" id="vDel" style="width:100%;margin-top:18px">이 서비스 지우기</button>')
  );
  $("vCancel").onclick = closeSheet;
  $("vSave").onclick = function(){
    var o = { name:$("vName").value.trim(), what:$("vWhat").value.trim(), url:$("vUrl").value.trim(),
      kind:$("vKind").value, nextDue:$("vDue").value, balance:Number($("vBal").value)||0,
      cost:Number($("vCost").value)||0, minBal:Number($("vMin").value)||0,
      warnDays:Number($("vWarn").value)||0, memo:$("vMemo").value.trim(),
      ref:$("vRef").value.trim(), auto:$("vAuto").value==="1", active:$("vOn").value==="1" };
    if(!o.name) return toast("이름을 넣어주세요",true);
    var p;
    if(isNew){ o.code=$("vCode").value.trim(); p=api("hqSvcAdd",[o]); }
    else p=api("hqSvcSave",[code,o]);
    p.then(function(){ return loadAll(); })
     .then(function(){ closeSheet(); toast("저장했어요"); render(); })
     .catch(function(e){ toast(e.message,true); });
  };
  if($("vDel")) $("vDel").onclick = function(){
    confirmBox("서비스 지우기", v.name+" 를 목록에서 빼요. 지출 기록은 그대로 남아요.","지우기",true,function(){
      api("hqSvcDel",[code]).then(function(){ return loadAll(); })
        .then(function(){ closeSheet(); toast("지웠어요"); render(); })
        .catch(function(e){ toast(e.message,true); });
    });
  };
}

var SETTLE_YEAR = String(new Date().getFullYear());
function viewSettle(){
  $("main").innerHTML = '<div class="dashhead"><h2>정산</h2>'+
    '<div class="sub2">달마다 업체에서 받은 금액과 유지비로 나간 금액을 견줘요.</div></div>'+
    '<div class="card"><div class="empty">불러오는 중…</div></div>';
  api("hqSettle",[SETTLE_YEAR]).then(function(r){
    var ms = (r&&r.months)||[], inc=(r&&r.income)||0, exp=(r&&r.expense)||0, prof=inc-exp;
    var yNow = new Date().getFullYear(), yOpt="";
    for(var y=yNow; y>=yNow-4; y--) yOpt += '<option value="'+y+'"'+(String(y)===SETTLE_YEAR?" selected":"")+'>'+y+'년</option>';

    var h = '<div class="dashhead"><h2>정산</h2>'+
    '<div class="sub2">달마다 업체에서 받은 금액과 유지비로 나간 금액을 견줘요.</div></div>'+
      '<div class="tools"><select id="stYear" style="max-width:130px">'+yOpt+'</select>'+
        '<button class="btn primary" id="exAdd">＋ 지출 적기</button>'+
        '<span class="cnt">솔라피 충전·가비아 연장처럼 나간 금액을 여기에 적어두면 아래 표에 바로 반영돼요</span></div>'+
      '<div class="dash"><div class="dRow money">'+
        '<button class="kbox hl" data-none><span class="t">'+SETTLE_YEAR+'년 들어온 금액</span>'+
          '<span class="v" style="display:block">'+esc(won(inc))+'</span>'+
          '<span class="s" style="display:block">업체에서 받은 금액</span></button>'+
        '<button class="kbox" data-none><span class="t">'+SETTLE_YEAR+'년 나간 금액</span>'+
          '<span class="v" style="display:block">'+esc(won(exp))+'</span>'+
          '<span class="s" style="display:block">유지비로 나간 금액</span></button>'+
        '<button class="kbox '+(prof<0?"warn":"")+'" data-none><span class="t">'+SETTLE_YEAR+'년 남은 것</span>'+
          '<span class="v" style="display:block">'+esc(won(prof))+'</span>'+
          '<span class="s" style="display:block">'+(prof<0?"적자예요":"들어온 금액 − 나간 금액")+'</span></button>'+
      '</div></div>';

    h += '<div class="card"><h2>달마다 보기</h2>';
    if(!ms.length) h += '<div class="empty">'+SETTLE_YEAR+'년에는 아직 기록이 없어요.</div>';
    else {
      h += '<div style="overflow:auto"><table class="stl"><thead><tr>'+
        '<th>달</th><th>들어온 금액</th><th>건수</th><th>나간 금액</th><th>남은 것</th></tr></thead><tbody>';
      ms.forEach(function(m){
        h += '<tr><td><b>'+esc(m.ym)+'</b></td><td>'+esc(won(m.income))+'</td>'+
          '<td>'+(m.cnt||0)+'건</td><td>'+esc(won(m.expense))+'</td>'+
          '<td'+(m.profit<0?' class="minus"':'')+'>'+esc(won(m.profit))+'</td></tr>';
      });
      h += '</tbody><tfoot><tr><td>합계</td><td>'+esc(won(inc))+'</td><td>-</td>'+
        '<td>'+esc(won(exp))+'</td><td'+(prof<0?' class="minus"':'')+'>'+esc(won(prof))+'</td>'+
        '</tr></tfoot></table></div>';
    }
    h += '</div>';

    h += '<div class="card"><h2>지출 적은 것</h2>'+
      '<p class="lead" style="margin:2px 0 10px">줄 끝의 지우기를 누르면 그 기록만 지워져요.</p><div id="tExp"></div></div>';
    $("main").innerHTML = h;

    $("stYear").onchange = function(){ SETTLE_YEAR=this.value; viewSettle(); };
    $("exAdd").onclick = function(){ expSheet(); };
    makeTable({
      id:"tExp", rows:(D.exps||[]), search:["name","memo","period"], sortKey:"paid_at", sortDir:"desc",
      rowId:function(r){ return String(r.id); },
      cols:[
        {k:"paid_at", label:"낸 날", w:110, stick:true},
        {k:"name", label:"무엇에", w:200, html:function(r){ return '<b>'+esc(r.name)+'</b>'; }},
        {k:"svc", label:"서비스", w:130, html:function(r){
          var v=(D.svcs||[]).filter(function(x){return x.code===r.svc;})[0];
          return esc(v?v.name:(r.svc||"-")); }},
        {k:"amount", label:"금액", w:110, num:true, html:function(r){ return esc(won(r.amount)); }},
        {k:"period", label:"어느 달치", w:100},
        {k:"memo", label:"메모", w:180},
        {k:"_d", label:"", w:80, nosort:true, html:function(r){
          return '<button class="btn sm danger" data-ex="'+r.id+'">지우기</button>'; }}
      ]
    });
    Array.prototype.forEach.call($("main").querySelectorAll("button[data-ex]"), function(b){
      b.onclick = function(ev){
        ev.stopPropagation();
        api("hqExpenseDel",[b.getAttribute("data-ex")]).then(function(){ return loadAll(); })
          .then(function(){ toast("지웠어요"); viewSettle(); })
          .catch(function(e){ toast(e.message,true); });
      };
    });
  }).catch(function(e){
    $("main").innerHTML = '<div class="dashhead"><h2>정산</h2></div><div class="card"><div class="empty">'+esc(e.message)+'</div></div>';
  });
}

function expSheet(){
  var today = new Date().toISOString().slice(0,10);
  var opts = '<option value="">(고르지 않음)</option>' + (D.svcs||[]).map(function(v){
    return '<option value="'+esc(v.code)+'">'+esc(v.name)+'</option>'; }).join("");
  openSheet(
    '<h3>지출 적기</h3><div class="sub">유지비로 실제로 낸 금액을 적어요</div>'+
    '<label class="f">어느 서비스</label><select id="eSvc">'+opts+'</select>'+
    '<label class="f">무엇에 나간 금액인지</label><input type="text" id="eName" placeholder="예: 솔라피 문자 충전">'+
    '<div class="row2">'+
      '<div><label class="f">금액 (원)</label><input type="number" id="eAmt" placeholder="100000"></div>'+
      '<div><label class="f">낸 날</label><input type="date" id="eDate" value="'+today+'"></div>'+
    '</div>'+
    '<label class="f">어느 달치</label><input type="text" id="ePer" value="'+today.slice(0,7)+'" placeholder="2026-09">'+
    '<label class="f">충전식이면 남은 금액도 그만큼 올릴까요?</label>'+
    '<select id="eAdd"><option value="1">네, 올려주세요</option><option value="0">아니요</option></select>'+
    '<div class="hint" id="eAddHint"></div>'+
    '<label class="f">메모</label><textarea id="eMemo" rows="2"></textarea>'+
    '<div class="sheetbtns"><button class="btn" id="eCancel">취소</button>'+
      '<button class="btn primary" id="eSave" style="flex:2">적기</button></div>'
  );
  function eSync(){
    var code=$("eSvc").value;
    var v=(D.svcs||[]).filter(function(x){return x.code===code;})[0];
    if(v && !$("eName").value.trim()) $("eName").value = v.name;
    if(v && v.cost && !$("eAmt").value) $("eAmt").value = v.cost;
    var auto = !!(v && v.auto);
    $("eAdd").value = auto ? "0" : "1";
    $("eAdd").disabled = auto;
    $("eAddHint").innerHTML = auto
      ? '이 곳은 <b>자동으로 읽는 곳</b>이라 남은 금액은 건드리지 않아요. 실제 잔액은 「연결된 곳 상태 새로 받기」로 맞춰져요.'
      : '직접 적는 곳이라, 충전한 만큼 남은 금액을 올려둘 수 있어요.';
  }
  $("eSvc").onchange = eSync;
  eSync();
  $("eCancel").onclick = closeSheet;
  $("eSave").onclick = function(){
    var o = { svc:$("eSvc").value, name:$("eName").value.trim(), amount:Number($("eAmt").value)||0,
      paidAt:$("eDate").value, period:$("ePer").value.trim(), memo:$("eMemo").value.trim(),
      addBalance:$("eAdd").value==="1" };
    if(!o.name) return toast("무엇에 나간 금액인지 적어주세요",true);
    if(!o.amount) return toast("금액을 적어주세요",true);
    api("hqExpenseAdd",[o]).then(function(r){
      return loadAll().then(function(){ return r; });
    }).then(function(r){
      closeSheet();
      toast((r&&r.note) ? r.note : "적었어요");
      viewSettle();
    }).catch(function(e){ toast(e.message,true); });
  };
}

var TAXLOG={ rows:null, busy:false };

  var box=document.getElementById("tLog"); if(!box) return;
  if(TAXLOG.rows && !force){ taxLogDraw(); return; }
  if(TAXLOG.busy) return;
  TAXLOG.busy=true;
  api("hqTaxLog",[]).then(function(r){
    TAXLOG.rows=(r&&r.logs)||[];
    if(r&&r.warn) toast("기록을 읽다가 막혔습니다: "+r.warn,true);
  }).catch(function(e){
    TAXLOG.rows=[];
    var b=document.getElementById("tLog");
    if(b) b.innerHTML='<div class="hint" style="color:var(--danger)">'+esc(e.message||"불러오지 못했습니다")+'</div>';
  }).then(function(){ TAXLOG.busy=false; if(TAXLOG.rows) taxLogDraw(); });

    filters:[
      {k:"ok", label:"결과", get:function(r){ return r.ok?"ok":"no"; },
       opts:[["","결과 전체"],["ok","잘 됨"],["no","안 됨"]]},
      {k:"mode", label:"방식", get:function(r){ return r.mode||""; },
       opts:[["","방식 전체"],["시험","시험 발행"],["실제","실제 발행"]]}
    ],

      {k:"to_name", label:"받는 업체", w:140, stick:true, html:function(r){

      {k:"to_corp", label:"사업자번호", w:125, mono:true, html:function(r){
        return r.to_corp?esc(bizFmt(r.to_corp)):"-"; }},
      {k:"total", label:"금액", w:110, num:true, sortVal:function(r){ return Number(r.total)||0; },

function bizFmt(v){
  var d=String(v||"").replace(/[^0-9]/g,"");
  return d.length===10 ? d.slice(0,3)+"-"+d.slice(3,5)+"-"+d.slice(5) : (v||"");
}

function taxSend(sh,code,v,force){
  toast(force?"그대로 다시 보내는 중이에요…":"팝빌로 보내는 중이에요…");
  var body=Object.assign({},v); if(force) body.force=true;
  api("hqTaxIssue",[code,body])
    .then(function(r){
      if(r && r.dup && !force){ closeSheet(); taxDupSheet(sh,code,v,r); return; }
      closeSheet(); taxLogLoad(true); taxDoneSheet(sh,r,"");
    })
    .catch(function(e){ closeSheet(); taxLogLoad(true); taxDoneSheet(sh,null,e.message||"알 수 없는 오류"); });
}

function taxSheet(code){

  if(!sh) return;
  var pl = (D.plans||[]).filter(function(p){return p.code===sh.plan;})[0];
  var price = pl ? (pl.price||0) : 0;
  var lastM = new Date(); lastM.setDate(1);
  var per = lastM.toISOString().slice(0,7);
  openSheet(
    '<h3>'+esc(sh.name)+' 세금계산서</h3><div class="sub">업체 코드 '+esc(sh.shop)+'</div>'+
    '<div class="card" style="margin:0 0 16px;padding:14px 16px">'+
      '<b style="font-size:14px">받는 쪽 정보</b>'+
      '<div class="hint" style="margin-top:6px">비어 있으면 아래에서 채운 뒤 저장하세요. 업체 화면에서 고친 것과 같은 자리예요.</div>'+
      '<div class="row2" style="margin-top:10px">'+
        '<div><label class="f">사업자등록번호 (10자리)</label><input type="text" id="tNo" value="'+esc(sh.biz_no||"")+'"></div>'+
        '<div><label class="f">대표자</label><input type="text" id="tCeo" value="'+esc(sh.ceo||"")+'"></div>'+
      '</div>'+
      '<label class="f">사업장 주소</label><input type="text" id="tAddr" value="'+esc(sh.addr||"")+'">'+
      '<div class="row2">'+
        '<div><label class="f">업태</label><input type="text" id="tUpte" value="'+esc(sh.upte||"")+'"></div>'+
        '<div><label class="f">종목</label><input type="text" id="tJong" value="'+esc(sh.jongmok||"")+'"></div>'+
      '</div>'+
      '<div class="row2">'+
        '<div><label class="f">계산서 받을 메일</label><input type="text" id="tEmail" value="'+esc(sh.tax_email||"")+'"></div>'+
        '<div><label class="f">담당자 연락처</label><input type="text" id="tPhone" value="'+esc(sh.tax_phone||sh.owner_phone||"")+'"></div>'+
      '</div>'+
      '<button class="btn" id="tInfoSave" style="width:100%;margin-top:12px">받는 쪽 정보만 저장</button>'+
    '</div>'+
    '<div class="row2">'+
      '<div><label class="f">공급가액 (부가세 별도, 원)</label><input type="number" id="tAmt" value="'+price+'"></div>'+
      '<div><label class="f">어느 달치</label><input type="text" id="tPer" value="'+per+'"></div>'+
    '</div>'+
    '<label class="f">품목 이름</label><input type="text" id="tItem" value="차곳간 이용료 '+esc(per)+'">'+
    '<div class="hint" id="tSum"></div>'+
    '<label class="f">메모</label><input type="text" id="tMemo" value="">'+
    '<div class="sheetbtns"><button class="btn" id="tCancel">닫기</button>'+
      '<button class="btn primary" id="tGo" style="flex:2">계산서 보내기</button></div>'
  );
  function sum(){
    var a=Number($("tAmt").value)||0, v=Math.round(a/10);
    $("tSum").innerHTML = '공급가액 '+esc(won(a))+' + 부가세 '+esc(won(v))+' = <b>합계 '+esc(won(a+v))+'</b>'+
      ((D.hq&&D.hq.pb_test===false)?' · <span style="color:var(--danger)">실제 발행</span>':' · 시험 발행');
  }
  sum(); $("tAmt").oninput = sum;
  $("tCancel").onclick = closeSheet;
  $("tInfoSave").onclick = function(){
    api("hqShopSave",[code,{ bizNo:$("tNo").value, ceo:$("tCeo").value.trim(), addr:$("tAddr").value.trim(),
      upte:$("tUpte").value.trim(), jongmok:$("tJong").value.trim(),
      taxEmail:$("tEmail").value.trim(), taxPhone:$("tPhone").value }])
      .then(function(){ return loadAll(); })
      .then(function(){ toast("받는 쪽 정보를 저장했어요"); })
      .catch(function(e){ toast(e.message,true); });
  };
  $("tGo").onclick = function(){

    var per=$("tPer").value.trim(), item=$("tItem").value.trim(), memo=$("tMemo").value.trim();
    var real = D.hq && D.hq.pb_test===false;
    /* 이 달에 이미 보낸 게 있으면 알려 줘요 (겹쳐 보내는 사고 막기) */
    var per6=per.replace(/[^0-9]/g,"").slice(0,6);
    var head="CGG"+code+"-"+per6;
    var dup=(TAXLOG.rows||[]).filter(function(r){
      return r.ok && String(r.mgt_key||"").indexOf(head)===0; });
    var dupMsg = dup.length
      ? ("\n\n[알림] "+sh.name+" 에 "+per+" 계산서를 이미 "+dup.length+"장 보냈어요"+
         (dup[0].nts_no?(" (마지막 승인번호 "+dup[0].nts_no+")"):"")+
         ". 금액과 비고까지 똑같으면 보내기 직전에 한 번 더 물어봐요.")
      : "";
    confirmBox("계산서 보내기",
      sh.name+" 에 "+won(amt+Math.round(amt/10))+" 짜리 계산서를 보내요."+
      (real?" 실제 발행이라 국세청으로 바로 가요.":" 지금은 시험 발행이라 국세청에는 가지 않아요.")+dupMsg,
      dup.length?"그래도 보내기":"보내기", real||!!dup.length, function(){
      taxSend(sh,code,{ amount:amt, period:per, itemName:item, memo:memo });
    });
  };
}

      '<div id="tTop"></div></div>';

  makeTable({
    id:"tTop", rows:(D.topups||[]), search:["shopName","memo"], sortKey:"at", sortDir:"desc",
    rowId:function(r){ return String(r.id); },
    cols:[
      {k:"at", label:"넣은 때", w:130, stick:true, html:function(r){ return dt(r.at,true); }},

      {k:"memo", label:"메모", w:160}

var LOCK = {};
function viewLock(){
  $("main").innerHTML='<div class="dashhead"><h2>잠금 · 차단</h2>'+
    '<div class="sub2">이용기간(또는 무료 체험)이 끝난 업체를 어떻게 할지 정해요. '+
    '끝나자마자 내쫓지 않고, 며칠은 <b>보기만</b> 되게 두었다가 그 뒤에 로그인을 막아요.</div></div>'+
    '<div class="tools"><button class="btn primary sm" id="lkGo">다시 불러오기</button>'+
      '<span class="sp"></span><span class="cnt" id="lkAt"></span></div>'+
    '<div id="lkBody"><div class="hint">불러오는 중이에요…</div></div>';
  $("lkGo").onclick=lkLoad;
  if(LOCK.loaded) lkDraw(); else lkLoad();
}
function lkLoad(){
  if(LOCK.busy) return; LOCK.busy=true;
  Promise.all([ api("hqLock",[]), api("hqPurgeList",[]).catch(function(){ return null; }) ])
  .then(function(rs){
    var r=rs[0]||{};
    LOCK.loaded=true; LOCK.err="";
    LOCK.cfg=(r&&r.cfg)||{}; LOCK.shops=(r&&r.shops)||[]; LOCK.logs=(r&&r.logs)||[];
    LOCK.today=(r&&r.today)||""; LOCK.purge=(rs[1]&&rs[1].list)||[];
    LOCK.at=new Date().toISOString();
  },function(e){ LOCK.loaded=true; LOCK.err=e.message||"불러오지 못했습니다"; })
  .then(function(){ LOCK.busy=false;
    var at=$("lkAt"); if(at) at.textContent=LOCK.at?("마지막 확인 "+dtTime(LOCK.at)):"";
    lkDraw(); });
}
function lkPill(st){
  return st==="blocked" ? '<span class="pill off">보류 · 로그인 막힘</span>'
       : st==="lock"    ? '<span class="pill wait">잠김 (보기만)</span>'
                        : '<span class="pill run">진행 중</span>';
}
function lkDraw(){

    '<b>새 접수·출고·문자·사진 올리기·계산서</b>는 멈춰요. 자료는 지우지 않고 그대로 두었다가 '+dd+'일 뒤에 정리 목록에 올라와요.</div></div>';

  /* ③ 업체별 */
  h+='<div class="card"><h2>업체별 상태</h2>'+
    '<p class="lead">한 곳만 더 열어 두고 싶으시면 «열어 두기»에 날짜를 넣으세요. 그 날짜까지는 평소처럼 다 돼요.</p>'+
    '<div id="lkShopT"></div></div>';

  /* ④ 자료 정리 */
  h+='<div class="card"><h2>자료 정리 대상</h2>'+
    '<p class="lead">보관 기간이 끝나가는 업체예요. <b>자동으로 지우지 않아요.</b> 눈으로 보시고 직접 누르셔야 지워져요.</p>'+
    (LOCK.purge && LOCK.purge.length ? '<div id="lkPurgeT"></div>'
      : '<div class="hint">지금은 정리할 업체가 없어요.</div>')+'</div>';

  makeTable({ id:"lkShopT", sortKey:"endAt",
    rows:(LOCK.shops||[]).map(function(x){
      return { shop:x.shop, name:x.name||x.shop,
               kind:x.kind==="trial"?"무료 체험":"이용기한",
               endAt:x.endAt||"", state:x.state, opened:!!x.opened,
               blockFrom:x.blockFrom||"", delAt:x.delAt||"",
               openUntil:x.openUntil||"", own:(x.own===null||x.own===undefined)?"":String(x.own) };
    }),
    search:["name","shop"],
    cols:[
      {k:"name",label:"업체",w:150,stick:true},
      {k:"kind",label:"무엇",w:90},

/* 업체 하나 열어 두기 */
function lkOpenBox(code){
  var row=null;
  (LOCK.shops||[]).forEach(function(x){ if(x.shop===code) row=x; });
  if(!row) return;
  var t=new Date(Date.now()+7*864e5).toISOString().slice(0,10);
  openSheet('<h3>'+esc(row.name||code)+' — 열어 두기</h3>'+
    '<p class="lead">이 날짜까지는 잠금·차단과 상관없이 <b>평소처럼 다</b> 쓸 수 있어요. '+
    '입금은 됐는데 아직 이용기한을 못 늘렸을 때 쓰세요.</p>'+
    '<label class="f" for="lkoD">언제까지 열어 둘까요</label>'+
    '<input type="date" id="lkoD" value="'+esc(row.openUntil||t)+'">'+
    '<label class="f" for="lkoM">왜 열어 두는지 (기록에 남아요)</label>'+
    '<input type="text" id="lkoM" value="'+esc(row.openMemo||"")+'" placeholder="예) 9/26 입금 확인, 계산서 발행 대기">'+
    '<label class="f" for="lkoL">이 업체만 잠금 일수를 다르게 (비우면 기본값)</label>'+
    '<input type="number" id="lkoL" value="'+esc(row.own===null||row.own===undefined?"":row.own)+'" min="0" max="180" placeholder="비워 두면 기본값">'+
    '<div class="saveRow"><button class="btn primary sm" id="lkoGo">저장</button>'+
    '<button class="btn sm" id="lkoOff">열어 둔 것 취소</button></div>');
  $("lkoGo").onclick=function(){
    var L=$("lkoL").value.trim();
    api("hqLockShop",[code,{ openUntil:$("lkoD").value, memo:$("lkoM").value, lockDays:(L===""?null:Number(L)) }])
    .then(function(){ closeSheet(); toast("저장했어요"); LOCK.loaded=false; lkLoad(); })
    .catch(function(e){ toast(e.message,true); });
  };
  $("lkoOff").onclick=function(){
    api("hqLockShop",[code,{ openUntil:"", memo:"" }])
    .then(function(){ closeSheet(); toast("취소했어요"); LOCK.loaded=false; lkLoad(); })
    .catch(function(e){ toast(e.message,true); });
  };
}

/* 자료 정리 — 두 번 확인합니다 */
function lkPurgeBox(code){
  api("hqPurgePeek",[code]).then(function(r){
    var pk=(r&&r.peek)||{}, st=(r&&r.state)||{};
    var nm=st.name||code;
    openSheet('<h3 style="color:var(--danger)">'+esc(nm)+' — 자료 정리</h3>'+
      '<p class="lead">아래 자료가 <b>영영 지워져요.</b> 되돌릴 수 없어요.</p>'+
      '<div class="hint" style="background:var(--danger-soft);border-color:#F0B9B4">'+
        '기록 <b>'+(pk.rows>=0?pk.rows:"?")+'</b>줄 · 문자기록 <b>'+(pk.send>=0?pk.send:"?")+'</b>줄 · '+
        '계정 <b>'+(pk.users>=0?pk.users:"?")+'</b>개<br>'+
        '끝난 날 '+esc(st.endAt||"-")+' · 정리 예정일 '+esc(st.delAt||"-")+'</div>'+
      '<label class="f" for="lkpN">지우시려면 업체명을 그대로 적어 주세요</label>'+
      '<input type="text" id="lkpN" placeholder="'+esc(nm)+'">'+
      '<div class="saveRow"><button class="btn sm" id="lkpGo" style="background:var(--danger);border-color:var(--danger);color:#fff">이 업체 자료 지우기</button></div>', nm);

function ntLive(n){

  if(n.to_at   && String(n.to_at).slice(0,10)   < t) return false;

function ntState(n){

  if(n.to_at   && String(n.to_at).slice(0,10)   < t) return '<span class="pill gray">지남</span>';
  return '<span class="pill ok">올라와 있음</span>';
}

  };

function ataWay(code,key){
  if(!String(code||"").trim()) return '<span class="pill gray">문자로 보냄</span>';
  if(ATA.ready.length && ATA.ready.indexOf(key)<0) return '<span class="pill wait" title="서버가 이 안내를 아직 알림톡으로 보내지 않아요">문자로 보냄 · 서버 준비 중</span>';
  return '<span class="pill run">알림톡 먼저</span>'; }

function navOf(t){ return NAV.filter(function(g){ return g[2].indexOf(t)>=0; })[0]||null; }
function tabLabel(t){ var f=TABS.filter(function(x){return x[0]===t;})[0]; return f?f[1]:t; }
function render(){
  var sb0=$("setSub"); if(sb0 && sb0.parentNode!==$("jh")) $("jh").appendChild(sb0);
  var g = navOf(TAB);
  if(g) NAV_LAST[g[0]] = TAB;
  $("nav").innerHTML = NAV.map(function(n){
    var on = !!g && g[0]===n[0];
    return '<button data-t="'+n[0]+'" role="tab" title="'+esc(n[1])+'" aria-selected="'+on+'">'+ic(NAVIC[n[0]]||"menu")+'<span class="lbl">'+esc(n[1])+'</span></button>';
  }).join("");
  Array.prototype.forEach.call($("nav").children,function(b){
    b.onclick=function(){
      var k=b.getAttribute("data-t"), cur=navOf(TAB);
      /* 설정을 한 번 더 누르면 원래 보던 화면으로 — 워시와 같음 */
      if(k==="settings" && cur && cur[0]==="settings"){ TAB=NAV_PREV||"sum"; window.scrollTo(0,0); render(); return; }
      if(!cur || cur[0]!=="settings") NAV_PREV=TAB;
      var n=NAV.filter(function(x){return x[0]===k;})[0];
      /* 설정만 마지막에 본 작은 탭을 기억합니다 (워시와 같음). 나머지 묶음은 누르면 첫 화면 */
      TAB = (k==="settings" && NAV_LAST[k]) || n[2][0];
      window.scrollTo(0,0); render(); };
  });
  /* 둘째 줄 — 묶음 안에 화면이 둘 이상일 때만 (워시 설정 줄과 같은 모양) */
  var subs = g ? g[2] : [];
  $("setSub").hidden = subs.length<2;
  $("setSub").setAttribute("data-label", g ? g[1] : "");
  $("setSub").innerHTML = subs.length<2 ? "" : subs.map(function(t){
    return '<button data-s="'+t+'" aria-selected="'+(t===TAB)+'">'+esc(tabLabel(t))+'</button>'; }).join("");
  Array.prototype.forEach.call($("setSub").children,function(b){
    b.onclick=function(){ TAB=b.getAttribute("data-s"); window.scrollTo(0,0); render(); }; });
  /* 세로 메뉴에서는 작은 탭을 고른 묶음 바로 아래에 (J안) */
  var sb=$("setSub"), on=$("nav").querySelector('[aria-selected="true"]');
  sb.classList.toggle("inside", $("app").classList.contains("lay-side") && !!on && subs.length>1);
  if(sb.classList.contains("inside") && on) on.insertAdjacentElement("afterend", sb); else if(sb.parentNode!==$("jh")) $("jh").appendChild(sb);
  $("app").classList.toggle("hasSub", subs.length>1);
  var f = TABS.filter(function(t){return t[0]===TAB;})[0];
  (f?f[2]:viewSummary)();
  /* ② 묶음 › 화면 이름 (모든 화면 같은 자리) */
  addCrumb();
  tbarDraw();
}

  var c=$("gcode").value.replace(/[^0-9]/g,"");

  $("gGo2").disabled=true; gmsg("확인 중…");

    D.me={ who:$("gid").value.trim(), name:r.who||"", shop:r.shop, role:r.role, phone:$("gid").value.trim() };

/* 폰 아래 탭바 5칸 — 홈 · 업체 · 받는 금액 · 계산서 · 전체 */
function tbarDraw(){
  var g=navOf(TAB), k=g?g[0]:"";
  $("jTbar").innerHTML=[["sum","home","홈"],["shops","shop","업체"],["pays","wallet","받는 금액"],["tax","receipt","계산서"],["all","more","전체"]].map(function(x){
    var on = x[0]==="all" ? ["sum","shops","pays","tax"].indexOf(k)<0 : x[0]===k;
    return '<button type="button" data-tb="'+x[0]+'" class="'+(on?"on":"")+'">'+ic(x[1])+'<span>'+x[2]+'</span></button>'; }).join("");
  Array.prototype.forEach.call($("jTbar").children,function(b){
    b.onclick=function(){ var t=b.getAttribute("data-tb"); if(t==="all") allSheet(); else { var n=NAV.filter(function(z){return z[0]===t;})[0]; jgo(n?n[2][0]:t); } }; });
}
function allSheet(){
  openSheet('<h3 style="margin:0 0 12px">전체 메뉴</h3><div class="j-allm">'+NAV.map(function(n){
    return '<div><h4>'+esc(n[1])+'</h4><div class="row">'+n[2].map(function(t){
      return '<button type="button" data-go2="'+t+'" class="'+(t===TAB?"on":"")+'">'+esc(tabLabel(t))+'</button>'; }).join("")+'</div></div>'; }).join("")+
    '<div><h4>내 정보</h4><div class="row"><button type="button" data-go3="lay">화면 설정</button><button type="button" data-go3="out">로그아웃</button></div></div></div>');
  Array.prototype.forEach.call($("sheet").querySelectorAll("[data-go2]"),function(b){
    b.onclick=function(){ closeSheet(); jgo(b.getAttribute("data-go2")); }; });
  Array.prototype.forEach.call($("sheet").querySelectorAll("[data-go3]"),function(b){
    b.onclick=function(){ closeSheet(); if(b.getAttribute("data-go3")==="lay") laySheet(); else $("btnOut").click(); }; });
}
(function(){ var a=$("app"); a.classList.add("lay-"+layGet()); })();

/* ② 묶음 › 화면 이름 — 화면이 자료를 받은 뒤 다시 그려져도 늘 붙게 */
function addCrumb(){
  var g=navOf(TAB), dh=$("main").querySelector(".dashhead");
  if(dh && g && !dh.querySelector(".jcrumb"))
    dh.insertAdjacentHTML("afterbegin",'<small class="jcrumb">'+esc(g[1])+(g[1]===tabLabel(TAB)?"":" › "+esc(tabLabel(TAB)))+'</small>');
}
try{ new MutationObserver(addCrumb).observe($("main"),{childList:true}); }catch(e){}

/* 이미 로그인해 둔 기기라면 바로 들어갑니다 */
(function boot(){
  var sid = ls(SIDKEY);
  if(!sid){ showGate(""); return; }
  open_("me",[sid]).then(function(r){
    if(!r || r.shop!=="ADMIN"){ lsDel(SIDKEY); showGate(""); return; }
    D.me = { who:"(기억된 계정)", name:r.who||"", shop:r.shop, role:r.role, phone:"" };
    return loadAll().then(function(){
      /* 내 계정 화면에서 쓸 아이디를 계정 목록에서 찾아 둬요 */
      var mine=(D.users||[]).filter(function(u){return u.shop==="ADMIN"&&u.name===D.me.name;})[0];
      if(mine){ D.me.who=mine.phone; D.me.phone=mine.phone; }
      showApp();
    });
  }).catch(function(){ lsDel(SIDKEY); showGate(""); });
})();

})();
