<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2545">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<script>/* 다른 사이트 안에 끼워 열리면 화면을 숨기고 관리 주소로 바로 엽니다 */if(window.top!==window.self){document.documentElement.style.display="none";try{window.top.location.replace(window.self.location.href);}catch(e){}}</script>
<title>차곳간 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>

/* ═══ 관리 → 워시 색 이름 맞추기 (UI 1.1) — 값은 워시 것을 그대로 써요 ═══ */
:root{--blue:var(--brand);--blue-soft:var(--brand-soft);--navy:var(--accent);--ok:var(--good);
  --blue-deep:#0E4E9B;--block:#E6EDF7;--block-line:#D3DEED}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--blue-deep:#8AC2F8;--block:#101A29;--block-line:#223145}}
:root[data-theme="dark"]{--blue-deep:#8AC2F8;--block:#101A29;--block-line:#223145}

/* 보안 점검 */
.secTop{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 14px}
@media(max-width:820px){.secTop{grid-template-columns:1fr}}
.secTop .kbox{width:100%;text-align:left}
.secGrp{margin:0 0 6px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.02em}
.secRow{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line);
  border-radius:11px;background:var(--surface);margin-bottom:7px}
.secRow .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;margin-top:5px;background:var(--good)}
.secRow.lv1 .dot{background:var(--warn)} .secRow.lv2 .dot{background:var(--danger)}
.secRow.lv1{border-color:#F0D9A8;background:var(--warn-soft)}
.secRow.lv2{border-color:#F0B9B4;background:var(--danger-soft)}
.secRow .bd{flex:1;min-width:0}
.secRow .nm{font-size:14px;font-weight:700;color:var(--text)}
.secRow .tx{font-size:13px;color:var(--muted);margin-top:2px;word-break:keep-all}
.secRow .how{font-size:12.5px;font-weight:700;margin-top:5px}
.secRow.lv1 .how{color:var(--warn)} .secRow.lv2 .how{color:var(--danger)}
.secChk{display:flex;gap:11px;align-items:flex-start;padding:12px 13px;border:1px solid var(--line);
  border-radius:11px;background:var(--surface);margin-bottom:7px;cursor:pointer}
.secChk input{width:22px;height:22px;flex:0 0 auto;margin-top:2px;cursor:pointer}
.secChk.on{background:var(--good-soft);border-color:#B7E4CC}
.secChk .nm{font-size:14px;font-weight:700}
.secChk .tx{font-size:12.5px;color:var(--muted);margin-top:3px;word-break:keep-all}
.secChk .dn{font-size:12px;color:var(--good);font-weight:700;margin-top:4px}
/* 요금제 한눈에 비교표 */
.cmpWrap{margin:0 0 14px}
/* 묶음 판 */
.block{background:var(--block);border:1px solid var(--block-line);border-radius:15px;padding:12px;margin-bottom:12px}
.block>.dRow:last-child,.block>.gauges:last-child{margin-bottom:0}
.block .opsHd{margin:0 0 10px}
@media(max-width:620px){.block{padding:10px;border-radius:12px}}
/* 공지사항 요약 줄 */
.ntSum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ntSum>div{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:var(--surface2)}
.ntSum span{display:block;font-size:12px;color:var(--muted);font-weight:700}
.ntSum b{display:block;font-size:19px;font-weight:900;margin-top:3px}
@media(max-width:620px){.ntSum{grid-template-columns:1fr}}

.opsHd{display:flex;align-items:center;gap:8px;margin:18px 0 10px}
.opsHd h3{font-size:16px;font-weight:800;margin:0}
.opsHd .sp{flex:1}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:12px}
@media(max-width:820px){.gauges{grid-template-columns:1fr}}
.gauges .gauge{margin:0}
/* 시각 · 칩 */
.hm{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.hm input{width:82px;font-family:inherit;font-size:19px;font-weight:800;text-align:center;
  padding:9px 6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text)}
.hm span{font-size:14px;font-weight:700;color:var(--muted)}
.hm b{font-size:13.5px;color:var(--blue-deep);margin-left:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;background:var(--surface);cursor:pointer;font-size:13.5px;font-weight:700;
  color:var(--text);font-family:inherit}
.chip input{width:18px;height:18px;accent-color:var(--blue)}
.chip.on{border-color:var(--blue);background:var(--blue-soft,rgba(22,104,196,.08))}
.tplTabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.tplTabs button{font-family:inherit;font-size:13px;font-weight:700;padding:7px 12px;border-radius:9px;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.tplTabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.prev{border:1px solid var(--line);border-radius:12px;background:var(--surface2);padding:12px 14px;margin-top:10px}
.prev .ph{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}
.prev .msg{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px;
  font-size:13.5px;line-height:1.75;white-space:pre-wrap;word-break:keep-all;text-align:left;color:var(--text)}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.keys code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--surface2);
  border:1px solid var(--line);border-radius:7px;padding:3px 7px;color:var(--blue-deep)}
.saveRow{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
table.cmp{width:100%;border-collapse:collapse;background:var(--surface);font-size:14px}
table.cmp th,table.cmp td{border-bottom:1px solid var(--line);padding:11px 13px;text-align:center;white-space:nowrap}
table.cmp thead th{background:var(--surface2);font-size:13.5px;font-weight:800;color:var(--text)}
table.cmp th.c-name,table.cmp td.c-name{text-align:left;position:sticky;left:0;background:var(--surface);
  font-weight:700;color:var(--muted);min-width:150px;box-shadow:1px 0 0 var(--line)}
table.cmp thead th.c-name{background:var(--surface2)}
table.cmp tbody tr:last-child td{border-bottom:0}
table.cmp .yes{color:var(--ok);font-weight:700}
table.cmp .no{color:var(--muted)}
/* 운영 상태 */
.opsTop{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 14px}
@media(max-width:1100px){.opsTop{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.opsTop{grid-template-columns:1fr}}
.opsTop .kbox{width:100%;text-align:left}
.gauge{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 15px;margin-bottom:10px}
.gauge .gh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.gauge .gn{font-size:14px;font-weight:800}
.gauge .gv{font-size:13px;color:var(--muted);margin-left:auto}
.gauge .gs{font-size:12.5px;color:var(--muted);margin-top:7px;word-break:keep-all}
.opsGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.opsGrid{grid-template-columns:1fr}}
/* 결제 화면 요약 칸 */
.paySum{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 14px}
@media(max-width:820px){.paySum{grid-template-columns:1fr}}
.paySum .kbox{width:100%;text-align:left}
.dRow{display:grid;gap:12px}
.dRow.money{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.dRow.mini{grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
.kbox{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:15px 17px;font:inherit;color:inherit;cursor:pointer;
  transition:border-color .12s,box-shadow .12s}
.kbox .t{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:-.2px}
.kbox .v{font-weight:800;letter-spacing:-.8px;margin-top:4px;line-height:1.25;
  font-variant-numeric:tabular-nums}
.kbox .s{font-size:12px;color:var(--muted);margin-top:1px}
.kbox.warn .v{color:var(--warn)}
/* 손봐야 할 것 */
.todoHd{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.todoHd h2{font-size:17px;margin:0}
.dotOk{width:8px;height:8px;border-radius:99px;background:var(--ok);flex:0 0 auto}
.dotWarn{width:8px;height:8px;border-radius:99px;background:var(--warn);flex:0 0 auto}
.todoRow{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);
  cursor:pointer}
.todoRow:last-child{border-bottom:0}
.todoRow:hover .tdT{color:var(--blue)}
.tdT{font-size:14px}
.usg{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:6px}
.ub{background:var(--surface2);border-radius:11px;padding:10px 12px;display:flex;flex-direction:column}
.ub .t{font-size:11.5px;color:var(--muted);font-weight:700}
.ub .v{font-size:16px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.ub .s{font-size:11.5px;color:var(--muted);margin-top:1px}
/* 유지비 줄 */
.svcList{display:grid;gap:2px}
.svcRow{display:grid;grid-template-columns:minmax(120px,1.1fr) minmax(0,1.6fr) minmax(160px,1fr) auto;
  gap:10px;align-items:center;padding:11px 10px;border-radius:10px;border:1px solid transparent}
.svcRow+.svcRow{border-top:1px solid var(--line);border-radius:0}
.svcRow .sN{font-weight:700;font-size:14px}
.autoTag{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:99px;vertical-align:1px;
  background:rgba(26,127,75,.12);color:var(--ok)}
.autoTag.hand{background:rgba(102,115,137,.15);color:var(--muted)}
.svcRow .sW{font-size:12.5px;color:var(--muted)}
.svcRow .sS{font-size:13px;display:flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums}
.svcRow.lv2{background:rgba(192,57,43,.06)}
.svcRow.lv1{background:rgba(180,83,9,.06)}
@media(max-width:760px){
  .svcRow{grid-template-columns:1fr auto;gap:4px 10px;padding:12px 8px}
  .svcRow .sW{grid-column:1/-1}
  .svcRow .sS{grid-column:1/2}
}
/* 정산 표 */
.stl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.stl th,.stl td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right;font-size:14px}
.stl th:first-child,.stl td:first-child{text-align:left}
.stl th{font-size:12.5px;color:var(--muted);font-weight:700}
.stl tfoot td{font-weight:800;border-bottom:0}
.minus{color:var(--danger)}
td.stick b{font-weight:700}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700}

/* 잠금 흐름 그림 */
.lkFlow{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.lkStep{flex:1 1 150px;min-width:140px;border:1px solid var(--line);border-radius:12px;padding:12px 13px;
  background:var(--surface2)}
.lkStep b{display:block;font-size:13.5px;font-weight:800;margin-bottom:4px}
.lkStep span{font-size:12.5px;color:var(--muted);line-height:1.7}
.lkStep.ok{background:var(--good-soft);border-color:transparent}
.lkStep.ok b{color:var(--ok)}
.lkStep.warn{background:var(--warn-soft);border-color:transparent}
.lkStep.warn b{color:var(--warn)}
.lkStep.bad{background:var(--danger-soft);border-color:transparent}
.lkStep.bad b{color:var(--danger)}
.lkStep.gray b{color:var(--muted)}
.lkArw{align-self:center;color:var(--muted);font-size:20px;font-weight:800;flex:0 0 auto}
@media(max-width:700px){ .lkArw{display:none} .lkStep{flex:1 1 100%} }
.pill.ok{background:rgba(26,127,75,.12);color:var(--ok)}
.pill.off{background:rgba(192,57,43,.12);color:var(--danger)}
.pill.wait{background:rgba(180,83,9,.12);color:var(--warn)}
.pill.gray{background:var(--surface2);color:var(--muted)}
.mono{font-family:'Consolas',monospace;font-size:13px;letter-spacing:.2px}
.warnbox{background:rgba(180,83,9,.08);border:1px solid rgba(180,83,9,.3);color:var(--warn);
  border-radius:10px;padding:12px 13px;font-size:13px;font-weight:700;margin:14px 0}
</style>
<style>

:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4f6f9;--surface:#fff;--surface2:#f0f3f7;--line:#dde3ec;--text:#14202e;--muted:#667389;
  --brand:#1668C4;--brand-soft:#E7F2FC;--accent:#0B2545;--sky:#8FC9F2;
  --good:#127a4b;--good-soft:#e2f5ec;--warn:#9a4b06;--warn-soft:#fdeede;--danger:#b3261e;--danger-soft:#fdeceb;
  --pay:#0B2545;--pay-soft:#EAF1F9;--pay-ink:#fff;   /* 입금 알림 — 차곳간 남색 */
  --shadow:0 2px 10px rgba(16,32,52,.08);--r:14px;
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e141c;--surface:#161e28;--surface2:#1d2733;--line:#2b3644;--text:#e8edf4;--muted:#95a3b6;
  --brand:#5FA8E8;--brand-soft:#102B47;--accent:#8FC9F2;--sky:#8FC9F2;--good:#4ad48f;--good-soft:#12312a;
  --warn:#f0a95e;--warn-soft:#332412;--danger:#ff8b82;--danger-soft:#331614;--shadow:0 2px 10px rgba(0,0,0,.4);
  --pay:#8FC9F2;--pay-soft:#102B47;--pay-ink:#0B2545;
}}
:root[data-theme="dark"]{--bg:#0e141c;--surface:#161e28;--surface2:#1d2733;--line:#2b3644;--text:#e8edf4;
  --muted:#95a3b6;--brand:#5FA8E8;--brand-soft:#102B47;--accent:#8FC9F2;--sky:#8FC9F2;--good:#4ad48f;--good-soft:#12312a;
  --warn:#f0a95e;--warn-soft:#332412;--danger:#ff8b82;--danger-soft:#331614;--shadow:0 2px 10px rgba(0,0,0,.4);
  --pay:#8FC9F2;--pay-soft:#102B47;--pay-ink:#0B2545;}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
/* 차곳간 공통 UI 1.0 — 한글은 낱말 중간에서 자르지 않아요 */
body,.card,.sheet,.askbox,.banner,th,td,.hint,.empty{word-break:keep-all;overflow-wrap:break-word}
/* ═══════ 매출 내역 — 차곳간 체크 화면 그대로 (UI 1.0) ═══════
   체크의 매출 모양을 그대로 가져왔습니다. 매출 화면 안에서만 써요.
   그래서 다른 화면은 하나도 건드리지 않아요. */
#vSales{--s-fee:var(--good);--s-rep:#E0E8F2;--s-ins:#8E6FD8}
#vSales td.num{font-variant-numeric:tabular-nums}
#vSales td.num .nn{font-variant-numeric:tabular-nums}
#vSales td.num .nn em{font-style:normal;font-weight:700;font-size:11.5px;color:var(--muted);margin-left:1px}
#vSales td.num .b{display:inline-block;min-width:64px;margin:0 0 0 9px;text-align:right;
  font-size:11.5px;font-weight:800;color:var(--muted);vertical-align:baseline}
#vSales td.num .b.up{color:var(--good)}
#vSales td.num .b.dn{color:var(--danger)}
#vSales td.num .b.same{color:var(--muted)}
#vSales .card, #vSales th, #vSales td, #vSales .empty{word-break:keep-all;overflow-wrap:break-word}
#vSales .card h2{min-height:26px;align-items:center}
#vSales .seg{display:flex;gap:6px;background:var(--surface2);padding:4px;border-radius:12px;margin-bottom:12px}
#vSales .seg button{flex:1;border:0;background:transparent;color:var(--muted);font-family:inherit;font-size:14px;
  font-weight:700;padding:9px 6px;border-radius:9px;cursor:pointer}
#vSales .seg button[aria-selected="true"]{background:var(--surface);color:var(--brand);box-shadow:var(--shadow)}
#vSales .sum.clickable{cursor:pointer}
#vSales .sum.clickable[aria-selected="true"]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
#vSales .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
#vSales .card h2{font-size:15px;margin:0 0 12px;font-weight:800;display:flex;align-items:center;gap:8px}
#vSales .card h2 .rt{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted)}
#vSales input[type=text], #vSales input[type=tel], #vSales input[type=number], #vSales input[type=password], #vSales select{width:100%;font-family:inherit;font-size:16px;color:var(--text);background:var(--surface2);
  border:1px solid var(--line);border-radius:11px;padding:12px 13px;outline:none}
#vSales input:focus, #vSales select:focus{border-color:var(--brand);background:var(--surface)}
#vSales button.btn{font-family:inherit;font-size:15px;font-weight:700;border-radius:11px;border:1px solid var(--line);
  background:var(--surface2);color:var(--text);padding:11px 14px;cursor:pointer}
#vSales button.btn:active{transform:translateY(1px)}
#vSales button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
#vSales button.go{background:var(--good);border-color:var(--good);color:#fff}
#vSales button.ghost{background:transparent}
#vSales button.danger{color:var(--danger);border-color:var(--line);background:transparent}
#vSales button.btn[disabled]{opacity:.5;cursor:default}
#vSales .sums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
#vSales .sum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;text-align:center}
#vSales .sum span{display:block;font-size:11px;color:var(--muted);font-weight:700}
#vSales .sum b{font-size:17px;font-weight:900;letter-spacing:-.02em}
#vSales input[type=date]{width:auto;font-family:inherit;font-size:14px;color:var(--text);background:var(--surface2);
  border:1px solid var(--line);border-radius:11px;padding:0 11px;outline:none;height:43px}
#vSales input[type=date]:focus{border-color:var(--brand);background:var(--surface)}
#vSales .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
#vSales .tools input[type=text]{flex:1;min-width:150px}
#vSales .tools select{width:auto;padding:10px 11px;font-size:14px}
#vSales .tools > button.btn, #vSales .tools > label.chip{height:43px}
#vSales .tools > select{padding:0 32px 0 11px;font-size:14px}
#vSales .tools > button.btn{padding:0 14px;font-size:14.5px;display:inline-flex;align-items:center;gap:5px}
#vSales .tools > input[type=text]{padding:0 13px;font-size:15px}
#vSales .tools > label.chip{display:inline-flex;align-items:center;gap:6px;padding:0 13px;margin:0}
#vSales .tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);-webkit-overflow-scrolling:touch}
#vSales table{border-collapse:separate;border-spacing:0;width:100%;min-width:760px;font-size:14px}
#vSales th, #vSales td{padding:11px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
#vSales thead th{background:var(--surface2);font-size:12.5px;color:var(--muted);font-weight:800;cursor:pointer;
  user-select:none;position:sticky;top:0;z-index:2}
#vSales thead th .ar{opacity:.45;font-size:10px}
#vSales thead th.on{color:var(--brand)}
#vSales thead th.on .ar{opacity:1}

/* (옛 통일 규칙은 맨 끝 cgg-ui 블록으로 옮겼습니다) */
.wrap{max-width:960px;margin:0 auto;padding:0 14px 90px}
.wrap.pc{max-width:1280px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);
  border-bottom:1px solid var(--line);margin:0 -14px 26px;padding:11px 14px}
.brandrow{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,var(--brand),var(--accent));
  display:grid;place-items:center;color:#fff;font-weight:900;font-size:14px;flex:none;overflow:hidden}
.logo.hasimg{background:none}
.logo.ci{background:linear-gradient(140deg,#1668C4,#0B2545);padding:5px}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.logo.sq img{object-fit:cover}
h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.02em}
.sub{font-size:12px;color:var(--muted);margin-top:1px}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.who{font-size:12px;color:var(--muted);text-align:right;line-height:1.3}
/* 머리말 간결하게 — 휴지통·로그아웃·가입코드는 사람 단추 안으로 들어갑니다 */
#btnOut2,#btnInvite{display:none !important}
/* 차곳간 UI 1.0 — 휴지통·마이페이지는 늘 보이게, 배치·요금제 줄은 마이페이지 창 안으로 */
#btnTrash{display:inline-flex !important;align-items:center;gap:4px}
#btnArrange{display:none !important}
#planStrip{display:none !important}
.who .wt,.who .av{display:none !important}
.who .mypglb{font-weight:800;font-size:12px;white-space:nowrap}
.mypg{display:grid;gap:12px}
.mypg .mcard{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.mypg .mcard > .mh{display:flex;align-items:baseline;gap:9px;margin-bottom:9px;min-height:22px}
.mypg .mcard > .mh b{font-size:14.5px;font-weight:900}
.mypg .mcard > .mh span{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:700}
.mypg .kv2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.mypg .kv2:last-of-type{border-bottom:0}
.mypg .kv2 > b{font-weight:800;font-variant-numeric:tabular-nums}
.mypg .mbar{height:9px;border-radius:999px;background:var(--line);overflow:hidden;margin:6px 0 2px}
.mypg .mbar i{display:block;height:100%;background:var(--brand)}
.mypg .mrow2{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.mypg .mrow2 .btn{min-width:116px;justify-content:center;text-align:center}
/* 로그아웃 — 닫기 바로 위 한 줄 */
.mpout{display:flex;margin:14px 0 8px}
/* 카드 제목 줄 — 어느 카드든 같은 높이 (UI 1.0) */
.card h2{min-height:26px;align-items:center}
/* 달 고르기 단추 (UI 1.0) */
.mwrap{position:relative;display:inline-flex}
.mwrap .mbtn{height:43px;display:inline-flex;align-items:center;gap:7px;
  background:var(--surface);border-color:var(--brand);color:var(--brand);font-weight:800;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.mwrap .mbtn .mic{display:inline-flex;align-items:center}
.mwrap .mpop{left:0}
.mwrap .mpop .mg button small{min-height:14px;font-size:10px}
/* 작은 탭 — 한 화면 안에서 표를 바꿔요 (UI 1.0) */
.subtabs{display:inline-flex;flex-wrap:wrap;gap:5px;background:var(--surface2);
  padding:4px;border-radius:12px;margin:0 0 12px}
.subtabs button{border:0;background:transparent;color:var(--muted);font-family:inherit;
  font-size:13.5px;font-weight:800;padding:8px 14px;border-radius:9px;cursor:pointer;white-space:nowrap}
.subtabs button[aria-selected="true"]{background:var(--surface);color:var(--brand);box-shadow:var(--shadow)}
/* 숫자 칸 다섯 — 월별 청구서 (UI 1.0) */
.sums.c5{grid-template-columns:repeat(5,1fr)}
@media(max-width:1100px){.sums.c5{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.sums.c5{grid-template-columns:repeat(2,1fr)}}
/* 발송함 — 실패 띠 (UI 1.0) */
.obbar{display:flex;gap:12px;align-items:center;background:var(--danger-soft);
  border:1px solid var(--line);border-left:4px solid var(--danger);
  border-radius:12px;padding:12px 14px;margin:0 0 12px}
.obbar .ic{flex:none;font-size:17px;line-height:1.2}
.obbar .tx{flex:1;min-width:0}
.obbar .tx b{display:block;font-size:14px;font-weight:800;color:var(--danger);line-height:1.4}
.obbar .tx small{display:block;font-size:12.5px;color:var(--muted);margin-top:1px;line-height:1.5}
.obbar .btn{flex:none;min-width:116px;height:38px;display:inline-flex;
  align-items:center;justify-content:center;padding:0 14px;font-size:13px}
@media(max-width:620px){.obbar{flex-wrap:wrap}.obbar .btn{width:100%}}
/* 작업 항목별 — 전체 너비에 세 줄씩 (UI 1.0) */
#dashWorks .wkgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 22px}
@media(max-width:900px){#dashWorks .wkgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){#dashWorks .wkgrid{grid-template-columns:1fr}}
#dashWorks .wksum{display:flex;justify-content:space-between;align-items:baseline;
  margin-top:11px;padding-top:10px;border-top:2px solid var(--line);font-size:13.5px}
#dashWorks .wksum b{font-size:16px;font-variant-numeric:tabular-nums}
/* ── 현장(폰) 화면 — 머리말이 좁아 단추를 추립니다 ──
   늘 보여야 하는 것: 공지 · 마이페이지 · 연결됨 · PC 화면으로
   마이페이지 창 안에서 볼 수 있는 것은 폰에서 감춥니다 */
.wrap:not(.pc) > header #btnTrash,
.wrap:not(.pc) > header #btnLink,
.wrap:not(.pc) > header #btnHelp,
.wrap:not(.pc) > header #pollWrap{display:none !important}
.wrap:not(.pc) > header .hdr-right{gap:4px;flex-wrap:wrap;justify-content:flex-end}
.wrap:not(.pc) > header .mini{font-size:11px;padding:4px 7px;white-space:nowrap}
.wrap:not(.pc) > header #ccwNotiBtn{font-size:11px;padding:4px 7px}
.wrap:not(.pc) .who{padding:4px 8px}
.wrap:not(.pc) .who .mypglb{font-size:11px}
.mpout .btn{flex:1;justify-content:center;text-align:center}
/* 창 모서리가 네 귀퉁이 다 둥글게 — 스크롤 막대를 안쪽으로 */
.sheet{scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.sheet::-webkit-scrollbar{width:10px}
.sheet::-webkit-scrollbar-track{background:transparent;margin:14px 0}
.sheet::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px;border:3px solid transparent;background-clip:content-box}
.sheet::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:content-box}
@media(max-width:560px){.mypg .sums{grid-template-columns:1fr 1fr}}
.who{cursor:pointer;border:1px solid var(--line);background:var(--surface2);border-radius:999px;
  padding:5px 11px 5px 9px;display:flex;align-items:center;gap:7px;font-family:inherit}
.who:hover{background:var(--brand-soft);border-color:var(--brand)}
.who .wt{text-align:left}
.who::after{content:"▾";font-size:11px;color:var(--muted);margin-left:1px}
/* 제목 옆 업체 이름 (설정 → 세금계산서 공급자 상호) */
.bizname{display:flex;flex-direction:column;justify-content:center;margin-left:14px;padding:4px 0 4px 14px;
  border-left:3px solid var(--brand);min-width:0}
.bizname{flex:0 0 auto;max-width:46%}
.wrap.pc:not(.side) .hdr-right{flex:1 1 0;min-width:0}
.bizname b{font-size:27px;font-weight:900;color:var(--text);letter-spacing:-.01em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
  -webkit-text-stroke:.6px currentColor;paint-order:stroke fill}
.bizname small{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:1px;white-space:nowrap}
#pollSel{width:auto;flex:none;max-width:120px}
.brandrow > .logo + div{flex:none}
/* 위쪽 단추 배치 바꾸기 */
.hitem{display:inline-flex}
#hdrBreak{flex-basis:100%;height:0;overflow:hidden;order:500;display:block}
#hdrBreak.gap{height:0;margin:0}
.arranging #hdrBreak{height:auto;border:2px dashed var(--accent);border-radius:9px;padding:6px 10px;text-align:center;
  font-size:12.5px;color:var(--brand);background:var(--brand-soft);margin:2px 0}
.arranging #hdrBreak.arr-over{background:var(--brand);color:#fff}
#hdrBreak>span{pointer-events:none}
.wrap:not(.pc) #hdrBreak{display:none}
.hsz-s{font-size:11px !important;padding:5px 7px !important}
.hsz-l{font-size:14px !important;padding:10px 14px !important}
.hsz-xl{font-size:16px !important;padding:13px 18px !important}
#pollWrap.hsz-s,#pollWrap.hsz-l,#pollWrap.hsz-xl{padding:0 !important}
#pollWrap.hsz-s select{font-size:11px;padding:4px 6px !important}
#pollWrap.hsz-l select{font-size:14px;padding:9px 10px !important}
#pollWrap.hsz-xl select{font-size:16px;padding:12px 12px !important}
#hWho.hsz-l b{font-size:15px}#hWho.hsz-xl b{font-size:17px}
.arranging [data-arr]{outline:2px dashed var(--accent);outline-offset:2px;cursor:grab;border-radius:9px}
.arranging [data-arr].arr-over{outline-color:var(--brand);background:var(--brand-soft)}
.arranging #pollSel{pointer-events:none}
.arranging #btnArrange{background:var(--brand);color:#fff;border-color:var(--brand)}
#arrBar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;background:#14202e;color:#fff;
  border-radius:14px;padding:10px 12px 10px 16px;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3);
  font-size:13.5px;max-width:calc(100vw - 24px);flex-wrap:wrap}
#arrBar button{border:0;border-radius:9px;padding:8px 12px;font-weight:800;cursor:pointer;font-family:inherit}
/* 좁은 화면에서 대표가 PC 화면을 볼 때도 상호명을 크게 보여줍니다 */
@media (max-width:759px){
  .wrap.pc > header .brandrow{align-items:center;flex-wrap:nowrap;gap:8px}
  .wrap.pc > header .brandrow > .logo + div{display:none}
  .wrap.pc > header .logo{width:30px;height:30px;font-size:12px;border-radius:9px}
  .wrap.pc .bizname{display:flex;margin-left:4px;padding:0 0 0 9px;border-left-width:3px;
    flex:1 1 60px;min-width:60px;max-width:none;overflow:hidden}
  .wrap.pc .bizname b{font-size:19px;line-height:1.2}
  .wrap.pc .bizname small{font-size:10px;opacity:.7;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;line-height:1.35}
  .wrap.pc > header{padding:10px 14px;margin:0 -14px 14px}
  .wrap.pc > header .hdr-right{flex:0 0 auto;gap:5px}
  .wrap.pc > header .mini{padding:6px 9px;font-size:11.5px}
  .wrap.pc .tabs{gap:4px}
  .wrap.pc .tabs button{padding:9px 11px;font-size:13px}
}
@media (min-width:760px) and (max-width:999px){.wrap.pc .bizname{display:none}}

.wrap:not(.pc) > header .brandrow > .logo + div{display:none}   /* '차곳간 워시' 줄은 상호 밑으로 옮겨 그립니다 */

.wrap:not(.pc) > header .bizname.noname b{font-size:16px}

.who .av{display:none;width:28px;height:28px;flex:0 0 auto;border-radius:50%;background:var(--brand);

/* 세로·아이콘 메뉴에서만 그림을 써요 (가로 메뉴·폰은 글자만) */
.wrap.pc.side #tabs button::before{
  content:"";display:block;width:18px;height:18px;flex:0 0 auto;background-color:currentColor;
  -webkit-mask:var(--ic) center/contain no-repeat;mask:var(--ic) center/contain no-repeat;
  font-size:0;filter:none;opacity:1}
.wrap.pc.side #setSub button::before{display:none}
.wrap.pc:not(.side) #tabs button::before,.wrap:not(.pc) #tabs button::before{display:none}
/* 화면 안쪽 작은 탭에는 그림 자리를 만들지 않아요 */
.tabs:not(#tabs) button::before{content:none !important;display:none !important}
.wrap.iconmenu > header .tabs button::before{width:22px;height:22px}
.wrap.iconmenu > header .tabs button{color:#8FA5C2}
.wrap.iconmenu > header .tabs button:hover{color:#fff}
.wrap.iconmenu > header .mini::before{
  content:"";display:block;width:19px;height:19px;background-color:currentColor;
  -webkit-mask:var(--ic) center/contain no-repeat;mask:var(--ic) center/contain no-repeat}
.wrap.iconmenu.setopen > header .mini::before{display:none}

  .wrap.pc:not(.side) > header #hVer{font-size:10px;opacity:.5;margin-top:0}
  .wrap.pc:not(.side) > header .bizcard{display:flex;align-items:center;flex:1 1 auto;min-width:0;margin-left:16px}
  .wrap.pc:not(.side) > header .bizname{margin:0;padding:2px 0 2px 16px;border-left:2px solid var(--line);
    max-width:none;flex:1 1 auto;min-width:0}
  .wrap.pc:not(.side) > header .bizname b{font-size:21px;font-weight:900;letter-spacing:-.02em;color:var(--text);
    -webkit-text-stroke:0}
  .wrap.pc:not(.side) > header .bizname small{font-size:11px}
  .wrap.pc:not(.side) > header .hdr-right{flex:0 0 auto;align-items:center;gap:5px;flex-wrap:wrap;
