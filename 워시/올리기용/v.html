<style>

:root{--bg:#f4f6f9;--card:#fff;--line:#dde3ec;--ink:#14202e;--muted:#667389;--brand:#1668C4;--navy:#0B2545;
  --good:#127a4b;--good-soft:#e2f5ec;--warn:#9a4b06;--warn-soft:#fdeede;--bad:#b3261e;--bad-soft:#fdeceb}
@media (prefers-color-scheme:dark){:root{--bg:#0e141c;--card:#161e28;--line:#2b3644;--ink:#e8edf4;--muted:#95a3b6;
  --brand:#5FA8E8;--navy:#8FC9F2;--good:#4ad48f;--good-soft:#12312a;--warn:#f0a95e;--warn-soft:#332412;--bad:#ff8b82;--bad-soft:#331614;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:640px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,#1668C4,#0B2545);color:#fff;display:grid;place-items:center;font-weight:900;font-size:10.5px;letter-spacing:-.04em;flex:none}
.top b{font-size:17px}
.top small{display:block;color:var(--muted);font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{margin:0 0 10px;font-size:16px}
.big{font-size:24px;font-weight:900;letter-spacing:-.02em;margin:0}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:800;vertical-align:3px;margin-left:6px}
.tag.in{background:#E7F2FC;color:#1668C4}.tag.out{background:var(--good-soft);color:var(--good)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted);flex:none}
.kv b{text-align:right;min-width:0}
.shots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.shots figure{margin:0}
.shots img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--line);display:block}
.shots figcaption{font-size:12px;color:var(--muted);margin-top:3px}
.add{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}

.add .amt{font-weight:900}
.btns{display:flex;gap:8px}
.btns button{flex:1;font:inherit;font-weight:800;border-radius:10px;padding:11px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.btns button.yes{background:var(--brand);border-color:var(--brand);color:#fff}

.state{font-weight:800}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:420px;font-size:13.5px}
th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--bg);color:var(--muted);font-size:12.5px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.sum{display:flex;justify-content:space-between;align-items:baseline;font-weight:900;font-size:18px;padding-top:10px}
.msg{text-align:center;padding:30px 16px}
.msg b{display:block;font-size:17px;margin-bottom:6px}
.msg p{margin:0;color:var(--muted)}
.foot{color:var(--muted);font-size:12px;text-align:center}
.tel{font-weight:800;user-select:all}
/* 체크 방 조각(.cgi)도 이 페이지 색으로 (어두운 화면) */
.cgi{--cgi-ink:var(--ink);--cgi-muted:var(--muted);--cgi-card:var(--card);--cgi-line:var(--line)}
</style>

<body>

<script>
/* ── 체크 방 조각 그대로 (체크/보기/청구서_보기_조각.js · bd7dfb2 · CSP 때문에 바깥 파일 대신 안에 넣음) ── */
/* 차곳간 체크 · 청구서 한 장 그리기 조각 v1 (2026-10-16 · 체크 방)
   쓰는 곳: app.cgg.co.kr/v.html (워시 방 화면) — 보기코드가 «k» 로 시작하면 check-api v33 invoiceView(코드)를 부르고,
            받은 값을 cggCheckInvoice(넣을 칸, 값) 으로 그립니다. (총괄 결정 ① 1안 · 서버 방이 k 코드 나누기)
   받는 값 (check-api v33 invoiceView — 서버/설계/19 · 정한 칸만):
     { invoice:{ ym, bill_to_name, members:[…], fee_amount, ext_amount, repair_amount, total_amount, dom_n, imp_n, etc_n, … },
       rows:[{ kind:"fee"|"ext"|"repair", dealer_name, item, qty, unit, amount }],
       office:{ name, tel, bank_fee, bank_repair, … } }   또는   { expired:true, msg }
   글은 모두 esc 해서 넣고, 바깥 주소 · 스크립트를 넣지 않습니다. 비밀 열쇠 없음. */
(function(){
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function won(n){ return (Math.round(Number(n)||0)).toLocaleString("ko-KR"); }
  function ymText(ym){ var m=String(ym||"").match(/^(\d{4})-(\d{2})/); return m ? m[1]+"년 "+(+m[2])+"월" : esc(ym); }
  var CSS = '.cgi{font:15px/1.6 "Pretendard","Noto Sans KR",system-ui,sans-serif;color:var(--cgi-ink,#111827);word-break:keep-all}'+
    '.cgi h2{font-size:20px;margin:2px 0 4px}.cgi .sub{color:var(--cgi-muted,#5B6472);font-size:13.5px;margin:0 0 14px}'+
    '.cgi .doc{background:var(--cgi-card,#fff);border:1px solid var(--cgi-line,#E3E7EE);border-radius:14px;padding:14px 16px;margin-bottom:12px}'+
    '.cgi .doc h3{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;gap:10px}'+
    '.cgi .ln{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-top:1px solid var(--cgi-line,#E3E7EE);font-size:14px}'+
    '.cgi .ln:first-of-type{border-top:0}.cgi .ln span:last-child{font-variant-numeric:tabular-nums;text-align:right;flex:none}'+
    '.cgi .tot{font-weight:800}.cgi .acct{font-size:13px;color:var(--cgi-muted,#5B6472);margin-top:6px}'+
    '.cgi .msg{text-align:center;padding:40px 10px;color:var(--cgi-muted,#5B6472)}.cgi .msg b{display:block;color:inherit;font-size:17px;margin-bottom:6px}';
  function part(title, p, acct, isFee){
    if(!p || !(Number(p.amount)>0)) return "";
    var lines=(Array.isArray(p.lines)?p.lines:[]).map(function(l){
      var left = isFee && l.unit ? esc(l.name)+" "+won(l.unit)+" × "+won(l.n) : esc(l.name);
      return '<div class="ln"><span>'+left+'</span><span>'+won(l.amount)+'</span></div>';
    }).join("");
    return '<div class="doc"><h3><span>'+title+'</span><span>'+won(p.n)+'건</span></h3>'+lines+
      '<div class="ln tot"><span>합계 (부가세 포함)</span><span>'+won(p.amount)+'원</span></div>'+
      (acct?'<div class="acct">입금 계좌 : '+esc(acct)+'</div>':'')+'</div>';
  }
  /* 서버 줄 → 검사비(품목 · 단가별로 묶음) / 정비비(작업별로 묶음) */
  function sumUp(rows, isFee){
    var m={}, order=[];
    rows.forEach(function(r){
      var k = isFee ? (r.item||"")+"|"+(Number(r.unit)||0) : (r.item||"");
      if(!m[k]){ m[k]={name:r.item||(isFee?"검사":"정비"), unit:Number(r.unit)||0, n:0, amount:0}; order.push(k); }
      m[k].n += Number(r.qty)||1; m[k].amount += Number(r.amount)||0;
    });
    return order.map(function(k){ return m[k]; });
  }
  window.cggCheckInvoice = function(el, res){
    if(!el) return;
    if(!document.getElementById("cgi-css")){ var st=document.createElement("style"); st.id="cgi-css"; st.textContent=CSS; document.head.appendChild(st); }
    res = res || {};
    var inv = res.invoice || {}, rows = Array.isArray(res.rows) ? res.rows : [];
    var feeRows = rows.filter(function(r){ return r && r.kind!=="repair"; }), repRows = rows.filter(function(r){ return r && r.kind==="repair"; });
    var feeLines = sumUp(feeRows, true), repLines = sumUp(repRows, false);
    function cnt(L){ return L.reduce(function(a,x){ return a+x.n; },0); }
    var d = { expired: res.expired, office: res.office || {}, ym: inv.ym, to: inv.bill_to_name, members: inv.members,
      total: inv.total_amount,
      fee: { n: cnt(feeLines) || ((Number(inv.dom_n)||0)+(Number(inv.imp_n)||0)+(Number(inv.etc_n)||0)),
             amount: (Number(inv.fee_amount)||0)+(Number(inv.ext_amount)||0), lines: feeLines },
      rep: { n: cnt(repLines), amount: Number(inv.repair_amount)||0, lines: repLines } };
    draw(el, d);
  };
  function draw(el, d){
    var off = d.office || {};
    if(d.expired){ el.innerHTML='<div class="cgi"><div class="msg"><b>기한이 지난 주소예요</b>'+esc(off.name||"검사소")+'에 문의해 주세요.</div></div>'; return; }
    var mem = (Array.isArray(d.members)?d.members:[]).filter(function(x){ return x && x!==d.to; });
    el.innerHTML = '<div class="cgi">'+
      '<h2>'+esc(d.to||"")+' 님 '+ymText(d.ym)+' 청구서</h2>'+
      '<p class="sub">'+esc(off.name||"")+(mem.length?' · 함께 묶인 분: '+esc(mem.join(", ")):'')+'</p>'+
      part("검사비 청구서", d.fee, off.bank_fee, true)+
      part("정비비 청구서", d.rep, off.bank_repair, false)+
      '<div class="doc"><div class="ln tot"><span>모두 합계</span><span>'+won(d.total)+'원</span></div>'+
        '<div class="acct">문의 '+esc(off.tel||"")+'</div></div>'+
    '</div>';
  }
})();
</script>
<script>
(function(){
  "use strict";
  /* 부르는 곳 — 워시(대문자 24자 보기코드) · 체크 청구서(소문자 k + 18자) */
  var BASE = "https://ybfpxmmjofyvfprtvmhj.supabase.co/functions/v1/";
  var WASH = BASE + "wash-api?forceFunctionRegion=ap-northeast-2";
  var CHECK = BASE + "check-api";
  var app = document.getElementById("app");

  function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=String(text); return e; }
  function won(n){ return Math.round(Number(n)||0).toLocaleString("ko-KR")+"원"; }
  function dt(s){ var d=new Date(s); if(!s||isNaN(d)) return ""; return (d.getMonth()+1)+"월 "+d.getDate()+"일 "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
  function day(s){ var d=new Date(s); if(!s||isNaN(d)) return ""; return d.getFullYear()+"년 "+(d.getMonth()+1)+"월 "+d.getDate()+"일"; }
  function ym(s){ var m=/^(\d{4})-(\d{2})/.exec(String(s||"")); return m?(Number(m[1])+"년 "+Number(m[2])+"월"):String(s||""); }
  function telText(s){ var d=String(s||"").replace(/\D/g,""); if(d.length===11) return d.replace(/(\d{3})(\d{4})(\d{4})/,"$1-$2-$3"); if(d.length===10) return d.replace(/(\d{2,3})(\d{3,4})(\d{4})/,"$1-$2-$3"); return d; }

    return fetch(url, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, referrerPolicy:"no-referrer", cache:"no-store",

  /* ───── 워시: 차 한 대 ───── */

    kv(c,"차종",car.model); kv(c,"상사",car.company); kv(c,"딜러",car.dealer);
    kv(c,"들어온 때",dt(car.inAt)); kv(c,"나간 때",dt(car.outAt)); kv(c,"보낸 곳",car.dest);
    kv(c,"작업",(car.works||[]).join(" · ")); kv(c,"메모",car.memo);
    var shots=(j.shots||[]).filter(function(s){ return s && safeImg(s.url); });

        f.appendChild(im); f.appendChild(el("figcaption",null,s.tag||"")); g.appendChild(f); }); p.appendChild(g); }
    var adds=j.adds||[];

      adds.forEach(function(w){
        var b=el("div","add"); b.appendChild(el("div",null,w.text||"추가 작업"));

        var st=el("div","state"); b.appendChild(st);
        function paint(s){ st.textContent = s==="진행" ? "진행하기로 답했어요" : (s==="안 함" ? "하지 않기로 답했어요" : "답을 기다리고 있어요"); }
        paint(w.state);

    shopFoot(j.shop); until(j.until);

  /* ───── 워시: 한 달 청구서 ───── */
  function drawWashBill(j){
    clear(); var b=j.bill||{};
    head(j.shop&&j.shop.name, "청구 내역");
    var c=card(); c.appendChild(el("p","big",ym(b.month)+" 청구 내역"));
    kv(c,"받는 곳",b.name); kv(c,"소속 상사",b.company); kv(c,"대수",(b.cars||0)+"대");

    var p=card("입금 안내"); kv(p,"입금 기한",b.dueDate?day(b.dueDate):"업체에 문의"); kv(p,"계좌",b.bank||"업체에 문의");

  /* ───── 시작 ───── */

    post(CHECK,"invoiceView",[c]).then(function(r){
      if(!r || !(r.invoice || r.expired) || !window.cggCheckInvoice) return stop("청구서를 열지 못했어요","잠시 뒤 다시 열어 주세요.");
      /* 그리기는 체크 방 조각 하나로 (서버 v33 답을 그대로 넘김 · e8c5587) */
      clear(); head(r.office&&r.office.name, "청구 내역"); window.cggCheckInvoice(card(), r);
    },function(e){ stop("청구서를 열지 못했어요", ko(e,"잠시 뒤 다시 열어 주세요.")); });
  } else if(/^[A-Fa-f0-9]{24}$/.test(c)){
    post(WASH,"viewCar",[c]).then(function(r){
      if(!r||!r.ok) return stop("열 수 없는 주소예요", (r&&r.why)||"주소가 닫혔거나 올바르지 않습니다. 맡기신 업체로 문의해 주세요");
      if(r.kind==="bill") drawWashBill(r); else drawCar(r, c);
    },function(e){ stop("열지 못했어요", ko(e,"잠시 뒤 다시 열어 주세요.")); });
  } else {
    stop("열 수 없는 주소예요","받으신 알림의 버튼을 다시 눌러 주세요.");
  }
})();
</script>
</body>
</html>
