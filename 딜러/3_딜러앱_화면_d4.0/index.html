/* ═══════════════════════════════════════════════════════════════════
   차곳간 공통 부품 · J안 4판 · cgg-j4 1.13.2 (2026-10-19, 디자인 방 · 챗지피티 검수 3 고침)
   1.8 바뀐 것: ⑧ 페이지 뼈대 — 크기는 모두 아래 «뼈대 치수» 변수 한 벌. 제품 CSS 에서 이 변수와 뼈대 부품의 크기를 덮어쓰지 않아요 (통합 검사표로 숫자 확인)
   1.7 바뀐 것:
   1.7 바뀐 것: ⑦ 메뉴 찾기 — 왼쪽 메뉴 늘 펼침(.cgg-nsubs) · 기능 찾기(.cgg-hfind) · 전체 메뉴 판(.cgg-sheet) · 홈 바로가기(.cgg-quick)
   1.6 바뀐 것:
   1.6 바뀐 것: 폰 깨짐 근본 고침(폰 목록 두 줄 칸 · 바깥 카드 아이콘 크기 · 목록 둘째 값 한 줄 · 숫자 카드 빈자리)
               · 머리말 사업장 칸 이름 .cgg-biz → .cgg-hdr-biz (법정 사업자 정보 칸과 겹치지 않게)
   ① 메뉴 배치 셋 (가로 · 세로 · 아이콘)  ② 폰 아래 탭바  ③ 홈 할 일 카드 3장  ④ 사람 단추 ▾ 펼침 (1.1)
   ⑤ 체험 모드 — 미리 써 보기(가입 전) · 체험판(결제 전) 띠 · 자물쇠 · 3번 표시 · 기능 카드 (1.2)
   ⑥ 화면 일곱 칸 본문 — 화면 머리 · 버튼 · 숫자 카드 4개 · 데이터 카드(상태 탭 · 거르기 · 표 · 폰 목록 · 쪽) · 도움 카드 · 창 3종 · 알림 글 (1.3)
   + 한국어 낱말 단위 줄바꿈 (keep-all)
   바탕: 관리 v4.0 의 관리/v4재료/j4.css (값 그대로). 관리 전용 id(#app · #nav · #setSub · #main)를
         모든 제품이 붙일 수 있는 이름표(class)로 바꿨어요.

   붙이는 법 — 원래 id · class 는 그대로 두고 아래 class 만 «더해» 주세요 (JS 가 쓰는 이름은 안 바꿈)
     바깥 상자      class="cgg-app"          (메뉴 배치는 cgg-j4.js 가 lay-top · lay-side · lay-icon 를 붙임)
     머리말         class="cgg-hdr"          그 안: .cgg-top > .cgg-brand · .cgg-hdr-biz · .cgg-right   (1.6: 옛 이름 .cgg-biz 는 안 써요)
     큰 메뉴        class="cgg-nav"          단추마다 <svg class="ic">아이콘</svg><span class="lbl">이름</span>, 고른 것은 aria-selected="true"
     안쪽 작은 탭   class="cgg-sub"
     본문           class="cgg-main"
     폰 아래 탭바   <nav class="cgg-tbar"></nav>   (cgg-j4.js 의 CGG.tabbar 가 채움)
     할 일 카드     <div class="cgg-acts"></div>    (cgg-j4.js 의 CGG.todos 가 채움)
   이 파일은 각 제품 <style> 의 «맨 마지막»에 넣어요 (앞의 값을 덮어야 해서).
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --blue:#1668C4; --navy:#0B2545; --sky:#8FC9F2;
  --bg:#F3F5F8; --surface:#FFFFFF; --surface2:#F7F9FC; --text:#101828; --muted:#667085;
  --line:#EAECF0; --ln2:#E3E8EE; --hov:#F7F9FC; --tabon:#E8F1FC;
  --run:#1668C4; --run-bg:#E6F0FB; --done:#1E9E5A; --done-bg:#E4F5EC;
  --run-ink:#12599F; --done-ink:#157A45; --chk-ink:#8A5200; --stop-ink:#B42828; --due-ink:var(--chk-ink);   /* 1.13.1 받을 돈 글자색(공통 이름) */   /* 1.13 R11 — 작은 글자용 진한 색(배경은 그대로, 4.5:1 이상) */
  --chk:#B26B00; --chk-bg:#FFF2DD; --stop:#D64545; --stop-bg:#FDE8E8;
  --btn-ink:#344054; --r-card:18px; --r-ctl:12px; --ctl:43px;
  --sh:0 1px 2px #1018280d,0 12px 32px -20px #0B254540;
  /* 층 순서 (1.1) — 모든 제품이 이 값만 써요. 숫자를 직접 쓰지 않아요.
     본문 0 < 작은 탭 28 < 머리말 30 < 폰 아래 탭바 60 < 사람 단추 ▾ 70 < 창(어두운 막 + 확인 · 입력 · 자세히) 90 < 알림 글(토스트) 100 */
  --z-sub:28; --z-hdr:30; --z-tbar:60; --z-drop:70; --z-dialog:90; --z-toast:100;
  /* 뼈대 치수 (1.8) — 두 제품이 이 값만 써요 */
  --hdr-h:64px; --logo:36px; --brand-fs:16px; --brand-sub:11.5px; --biz-fs:15px; --biz-sub:12px;
  --hb-h:34px; --hb-fs:13px; --hb-gap:6px; --nav-h:56px; --pad:24px; --page-max:1600px; --h1-fs:28px; --sec-gap:16px; --cal-cell:76px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e141c;--surface:#161e28;--surface2:#1d2733;--text:#e8edf4;--muted:#95a3b6;--line:#2b3644;--ln2:#334052;
  --hov:#1d2733;--tabon:#102B47;--blue:#5FA8E8;
  --run:#5FA8E8;--run-bg:#102B47;--done:#4ad48f;--done-bg:#12312a;--chk:#f0a95e;--chk-bg:#332412;--stop:#ff8b82;--stop-bg:#331614;--run-ink:#5FA8E8;--done-ink:#4ad48f;--chk-ink:#f0a95e;--stop-ink:#ff8b82;--due-ink:var(--chk-ink);
  --sh:0 2px 10px rgba(0,0,0,.4);--btn-ink:#d0d8e2;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141c;--surface:#161e28;--surface2:#1d2733;--text:#e8edf4;--muted:#95a3b6;--line:#2b3644;--ln2:#334052;
  --hov:#1d2733;--tabon:#102B47;--blue:#5FA8E8;
  --run:#5FA8E8;--run-bg:#102B47;--done:#4ad48f;--done-bg:#12312a;--chk:#f0a95e;--chk-bg:#332412;--stop:#ff8b82;--stop-bg:#331614;--run-ink:#5FA8E8;--done-ink:#4ad48f;--chk-ink:#f0a95e;--stop-ink:#ff8b82;--due-ink:var(--chk-ink);
  --sh:0 2px 10px rgba(0,0,0,.4);--btn-ink:#d0d8e2;color-scheme:dark}

/* 한국어 줄바꿈은 낱말 단위로 («받을 금/액»처럼 끊기지 않게) */
.cgg-app,.cgg-sheet{word-break:keep-all;overflow-wrap:anywhere}
.cgg-app svg.ic,.cgg-tbar svg.ic,.cgg-acts svg.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* 1.6 — .cgg-app 밖에 놓인 부품(홈페이지 기능 카드 · 체험 띠 · 창 · 카드)도 아이콘 크기가 정해지게. :where 라서 더 구체적인 규칙이 늘 이겨요 */
:where(.cgg-cls,.cgg-trial,.cgg-dlg,.cgg-card,.cgg-head,.cgg-help) svg.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ───────── ① 틀: 가로 메뉴 (기본) ───────── */
.cgg-app{box-sizing:border-box;background:var(--bg);color:var(--text);min-height:100%}
.cgg-app *,.cgg-tbar *{box-sizing:border-box}
.cgg-hdr{box-sizing:border-box;position:sticky;top:env(safe-area-inset-top,0px);z-index:var(--z-hdr);background:var(--navy);color:#fff}
.cgg-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 22px}
.cgg-brand{display:flex;align-items:center;gap:10px;width:300px;min-width:0;flex:none}
.cgg-brand .cgg-ci{width:34px;height:34px;border-radius:10px;background:var(--sky);color:var(--navy);display:grid;place-items:center;font-weight:900;flex:none}
.cgg-brand b{font-size:16px;font-weight:900}
.cgg-brand small{display:block;font-size:11.5px;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cgg-hdr .cgg-hdr-biz{font-size:12.5px;line-height:1.35;min-width:0} .cgg-hdr .cgg-hdr-biz b{display:block;font-size:14px}
.cgg-right{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.cgg-nav{display:flex;gap:4px;padding:8px 18px 10px;background:var(--surface);overflow-x:auto;scrollbar-width:none;box-shadow:0 1px 0 var(--line)}
.cgg-nav button{flex:none;border:0;background:transparent;font:inherit;font-size:14px;color:#6B7684;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.cgg-nav button svg.ic{display:none}
.cgg-nav button:hover{color:var(--text)}
.cgg-nav button[aria-selected="true"]{color:var(--blue);background:var(--tabon);font-weight:700}
.cgg-sub{display:flex;gap:6px;padding:12px 22px 0;overflow-x:auto;scrollbar-width:none}
.cgg-sub button{flex:none;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--ln2);background:var(--surface);font:inherit;font-size:13px;cursor:pointer;color:var(--muted)}
.cgg-sub button[aria-selected="true"]{background:var(--tabon);color:var(--blue);border-color:transparent;font-weight:700}
.cgg-main{padding:22px 22px 44px}
.cgg-app :focus-visible{outline:3px solid var(--sky);outline-offset:2px}

/* ───────── ① 세로 메뉴 · 아이콘 메뉴 (넓은 화면에서만, 폰은 늘 같은 모양) ───────── */
@media (min-width:1000px){
  .cgg-app.lay-side{padding-left:252px} .cgg-app.lay-icon{padding-left:76px}
  .lay-side > .cgg-hdr,.lay-icon > .cgg-hdr{position:fixed;left:0;top:0;bottom:0;width:252px;overflow-y:auto;display:flex;flex-direction:column;padding:18px 14px;gap:3px}
  .lay-icon > .cgg-hdr{width:76px;padding:14px 0;align-items:center;gap:4px}
  .lay-side .cgg-top,.lay-icon .cgg-top{display:contents}
  .lay-side .cgg-brand{width:auto;padding:2px 4px 14px}
  .lay-side .cgg-hdr .cgg-hdr-biz{background:#ffffff0f;border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:12px;color:#ffffffb3}
  .lay-side .cgg-nav,.lay-icon .cgg-nav{order:2;flex-direction:column;background:transparent;box-shadow:none;padding:0;gap:3px;overflow:visible}
  .lay-side .cgg-nav button{position:relative;width:100%;gap:12px;font-size:14.5px;color:#ffffffb8;padding:10px 12px;text-align:left}
  .lay-side .cgg-nav button svg.ic,.lay-icon .cgg-nav button svg.ic{display:block}
  .lay-side .cgg-nav button:hover,.lay-icon .cgg-nav button:hover{background:#ffffff0d;color:#fff}
  .lay-side .cgg-nav button[aria-selected="true"]{background:#ffffff1a;color:#fff;font-weight:700}
  .lay-side .cgg-nav button[aria-selected="true"]::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--sky)}
  /* 오른쪽 위 버튼은 본문 윗줄(흰 띠)로 — 남색이 두 겹이 되지 않게 */
  .lay-side .cgg-right,.lay-icon .cgg-right{position:fixed;top:0;right:0;left:252px;z-index:calc(var(--z-hdr) - 1);height:64px;margin:0;padding:0 32px;background:var(--surface);box-shadow:0 1px 0 var(--line);justify-content:flex-end;flex-wrap:nowrap}
  .lay-icon .cgg-right{left:76px}
  .lay-side .cgg-sub,.lay-icon .cgg-sub{position:fixed;top:64px;left:252px;right:0;z-index:var(--z-sub);padding:12px 32px;background:var(--bg)}
  .lay-icon .cgg-sub{left:76px}
  .lay-side > .cgg-main,.lay-icon > .cgg-main{padding:86px 32px 44px}
  .lay-side.hasSub > .cgg-main,.lay-icon.hasSub > .cgg-main{padding-top:132px}
  .lay-icon .cgg-brand{width:auto;padding:0 0 12px} .lay-icon .cgg-brand > div{display:none}
  .lay-icon .cgg-hdr .cgg-hdr-biz{position:fixed;top:0;left:100px;height:64px;z-index:var(--z-hdr);display:flex;flex-direction:column;justify-content:center;color:var(--text)}
  .lay-icon .cgg-hdr .cgg-hdr-biz small{color:var(--muted)}
  .lay-icon .cgg-nav button{width:56px;flex-direction:column;gap:4px;font-size:10.5px;color:#ffffffa6;padding:9px 0 7px;border-radius:12px;justify-content:center}
  .lay-icon .cgg-nav button svg.ic{width:21px;height:21px}
  .lay-icon .cgg-nav button[aria-selected="true"]{background:#ffffff1f;color:#fff;font-weight:700}
  .lay-icon .cgg-nav button .lbl{white-space:nowrap;max-width:56px;overflow:hidden;text-overflow:ellipsis}
}

/* ───────── ③ 홈 할 일 카드 3장 ───────── */
.cgg-acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 16px}
.cgg-act{display:flex;align-items:center;gap:12px;padding:16px 18px;border:0;font:inherit;text-align:left;cursor:pointer;color:inherit;background:var(--surface);border-radius:var(--r-card);box-shadow:var(--sh);transition:transform .15s;min-width:0}
.cgg-act:hover{transform:translateY(-2px)}
.cgg-act .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.cgg-act .ico.chk{background:var(--chk-bg);color:var(--chk)} .cgg-act .ico.stop{background:var(--stop-bg);color:var(--stop)} .cgg-act .ico.run{background:var(--run-bg);color:var(--run)}
.cgg-act .tx{min-width:0} .cgg-act b{display:block;font-size:14.5px} .cgg-act small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.cgg-act .ar{margin-left:auto;color:var(--muted);font-size:18px}
@media (max-width:1100px){ .cgg-acts{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){ .cgg-act{transition:none} .cgg-act:hover{transform:none} }

/* ───────── ④ 사람 단추 ▾ 펼침 (1.1) — 마이페이지 · 요금제 · 휴지통 · 화면 설정 · 로그아웃 ───────── */
.cgg-drop{position:fixed;z-index:var(--z-drop);box-sizing:border-box;width:240px;max-width:calc(100vw - 16px);background:var(--surface);color:var(--text);border-radius:14px;box-shadow:0 12px 34px #0B254538;padding:8px;display:flex;flex-direction:column;word-break:keep-all}
.cgg-drop[hidden]{display:none}
.cgg-drop .who{padding:8px 12px 10px;font-size:12.5px;color:var(--muted);line-height:1.4} .cgg-drop .who b{display:block;color:var(--text);font-size:14px}
.cgg-drop button{display:flex;align-items:center;gap:9px;border:0;background:transparent;font:inherit;font-size:14px;padding:10px 12px;border-radius:9px;cursor:pointer;text-align:left;color:var(--text)}
.cgg-drop button:hover,.cgg-drop button:focus-visible{background:var(--hov)}
.cgg-drop button svg.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}
.cgg-drop button small{margin-left:auto;font-size:12px;color:var(--muted)}
.cgg-drop button .cnt{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--stop);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.cgg-drop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
/* 사람 단추 위 빨간 개수 (휴지통 건수 — 2026-10-14 「나」안) */
.cgg-badge{position:absolute;top:-7px;right:-7px;left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--stop);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;font-style:normal;line-height:1}

/* 창 · 알림 글 층 (1.1) — 제품의 창에 이 class 를 «더하거나», 제품 CSS 에서 z-index:var(--z-dialog) 로 맞춰요 */
.cgg-dialog{z-index:var(--z-dialog)!important} .cgg-toast{z-index:var(--z-toast)!important}

/* ───────── ⑤ 체험 모드 (1.2) — 미리 써 보기(가입 전) · 체험판(결제 전) 같은 모양 ───────── */
.cgg-trial{display:flex;align-items:center;gap:14px;background:var(--navy);color:#fff;border-radius:var(--r-card);padding:14px 18px;margin:0 0 16px}
.cgg-trial .tag{flex:none;background:var(--sky);color:var(--navy);font-weight:900;font-size:12.5px;border-radius:999px;padding:4px 11px}
.cgg-trial .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cgg-trial .tx b{font-size:14.5px} .cgg-trial .tx small{font-size:12.5px;opacity:.78;line-height:1.5}
.cgg-trial .go{flex:none;height:40px;padding:0 16px;border-radius:12px;border:1px solid #ffffff40;background:#ffffff14;color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.cgg-trial .prog{display:block;height:4px;border-radius:2px;background:#ffffff26;margin-top:6px;overflow:hidden}
.cgg-trial .prog i{display:block;height:100%;background:var(--sky)}
.cgg-lock{display:inline-flex;margin-left:5px;vertical-align:-2px;opacity:.75} .cgg-lock svg.ic{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cgg-left{margin-left:8px;font-size:11.5px;font-weight:700;color:var(--run);background:var(--run-bg);border-radius:999px;padding:2px 8px;white-space:nowrap}
.cgg-left.out{color:var(--muted);background:var(--bg)}
.cgg-cls{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--sh);padding:18px 20px;margin:0 0 16px}
.cgg-cls h3{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:16px} .cgg-cls h3 small{font-size:12px;color:var(--muted);font-weight:500}
.cgg-clsrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)} .cgg-clsrow:first-of-type{border-top:0}
.cgg-clsrow .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px} .cgg-clsrow .nm b{font-size:14px} .cgg-clsrow .nm small{font-size:12.5px;color:var(--muted)}
.cgg-clsrow .st{font-size:12.5px;color:var(--muted)}
.cgg-clsrow button{flex:none;white-space:nowrap;height:36px;padding:0 12px;border-radius:var(--r-ctl);border:1px solid var(--ln2);background:var(--surface);color:var(--btn-ink);font:inherit;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.cgg-k{flex:none;display:inline-flex;align-items:center;gap:3px;min-width:52px;justify-content:center;height:24px;border-radius:999px;font-size:12px;font-weight:700}
.cgg-k.lock{background:var(--stop-bg);color:var(--stop)} .cgg-k.try{background:var(--run-bg);color:var(--run)} .cgg-k.see{background:var(--done-bg);color:var(--done)}
.cgg-k svg.ic{width:12px;height:12px}
.cgg-clsrow button svg.ic{width:16px;height:16px}
@media (max-width:600px){
  .cgg-trial{flex-wrap:wrap;gap:8px 10px;padding:12px;border-radius:14px}
  .cgg-trial .tx{flex-basis:calc(100% - 70px)} .cgg-trial .go{width:100%;height:38px}
  .cgg-clsrow{flex-wrap:wrap;gap:8px 12px} .cgg-clsrow .nm{flex:1 1 calc(100% - 76px)} .cgg-clsrow button,.cgg-clsrow .st{margin-left:64px}
}

/* ═══════════ ⑥ 화면 일곱 칸 본문 (1.3) — J안 4판 값 그대로 ═══════════ */
/* ② 화면 머리: 묶음 › 화면 + 말하는 제목 + 설명 한 줄 + 오른쪽 버튼 */
.cgg-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:0 0 18px}
.cgg-head .hello{min-width:0;flex:1 1 320px}
.cgg-head .hello small{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.cgg-head .hello h1{margin:0;font-size:28px;font-weight:900;letter-spacing:-.8px;line-height:1.3;text-wrap:balance}
.cgg-head .hello h1 em{font-style:normal;color:inherit} .cgg-head.hi .hello h1 em{color:var(--blue)}  /* 1.12 대표님 10/18: 화면 제목 숫자는 홈까지 모두 기본 글자색 — 파랑은 head({hi:true})일 때만(지금 쓰는 곳 없음) */
.cgg-head .hello p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.cgg-head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
/* 버튼 — 높이 43 · 모서리 12 · 파란 버튼은 한 화면에 하나 */
.cgg-btn{height:var(--ctl);padding:0 18px;border-radius:var(--r-ctl);border:1px solid var(--ln2);background:var(--surface);font:inherit;font-weight:700;font-size:14px;color:var(--btn-ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.cgg-btn:hover{border-color:var(--muted)}
.cgg-btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 16px -8px #1668C4cc}
.cgg-btn:disabled{opacity:.45;cursor:default}
.cgg-btn svg.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cgg-card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--sh);margin:0 0 16px}
/* ⑤ 숫자 카드 4개 — 큰 숫자 + 작은 그래프 + 지난주보다 */
.cgg-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 16px}
.cgg-kpi{position:relative;padding:18px 20px;background:var(--surface);border-radius:var(--r-card);box-shadow:var(--sh);min-width:0}
.cgg-kpi small{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
/* 1.6 — 오른쪽 빈자리는 작은 그래프가 있을 때만 (그래프가 없는데 이름이 두 줄로 꺾이던 것) */
.cgg-kpi.has-sp small,.cgg-kpi:has(>svg.sp) small{padding-right:80px}
.cgg-kpi small i{width:10px;height:10px;border-radius:3px;flex:none}
.cgg-kpi strong{display:block;font-size:30px;font-weight:900;letter-spacing:-.8px;margin-top:8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cgg-kpi strong em{font-style:normal;font-size:14px;color:var(--muted);font-weight:700;margin-left:3px}
.cgg-kpi .tr{font-size:12.5px;font-weight:700;color:var(--done);margin-top:4px;display:block} .cgg-kpi .tr.dn{color:var(--stop)} .cgg-kpi .tr span{color:var(--muted);font-weight:500}
.cgg-kpi svg.sp{position:absolute;right:18px;top:18px;width:72px;height:26px}
/* ⑥ 데이터 카드 — 상태 탭+개수 · 거르기 알약 · 검색 · 표(머리 40 · 줄 50) · 쪽 */
.cgg-tabsH{display:flex;gap:2px;padding:4px 16px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.cgg-tabsH button{border:0;background:transparent;font:inherit;font-size:14px;color:var(--muted);padding:13px 10px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.cgg-tabsH button b{margin-left:5px;font-size:12px;font-weight:700;color:var(--muted);background:var(--bg);border-radius:999px;padding:1px 8px}
.cgg-tabsH button[aria-selected="true"]{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
.cgg-tabsH button[aria-selected="true"] b{background:var(--tabon);color:var(--blue)}
.cgg-filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.cgg-fp{height:32px;border:1px dashed var(--ln2);border-radius:999px;padding:0 13px;font:inherit;font-size:13px;color:var(--btn-ink);background:var(--surface);cursor:pointer}
.cgg-fp.on{border-style:solid;color:var(--blue);background:var(--tabon);font-weight:700}
.cgg-filters .sp{flex:1}
.cgg-find{height:36px;border:1px solid var(--ln2);border-radius:10px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;color:var(--muted);background:var(--surface)}
.cgg-find input{border:0;font:inherit;font-size:13.5px;width:170px;background:transparent;color:var(--text);outline:0}
.cgg-twrap{overflow-x:auto}
.cgg-table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;min-width:900px;table-layout:fixed}
.cgg-table th{height:40px;padding:0 14px;text-align:left;font-size:12.5px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface);white-space:nowrap;cursor:pointer;user-select:none}
.cgg-table td{height:50px;padding:0 14px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--surface)}
.cgg-table tbody tr:hover td{background:var(--hov)}
.cgg-table .n{text-align:right;font-variant-numeric:tabular-nums} .cgg-table .c{text-align:center}
.cgg-table .fx0{position:sticky;left:0;z-index:1;text-align:center;width:56px}
.cgg-table .fx1{position:sticky;left:56px;z-index:1;font-weight:700;box-shadow:6px 0 6px -6px #0B254522}
.cgg-table .nm{border:0;background:transparent;font:inherit;font-weight:700;color:inherit;cursor:pointer;padding:0;text-align:left}
.cgg-table .nm:hover{color:var(--blue);text-decoration:underline}
/* 1.6 — 두 줄 칸: render 가 {html:'<span class="a">윗줄</span><span class="b">아랫줄</span>'} 을 주면 표 · 폰 목록 모두 두 줄 */
.cgg-table td>.a,.cgg-table td>.b,.cgg-mrow .r>b>.a,.cgg-mrow .r>b>.b{display:block;line-height:1.25;overflow:hidden;text-overflow:ellipsis}
.cgg-table td>.b,.cgg-mrow .r>b>.b{font-size:11.5px;font-weight:600;color:var(--muted)}
.cgg-mrow .r>b>.a,.cgg-mrow .r>b>.b{text-align:right}
.cgg-app input[type=checkbox],.cgg-dlg input[type=checkbox]{appearance:none;-webkit-appearance:none;margin:0;width:20px;height:20px;border:1.5px solid var(--ln2);border-radius:6px;background:var(--surface);display:inline-grid;place-content:center;cursor:pointer;vertical-align:middle}
.cgg-app input[type=checkbox]::after,.cgg-dlg input[type=checkbox]::after{content:"";width:10px;height:6px;border:2.2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.cgg-app input[type=checkbox]:checked,.cgg-dlg input[type=checkbox]:checked{background:var(--blue);border-color:var(--blue)}
.cgg-app input[type=checkbox]:checked::after,.cgg-dlg input[type=checkbox]:checked::after{opacity:1}
/* 상태 칩 4가지 (진행 중 · 완료 · 확인 필요 · 보류) */
.cgg-st{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:6px;font-size:12px;font-weight:700;white-space:nowrap}
.cgg-st.run{background:var(--run-bg);color:var(--run)} .cgg-st.done{background:var(--done-bg);color:var(--done)} .cgg-st.chk{background:var(--chk-bg);color:var(--chk)} .cgg-st.stop{background:var(--stop-bg);color:var(--stop)}
.cgg-pager{display:flex;align-items:center;gap:8px;padding:12px 16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.cgg-pager .sp{flex:1} .cgg-pager .cgg-btn{height:34px;padding:0 12px;font-size:13px}
.cgg-pager select,.cgg-mhead select{height:34px;border:1px solid var(--ln2);border-radius:10px;background:var(--surface);color:var(--text);font:inherit;font-size:13px;padding:0 10px}
.cgg-empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}
/* 줄 버튼 (1.4) — 표 맨 오른쪽 «할 일» 칸. 작은 흰 버튼, 한 줄에 둘까지. 파란 버튼은 줄 안에 쓰지 않아요 */

/* 구역 머리 (할 일 · 카드) */
.cgg-sec{margin:0 0 var(--sec-gap)}

.cgg-sech b{font-size:16px;font-weight:800}
.cgg-link{margin-left:auto;border:0;background:transparent;font:inherit;font-size:13.5px;font-weight:700;color:var(--blue);cursor:pointer;padding:4px 0}
.cgg-sec .cgg-acts{margin:0}
.cgg-act[data-act] .tx b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cgg-notice{margin:0 0 var(--sec-gap)}
.cgg-cardh{display:flex;align-items:center;gap:6px;padding:16px 18px 0}
.cgg-cardh b{font-size:16px;font-weight:800}
.cgg-cardh .sp{flex:1}
.cgg-cardh .cgg-btn.sm{height:30px}
/* 홈 아래: 일정 달력 | 오른쪽 칸 두 개 */
.cgg-homegrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:var(--sec-gap);align-items:start;margin:0 0 var(--sec-gap)}
.cgg-homegrid .cgg-card{margin:0}
.cgg-homeside{display:flex;flex-direction:column;gap:var(--sec-gap);min-width:0}
/* 일정 달력 */
.cgg-cal .ym{padding:4px 18px 0;font-size:13px;color:var(--muted)}
.cgg-cal .dow,.cgg-cal .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;padding:0 18px}
.cgg-cal .dow{padding-top:10px;padding-bottom:6px;font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.cgg-cal .dow span:first-child{color:var(--stop)} .cgg-cal .dow span:last-child{color:var(--blue)}
.cgg-cal .d{box-sizing:border-box;min-width:0;height:var(--cal-cell);border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:6px 7px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;font:inherit;color:inherit;text-align:left;cursor:pointer;overflow:hidden}
.cgg-cal .d.e{border:0;background:transparent;cursor:default}
.cgg-cal .d:hover:not(.e){border-color:var(--blue)}
.cgg-cal .d .n{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:4px;width:100%}
.cgg-cal .d.sun .n{color:var(--stop)} .cgg-cal .d.sat .n{color:var(--blue)}
.cgg-cal .d .n i{font-style:normal;font-size:10px;font-weight:800;background:var(--blue);color:#fff;border-radius:6px;padding:0 5px;line-height:16px}
.cgg-cal .d.today{border-color:var(--blue);box-shadow:0 0 0 2px var(--tabon)}
.cgg-cal .d.chk{background:var(--chk-bg)} .cgg-cal .d.stop{background:var(--stop-bg)}
.cgg-cal .d .amt{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.cgg-cal .d .amt .s{display:none}
.cgg-cal .d .mk{display:flex;gap:3px;flex-wrap:wrap;margin-top:auto}
.cgg-cal .d .mk span{font-size:10.5px;font-weight:800;border-radius:5px;padding:0 4px;line-height:15px}
.cgg-cal .mk .run,.cgg-cal .lg .run{background:var(--run-bg);color:var(--run)} .cgg-cal .mk .done,.cgg-cal .lg .done{background:var(--done-bg);color:var(--done)}
.cgg-cal .mk .chk,.cgg-cal .lg .chk{background:var(--chk-bg);color:var(--chk)} .cgg-cal .mk .stop,.cgg-cal .lg .stop{background:var(--stop-bg);color:var(--stop)}
.cgg-cal .lg{display:flex;flex-wrap:wrap;gap:6px 14px;padding:12px 18px 16px;font-size:12.5px;color:var(--muted)}
.cgg-cal .lg span{display:inline-flex;align-items:center;gap:5px} .cgg-cal .lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* 오른쪽 칸 */
.cgg-side{padding-bottom:16px}

.cgg-side .big em{font-style:normal;font-size:13px;color:var(--muted);font-weight:700;margin-left:3px}
.cgg-side .bar{margin:10px 18px 0;height:10px;border-radius:5px;background:var(--bg);overflow:hidden}
.cgg-side .bar i{display:block;height:100%;background:var(--done);border-radius:5px}
.cgg-side .lgd{display:flex;flex-wrap:wrap;gap:4px 14px;padding:8px 18px 0;font-size:12.5px;color:var(--muted)}
.cgg-side .lgd b{color:var(--text)} .cgg-side .lgd b.done{color:var(--done)} .cgg-side .lgd b.chk{color:var(--chk)} .cgg-side .lgd .pc{margin-left:auto;font-weight:800;color:var(--text)}
.cgg-side dl{margin:12px 18px 0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;border-top:1px solid var(--line);padding-top:10px}
.cgg-side dt{color:var(--muted)} .cgg-side dd{margin:0;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.cgg-side .sub{margin:4px 18px 0;font-size:12.5px;color:var(--muted)}
.cgg-side .rk{display:flex;flex-direction:column;gap:9px;padding:12px 18px 0}
.cgg-side .rk .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13.5px}
.cgg-side .rk .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .cgg-side .rk .v{font-weight:800;font-variant-numeric:tabular-nums}
.cgg-side .rk .b{grid-column:1/-1;height:6px;border-radius:3px;background:var(--bg);overflow:hidden} .cgg-side .rk .b i{display:block;height:100%;background:var(--blue);border-radius:3px}
@media (max-width:1100px){ .cgg-homegrid{grid-template-columns:minmax(0,1fr)} }
@media (max-width:600px){
  :root{--hdr-h:48px;--logo:26px;--brand-fs:14px;--hb-h:34px;--pad:12px;--h1-fs:19px;--sec-gap:10px;--cal-cell:58px}
  .cgg-brand .cgg-ci{border-radius:8px;font-size:12px}

  .cgg-hb{background:#ffffff12;border-color:#ffffff30;color:#fff;padding:0 10px}
  .cgg-main{padding:12px var(--pad) 18px}
  .cgg-sech b{font-size:14.5px} .cgg-link{font-size:12.5px}
  .cgg-cardh{padding:12px 12px 0} .cgg-cardh b{font-size:14.5px} .cgg-cardh .cgg-btn.sm{height:28px;padding:0 8px;font-size:11.5px}
  .cgg-cal .ym{padding:2px 12px 0} .cgg-cal .dow,.cgg-cal .grid{gap:3px;padding:0 10px} .cgg-cal .d{padding:4px 3px;border-radius:8px}
  .cgg-cal .d .n{font-size:11px} .cgg-cal .d .n i{display:none} .cgg-cal .d .amt{font-size:10.5px} .cgg-cal .d .amt .w{display:none} .cgg-cal .d .amt .s{display:inline}
  .cgg-cal .d .mk span{font-size:9.5px;padding:0 3px;line-height:13px} .cgg-cal .lg{padding:10px 12px 12px;font-size:11.5px}
  .cgg-side .big{padding:8px 12px 0;font-size:21px} .cgg-side .bar{margin:8px 12px 0} .cgg-side .lgd,.cgg-side .rk{padding-left:12px;padding-right:12px} .cgg-side dl{margin:10px 12px 0} .cgg-side .sub{margin:4px 12px 0}
}

/* 1.8 보강 — 업체명 우선: 자리가 모자라면 접기 (CGG.header 가 cgg-fold1 · cgg-fold2 를 붙여요) */
.cgg-hb.cgg-more{display:none}
.cgg-top.cgg-fold1 .cgg-hfind .in{display:none}
.cgg-top.cgg-fold1 .cgg-hfind .ph{display:grid;place-items:center;width:var(--hb-h);height:var(--hb-h);border-radius:10px;border:1px solid #ffffff30;background:#ffffff12;color:#fff;cursor:pointer;padding:0}
.cgg-top.cgg-fold1 .cgg-hfind .ph svg.ic{width:17px;height:17px}
.cgg-top.cgg-fold2 .cgg-right .cgg-wide{display:none}
.cgg-top.cgg-fold2 .cgg-hb.cgg-more{display:inline-flex}
@media (min-width:1000px){ .lay-side .cgg-top.cgg-fold1 .cgg-hfind .ph,.lay-icon .cgg-top.cgg-fold1 .cgg-hfind .ph{border-color:var(--ln2);background:var(--surface);color:var(--btn-ink)} }
/* 줄 높이를 뼈대가 정해요 — 제품 body 줄 높이와 상관없이 같은 크기 (워시 방 알림 10/18) */
.cgg-top,.cgg-head,.cgg-quick,.cgg-sec,.cgg-acts,.cgg-kpis,.cgg-cal,.cgg-side,.cgg-help{line-height:1.45}
.cgg-act .tx b,.cgg-act .tx small{line-height:1.45}
.cgg-act .tx{min-width:0} .cgg-act .tx b,.cgg-act .tx small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}   /* 할 일 카드 높이가 글 길이로 달라지지 않게 */
/* 폰: 머리말에 업체명을 보여요 (제품 이름 대신) — 두 줄까지, 자르지 않음 */
@media (max-width:600px){
  .cgg-top .cgg-brand b,.cgg-top .cgg-brand small{display:none}
  .cgg-hdr .cgg-top .cgg-hdr-biz{display:block;flex:1 1 auto;max-width:none;min-width:0}
  .cgg-hdr .cgg-top .cgg-hdr-biz b{font-size:13.5px;line-height:1.2;display:-webkit-box;-webkit-box-orient:vertical;overflow:visible}
  .cgg-hdr .cgg-top .cgg-hdr-biz small{display:none}
  .cgg-top .cgg-hb[data-hb="refresh"] span{display:none}
  .cgg-top .cgg-hb[data-hb="refresh"]{padding:0;width:var(--hb-h);justify-content:center}
  .cgg-top .cgg-hb.cgg-me{max-width:92px;overflow:visible} .cgg-top .cgg-hb.cgg-me>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}

@media (min-width:1000px){
  /* 세로 · 아이콘 배치: 단추 줄이 넘치면 오른쪽으로 넘치게 해서(접기 판단용) 왼쪽 메뉴 위로 겹치지 않게 */
  .lay-side .cgg-right,.lay-icon .cgg-right{justify-content:flex-start;overflow:hidden}
  .lay-side .cgg-right>:first-child,.lay-icon .cgg-right>:first-child{margin-left:auto}
  /* 왼쪽 메뉴 안 업체명은 칸 폭을 다 써요 (두 줄까지, 자르지 않음) */
  .lay-side .cgg-hdr .cgg-hdr-biz{max-width:none;flex:none}
  .lay-side .cgg-hdr .cgg-hdr-biz small{white-space:normal;overflow:visible}
}

/* 기능 찾기 칸이 몰래 줄어들지 않게 (두 제품이 같은 때 접히도록) */
.cgg-right .cgg-hfind{flex:none}

/* 1.8 보강 — 세로 · 아이콘 배치에서 오픈 베타 띠가 머리말에 가려지지 않게 (체크 방 알림 10/18)
   띠를 맨 위에 붙이고(--beta-h = 띠 높이, CGG.layout 이 잼), 붙어 있는 머리말 · 윗줄 · 작은 탭 · 본문을 그만큼 내려요 */
@media (min-width:1000px){
  html.cgg-lay-fixed .cgg-beta{position:fixed;top:0;left:0;right:0;z-index:calc(var(--z-hdr) + 2)}
  .lay-side > .cgg-hdr,.lay-icon > .cgg-hdr{top:var(--beta-h,0px)}
  .lay-side .cgg-right,.lay-icon .cgg-right{top:var(--beta-h,0px)}
  .lay-side .cgg-sub,.lay-icon .cgg-sub{top:calc(64px + var(--beta-h,0px))}
  .lay-side > .cgg-main,.lay-icon > .cgg-main{padding-top:calc(var(--hdr-h) + 22px + var(--beta-h,0px))}
  .lay-side.hasSub > .cgg-main,.lay-icon.hasSub > .cgg-main{padding-top:calc(132px + var(--beta-h,0px))}
  .lay-icon .cgg-hdr .cgg-hdr-biz{top:var(--beta-h,0px)}
}

/* 1.8 최종 — 워시 · 체크 방 알림 10/18
   ① 메뉴 줄도 뼈대 줄 높이 1.45 (위 메뉴 58px)  ② 좁은 PC(600~900)에서 머리말이 넘치면 셋째로 접어요:
   제품 이름 글자를 숨기고 로고만 둬요. 업체명은 남은 폭을 다 쓰고 두 줄까지 보여요(자르지 않음)  ③ 자동 새로고침 고르기 칸 폭 */
.cgg-nav,.cgg-navsub,.cgg-nav button,.cgg-navsub button{line-height:1.45}
select.cgg-hb{width:auto}
.cgg-top.cgg-fold3 .cgg-brand{width:auto}
.cgg-top.cgg-fold3 .cgg-brand > div{display:none}
.cgg-hdr .cgg-top.cgg-fold3 .cgg-hdr-biz{flex:1 1 auto;max-width:none;min-width:0}
/* ④ 화면 안 작은 탭이 메뉴 아래 칸 줄과 겹치지 않게 — 601px 이상에서는 아래 칸이 늘 보여요(가로: 메뉴 밑 줄 / 세로: 왼쪽 펼침).
   제품 화면 안에 같은 아래 칸을 또 그리는 줄에는 class="cgg-dup-sub" 를 붙여요. 폰(600 이하)에서만 보여요 */
@media (min-width:601px){ .cgg-dup-sub{display:none !important} }

/* ═════════ 1.9 — 새 규칙(.claude/skills/chagotgan-builder/SKILL.md) 맞춤 · 대표님 10/18 «화면 통합은 출시 전에» ═════════ */
/* 숫자 칸 4개: 가운데 정렬 · 자릿수 맞춤. 작은 그래프는 오른쪽 위 그대로 (워시 시안 v132) */
.cgg-kpi .tr{display:block} .cgg-kpi strong{font-variant-numeric:tabular-nums}
.cgg-kpi{text-align:center}
.cgg-kpi small{justify-content:center}
/* 도구줄 안 칸 · 단추 높이 43px (폰 42px) */
.cgg-find,.cgg-fp,.cgg-filters .cgg-btn.sm,.cgg-tools .cgg-btn.sm,.cgg-pager .cgg-btn,.cgg-pager select,.cgg-mhead select,.cgg-clsrow button,.cgg-mbtn,.cgg-band .cgg-btn{height:var(--ctl)}
.cgg-fp{padding:0 16px;font-size:13.5px}
.cgg-filters .cgg-btn.sm{padding:0 14px;font-size:13.5px}
@media (max-width:600px){
  :root{--ctl:42px}
  .cgg-btn,.cgg-head .acts .cgg-btn,.cgg-pager .cgg-btn,.cgg-trial .go{height:var(--ctl)}
}
/* 표 체크칸 크게 (이름 칸은 1.6부터 틀 고정 .fx1) */
.cgg-table input[type=checkbox],.cgg-mlist input[type=checkbox]{width:22px;height:22px}
/* 할 일 띠 + [해결하러 가기] — CGG.todoBand (워시 시안 v132 모양: 색 바탕 · 굵은 글 한 줄 · 오른쪽 파란 단추) */
.cgg-band{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-radius:var(--r-card);padding:12px 16px;margin:0 0 var(--sec-gap);font-weight:700;line-height:1.45;background:var(--chk-bg);color:var(--chk)}
.cgg-band .tx{flex:1 1 240px;min-width:0}
.cgg-band .cgg-btn{flex:none}
.cgg-band.stop{background:var(--stop-bg);color:var(--stop)}
.cgg-band.run{background:var(--run-bg);color:var(--run)}
.cgg-band.done{background:var(--done-bg);color:var(--done)}
/* 달력식 달 고르기 — CGG.monthPick (가운데 창 · 4×3 칸 높이 52) */
.cgg-mpick{display:inline-flex}
.cgg-mbtn b{font-variant-numeric:tabular-nums}
.cgg-myr{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.cgg-myr b{font-size:18px;font-variant-numeric:tabular-nums}
.cgg-dlg .cgg-myr .cgg-btn{flex:none;width:auto;height:36px;padding:0 12px}
.cgg-mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cgg-mgrid button{height:52px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font:inherit;font-weight:700;cursor:pointer}
.cgg-mgrid button:hover{background:var(--hov)}
.cgg-mgrid button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.cgg-mgrid button.now:not([aria-pressed="true"]){border-color:var(--blue);color:var(--blue)}
.cgg-mgrid button:disabled,.cgg-myr button:disabled{opacity:.35;cursor:default}
/* 머리말 «연결됨» — 초록 점(8px · 바깥 고리 3px) + 글, 테두리 없음 */
.cgg-hb.cgg-conn{background:transparent;border-color:transparent;gap:6px}
.cgg-hb.cgg-conn i{width:8px;height:8px;border-radius:50%;background:#3DD68C;box-shadow:0 0 0 3px #3DD68C33;flex:none}
@media (min-width:1000px){ .lay-side .cgg-hb.cgg-conn,.lay-icon .cgg-hb.cgg-conn{border-color:transparent;color:var(--done)} }
/* 사람 단추 두 줄: 위 «김대표 ▾», 아래 작게 «마이페이지 · 휴지통» (폰은 아래 줄 숨김) */
.cgg-hb.cgg-me{height:auto;min-height:var(--hb-h);padding-block:3px;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;line-height:1.2}
.cgg-hb.cgg-me small{font-size:10.5px;opacity:.75;font-weight:500}
@media (max-width:600px){ .cgg-hb.cgg-me small{display:none} }
/* 머리말 [찾기] 단추 → 기능 찾기 창 */
.cgg-hb.cgg-findbtn{gap:6px} .cgg-hb.cgg-findbtn svg.ic{width:16px;height:16px}
.cgg-finddlg{min-height:260px}
.cgg-finddlg label.in{flex-direction:row;margin:0}
.cgg-finddlg input::placeholder{color:var(--muted)}

<style>
/* 차곳간 딜러앱 d4.0 — 제품 CSS (공통 부품 cgg-j4 1.13.2 다음에 붙어요 · 1.13.2 토큰만 써요)
   ① 바탕 글꼴 ② 로그인 · 이용 동의 화면(앱 틀 밖) ③ 미리보기 11판 «딜러앱» 화면 안 상자(.bx · .dph · .dlog · .dbills …) */
html,body{margin:0;background:var(--bg)}
body{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;color:var(--text);word-break:keep-all;overflow-wrap:anywhere}
[hidden]{display:none!important}

/* ② 로그인 · 이용 동의 (앱 틀 밖 · 폰과 PC 같은 화면 하나) */
.lg{min-height:100vh;min-height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.lg-demo{width:100%;max-width:440px;box-sizing:border-box;background:var(--chk-bg);color:var(--chk-ink);font-size:12.5px;font-weight:700;text-align:center;padding:6px 10px;border-radius:10px;margin-bottom:12px}
.lg-card{width:100%;max-width:440px;box-sizing:border-box;background:var(--surface);border-radius:var(--r-card);box-shadow:var(--sh);padding:28px 24px;display:flex;flex-direction:column;gap:12px}
.lg-brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px;color:var(--navy)}
.lg-brand .ci{width:40px;height:40px;border-radius:12px;background:var(--navy);display:grid;place-items:center;flex:none}
.lg-brand .ci img{width:28px;height:28px}
.lg-card h2{margin:8px 0 0;font-size:24px;line-height:1.3;font-weight:900;letter-spacing:-.02em}
.lg-card p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.lg-card label.t{font-size:13px;font-weight:700;color:var(--muted)}
.lg-in{height:52px;box-sizing:border-box;border:1px solid var(--ln2);border-radius:var(--r-ctl);padding:0 14px;font:inherit;font-size:18px;background:var(--surface);color:var(--text);width:100%}
.lg-in:focus,.lg-otp input:focus{outline:3px solid var(--sky);outline-offset:1px;border-color:var(--blue)}
.lg-otp{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.lg-otp input{height:56px;box-sizing:border-box;border:1px solid var(--ln2);border-radius:12px;text-align:center;font:inherit;font-size:22px;font-weight:800;background:var(--surface);color:var(--text);min-width:0;padding:0}
.lg-card .cgg-btn{width:100%;justify-content:center;min-height:48px;font-size:16px}
.lg-link{border:0;background:none;color:var(--blue);font:inherit;font-weight:700;font-size:14px;padding:8px;cursor:pointer;align-self:center}
.lg-err{color:var(--stop-ink);font-weight:700;font-size:14px;margin:0}
.lg-foot{font-size:12.5px!important}
.lg-note{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--muted);line-height:1.6}
.lg-all{display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;border-radius:14px;padding:14px 16px;cursor:pointer}
.lg-all small{color:var(--sky)}
.lg-list{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.lg-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.lg-row:first-child{border-top:0}
.lg-row label{display:flex;align-items:center;gap:12px;flex:1;cursor:pointer;font-size:14.5px}
.lg-row button{border:0;background:none;color:var(--blue);font:inherit;font-weight:700;font-size:13px;cursor:pointer;padding:6px}
.lg-doc{white-space:pre-wrap;max-height:40vh;overflow:auto;padding:12px 14px;border-top:1px solid var(--line);background:var(--bg);font-size:13px;color:var(--muted);line-height:1.6}
.lg input[type=checkbox]{width:22px;height:22px;accent-color:var(--blue);flex:none}

/* ③ 화면 안 상자 — 미리보기 11판과 같은 모양 */
.bx{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--sh);padding:18px 20px;margin:0 0 var(--sec-gap);line-height:1.5}
.bx h3{margin:0 0 4px;font-size:16px;font-weight:800}
.bx p.d{margin:0 0 12px;color:var(--muted);font-size:13.5px}
.fm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.fm label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.fm input{height:var(--ctl);box-sizing:border-box;border:1px solid var(--ln2);border-radius:var(--r-ctl);padding:0 12px;font:inherit;font-size:14px;background:var(--surface);color:var(--text);min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.ck{display:flex;gap:8px;align-items:center;font-size:14px;margin:6px 0;cursor:pointer}
.ck input{width:20px;height:20px;accent-color:var(--blue);flex:none}
.dph{height:160px;border-radius:12px;background:linear-gradient(135deg,var(--tabon),var(--bg));display:grid;place-items:center;color:var(--muted);font-weight:700;margin:12px 0;position:relative;overflow:hidden}
.dph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dph small{position:absolute;right:8px;bottom:8px;background:rgba(11,37,69,.72);color:#fff;border-radius:6px;padding:2px 8px;font-size:12px}
button.dph{width:100%;border:0;padding:0;font:inherit;cursor:zoom-in}
.dlog{margin:0 0 10px;padding-left:18px;display:grid;gap:6px;font-size:14px}
.dlog li b{font-variant-numeric:tabular-nums}
.dlog li small{color:var(--muted);margin-left:4px}
.dlog li.now{font-weight:700}
.dbills{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--sec-gap);margin-bottom:var(--sec-gap)}
.dbill{margin:0}
.dbh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dbm{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.dbm strong{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums} .dbm strong small{font-size:14px;margin-left:2px;color:var(--muted)}
.dbm span{font-size:13px;color:var(--muted)}
.dbm span.late{color:var(--stop-ink);font-weight:700}
.dacct{font-size:12.5px;color:var(--muted);margin-top:4px}
.dphoto figure{margin:0 0 10px} .dphoto img{width:100%;border-radius:12px;display:block} .dphoto figcaption{font-size:12px;color:var(--muted);margin-top:4px}
.dcopy{width:100%;box-sizing:border-box;border:1px solid var(--ln2);border-radius:var(--r-ctl);padding:12px;font:inherit;background:var(--surface);color:var(--text)}
.ddoc{white-space:pre-wrap;max-height:55vh;overflow:auto;background:var(--bg);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--muted);line-height:1.6}
.dver{margin:10px 0 0;color:var(--muted);font-size:12.5px}
@media (max-width:760px){ .bx{padding:14px 14px;margin-bottom:12px} .fm{grid-template-columns:1fr} .lg-card{padding:22px 18px} }
</style>
</head>

  <nav class="cgg-tbar" id="tbar"></nav>

<script>
/* ═══════════════════════════════════════════════════════════════════
   차곳간 공통 부품 · J안 4판 · cgg-j4 1.13.2 (2026-10-19 · 챗지피티 검수 3 고침 F03 · F04 · F06 · F15 · F17 · F18 · 칩 묶음) ← 1.13.1 · 1.13 (2026-10-18, 디자인 방 · 1.12 확정본 + 검수 고침 R02~R05 · R08 · R11~R14)
   1.12 바뀐 것: ⑫ 워시 · 체크 통합 대조표 대표님 확정(74줄 추천 그대로) — 워시 모양을 공통 부품으로
     숫자 칸: 점 없음 · 단위도 같은 크기 · 뜻 색(tone: in 초록 · due 주황 · out · zero 회색, 0은 저절로 회색)
     표: 위 «찾기 칸(넓게) · 거르기 칩 · 20개씩 · 선택한 줄 지우기(빨강)», 칸 머리 ↕ 정렬 표시, 할 일 단추는 표 아래 줄, 아래 «처음 · 이전 · 1 / 1 · 모두 N건 · 다음 · 맨뒤»
     제목 위 작은 글에 오늘 날짜(«세금계산서 · 10월 18일 일요일») · 본문 폭은 --page-max 그대로(제품이 덮어쓰지 않아요)
   1.11 바뀐 것: ⑪ 설정 항목 목록이 메뉴 모양 설정을 따라요(대표님 10/18 · 10/15 규칙) — 가로(위) 배치면 메뉴 밑 줄에 가로로, 세로(왼쪽) 배치면 왼쪽에 세로로(넓은 화면). 아이콘 배치와 좁은 화면(1000 미만)은 메뉴 밑 가로 줄.
     아래 칸 목록에 묶음 이름 {group:"워시 전용"} 을 넣을 수 있어요 — 제품 전용 항목을 맨 아래 한 묶음으로 보여 줘요. 폰은 «전체» 판에서 같은 차례
   1.10 바뀐 것: ⑩ 머리말 왼쪽 «차» 글자 네모 → 차곳간 대표 CI(심볼 — 곳간 지붕 + 확인 표시 + 차). 남색 머리말 위 흰색 판, 폰 · PC 같은 크기
     CGG.CI.white · small · blue · favicon (그림 글자 data:), CGG.favicon() — 브라우저 탭 아이콘을 같은 CI 로. 파일은 디자인/공통/ci/
   1.9 바뀐 것: ⑨ 새 규칙(.claude/skills/chagotgan-builder/SKILL.md) 맞춤 — 대표님 10/18 «화면 통합은 출시 전에»
     머리말 작은 줄에 날짜(o.date) · 단추 이름 «주소» · «연결됨»(초록 점) · 사람 단추 두 줄 · find.mode:"button"(찾기 단추 → 창)
     CGG.todoBand(할 일 띠 + [해결하러 가기]) · CGG.monthPick(달력식 달 고르기 창) · CGG.findDialog · CGG.myPage(요금제 · 사용량 · 내 계정) — 모양은 워시 통합 시안 v132 와 같게
     CSS: 숫자 칸 가운데 정렬 · 도구줄 칸 · 단추 43px(폰 42px) · 표 체크칸 크게
   1.8 바뀐 것: ⑧ 페이지 뼈대 — 대표님 지적(10/18) «워시 · 체크가 너무 다르다» → 두 제품이 같은 뼈대 · 같은 크기(CSS 변수 한 벌)
     CGG.header(머리말 윗줄) · CGG.home(홈 차례) · CGG.todoBlock(할 일 3장 + 모두 보기) · CGG.calendar(일정 달력) · CGG.moneyCard(이번 달 입금) · CGG.rankCard(이번 달 일감)
     통합 검사표: 디자인/통합검사/ (숫자로 재서 두 제품이 같은지 확인)
   1.7 바뀐 것:
   1.7 바뀐 것: ⑦ 메뉴 찾기 — 대표님 결정(10/18) «A 왼쪽 메뉴 늘 펼침 + C 기능 찾기 + D 홈 바로가기»
     CGG.nav(메뉴 상자, 묶음, 지금, 고르면) · CGG.allMenu(묶음, 지금, 고르면, 기능 목록, 기능 가면) · CGG.find(상자, 기능 목록, 가면) · CGG.quick(상자, 기능 목록, 저장 이름, 처음 것, 가면) · CGG.spot(칸)
     메뉴 · 기능 목록은 디자인/메뉴지도/워시_메뉴.js · 체크_메뉴.js 를 그대로 붙여요. 처음 메뉴 배치는 «세로»
   1.6 바뀐 것:
   1.6 바뀐 것: 표 rowId(줄 id로 고르기) · render 기본 esc({html} 일 때만 HTML) · 창 열 때 화면이 아래로 안 밀림 · 숫자 카드 has-sp · 아이콘 refresh · alert
   ① 메뉴 배치 셋  ② 폰 아래 탭바  ③ 홈 할 일 카드 3장  ④ 사람 단추 ▾ 펼침 (1.1)  ⑤ 체험 모드 (1.2)  ⑥ 본문 (1.3)
   바탕: 관리 v4.0 의 관리/v4재료/j4.js. 관리 전용 이름(TAB · render · NAV)에 묶이지 않게
         «무엇을 보여 줄지»와 «눌렀을 때 할 일»을 제품이 넘겨 주는 식으로 바꿨어요.
   서버를 부르지 않아요. 저장은 «이 기기에만»(localStorage) — 못 쓰면 가로 메뉴로 그냥 보여요.

   쓰는 법 (이 파일 내용을 제품 스크립트보다 «먼저» 따로 <script> 하나로 넣고, 제품 스크립트 안에서)
     CGG.layout.init(document.querySelector(".cgg-app"), "cgg_check_layout");   // 저장 이름은 제품마다
     CGG.layout.chooser(상자, function(v){ 창 닫기 · 알림 });                     // 화면 설정 창 안에 고르기 칸 그리기
     CGG.tabbar(document.querySelector(".cgg-tbar"),
       [{key:"home",icon:"home",label:"홈"}, … 5칸], 지금 key, function(key){ 화면 이동 });
     CGG.todos(document.querySelector(".cgg-acts"),
       [{tone:"chk",icon:"car",title:"출고 확인 3대",sub:"한빛모터스 외 2곳 · 오늘"}, … 3장], function(i){ 그 화면으로 });
     CGG.menu(사람단추, {name:"홍길순", role:"대표"}, [                                    // 1.1
       {key:"me",icon:"user",label:"마이페이지"}, {key:"trash",icon:"trash",label:"휴지통",count:3}, "-",
       {key:"lay",icon:"pc",label:"화면 설정",note:CGG.layout.name()}, "-", {key:"out",icon:"out",label:"로그아웃"}], function(key){ … });
     CGG.badge(사람단추, 3);   // 사람 단추 위 빨간 개수 (0이면 숨김)
   tone: run(파랑 · 진행 중) · chk(주황 · 확인 필요) · stop(빨강 · 보류)
   ═══════════════════════════════════════════════════════════════════ */
var CGG = (function(){

    gear:'<circle cx="12" cy="12" r="3"/><path d="M19 12h2M3 12h2M12 3v2M12 19v2M17 7l1.4-1.4M5.6 18.4L7 17M17 17l1.4 1.4M5.6 5.6L7 7"/>',

     ① 안 보낸 청구서가 있으면 «청구서 보낼 딜러 N명이 있어요» ② 받을 돈이 남으면 «받을 금액 ○원이 남아 있어요» ③ 다 들어왔으면 «받을 금액이 모두 들어왔어요».

  /* ═════════ ⑨ 1.9 — 새 규칙 부품 ═════════ */
  /* 할 일 띠 + [해결하러 가기] — 일 화면 «제목 + 설명» 바로 아래 (SKILL.md 4. 화면 뼈대 · 워시 시안 v132 모양)
     o = {text:"출고했는데 아직 입금 안 된 차 6대 · 510,000원", count:6, tone:"chk"(주황 · 확인 필요) | "stop"(빨강 · 막힘) | "run"(파랑), go:"해결하러 가기", onGo:fn}
     count 가 0이면 초록 띠에 o.empty(없으면 «지금 처리할 일이 없어요»), 단추 없음. 글은 한 줄 */
  function todoBand(el, o){ if(!el) return; o=o||{}; var n=o.count==null?1:(Number(o.count)||0), t=n?(["chk","stop","run"].indexOf(o.tone)>=0?o.tone:"chk"):"done";

    el.innerHTML='<span class="tx">'+esc(n?(o.text||""):(o.empty||"지금 처리할 일이 없어요"))+'</span>'
      +(n&&o.onGo?'<button type="button" class="cgg-btn pri" data-go="1">'+esc(o.go||"해결하러 가기")+'</button>':'');
    var b=el.querySelector("[data-go]"); if(b) b.onclick=function(){ o.onGo(); }; }
  /* 달력식 달 고르기 — 선택 상자 대신 (SKILL.md 5. 날짜 · 달 고르기 · 워시 시안 v132 모양)
     el 은 빈 칸. o = {y:2026, m:10, min:"2024-01", max:"2026-12", today:{y,m}(없으면 오늘), onPick:function(y,m){}}
     단추 «2026년 10월 ▾»를 누르면 가운데 창(form)에 «‹ 2025 | 2026년 | 2027 ›» + 4×3 달 칸. 고른 달 = 파랑 채움, 오늘 달 = 파란 테두리 */
  function monthPick(el, o){ if(!el) return {}; o=o||{}; var now=new Date(), y=Number(o.y)||now.getFullYear(), m=Number(o.m)||now.getMonth()+1;
    var ty=o.today?Number(o.today.y):now.getFullYear(), tm=o.today?Number(o.today.m):now.getMonth()+1;
    function key(a,b){ return a*100+b; } function lim(s2){ if(!s2) return null; var p=String(s2).split("-"); return key(Number(p[0]),Number(p[1])); }
    var lo=lim(o.min), hi=lim(o.max);

    function label(){ btn.querySelector("b").textContent=y+"년 "+m+"월"; }
    function body(vy){ var h='<div class="cgg-myr"><button type="button" class="cgg-btn sm" data-y="-1"'+(lo&&key(vy-1,12)<lo?' disabled':'')+'>‹ '+(vy-1)+'</button><b>'+vy+'년</b><button type="button" class="cgg-btn sm" data-y="1"'+(hi&&key(vy+1,1)>hi?' disabled':'')+'>'+(vy+1)+' ›</button></div><div class="cgg-mgrid">';
      for(var i=1;i<=12;i++){ var k=key(vy,i), off=(lo&&k<lo)||(hi&&k>hi); h+='<button type="button" data-m="'+i+'" aria-pressed="'+(vy===y&&i===m)+'"'+(vy===ty&&i===tm?' class="now"':'')+(off?' disabled':'')+'>'+i+'월</button>'; }
      return h+'</div>'; }
    btn.onclick=function(){ var vy=y;
      dialog({size:"form", title:"달 고르기", desc:"볼 달을 눌러요. 오늘이 있는 달은 파란 테두리예요.", body:'<div class="cgg-mpbox"></div>'});
      var box=document.querySelector(".cgg-dialog .cgg-mpbox"); if(!box) return;
      function bind(){ box.innerHTML=body(vy);
        Array.prototype.forEach.call(box.querySelectorAll("[data-y]"),function(x){ x.onclick=function(){ vy+=Number(x.getAttribute("data-y")); bind(); }; });
        Array.prototype.forEach.call(box.querySelectorAll("[data-m]"),function(x){ x.onclick=function(){ y=vy; m=Number(x.getAttribute("data-m")); label(); closeDialog(); o.onPick&&o.onPick(y,m); }; }); }
      bind(); var c=box.querySelector('[aria-pressed="true"]'); if(c) c.focus(); };
    label();
    return { set:function(a,b){ y=Number(a)||y; m=Number(b)||m; label(); }, get:function(){ return {y:y,m:m}; } }; }
  /* 기능 찾기 창 — 머리말 [찾기] 단추(find.mode:"button")가 열어요. 가운데 창 안에 찾기 칸(43px) + 결과 목록 */
  function findDialog(feats, onGo){
    dialog({size:"form", title:"기능 찾기", desc:"하고 싶은 일을 쉬운 말로 쳐 보세요. 예) 입금 완료, 청구서 보내기, 딜러 추가", body:'<div class="cgg-finddlg"></div>'});

  /* 마이페이지 창 — 사람 단추 › 마이페이지 (SKILL.md: 요금제 · 사용량은 여기서)
     o = {who:"김대표 · 대표 · 예시 광택", plan:[[이름,값]…], usage:[[이름, 쓴 것, 한도(없으면 막대 없음), 단위]…], account:[[이름,값]…], ok:"요금제 바꾸기", onOk:fn} */
  function myPage(o){ o=o||{};
    function dl(rows){ return '<dl>'+(rows||[]).map(function(r){ return '<dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd>'; }).join("")+'</dl>'; }
    var use='<dl>'+(o.usage||[]).map(function(u){ var unit=u[3]||"", lim=Number(u[2])||0, v=Number(u[1])||0;
      return '<dt>'+esc(u[0])+'</dt><dd>'+won(v)+(lim?' / '+won(lim):'')+esc(unit)+'</dd>'+(lim?'<span class="bar"><i style="width:'+Math.min(100,Math.round(v/lim*100))+'%"></i></span>':''); }).join("")+'</dl>';

      ok:o.ok, cancel:"닫기", onOk:o.onOk}); }

  /* ───── 1.13 체크 v56 에서 옮겨 온 공통 몫 (워시 v137 · 체크 v56.1 같이 써요) ───── */
  /* 여러 건 결과 목록 — «… N곳 — 가(까닭) / 나(까닭)» 한 줄을 한 곳씩 줄 바꾼 목록으로. html 은 이미 esc 된 글이어야 해요 */
  function listify(html){
    return String(html==null?"":html).split(/<br\s*\/?>/i).map(function(line){
      var m=line.match(/^(.*?(?:\d+\s*(?:곳|건|줄|명))\s*)—\s*(.+)$/);
      if(!m||!/ \/ /.test(m[2])) return line;
      return m[1]+'<ul class="cgg-list">'+m[2].split(/\s+\/\s+/).map(function(x){ return '<li>'+x+'</li>'; }).join("")+'</ul>'; }).join("<br>"); }
  /* 글자 목록 → 목록 HTML (모두 esc) */
  function list(items){ return '<ul class="cgg-list">'+(items||[]).map(function(x){ return '<li>'+esc(x)+'</li>'; }).join("")+'</ul>'; }
  /* 1.13.1 진행 칸(«이번 달 어디까지 왔나») — CGG.steps(el, [{label:"자료 올리기", note:"끝", state:"done"|"now"|"todo"}, …], {title, desc})
     4칸이 기본(넓은 화면 한 줄 · 폰은 한 칸씩). 글자는 모두 esc. 지금 칸은 aria-current="step" */
  function steps(el, items, o){ if(!el) return; o=o||{};
    var S={done:"끝",now:"지금",todo:"남음"};
    el.classList.add("cgg-steps");
    el.innerHTML=(o.title?'<div class="cgg-stepsh"><b>'+esc(o.title)+'</b>'+(o.desc?'<small>'+esc(o.desc)+'</small>':'')+'</div>':'')
      +'<ol>'+(items||[]).map(function(x,i){ var st=S[x.state]?x.state:"todo";
        return '<li class="'+st+'"'+(st==="now"?' aria-current="step"':'')+'><i>'+(st==="done"?"✓":(i+1))+'</i><span><b>'+esc(x.label)+'</b><small>'+esc(x.note!=null?x.note:S[st])+'</small></span></li>'; }).join("")+'</ol>'; }
  /* 얇은 진행 줄 — 화면 맨 위 3px. CGG.progress(3,10,"보내는 중") · CGG.progress(null) 로 닫아요 */

/* 같은 차량번호는 가장 최근 기록이 «지금»입니다 */
function latest(){var m={};(S.cars||[]).forEach(function(x){if(!m[x.plate]||String(x.inAt)>String(m[x.plate].inAt))m[x.plate]=x;});
  return Object.keys(m).map(function(k){return m[k];}).sort(function(a,b){return a.at<b.at?1:a.at>b.at?-1:0;});}
function isDone(x){return !!S.done[x.key];}
function jong(w){var c=String(w||"").trim().slice(-1),k=c.charCodeAt(0);if(k>=0xAC00&&k<=0xD7A3)return (k-0xAC00)%28;return /[0-9]/.test(c)?("013678".indexOf(c)>=0?1:0):/[lmnr]/i.test(c)?8:0;}
function ro(w){var j=jong(w);return w+(j&&j!==8?"으로":"로");}
/* 알림 = 내 차의 입고 · 출고 · 도착 기록. d4.0: 본문은 현장 말 «차량번호 · 업체 → 도착한 곳 도착» (F01 · F02) */
function events(){
  var E=[];(S.cars||[]).forEach(function(x){
    var who=x.plate||"차";
    E.push({k:"in",st:"입고",d:who+" · "+x.shopName+" 입고",at:x.inAt});
    if(x.outAt){
      if(x.stage==="출고"&&x.dest)E.push({k:"out",st:"출고",d:who+" · "+x.shopName+" → "+x.dest+" 출고",at:x.outAt});
      else E.push({k:"arr",st:"도착",d:who+" · "+x.shopName+" → "+(x.dest||"도착한 곳")+" 도착",at:x.outAt});
    }
  });
  E.sort(function(a,b){return a.at<b.at?1:a.at>b.at?-1:0;});
  return E.slice(0,100);
}
function unread(){var s=S.seen||"";return events().filter(function(e){return e.at>s;}).length;}
function markSeen(){var E=events();if(E.length){S.seen=E[0].at;if(!DEMO)ls("cgd_seen",S.seen);}}

function sod(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function isToday(iso){if(!iso)return false;var d=new Date(iso);return !isNaN(d)&&sod(d).getTime()===sod(new Date()).getTime();}
function daysAgo(iso){var d=new Date(iso);return isNaN(d)?0:Math.floor((Date.now()-d.getTime())/864e5);}
function sumOf(plate){return (S.cars||[]).filter(function(x){return x.plate===plate;}).reduce(function(a,x){return a+(Number(x.total)||0);},0);}
function worksOf(c){return (c.works&&c.works.length)?c.works.join(", "):(c.outAt?"":"작업 대기");}
function hm(iso){var d=new Date(iso);if(isNaN(d))return "";return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function lastAt(iso){return isToday(iso)?hm(iso):day(iso).split(" ")[0];}
function stageOf(c){return isDone(c)?"상품화 완료":c.stage;}
function nm2(c){return c.plate||c.model||"차";}
function names(L){return L.slice(0,2).map(function(c){return nm2(c);}).join(" · ")+(L.length>2?" 외 "+(L.length-2)+"대":"");}
function G(){
  var all=latest(),act=all.filter(function(c){return !isDone(c);});
  return {all:all,
    work:act.filter(function(c){return c.stage==="작업 중";}),
    today:act.filter(function(c){return c.outAt&&isToday(c.outAt);}),
    arr:act.filter(function(c){return c.stage==="도착";}),
    moving:act.filter(function(c){return c.stage==="출고";}),
    slow:act.filter(function(c){return c.stage==="작업 중"&&daysAgo(c.inAt)>=3;})};
}

   마지막 기록은 ISO 그대로(정렬이 맞게), 보일 때만 «09:20 · 10/17». 들어간 금액 0 = 업체가 아직 금액을 넣지 않음 → «—» */
function carRow(c){var sm=sumOf(c.plate);return [c.plate,stageOf(c),c.model||"차종 없음",worksOf(c),c.where||"",c.at||"",sm?sm:null];}

/* ---------- 청구서 셈 (d3.9 그대로) ---------- */
function isPaid(b){return b.state==="입금 확인됨";}
function hasDue(b){return /^\d{4}-\d{2}-\d{2}/.test(String(b.dueDate||""));}
function dueLeft(b){if(!hasDue(b))return 9999;var x=new Date(String(b.dueDate).slice(0,10)+"T00:00:00");return Math.round((x-sod(new Date()))/864e5);}
function md(d){return String(d).slice(5,10).replace("-","/");}
function monthKey(b){var m=String(b.month||""),y=m.match(/(\d{4})\D+(\d{1,2})/);if(y)return +y[1]*100+ +y[2];var k=m.match(/(\d{1,2})/);return k?+k[1]:99;}
function paidDay(v){var d=new Date(String(v||""));return isNaN(d)?"":(d.getMonth()+1)+"/"+d.getDate();}
function dueTxt(b){if(isPaid(b))return "입금 확인"+(paidDay(b.paidAt)?" · "+paidDay(b.paidAt):"");if(!hasDue(b))return "";var n=dueLeft(b);
  return n<0?"기한 "+md(b.dueDate)+" · "+(-n)+"일 지남":n===0?"기한 오늘("+md(b.dueDate)+")":"기한 "+md(b.dueDate)+" · "+n+"일 남음";}
function billList(){var L=(S.bills||[]).slice();
  /* 입금 전 먼저 → 기한 있는 것은 기한 순 → 기한 없는 것은 월 순 (결제/10 D4) */
  L.sort(function(a,b){if(isPaid(a)!==isPaid(b))return isPaid(a)?1:-1;
    if(hasDue(a)&&hasDue(b))return dueLeft(a)-dueLeft(b);if(hasDue(a)!==hasDue(b))return hasDue(a)?-1:1;return monthKey(a)-monthKey(b);});return L;}
function billSum(){return (S.bills||[]).filter(function(b){return !isPaid(b);}).reduce(function(a,b){return a+(Number(b.due)||0);},0);}

function tlog(trail){
  var E=[];
  (trail||[]).forEach(function(x){
    var wk=x.works&&x.works.length?"작업: "+x.works.join(", "):(x.outAt?"":"작업 대기");
    E.push({at:x.inAt,t:x.shopName+" 입고",s:[wk,Number(x.total)?won(x.total):""].filter(Boolean).join(" · ")});
    if(x.outAt){
      if(x.stage==="출고"&&x.dest)E.push({at:x.outAt,t:x.shopName+" 출고 → "+ro(x.dest)+" 이동",s:""});
      else E.push({at:x.outAt,t:(x.dest||x.shopName)+" 도착",s:x.shopName+"에서 출고 · 도착"});
    }
  });
  E.sort(function(a,b){return a.at<b.at?1:a.at>b.at?-1:0;});
  if(!E.length)return '<p class="d">기록이 없어요.</p>';
  return '<ol class="dlog">'+E.map(function(e,i){return '<li'+(i===0?' class="now"':'')+'><b>'+esc(day(e.at))+'</b> '+esc(e.t)+(i===0?' (지금)':'')+(e.s?'<small>'+esc(e.s)+'</small>':'')+'</li>';}).join("")+'</ol>';
}

  $("mName").onclick=function(){CGG.dialog({size:"form",title:"이름",body:'<div class="fm"><label for="nm">이름<input id="nm" maxlength="20" placeholder="예) 김민수" value="'+esc(S.name)+'"></label></div>',ok:"저장",cancel:"취소",
    onOk:function(){var nm=(($("nm")||{}).value||"").trim();api("setName",[nm]).then(function(r){S.name=r.name;render();CGG.toast("저장했어요");},function(e){CGG.toast(errMsg(e));});}});};
  $("mDocs").onclick=function(){CGG.dialog({size:"form",title:"약관 다시 보기",desc:S.agreedAt?new Date(S.agreedAt).toLocaleDateString("ko-KR")+" 동의":"",body:'<div class="ddoc">'+esc(TERMS)+"\n\n──────────\n\n"+esc(PRIVACY)+'</div>'});};
};
function askLogout(){CGG.dialog({size:"confirm",title:"로그아웃할까요?",desc:"다시 로그인할 때 인증번호를 한 번 더 받아요.",rows:[["누구",whoLine()+" · "+telMask(S.phone)]],ok:"로그아웃",cancel:"취소",
  onOk:function(){api("logout").then(function(){},function(){}).then(function(){forget();CGG.toast("로그아웃했어요");});}});}

/* ---------- 로그인 · 이용 동의 (d3.9 흐름 그대로 · 모양만 1.13.2 토큰) ---------- */
function demoBar(){return DEMO?'<div class="lg-demo">시연 화면 — 실제 자료가 아니에요</div>':'';}
function brand(){return '<div class="lg-brand"><span class="ci"><img src="'+CGG.CI.white+'" alt="" width="28" height="28"></span>차곳간 딜러</div>';}
function loginView(){
  var s=S.step;
  return '<div class="lg">'+demoBar()+'<div class="lg-card">'+brand()+
  '<h2>'+(s===1?'휴대폰 번호로<br>시작하기':'인증번호 6자리를<br>입력해 주세요')+'</h2>'+
  '<p>'+(s===1?'업체에 알려 주신 번호로 로그인하면 맡긴 차가 바로 보입니다. 비밀번호는 필요 없습니다.':esc(telFmt(S.phone))+' 번호로 인증번호를 발송했습니다. 5분 안에 입력해 주세요.'+(DEMO?' (시연: 123456)':''))+'</p>'+
  (s===1?'<label class="t" for="ph">휴대폰 번호</label><input class="lg-in" id="ph" type="tel" inputmode="numeric" autocomplete="tel" placeholder="010-0000-0000" value="'+esc(telFmt(S.phone))+'">'+
    (S.err?'<p class="lg-err" role="alert">'+esc(S.err)+'</p>':'')+
    '<button type="button" class="cgg-btn pri" data-act="otp" '+(S.sending?'disabled':'')+'>'+(S.sending?'보내는 중…':'인증번호 받기')+'</button>':
   '<div class="lg-otp">'+[0,1,2,3,4,5].map(function(i){return '<input id="o'+i+'" type="tel" inputmode="numeric" maxlength="1" '+(i===0?'autocomplete="one-time-code"':'')+' aria-label="'+(i+1)+'번째 숫자">';}).join("")+'</div>'+
    (S.err?'<p class="lg-err" role="alert">'+esc(S.err)+'</p>':'')+
    '<button type="button" class="cgg-btn pri" data-act="enter" '+(S.sending?'disabled':'')+'>'+(S.sending?'확인 중…':'로그인')+'</button>'+
    '<button type="button" class="cgg-btn" data-act="otpback">번호 다시 입력</button>'+
    '<button type="button" class="lg-link" data-act="resend">인증번호 다시 받기</button>')+
  '<p class="lg-foot">처음 로그인하면 이용약관 · 개인정보 동의 화면이 한 번 나옵니다.</p></div></div>';
}
function agreeView(){
  var d=S.docOpen;
  var row=function(id,label,doc){return '<div class="lg-row"><label><input type="checkbox" id="'+id+'"><span>'+esc(label)+'</span></label>'+
    '<button type="button" data-act="doc" data-v="'+doc+'">'+(d===doc?'접기':'보기')+'</button></div>'+
    (d===doc?'<div class="lg-doc">'+esc(doc==="terms"?TERMS:doc==="privacy"?PRIVACY:MKT)+'</div>':'');};
  return '<div class="lg">'+demoBar()+'<div class="lg-card">'+brand()+'<h2>이용 동의</h2><p>처음 한 번만 하면 돼요.</p>'+
   '<div class="lg-note">내 번호로 맡겨진 차를 보여 드리려면 아래 동의가 필요합니다. 동의하지 않으면 차 목록을 볼 수 없습니다.</div>'+
   '<label class="lg-all"><input type="checkbox" id="aAll"><span><b>모두 동의</b><br><small>필수 2개 + 선택 1개</small></span></label>'+
   '<div class="lg-list">'+row("aT","[필수] 이용약관","terms")+row("aP","[필수] 개인정보 수집·이용","privacy")+row("aM","[선택] 광고·소식 받기","mkt")+'</div>'+
   (S.err?'<p class="lg-err" role="alert">'+esc(S.err)+'</p>':'')+
   '<button type="button" class="cgg-btn pri" data-act="agree">동의하고 시작하기</button>'+
   '<button type="button" class="cgg-btn" data-act="logout">나중에 하기 (로그아웃)</button></div></div>';
}

/* ---------- 그리기 ---------- */
function render(){
  try{CGG.closeMenu();}catch(e){}
  var app=$("app"),lg=$("login"),main=S.view==="main";
  app.hidden=!main;lg.hidden=main;
  if(!main){lg.innerHTML=S.view==="agree"?agreeView():loginView();bindLogin();return;}
  drawHeader();drawNav();
  var m=$("main");m.innerHTML="";(V[S.tab]||V.home)(m);
  if(DEMO){m.insertAdjacentHTML("afterbegin",CGG.trial.band({title:"예시 자료로 딜러앱을 둘러보고 있어요.",sub:"실제 자료가 아니에요. 딜러앱은 무료예요 — 휴대폰 번호로 로그인하면 업체에 맡긴 내 차가 보여요."}));
    var cta=m.querySelector("[data-cgg-cta]");if(cta)cta.onclick=function(){try{location.href=location.pathname;}catch(e){}};}
}
function bindLogin(){
  var ph=$("ph");if(ph){ph.oninput=function(){S.phone=dg(ph.value).slice(0,11);};ph.onkeydown=function(e){if(e.key==="Enter")act("otp");};}
  var o0=$("o0");if(o0){
    var boxes=[0,1,2,3,4,5].map(function(i){return $("o"+i);});
    boxes.forEach(function(b,i){
      b.oninput=function(){var v=dg(b.value);
        if(v.length>1){v.split("").slice(0,6-i).forEach(function(ch,j){boxes[i+j].value=ch;});var nx=Math.min(5,i+v.length);boxes[nx].focus();}
        else{b.value=v;if(v&&i<5)boxes[i+1].focus();}
        if(code().length===6)act("enter");};
      b.onkeydown=function(e){if(e.key==="Backspace"&&!b.value&&i>0){boxes[i-1].focus();boxes[i-1].value="";}if(e.key==="Enter")act("enter");};
      b.onpaste=function(e){var t=dg((e.clipboardData||window.clipboardData).getData("text"));if(t.length>=6){e.preventDefault();t.slice(0,6).split("").forEach(function(ch,j){boxes[j].value=ch;});act("enter");}};
    });
    if(!S.sending)o0.focus();
  }
  var all=$("aAll");if(all){var subs=["aT","aP","aM"].map($);
    all.onchange=function(){subs.forEach(function(x){x.checked=all.checked;});};
    subs.forEach(function(x){x.onchange=function(){all.checked=subs.every(function(y){return y.checked;});};});}
}
function code(){return [0,1,2,3,4,5].map(function(i){return ($("o"+i)||{}).value||"";}).join("");}
function keepChecks(fn){var ids=["aT","aP","aM","aAll"],k=ids.map(function(id){return $(id)&&$(id).checked;});fn();ids.forEach(function(id,i){if($(id))$(id).checked=k[i];});}

/* ---------- 동작 (서버 부르기는 d3.9 그대로) ---------- */
function loadBills(){var k=S.key;S.billsAt=Date.now();return api("myBills").then(function(r){if(S.key!==k)return;var L=(r&&r.list)||[],rd=!!(r&&r.ready),sig=JSON.stringify([rd,L]);
  if(sig===S.billsSig&&S.bills)return;S.billsSig=sig;S.bills=L;S.billsReady=rd;if(S.tab==="bill"||S.tab==="home")render();},function(){if(S.key!==k)return;if(S.bills)return;S.bills=[];S.billsReady=false;if(S.tab==="bill"||S.tab==="home")render();});}
/* d3.9 — 청구서는 탭을 열 때 · 앱으로 돌아올 때 다시 불러옴 (gap 밀리초 안에 또 부르면 건너뜀) */
function freshBills(gap){if(!S.key||!S.agreed||S.view==="login"||S.view==="agree")return;if(Date.now()-(S.billsAt||0)<gap)return;loadBills();}
try{document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")freshBills(30000);});}catch(e){}
function loadCars(){
  loadBills();
  var k=S.key;
  return api("cars").then(function(r){if(S.key!==k)return;S.cars=(r&&r.list)||[];S.done=(r&&r.done)||{};if(S.carT)S.carT.sel={};S.sel={};render();},
    function(e){if(S.key!==k)return;if(S.cars===null)S.cars=[];render();CGG.toast(errMsg(e));});
}
function enterMain(){S.view="main";S.tab="home";S.cars=null;render();loadCars();
  api("me").then(function(m){if(m){S.name=m.name||"";S.agreedAt=m.agreedAt||"";S.phone=m.phone||S.phone;render();}},function(){});}

function act(a,el){
  var v=el&&el.getAttribute("data-v");
  if(a==="otp"||a==="resend"){
    var p=dg(S.phone);if(!/^01\d{8,9}$/.test(p)){S.err="휴대폰 번호가 올바르지 않습니다. 다시 확인해 주세요.";render();return;}
    S.sending=true;S.err="";render();
    api("sendCode",[p]).then(function(){S.sending=false;S.step=2;S.err="";render();if(a==="resend")CGG.toast("인증번호를 다시 발송했습니다.");},
      function(e){S.sending=false;S.err=errMsg(e);render();});return;
  }
  if(a==="otpback"){S.step=1;S.err="";render();return;}
  if(a==="enter"){
    var c=code();if(c.length!==6){S.err="인증번호 6자리를 모두 입력해 주세요.";render();return;}
    if(S.sending)return;S.sending=true;S.err="";
    api("verifyCode",[S.phone,c]).then(function(r){
      S.sending=false;S.key=r.key;S.phone=r.phone;S.name=r.name||"";S.agreed=!!r.agreed;
      if(!DEMO){ls("cgd_key",r.key);ls("cgd_phone",r.phone);}
      armBack();
      if(S.agreed){enterMain();CGG.toast((S.name?S.name+" 딜러님, ":"")+"로그인했습니다.");}else{S.view="agree";S.err="";render();}
    },function(e){S.sending=false;S.err=errMsg(e);render();});return;
  }
  if(a==="doc"){keepChecks(function(){S.docOpen=S.docOpen===v?"":v;render();});return;}
  if(a==="agree"){
    if(!$("aT").checked||!$("aP").checked){keepChecks(function(){S.err="필수 항목 2개에 동의해야 시작할 수 있습니다.";render();});return;}
    var mk=$("aM").checked;
    api("agree",[mk]).then(function(){S.agreed=true;S.agreedAt=new Date().toISOString();S.err="";enterMain();CGG.toast("동의가 완료되었습니다. 어서 오세요.");},
      function(e){keepChecks(function(){S.err=errMsg(e);render();});});return;
  }
  if(a==="logout"){api("logout").then(function(){},function(){}).then(function(){forget();CGG.toast("로그아웃했어요");});return;}
}
document.addEventListener("click",function(e){
  var el=e.target.closest&&e.target.closest("#login [data-act]");if(!el)return;
  if(el.tagName==="BUTTON")e.preventDefault();
  act(el.getAttribute("data-act"),el);
});

/* ---------- 뒤로가기: 로그인한 상태에서는 바로 나가지 않고 물어봅니다 ---------- */
var armed=false;
function armBack(){if(armed)return;armed=true;history.pushState({root:1},"");}
window.addEventListener("popstate",function(){
  if(CGG.closeSheet()){history.pushState({root:1},"");return;}
  if(dlgOpen()){CGG.closeDialog();history.pushState({root:1},"");return;}
  if(S.key&&S.view==="main"){history.pushState({root:1},"");askLogout();return;}
  if(S.key&&S.view==="agree"){history.pushState({root:1},"");}
});

/* ---------- 시작 ---------- */
(function start(){
  CGG.favicon();
  CGG.layout.init($("app"),"cgg_dealer_layout","top");
  if(DEMO){CGG.trial.init("preview");S.view="login";render();return;}
  S.key=ls("cgd_key");S.phone=ls("cgd_phone");S.seen=ls("cgd_seen");
  if(!S.key){render();return;}
  armBack();
  S.view="main";S.cars=null;render();
  api("me").then(function(m){
    S.phone=m.phone;S.name=m.name||"";S.agreed=!!m.agreed;S.agreedAt=m.agreedAt||"";ls("cgd_phone",m.phone);
    if(!S.agreed){S.view="agree";render();}else loadCars();
  },function(e){if(S.key){S.cars=[];render();CGG.toast(errMsg(e));}});
})();
</script>
</body>
</html>
