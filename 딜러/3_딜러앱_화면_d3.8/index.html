<style>
:root{
  --blue:#1668C4; --navy:#0B2545; --sky:#8FC9F2;
  --bg:#EEF3F9; --card:#FFFFFF; --ink:#0B2545; --sub:#5A6B82; --line:#DCE5F0;
  --tint:#E6F0FB; --good:#16865A; --goodbg:#E3F5EC; --warn:#B26A00; --warnbg:#FFF2DC;
  --bad:#C62828; --badbg:#FDE8E8; --stage:#fff; --shadow:0 1px 2px rgba(11,37,69,.06),0 4px 14px rgba(11,37,69,.06);
  --outer:#DDE6F1;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0A1628;--card:#122238;--ink:#E7EEF7;--sub:#9DB0C8;--line:#22385A;--tint:#16304F;
  --goodbg:#113A2A;--good:#5CD19A;--warnbg:#3D2B0A;--warn:#F1B45A;--badbg:#431818;--bad:#FF8A8A;--outer:#060E1A;--blue:#3D8BE0;
  --shadow:0 1px 2px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0A1628;--card:#122238;--ink:#E7EEF7;--sub:#9DB0C8;--line:#22385A;--tint:#16304F;
  --goodbg:#113A2A;--good:#5CD19A;--warnbg:#3D2B0A;--warn:#F1B45A;--badbg:#431818;--bad:#FF8A8A;--outer:#060E1A;--blue:#3D8BE0;
  --shadow:0 1px 2px rgba(0,0,0,.3)}
*{box-sizing:border-box}
body{background:var(--outer);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;padding-inline:16px;padding-block:16px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* 휴대폰 */
.phone{max-width:420px;margin:0 auto;background:var(--bg);border-radius:28px;overflow:hidden;box-shadow:0 10px 40px rgba(11,37,69,.18);position:relative;min-height:760px;display:flex;flex-direction:column}
.top{background:var(--navy);color:#fff;padding:14px 18px 16px;display:flex;align-items:center;gap:10px}
.top .logo{width:30px;height:30px;flex:none}
.top .t1{font-weight:900;font-size:17px;letter-spacing:-.3px}
.top .t2{font-size:12px;color:var(--sky)}
.top .back{background:none;border:0;color:#fff;font-size:22px;padding:0 6px 0 0;line-height:1}
.top .bell{margin-left:auto;background:rgba(255,255,255,.1);border:0;border-radius:10px;padding:6px 10px;color:#fff;font-size:13px;position:relative}
.dot{position:absolute;top:-4px;right:-4px;background:#FF5A5A;color:#fff;font-size:11px;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.body{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs button{background:none;border:0;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--sub)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--blue);font-weight:700}

.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px}
.sec{font-size:13px;color:var(--sub);font-weight:700;margin:4px 2px -4px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.summary .card b{display:block;font-size:22px;font-weight:900;margin-top:2px}
.summary .card span{font-size:12px;color:var(--sub)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13px}
.chips button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{border:0;background:none;flex:1;padding:12px 0;font:inherit;color:var(--ink);outline:none}

/* 번호판 */
.plate{display:inline-flex;align-items:center;border:2px solid var(--navy);background:#fff;color:#0B2545;border-radius:6px;padding:2px 9px;font-weight:900;font-size:16px;letter-spacing:.5px;font-variant-numeric:tabular-nums}
:root[data-theme="dark"] .plate{border-color:#fff}
.car{display:flex;flex-direction:column;gap:10px;text-align:left;border:0;width:100%}
.car .row1{display:flex;align-items:center;gap:10px}
.car .model{font-size:13px;color:var(--sub)}
.pill{margin-left:auto;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
.p-in{background:var(--tint);color:var(--blue)}
.p-work{background:var(--warnbg);color:var(--warn)}
.p-out{background:var(--goodbg);color:var(--good)}
.p-done{background:var(--line);color:var(--sub)}
.where{font-size:14px}
.where b{color:var(--blue)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.steps i{height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--blue)}
.steps-l{display:grid;grid-template-columns:repeat(4,1fr);font-size:11px;color:var(--sub);margin-top:-4px}

/* 타임라인 */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:18px 1fr;gap:10px;position:relative;padding-bottom:16px}
.tl li:before{content:"";position:absolute;left:8px;top:18px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child:before{display:none}
.tl .d{width:18px;height:18px;border-radius:50%;border:3px solid var(--blue);background:var(--card);margin-top:2px}
.tl li.now .d{background:var(--blue);box-shadow:0 0 0 4px var(--tint)}
.tl li.ext .d{border-color:var(--sub);border-style:dashed}
.tl .co{font-weight:700}
.tl .ev{font-size:13px;color:var(--sub);margin-top:2px}
.tl .amt{font-size:13px;margin-top:4px}
.photo{height:150px;border-radius:12px;background:linear-gradient(135deg,#1F4E86,#0B2545);display:grid;place-items:center;color:#cfe3f7;font-size:13px;position:relative;overflow:hidden}
.photo svg{width:62%;opacity:.9}
.photo small{position:absolute;bottom:8px;right:10px;font-size:11px;opacity:.8}

.btn{border:0;border-radius:12px;padding:14px;font-weight:700;font-size:15px;width:100%}
.btn.pri{background:var(--blue);color:#fff}
.btn.sec2{background:var(--tint);color:var(--blue)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* 알림 */
.noti{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.noti .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:900}
.noti .tt{font-weight:700;font-size:14px}
.noti .ds{font-size:13px;color:var(--sub);margin-top:2px;line-height:1.45}
.noti .tm{font-size:12px;color:var(--sub);margin-top:4px}
.noti.unread .tt:after{content:"";display:inline-block;width:7px;height:7px;background:#FF5A5A;border-radius:50%;margin-left:6px;vertical-align:middle}
.via{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;color:var(--sub)}

/* 청구서 */
.inv{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center}
.chk{width:30px;height:30px;accent-color:var(--blue);margin:0}
.inv .co{font-weight:700}
.inv .ds{font-size:12px;color:var(--sub);margin-top:2px}
.inv .am{font-weight:900;font-size:16px;text-align:right}
.tax{font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;display:inline-block;margin-top:4px}
.tax.y{background:var(--tint);color:var(--blue)}
.tax.n{background:var(--badbg);color:var(--bad)}
.paybar{position:sticky;bottom:0;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;display:flex;align-items:center;gap:12px}
.paybar .lbl{font-size:12px;color:var(--sub)}
.paybar .tot{font-size:20px;font-weight:900}
.paybar .btn{width:auto;margin-left:auto;padding:12px 18px}

/* 시트 */
.sheet-wrap{position:absolute;inset:0;background:rgba(6,14,26,.5);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--card);width:100%;border-radius:20px 20px 0 0;padding:18px 18px 22px;display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-size:17px}
.split{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:14px}
.split .h{color:var(--sub);font-size:12px}
.split .tot{border-top:1px solid var(--line);padding-top:8px;font-weight:900}
.note{font-size:12px;color:var(--sub);line-height:1.5;background:var(--tint);border-radius:10px;padding:10px}

/* 카히스토리 */
.bal{background:linear-gradient(135deg,var(--blue),var(--navy));color:#fff;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.bal b{font-size:28px;font-weight:900}
.bal span{font-size:12px;color:var(--sky)}
.charge{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.charge button{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;border-radius:10px;padding:10px 0;font-weight:700;font-size:14px}
.field{display:flex;gap:8px}
.field input{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;font:inherit;min-width:0}
.field .btn{width:auto;padding:12px 16px}
.res{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:14px}
.res dt{color:var(--sub)} .res dd{margin:0;font-weight:700;text-align:right}
.ex{font-size:11px;background:var(--warnbg);color:var(--warn);border-radius:6px;padding:2px 6px;font-weight:700}

/* 내 정보 */
.set{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;gap:12px}
.set:last-child{border-bottom:0}
.set small{display:block;color:var(--sub);font-size:12px;margin-top:2px}
.sw{position:relative;width:50px;height:30px;flex:none}
.sw input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s}
.sw span:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+span{background:var(--blue)}

/* 로그인 */
.login{flex:1;display:flex;flex-direction:column;gap:14px;padding:28px 22px;background:var(--bg)}
.login h2{font-size:24px;font-weight:900;margin:20px 0 0;letter-spacing:-.5px;text-wrap:balance}

.login label{font-size:13px;font-weight:700;color:var(--sub)}
.login input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px;font:inherit;font-size:17px;letter-spacing:.5px}

/* ---- 실제 앱: 휴대폰에서는 화면 가득, PC에서는 시안처럼 휴대폰 모양 ---- */

.top{padding-top:calc(14px + env(safe-area-inset-top,0px))}
.body{-webkit-overflow-scrolling:touch}
.login{overflow:auto;padding-top:calc(28px + env(safe-area-inset-top,0px))}
.tabs{flex:none}
.body>*{flex-shrink:0}
.chk{flex:none}

/* d2.2 진행 기록 — 휴대폰에서 잘 보이게 한 줄씩 */
.tl li{padding-bottom:20px}
.tl .co{font-size:16px}
.rws{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.rw{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px;color:var(--ink)}

.lb-in{background:var(--tint);color:var(--blue)}
.lb-work{background:var(--warnbg);color:var(--warn)}
.lb-out{background:var(--goodbg);color:var(--good)}

.lb-now{background:var(--blue);color:#fff}
.lb-amt{background:var(--line);color:var(--ink)}

.wk i{font-style:normal;background:var(--line);color:var(--ink);border-radius:6px;padding:2px 8px;font-size:14px}

/* d2.3 진행 기록 — C안 (택배 조회처럼) */
.tlc{padding:16px 14px 2px}
.ev{display:grid;grid-template-columns:58px 22px 1fr;align-items:stretch}
.ev .t{text-align:right;padding:2px 0 18px;font-variant-numeric:tabular-nums}
.ev .t b{display:block;font-size:15px}
.ev .t small{color:var(--sub);font-size:12px}
.ev .ln{position:relative}
.ev .ln:before{content:"";position:absolute;left:10px;top:6px;bottom:-6px;width:2px;background:var(--line)}
.ev:last-child .ln:before{display:none}
.ev .ln i{position:absolute;left:4px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--card);border:3px solid var(--blue)}
.ev.cur .ln i{background:var(--blue);box-shadow:0 0 0 4px var(--tint)}
.ev.o .ln i{border-color:var(--good)}
.ev.cur.o .ln i{background:var(--good)}
.ev .tx{padding:0 0 18px 4px;min-width:0}
.ev .what{font-size:16px;font-weight:800;line-height:1.35}
.ev .what em{font-style:normal;color:var(--blue)}
.ev .sub{font-size:14px;color:var(--sub);margin-top:3px;line-height:1.45}
.ev .sub b{color:var(--ink)}
.lbn{display:inline-block;vertical-align:2px;margin-left:4px;font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px;background:var(--blue);color:#fff}

/* ================= d3.0 — J안 4판 (디자인/01_J안_제품별_시안_기준.md 4-1장) ================= */
:root{--bg:#F3F5F8;--card:#FFFFFF;--ink:#101828;--sub:#667085;--line:#EAECF0;--hov:#F7F9FC;--tabon:#E8F1FC;
  --run:#1668C4;--run-bg:#E6F0FB;--done:#1E9E5A;--done-bg:#E4F5EC;--chk:#B26B00;--chk-bg:#FFF2DD;--stop:#D64545;--stop-bg:#FDE8E8;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 2px 8px rgba(16,24,40,.05);--outer:#E4E9F0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1628;--card:#122238;--ink:#E7EEF7;--sub:#9DB0C8;--line:#22385A;--hov:#16304F;--tabon:#16304F;
  --run:#6FA8EC;--run-bg:#16304F;--done:#5CD19A;--done-bg:#113A2A;--chk:#F1B45A;--chk-bg:#3D2B0A;--stop:#FF8A8A;--stop-bg:#431818;--outer:#060E1A}}
:root[data-theme="dark"]{--bg:#0A1628;--card:#122238;--ink:#E7EEF7;--sub:#9DB0C8;--line:#22385A;--hov:#16304F;--tabon:#16304F;
  --run:#6FA8EC;--run-bg:#16304F;--done:#5CD19A;--done-bg:#113A2A;--chk:#F1B45A;--chk-bg:#3D2B0A;--stop:#FF8A8A;--stop-bg:#431818;--outer:#060E1A}
body{font-size:13.5px}
/* 폰 — 남색 윗줄 48 + 아래 탭바 56 */
.top{min-height:48px;padding:calc(6px + env(safe-area-inset-top,0px)) 12px 6px;gap:8px}
.top .logo{width:26px;height:26px}
.top .t1{font-size:15px}
.top .t2{font-size:11.5px}
.top .bell{height:30px;padding:0 10px;border-radius:8px;font-size:12px}
.body{padding:12px;gap:10px}
.tabs{min-height:56px;padding:4px 2px calc(4px + env(safe-area-inset-bottom,0px))}
.tabs button{font-size:10.5px;gap:3px;color:#98A2B3}
.tabs button svg{width:20px;height:20px}
.tabs button[aria-current="page"]{color:var(--navy);font-weight:700}
:root[data-theme="dark"] .tabs button[aria-current="page"]{color:var(--sky)}
.tabs .pc{display:none}
.card{border-radius:14px;padding:12px}
.btn{border-radius:10px;min-height:38px;padding:10px 14px;font-size:14px}
.chips button{padding:6px 12px;font-size:12.5px}
.chips button[aria-pressed="true"]{background:var(--blue)}
/* 상태 칩 — 공통 네 가지 색만. 단계 이름은 그대로 */
.pill{border-radius:6px;padding:3px 8px;font-size:11.5px}
.p-in,.p-work,.p-out{background:var(--run-bg);color:var(--run)}
.p-arr{background:var(--chk-bg);color:var(--chk)}
.p-fin{background:var(--done-bg);color:var(--done)}
/* 말하는 제목 */
.hello small{display:block;font-size:11.5px;color:var(--sub);margin-bottom:3px}
.hello h1{margin:0;font-size:19px;font-weight:900;letter-spacing:-.5px;line-height:1.35}
.hello h1 em{font-style:normal;color:var(--blue)}
.hello p{margin:3px 0 0;font-size:12.5px;color:var(--sub)}
/* 할 일 — 폰은 카드 하나에 세 줄 */
.acts{display:flex;flex-direction:column;background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.act{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.act:last-child{border-bottom:0}
.act:hover{background:var(--hov)}
.act .ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.act .ico svg{width:16px;height:16px}
.act .ico.run{background:var(--run-bg);color:var(--run)} .act .ico.chk{background:var(--chk-bg);color:var(--chk)}
.act .ico.stop{background:var(--stop-bg);color:var(--stop)} .act .ico.done{background:var(--done-bg);color:var(--done)}
.act .tx{min-width:0;flex:1}
.act b{display:block;font-size:13.5px}
.act small{display:block;font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.act .ar{color:#98A2B3;font-size:15px}
/* 숫자 카드 — 폰 2×2 */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{position:relative;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:11px 12px;border:0;text-align:left}
.kpi small{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--sub);padding-right:48px}
.kpi small i{width:8px;height:8px;border-radius:3px;flex:none}
.kpi strong{display:block;font-size:19px;font-weight:900;letter-spacing:-.4px;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi strong em{font-style:normal;font-size:11.5px;color:var(--sub);font-weight:700;margin-left:3px}
.kpi .tr{display:block;font-size:11px;font-weight:700;color:var(--done);margin-top:1px;min-height:14px}
.kpi .tr.dn{color:var(--stop)} .kpi .tr span{color:var(--sub);font-weight:500}
.kpi svg.sp{position:absolute;width:44px;height:16px;right:10px;top:12px}
/* 내 차 — 상태 탭 · 목록 */
.lcard{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.stabs{display:flex;gap:2px;padding:0 8px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.stabs button{flex:none;border:0;background:none;font-size:13px;color:var(--sub);padding:10px 7px;border-bottom:2px solid transparent;margin-bottom:-1px}
.stabs button b{margin-left:3px;font-size:11px;background:var(--bg);border-radius:999px;padding:0 6px;color:var(--sub)}
.stabs button[aria-pressed="true"]{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
.stabs button[aria-pressed="true"] b{background:var(--tabon);color:var(--blue)}
.ltools{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.ltools .search{flex:1;border-radius:10px;padding:0 10px}
.ltools .search input{padding:9px 0}
.mrow{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow input{width:18px;height:18px;margin:0;accent-color:var(--blue)}
.mrow .go{border:0;background:none;text-align:left;padding:0;min-width:0;display:contents}
.mrow .t{min-width:0;cursor:pointer}
.mrow .t b{font-size:13.5px;font-weight:700}
.mrow .t b span{font-weight:500;color:var(--sub);font-size:12.5px;margin-left:6px}
.mrow .t small{display:block;font-size:11.5px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px;cursor:pointer}
.mrow .r b{font-size:13.5px;font-variant-numeric:tabular-nums}
.mbar{display:grid;grid-template-columns:repeat(4,10px);gap:2px}
.mbar i{height:3px;border-radius:2px;background:var(--line)} .mbar i.on{background:var(--blue)}
.lfoot{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--sub)}
.lfoot .btn{width:auto;margin-left:auto}
.lempty{padding:18px 14px;color:var(--sub);line-height:1.6}
.tbl{display:none}
.help{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:0 12px;font-size:12.5px;color:var(--sub)}
.help summary{padding:12px 0;font-weight:700;color:var(--ink);cursor:pointer}
.help p{margin:0 0 12px;line-height:1.6}
.more{display:flex;flex-direction:column;background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.more button{display:flex;align-items:center;gap:12px;border:0;border-bottom:1px solid var(--line);background:none;padding:14px;font-size:14px;text-align:left}
.more button:last-child{border-bottom:0}
.more button svg{width:20px;height:20px;color:var(--sub)}
.more button span{margin-left:auto;color:#98A2B3}

/* d3.1 — 공통 부품 틀 안의 딜러 본문 (로그인 · 동의는 예전 휴대폰 모양 그대로) */
body.shell{padding:0;background:var(--bg)}
.phone.cgg-app{max-width:none;height:auto;min-height:100vh;min-height:100dvh;border-radius:0;box-shadow:none;display:block;overflow:visible;margin:0}

.cgg-biz small{display:block;opacity:.72;font-size:11.5px}
.stack{display:flex;flex-direction:column;gap:10px;max-width:1180px;margin:0 auto}
.stack>*{flex-shrink:0;min-width:0}
.backrow{display:flex;align-items:center;gap:8px}
.backrow button{border:0;background:var(--card);border-radius:10px;height:36px;padding:0 12px;font-weight:700;color:var(--blue);box-shadow:var(--shadow)}
.cgg-app .sheet-wrap{position:fixed}
.cgg-app .sheet{padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
.cgg-app .toast{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom,0px))}
.cgg-acts{margin:0}
@media (min-width:601px){.more-only{display:none}}
@media (min-width:1000px){
  .stack{gap:16px}
  .hello h1{font-size:26px} .hello small{font-size:13px} .hello p{font-size:14px}
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .kpi{border-radius:18px;padding:18px 20px}
  .kpi small{font-size:13px;padding-right:80px} .kpi strong{font-size:30px;margin-top:8px} .kpi strong em{font-size:14px}
  .kpi .tr{font-size:12.5px;margin-top:4px} .kpi svg.sp{width:72px;height:26px;right:18px;top:18px}
  .lcard,.help,.more,.card{border-radius:18px}
  .mlist{display:none} .tbl{display:block;overflow-x:auto}
  .tbl table{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed;min-width:860px}
  .tbl th{height:40px;padding:0 14px;text-align:left;font-size:12.5px;color:var(--sub);border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl td{height:50px;padding:0 14px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tbl tbody tr{cursor:pointer} .tbl tbody tr:hover td{background:var(--hov)}
  .tbl .n{text-align:right;font-variant-numeric:tabular-nums} .tbl .c{text-align:center}
  .tbl th:first-child,.tbl td:first-child{padding:0;text-align:center;overflow:visible}
  .tbl input{width:18px;height:18px;accent-color:var(--blue)}
  .cgg-app .toast{left:auto;right:32px;bottom:32px;width:360px}
  .cgg-app .sheet-wrap{align-items:center;justify-content:center}
  .cgg-app .sheet{max-width:440px;border-radius:20px}
  .lay-side .cgg-right .bell,.lay-icon .cgg-right .bell{background:var(--bg);color:var(--ink);height:36px;padding:0 14px}
}


/* d3.3 — 사람 단추 · 청구서 */
.cgg-right .mebtn{position:relative;border:0;border-radius:8px;height:32px;padding:0 12px;background:rgba(255,255,255,.12);color:#fff;font-size:13px;font-weight:700;max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:1000px){.lay-side .cgg-right .mebtn,.lay-icon .cgg-right .mebtn{background:var(--bg);color:var(--ink);height:36px;padding:0 14px}}
.bills{display:grid;gap:10px}
.bill{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px;border-left:4px solid var(--chk);min-width:0}
.bill.b-late{border-left-color:var(--stop)} .bill.b-done{border-left-color:var(--done);opacity:.85}
.bh{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.bh b{font-size:15px} .bh small{display:block;color:var(--sub);font-size:12px;margin-top:2px}
.bm{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bm strong{font-size:22px;font-weight:900;letter-spacing:-.4px}
.bm span{font-size:12.5px;color:var(--sub)}

.acct{background:var(--bg);border-radius:10px;padding:9px 11px;font-size:13px;font-variant-numeric:tabular-nums}
.bb{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px}

.p-late{background:var(--stop-bg);color:var(--stop)}
@media (min-width:1000px){.bills{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.bill{border-radius:18px;padding:18px}}


/* d3.4 — 곧 열려요 한 줄 */
.soon{display:flex;align-items:center;gap:8px;background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--sub)}
.soon svg.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.soon b{color:var(--ink)}


/* d3.4 — 자세히 창 안의 차 상세 */
.cardlg{display:flex;flex-direction:column;gap:10px;margin:4px 0 8px}
.cardlg .photo{height:170px}
.cgg-app .sheet-wrap{z-index:calc(var(--z-dialog) + 1)}

/* 오픈 베타 띠 (디자인 방 2026-10-15) */
:root{--beta-bg:#0d2440;--beta-ink:#e8f0fb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--beta-bg:#1d3a5f}}
:root[data-theme="dark"]{--beta-bg:#1d3a5f}
.cgg-beta{background:var(--beta-bg);color:var(--beta-ink);font-size:13.5px;line-height:1.5;word-break:keep-all}

  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cgg-beta b{background:var(--beta-ink);color:var(--beta-bg);border-radius:6px;padding:1px 8px;font-size:12px;font-weight:800;flex:none}
.cgg-beta[hidden]{display:none}
@media (max-width:600px){.cgg-beta{font-size:12.5px}.cgg-beta .in{display:block;padding-block:6px}.cgg-beta b{margin-right:6px}}
/* d3.6 — 넓은 화면 세로 · 아이콘 메뉴는 메뉴 · 윗줄이 화면에 붙어 있어 띠를 가림 → 띠를 본문 위에 붙이고 붙은 줄을 띠 높이(36px)만큼 내림 */
@media (min-width:1000px){
  .cgg-beta:not([hidden]):has(~ .lay-side),.cgg-beta:not([hidden]):has(~ .lay-icon){position:fixed;top:0;right:0;left:252px;height:36px;z-index:var(--z-hdr);overflow:hidden;white-space:nowrap}
  .cgg-beta:not([hidden]):has(~ .lay-icon){left:76px}

  .cgg-beta:not([hidden]) ~ .lay-side > .cgg-main,.cgg-beta:not([hidden]) ~ .lay-icon > .cgg-main{padding-top:122px}
  .cgg-beta:not([hidden]) ~ .lay-side.hasSub > .cgg-main,.cgg-beta:not([hidden]) ~ .lay-icon.hasSub > .cgg-main{padding-top:168px}
}
/* d3.6 — 로그인 · 동의 화면(넓은 화면)은 바깥 여백 16px 이 있어 띠가 떠 보임 → 띠만 맨 위 · 가장자리까지 */
@media (min-width:480px){body:not(.shell) > .cgg-beta{margin:-16px -16px 16px}}
/* d3.6 — 좁은 PC(1000~1279px)에서 세로 메뉴를 쓰면 숫자 카드 글이 한 글자씩 꺾이던 것 (d3.5부터) → 두 칸으로 */
@media (min-width:1000px) and (max-width:1279px){.lay-side .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi:not(:has(svg.sp)) small{padding-right:0}
/* d3.6 — 로그인 · 동의 · 창 글도 낱말 단위 줄바꿈 (공통 부품 밖) */
.phone,.sheet,.cardlg{word-break:keep-all;overflow-wrap:anywhere}

/* ═══════════════════════════════════════════════════════════════════
   차곳간 공통 부품 · J안 4판 · cgg-j4 1.5 (2026-10-15, 디자인 방)
   ① 메뉴 배치 셋 (가로 · 세로 · 아이콘)  ② 폰 아래 탭바  ③ 홈 할 일 카드 3장  ④ 사람 단추 ▾ 펼침 (1.1)
   ⑤ 체험 모드 — 미리 써 보기(가입 전) · 체험판(결제 전) 띠 · 자물쇠 · 3번 표시 · 기능 카드 (1.2)
   ⑥ 화면 일곱 칸 본문 — 화면 머리 · 버튼 · 숫자 카드 4개 · 데이터 카드(상태 탭 · 거르기 · 표 · 폰 목록 · 쪽) · 도움 카드 · 창 3종 · 알림 글 (1.3)
   + 한국어 낱말 단위 줄바꿈 (keep-all)
   바탕: 관리 v4.0 의 관리/v4재료/j4.css (값 그대로). 관리 전용 id(#app · #nav · #setSub · #main)를
         모든 제품이 붙일 수 있는 이름표(class)로 바꿨어요.

   붙이는 법 — 원래 id · class 는 그대로 두고 아래 class 만 «더해» 주세요 (JS 가 쓰는 이름은 안 바꿈)
     바깥 상자      class="cgg-app"          (메뉴 배치는 cgg-j4.js 가 lay-top · lay-side · lay-icon 를 붙임)
     머리말         class="cgg-hdr"          그 안: .cgg-top > .cgg-brand · .cgg-biz · .cgg-right
     큰 메뉴        class="cgg-nav"          단추마다 <svg class="ic">아이콘</svg><span class="lbl">이름</span>, 고른 것은 aria-selected="true"
     안쪽 작은 탭   class="cgg-sub"
     본문           class="cgg-main"
     폰 아래 탭바   <nav class="cgg-tbar"></nav>   (cgg-j4.js 의 CGG.tabbar 가 채움)
     할 일 카드     <div class="cgg-acts"></div>    (cgg-j4.js 의 CGG.todos 가 채움)
   이 파일은 각 제품 <style> 의 «맨 마지막»에 넣어요 (앞의 값을 덮어야 해서).
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --blue:#1668C4; --navy:#0B2545; --sky:#8FC9F2;
  --bg:#F3F5F8; --surface:#FFFFFF; --surface2:#F7F9FC; --text:#101828; --muted:#667085;
  --line:#EAECF0; --ln2:#E3E8EE; --hov:#F7F9FC; --tabon:#E8F1FC;
  --run:#1668C4; --run-bg:#E6F0FB; --done:#1E9E5A; --done-bg:#E4F5EC;
  --chk:#B26B00; --chk-bg:#FFF2DD; --stop:#D64545; --stop-bg:#FDE8E8;
  --btn-ink:#344054; --r-card:18px; --r-ctl:12px; --ctl:43px;
  --sh:0 1px 2px #1018280d,0 12px 32px -20px #0B254540;
  /* 층 순서 (1.1) — 모든 제품이 이 값만 써요. 숫자를 직접 쓰지 않아요.
     본문 0 < 작은 탭 28 < 머리말 30 < 폰 아래 탭바 60 < 사람 단추 ▾ 70 < 창(어두운 막 + 확인 · 입력 · 자세히) 90 < 알림 글(토스트) 100 */
  --z-sub:28; --z-hdr:30; --z-tbar:60; --z-drop:70; --z-dialog:90; --z-toast:100;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e141c;--surface:#161e28;--surface2:#1d2733;--text:#e8edf4;--muted:#95a3b6;--line:#2b3644;--ln2:#334052;
  --hov:#1d2733;--tabon:#102B47;--blue:#5FA8E8;
  --run:#5FA8E8;--run-bg:#102B47;--done:#4ad48f;--done-bg:#12312a;--chk:#f0a95e;--chk-bg:#332412;--stop:#ff8b82;--stop-bg:#331614;
  --sh:0 2px 10px rgba(0,0,0,.4);--btn-ink:#d0d8e2;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141c;--surface:#161e28;--surface2:#1d2733;--text:#e8edf4;--muted:#95a3b6;--line:#2b3644;--ln2:#334052;
  --hov:#1d2733;--tabon:#102B47;--blue:#5FA8E8;
  --run:#5FA8E8;--run-bg:#102B47;--done:#4ad48f;--done-bg:#12312a;--chk:#f0a95e;--chk-bg:#332412;--stop:#ff8b82;--stop-bg:#331614;
  --sh:0 2px 10px rgba(0,0,0,.4);--btn-ink:#d0d8e2;color-scheme:dark}

/* 한국어 줄바꿈은 낱말 단위로 («받을 금/액»처럼 끊기지 않게) */
.cgg-app,.cgg-sheet{word-break:keep-all;overflow-wrap:anywhere}
.cgg-app svg.ic,.cgg-tbar svg.ic,.cgg-acts svg.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ───────── ① 틀: 가로 메뉴 (기본) ───────── */
.cgg-app{box-sizing:border-box;background:var(--bg);color:var(--text);min-height:100%}
.cgg-app *,.cgg-tbar *{box-sizing:border-box}
.cgg-hdr{box-sizing:border-box;position:sticky;top:env(safe-area-inset-top,0px);z-index:var(--z-hdr);background:var(--navy);color:#fff}
.cgg-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 22px}
.cgg-brand{display:flex;align-items:center;gap:10px;width:300px;min-width:0;flex:none}
.cgg-brand .cgg-ci{width:34px;height:34px;border-radius:10px;background:var(--sky);color:var(--navy);display:grid;place-items:center;font-weight:900;flex:none}
.cgg-brand b{font-size:16px;font-weight:900}
.cgg-brand small{display:block;font-size:11.5px;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cgg-biz{font-size:12.5px;line-height:1.35;min-width:0} .cgg-biz b{display:block;font-size:14px}
.cgg-right{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.cgg-nav{display:flex;gap:4px;padding:8px 18px 10px;background:var(--surface);overflow-x:auto;scrollbar-width:none;box-shadow:0 1px 0 var(--line)}
.cgg-nav button{flex:none;border:0;background:transparent;font:inherit;font-size:14px;color:#6B7684;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.cgg-nav button svg.ic{display:none}
.cgg-nav button:hover{color:var(--text)}
.cgg-nav button[aria-selected="true"]{color:var(--blue);background:var(--tabon);font-weight:700}
.cgg-sub{display:flex;gap:6px;padding:12px 22px 0;overflow-x:auto;scrollbar-width:none}
.cgg-sub button{flex:none;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--ln2);background:var(--surface);font:inherit;font-size:13px;cursor:pointer;color:var(--muted)}
.cgg-sub button[aria-selected="true"]{background:var(--tabon);color:var(--blue);border-color:transparent;font-weight:700}
.cgg-main{padding:22px 22px 44px}
.cgg-app :focus-visible{outline:3px solid var(--sky);outline-offset:2px}

/* ───────── ① 세로 메뉴 · 아이콘 메뉴 (넓은 화면에서만, 폰은 늘 같은 모양) ───────── */
@media (min-width:1000px){
  .cgg-app.lay-side{padding-left:252px} .cgg-app.lay-icon{padding-left:76px}
  .lay-side > .cgg-hdr,.lay-icon > .cgg-hdr{position:fixed;left:0;top:0;bottom:0;width:252px;overflow-y:auto;display:flex;flex-direction:column;padding:18px 14px;gap:3px}
  .lay-icon > .cgg-hdr{width:76px;padding:14px 0;align-items:center;gap:4px}
  .lay-side .cgg-top,.lay-icon .cgg-top{display:contents}
  .lay-side .cgg-brand{width:auto;padding:2px 4px 14px}
  .lay-side .cgg-biz{background:#ffffff0f;border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:12px;color:#ffffffb3}
  .lay-side .cgg-nav,.lay-icon .cgg-nav{order:2;flex-direction:column;background:transparent;box-shadow:none;padding:0;gap:3px;overflow:visible}
  .lay-side .cgg-nav button{position:relative;width:100%;gap:12px;font-size:14.5px;color:#ffffffb8;padding:10px 12px;text-align:left}
  .lay-side .cgg-nav button svg.ic,.lay-icon .cgg-nav button svg.ic{display:block}
  .lay-side .cgg-nav button:hover,.lay-icon .cgg-nav button:hover{background:#ffffff0d;color:#fff}
  .lay-side .cgg-nav button[aria-selected="true"]{background:#ffffff1a;color:#fff;font-weight:700}
  .lay-side .cgg-nav button[aria-selected="true"]::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--sky)}
  /* 오른쪽 위 버튼은 본문 윗줄(흰 띠)로 — 남색이 두 겹이 되지 않게 */
  .lay-side .cgg-right,.lay-icon .cgg-right{position:fixed;top:0;right:0;left:252px;z-index:calc(var(--z-hdr) - 1);height:64px;margin:0;padding:0 32px;background:var(--surface);box-shadow:0 1px 0 var(--line);justify-content:flex-end;flex-wrap:nowrap}
  .lay-icon .cgg-right{left:76px}
  .lay-side .cgg-sub,.lay-icon .cgg-sub{position:fixed;top:64px;left:252px;right:0;z-index:var(--z-sub);padding:12px 32px;background:var(--bg)}
  .lay-icon .cgg-sub{left:76px}
  .lay-side > .cgg-main,.lay-icon > .cgg-main{padding:86px 32px 44px}
  .lay-side.hasSub > .cgg-main,.lay-icon.hasSub > .cgg-main{padding-top:132px}
  .lay-icon .cgg-brand{width:auto;padding:0 0 12px} .lay-icon .cgg-brand > div{display:none}
  .lay-icon .cgg-biz{position:fixed;top:0;left:100px;height:64px;z-index:var(--z-hdr);display:flex;flex-direction:column;justify-content:center;color:var(--text)}
  .lay-icon .cgg-biz small{color:var(--muted)}
  .lay-icon .cgg-nav button{width:56px;flex-direction:column;gap:4px;font-size:10.5px;color:#ffffffa6;padding:9px 0 7px;border-radius:12px;justify-content:center}
  .lay-icon .cgg-nav button svg.ic{width:21px;height:21px}
  .lay-icon .cgg-nav button[aria-selected="true"]{background:#ffffff1f;color:#fff;font-weight:700}
  .lay-icon .cgg-nav button .lbl{white-space:nowrap;max-width:56px;overflow:hidden;text-overflow:ellipsis}
}

/* ───────── ③ 홈 할 일 카드 3장 ───────── */
.cgg-acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 16px}
.cgg-act{display:flex;align-items:center;gap:12px;padding:16px 18px;border:0;font:inherit;text-align:left;cursor:pointer;color:inherit;background:var(--surface);border-radius:var(--r-card);box-shadow:var(--sh);transition:transform .15s;min-width:0}
.cgg-act:hover{transform:translateY(-2px)}
.cgg-act .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.cgg-act .ico.chk{background:var(--chk-bg);color:var(--chk)} .cgg-act .ico.stop{background:var(--stop-bg);color:var(--stop)} .cgg-act .ico.run{background:var(--run-bg);color:var(--run)}
.cgg-act .tx{min-width:0} .cgg-act b{display:block;font-size:14.5px} .cgg-act small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.cgg-act .ar{margin-left:auto;color:var(--muted);font-size:18px}
@media (max-width:1100px){ .cgg-acts{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){ .cgg-act{transition:none} .cgg-act:hover{transform:none} }

/* ───────── ④ 사람 단추 ▾ 펼침 (1.1) — 마이페이지 · 요금제 · 휴지통 · 화면 설정 · 로그아웃 ───────── */
.cgg-drop{position:fixed;z-index:var(--z-drop);box-sizing:border-box;width:240px;max-width:calc(100vw - 16px);background:var(--surface);color:var(--text);border-radius:14px;box-shadow:0 12px 34px #0B254538;padding:8px;display:flex;flex-direction:column;word-break:keep-all}
.cgg-drop[hidden]{display:none}
.cgg-drop .who{padding:8px 12px 10px;font-size:12.5px;color:var(--muted);line-height:1.4} .cgg-drop .who b{display:block;color:var(--text);font-size:14px}
.cgg-drop button{display:flex;align-items:center;gap:9px;border:0;background:transparent;font:inherit;font-size:14px;padding:10px 12px;border-radius:9px;cursor:pointer;text-align:left;color:var(--text)}
.cgg-drop button:hover,.cgg-drop button:focus-visible{background:var(--hov)}
.cgg-drop button svg.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}
.cgg-drop button small{margin-left:auto;font-size:12px;color:var(--muted)}
.cgg-drop button .cnt{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--stop);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.cgg-drop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
/* 사람 단추 위 빨간 개수 (휴지통 건수 — 2026-10-14 「나」안) */
.cgg-badge{position:absolute;top:-5px;left:22px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--stop);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;font-style:normal;line-height:1}

/* 창 · 알림 글 층 (1.1) — 제품의 창에 이 class 를 «더하거나», 제품 CSS 에서 z-index:var(--z-dialog) 로 맞춰요 */
.cgg-dialog{z-index:var(--z-dialog)!important} .cgg-toast{z-index:var(--z-toast)!important}

/* ───────── ⑤ 체험 모드 (1.2) — 미리 써 보기(가입 전) · 체험판(결제 전) 같은 모양 ───────── */
.cgg-trial{display:flex;align-items:center;gap:14px;background:var(--navy);color:#fff;border-radius:var(--r-card);padding:14px 18px;margin:0 0 16px}
.cgg-trial .tag{flex:none;background:var(--sky);color:var(--navy);font-weight:900;font-size:12.5px;border-radius:999px;padding:4px 11px}
.cgg-trial .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cgg-trial .tx b{font-size:14.5px} .cgg-trial .tx small{font-size:12.5px;opacity:.78;line-height:1.5}
.cgg-trial .go{flex:none;height:40px;padding:0 16px;border-radius:12px;border:1px solid #ffffff40;background:#ffffff14;color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.cgg-trial .prog{display:block;height:4px;border-radius:2px;background:#ffffff26;margin-top:6px;overflow:hidden}
.cgg-trial .prog i{display:block;height:100%;background:var(--sky)}
.cgg-lock{display:inline-flex;margin-left:5px;vertical-align:-2px;opacity:.75} .cgg-lock svg.ic{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cgg-left{margin-left:8px;font-size:11.5px;font-weight:700;color:var(--run);background:var(--run-bg);border-radius:999px;padding:2px 8px;white-space:nowrap}
.cgg-left.out{color:var(--muted);background:var(--bg)}
.cgg-cls{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--sh);padding:18px 20px;margin:0 0 16px}
.cgg-cls h3{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:16px} .cgg-cls h3 small{font-size:12px;color:var(--muted);font-weight:500}
.cgg-clsrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)} .cgg-clsrow:first-of-type{border-top:0}
.cgg-clsrow .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px} .cgg-clsrow .nm b{font-size:14px} .cgg-clsrow .nm small{font-size:12.5px;color:var(--muted)}
.cgg-clsrow .st{font-size:12.5px;color:var(--muted)}
.cgg-clsrow button{flex:none;height:36px;padding:0 12px;border-radius:var(--r-ctl);border:1px solid var(--ln2);background:var(--surface);color:var(--btn-ink);font:inherit;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.cgg-k{flex:none;display:inline-flex;align-items:center;gap:3px;min-width:52px;justify-content:center;height:24px;border-radius:999px;font-size:12px;font-weight:700}
.cgg-k.lock{background:var(--stop-bg);color:var(--stop)} .cgg-k.try{background:var(--run-bg);color:var(--run)} .cgg-k.see{background:var(--done-bg);color:var(--done)}
.cgg-k svg.ic{width:12px;height:12px}
@media (max-width:600px){
  .cgg-trial{flex-wrap:wrap;gap:8px 10px;padding:12px;border-radius:14px}
  .cgg-trial .tx{flex-basis:calc(100% - 70px)} .cgg-trial .go{width:100%;height:38px}
  .cgg-clsrow{flex-wrap:wrap;gap:8px 12px} .cgg-clsrow .nm{flex:1 1 calc(100% - 76px)} .cgg-clsrow button,.cgg-clsrow .st{margin-left:64px}
}

/* ═══════════ ⑥ 화면 일곱 칸 본문 (1.3) — J안 4판 값 그대로 ═══════════ */
/* ② 화면 머리: 묶음 › 화면 + 말하는 제목 + 설명 한 줄 + 오른쪽 버튼 */
.cgg-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:0 0 18px}
.cgg-head .hello{min-width:0;flex:1 1 320px}
.cgg-head .hello small{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.cgg-head .hello h1{margin:0;font-size:28px;font-weight:900;letter-spacing:-.8px;line-height:1.3;text-wrap:balance}
.cgg-head .hello h1 em{font-style:normal;color:var(--blue)}
.cgg-head .hello p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.cgg-head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
/* 버튼 — 높이 43 · 모서리 12 · 파란 버튼은 한 화면에 하나 */
.cgg-btn{height:var(--ctl);padding:0 18px;border-radius:var(--r-ctl);border:1px solid var(--ln2);background:var(--surface);font:inherit;font-weight:700;font-size:14px;color:var(--btn-ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.cgg-btn:hover{border-color:var(--muted)}
.cgg-btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 16px -8px #1668C4cc}
.cgg-btn:disabled{opacity:.45;cursor:default}
.cgg-btn svg.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cgg-card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--sh);margin:0 0 16px}
/* ⑤ 숫자 카드 4개 — 큰 숫자 + 작은 그래프 + 지난주보다 */
.cgg-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 16px}
.cgg-kpi{position:relative;padding:18px 20px;background:var(--surface);border-radius:var(--r-card);box-shadow:var(--sh);min-width:0}
.cgg-kpi small{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding-right:80px}

/* ═══════════════════════════════════════════════════════════════════

  /* ⑥ 데이터 카드 — 표 열 차례: 선택 → 이름 → 번호 → 내용 → 날짜 → 금액 → 상태 (열 너비는 kinds 로 자동)

/* 같은 차량번호는 가장 최근 기록이 «지금»입니다 */
function latest(){var m={};(S.cars||[]).forEach(function(x){if(!m[x.plate]||String(x.inAt)>String(m[x.plate].inAt))m[x.plate]=x;});
  return Object.keys(m).map(function(k){return m[k];}).sort(function(a,b){return a.at<b.at?1:a.at>b.at?-1:0;});}
function isDone(x){return !!S.done[x.key];}
function stepOf(x){var i=STAGES.indexOf(x.stage);return i<0?0:i;}
/* 알림 = 내 차의 입고·출고·도착 기록 */
function jong(w){var c=String(w||"").trim().slice(-1),k=c.charCodeAt(0);if(k>=0xAC00&&k<=0xD7A3)return (k-0xAC00)%28;return /[0-9]/.test(c)?("013678".indexOf(c)>=0?1:0):/[lmnr]/i.test(c)?8:0;}
function ga(w){return w+(jong(w)?"이":"가");}
function ro(w){var j=jong(w);return w+(j&&j!==8?"으로":"로");}
function events(){
  var E=[];(S.cars||[]).forEach(function(x){
    var who=x.plate||"차";
    E.push({k:"in",t:x.shopName+" 입고",d:ga(who)+" "+x.shopName+"에 입고됐어요.",at:x.inAt,via:"기록"});
    if(x.outAt){
      if(x.stage==="출고"&&x.dest)E.push({k:"out",t:x.shopName+" 출고",d:ga(who)+" 출고돼 "+ro(x.dest)+" 이동 중이에요.",at:x.outAt,via:"알림톡"});
      else E.push({k:"arr",t:"목적지 도착",d:ga(who)+" "+(x.dest||"목적지")+"에 도착했어요.",at:x.outAt,via:"알림톡"});
    }
  });
  E.sort(function(a,b){return a.at<b.at?1:a.at>b.at?-1:0;});
  return E.slice(0,100);
}
function unread(){var s=S.seen||"";return events().filter(function(e){return e.at>s;}).length;}

/* ---------- d3.0 자료 계산 (서버에서 받은 내 차 기록만으로) ---------- */
function sod(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function isToday(iso){if(!iso)return false;var d=new Date(iso);return !isNaN(d)&&sod(d).getTime()===sod(new Date()).getTime();}
function daysAgo(iso){var d=new Date(iso);return isNaN(d)?0:Math.floor((Date.now()-d.getTime())/864e5);}
function weekStart(off){var t=sod(new Date()),w=(t.getDay()+6)%7;return new Date(t.getTime()-(w+7*(off||0))*864e5);}
function sumOf(plate){return (S.cars||[]).filter(function(x){return x.plate===plate;}).reduce(function(a,x){return a+(Number(x.total)||0);},0);}
function worksOf(c){return (c.works&&c.works.length)?c.works.join(", "):(c.outAt?"":"작업 대기");}
function lastAt(iso){return isToday(iso)?hm(iso):day(iso).split(" ")[0];}
function stageOf(c){return isDone(c)?"상품화 완료":c.stage;}
function nm2(c){return c.plate||c.model||"차";}
function names(L){return L.slice(0,2).map(function(c){return nm2(c);}).join(" · ")+(L.length>2?" 외 "+(L.length-2)+"대":"");}
function G(){
  var all=latest(),act=all.filter(function(c){return !isDone(c);});
  var ws=weekStart(0),pws=weekStart(1);
  var inW=function(a,b){var m={};(S.cars||[]).forEach(function(x){var d=new Date(x.inAt);if(d>=a&&(!b||d<b))m[x.plate]=1;});return Object.keys(m).length;};
  var spark=[6,5,4,3,2,1,0].map(function(k){var t=sod(new Date()).getTime()-k*864e5;
    return (S.cars||[]).filter(function(x){var d=new Date(x.inAt);return !isNaN(d)&&sod(d).getTime()===t;}).length;});
  return {all:all,
    work:act.filter(function(c){return c.stage==="작업 중";}),
    today:act.filter(function(c){return c.outAt&&isToday(c.outAt);}),
    wk:inW(ws),pwk:inW(pws,ws),spark:spark,
    arr:act.filter(function(c){return c.stage==="도착";}),
    moving:act.filter(function(c){return c.stage==="출고";}),
    slow:act.filter(function(c){return c.stage==="작업 중"&&daysAgo(c.inAt)>=3;})};
}
function spk(v,col){var mx=Math.max.apply(null,v.concat([1])),w=72,h=26;
  var p=v.map(function(y,i){return (i*w/(v.length-1)).toFixed(1)+","+(h-2-(y/mx)*(h-4)).toFixed(1);}).join(" ");
  return '<svg class="sp" viewBox="0 0 72 26" preserveAspectRatio="none" aria-hidden="true"><polyline points="'+p+'" fill="none" stroke="'+col+'" stroke-width="1.6" stroke-linejoin="round"/></svg>';}

/* 상품화 진행 기록 — 택배 조회처럼 시간순 (최근이 맨 위) */
function hm(iso){var d=new Date(iso);if(isNaN(d))return "";return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function dd(iso){var w=when(iso);if(/^오늘/.test(w))return "오늘";if(/^어제/.test(w))return "어제";var d=new Date(iso);return isNaN(d)?"":(d.getMonth()+1)+"/"+d.getDate();}
function tlC(trail){
  var E=[];
  (trail||[]).forEach(function(x){
    var wk=x.works&&x.works.length?'작업: <b>'+x.works.map(esc).join(", ")+'</b>':(x.outAt?'':'작업 대기');
    var amt=Number(x.total)?won(x.total):'';
    E.push({at:x.inAt,what:'<em>'+esc(x.shopName)+'</em> 입고',sub:[wk,amt].filter(Boolean).join(' · '),o:0});
    if(x.outAt){
      if(x.stage==="출고"&&x.dest)E.push({at:x.outAt,what:'<em>'+esc(x.shopName)+'</em> 출고',sub:'→ <b>'+esc(ro(x.dest))+'</b> 이동',o:1});
      else E.push({at:x.outAt,what:'<em>'+esc(x.dest||x.shopName)+'</em> 도착',sub:esc(x.shopName)+'에서 출고 · 도착',o:1});
    }
  });
  E.sort(function(a,b){return a.at<b.at?1:a.at>b.at?-1:0;});
  if(!E.length)return '<div style="color:var(--sub)">기록이 없어요.</div>';
  return E.map(function(e,i){return '<div class="ev'+(i===0?' cur':'')+(e.o?' o':'')+'"><div class="t"><b>'+hm(e.at)+'</b><small>'+dd(e.at)+'</small></div><div class="ln"><i></i></div>'+
    '<div class="tx"><div class="what">'+e.what+(i===0?' <span class="lbn">지금</span>':'')+'</div>'+(e.sub?'<div class="sub">'+e.sub+'</div>':'')+'</div></div>';}).join("");
}

/* ③ 청구서 — 업체별 청구서 묶음 + 계좌이체 안내 (서버 myBills · 읽기만 · 결제 단추 없음 · 돈은 차곳간을 거치지 않음) */
function isPaid(b){return b.state==="입금 확인됨";}
function hasDue(b){return /^\d{4}-\d{2}-\d{2}/.test(String(b.dueDate||""));}
function dueLeft(b){if(!hasDue(b))return 9999;var x=new Date(String(b.dueDate).slice(0,10)+"T00:00:00");return Math.round((x-sod(new Date()))/864e5);}
function md(d){return String(d).slice(5,10).replace("-","/");}
function monthKey(b){var m=String(b.month||""),y=m.match(/(\d{4})\D+(\d{1,2})/);if(y)return +y[1]*100+ +y[2];var k=m.match(/(\d{1,2})/);return k?+k[1]:99;}
function dueTxt(b){if(isPaid(b))return "입금 확인";if(!hasDue(b))return "";var n=dueLeft(b);
  return n<0?"기한 "+md(b.dueDate)+" · "+(-n)+"일 지남":n===0?"기한 오늘("+md(b.dueDate)+")":"기한 "+md(b.dueDate)+" · "+n+"일 남음";}
function billList(){var L=(S.bills||[]).slice();
  /* 입금 전 먼저 → 기한 있는 것은 기한 순 → 기한 없는 것은 월 순 (결제/10 D4) */
  L.sort(function(a,b){if(isPaid(a)!==isPaid(b))return isPaid(a)?1:-1;
    if(hasDue(a)&&hasDue(b))return dueLeft(a)-dueLeft(b);if(hasDue(a)!==hasDue(b))return hasDue(a)?-1:1;return monthKey(a)-monthKey(b);});return L;}
function billSum(){return (S.bills||[]).filter(function(b){return !isPaid(b);}).reduce(function(a,b){return a+(Number(b.due)||0);},0);}

  var withDue=open.filter(hasDue),first=withDue.length?withDue.reduce(function(a,b){return dueLeft(a)<=dueLeft(b)?a:b;}):null;
  var h=hello('청구서 · '+today(),open.length?'낼 금액 <em>'+won(billSum())+'</em>':'낼 청구서가 없어요',

  if(!L.length)return h+(S.billsReady===false&&!DEMO?'<div class="card lempty">청구서 모아 보기를 준비하고 있어요. 그동안은 업체가 보낸 알림톡의 청구서를 봐 주세요.</div>':'');
  return h+'<div class="bills">'+L.map(function(b){var n=dueLeft(b),pd=isPaid(b),st=pd?"b-done":n<0?"b-late":"b-open";
    return '<div class="bill '+st+'"><div class="bh"><div><b>'+esc(b.shop)+'</b><small>'+esc([b.month,b.cars?b.cars+"대":"",b.name].filter(Boolean).join(" · "))+'</small></div>'+
      '<span class="pill p-'+(pd?'fin':n<0?'late':'arr')+'" style="margin:0">'+(pd?'입금 확인':n<0?'기한 지남':'입금 전')+'</span></div>'+
      '<div class="bm"><strong class="num">'+won(pd?b.amount:b.due)+'</strong>'+(dueTxt(b)?'<span>'+esc(dueTxt(b))+'</span>':'')+'</div>'+
      (pd?'':(b.bank?'<div class="acct"><span>'+esc(b.bank)+'</span></div>':'')+
        '<div class="bb">'+(b.bank?'<button class="btn sec2" data-act="copy" data-v="'+esc(b.bank)+'" data-m="계좌를">계좌 복사</button>':'')+
        '<button class="btn sec2" data-act="copy" data-v="'+esc(String(Math.round(Number(b.due)||0)))+'" data-m="금액을">금액 복사</button>'+
        '<button class="btn sec2" data-act="billView" data-v="'+esc(b.url||"")+'">내역 보기</button></div>')+
      (pd?'<div class="bb one"><button class="btn sec2" data-act="billView" data-v="'+esc(b.url||"")+'">내역 보기</button></div>':'')+'</div>';}).join("")+'</div>'+
   (open.length?'<div class="soon">'+CGG.ic("lock")+'<span><b>한 번에 결제는 곧 열려요.</b> 지금은 업체마다 계좌로 보내 주세요.</span></div>':'')+
   (open.length?'<div class="note">휴대폰이면 «계좌 복사»를 누른 뒤 은행 앱을 열어 붙여 넣어 주세요. 금액도 따로 복사할 수 있어요.<br>입금하면 업체가 확인한 뒤 «입금 확인»으로 바뀌어요. 차곳간은 금액을 받지 않고, 업체 계좌로 바로 보내요.</div>':'')+

}

function bind(){
  var q=$("q");if(q)q.oninput=function(){S.q=q.value.trim();var p=q.selectionStart;render();var n=$("q");n.focus();try{n.setSelectionRange(p,p);}catch(e){}};
  var ph=$("ph");if(ph){ph.oninput=function(){S.phone=dg(ph.value).slice(0,11);};ph.onkeydown=function(e){if(e.key==="Enter")act("otp");};}
  var o0=$("o0");if(o0){
    var boxes=[0,1,2,3,4,5].map(function(i){return $("o"+i);});
    boxes.forEach(function(b,i){
      b.oninput=function(){var v=dg(b.value);
        if(v.length>1){v.split("").slice(0,6-i).forEach(function(ch,j){boxes[i+j].value=ch;});var nx=Math.min(5,i+v.length);boxes[nx].focus();}
        else{b.value=v;if(v&&i<5)boxes[i+1].focus();}
        if(code().length===6)act("enter");};
      b.onkeydown=function(e){if(e.key==="Backspace"&&!b.value&&i>0){boxes[i-1].focus();boxes[i-1].value="";}if(e.key==="Enter")act("enter");};
      b.onpaste=function(e){var t=dg((e.clipboardData||window.clipboardData).getData("text"));if(t.length>=6){e.preventDefault();t.slice(0,6).split("").forEach(function(ch,j){boxes[j].value=ch;});act("enter");}};
    });
    if(!S.sending)o0.focus();
  }
  var all=$("aAll");if(all){var subs=["aT","aP","aM"].map($);
    all.onchange=function(){subs.forEach(function(x){x.checked=all.checked;});};
    subs.forEach(function(x){x.onchange=function(){all.checked=subs.every(function(y){return y.checked;});};});}
  document.querySelectorAll("[data-pref]").forEach(function(el){el.onchange=function(){var p={};try{p=JSON.parse(ls("cgd_pref")||"{}");}catch(e){}p[el.id]=el.checked;ls("cgd_pref",JSON.stringify(p));toast("저장했어요 · 앱 알림이 열리면 이대로 보내요");};});
}
function code(){return [0,1,2,3,4,5].map(function(i){return ($("o"+i)||{}).value||"";}).join("");}

function keepChecks(fn){var ids=["aT","aP","aM","aAll"],k=ids.map(function(id){return $(id)&&$(id).checked;});fn();ids.forEach(function(id,i){if($(id))$(id).checked=k[i];});}

function act(a,el){
  var v=el&&el.getAttribute("data-v");
  if(S.dlg&&(a==="tab"||a==="logout"||a==="go")){S.dlg=false;CGG.closeDialog();}
  if(a==="otp"||a==="resend"){
    var p=dg(S.phone);if(!/^01\d{8,9}$/.test(p)){S.err="휴대폰 번호가 올바르지 않습니다. 다시 확인해 주세요.";render();return;}
    S.sending=true;S.err="";render();
    api("sendCode",[p]).then(function(){S.sending=false;S.step=2;S.err="";render();if(a==="resend")toast("인증번호를 다시 발송했습니다.");},
      function(e){S.sending=false;S.err=errMsg(e);render();});return;
  }
  if(a==="otpback"){S.step=1;S.err="";render();return;}
  if(a==="enter"){
    var c=code();if(c.length!==6){S.err="인증번호 6자리를 모두 입력해 주세요.";render();return;}
    if(S.sending)return;S.sending=true;S.err="";
    api("verifyCode",[S.phone,c]).then(function(r){
      S.sending=false;S.key=r.key;S.phone=r.phone;S.name=r.name||"";S.agreed=!!r.agreed;
      if(!DEMO){ls("cgd_key",r.key);ls("cgd_phone",r.phone);}
      armBack();
      if(S.agreed){enterMain();toast((S.name?S.name+" 딜러님, ":"")+"로그인했습니다.");}else{S.view="agree";S.err="";render();}
    },function(e){S.sending=false;S.err=errMsg(e);render();});return;
  }
  if(a==="doc"){keepChecks(function(){S.docOpen=S.docOpen===v?"":v;render();});return;}
  if(a==="agree"){
    if(!$("aT").checked||!$("aP").checked){keepChecks(function(){S.err="필수 항목 2개에 동의해야 시작할 수 있습니다.";render();});return;}
    var mk=$("aM").checked;
    api("agree",[mk]).then(function(){S.agreed=true;S.agreedAt=new Date().toISOString();S.err="";enterMain();toast("동의가 완료되었습니다. 어서 오세요.");},
      function(e){keepChecks(function(){S.err=errMsg(e);render();});});return;
  }
  if(a==="tab"){if(S.view==="car"){S.skipPop=1;history.back();}S.tab=v;S.view="main";render();
    if(v==="noti"){setTimeout(function(){markSeen();},1500);}
    try{window.scrollTo(0,0);}catch(e){}return;}
  if(a==="filter"){S.filter=v;render();return;}
  if(a==="copy"){var what=el.getAttribute("data-m")||"";
    var done=function(){toast(what+" 복사했어요");},fail=function(){S.sheet="copy";S.copyText=v;render();};
    try{navigator.clipboard.writeText(v).then(done,fail);}catch(e){fail();}return;}
  if(a==="billView"){if(/^https:\/\/app\.cgg\.co\.kr\//.test(v||"")){try{window.open(v,"_blank","noopener");}catch(e){}}else toast(DEMO?"시연에서는 청구서 화면이 열리지 않아요.":"청구서를 열지 못했어요. 업체에 문의해 주세요.");return;}
  if(a==="go"&&v==="BILLS"){S.tab="bills";S.view="main";render();try{window.scrollTo(0,0);}catch(e){}return;}
  if(a==="go"){S.filter=v||"전체";S.carT=S.carT||{};if(S.carT.q==null){S.carT.q="";S.carT.k=0;S.carT.dir=1;S.carT.size=10;S.carT.sel={};}S.carT.f=(v&&v!=="전체")?v:"";S.carT.page=1;S.q="";S.tab="cars";S.view="main";render();try{window.scrollTo(0,0);}catch(e){}return;}
  if(a==="finishSel"){var ks=Object.keys(S.sel).filter(function(k){return S.sel[k];});
    var L=latest().filter(function(c){return ks.indexOf(c.key)>=0&&!isDone(c);});if(!L.length)return;
    S.sheet="fin";S.finL=L;render();return;}
  if(a==="finishDo"){var L2=S.finL||[];S.sheet=null;render();
    L2.reduce(function(p,c){return p.then(function(){return api("finish",[c.shop,c.id]).then(function(){S.done[c.key]=1;});});},Promise.resolve())
      .then(function(){S.sel={};if(S.carT)S.carT.sel={};render();toast(L2.length+"대를 «상품화 완료»로 표시했어요");},function(e){render();toast(errMsg(e));});return;}
  if(a==="nf"){S.nf=v;render();return;}
  if(a==="car"){var sh=el.getAttribute("data-s");S.detail=null;S.dlg=true;openCar("불러오는 중이에요…");
    api("car",[sh,v]).then(function(r){S.detail=r;if(S.dlg)openCar();},function(e){S.dlg=false;CGG.closeDialog();toast(errMsg(e));});return;}
  if(a==="back"){history.back();return;}
  if(a==="big"){S.sheet="photos";render();return;}
  if(a==="finish"||a==="unfinish"){var c2=S.detail&&S.detail.car;if(!c2)return;
    api(a,[c2.shop,c2.id]).then(function(){if(a==="finish")S.done[c2.key]=1;else delete S.done[c2.key];
      if(a==="finish"){if(S.dlg){S.dlg=false;CGG.closeDialog();render();}else history.back();toast("«상품화 완료»로 표시했어요.");}
      else{render();if(S.dlg)openCar();toast("상품화 완료를 취소했어요");}},function(e){toast(errMsg(e));});return;}
  if(a==="soon"){toast("곧 열려요");return;}
  if(a==="logout"){S.sheet="logout";render();return;}
  if(a==="leaveAsk"){S.sheet="leave";render();return;}
  if(a==="nameAsk"){S.sheet="name";render();var n=$("nm");if(n)n.focus();return;}
  if(a==="docs"){S.sheet="docs";render();return;}
  if(a==="close"){S.sheet=null;render();return;}
  if(a==="nameSave"){var nm=(($("nm")||{}).value||"").trim();api("setName",[nm]).then(function(r){S.name=r.name;S.sheet=null;render();toast("저장했어요");},function(e){toast(errMsg(e));});return;}
  if(a==="logoutdo"){S.sheet=null;api("logout").then(function(){},function(){}).then(function(){forget();toast("로그아웃했어요");});return;}
  if(a==="leave"){S.sheet=null;api("leave").then(function(){forget();toast("동의를 철회했어요");},function(e){toast(errMsg(e));});return;}
}

  },function(e){if(S.key){S.cars=[];render();toast(errMsg(e));}});
})();
</script>
