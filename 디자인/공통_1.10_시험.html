<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>공통 부품 1.10 시험</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
html,body{margin:0;background:var(--bg)}
body{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;color:var(--text)}
</style>
<link rel="stylesheet" href="공통/cgg-j4-1.10.css">
</head><body>
<div class="cgg-app" id="app">
  <header class="cgg-hdr"><div class="cgg-top" id="top"></div><nav class="cgg-nav" id="nav"></nav></header>
  <main class="cgg-main" id="main"></main>
  <nav class="cgg-tbar" id="tbar"></nav>
</div>
<script src="공통/cgg-j4-1.10.js"></script>
<script src="메뉴지도/워시_메뉴.js"></script>
<script>
/* 미리보기 전용 — 지어낸 자료. 일 화면 하나를 SKILL.md «화면 뼈대» 차례로: 제목+설명 → 할 일 띠 → 도구줄 → 숫자 칸 4 → 표 → 도움 */
var D=CGG_MENU_WASH, cur="ledger/list";
function go(k){ cur=k; CGG.toast("«"+k+"» 화면으로 (미리보기)"); }
CGG.favicon();
CGG.layout.init(document.getElementById("app"), "cgg_19_test_layout");
CGG.header(document.getElementById("top"),{product:"워시", sub:"광택 · 세차 정산", ver:"v130", date:"10/18",
  biz:{name:"브라더광택", line:"123-45-67890 · 대표 김대표"},
  find:{mode:"nav", feats:D.feats, onGo:function(f){ go(f.go); }, onPhone:function(){ CGG.allMenu(D.groups, cur, go, D.feats, function(f){ go(f.go); }, {focus:true}); }},
  notice:function(){ CGG.toast("공지사항 (미리보기)"); }, help:function(){ CGG.toast("도움말 (미리보기)"); }, link:function(){ CGG.toast("직원 앱 주소를 복사했어요 (미리보기)"); },
  refresh:function(){ CGG.toast("새로고침했어요 (미리보기)"); },
  auto:{value:"30", options:[["0","자동 끄기"],["30","30초마다"],["60","1분마다"]], onChange:function(){}}, saved:true,
  field:{label:"현장 화면", on:function(){ CGG.toast("현장 화면으로 (미리보기)"); }},
  me:{name:"김대표", role:"대표", items:[{key:"me",icon:"user",label:"마이페이지",note:"요금제 · 사용량"},{key:"trash",icon:"trash",label:"휴지통"},"-",{key:"lay",icon:"pc",label:"화면 설정",note:CGG.layout.name()},"-",{key:"out",icon:"out",label:"로그아웃"}], onPick:function(k){ if(k==="me") CGG.myPage({who:"김대표 · 대표 · 브라더광택", plan:[["지금 요금제","스탠다드"],["다음 결제일","2026-11-15"]], usage:[["알림톡",198,1000,"건"],["사진 읽기",412,2000,"회"],["직원 계정",3,5,"명"]], account:[["로그인 번호","010-****-0000"]], ok:"요금제 바꾸기", onOk:function(){ CGG.toast("요금제 창 (미리보기)"); }}); }}});
CGG.nav(document.getElementById("nav"), D.groups, cur, go, {find:{feats:D.feats, onGo:function(f){ go(f.go); }}});
CGG.tabbar(document.getElementById("tbar"), D.tabs, "ledger", function(k){ if(k==="__all") CGG.allMenu(D.groups, cur, go, D.feats, function(f){ go(f.go); }); else go(k); });
var M=document.getElementById("main");
M.innerHTML='<div>'+CGG.head({crumb:"일감 › 입고 · 출고 내역", title:"이번 달 입고 <em>42대</em> · 출고 <em>39대</em>", desc:"차를 누르면 자세히 볼 수 있어요."})
  +'<div id="band"></div><div class="cgg-tools"><div id="mp"></div><button type="button" class="cgg-btn">엑셀 받기</button><span class="sp"></span><button type="button" class="cgg-btn pri">입고 등록</button></div>'
  +'<div id="kp"></div><div id="tb"></div>'+CGG.help("«해결하러 가기»를 누르면 확인할 차만 모아 보여요. 달은 «2026년 10월 ▾»를 눌러 골라요.")+'</div>';
CGG.todoBand(document.getElementById("band"),{count:6, text:"출고했는데 아직 입금 안 된 차 6대 · 510,000원", onGo:function(){ CGG.toast("확인할 차 6대만 보여요 (미리보기)"); }});
CGG.monthPick(document.getElementById("mp"),{y:2026, m:10, min:"2025-01", max:"2026-10", onPick:function(y,m){ CGG.toast(y+"년 "+m+"월 자료로 바꿨어요 (미리보기)"); }});
CGG.kpis(document.getElementById("kp"),[
  {label:"이번 달 입고", value:"42", unit:"대", delta:"+6", spark:[3,5,4,6,7,8,9]},
  {label:"이번 달 출고", value:"39", unit:"대", delta:"+4", spark:[2,4,5,5,6,8,9], color:"#1E9E5A"},
  {label:"받을 금액", value:"730,000", unit:"원", delta:"-120,000", down:true, spark:[9,8,8,7,6,6,5], color:"#B26B00"},
  {label:"이번 달 입금", value:"840,000", unit:"원", delta:"+210,000", spark:[2,3,3,5,6,7,8], color:"#0B2545"}]);
/* 청구 단위 = 딜러 한 명 (대표님 10/18). 딜러 한 명 = 한 줄, 상사는 옆 칸 */
var ROWS, dealers=["김민수","이정호","박서준","최유진","정하늘","한지우","오세훈"], names=["한빛모터스","대성상사","오토플러스","브라더모터스광택성남지점","새길자동차","미래카","제일모터스"];
CGG.table(document.getElementById("tb"),{cols:["딜러","상사","차 번호","작업","입고일","금액","상태"], kinds:["name","text","id","text","date","money","state"],
  rows:ROWS=names.map(function(n,i){ return [dealers[i], n, (12+i)+"가 "+(3400+i*7), ["광택","세차","유리막","실내 크리닝"][i%4], "10/"+(10+i), 110000+i*30000, ["진행 중","확인 필요","완료","보류","입금 완료"][i%5]]; }),
  filters:["전체","오늘","이번 주"], find:"딜러 · 상사 · 차 번호", bulk:[{key:"paid",label:"입금 확인",needSel:true}],
  sorts:[[4,-1,"입고일 최근"],[5,-1,"금액 큰 것"],[0,1,"딜러 이름"],[1,1,"상사 이름"]], onBulk:function(k,ids){ var R=ids.map(function(i){ return ROWS[i]; }).filter(Boolean), who=R.length?R[0][0]+(R.length>1?" 외 "+(R.length-1)+"명":""):"없음", sum=R.reduce(function(t,x){ return t+x[5]; },0); if(!R.length){ CGG.toast("먼저 차를 골라 주세요"); return; } CGG.dialog({size:"confirm", title:"입금 완료로 바꿀까요?", desc:"되돌리기 어려워요. 한 번 더 확인해 주세요.", rows:[["누구에게",who],["몇 건",R.length+"대"],["얼마",CGG.won(sum)+"원"]], ok:ids.length+"대 입금 완료", cancel:"취소", onOk:function(){ CGG.toast(ids.length+"대를 입금 완료로 바꿨어요 (미리보기)"); }}); }});
</script>
</body></html>
