function grp(k){ return D.groups.filter(function(g){ return g.key===k.split("/")[0]; })[0]; }
function norm(k){ var g=grp(k); if(!g) return "home"; if(g.subs&&g.subs.length&&k.indexOf("/")<0) return g.key+"/"+g.subs[0].key; return k; }
function go(k){ cur=norm(k); draw(); window.scrollTo(0,0); }
function goFeat(f){ if(/^me\//.test(f.go)){ CGG.toast("사람 버튼 ▾ 안의 «"+f.label+"»을(를) 열어요 (미리보기)"); return; } if(/^field\//.test(f.go)){ CGG.toast("현장 화면 «입고»로 가요 (미리보기)"); return; } go(f.go); }
function tabKey(){ var g=cur.split("/")[0]; return D.tabs.some(function(t){ return t.key===g; })?g:"__all"; }
function linkTo(name){ var g=D.groups.filter(function(x){ return x.label===name||(x.subs||[]).some(function(s){ return s.label===name; }); })[0]; return g?g.key:"home"; }
function draw(){
  CGG.nav(document.getElementById("nav"), D.groups, cur, go);
  CGG.tabbar(document.getElementById("tbar"), D.tabs, tabKey(), function(k){ if(k==="__all"){ if(!CGG.closeSheet()) CGG.allMenu(D.groups, cur, go, D.feats, goFeat); return; } CGG.closeSheet(); go(k); });
  var main=document.getElementById("main"), g=grp(cur)||D.groups[0], sub=(g.subs||[]).filter(function(s){ return g.key+"/"+s.key===cur; })[0];

      money:Object.assign({},C.money,{link:{label:C.money.link,onClick:function(){ go(linkTo(C.money.link)); }}}),

      help:"홈은 정산(청구 · 입금 · 받을 금액 · 할 일)만 보여요. 차례는 두 제품이 같아요: 자주 쓰는 기능 4개 → 오늘 할 일 → 숫자 칸 4개 → 일정 · 이번 달 입금 · 이번 달 일감. 못 보낸 도착 알림은 왼쪽 «배달» 옆 빨간 숫자로 알려요."});
  } else {
    var here=D.feats.filter(function(f){ return norm(f.go)===cur && f.spot; });
    main.innerHTML=CGG.head({crumb:g.label+(sub&&g.subs.length>1?" › "+sub.label:""), title:CGG.esc(sub&&g.subs.length>1?sub.label:g.label), desc:"미리보기 화면이에요."})
      +'<div class="demo"><h3>'+CGG.esc(sub?sub.label:g.label)+'</h3><i></i><i></i><i></i></div><div class="demo"><i></i><i></i><i></i></div>'
      +(here.length?'<div class="gap"></div>':'')
      +here.map(function(f){ return '<div class="demo spotcard" id="'+CGG.esc(f.spot.replace(/^#/,""))+'"><h3>'+CGG.esc(f.label)+'</h3><p>기능 찾기 · 바로가기로 오면 이 칸으로 내려와요.</p><i></i><i></i></div>'; }).join("")
      +CGG.help("왼쪽 메뉴에서 아래 칸까지 늘 보여요. 위 «기능 찾기»에 하고 싶은 일을 쳐도 바로 와요.");
  }
}
