<title>차곳간 UI 기준틀</title>
<!-- =====================================================================
  차곳간 UI 기준틀  v1.1  (2026-10-13)
  워시 · 체크 · 관리 · 파킹 · 스튜디오 … 모든 제품이 이 파일 하나를 같이 씁니다.

  고치는 곳은 딱 세 군데입니다. 한 곳을 고치면 모든 제품이 같이 바뀝니다.
    [가] 공통 스타일  <style> 안   — 색 · 크기 · 부품 모양   (제품마다 따로 고치지 않음)
    [나] 공통 엔진    <script> 안  — 그리기 · 표 · 창 · 스크롤 (제품마다 따로 고치지 않음)
    [다] 제품 등록부  <script> 안  — 제품 이름 · 메뉴 · 화면 내용 (제품은 여기서만 다름)

  새 제품 넣기: [다]의 «새 제품 틀» 한 덩어리를 복사 → 이름 · 메뉴 · 화면만 바꿈. 끝.
  화면 오른쪽 아래 «기준틀 안내» 단추에 규칙 · 제품 넣는 법 · 창 3종이 있습니다.
  ===================================================================== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* ═══════════ [가] 공통 스타일 ═══════════ */
/* ▼ [가-1] 02_차곳간_공통_E안_스타일.css 그대로 ▼ */
/* =========================================================
   차곳간 공통 E안 스타일 (체크 · 워시 · 관리 공통)
   - 각 제품 HTML 한 파일의 <style> 맨 위에 그대로 넣어 씁니다.
   - 색과 크기는 아래 변수만 고칩니다. 화면 곳곳에 색 값을 직접 쓰지 않습니다.
   - E안 = 회색 바탕 위 흰 카드 + 큰 숫자 + 촘촘한 표 + 맨 위 머리말 한 줄만 남색
   ========================================================= */

:root{
  /* 차곳간 색 */
  --cg-blue:#1668C4;      /* 파랑: 주 단추 · 선택된 탭 글자 */
  --cg-navy:#0B2545;      /* 남색: 머리말 · 선택된 칩 */
  --cg-sky:#8FC9F2;       /* 하늘: 남색 위 강조 · CI 바탕 */

  /* 바탕 · 글자 */
  --cg-bg:#F2F4F6;        /* 화면 바탕 (회색) */
  --cg-surf:#FFFFFF;      /* 카드 · 표 바탕 (흰색) */
  --cg-ink:#14202E;       /* 본문 글자 */
  --cg-sub:#5B6B7E;       /* 보조 글자 */
  --cg-line:#E5E8EB;      /* 입력칸 · 단추 테두리 */
  --cg-tab-on:#E8F1FC;    /* 선택된 탭 바탕 */

  /* 상태 색 (정해진 규격) */
  --cg-run:#1668C4;  --cg-run-bg:#E6F0FB;   /* 하는 중 = 파랑 */
  --cg-done:#1E9E5A; --cg-done-bg:#E4F5EC;  /* 끝남 = 초록 */
  --cg-chk:#B26B00;  --cg-chk-bg:#FFF2DD;   /* 확인 필요 = 주황 */
  --cg-stop:#D64545; --cg-stop-bg:#FDE8E8;  /* 막힘 = 빨강 */
  --cg-warn:#E08A00;                        /* 할 일 띠 · 해결하러 가기 */
  --cg-todo-bg:#FFF6E5;

  /* 표 (B안처럼 촘촘하게) */
  --cg-row-h:44px;
  --cg-th-bg:#F6F8FA;
  --cg-row-line:#EDF0F4;
  --cg-col-line:#F1F3F6;
  --cg-row-hover:#F5F9FE;

  /* 모양 */
  --cg-r-card:18px;       /* 카드 둥글기 */
  --cg-r-table:14px;      /* 표 카드 둥글기 */
  --cg-r-ctl:12px;        /* 입력칸 · 단추 둥글기 */
  --cg-ctl-h:43px;        /* 도구줄 칸 · 단추 높이 (규격) */
  --cg-gap:16px;          /* 칸 사이 간격 */

  --cg-font:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}

body{background:var(--cg-bg);color:var(--cg-ink);font-family:var(--cg-font)}

/* ---------- 머리말 (남색 한 줄) ---------- */
.cg-hdr{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 18px;background:var(--cg-navy);color:#fff}
.cg-brand{display:flex;align-items:center;gap:10px;width:300px;min-width:0} /* 제품마다 같은 너비 */
.cg-ci{width:34px;height:34px;border-radius:10px;background:var(--cg-sky);color:var(--cg-navy);display:grid;place-items:center;font-weight:900;flex:none}
.cg-brand b{display:block;font-size:16px;font-weight:900}
.cg-brand small{font-size:11.5px;opacity:.72}
.cg-biz{font-size:12.5px;line-height:1.35}
.cg-biz b{display:block;font-size:14px}
.cg-biz span{opacity:.7}
.cg-hdr-right{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.cg-hbtn{height:32px;padding:0 10px;border-radius:var(--cg-r-ctl);border:1px solid #ffffff30;background:#ffffff12;color:#fff;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
.cg-live{font-size:12px;opacity:.85;display:inline-flex;align-items:center;gap:5px}
.cg-live i{width:8px;height:8px;border-radius:50%;background:var(--cg-done)}
.cg-me{height:36px;padding:0 12px 0 6px;border-radius:999px;border:1px solid #ffffff30;background:#ffffff12;color:#fff;display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:13px;cursor:pointer}
.cg-me .cg-av{width:26px;height:26px;border-radius:50%;background:var(--cg-sky);color:var(--cg-navy);display:grid;place-items:center;font-weight:900;font-size:12px}
.cg-me small{opacity:.7;font-size:11px}

/* ---------- 탭 (흰 바탕, 선택된 탭은 연한 파랑 알약) ---------- */
.cg-tabs{display:flex;gap:4px;padding:8px 14px 10px;background:var(--cg-surf);overflow-x:auto;scrollbar-width:none}
.cg-tab{flex:none;border:0;background:transparent;font:inherit;font-size:14px;color:#6B7684;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:500}
.cg-tab.on{color:var(--cg-blue);background:var(--cg-tab-on);font-weight:700}

/* ---------- 화면 본문 (일곱 칸) ---------- */
.cg-body{padding:20px 18px 22px;display:flex;flex-direction:column;gap:var(--cg-gap)}
.cg-title h2{margin:0;font-size:24px;font-weight:900;letter-spacing:-.4px}
.cg-title p{margin:4px 0 0;color:var(--cg-sub);font-size:13.5px}

/* 할 일 띠 */
.cg-todo{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 16px;border-radius:var(--cg-r-card);background:var(--cg-todo-bg)}
.cg-todo .tx{flex:1;min-width:200px;font-size:14px}
.cg-todo .tx b{color:var(--cg-warn)}
.cg-go{height:38px;padding:0 16px;border:0;border-radius:var(--cg-r-ctl);background:var(--cg-warn);color:#fff;font:inherit;font-weight:700;font-size:13.5px;cursor:pointer}

/* 도구줄 (칸 · 단추 43px) */
.cg-tool{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cg-field{height:var(--cg-ctl-h);border:1px solid var(--cg-line);border-radius:var(--cg-r-ctl);background:var(--cg-surf);padding:0 12px;font:inherit;font-size:14px;color:var(--cg-ink)}
.cg-chip{height:var(--cg-ctl-h);padding:0 14px;border-radius:999px;border:1px solid var(--cg-line);background:var(--cg-surf);font:inherit;font-size:13.5px;cursor:pointer;color:var(--cg-ink)}
.cg-chip.on{background:var(--cg-navy);color:#fff;border-color:transparent;font-weight:700}
.cg-btn{height:var(--cg-ctl-h);padding:0 16px;border-radius:var(--cg-r-ctl);font:inherit;font-weight:700;font-size:14px;cursor:pointer;border:1px solid var(--cg-line);background:var(--cg-surf);color:var(--cg-ink)}
.cg-btn.pri{background:var(--cg-blue);border-color:var(--cg-blue);color:#fff}
.cg-btn:disabled{opacity:.45;cursor:default}

/* 숫자 칸 4개 (가운데 · 자릿수 맞춤 · 큰 숫자) */
.cg-nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.cg-num{background:var(--cg-surf);border-radius:var(--cg-r-card);padding:20px 12px;text-align:center}
.cg-num small{font-size:13px;color:var(--cg-sub)}
.cg-num strong{display:block;font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;margin-top:4px;letter-spacing:-.5px}
.cg-num strong em{font-style:normal;font-size:.55em;font-weight:700;margin-left:2px;color:var(--cg-sub)}

/* 표 (촘촘하게 · 이름 칸 고정 · 큰 체크칸) */
.cg-tcard{background:var(--cg-surf);border-radius:var(--cg-r-table);overflow:hidden}
.cg-tscroll{overflow-x:auto}
.cg-table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
.cg-table th,.cg-table td{padding:0 12px;height:var(--cg-row-h);text-align:left;white-space:nowrap;border-bottom:1px solid var(--cg-row-line);background:var(--cg-surf)}
.cg-table td+td,.cg-table th+th{border-left:1px solid var(--cg-col-line)}
.cg-table th{background:var(--cg-th-bg);color:var(--cg-sub);font-weight:700;font-size:12.5px;height:40px;cursor:pointer;user-select:none}
.cg-table tr:hover td{background:var(--cg-row-hover)}
.cg-table .n{text-align:right;font-variant-numeric:tabular-nums}
.cg-table .cg-fix0{position:sticky;left:0;z-index:2;width:56px;text-align:center}          /* 체크칸 */
.cg-table .cg-fix1{position:sticky;left:56px;z-index:2;font-weight:700;box-shadow:6px 0 6px -6px #0B254530} /* 이름 칸 */
.cg-check{width:24px;height:24px;accent-color:var(--cg-blue);cursor:pointer}
.cg-pager{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;font-size:13px;color:var(--cg-sub)}
.cg-pager select,.cg-pager button{height:34px;border-radius:8px;border:1px solid var(--cg-line);background:var(--cg-surf);font:inherit;color:var(--cg-ink)}
.cg-pager button.on{background:var(--cg-blue);color:#fff;border-color:var(--cg-blue)}

/* 상태 알약 */
.cg-pill{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:700}
.cg-pill.run{background:var(--cg-run-bg);color:var(--cg-run)}
.cg-pill.done{background:var(--cg-done-bg);color:var(--cg-done)}
.cg-pill.chk{background:var(--cg-chk-bg);color:var(--cg-chk)}
.cg-pill.stop{background:var(--cg-stop-bg);color:var(--cg-stop)}

/* 접힌 도움 카드 */
.cg-help{background:var(--cg-surf);border-radius:var(--cg-r-card);padding:0 16px}
.cg-help summary{cursor:pointer;height:46px;display:flex;align-items:center;font-size:14px;font-weight:700;color:var(--cg-sub)}
.cg-help p{margin:0 0 14px;font-size:13.5px;color:var(--cg-sub);line-height:1.6}

/* 가운데 팝업 (브라우저 기본 경고창 대신) */
.cg-dim{position:fixed;inset:0;background:#0B254566;display:grid;place-items:center;padding:16px;z-index:50}
.cg-modal{background:#fff;border-radius:18px;padding:22px;width:min(400px,100%);display:flex;flex-direction:column;gap:12px}
.cg-modal h3{margin:0;font-size:18px}
.cg-modal dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;background:var(--cg-bg);border-radius:12px;padding:12px 14px}
.cg-modal dt{color:var(--cg-sub)} .cg-modal dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.cg-modal .row{display:flex;gap:8px;justify-content:flex-end}

/* 좁은 화면 (폰) */
@media (max-width:600px){
  :root{--cg-ctl-h:42px}
  .cg-nums{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cg-num strong{font-size:24px}
}
/* ▲ [가-1] 끝 ▲ */

/* ▼ [가-2] 05_차곳간_공통_E안_추가분.css 그대로 ▼ */
/* =========================================================
   차곳간 공통 E안 — 추가분 (체크 · 워시 · 관리 공통)
   - 02_차곳간_공통_E안_스타일.css 바로 아래에 이어 붙입니다.
   - 02번에 없던 부품만 있습니다: 메뉴 · 홈 화면 · 표 열 너비 · 창 3종.
   - 색 · 크기는 02번의 --cg-* 변수만 씁니다. 색 값을 새로 쓰지 않습니다.
   ========================================================= */

/* ---------- 02번 부품 보충 ---------- */
.cg-find{width:220px}                    /* 도구줄 «표에서 찾기» 칸 */
.cg-sp{flex:1}                           /* 도구줄 칩과 단추 사이 빈칸 — 단추는 늘 오른쪽 끝 */
.cg-tabs::-webkit-scrollbar{display:none}
.cg-field{display:inline-flex;align-items:center;gap:6px}
.cg-field input{border:0;font:inherit;background:transparent;color:inherit;min-width:0}
.cg-me{text-align:left;position:relative}
.cg-pager button{min-width:34px;cursor:pointer}
.cg-pager select{cursor:pointer}

/* ---------- 스크롤 규칙 (모든 제품 같음) ----------
   ① 세로 스크롤은 페이지 하나뿐
   ② 탭 줄(☰ 전체 메뉴 + 맨 위 탭)은 화면 위에 붙어 있음 — 머리말은 같이 올라감
   ③ 맨 위 탭 · 안쪽 작은 탭은 옆으로 밀림 (스크롤 막대 안 보임)
   ④ 표가 넓으면 표 상자 안에서만 옆으로 밀림 — 이름 칸은 왼쪽에 붙어 있음
   ⑤ 전체 메뉴 판 · 창은 그 안에서만 스크롤, 뒤 페이지는 멈춤
   ⑥ 메뉴를 바꾸면 맨 위로, 표 쪽을 넘기면 표 머리로 (스크립트가 함) */
.cg-navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--cg-surf);
  box-shadow:0 1px 0 var(--cg-row-line)}
.cg-tscroll{scrollbar-width:thin}
.cg-allmenu{max-height:calc(100vh - 140px);overflow:auto;overscroll-behavior:contain}
.cg-modal{max-height:calc(100vh - 32px);overflow:auto;overscroll-behavior:contain}
html.cg-lock{overflow:hidden}

/* ---------- 제품 바꾸기 (한 계정이 여러 제품을 쓸 때만 보임) ---------- */
.cg-hdr{z-index:25}
.cg-prod{margin-left:6px;height:24px;padding:0 9px;border-radius:999px;border:1px solid #ffffff40;background:#ffffff1A;
  color:#fff;font:inherit;font-size:12px;font-weight:700;cursor:pointer;vertical-align:2px}
.cg-proddrop{position:absolute;left:18px;top:calc(100% - 4px);z-index:30;background:var(--cg-surf);color:var(--cg-ink);
  border-radius:14px;box-shadow:0 10px 30px #0B25452E;padding:8px;width:280px;display:flex;flex-direction:column}
.cg-proddrop button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;font:inherit;
  padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--cg-ink)}
.cg-proddrop button:hover{background:var(--cg-row-hover)}
.cg-proddrop button.on{background:var(--cg-tab-on)}
.cg-proddrop .cg-ci{width:30px;height:30px;font-size:13px}
.cg-proddrop b{display:block;font-size:14px}
.cg-proddrop small{display:block;font-size:12px;color:var(--cg-sub)}

/* ---------- 메뉴 ①  맨 위 탭 앞 «☰ 전체 메뉴» ---------- */
.cg-tab.cg-all{color:var(--cg-ink);font-weight:700}
.cg-tabsep{flex:none;width:1px;margin:8px 6px;background:var(--cg-line)}

/* ---------- 메뉴 ②  전체 메뉴 판 (모든 화면을 한 판에 · 메뉴 찾기) ---------- */
.cg-allwrap{position:relative;height:0}
.cg-allmenu{position:absolute;left:0;right:0;top:0;z-index:20;background:var(--cg-surf);
  border-top:1px solid var(--cg-row-line);padding:16px 18px 20px;box-shadow:0 14px 24px -14px #0B254540}
.cg-allmenu .cg-field{width:100%;max-width:360px}
.cg-allgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px 16px;margin-top:14px}
.cg-allgrid h4{margin:0 0 6px;padding:0 8px;font-size:13px;color:var(--cg-sub);font-weight:700}
.cg-allgrid button{display:block;width:100%;text-align:left;border:0;background:transparent;font:inherit;
  font-size:14px;color:var(--cg-ink);padding:7px 8px;border-radius:8px;cursor:pointer}
.cg-allgrid button:hover,.cg-allgrid button.on{background:var(--cg-tab-on);color:var(--cg-blue)}
.cg-allgrid mark{background:var(--cg-chk-bg);color:inherit;border-radius:3px}
.cg-allnone{margin:14px 8px 0;color:var(--cg-sub);font-size:14px}

/* ---------- 메뉴 ③  제목 위 길잡이 «묶음 ›» ---------- */
.cg-crumb{font-size:12.5px;color:var(--cg-sub);margin:0 0 2px;font-weight:500}

/* ---------- 메뉴 ④  화면 안쪽 작은 탭 (이름 = 그 화면 제목) — 맨 위 탭처럼 옆으로 밀림 ---------- */
.cg-subtabs{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.cg-subtabs::-webkit-scrollbar{display:none}
.cg-subtab{flex:none}
.cg-subtab{height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--cg-line);background:var(--cg-surf);
  font:inherit;font-size:13px;cursor:pointer;color:var(--cg-sub)}
.cg-subtab.on{background:var(--cg-tab-on);color:var(--cg-blue);border-color:transparent;font-weight:700}

/* ---------- 메뉴 ⑤  사람 단추 ▾ 펼침 (마이페이지 · 요금제 · 휴지통 · 화면 · 배치 · 로그아웃) ---------- */
.cg-hdr{position:relative}
.cg-badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--cg-stop);color:#fff;font-size:11px;font-weight:700;font-style:normal}
.cg-me .cg-badge{position:absolute;top:-5px;left:20px}
.cg-medrop{position:absolute;right:18px;top:calc(100% - 4px);z-index:30;background:var(--cg-surf);color:var(--cg-ink);
  border-radius:14px;box-shadow:0 10px 30px #0B25452E;padding:8px;min-width:210px;display:flex;flex-direction:column}
.cg-medrop button{display:flex;align-items:center;gap:6px;text-align:left;border:0;background:transparent;font:inherit;
  font-size:14px;padding:10px 12px;border-radius:8px;cursor:pointer;color:var(--cg-ink)}
.cg-medrop button:hover{background:var(--cg-row-hover)}
.cg-medrop hr{border:0;border-top:1px solid var(--cg-row-line);margin:4px 0}

/* ---------- 표 — 열 너비를 모든 표에서 같게 ----------
   열 차례: ☐ → 이름(고정) → 구분 번호 → 내용 → 날짜 → 금액 → 상태          */
.cg-table{table-layout:fixed;min-width:900px}
.cg-table col.k-chk{width:56px}
.cg-table col.k-name{width:180px}
.cg-table col.k-id{width:130px}
.cg-table col.k-date{width:96px}
.cg-table col.k-money{width:130px}

/* ⑧ 접힌 도움 카드 */
function cgHelp(title, text){
  return '<details class="cg-help"><summary>도움말 ▸ '+esc(title)+' 화면 쓰는 법</summary><p>'+esc(text)+'</p></details>';
}
/* 홈 (워시 · 체크가 쓰는 배치 그대로) */
function cgHome(P){
  var first=new Date(2026,9,1).getDay(), today=13, cell="";
  for(var i=0;i<first;i++) cell+='<b class="off"></b>';
  for(var n=1;n<=31;n++){
    var ev=P.days[n]||[], cls=(n===today?" today":"")+(((first+n-1)%7===0)?" sun":"");
    cell+='<b class="'+cls.trim()+'">'+n+(n===today?'<span class="td">오늘</span>':'')
        + (ev[0]?'<i>'+esc(ev[0])+'</i>':'') + (ev[1]?'<i class="g">'+esc(ev[1])+'</i>':'') + '</b>';
  }
  var LBL={run:"하는 중",done:"끝남",chk:"확인 필요",stop:"막힘"};
  return '<div class="cg-homegrid">'
    + '<div class="cg-hgL"><div class="cg-card"><h3>'+esc(P.cal)+' <span style="font-size:12.5px;color:var(--cg-sub);font-weight:500">2026년 10월</span></h3>'
    +   '<div class="cg-dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>'
    +   '<div class="cg-cal">'+cell+'</div></div></div>'
    + '<div class="cg-hgR">'
    +   '<div class="cg-card"><h3>오늘 할 일<button class="cg-more">할 일 '+P.todoN+'건 모두 보기</button></h3>'
    +     '<div class="cg-todolist">'+P.todos.map(function(t){
            return '<div>'+esc(t[0])+'<span class="cg-pill '+t[1]+'">'+LBL[t[1]]+'</span></div>'; }).join("")+'</div></div>'
    +   '<div class="cg-card"><h3>'+esc(P.cash)+'</h3><div class="cg-big"><b>'+esc(P.cash1)+'</b><span>원</span></div>'
    +     '<div style="margin-top:6px;font-size:13px;color:var(--cg-sub)">'+esc(P.cash2)+'</div></div>'
    +   '<div class="cg-card"><h3>'+esc(P.job)+'</h3><div class="cg-rows">'+P.jobs.map(function(j){
          return '<div><span>'+esc(j[0])+'</span><span class="w">'+esc(j[1])+'</span><span class="n">'+esc(j[2])+'원</span></div>'; }).join("")+'</div></div>'
    + '</div></div>';
}
/* 아직 그림을 안 넣은 화면 — 자리만 */
function cgPlace(name){
  var o=null; (PRODUCTS[app].orig||[]).forEach(function(x){ if(x[1]===name) o=x; });
  return '<div class="cg-card"><h3>«'+esc(name)+'» 화면</h3>'
    + '<p class="dev-p">'+(o&&o[2] ? '<b>지금 «'+esc(o[0])+'»</b> — '+esc(o[2]) : '이름 · 자리 모두 지금 그대로입니다.')+'</p>'
    + '<p class="dev-p" style="margin:0">지금 화면의 내용 · 단추 · 문구를 그대로 옮기고, 모양만 이 기준틀로 바꿉니다. '
    + '기준틀에는 홈 · 대표 목록 화면 · 세금계산서만 그려 두었어요.</p></div>';
}

/* ─── 그리기 ─── */
function draw(keepScroll){
  var P=PRODUCTS[app], M=P.menu;
  if(g>=M.length) g=0;
  var G=M[g]; if(s>=G[1].length) s=0;
  var S=G[1][s], name=S[0], key=S[1];
  st={q:"",st:"",k:0,dir:1,size:10,page:1,sel:{}};
  cp = guide ? P.page.work : (key ? P.page[key] : null);

  var html = cgHead(P) + cgNav(M) + '<main class="cg-body">';
  if(guide) html += devGuide();
  else{
    html += cgTitle(G[0], name, key ? cp.desc : "«"+name+"» 화면 자리예요.") + cgSubTabs(G[1].map(function(x){ return x[0]; }), s);
    if(key==="home") html += cgTodo(cp) + cgHome(cp)
        + cgHelp("홈","달력에서 날을 누르면 그 날 일이 가운데 창에 뜹니다. 할 일은 오늘 것 3개만 보이고, 나머지는 «모두 보기»를 누르면 전부 나옵니다.");
    else if(key==="time") html += cgTodo(cp) + cgTool(cp) + cgNums(cp) + cgTimetable(cp) + cgHelp(name, cp.help);
    else if(key) html += cgTodo(cp) + cgTool(cp) + cgNums(cp) + cgTable(cp) + cgHelp(name, cp.help);
    else html += cgPlace(name) + cgHelp(name, "지금 쓰는 도움말 글을 그대로 옮깁니다.");
  }
  $("app").innerHTML = html + '</main>';
  document.title = "차곳간 "+P.label+" — "+(guide?"기준틀 안내":name);
  wireShell();
  if(!guide && key==="time"){ wireTool(drawTT); drawTT(); }
  else if(!guide && key && key!=="home"){ wireTable(); wireTool(drawTable); drawTable(); }
  if(guide) wireGuide();
  /* 스크롤 규칙 ⑥ — 메뉴를 바꾸면 맨 위로 · 고른 탭은 보이게 */
  if(!keepScroll) window.scrollTo(0,0);
  each(".cg-tab.on, .cg-subtab.on", function(t){ t.scrollIntoView({block:"nearest", inline:"nearest"}); }, $("app"));
}

function wireShell(){
  var A=$("app");
  each("[data-g]", function(b){ b.onclick=function(){ g=+b.getAttribute("data-g"); s=0; guide=false; closeAll(); draw(); }; }, A);
  each("[data-s]", function(b){ b.onclick=function(){ s=+b.getAttribute("data-s"); draw(); }; }, A);
  $("allBtn").onclick=function(){ var o=!open.all; closeAll(); open.all=o; allQ=""; draw(true); if(o) $("allQ").focus(); };
  $("meBtn").onclick=function(){ var o=!open.me; closeAll(); open.me=o; draw(true); };
  if($("prodBtn")) $("prodBtn").onclick=function(){ var o=!open.prod; closeAll(); open.prod=o; draw(true); };
  each("[data-me]", function(b){ b.onclick=function(){ closeAll(); draw(true); }; }, A);
  each("[data-prod]", function(b){ b.onclick=function(){ var k=curKey()||"work"; app=b.getAttribute("data-prod"); guide=false; closeAll(); goKey(k); draw(); }; }, A);
  if(open.all){
    var q=$("allQ");
    q.oninput=function(){ allQ=q.value; var p=q.selectionStart; draw(true); var n=$("allQ"); n.focus(); n.setSelectionRange(p,p); };
    each("[data-go]", function(b){ b.onclick=function(){ var p=b.getAttribute("data-go").split(","); g=+p[0]; s=+p[1]; guide=false; closeAll(); draw(); }; }, A);
    each("[data-meitem]", function(b){ b.onclick=function(){ closeAll(); open.me=true; draw(true); }; }, A);
  }
}
function closeAll(){ open.all=open.me=open.prod=false; }
/* 펼친 것은 바깥을 누르면 닫힘 */
document.addEventListener("click", function(e){
  if(!(open.all||open.me||open.prod)) return;
  if(e.target.closest(".cg-allmenu,.cg-medrop,.cg-proddrop,#allBtn,#meBtn,#prodBtn")) return;
  closeAll(); draw(true);
});

/* ─── 표 ─── */
function idx(P,k){ return P.kinds.indexOf(k); }
function list(){
  var P=cp, si=idx(P,"state"), q=st.q.trim();
  var r=P.rows.map(function(x,i){ return {x:x,i:i}; }).filter(function(o){
    return (!st.st || o.x[si]===st.st) && (!q || o.x.join(" ").indexOf(q)>=0); });
  r.sort(function(a,b){ var A=a.x[st.k],B=b.x[st.k]; return (A>B?1:A<B?-1:0)*st.dir; });
  return r;
}
function selected(){ return Object.keys(st.sel).filter(function(k){ return st.sel[k]; }).map(Number); }
function drawTable(){
  var P=cp;
  $("th").innerHTML = '<th class="cg-fix0"><input type="checkbox" class="cg-check" id="all" aria-label="모두 고르기"></th>'
    + P.cols.map(function(t,k){ var kind=P.kinds[k];
        return '<th data-k="'+k+'" class="'+(kind==="name"?'cg-fix1 ':'')+(kind==="money"?'n':kind==="state"?'c':'')+'" aria-sort="'+(st.k===k?(st.dir>0?'ascending':'descending'):'none')+'">'+esc(t)
             + ' <span style="opacity:'+(st.k===k?1:.35)+'">'+(st.k===k?(st.dir>0?'▲':'▼'):'↕')+'</span></th>'; }).join("");
  var r=list(), pages=Math.max(1,Math.ceil(r.length/st.size));
  if(st.page>pages) st.page=pages;
  var v=r.slice((st.page-1)*st.size, st.page*st.size);
  $("tb").innerHTML = v.map(function(o){
    return '<tr><td class="cg-fix0"><input type="checkbox" class="cg-check" data-i="'+o.i+'"'+(st.sel[o.i]?' checked':'')+' aria-label="'+esc(o.x[0])+' 고르기"></td>'
      + o.x.map(function(val,k){ var kind=P.kinds[k];
          if(kind==="state") return '<td class="c"><span class="cg-pill '+(PILL[val]||"run")+'">'+esc(val)+'</span></td>';
          if(kind==="money") return '<td class="n">'+won(val)+'원</td>';
          if(kind==="name")  return '<td class="cg-fix1"><button class="cg-link" data-row="'+o.i+'">'+esc(val)+'</button></td>';
          return '<td>'+esc(val)+'</td>'; }).join("") + '</tr>'; }).join("")
    || '<tr><td colspan="'+(P.cols.length+1)+'" style="text-align:center;color:var(--cg-sub)">찾는 것이 없어요</td></tr>';
  $("cnt").textContent = "총 "+r.length+"건";
  $("pg").innerHTML = '<button data-p="1">처음</button> <button data-p="'+Math.max(1,st.page-1)+'">이전</button>'
    + '<span style="padding:0 8px">'+st.page+' / '+pages+'</span>'
    + '<button data-p="'+Math.min(pages,st.page+1)+'">다음</button> <button data-p="'+pages+'">맨뒤</button>';
  $("all").checked = v.length>0 && v.every(function(o){ return st.sel[o.i]; });
  var n=selected().length;
  P.btns.forEach(function(b,i){ if(!b.sel) return; var el=$("app").querySelector('[data-b="'+i+'"]');
    el.disabled=!n; el.textContent = n ? b.t+" ("+n+")" : b.t; });
  each("[data-row]", function(b){ b.onclick=function(){ openSheet(+b.getAttribute("data-row")); }; }, $("tb"));
}
function wireTable(){
  var A=$("app");
  $("th").onclick=function(e){ var t=e.target.closest("th[data-k]"); if(!t) return;
    var k=+t.getAttribute("data-k"); st.dir=(st.k===k)?-st.dir:1; st.k=k; drawTable(); };
  $("tb").onchange=function(e){ var i=e.target.getAttribute("data-i"); if(i==null) return; st.sel[i]=e.target.checked; drawTable(); };
  $("th").onchange=function(e){ if(e.target.id!=="all") return;
    list().slice((st.page-1)*st.size, st.page*st.size).forEach(function(o){ st.sel[o.i]=e.target.checked; }); drawTable(); };
  /* 스크롤 규칙 ⑥ — 쪽을 넘기면 표 머리로 */
  $("pg").onclick=function(e){ var b=e.target.closest("button"); if(!b) return; st.page=+b.getAttribute("data-p"); drawTable();
    var t=$("tcard").getBoundingClientRect(); if(t.top<0) $("tcard").scrollIntoView({block:"start"}); };
  $("sz").onchange=function(e){ st.size=+e.target.value; st.page=1; drawTable(); };
}
/* 도구줄 — 찾기 · 상태 칩 · 단추. 표와 타임테이블이 같이 씀 */
function wireTool(redraw){
  var A=$("app");
  $("q").oninput=function(e){ st.q=e.target.value; st.page=1; redraw(); };
  each(".cg-chip", function(c){ c.onclick=function(){
    each(".cg-chip", function(x){ x.classList.toggle("on", x===c); }, A);
    st.st=c.getAttribute("data-st"); st.page=1; redraw(); }; }, A);
  each("[data-b]", function(el){ el.onclick=function(){
    var b=cp.btns[+el.getAttribute("data-b")];
    if(b.ask) openConfirm(b, selected()); else if(b.form) openForm(b.form); }; }, A);
}

/* ─── 창 3종 — 모두 같은 틀: 제목 → 내용 → 오른쪽 아래 [취소][동작] ─── */
var lastFocus=null;
function openWin(kind, html){
  lastFocus=document.activeElement;
  var d=$("dim");
  d.className="cg-dim"+(kind==="sheet"?" side":kind==="form"?" low":"");
  d.innerHTML=html; d.hidden=false;
  document.documentElement.classList.add("cg-lock");          /* 스크롤 규칙 ⑤ — 뒤 페이지 멈춤 */
  each("[data-close]", function(b){ b.onclick=closeWin; }, d);
  var f=d.querySelector("input,[data-first]"); if(f) f.focus();
}
function closeWin(){
  $("dim").hidden=true; $("dim").innerHTML="";
  document.documentElement.classList.remove("cg-lock");
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
$("dim").addEventListener("click", function(e){ if(e.target===$("dim")) closeWin(); });
document.addEventListener("keydown", function(e){
  if(e.key!=="Escape") return;
  if(!$("dim").hidden) closeWin(); else if(open.all||open.me||open.prod){ closeAll(); draw(true); } });

function openConfirm(b, rows){
  var P=cp, mi=P.kinds.lastIndexOf("money");
  var sel=rows.map(function(i){ return P.rows[i]; });
  var who=sel.map(function(x){ return x[0]; }).filter(function(v,i,a){ return a.indexOf(v)===i; });
  openWin("confirm", '<div class="cg-modal" role="dialog" aria-modal="true" aria-labelledby="wt">'
    + '<h3 id="wt">'+esc(b.ask)+'할까요?</h3>'
    + '<dl><dt>'+esc(P.whoLabel||"누구에게")+'</dt><dd>'+esc(who.slice(0,3).join(", "))+(who.length>3?" 외 "+(who.length-3)+"곳":"")+'</dd>'
    + '<dt>총 몇 건</dt><dd>'+sel.length+'건</dd>'
    + '<dt>총 얼마</dt><dd>'+won(sel.reduce(function(a,x){ return a+(Number(x[mi])||0); },0))+'원</dd></dl>'
    + '<div class="row"><button class="cg-btn" data-close>취소</button><button class="cg-btn pri" data-close data-first>'+esc(b.ask)+'</button></div></div>');
}
function openForm(title, vals){
  var P=cp;
  var f=P.cols.map(function(c,k){ var kind=P.kinds[k]; if(kind==="state") return "";
    var v=vals ? vals[k] : "", type=kind==="date"?"date":kind==="time"?"time":kind==="money"?"number":"text";
    if(kind==="date") v="2026-10-13";
    return '<label>'+esc(c)+'<input class="cg-field" type="'+type+'" value="'+esc(v)+'" placeholder="'+esc(kind==="money"?"0":P.rows[0][k])+'"></label>'; }).join("");
  openWin("form", '<div class="cg-modal form" role="dialog" aria-modal="true" aria-labelledby="wt">'
    + '<button class="cg-x" data-close aria-label="닫기">✕</button>'
    + '<h3 id="wt">'+esc(title)+'</h3><p class="cg-mdesc">칸을 채우고 «저장»을 누르세요.</p>'
    + '<div class="cg-fgrid">'+f+'</div>'
    + '<div class="row"><button class="cg-btn" data-close>취소</button><button class="cg-btn pri" data-close>저장</button></div></div>');
}
function openSheet(i){
  var P=cp, x=P.rows[i], si=idx(P,"state");
  openWin("sheet", '<div class="cg-modal sheet" role="dialog" aria-modal="true" aria-labelledby="wt">'
    + '<button class="cg-x" data-close aria-label="닫기">✕</button>'
    + '<h3 id="wt">'+esc(x[0])+'</h3>'
    + '<div><span class="cg-pill '+(PILL[x[si]]||"run")+'">'+esc(x[si])+'</span></div>'
    + '<dl>'+P.cols.map(function(c,k){ if(k===si) return "";
        return '<dt>'+esc(c)+'</dt><dd>'+(P.kinds[k]==="money"?won(x[k])+"원":esc(x[k]))+'</dd>'; }).join("")+'</dl>'
    + '<div class="row"><button class="cg-btn" data-close data-first>닫기</button><button class="cg-btn pri" id="editBtn">고치기</button></div></div>');
  $("editBtn").onclick=function(){ openForm(x[0]+" 고치기", x); };
}

/* ─── 바로 가기 ─── */
function goKey(key){
  var M=PRODUCTS[app].menu;
  for(var i=0;i<M.length;i++) for(var j=0;j<M[i][1].length;j++) if(M[i][1][j][1]===key){ g=i; s=j; return; }
  g=0; s=0;
}
function curKey(){ var M=PRODUCTS[app].menu, S=M[g] && M[g][1][s]; return S ? S[1] : null; }

/* ═══════════════════════════════════════════════════════════════════
   [라] 기준틀 안내 — 만드는 사람만 봄 (DEV=false 면 안 보임)
   ═══════════════════════════════════════════════════════════════════ */

var ASKS = [
  "<b>정해 주신 것 — 반영함</b><br>· 워시 «현장 화면» → 머리말 맨 앞 단추 (메뉴에서 뺌). «자재»는 원래대로 맨 위 탭<br>· 탭 차례는 <b>지금 쓰는 일 순서 그대로</b> — 체크 «정산 기록»은 원래 3번째, 워시 «매출»은 «일감» 앞, 관리 «계정»은 «업체» 앞<br>· 체크 «알림 소리» → <b>«알람 소리»</b> (메뉴 · 화면 제목 모두)<br>· 파킹 = 주차 관리, 스튜디오 = 촬영장 예약 · 타임테이블 로 새로 짬",
  "<b>③ 다시 여쭙니다 — 설정 안에 있는 세 가지, 옮길까요?</b> (지금은 <b>그대로</b> 두었습니다)<br>" +
  "· <b>자료 올리기</b>(체크, 엑셀 올리는 곳) — 지금 «설정» 안. 매일 일 시작 · 끝에 쓰는 거라 «매출» 탭 안으로 옮기면 찾기 쉬움<br>" +
  "· <b>휴지통</b> — 지금 «설정» 안에도 있고 머리말 사람 단추 안에도 있음. 같은 게 두 곳 → 사람 단추 한 곳만 남길지<br>" +
  "· <b>도움말</b>(체크) — 지금 «설정» 안에도 있고 머리말 «도움말» 단추도 있음. 같은 게 두 곳 → 머리말 한 곳만 남길지<br>" +
  "→ <b>«셋 다 옮겨» / «그대로» / 하나씩</b> 말씀만 주세요.",

];
function devGuide(){
  var h = cgTitle("", "기준틀 안내", "모든 제품이 따르는 규칙과, 새 제품을 넣는 법이에요. 실제 배포 땐 이 단추가 안 보입니다.")

                  "묶음을 누르면 <b>안쪽 작은 탭</b>에 그 묶음의 화면이 다 보임","<b>☰ 전체 메뉴</b> 한 판에 모든 화면 + 메뉴 찾기","제목 위 <b>«묶음 ›»</b> 길잡이"])
    + rule("워딩",["<b>메뉴 이름 = 화면 제목</b>, 글자까지 같게","화면 안 문구 · 설명은 <b>지금 그대로</b>","같은 말은 한 뜻만 — «알림»은 묶음 이름으로만",
                  "같은 것은 한 곳만 — 휴지통 · 도움말은 머리말에만","단추 글자에 그림 문자 안 씀 · 단추는 하는 일을 말함 (예: «주소 복사»)"])
    + rule("표",["열 차례: ☐ → <b>이름</b> → 구분 번호 → 내용 → <b>날짜</b> → <b>금액</b> → <b>상태</b>","열 너비 고정: 체크칸 56 · 이름 180 · 번호 130 · 날짜 96 · 금액 130 · 상태 104",
                "금액 오른쪽 · 상태 가운데 · 나머지 왼쪽","머리줄 40 · 줄 44 · 체크칸 24 · 보기 5/10/20/30/50","파란 단추는 <b>한 화면에 하나</b> · 이름을 누르면 자세히 창","<b>타임테이블</b>도 같은 카드 · 시간 칸 왼쪽 고정 · 칸 색 = 상태 색"])
    + rule("창",["모든 창: <b>제목 → 내용 → 오른쪽 아래 [취소] [동작]</b>","확인 창 400 · 입력 창 560 · 자세히 창 오른쪽 520","되돌리기 어려운 일은 «누구에게 · 총 몇 건 · 총 얼마»",
                "바깥 회색 · Esc · ✕ 로 닫힘","폰에서는 입력 · 자세히 창이 아래에서 올라옴"])
    + rule("스크롤",["세로 스크롤은 <b>페이지 하나뿐</b>","<b>탭 줄은 화면 위에 붙어 있음</b> (머리말은 같이 올라감)","맨 위 탭 · 안쪽 작은 탭은 옆으로 밀림",
                    "넓은 표는 <b>표 상자 안에서만</b> 옆으로 · 이름 칸은 왼쪽에 붙음","창 · 전체 메뉴가 열리면 뒤 페이지는 멈춤","메뉴를 바꾸면 맨 위로 · 쪽을 넘기면 표 머리로"])
    + rule("화면 일곱 칸",["① 머리말 (사람 단추 ▾ 안에 마이페이지 · 요금제 · 휴지통)","② 묶음 › 제목 + 설명 한 줄 (+ 안쪽 작은 탭)","③ 할 일 띠 + [해결하러 가기]",
                    "④ 도구줄 — 찾기 · 날짜 · 상태 칩 · 단추 (43px)","⑤ 숫자 칸 4개 → ⑥ 표 → ⑦ 접힌 도움 카드"])
    + '</div>';
  if(gs===1) h += devWords();
  if(gs===2) h += '<div class="cg-card">'+ASKS.map(function(a){ return '<div class="dev-ask">'+a+'</div>'; }).join("")+'</div>';
  if(gs===3) h += '<div class="cg-card"><h3>새 제품 넣는 법 (예: 파킹)</h3>'
    + '<p class="dev-p"><b>1.</b> 이 파일 [다] 제품 등록부 맨 아래 «새 제품 틀» 덩어리를 복사해 붙입니다.<br>'
    + '<b>2.</b> <code>label · desc · sub · biz · hbtns · menu · page</code> 의 글만 바꿉니다. 메뉴는 8묶음 이하, <b>그 업체가 일하는 순서</b>대로.<br>'
    + '<b>3.</b> <code>ACCOUNT.products</code> 에 새 이름을 넣으면 머리말 «제품 ▾»에 나타납니다. (나중엔 서버가 계정별로 내려줌)<br>'
    + '<b>4.</b> [가] 공통 스타일 · [나] 공통 엔진은 <b>건드리지 않습니다.</b> 모양 · 스크롤 · 표 · 창은 저절로 같아집니다.</p>'
    + '<pre class="dev-pre">parking:{\n  label:<b>"파킹"</b>, desc:<b>"주차 · 보관"</b>, ci:"차",\n  sub:<b>"주차·보관 관리 · 파킹 v0.1 · "</b>+UI_VER,\n'
    + '  biz:{ name:<b>"업체 이름"</b>, no:"000-00-00000", ceo:"대표" },\n'
    + '  menu:[ ["홈",[["홈","home"]]],\n         ["일감",[["주차 현황","work"],["입출차 기록"]]],\n         … 8묶음 … ],\n'
    + '  page:{ home:{…}, work:{ cols:[…], kinds:["name","id","text","text","date","money","state"], rows:[…] } }\n}</pre></div>';
  if(gs===4) h += '<div class="cg-card"><h3>창 3종 — 지금 제품('+esc(PRODUCTS[app].label)+')의 대표 목록으로 열어 봅니다</h3>'
    + '<p class="dev-p">세 창 모두 «제목 → 내용 → 오른쪽 아래 [취소] [동작]» 차례 · 단추 높이 43 · 둥글기 18 이 같습니다.</p>'
    + '<div class="cg-tool"><button class="cg-btn" data-win="confirm">확인 창 (400)</button><button class="cg-btn" data-win="form">입력 창 (560)</button><button class="cg-btn" data-win="sheet">자세히 창 (오른쪽 520)</button></div></div>';
  return h;
}
function rule(t, items){ return '<div class="cg-card"><h3>'+esc(t)+'</h3><ol>'+items.map(function(x){ return '<li>'+x+'</li>'; }).join("")+'</ol></div>'; }
function devWords(){
  var rows="", sum="";
  Object.keys(PRODUCTS).forEach(function(k){
    var P=PRODUCTS[k]; if(!P.orig.length) return;
    var have={}, where={};
    P.menu.forEach(function(G){ have[G[0]]=1; where[G[0]]="맨 위 «"+G[0]+"»";
      G[1].forEach(function(S){ have[S[0]]=1; where[S[0]]=(G[0]===S[0]?"맨 위 «"+G[0]+"»":G[0]+" › "+S[0]); }); });
    Object.keys(MOVED).forEach(function(m){ have[m]=1; where[m]=MOVED[m]; });
    (P.hbtns||[]).forEach(function(h){ have[h]=1; where[h]="머리말 맨 앞 «"+h+"» 단추"; });
    var miss=P.orig.filter(function(o){ return !have[o[1]]; });
    sum+='<span class="cg-pill '+(miss.length?'stop':'done')+'">'+esc(P.label)+' — 원래 메뉴 '+P.orig.length+'개 · 맨 위 탭 '+P.menu.length+'개 · 빠진 것 '+miss.length+'개'
       +(miss.length?' ('+esc(miss.map(function(o){return o[0];}).join(", "))+')':'')+'</span>';
    P.orig.forEach(function(o){ if(o[0]===o[1] && !o[2]) return;
      rows+='<tr><td>'+esc(P.label)+'</td><td>'+(o[0]!==o[1]?'<span class="old">'+esc(o[0])+'</span>':esc(o[0]))+'</td>'
          + '<td class="'+(o[0]!==o[1]?'new':'')+'">'+esc(where[o[1]]||o[1])+'</td><td>'+esc(o[2])+'</td></tr>'; });
  });
  return '<div class="dev-sum">'+sum+'</div>'
    + '<div class="cg-tcard"><div class="cg-tscroll"><table class="cg-table dev-words" style="table-layout:auto;min-width:760px">'
    + '<thead><tr><th style="cursor:default">제품</th><th style="cursor:default">지금</th><th style="cursor:default">새 자리 › 이름</th><th style="cursor:default">왜</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}
function wireGuide(){
  each("[data-gs]", function(b){ b.onclick=function(){ gs=+b.getAttribute("data-gs"); draw(); }; }, $("app"));
  each("[data-win]", function(b){ b.onclick=function(){ var w=b.getAttribute("data-win");
    if(w==="confirm") openConfirm(cp.btns.filter(function(x){ return x.ask; })[0]||{ask:"발급"}, [0,1,2]);
    if(w==="form") openForm((cp.btns.filter(function(x){ return x.form; })[0]||{form:"새로 적기 (예시)"}).form);
    if(w==="sheet") openSheet(0); }; }, $("app"));
}
$("devFab").hidden=!DEV;
$("devFab").onclick=function(){ guide=!guide; closeAll(); draw(); $("devFab").textContent = guide ? "화면으로 돌아가기" : "기준틀 안내"; };

/* 시작 */
draw();
</script>
